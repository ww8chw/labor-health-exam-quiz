度大於 80 μg/dL 為最佳確診」、「鉛相關之腸絞痛甚少發生於血鉛濃度低於 80 μg/dL」。檢查首選血中鉛（法定項目，反映近期一至兩個月的暴露），可輔以 ZPP、尿 ALA、血球計數看嗜鹼性彩點與小球性貧血。鑑別其他金屬：砷（尿中無機砷；感覺神經病變、皮膚病變、溶血性的砷化氫）、汞（尿汞或血汞；震顫、齒齦炎、腎病症候群）、鎘（尿鎘；腎小管、骨）。治療原則是移離暴露，症狀嚴重者用 CaNa2EDTA 或 DMSA 螯合。","dispute":"","review":{"key_points":["蓄電池廠＋==腹絞痛、便秘、疲倦==→查==血中鉛==","腸絞痛甚少 \u003c80 μg/dL；急性中毒確診血鉛 >80","砷→尿無機砷；乙基汞→血汞；無機汞→尿汞；鎘→尿鎘"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"鉛相關之腸絞痛甚少發生於血鉛濃度低於 80 μg/dL"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"曾有鉛腹絞痛被誤以為急性闌尾炎來處理"}],"note_ref":"二、鉛的毒性表現：血液、神經、腎臟、心血管"}},{"qid":"c07q11","q":"35 歲男性金屬碎片切割工人，近三個月反覆腹部絞痛，上、下消化道攝影均無異常。下列何項檢查最可能出現異常？","options":["尿中無機砷","肝功能","血中鉛","腹部 X 光"],"answer":2,"recon":"full","src":["114-02","114-03"],"optexp":["**不符合**：砷化氫中毒是急性血管內溶血（腹痛、血紅素尿、黃疸、急性腎衰竭三聯徵），發病在暴露後數小時內，不會以三個月反覆腹絞痛表現；慢性砷中毒則以皮膚與周邊神經病變為主。","**不符合**：肝功能異常不是鉛中毒的主要表現，也解釋不了反覆腹絞痛；有機溶劑急性肝傷害另有其指引。","**符合／正確（本題答案）**：切割、燒熔含鉛塗料或鉛合金的金屬會產生鉛燻煙（認定指引高度風險：金屬焊接／切割、焊接和切割塗鉛金屬），三個月反覆腹絞痛且上下消化道攝影正常，正是鉛絞痛的典型情境，血中鉛最可能異常。","**不符合**：腹部 X 光只在兒童吞食含鉛異物或油漆碎片時可見不透光影，成人職業性吸入暴露的腹部 X 光多無異常。"],"explanation":"本題考「不明原因反覆腹絞痛＋金屬切割工」要想到鉛。金屬碎片切割、燒熔、拆船與橋樑除漆都會使塗料或合金中的鉛在高溫下形成燻煙被吸入，是認定指引的高度風險職業。鉛絞痛的特徵：陣發性、瀰漫性腹痛，常伴便秘、食慾不振、口中金屬味，理學檢查腹部柔軟、無腹膜炎徵象，內視鏡與消化道攝影正常，曾有病人被當急性闌尾炎開刀；血鉛多在 80 μg/dL 以上（甚少低於 80），可合併貧血、嗜鹼性彩點、齒齦鉛線與血壓上升。114-03 回憶者主張此題是砷化氫（用於鍍鋅、焊接、冶金），但砷化氫是含砷金屬遇酸產生的氣體，造成的是暴露後數小時內的急性血管內溶血——腹痛、深色血尿（血紅素尿）、一至二天後黃疸、最後急性腎衰竭——是急症而非三個月的慢性腹絞痛，且指標為尿中砷而非肝功能；認定指引寫「有腹痛、血紅素尿及黃疸三大症狀時應強烈懷疑砷化氫」。因此本題以血中鉛為最可能異常的檢查。","dispute":"114-03 回憶者主張本題考的是砷化氫（arsine，用於鍍鋅、焊接、冶金）並答「尿總砷」，114-02 回憶則答血中鉛。依砷化氫認定參考指引，砷化氫中毒是急性血管內溶血，暴露後數小時出現腹痛、血紅素尿（深色血尿）、一至二天後黃疸、最後急性腎衰竭，不會以三個月反覆腹絞痛且消化道攝影正常的形式表現；而無機鉛認定指引明載鉛絞痛可被誤診為急性闌尾炎、腸絞痛多見於血鉛 >80 μg/dL，金屬切割燒熔是高度風險鉛作業。因此本題應選血中鉛。若題幹改為「金屬酸洗後數小時出現腹痛、血尿、黃疸」，才是砷化氫、應查尿中砷。","review":{"key_points":["金屬切割燒熔→鉛燻煙；==反覆腹絞痛＋消化道檢查正常→血鉛==","砷化氫＝急性血管內溶血三聯徵（腹痛、血紅素尿、黃疸）→急性腎衰竭，數小時內發病","鉛絞痛血鉛多 >80；可誤診為急性闌尾炎"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"焊接和切割塗鉛金屬"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"急性砷化氫暴露會導致血管內溶血"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"深色血尿，接著一、二天後就出現黃疸之症狀，最後急性腎衰竭"}],"note_ref":"二、鉛的毒性表現：血液、神經、腎臟、心血管"}},{"qid":"c07q12","q":"有關鉛之腎臟毒性，下列敘述何者錯誤？","options":["早期為可逆性近端腎小管功能障礙（Fanconi 型症候群）","晚期造成腎小管萎縮與間質性腎炎","可伴隨高血壓與痛風（saturnine gout）","典型表現為嚴重的腎病症候群與大量蛋白尿"],"answer":3,"recon":"rebuilt","src":["114-03"],"optexp":["**正確**：認定指引：鉛初期影響近端腎小管與亨利氏環，出現蛋白尿、糖尿、磷酸尿、胺基酸尿等腎小管功能障礙（Fanconi 型），急性或短期暴露以 EDTA 治療較有效，屬可逆。","**正確**：慢性鉛腎病變的特色是腎間質纖維化與腎小管萎縮，近端腎小管上皮細胞退化並出現嗜酸性核內包涵體，長期暴露（>10 年、血鉛 40–100 以上）者風險高，不可逆。","**正確**：長期暴露造成腎血管硬化並減少尿酸排泄，臨床產生腎衰竭、高血壓與痛風（saturnine gout，鉛中毒性痛風關節炎），認定指引明列於腎臟徵候。","**錯誤（本題答案）**：鉛腎病變是慢性間質性腎炎，蛋白尿輕至中度（分級指引以蛋白尿達二價 ≥100 mg/dL 為判定），不會以腎病症候群與大量蛋白尿表現；腎病症候群是無機汞（膜性腎絲球腎炎）的典型。"],"explanation":"本題考鉛的腎毒性三階段，並與汞的腎病變對照。第一階段（急性、可逆）：近端腎小管功能障礙，胺基酸尿、糖尿、磷酸鹽尿、蛋白尿（Fanconi 型症候群），嚴重時寡尿與急性腎衰竭，EDTA 螯合對此期較有效；第二階段（慢性）：腎間質纖維化、腎小管萎縮、腎血管硬化，近端腎小管上皮細胞粒線體腫大與嗜酸性核內包涵體，血鉛 40–100 μg/dL 以上與慢性腎病變有關，30 以下也可能影響腎功能（NTP：肌酸酐清除率與 GFR 降低的最低效應 20–30 μg/dL，血清肌酐上升 8–12），近端腎小管損傷甚少低於血鉛 100；第三階段（併發症）：尿酸排泄減少→痛風（saturnine gout）、高血壓、腎衰竭，不可逆。分級指引以「腎臟病變（如蛋白尿達二價 ≥100 mg/dL）」為第三、四級判定依據，法定檢查含尿蛋白與尿潛血。對照：無機汞主要影響近曲小管導致腎小管壞死，並可經免疫機轉造成膜性腎絲球腎炎→腎病症候群（大量蛋白尿、水腫）；鎘則是近端腎小管的低分子量蛋白尿（β2-microglobulin）與 Fanconi 症候群、骨軟化。","dispute":"","review":{"key_points":["鉛腎病：==早期近端腎小管（Fanconi 型，可逆）→晚期間質纖維化、腎小管萎縮（不可逆）==","併發==高血壓、痛風（saturnine gout）==、腎衰竭；蛋白尿輕至中度（判定值二價 ≥100 mg/dL）","==腎病症候群→無機汞（膜性腎絲球腎炎）==；β2-microglobulin 蛋白尿→鎘"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"初期影響近端腎小管及亨利氏環"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"長期暴露則造成腎間質纖維化、腎血管硬化而減少尿酸分泌，臨床上產生腎衰"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"主要影響近曲小管導致腎小管壞死，會產生蛋白尿及水腫、腎病症候群，也會導致免疫性腎絲球腎炎"}],"note_ref":"二、鉛的毒性表現：血液、神經、腎臟、心血管"}},{"qid":"c07q13","q":"下列何者不是鉛作業特殊健康檢查之法定項目？","options":["齒齦鉛緣有無與血液、消化、腎臟及神經系統之身體檢查","血球比容值、血色素及紅血球數","尿蛋白及尿潛血","尿中鉛"],"answer":3,"recon":"rebuilt","src":["113-4","114-04"],"optexp":["**正確（是法定項目）**：附表十第 5 項鉛作業第 (3) 目：齒齦鉛緣之有無與血液系統、消化系統、腎臟系統及神經系統之身體檢查。","**正確（是法定項目）**：第 (4) 目：血球比容值、血色素及紅血球數之檢查，用來偵測小球性低血色素貧血。","**正確（是法定項目）**：第 (5) 目：尿蛋白及尿潛血之檢查，對應鉛的腎小管與間質病變。","**錯誤（本題答案，不是鉛作業項目）**：鉛作業的生物偵測是第 (6) 目「血中鉛之檢查」；尿中鉛是第 6 項四烷基鉛作業的項目（115 年新版附表十改為「尿中鉛及尿液肌酸酐」）（變更作業者無須檢測），四烷基鉛第三、四級門檻為尿中鉛 ≥150 μg/L。"],"explanation":"本題考鉛作業特殊健檢的法定項目，並與四烷基鉛作業區分。附表十第 5 項鉛作業（體格檢查與健康檢查相同）：(1) 作業經歷、生活習慣及自覺症狀之調查；(2) 生育狀況與消化道症狀、心臟血管症狀及神經症狀等既往病史之調查；(3) 齒齦鉛緣之有無與血液系統、消化系統、腎臟系統及神經系統之身體檢查；(4) 血球比容值、血色素及紅血球數之檢查；(5) 尿蛋白及尿潛血之檢查；(6) 血中鉛之檢查。注意沒有白血球、沒有肝功能、沒有 ZPP、沒有尿鉛，血中鉛檢驗機構須取得第三者認證。第 6 項四烷基鉛作業：(1) 作業經歷調查；(2) 神經、精神及心臟血管疾病既往病史；(3) 神經、精神、心臟血管及皮膚之身體檢查；(4) 尿蛋白及尿潛血；(5) 尿中鉛檢查（變更作業者無須檢測）。四烷基鉛（四乙基鉛、四甲基鉛）脂溶性高、經皮吸收、通過血腦障壁，毒性以中樞神經精神症狀（失眠、惡夢、焦慮、妄想、抽搐）為主，PEL-TWA 0.075 mg/m3，分級第三、四級為中樞神經病變、精神異常、蛋白尿二價或尿中鉛 ≥150 μg/L。113-4、114-04 回憶版分別問「鉛作業檢查項目」與「不是鉛作業項目者」。","dispute":"","review":{"key_points":["鉛作業法定項目：==作業經歷、生育與消化道／心血管／神經病史、齒齦鉛緣與四系統身體檢查、Hct／Hb／RBC、尿蛋白尿潛血、血中鉛==","沒有 WBC、肝功能、ZPP、尿鉛","==四烷基鉛作業→尿中鉛==（第三級 ≥150 μg/L），以神經精神症狀為主，PEL 0.075 mg/m3"],"refs":[{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"血球比容值、血色素及紅血球數"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"血中鉛之檢查"},{"src":"06_四烷基鉛作業管理分級參考","file":"_ref/分級指引/06_四烷基鉛作業管理分級參考.txt","quote":"2.2 尿中鉛濃度≥ 150 μg/L"}],"note_ref":"四、鉛作業的法定檢查、分級管理與母性保護"}},{"qid":"c07q14","q":"有關特殊健康檢查分級之對照，下列何者錯誤？","options":["男性鉛作業勞工血中鉛 ≥40 μg/dL：第三級管理","甲狀腺功能低下所致之多發性神經病變：第三級管理","女性鉛作業勞工血中鉛 ≥30 μg/dL：第三級管理","齒齦鉛線合併小球性低血色素貧血，且經職醫評估與工作有關：第四級管理"],"answer":1,"recon":"partial","src":["113-12"],"optexp":["**正確**：分級指引鉛作業第三級 2.2：血中鉛濃度男性 ≥40 μg/dL、女性 ≥30 μg/dL，需請職業醫學科醫師評估與工作的相關性。","**錯誤（本題答案）**：甲狀腺功能低下引起的多發性神經病變可由工作以外的原因解釋，依分級定義屬第二級管理（異常但與工作無關，需追蹤），不是第三級；第三級是異常且無法確定與工作相關性者。","**正確**：女性門檻比男性低 10 μg/dL，血中鉛 ≥30 μg/dL 即第三級（女性 ZPP 閾值也較低，且需顧及生育）。","**正確**：第四級 2.1：異常項目符合鉛中毒表現，如鉛性腹絞痛、齒齦鉛緣、小球性低血色素貧血（排除缺鐵與海洋性貧血）、周邊神經病變、腎臟病變，且經職醫評估可由工作相關原因解釋。"],"explanation":"本題考鉛作業四級管理的判定邏輯。第一級：檢查無異常，或異常經醫師認定不需追蹤。第二級：異常需於下年度前追蹤，或異常可由工作以外原因解釋，例如缺鐵性貧血、血鉛偏高但可由飲食等非職業因素解釋，以及本題的甲狀腺功能低下所致神經病變。第三級：異常符合鉛作業危害表現且無法確定與工作的相關性，需請職醫評估，判定依據 2.1 尚不知原因之小球性低血色素、周邊神經病變（垂腕垂足等伸肌麻痺或感覺異常）、腎臟病變（蛋白尿達二價 ≥100 mg/dL）；2.2 血中鉛男性 ≥40、女性 ≥30 μg/dL；2.3 無法由工作以外原因解釋或事業單位未提供環測紀錄；經職醫追蹤複檢後不宜維持第三級。第四級：異常符合鉛中毒表現（鉛性腹絞痛、齒齦鉛緣、小球性低血色素貧血排除缺鐵與海洋性貧血、周邊神經病變、腎臟病變）或血中鉛男 ≥40／女 ≥30，且可由工作相關原因解釋。記憶要點：分級是「異常＋能否由工作解釋」的矩陣，非職業原因（缺鐵、甲狀腺、酒精）一律第二級；血鉛門檻男 40／女 30 與母性保護的 5／10 完全不同。113-12 回憶版把選項寫成「甲狀腺低下造成多發性硬化症→第三級」，本題已改為多發性神經病變。","dispute":"","review":{"key_points":["第三級門檻：==血中鉛男 ≥40、女 ≥30 μg/dL==；小球性低血色素、垂腕垂足、蛋白尿二價","可由工作以外原因解釋（缺鐵、==甲狀腺功能低下==、飲食）→==第二級==","第四級＝鉛中毒表現或血鉛超標＋可由工作解釋；四級管理是「異常×工作相關性」矩陣"],"refs":[{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"2.2 血中鉛濃度男性≥40μg /dL、女性≥30 μg /dL"},{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"異常項目可由工作以外的原因解釋，如缺鐵性貧血"},{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"齒齦鉛緣(有鉛沉澱之鉛線)"}],"note_ref":"四、鉛作業的法定檢查、分級管理與母性保護"}},{"qid":"c07q15","q":"依女性勞工母性健康保護實施辦法，妊娠中女性勞工之血中鉛濃度在 5 μg/dL 以上未達 10 μg/dL 者，屬於第幾級管理？","options":["第一級管理","第二級管理","第三級管理","第四級管理"],"answer":1,"recon":"full","src":["整理-表格"],"optexp":["**不符合**：第一級管理是血中鉛濃度低於 5 μg/dL 者。","**符合／正確（本題答案）**：女性勞工母性健康保護實施辦法第 10 條：血中鉛濃度在 5 μg/dL 以上未達 10 μg/dL 者為第二級管理，雇主應使勞工健康服務醫師提供個人面談指導並採取危害預防措施。","**不符合**：第三級管理是血中鉛濃度在 10 μg/dL 以上者（第 10 條；鉛作業只依血中鉛分級，不用空氣濃度），應即改善環境並由醫師評估調整工作。","**不符合**：母性健康保護的鉛作業風險分級只有三級，沒有第四級；四級管理是特殊健檢的分級架構。"],"explanation":"本題考母性健康保護對鉛作業的專屬分級，要與一般鉛作業的四級管理分開。女性勞工母性健康保護實施辦法第 4 條：具鉛作業之事業中，雇主使女性勞工從事鉛及其化合物散布場所之工作者應實施母性健康保護；第 10 條血中鉛分級：第一級 \u003c5 μg/dL、第二級 5 以上未達 10、第三級 ≥10 μg/dL（醫師評估得調整等級）；第 9 條的空氣濃度分級：低於 PEL 十分之一為第一級、十分之一以上未達二分之一為第二級、二分之一以上為第三級，鉛 PEL-TWA 0.05 mg/m3 的一半即 0.025 mg/m3。處置（第 11 條）：第二級由從事勞工健康服務醫師個人面談指導並採危害預防措施；第三級應即改善工作環境、完成後重新評估，並由醫師註明不適宜作業。保護期間的勞工屬第一、二級須經醫師評估可繼續原工作、說明危害資訊並經當事人書面同意；第三級依醫師適性評估建議變更工作條件、調整工時或調換工作。上位法：職安法第 30 條禁止妊娠中與分娩後未滿一年之女性從事鉛及其化合物散布場所之工作（此款不得以書面同意排除）。對照：一般鉛作業第三級門檻男 40／女 30 μg/dL，母性保護嚴格到 5／10，因為胎兒神經發育對鉛沒有安全閾值。","dispute":"","review":{"key_points":["母性保護鉛分級：==\u003c5 第一級、5–\u003c10 第二級、≥10 μg/dL 第三級==","空氣濃度分級（第 9 條，適用第 3 條與第 5 條第 2 項之工作）：PEL 1/10 以下一級、1/10–1/2 二級、≥1/2 三級；鉛作業（第 4 條）依第 10 條只用血中鉛分級","職安法第 30 條：妊娠中與分娩後未滿一年禁止鉛散布場所工作；一般鉛分級男 40／女 30"],"refs":[{"src":"女性勞工母性健康保護實施辦法","file":"_ref/女性勞工母性健康保護實施辦法.txt","quote":"二、第二級管理：血中鉛濃度在五 μg/dl 以上未達十 μg/dl"},{"src":"女性勞工母性健康保護實施辦法","file":"_ref/女性勞工母性健康保護實施辦法.txt","quote":"三、第三級管理：血中鉛濃度在十 μg/dl 以上者"},{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"二、鉛及其化合物散布場所之工作"}],"note_ref":"四、鉛作業的法定檢查、分級管理與母性保護"}},{"qid":"c07q16","q":"依 113–115 年考試當時之勞工作業環境監測實施辦法，鉛中毒預防規則所稱鉛作業之作業場所，應多久監測空氣中鉛濃度一次以上？","options":["每三個月","每六個月","每年","每二年"],"answer":2,"recon":"rebuilt","src":["整理-表格","補充"],"optexp":["**錯誤**：每三個月是高溫作業綜合溫度熱指數的監測頻率；化學性因子在考試當時的舊環測辦法沒有「濃度達容許值即加密為三個月」的規定，那是 116 年 1 月 1 日施行的新第 6 條才有的條款。","**錯誤**：每六個月是舊法粉塵、有機溶劑、特定化學物質與煉焦爐作業的頻率，也是 115 年修正後（116.1.1 施行）鉛作業的新頻率；但依考試當時的舊辦法，鉛作業不是六個月。","**正確（本題答案）**：舊勞工作業環境監測實施辦法第 8 條第 6 款：「鉛中毒預防規則所稱鉛作業之作業場所，應每年監測鉛濃度一次以上」，第 7 款四烷基鉛亦為每年一次；整理表格所記「鉛環測 12 個月」即出自此。","**錯誤**：沒有任何作業的法定監測頻率是每二年；監測辦法的頻率只有每三個月、每六個月與每年三種。"],"explanation":"本題考作業環境監測頻率的新舊差異。113–115 年考試適用的舊環測辦法（105.11.02 版）第 7、8 條：高溫作業每三個月測綜合溫度熱指數；粉塵、有機溶劑、特定化學物質、煉焦爐作業每六個月；鉛作業與四烷基鉛作業每年一次；中央空調建築物 CO2、坑內粉塵與 CO2、85 分貝以上噪音每六個月。115 年 6 月 12 日修正、116 年 1 月 1 日施行的新第 6 條把鉛與四烷基鉛併入「每六個月一次，勞工暴露濃度高於或等於容許濃度者每三個月一次」的化學性因子通則。鉛及其無機化合物 PEL-TWA 為 0.05 mg/m3；鉛的環測紀錄不在 30 年清單（舊法保存 3 年、新法 10 年）。應試時若題目未註明年份，先依舊法答每年，並知道新法改為每六個月。","dispute":"整理者原以新法（每六個月）出題，詳解撰寫者依舊環測辦法第 8 條第 6 款提出異議（鉛作業每年一次），整理者複審後改以考試當時的舊法為準；整理表格「鉛環測：12 個月」與舊法一致。116 年 1 月 1 日起新法為每六個月（≥PEL 者每三個月）。","review":{"key_points":["考試當時鉛作業環測頻率＝==每年一次==（四烷基鉛同）；116.1.1 起改每六個月、≥PEL 每三個月","高溫每三個月；粉塵、有機溶劑、特化、煉焦每六個月；噪音 85 dB 每六個月","鉛 PEL-TWA ==0.05 mg/m3==；鉛環測紀錄不在 30 年清單"],"refs":[{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"鉛中毒預防規則所稱鉛作業之作業場所，應每年監測鉛濃度一次以上"},{"src":"勞工作業環境監測實施辦法","file":"_ref/勞工作業環境監測實施辦法.txt","quote":"但勞工暴露濃度高於或等於勞工作業場所容許暴露標準所定容許濃度者，應每三個月實施監測一次以上"}],"note_ref":"五、鉛暴露行業、致癌分類與作業環境監測"}}]},{"idx":7,"order":7,"title":"汞與錳","group":"重金屬","gi":2,"notes_md":"本章每回約 2–3 題，固定考「汞三聯徵與有機汞的感覺異常／視野狹窄、無機汞的腎病症候群、乙基汞測血汞／無機汞測尿汞、水俁病＝甲基汞」以及「錳＝類巴金森症候群、沉積蒼白核、靜止性震顫少見、生物偵測無用」，再加一題金屬與行業配對。\n\n## 一、汞的三種型態：吸收、分布、排泄與生物偵測\n\n| 型態 | 吸收 | 標靶 | 生物偵測 |\n|---|---|---|---|\n| 液態元素汞 | 消化道 0.01%、皮膚 1% | 幾乎無毒（汞栓除外） | — |\n| ==汞蒸氣== | 肺 ==80%==，通過血腦障壁與胎盤，氧化為二價汞沉積腦與腎（半衰期 1–2 個月，腦內數年） | ==中樞神經==（三聯徵）＋腎蛋白尿 | ==尿中汞== |\n| ==無機汞化合物== | 消化道 7–15%、可經皮，不易通過血腦障壁 | ==腎==：近曲小管壞死、膜性腎絲球腎炎→==腎病症候群==；急性食入消化道腐蝕 | ==尿中汞 ≥35 μg/g Cr==（第三、四級） |\n| ==有機汞（甲基、乙基）== | 消化道、呼吸道、皮膚皆佳；與紅血球結合，經膽汁糞便排泄（尿約 10%） | ==中樞神經、胎兒腦== | ==血中汞 ≥10 μg/dL==；採檢前一週禁食大型魚類海鮮 |\n\n- 半衰期：甲基汞血中 48–65 天、乙基汞 5–7 天（認定指引：有機汞約 50–70 天）。PEL-TWA：汞蒸氣及其化合物 0.05 mg/m3（皮）、有機汞 0.01 mg/m3；無機汞第三級輔助基準 ≥0.025 mg/m3。\n- 職安法第 30 條：妊娠中女性不得從事汞及其無機化合物之工作（可經母性保護與書面同意例外）。\n\n## 二、汞中毒的臨床表現與水俁病\n\n- 元素汞蒸氣慢性中毒：早期微量汞中毒症（虛弱、疲倦、厭食、==體重減輕==）→三聯徵==顫抖（細微→意向性）、牙齦炎（口內炎、流涎、汞線）、興奮增盛（易怒、極度害羞、失眠、記憶喪失）==→晚期僵硬、步履不穩、視野變化、周邊神經病變、汞晶狀體症；靜止性震顫非主要表現，類巴金森是錳。\n- 有機汞（水俁病）：潛伏期長，==手套襪套型與口唇感覺異常→疼痛性多發性神經病變、運動失調（行走發音困難、眼球震顫）、視野狹窄、聽力減退==，不可逆；胎兒型似腦性麻痺（懷孕第二期最危險）。\n- ==水俁病＝甲基汞==（氯鹼廠→海灣→魚貝）；鎘→痛痛病；砷→烏腳病；PCB→油症；伊拉克含汞殺菌劑稻米事件。\n- 汞暴露行業：==日光燈／燈管製造回收==、氯鹼廠（1991 年廢水銀電槽）、溫度計血壓計、牙科汞齊、金礦汞齊、乾電池；國內個案：小型燈泡回收廠、誤服硃砂。\n\n## 三、錳中毒：類巴金森症候群與蒼白核\n\n- 吸入錳經肺、嗅神經、血腦障壁、脈絡叢入腦，沉積==基底核尤其蒼白核==（殼核、尾狀核），==黑質保留、無路易體==；腦內半衰期長，停止暴露後毒性可持續。\n- 臨床：非特異期（疲勞、嗜睡、易怒）與==錳狂==（記憶判斷障礙、幻覺、攻擊性）→==錐體外徑症候群==：動作遲緩、面具臉、寫字變小、==僵直、姿勢反射消失、肌張力不全（痙笑、斜頸、口吃）、雞步、轉身倒退困難、向後跌倒==；==靜止性震顫少見==（顫抖多姿勢性）；急性吸入燻煙→金屬燻煙熱、錳因性肺炎。==沒有癲癇==、周邊神經與腎病變。\n- 與巴金森氏病鑑別：對稱、早發、精神症狀早、levodopa 反應差、MRI ==T1 蒼白核對稱高訊號==（T2 正常，反映 3–6 個月內近期暴露）、TRODAT-1 SPECT 正常；診斷須神經科或精神科專科醫師。\n- 暴露行業：錳礦冶煉、錳鐵合金、金屬鑄造、==焊接（造船、重機械）==、乾電池、過錳酸鉀、農藥；PEL 錳燻煙 1 mg/m3、錳及其無機化合物 5 mg/m3。\n\n## 四、汞與錳作業的法定檢查與分級管理\n\n- 乙基汞作業（附表十第 27 項）與汞及其無機化合物作業（第 32 項）項目相同：酗酒、精神、神經、肝、腎病史；口腔鼻腔、皮膚、呼吸、腸胃、腎、眼睛、神經精神身體檢查；胸部 X 光；尿蛋白、尿潛血、尿沉渣；肌酸酐；Hct、Hb、RBC、WBC；生物偵測==乙基汞→血中汞、無機汞→尿中汞==（變更作業者無須）。\n- 汞分級第三、四級判定：皮膚炎、==口內炎==、神經精神異常、==蛋白尿二價以上（≥100 mg/dL）==、視力視野（乙基汞加聽力）異常、==明顯體重減輕==＋血汞 ≥10 μg/dL 或尿汞 ≥35 μg/g Cr；考量疾病：精神神經、內分泌、腎、肝、消化、動脈硬化、視網膜病變、接觸性皮膚疾病。\n- 錳作業（第 20 項）法定項目只有四項：作業經歷調查、酗酒與精神神經肝腎病史、==肺臟、神經（含巴金森症候群）及精神之身體檢查==、胸部 X 光；==無生物偵測==（血錳尿錳只反映近期、尿排出 \u003c1%）；第三、四級依據：胸部症狀合併 X 光浸潤或肺炎、精神症狀、錐體外徑五徵；第四級佐證血錳 ≥1 μg/dL 或尿錳 ≥3 μg/g Cr；考量疾病：精神或中樞神經（巴金森症候群）、慢性呼吸道、肝、腎、接觸性皮膚。\n- 「體重」考點：第三級列==明顯體重減輕==的只有乙基汞與無機汞；鎘作業法定項目含==體重測量==；鈹僅症狀調查提到體重減輕。\n\n## 五、金屬與行業配對總整理\n\n| 行業／作業 | 危害物 |\n|---|---|\n| 日光燈管製造回收、氯鹼、溫度計血壓計、牙科汞齊 | ==汞== |\n| 錳礦冶煉、錳鐵合金、金屬鑄造、焊接燻煙、乾電池 | ==錳== |\n| 鉛蓄電池、塑膠安定劑、印刷電路板、錫鉛焊接、金屬切割燒熔 | ==鉛== |\n| 黏膠人造纖維（嫘縈）、玻璃紙 | ==二硫化碳== |\n| 金屬電子光學零件清洗去油、噴霧黏著劑、乾洗 | ==1-溴丙烷== |\n| 鎳鎘電池、電鍍、顏料 | 鎘 |\n| 半導體離子植入、冶煉、農藥 | 砷／砷化氫 |\n| ITO 靶材、液晶面板 | 銦 |\n| 電鍍、皮革鞣製、水泥 | 鉻 |\n| 航太合金、核工業 | 鈹 |\n| 氯乙烯單體聚合 | 氯乙烯（肝血管肉瘤、雷諾氏現象、指骨溶解） |","questions":[{"qid":"c08q01","q":"勞工出現手部震顫（tremor）、易怒、步態寬大不穩（wide-based gait）與運動失調（ataxia），最可能為下列何種金屬中毒？","options":["鉛","汞","錳","鎘"],"answer":1,"recon":"full","src":["113-2","113-4","113-8","113-11","114-04"],"optexp":["**不符合**：鉛的神經表現是周邊運動神經病變（垂腕、垂足）、鉛腦症與腹絞痛、貧血，沒有典型的震顫加人格改變組合。","**符合／正確（本題答案）**：汞中毒三聯徵為顫抖、牙齦炎與興奮增盛（erethism：易怒、極度害羞、失眠、記憶喪失）；有機汞另有小腦性運動失調、步態不穩、視野狹窄、聽力減退與感覺異常，題幹的震顫＋易怒＋寬基步態＋運動失調最符合汞。","**不符合**：錳造成的是類巴金森症候群（僵直、動作遲緩、肌張力不全、雞步、轉身與倒退困難），震顫少且多為姿勢性，精神症狀為錳狂，不是以震顫與運動失調為主。","**不符合**：鎘的標靶是腎臟（近端腎小管低分子量蛋白尿）與骨骼（骨軟化、痛痛病），沒有中樞神經症狀。"],"explanation":"本題考四種金屬中毒的神經學特徵鑑別。汞：元素汞蒸氣慢性中毒的三聯徵是顫抖（從手指、眼皮、嘴唇的細微顫抖進展為意向性顫抖）、牙齦炎（口腔炎、流涎、牙齦汞線）與興奮增盛（erethism：易怒、極度害羞、興奮、失眠、憂鬱、記憶喪失），晚期四肢僵硬、步履不穩、視野變化；有機汞（甲基汞、乙基汞）以小腦與感覺路徑為主——四肢與口唇手套襪套型感覺異常、運動失調（行走及發音困難、步態寬大）、意向性顫抖、視野狹窄、聽力減退。鉛：周邊運動神經病變（垂腕、垂足）、腹絞痛、貧血、兒童鉛腦症。錳：類巴金森症候群（步行障礙、轉身倒退困難、僵直、姿勢反射消失、肌張力不全、雞步）與錳狂，靜止性震顫少見。鎘：腎小管損傷、骨軟化、肺氣腫。作答訣竅：震顫＋人格情緒改變＋齒齦炎→汞；運動失調＋視野縮小→有機汞；僵直步態＋雞步→錳；垂腕＋腹痛＋貧血→鉛；腎與骨→鎘。回憶版五份考古題都出過此題。","dispute":"","review":{"key_points":["汞三聯徵：==顫抖（意向性）、牙齦炎、興奮增盛（易怒、害羞、失眠）==","有機汞：==手套襪套型感覺異常、運動失調、視野狹窄、聽力減退==","錳＝類巴金森（僵直、雞步、肌張力不全，震顫少）；鉛＝垂腕腹痛貧血；鎘＝腎與骨"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"汞中毒症 (mercurialism) 的三項特別症狀 (triad) 為顫抖、牙齦炎及興奮增盛 (erethism)"},{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"全身性運動失調(以行走及發音困難為主)、手部意向性顫抖、平衡功能障礙"}],"note_ref":"二、汞中毒的臨床表現與水俁病"}},{"qid":"c08q02","q":"有機汞中毒會引起下列何種症狀？","options":["視野缺損、感覺異常與疼痛性多發性神經病變","橫紋肌溶解","眼球震顫為主要表現","鼻中膈穿孔"],"answer":0,"recon":"full","src":["113-5","113-8","113-11","113-12","115-01"],"optexp":["**符合／正確（本題答案）**：慢性有機汞中毒的初期表現是四肢末梢或口唇周圍麻木與周邊視野缺損，晚期麻木上移並可伴疼痛（疼痛性多發性神經病變），視野可從周邊逐漸縮小至失明。","**不符合**：橫紋肌溶解是中暑、癲癇、擠壓傷或某些藥物的表現，不是有機汞中毒的特徵。","**不符合**：眼球震顫可在有機汞中毒晚期與小腦症狀一起出現，但不是主要表現；主要表現是感覺異常、運動失調、視野狹窄與聽力障礙。","**不符合**：鼻中膈穿孔是六價鉻（鉻酸霧滴）與砷的鼻黏膜腐蝕表現，與汞無關。"],"explanation":"本題考慢性有機汞中毒（水俁病型）的臨床表現。認定指引：有機汞（甲基汞、乙基汞）經消化道、呼吸道與皮膚吸收，與血紅蛋白硫基結合，通過血腦障壁與胎盤進入富含脂質的腦組織，造成不可逆的中樞神經傷害，血汞正常時腦汞仍可偏高；潛伏期長，初期出現四肢末梢或口唇周圍麻木、周邊視野缺損時體內已累積到可能致死的劑量，其他非特異症狀有失眠、疲憊、牙齦發炎、性情暴躁；晚期麻木感上移、可伴疼痛，小腦功能失調（步履不穩、言語不清、眼球震顫、四肢顫抖、無法做細緻動作），較少腎臟症狀，更嚴重者智能障礙、聽力障礙、舞蹈症、肌抽躍、失明、昏迷、死亡。分級指引乙基汞章的慢性危害：四肢手套襪套型感覺異常或口唇針刺麻痛感發生後迅速出現全身性運動失調、意向性顫抖、平衡障礙、眼球運動障礙、視野狹窄、聽力減退。評估工具包括神經精神測驗、小腦功能（行走、寫字、夾菜）、周邊神經感覺、視野檢查（perimetry）與口腔牙齦藍線。回憶版原題四個選項為 visual field loss、painful polyneuropathy、nystagmus、rhabdomyolysis，答 painful polyneuropathy；本題把視野缺損與疼痛性神經病變合併為一個選項。","dispute":"回憶版原題（113-5、113-8、113-11、113-12）選項為 A visual field loss、B painful polyneuropathy、C nystagmus、D rhabdomyolysis，回憶者答 painful polyneuropathy；115-01 版本選項亦含「疼痛性神經病變」。依汞中毒認定指引，周邊視野缺損（visual field loss）與伴有疼痛的四肢麻木同為慢性有機汞中毒的特徵，眼球震顫則是晚期小腦症狀之一，因此原題其實有 A、B 兩個可成立的選項。本題重建時把視野缺損與疼痛性多發性神經病變合併為選項 A 以避免爭議；若考場上兩者分列，依回憶版答案選疼痛性多發性神經病變，並記住視野狹窄也是有機汞（水俁病）的典型表現。","review":{"key_points":["有機汞：==感覺異常（手套襪套型、口唇）→疼痛性多發性神經病變==、==運動失調==、==視野狹窄==、聽力減退、構音困難","潛伏期長，初期症狀出現時已累積致死劑量；不可逆","鼻中膈穿孔→六價鉻、砷；橫紋肌溶解→中暑"],"refs":[{"src":"職業性汞中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性汞中毒認定參考指引-2015修.txt","quote":"四肢末梢的麻木感逐漸上移，可伴有疼痛。小腦功能失調症狀陸續出現，如步履不穩、言語不清、眼球震顫、四肢顫抖"},{"src":"職業性汞中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性汞中毒認定參考指引-2015修.txt","quote":"慢性有機汞中毒會造成周邊視野缺損，漸至完全失明"},{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"四肢(戴手套、套襪型或實體感覺喪失)或口唇感覺異常(針刺或麻痛感)"}],"note_ref":"二、汞中毒的臨床表現與水俁病"}},{"qid":"c08q03","q":"有關元素汞（汞蒸氣）慢性中毒之敘述，下列何者正確？","options":["典型表現包括齒齦炎、口內炎與唾液增加","震顫以靜止性震顫（resting tremor）為主","以類巴金森症候群（parkinsonism）為主要表現","主要造成肝血管肉瘤"],"answer":0,"recon":"full","src":["114-02","114-01"],"optexp":["**符合／正確（本題答案）**：元素汞蒸氣慢性中毒的口腔表現有牙齦炎、口腔炎、流涎症（嚴重者一天數公升口水）、磨牙、早期落牙與牙齦汞線；牙齦炎是汞中毒三聯徵之一。","**不符合**：汞的震顫是從手指、眼皮、嘴唇開始的細微顫抖，進展為意向性（動作性）顫抖，不以類巴金森的靜止性震顫為主；114-02 回憶版此選項標為錯。","**不符合**：類巴金森症候群是錳中毒的特徵（蒼白核沉積）；汞晚期雖可有四肢僵硬與步履不穩「有如巴金森氏症」，但主要表現是顫抖、興奮增盛與小腦功能異常。","**不符合**：肝血管肉瘤是氯乙烯單體的特徵性腫瘤，與汞無關；無機汞 IARC 列為第 3 類。"],"explanation":"本題考元素汞（汞蒸氣）慢性中毒的表現。動力學：汞蒸氣經肺吸收約 80%，脂溶性高、通過血腦障壁與胎盤，在細胞內被過氧化氫酶氧化為二價汞沉積於腦與腎，半衰期約 1–2 個月、腦內可達數年。臨床：早期微量汞中毒症（虛弱、疲倦、食慾不振、體重減輕、腸胃不適），之後出現三聯徵——顫抖（手指、眼皮、嘴唇的細微顫抖→意向性顫抖→全身顫抖與痙攣）、牙齦炎（口腔炎、流涎、磨牙、落牙、牙齦汞線）、興奮增盛（極度害羞、興奮、記憶喪失、失眠、憂鬱，重者幻覺譫妄），晚期四肢僵硬、步履不穩、視野變化、肌抽躍、周邊神經病變，眼睛可見汞晶狀體症；腎臟可有蛋白尿甚至腎病症候群。國內暴露行業：日光燈與燈管製造回收、血壓計溫度計、牙科汞齊、氯鹼工廠（1991 年廢止水銀電槽）、金礦汞齊。震顫的鑑別：汞＝細微意向性顫抖；錳＝姿勢性顫抖為主、靜止性少；原發性巴金森＝搓丸樣靜止性震顫。114-01 回憶版「慢性汞中毒的症狀：視野中心點／tremor／牙齦炎」也是同一考點。","dispute":"114-02 回憶版把「resting tremor」列為錯誤選項，一般教科書也把汞的震顫描述為細微的意向性（動作性）顫抖，與巴金森氏病的靜止性震顫不同。但分級指引完整版汞章寫「特徵為靜止性顫抖（resting tremor）或意向性顫抖（intention tremor），開始時從手指、眼皮及嘴唇等周邊開始的細緻顫抖」，認定指引也寫「從靜置時細緻的手抖，進展為意向性顫抖」，即早期靜置時亦可見細微顫抖。因此選項 B 的錯誤點在「以靜止性震顫為主」，汞的典型仍是意向性顫抖；選項 A 牙齦炎、口內炎與唾液增加是無爭議的正確敘述，應試時選 A。","review":{"key_points":["元素汞慢性中毒三聯徵：==顫抖、牙齦炎（口內炎、流涎）、興奮增盛==","汞的震顫＝細微→==意向性顫抖==，不是靜止性；類巴金森＝錳","汞蒸氣肺吸收 80%、通過血腦障壁；肝血管肉瘤→氯乙烯"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"口腔：牙齦炎、口腔炎及流涎症 (ptyalism)"},{"src":"職業性汞中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性汞中毒認定參考指引-2015修.txt","quote":"從靜置時細緻的手抖，進展為意向性顫抖(Intention tremor)，以及興奮增盛"},{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"顫抖多為姿勢性或運動性 顫 抖 ， 較 少 位 置 性 顫 抖 (resting tremor)"}],"note_ref":"二、汞中毒的臨床表現與水俁病"}},{"qid":"c08q04","q":"下列何種形式之汞慢性中毒最容易造成腎病症候群（nephrotic syndrome）？","options":["液態元素汞","汞蒸氣","無機汞化合物","乙基汞"],"answer":2,"recon":"full","src":["113-2","113-4","113-9","113-12","114-01","114-02","114-05"],"optexp":["**不符合**：液態元素汞消化道吸收極差（約 0.01%），一般認為食入無明顯毒性，皮膚吸收約 1%，不會造成腎病症候群。","**不符合**：汞蒸氣主要標靶是中樞神經（顫抖、興奮增盛），雖然轉成二價汞後也沉積腎臟並可有蛋白尿，但腎病症候群的典型來源是無機汞化合物。","**符合／正確（本題答案）**：無機汞化合物集中於腎臟，主要影響近曲小管導致腎小管壞死，產生蛋白尿、水腫與腎病症候群，並可經免疫機轉造成膜性腎絲球腎炎；分級指引第三、四級以蛋白尿二價以上（≥100 mg/dL）為判定依據。","**不符合**：乙基汞等有機汞主要造成中樞神經傷害（感覺異常、運動失調、視野狹窄），較少腎臟症狀，大量暴露才有腎小管損傷。"],"explanation":"本題考汞的三種型態各自的標靶器官，這是汞章節的核心架構。元素汞（液態）：消化道吸收 0.01%、皮膚 1%，食入基本無毒，但滲入血管形成汞栓可致組織壞死。汞蒸氣：肺吸收約 80%，通過血腦障壁與胎盤，標靶是中樞神經（三聯徵、小腦功能異常）與腎臟（蛋白尿）。無機汞化合物（氯化汞等）：消化道吸收 7–15%，可經皮吸收，不易通過血腦障壁，集中於腎臟，近端腎小管壞死→蛋白尿、水腫、腎病症候群，並有免疫性腎絲球腎炎（膜性腎絲球腎炎，被認為是特異體質反應，可在無其他汞中毒症狀的勞工出現）；急性食入氯化汞造成消化道腐蝕、出血與急性腎衰竭；孩童慢性暴露為肢痛症（pink disease）。有機汞（甲基汞、乙基汞）：消化道吸收好，與紅血球結合，經膽汁糞便排泄，標靶是中樞神經與胎兒腦部，較少腎臟症狀。分級指引汞及其無機化合物章第三、四級判定：皮膚暴露部位皮膚炎、口內炎、神經精神異常、蛋白尿 2 價以上（≥100 mg/dL）、視力或視野異常、明顯體重減輕，尿中汞 ≥35 μg/g creatinine；法定檢查含尿蛋白、尿潛血、尿沉渣鏡檢與肌酸酐。113-4 回憶版「何者數個月後會有 nephrotic syndrome→汞（膜性腎絲球腎炎）」即此題。","dispute":"","review":{"key_points":["==無機汞→腎（近曲小管壞死、膜性腎絲球腎炎→腎病症候群）==","汞蒸氣→中樞神經（＋腎蛋白尿）；有機汞→中樞神經與胎兒；液態元素汞食入幾乎不吸收","無機汞分級：蛋白尿 ≥100 mg/dL、尿汞 ≥35 μg/g Cr；法定含尿蛋白潛血沉渣、肌酸酐"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"主要影響近曲小管導致腎小管壞死，會產生蛋白尿及水腫、腎病症候群，也會導致免疫性腎絲球腎炎"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"無機汞化合物較不會通過血腦屏障或胎盤"},{"src":"31_汞及其無機化合物作業管理分級參考","file":"_ref/分級指引/31_汞及其無機化合物作業管理分級參考.txt","quote":"2.2 尿中汞濃度≥ 35 μg/g creatinine (上班前)"}],"note_ref":"一、汞的三種型態：吸收、分布、排泄與生物偵測"}},{"qid":"c08q05","q":"日本水俁病（Minamata disease）是由下列何種物質所引起？","options":["鎘","甲基汞","砷","多氯聯苯"],"answer":1,"recon":"full","src":["113-2","113-11","114-01"],"optexp":["**不符合**：鎘引起的是日本富山縣神通川流域的痛痛病（itai-itai disease），骨軟化、多發性骨折與腎小管損傷。","**符合／正確（本題答案）**：1950 年代日本水俁地區氯鹼工廠排放氯化甲基汞進入海灣，經魚貝生物累積進入人體，造成上千人的水俁病；孕婦暴露使胎兒出現類似腦性麻痺的先天性水俁病。","**不符合**：砷在台灣造成的是西南沿海飲用含砷深井水的烏腳病（血管病變）與皮膚癌，與水俁病無關。","**不符合**：多氯聯苯（PCB）造成的是 1968 年日本與 1979 年台灣的米糠油中毒（油症），表現為氯痤瘡、色素沉著與胎兒油症兒。"],"explanation":"本題考環境公害病與致病物質的對應。水俁病（Minamata disease）：1950 年代日本熊本縣水俁灣，氯鹼工廠以汞為觸媒生產乙醛，排放氯化甲基汞污染海水，經浮游生物、魚貝生物累積，居民長期食用後出現感覺異常、運動失調、視野狹窄、聽力障礙、構音困難、顫抖，重者失明、昏迷、死亡；甲基汞通過胎盤，懷孕第二期暴露危險最高，胎兒表現為發育遲緩、18 個月不會行走、24 個月不會說話，臨床很像腦性麻痺。1970 年代伊拉克含汞殺菌劑污染稻米也造成數千人中毒。其他對照：鎘→痛痛病（富山縣神通川，骨軟化與腎小管損傷）；砷→台灣烏腳病（西南沿海深井水）與皮膚癌；多氯聯苯→油症（1968 年日本、1979 年台灣米糠油事件，氯痤瘡）；鉛→兒童鉛腦症；錳→錳礦工類巴金森。台灣的汞暴露調查（牙科、氯鹼廠、日光燈溫度計血壓計廠）未發現明顯中毒，零星個案來自誤服硃砂與小型燈泡回收廠。回憶版三份考古題都直接問水俁病的致病物質。","dispute":"","review":{"key_points":["==水俁病＝甲基汞==（氯鹼工廠→海灣→魚貝生物累積），胎兒型似腦性麻痺","鎘→痛痛病；砷→烏腳病；PCB→油症（米糠油）","孕婦懷孕第二期暴露危險最高；1970 年代伊拉克含汞殺菌劑稻米事件"],"refs":[{"src":"職業性汞中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性汞中毒認定參考指引-2015修.txt","quote":"由於氯鹼工廠排放氯化甲基汞進入海中，再輾轉進入人體，造成上千人的水俣病(Minamata disease)"},{"src":"職業性汞中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性汞中毒認定參考指引-2015修.txt","quote":"甲基汞可通過胎盤，進入胎兒腦組織，抑制發育"}],"note_ref":"二、汞中毒的臨床表現與水俁病"}},{"qid":"c08q06","q":"有關汞作業之生物偵測，下列敘述何者正確？","options":["乙基汞作業測血中汞；汞及其無機化合物作業測尿中汞","乙基汞作業測尿中汞；無機汞作業測血中汞","所有汞作業一律測尿中汞","所有汞作業一律測血中汞"],"answer":0,"recon":"full","src":["113-8","113-11","115-02"],"optexp":["**符合／正確（本題答案）**：有機汞與紅血球結合、經膽汁糞便排泄（尿液只占約 10%），以血中汞為指標（乙基汞作業第三級 ≥10 μg/dL）；無機汞與汞蒸氣轉為二價汞後由腎排泄，以尿中汞為指標（第三級 ≥35 μg/g creatinine）。","**不符合**：正好相反；乙基汞經尿排泄少、無法用尿汞評估暴露，無機汞用尿汞比血汞適合（歐盟慢性中毒指引：尿汞比血汞適合）。","**不符合**：有機汞主要經糞便排泄，尿汞不能反映有機汞暴露，附表十乙基汞作業明定血中汞。","**不符合**：無機汞的血中汞半衰期短且反映近期吸入，慢性暴露評估以尿汞為準，附表十汞及其無機化合物作業明定尿中汞。"],"explanation":"本題考汞的生物偵測與排泄途徑的對應。乙基汞化合物作業（附表十第 27 項）：法定項目含酗酒、精神、神經、肝、腎病史，口腔鼻腔、皮膚、呼吸、腸胃、腎、眼睛、神經精神身體檢查，胸部 X 光，尿蛋白、尿潛血、尿沉渣，肌酸酐，血球比容、血色素、紅血球、白血球，以及血中汞檢查（變更作業者無須）；有機汞在血中與紅血球結合，主要經膽汁由糞便排出，只有約三分之一（認定指引寫約 10%）經尿液，故無法用尿汞評估；甲基汞血中半衰期 48–65 天、乙基汞 5–7 天，長期穩定暴露者建議週末班下班前採檢，檢查前一週禁食大型魚類、海鮮貝類，血汞 >10 μg/dL（100 μg/L）需懷疑與工作有關，第三、四級門檻血中汞 ≥10 μg/dL。汞及其無機化合物作業（第 32 項）：項目相同但生物偵測為尿中汞，第三、四級門檻尿中汞 ≥35 μg/g creatinine（上班前或下班時），輔助基準 PEL-TWA ≥0.025 mg/m3；歐盟指引尿汞 >50 μg/g Cr 為慢性中毒、>35 即有早期健康效應，急性中毒才用血汞（>18 μg/dL）。PEL：汞蒸氣及其化合物 0.05 mg/m3（皮），有機汞 0.01 mg/m3。115-02 回憶版「無機汞：血中汞（x）」即此考點。","dispute":"","review":{"key_points":["==乙基汞（有機汞）→血中汞 ≥10 μg/dL==；==無機汞、汞蒸氣→尿中汞 ≥35 μg/g Cr==","有機汞經膽汁糞便排泄（尿約 10%），無法用尿汞評估；採檢前一週禁食大型魚類海鮮","PEL：汞蒸氣 0.05 mg/m3（皮）、有機汞 0.01；甲基汞血半衰期 48–65 天、乙基汞 5–7 天"],"refs":[{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"2.2 血中汞濃度≥ 10.0 μg /dL"},{"src":"31_汞及其無機化合物作業管理分級參考","file":"_ref/分級指引/31_汞及其無機化合物作業管理分級參考.txt","quote":"2.2 尿中汞濃度≥ 35 μg/g creatinine (上班前)"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"有機汞主要是經由糞便排泄而很少經由腎臟排泄，只有三分之一的汞是經由尿液排泄，因此無法使用尿中汞測定來評估暴露量"}],"note_ref":"一、汞的三種型態：吸收、分布、排泄與生物偵測"}},{"qid":"c08q07","q":"下列何種行業最常發生汞中毒？","options":["日光燈管製造與回收業","鉛蓄電池製造業","半導體離子植入製程","水泥業"],"answer":0,"recon":"full","src":["113-8","115-01"],"optexp":["**符合／正確（本題答案）**：日光燈、螢光燈、真空管、紫外光燈與汞蒸氣燈管的製造與回收是認定指引列出的汞暴露行業，燈管破碎時釋出汞蒸氣，國內小型燈泡回收廠曾發生汞中毒個案。","**不符合**：鉛蓄電池製造是鉛作業（高度風險），沒有汞暴露；早期水銀電池屬乾電池類，與鉛蓄電池不同。","**不符合**：半導體離子植入製程的危害是砷化氫、磷化氫、三氟化硼等摻雜氣體，不是汞。","**不符合**：水泥業的危害是粉塵（矽肺、慢性阻塞性肺病）與六價鉻接觸性皮膚炎，與汞無關。"],"explanation":"本題考汞的暴露行業。認定指引列出的職業性汞暴露：汞礦開採冶煉、汞齊提煉金銀、製鏡、製帽、氯鹼業（水銀電槽，我國 1991 年廢止）、血壓計與體溫計製造修護、電錶與乾電池製造回收、日光燈螢光燈真空管紫外光燈及汞蒸氣燈管製造回收、牙科汞齊、實驗室、武器製造、木材防腐與製紙、含汞農藥與藥品；非職業性暴露有燃煤空氣污染、家中破損溫度計氣壓計、含汞魚類、含汞中藥（八寶散、丹砂、粉霜）、含汞水性漆。台灣不產汞，過去進口主要用於氯鹼廠，現用於日光燈、血壓計、溫度計等；牙科、氯鹼廠、大型日光燈溫度計血壓計廠的調查未見明顯中毒，零星個案為誤服硃砂與小型燈泡回收廠。110 年乙基汞與無機汞作業特殊健檢合計僅 1,553 人次，是本批作業中人數最少者。對照其他選項：鉛蓄電池→鉛；半導體離子植入→砷化氫；水泥→粉塵與六價鉻。115-01 回憶版「日光燈管回收：汞（o）」。","dispute":"","review":{"key_points":["汞暴露行業：==日光燈／燈管製造回收、氯鹼廠、溫度計血壓計、牙科汞齊、金礦汞齊、乾電池==","國內個案：小型燈泡回收廠、誤服硃砂；氯鹼水銀電槽 1991 年廢止","鉛蓄電池→鉛；離子植入→砷化氫；水泥→粉塵、六價鉻"],"refs":[{"src":"職業性汞中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性汞中毒認定參考指引-2015修.txt","quote":"日光燈、螢光燈、真空管、紫外光燈、及特殊汞蒸氣燈管製造、回收業"},{"src":"職業性汞中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性汞中毒認定參考指引-2015修.txt","quote":"及小型燈泡回收工廠造成的汞中毒"}],"note_ref":"五、金屬與行業配對總整理"}},{"qid":"c08q08","q":"依健康管理分級建議指引，下列何種作業之第三級管理判定依據中，列有「明顯體重減輕」？","options":["乙基汞作業與汞及其無機化合物作業","噪音作業","游離輻射作業","粉塵作業"],"answer":0,"recon":"rebuilt","src":["113-10"],"optexp":["**符合／正確（本題答案）**：乙基汞作業與汞及其無機化合物作業的第三、四級判定依據都列有「明顯體重減輕」（與皮膚炎、口內炎、神經精神異常、蛋白尿二價以上、聽力視力或視野異常並列），對應慢性汞中毒的厭食與體重減輕。","**不符合**：噪音作業第三、四級只看聽力圖（4K／6K 凹陷、三分法、高低頻差），沒有體重項目。","**不符合**：游離輻射作業判定依據是血球數減少（特別是淋巴球）、疑似白血病、甲狀腺功能低下或甲狀腺癌、輻射性皮膚炎、肺纖維化、骨癌、白內障，沒有體重減輕。","**不符合**：粉塵作業判定依據是胸部 X 光塵肺症分型與肺功能，沒有體重項目。"],"explanation":"本題考分級指引中「體重」出現的位置，是容易被忽略的細節題。乙基汞作業第三級 2.1 與第四級 2.1：有過敏性蕁麻疹或刺激性皮膚炎、口內炎、神經精神異常、蛋白尿（2 價以上 ≥100 mg/dL）、聽力視力或視野異常、明顯體重減輕等符合有機汞作業之健康危害表現；汞及其無機化合物作業第三級 2.1 與第四級 2.1：皮膚暴露部位之皮膚炎、口內炎、神經精神異常、蛋白尿（2 價以上）、視力或視野異常、明顯體重減輕。醫學基礎是慢性汞中毒（微量汞中毒症）的早期非特異症狀——虛弱、疲倦、食慾不振、體重減輕與腸胃不適；分級指引汞章主要健康危害也寫慢性水銀中毒具有神經痛、精神干擾、厭食、體重減輕和口腔炎。另外兩個與體重相關的考點要分開：鎘作業的法定檢查項目含「體重測量」（鎘造成食慾不振與體重下降，是另一種考法）；鈹作業的自覺症狀調查提到體重減輕，但第三級判定依據沒有列入（113-10 回憶者的觀察）。噪音、游離輻射、粉塵的分級依據分別是聽力圖、血球與甲狀腺、胸部 X 光與肺功能，都不含體重。","dispute":"","review":{"key_points":["第三級列「==明顯體重減輕==」的作業：==乙基汞、汞及其無機化合物==","汞分級判定六項：皮膚炎、口內炎、神經精神異常、蛋白尿二價、視力視野（聽力）異常、體重減輕","鎘作業法定項目含==體重測量==；鈹只在症狀調查提到體重減輕"],"refs":[{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"明顯體重減輕等符合有機汞作業之健康危害表現"},{"src":"31_汞及其無機化合物作業管理分級參考","file":"_ref/分級指引/31_汞及其無機化合物作業管理分級參考.txt","quote":"顯體重減輕等符合汞及其無機化合物作業之健康危"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"(３)體重測量。"}],"note_ref":"四、汞與錳作業的法定檢查與分級管理"}},{"qid":"c08q09","q":"下列何種金屬中毒會造成類巴金森症候群（parkinsonism）？","options":["鉛","甲基汞","錳及錳燻煙","鎘"],"answer":2,"recon":"full","src":["113-1","113-4","113-11","114-01","114-02"],"optexp":["**不符合**：鉛的神經毒性是周邊運動神經病變（垂腕、垂足）與鉛腦症，不會造成錐體外徑症候群。","**不符合**：甲基汞造成小腦性運動失調、感覺異常與視野狹窄；元素汞晚期雖可有僵硬與步履不穩「有如巴金森氏症」，但典型類巴金森症候群是錳。","**符合／正確（本題答案）**：錳與錳燻煙沉積於基底核（尤其蒼白核）造成錐體外徑症候群：步行障礙（轉身、倒退困難、雞步）、僵直、姿勢性反射消失、手指腳趾靈巧度降低、肌張力不全，對 levodopa 反應不佳；附表十錳作業身體檢查即明列「神經（含巴金森症候群）」。","**不符合**：鎘的標靶是腎小管與骨骼（痛痛病）及肺（肺氣腫），沒有錐體外徑症狀。"],"explanation":"本題考錳中毒的核心表現——類巴金森症候群（manganism）。錳經吸入由肺吸收，可經嗅神經、血腦障壁或脈絡叢進入腦部，腦內半衰期長（獼猴 223–267 天），沉積於蒼白核、殼核、尾狀核，黑質相對保留、無路易體；粒線體功能失調與多巴胺代謝產生自由基，停止暴露後毒性仍可持續。臨床分三期：早期非特異症狀（疲勞、頭痛、嗜睡、性慾喪失、易怒）與精神症狀（錳狂：記憶判斷障礙、焦慮、幻覺、情緒失控、攻擊性）；進行期出現錐體外徑症狀——動作遲緩、構音障礙、面具臉、字越寫越小、僵直、姿勢不穩、失去姿勢反射、肌張力不全；典型步態為雞步（cock-walk gait）與轉身、倒退困難、容易向後跌倒。與原發性巴金森氏病的差異：對稱性、發病年齡較早、精神症狀早出現、震顫少且為姿勢性或運動性、肌張力不全多、levodopa 反應差、MRI T1 蒼白核高訊號、TRODAT-1 SPECT 正常。分級指引第三、四級判定依據就是這些錐體外徑徵候（步行障礙、僵直、姿勢反射消失、靈巧度降低、肌張力不全）加上錳因性肺炎與精神症狀。暴露行業：錳礦冶煉、錳鐵合金、乾電池、焊接（造船、重機械）、過錳酸鉀與農藥製造。","dispute":"","review":{"key_points":["==錳→類巴金森症候群==：步行障礙（雞步、轉身倒退困難）、僵直、姿勢反射消失、肌張力不全、==levodopa 反應差==","沉積==蒼白核==、黑質保留、無路易體；MRI T1 高訊號；TRODAT-1 SPECT 正常","三期：非特異／錳狂→錐體外徑→固定；暴露：錳礦、錳鐵、乾電池、焊接"],"refs":[{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"神 經 元 的 受 損 主 要 在 蒼 白 球 ， 黑 質 受 到 影響 極 少"},{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"且 對 治 療 藥 物 Levodopa的 反 應 不 佳"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"肺臟、神經（含巴金森症候群）"}],"note_ref":"三、錳中毒：類巴金森症候群與蒼白核"}},{"qid":"c08q10","q":"錳中毒引起之類巴金森症候群，主要病變沉積部位為腦部何處？","options":["蒼白核（globus pallidus）","小腦","海馬迴","大腦白質"],"answer":0,"recon":"full","src":["113-2","113-8","114-02"],"optexp":["**符合／正確（本題答案）**：錳中毒的主要病變在大腦基底核，尤其蒼白核（globus pallidus）神經細胞變性，MRI T1 加權影像可見蒼白核兩側對稱高訊號，蒼白核指數（PI）可量化沉積；黑質病變較少見。","**不符合**：小腦是有機汞（甲基汞）的主要標靶，造成運動失調與構音障礙；錳不以小腦為主。","**不符合**：海馬迴是記憶相關構造，一氧化碳與缺氧傷害可波及，錳中毒的病理重點不在此。","**不符合**：大腦白質病變是一氧化碳中毒的遲發性神經後遺症（合併蒼白核壞死），不是錳的主要沉積處。"],"explanation":"本題考錳的病理定位。認定指引：最顯著的變化在蒼白球（尤其內側蒼白球），視丘、視丘下核、紅核、黑質亦可變性；Canavan 1934 年報告最明顯病變在基底核（尾核、蒼白球、被殼、視丘）；近年猴子實驗證實錳主要沉積於蒼白球，錳中毒主要病變在大腦基底核尤其蒼白球神經細胞變性，黑質病變較少見——這與原發性巴金森氏病（黑質多巴胺神經元退化、路易體）不同。影像：MRI T1 加權可見基底核（尤其蒼白球）及中腦兩側對稱訊號增強，T2 正常；高 T1 訊號反映近期暴露且與血錳正相關，暴露三個月至半年內最明顯，正常 MRI 不能排除過去暴露；蒼白球指數（PI）＝蒼白球與皮質下額葉白質訊號強度比 ×100；99mTc-TRODAT-1 SPECT 在單純錳中毒紋狀體攝取正常，巴金森氏病則低下。對照：一氧化碳中毒以蒼白核壞死與白質脫髓鞘為主（遲發性神經後遺症）；甲基汞以小腦與視覺皮質為主；鉛腦症以瀰漫性腦水腫為主。回憶版三份考古題都直接問「錳沉積在哪」。","dispute":"","review":{"key_points":["錳沉積於==基底核，尤其蒼白核==（殼核、尾狀核亦可），==黑質保留==","MRI ==T1 蒼白核對稱高訊號==（反映近期暴露，3–6 個月內最明顯）、T2 正常；TRODAT-1 正常","CO→蒼白核壞死＋白質病變；甲基汞→小腦、視覺皮質"],"refs":[{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"錳 中 毒主要病變在大腦基底核，尤其在蒼白球的神經細胞變性，黑質病變較少見"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"T1 序列影像顯示在基底核 ( 尤其是蒼白球 ) 及中腦有兩側對稱性的訊號強度增加的現象，但是 T2 序列影像則是正常的"}],"note_ref":"三、錳中毒：類巴金森症候群與蒼白核"}},{"qid":"c08q11","q":"錳中毒引起之類巴金森症候群，下列何種症狀較少見？","options":["肌張力不全（dystonia）","肌肉僵硬（rigidity）","靜止性震顫（resting tremor）","雞步（cock walk）"],"answer":2,"recon":"full","src":["113-2","113-12","114-03","115-02"],"optexp":["**不符合（常見）**：肌張力不全是錳症相對於巴金森氏病更常見的特徵，表現為痙笑、斜頸、口吃與雞步，分級指引第三、四級判定依據明列「出現肌張力不全症狀（dystonia）」。","**不符合（常見）**：手、腳和軀幹僵直是錳症錐體外徑徵候之一，列於分級判定依據。","**符合／正確（本題答案，較少見）**：錳症的顫抖多為姿勢性或運動性，較少靜止性震顫；典型巴金森氏病的搓丸樣靜止性震顫在錳中毒少見，且顫抖不是錳症的主要症狀。","**不符合（常見）**：雞步（cock-walk gait）是錳症的招牌步態——以腳趾走路、手肘彎曲、肩膀抬高、脊椎挺直，緊張或走快時更明顯，分級判定依據列有「步行障礙，特別是轉身困難、倒退走路困難」。"],"explanation":"本題考錳症與原發性巴金森氏病的鑑別，這是錳章節最常考的比較表。錳症（manganism）：症狀對稱、發病年齡較早、精神症狀（錳狂）早期出現；顫抖多為姿勢性或運動性、較少靜止性震顫，且顫抖不是主要症狀；肌張力不全（痙笑、斜頸、口吃、雞步）、容易向後跌倒、轉身與倒退困難、大而寬的步伐發生率高；深腱反射增強不顯著、感覺障礙罕見、肌肉萎縮少；對 levodopa 反應不佳；病變在蒼白球、黑質保留、無路易體；MRI T1 蒼白球高訊號、TRODAT-1 SPECT 正常；病程在起初五到十年較快惡化，十年後緩步停滯。原發性巴金森氏病：不對稱起病、搓丸樣靜止性震顫、前傾式小碎步（propulsive small step gait）、levodopa 反應好、黑質退化與路易體、TRODAT-1 攝取低下。認定指引寫「Calne 1994 年發表錳症與巴金森氏症的差異，包括疾病早期的精神障礙、雞步、移位時向後倒的傾向、較少發生的靜息性震顫、更頻繁的肌張力障礙和對 levodopa 沒有反應」。分級指引第三、四級判定依據 2.3：步行障礙（轉身、倒退困難）、手腳軀幹僵直、姿勢性反射消失或降低、手指腳趾靈巧度降低、肌張力不全，第四級另可用複檢血錳 ≥1 μg/dL 或尿錳 ≥3 μg/g creatinine 佐證。","dispute":"","review":{"key_points":["錳症 vs 巴金森：==靜止性震顫少、肌張力不全多、雞步、向後跌倒、對稱、早發、levodopa 反應差==","分級判定五徵：步行障礙、僵直、姿勢反射消失、靈巧度降低、肌張力不全","錳症深腱反射增強不明顯、感覺障礙罕見；起初 5–10 年惡化快"],"refs":[{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"但 肌 張 力 不 全 、 容易 向 後 跌 倒、及 雞 步 (cock-walk gait)等 特 徵 則 發 生 率 較 高"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"較少發生的靜息性震顫、更頻繁的肌張力障礙和對 levodopa 沒有反應"}],"note_ref":"三、錳中毒：類巴金森症候群與蒼白核"}},{"qid":"c08q12","q":"有關錳之敘述，下列何者錯誤？","options":["會誘發類巴金森症候群","停止暴露很長時間之後，仍可由尿中錳濃度評估體內累積量","腦部 MRI 可見蒼白核 T1 訊號增加","焊接與礦石冶煉為常見暴露行業"],"answer":1,"recon":"full","src":["114-02","113-5","115-01"],"optexp":["**正確**：錳沉積於基底核造成類巴金森症候群，附表十錳作業身體檢查明列「神經（含巴金森症候群）」。","**錯誤（本題答案）**：錳是人體必需元素、有恆定調控，血與尿中錳只反映近期暴露且個體差異極大，尿中排出的錳不到吸收量的 1%，停止暴露很久後無法用尿錳評估累積量（毛髮持續稍久、MRI T1 只反映近期）；錳作業法定檢查項目也沒有生物偵測。","**正確**：MRI T1 加權可見蒼白核兩側對稱訊號增加（T2 正常），暴露三個月至半年內的病人最明顯，可視為暴露證據。","**正確**：認定指引列出的暴露職業包括錳礦冶煉、錳鐵合金製造、乾電池、過錳酸鉀與農藥、焊接作業（造船、重機械製造），焊接燻煙是先進國家錳中毒的主要來源。"],"explanation":"本題考錳的生物偵測限制與暴露評估。錳為必需元素，攝入後大多進入組織與細胞（全血正常 4–15 μg/L，66% 在紅血球），血中錳難以反映腦內狀況；尿液排出的錳比率很低（小於吸收劑量的百分之一）、尿錳差異性非常大，唾液錳無法表示暴露，因此認定指引直言「實驗室檢查幫忙不大」，血錳與尿錳反映的是近期暴露而非過去累積，毛髮錳持續較久。所以錳作業的法定檢查項目只有四項：作業經歷與自覺症狀調查、酗酒與精神神經肝腎病史、肺臟與神經（含巴金森症候群）及精神之身體檢查、胸部 X 光（大片），沒有血錳或尿錳；分級指引只在第四級把「複檢時血中錳 ≥1 μg/dL 或尿中錳 ≥3 μg/g creatinine」當作可由工作解釋的佐證，另有環境輔助基準（錳燻煙 PEL-TWA 1 mg/m3、錳及其無機化合物 5 mg/m3，第三級輔助基準為其一半 0.5 與 2.5 mg/m3）。暴露證據更倚重腦部 MRI T1（暴露三個月至半年內基底核高訊號）、作業環境測定、同工作環境他人類似症狀與移離後改善。暴露行業：錳礦冶煉精煉、錳鐵矽錳鐵銅錳合金、乾電池、過錳酸鉀、錳藥品、煙火、彩色玻璃、皮革、無鉛汽油（MMT）、亞麻子油乾燥、染色顏料油漆上釉、焊接（造船、重機械製造）。","dispute":"","review":{"key_points":["==血錳、尿錳只反映近期暴露==、個體差異大、尿排出 \u003c1%；錳作業==法定項目無生物偵測==","第四級佐證：血錳 ≥1 μg/dL 或尿錳 ≥3 μg/g Cr；PEL 錳燻煙 1、無機錳 5 mg/m3","MRI T1 蒼白核高訊號（暴露 3–6 個月內）為暴露證據；行業：錳礦、錳鐵、乾電池、焊接"],"refs":[{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"尿液排出的錳 比 率 很 低 (小 於 吸 收 劑 量 的 百 分 之 一 )，尿 中 的 錳 濃 度 差 異性 也 非 常 大"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"血液和尿液中的錳濃度反應的是近期的錳暴露，而非過去的暴露；毛髮中的錳濃度則會持續較長一點時間"},{"src":"19_錳及其化合物作業管理分級參考","file":"_ref/分級指引/19_錳及其化合物作業管理分級參考.txt","quote":"複檢時血中錳濃度≥ 1μg/dL或尿中錳濃度≥ 3 μg/g Creatinine"}],"note_ref":"四、汞與錳作業的法定檢查與分級管理"}},{"qid":"c08q13","q":"有關錳中毒之敘述，下列何者錯誤？","options":["錳中毒造成的是類巴金森症候群（parkinsonism），而非原發性巴金森氏病（Parkinson disease）","錳沉積於蒼白核","可出現錐體外徑症狀","錳中毒會引起癲癇"],"answer":3,"recon":"partial","src":["113-10","113-12","113-2"],"optexp":["**正確**：錳造成的是次發性的類巴金森症候群（parkinsonism、manganism），與原發性巴金森氏病（Parkinson disease，黑質退化與路易體）不同；113-12 回憶版把「Parkinson disease」列為錯誤選項。","**正確**：錳沉積於基底核，尤其蒼白核，MRI T1 高訊號。","**正確**：錐體外徑症狀（步行障礙、僵直、姿勢反射消失、靈巧度降低、肌張力不全）是分級指引第三、四級的判定依據。","**錯誤（本題答案）**：癲癇不是錳中毒的表現；認定指引與分級指引列出的神經症狀都是錐體外徑症候群與精神症狀，沒有癲癇（113-10 回憶版「錳跟哪個系統無關：CNS／PNS／巴金森／癲癇」答癲癇）。"],"explanation":"本題考錳中毒的整體臨床範圍，並釐清「有」與「沒有」。有：(1) 中樞神經錐體外徑症候群（類巴金森，非原發性巴金森氏病）；(2) 精神症狀——錳狂（manganese madness）：記憶力變差、情緒失禁、行動怪異、易怒、攻擊性、妄想與幻覺，認定指引要求巴金森氏症候群與錳精神症的診斷應由神經科或精神科專科醫師確定；(3) 呼吸系統——急性吸入高濃度燻煙的金屬燻煙熱（寒顫、發燒、咳嗽）與錳因性肺炎，分級指引第三、四級 2.1 為胸部症狀合併 X 光浸潤或肺炎；(4) 皮膚黏膜刺激。沒有：癲癇、周邊神經病變（感覺障礙偶有自覺症狀但他覺罕見、肌肉萎縮少）、腎病、貧血。附表十錳作業考量疾病（附表十二）：精神（精神官能症）或中樞神經系統疾病（如巴金森症候群）、慢性呼吸道疾病、精神疾病、肝病、腎臟疾病、接觸性皮膚疾病；有酒精中毒、神經或肺臟疾病、肝功能不良者易受危害，所以法定病史調查含酗酒。錳中毒若在中樞神經產生不可逆傷害前移離暴露源，症狀可慢慢恢復，但沒有復原不代表排除錳中毒；晚期即使移除暴露仍可能惡化。","dispute":"","review":{"key_points":["錳中毒＝==類巴金森症候群（parkinsonism）而非 Parkinson disease==＋==錳狂==＋錳因性肺炎","==沒有癲癇==、周邊神經病變與腎病；考量疾病：精神／中樞神經疾病、慢性呼吸道、肝、腎、接觸性皮膚","診斷須神經科或精神科專科醫師；早期移離可恢復，晚期可持續惡化"],"refs":[{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"巴 金 森 氏 症 候 群 及 錳 精 神 症 的 確 定 診 斷 應 該有神經科或精神科專科醫師的診斷"},{"src":"19_錳及其化合物作業管理分級參考","file":"_ref/分級指引/19_錳及其化合物作業管理分級參考.txt","quote":"影響呼吸道，引起錳因性肺炎"},{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"錳中毒的深腱反射增強並不顯著，病態反射也較少出現"}],"note_ref":"三、錳中毒：類巴金森症候群與蒼白核"}},{"qid":"c08q14","q":"下列職業暴露與物質之配對，何者不正確？","options":["日光燈管回收：汞","金屬鑄造與礦石冶煉：錳","塑膠安定劑製造：鉛","化學纖維（人造纖維）作業：溴丙烷"],"answer":3,"recon":"full","src":["113-5","113-11","114-03","115-01"],"optexp":["**正確（配對正確）**：日光燈與燈管製造回收是認定指引列出的汞暴露行業，115-01 回憶版「日光燈管回收：汞（o）」。","**正確（配對正確）**：錳礦冶煉精煉、錳鐵合金與金屬鑄造、焊接是錳的主要暴露作業，焊接燻煙為先進國家錳中毒主因。","**正確（配對正確）**：塑膠安定劑（硬脂酸鉛等）製造是無機鉛認定指引列為高度風險的職業，也是國內四大鉛作業行業之一。","**錯誤（本題答案，配對不正確）**：1-溴丙烷是金屬、塑膠、電子、光學產品去油製程的清洗溶劑，也用於黏著劑噴劑與乾洗，不是人造纖維作業的代表危害；黏膠人造纖維（嫘縈）製程的代表危害是二硫化碳（冠狀動脈疾病、周邊神經病變、視網膜病變）。"],"explanation":"本題考「作業→危害物」的配對總整理，是跨章節的綜合題。汞：日光燈螢光燈製造回收、氯鹼廠、溫度計血壓計、牙科汞齊、金礦汞齊、乾電池回收。錳：錳礦開採冶煉、錳鐵矽錳合金、金屬鑄造、焊接（造船、重機械）、乾電池、過錳酸鉀、農藥（Maneb）。鉛：鉛蓄電池、塑膠安定劑、印刷電路板、錫鉛焊接、金屬切割燒熔、拆船除漆、水晶玻璃、靶場。1-溴丙烷：金屬、塑膠、電子、光學零件去油清洗，黏著劑噴劑，乾洗業（取代氟氯碳化物與三氯乙烷的新興溶劑），危害為周邊神經病變（下肢麻木、步態不穩）與生殖毒性，法定檢查含 ALT、γ-GT 與血球計數，附表十二考量神經系統疾病與皮膚炎。二硫化碳：黏膠人造纖維（嫘縈 rayon）與玻璃紙製造、橡膠工業，危害為冠狀動脈疾病、腦精神行為異常、周邊神經病變、視網膜微血管瘤，附表十二考量精神神經、內分泌、腎、肝、心血管、視網膜病變、嗅覺障礙。其他常考配對：鎘→鎳鎘電池、電鍍、顏料；砷→半導體、冶煉、農藥、玻璃；鈹→航太合金、核工業、螢光燈（舊）；銦→ITO 靶材、液晶面板；鉻→電鍍、皮革鞣製、水泥；鎳→電鍍、不鏽鋼焊接。113-5 回憶版「哪個組合不對：溴丙烷 & 人造纖維」。","dispute":"","review":{"key_points":["==人造纖維（嫘縈）→二硫化碳==；==溴丙烷→金屬電子零件清洗、噴霧黏著劑、乾洗==","日光燈回收→汞；鑄造冶煉焊接→錳；塑膠安定劑、蓄電池、電路板、錫鉛焊接→鉛","鎘→鎳鎘電池電鍍；砷→半導體冶煉；銦→ITO 面板；鉻→電鍍鞣皮水泥；鎳→電鍍不鏽鋼焊接"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"尤其常見於金屬、塑膠、電子、或光學產品的去油製程，亦用於黏著劑、噴劑、或乾洗業等"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"二硫化碳危害常見於黏膠人造纖維工業"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"塑膠安定劑製造"}],"note_ref":"五、金屬與行業配對總整理"}}]},{"idx":8,"order":8,"title":"鎘、鉻、鎳、鈹、銦與其他金屬","group":"重金屬","gi":2,"notes_md":"本章 23 題，是重金屬題組裡最雜的一章：鎘、鉻、鎳、鈹、銦各有專屬的分級門檻與特徵病灶，後半段則是所有重金屬共用的通論（九項生物偵測、致癌分級、金屬線、燻煙霧滴、毒性機轉）。數字與配對記熟就能全拿。\n\n## 一、鎘及其化合物\n- 動力學：腸胃道吸收僅 ==5–10%==、肺 25–40%；鈣鐵不足吸收增加，==鋅抑制吸收（拮抗，非加成）==；吸收後與金屬硫蛋白（metallothionein）結合貯存於肝腎，生物半衰期 ==10–30 年==。\n- 排泄主要經尿，亦有相當量經膽汁隨糞便排出。**血鎘＝近期暴露；尿鎘＝身體負荷**。\n- 慢性中毒三大標的：\n  - **腎**：近端腎小管重吸收障礙→β2 微球蛋白、糖尿、胺基酸尿、磷酸尿；晚期腎絲球損害、腎結石，即使停止暴露仍持續。\n  - **骨**：骨質疏鬆、骨軟化、自發性骨折＝日本==痛痛病==。\n  - **肺**：慢性阻塞性變化與肺氣腫；急性吸入燻煙可致化學性肺炎。\n- 其他：門齒或犬齒==黃色==鎘環（鉛是黑色齒齦線）、嗅覺喪失、貧血。IARC ==Group 1==（肺癌），另與前列腺癌、腎癌有關。\n- 法定項目（附表十）：作業經歷、呼吸與胃腸症狀既往病史、==體重測量==、門齒犬齒黃色鎘環與鼻黏膜及貧血身體檢查、尿蛋白；健康檢查加==尿中鎘==；有呼吸症狀時才做肺功能（FVC、FEV1、FEV1/FVC，==無 DLCO==）。尿中鎘與肺功能變更作業者免。\n- 分級門檻：尿中鎘 ==≥5 μg/g creatinine==、蛋白尿達二價（≥100 mg/dL）、骨痛骨折、黃色鎘環。\n- 陷阱：腎小管一旦受損，鎘大量由尿排出，尿鎘就不再代表身體含量；慢性鎘中毒的表現並不具高度特異性，診斷靠暴露史＋尿鎘＋排除其他腎病。\n\n## 二、鉻酸及其鹽類\n- 特徵病灶＝==鼻中膈潰瘍與穿孔＋皮膚潰瘍（鉻潰瘍）==，另有過敏性皮膚炎、氣喘性支氣管炎；六價鉻 IARC Group 1（肺癌、鼻竇癌）。\n- 水泥含微量六價鉻，水泥工手部皮膚炎貼膚試驗最常陽性的就是==鉻酸鹽==，其次為鈷。貼膚試驗判讀時間為 48 小時及 72 或 96 小時。\n- 法定項目：呼吸系統（鼻黏膜異常、鼻中膈穿孔）與皮膚身體檢查、==從事工作四年以上加胸部 X 光==、健康檢查加尿中鉻。\n- 分級：第三級＝鼻中膈穿孔／暴露部位皮膚潰瘍／肺癌病變，輔助 PEL-TWA ≥0.025 mg/m3；第四級輔助＝工作結束後尿鉻 ≥30 μg/g creatinine 或工作中增加 ≥10 μg/g creatinine。\n- ==鉻酸沒有神經毒性==（有神經毒性的是正己烷、溴丙烷、錳、二硫化碳、鉛、汞、砷、鉈、甲苯）。\n\n## 三、鎳及其化合物\n- 危害：接觸性與過敏性皮膚炎（鎳癢症）、氣喘、氣管炎、鼻炎、鼻竇炎、鼻中膈穿孔、塵肺症；癌症為==肺癌、鼻腔癌、鼻竇癌==。**沒有周邊神經病變**。\n- 分級門檻：尿中鎳 ==≥30 μg/g creatinine（或 45 μg/L）==——單位寫錯是常考陷阱。\n- 四羰基鎳 PEL 0.001 ppm，急性暴露 2–3 天後可出現化學性肺炎。\n\n## 四、鈹與銦\n| | 鈹 | 銦 |\n|---|---|---|\n| 行業 | 國防、航太、合金 | ITO 面板、靶材回收 |\n| 病灶 | 慢性鈹病＝非乾酪性肉芽腫＋間質性肺病（類肉瘤樣） | 間質性肺病、肺纖維化、肺泡蛋白質沉著症 |\n| 生物偵測 | 尿中鈹（第四級輔助 ==≥0.4 μg/L==） | ==血清銦 ≥3 μg/L==（半衰期約 8 年，代表累積暴露） |\n| 致癌 | IARC Group 1 | 磷化銦 2A、ITO 2B |\n| 考量疾病 | 心血管、COPD、慢性氣管炎、氣喘、接觸性皮膚疾病、慢性肝炎、腎臟疾病 | 呼吸道、眼睛、皮膚疾病（附表十二寫肺部疾病），==不含心血管== |\n- 鈹的肺高壓與右心衰竭是==末期==併發症，「初期即出現肺高壓」是固定的錯誤選項。\n\n## 五、九項委託生物偵測項目與各金屬分級門檻\n- 認可辦法第 17 條可委託指定機構檢驗的九項：**血**＝鉛、汞、銦（血清）；**尿**＝鉛、鎳、無機砷、鎘、汞、鉻。記法：鎳、砷、鎘、鉻只驗尿；銦只驗血清；鉛與汞血尿皆有（依作業別）。\n- 門檻速記：鉛 男 40／女 30 μg/dL、鎘 5 μg/g Cr、鎳 30 μg/g Cr、鉻 30 μg/g Cr、無機砷 35 μg/L、無機汞尿汞 35 μg/g Cr、乙基汞血汞 10 μg/dL、鈹 0.4 μg/L、血清銦 3 μg/L。\n\n## 六、其他金屬與重金屬通論\n- **標的器官**：重金屬最常傷害==腎臟與神經系統==（肝臟主要是有機溶劑的標的）。\n- **毒性機轉**：與酵素的==硫氫基（-SH）==結合使酵素失活，續發傷害粒線體、內質網與 CYP450。鈉通道阻斷是河豚毒、抑制膽鹼酯酶是有機磷、直接斷 DNA 是游離輻射。\n- **無生理益處**：鉛、汞、鎘、砷、鉈、鈹、銦；必需微量元素則有鐵、鋅、銅、錳、鈷、硒、碘與==三價鉻==（六價鉻毒性遠大於三價鉻）。\n- **體徵配對**：垂腕＋齒齦鉛線＝鉛；黃色齒環＝鎘；震顫＋齒齦炎＝汞；類巴金森＝錳；禿髮＝鉈（暴露後 2–3 週）與砷。\n- **金屬線**：鉛線、汞線、鉍線是金屬硫化物沉積；==Mees' lines==（砷、鉈）是指甲生長暫停造成的橫向白線，**不是**金屬沉積。\n- **金屬燻煙熱**：吸入新生成的==氧化鋅、氧化銅==燻煙，數小時後發燒、寒顫、肌痛、金屬味，24–48 小時自癒，有「星期一熱」耐受現象；非過敏、非感染。\n- **暴露型態**：燻煙（fume）＝熔融金屬蒸發凝結的固態微粒（焊接、熔煉）；==霧滴（mist）＝電鍍==槽液被電解氣泡打散；蒸氣（vapor）＝溶劑揮發；粉塵＝研磨切割。\n- **IARC Group 1 金屬**：砷、鎘、六價鉻、鎳化合物、鈹；銦類最高只到 2A（磷化銦）。Group 1 有機物：苯、氯乙烯、甲醛、1,3-丁二烯、MOCA、石綿、游離輻射。2A：磷化銦、DMF、無機鉛；2B：四氯化碳、1-溴丙烷、金屬鉛。","questions":[{"qid":"c09q01","q":"依勞工健康保護規則附表十，下列何種特別危害健康作業之特殊健康檢查項目包含「體重測量」？","options":["鎘及其化合物作業","錳及其化合物作業","四烷基鉛作業","鉻酸及其鹽類作業"],"answer":0,"recon":"full","src":["113-2","113-3","114-01","114-04"],"optexp":["**符合／正確（本題答案）**：舊附表十第 25 項「鎘及其化合物作業」的特殊體格檢查與特殊健康檢查項目都列有「體重測量」，因為鎘會干擾消化道吸收、造成不明原因體重減輕；完整版指引要求用標準化體重計測量並注意體重減輕。","**不符合／錯誤**：錳及其化合物作業的法定項目是酗酒、精神、神經、肝臟及腎臟疾病既往病史調查，肺臟、神經（含巴金森症候群）及精神之身體檢查，加胸部 X 光，沒有體重測量。","**不符合／錯誤**：四烷基鉛作業的法定項目是神經、精神及心臟血管疾病既往病史，神經、精神、心臟血管及皮膚之身體檢查，尿蛋白及尿潛血，健康檢查再加尿中鉛，沒有體重測量。","**不符合／錯誤**：鉻酸及其鹽類作業的重點是呼吸系統（鼻黏膜異常、鼻中膈穿孔）與皮膚（皮膚炎、潰瘍）之身體檢查、從事四年以上加胸部 X 光、健康檢查加尿中鉻，沒有體重測量。"],"explanation":"本題考附表十各作業法定項目裡「體重測量」這個獨特項目。32 項特別危害健康作業中，只有鎘及其化合物作業把體重測量列為法定項目，體格檢查與健康檢查都要做。鎘作業其餘項目：作業經歷與自覺症狀調查、鎘引起之呼吸系統症狀與胃腸症狀既往病史調查、門齒或犬齒鎘黃色環／鼻黏膜／貧血之身體檢查、尿蛋白檢查；健康檢查另加尿中鎘（變更作業者無須檢測）；呼吸器官有自覺症狀時加做胸部身體檢查及肺功能（FVC、FEV1、FEV1/FVC，變更作業者無須檢測）。要與「既往病史調查提到體重減輕」的作業區分：鈹作業是把「體重減輕」列在既往病史調查，不是實測體重；砷、汞的慢性危害雖然都有體重減輕，法定項目也沒有體重測量。113-1 回憶版寫「監測體重：砷」是誤記，答案是鎘。","dispute":"","review":{"key_points":["鎘作業法定項目：==體重測量==、門齒或犬齒鎘黃色環、鼻黏膜及貧血之身體檢查、尿蛋白；健康檢查加尿中鎘（變更作業者免）","鎘作業的肺功能（FVC、FEV1、FEV1/FVC）只在呼吸器官有自覺症狀時做，且變更作業者免","鈹作業是「體重減輕」列在既往病史調查；砷、汞慢性中毒會體重減輕但法定項目沒有體重測量"],"refs":[{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"(３)體重測量。"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"在經過標準化的體重計測量後，應注意是否有不明原因的體重減輕"}],"note_ref":"一、鎘及其化合物"}},{"qid":"c09q02","q":"長期接觸下列何種物質，容易導致體重減輕？（選項中無鎘）","options":["砷","鉻","錳","四乙基鉛"],"answer":0,"recon":"full","src":["113-10"],"optexp":["**符合／正確（本題答案）**：分級指引砷作業慢性中毒症狀寫「體重減輕、噁心、腹瀉、衰弱、食慾不振和皮膚病」，另一條寫「體重減輕、掉頭髮、時而痢疾，時而便秘」，體重減輕是砷慢性中毒的標準敘述。","**不符合／錯誤**：鉻酸的慢性危害是鼻中膈潰瘍穿孔、鉻潰瘍、過敏性皮膚疹、氣喘與肺癌；認定指引雖提到「體重減輕、咳嗽及咳血」是慢性支氣管炎或肺癌的警訊，但那不是鉻中毒本身的表現，回憶者也註明選 B 是自己的猜測。","**不符合／錯誤**：錳的慢性危害是錐體外徑症狀（步行障礙、僵直、姿勢反射消失、肌張力不全）、精神症狀與錳因性肺炎，分級指引沒有體重減輕。","**不符合／錯誤**：四乙基鉛是脂溶性有機鉛，以中樞神經與精神症狀（失眠、幻覺、躁動）為主，法定項目是神經、精神、心臟血管及皮膚檢查，沒有體重減輕的敘述。"],"explanation":"本題考「哪些金屬的慢性中毒會體重減輕」。依分級指引原文：砷（體重減輕、掉頭髮、痢疾與便秘交替、掌蹠角化、末梢神經炎）、鎘（法定項目直接量體重，慢性中毒亦列體重減輕）、汞及其無機化合物（第三級判定條件含「明顯體重減輕」）、鈹（既往病史調查含體重減輕，慢性鈹病會虛弱、厭食、體重減輕）都會。113-10 這一版選項沒有鎘，所以答砷。可記成「砷、鎘、汞、鈹會瘦」；鉻、錳、四乙基鉛不以體重為特徵。與 c09q01 併讀：問「法定檢查項目含體重測量」答鎘；問「長期接觸容易體重減輕」而選項無鎘時答砷。","dispute":"","review":{"key_points":["慢性中毒會體重減輕的金屬：==砷、鎘、汞、鈹==；鉻、錳、四乙基鉛不以此為特徵","砷慢性中毒：體重減輕、掉頭髮、痢疾與便秘交替、掌蹠角化、末梢神經炎、皮膚癌與肺癌","汞作業第三級判定條件之一是「明顯體重減輕」；鈹作業既往病史調查含體重減輕"],"refs":[{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"慢性中毒的症狀是體重減輕、噁心、腹瀉、衰弱、食慾不振和皮膚病"},{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"體重減輕、掉頭髮、時而痢疾，時而便秘"},{"src":"14_鈹及其化合物作業管理分級參考","file":"_ref/分級指引/14_鈹及其化合物作業管理分級參考.txt","quote":"咳嗽、關節疼痛、衰弱、體重減輕、杵狀指、呼吸急促、發紺或肺癌"}],"note_ref":"六、其他金屬與重金屬通論"}},{"qid":"c09q03","q":"鎘在人體內的生物半衰期約為多久？","options":["30 天","1 年","10 年以上（10–30 年）","100 年"],"answer":2,"recon":"full","src":["113-4","113-8","114-02","114-03","115-02"],"optexp":["**不符合／錯誤**：鎘不是快速排出的物質；血中鎘反映近期暴露，但體內鎘與金屬硫蛋白結合貯存於肝腎，認定指引寫「鎘的排出速度很慢，10年僅50％」，半衰期不是以天計。","**不符合／錯誤**：1 年仍差一個數量級。完整版指引寫儲存在肺和骨骼中的鈹生物半衰期「超過 1 年」，鎘腎皮質的半衰期則是以十年計，兩者不要混淆。","**符合／正確（本題答案）**：完整版指引「鎘在人體的生物半衰期據估計在 10~30 年之間」，認定指引「人腎皮質鎘的生物半衰期是 10～30 年」；回憶版寫「10 年」或「長達數十年」都落在此範圍。","**不符合／錯誤**：沒有 100 年這種數值。鎘半衰期上限估計為 30 年，意思是停止暴露後體內負荷在餘生大部分時間仍留存，這正是「尿中鎘可反映體內累積量」的理由，但不到百年。"],"explanation":"本題考鎘的毒物動力學。鎘經呼吸道（肺內吸收約 25–40%）與消化道（吸收約 5–10%；鈣、鐵、蛋白質攝取不足時增加，攝入鋅時受抑制）進入人體，吸收後與紅血球結合，並與低分子量金屬硫蛋白（metallothionein）結合貯存於肝、腎（兩者約占體內鎘總量 60%），腎皮質是主要蓄積處，也是早期標的器官。排泄主要經腎臟由尿排出，也有相當量經膽汁隨糞便排出，但速度極慢，「10 年僅排出 50%」，生物半衰期估計 10–30 年。臨床意義：血中鎘代表最近暴露，尿中鎘代表身體負荷，停止暴露多年後尿鎘仍偏高；分級門檻尿鎘 ≥5 μg/g creatinine。對照記憶：鉛血中半衰期約 1–2 個月、骨鉛數年至數十年；血清銦可長達約 8 年；無機砷約 1–4 天、甲基化代謝物（MMA、DMA）約 30 小時。","dispute":"","review":{"key_points":["鎘生物半衰期 ==10–30 年==，10 年僅排出 50%，主要蓄積於腎皮質與肝","鎘與金屬硫蛋白結合貯存；血鎘＝近期暴露，尿鎘＝身體負荷","對照：血鉛半衰期 1–2 個月、骨鉛數年至數十年；血清銦約 8 年；無機砷 1–4 天"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"鎘在人體的生物半衰期據估計在10~30年之間"},{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"人腎皮質鎘的生物半衰期是10～30年"},{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"鎘的排出速度很慢，10年僅50％"}],"note_ref":"一、鎘及其化合物"}},{"qid":"c09q04","q":"有關鎘中毒之敘述，下列何者正確？","options":["鎘中毒者不易發生骨折","鎘在人體之半衰期長達十年以上","鎘對腎臟的影響通常較小","鎘會與骨骼中的鈣結合而減少骨骼疾病"],"answer":1,"recon":"full","src":["113-4","113-8","115-02"],"optexp":["**不符合／錯誤**：慢性鎘中毒晚期會出現骨質疏鬆、骨軟化與自發性骨折（多發性病理性骨折即痛痛病），骨折正是典型表現，不是「不易骨折」。","**符合／正確（本題答案）**：認定指引「人腎皮質鎘的生物半衰期是 10～30 年」，完整版估計 10–30 年，長達十年以上，排出極慢。","**不符合／錯誤**：腎臟是慢性鎘中毒最早的標的器官：近端腎小管重吸收障礙造成 β2 微球蛋白尿、糖尿、胺基酸尿、高磷酸尿，晚期腎絲球損害、腎結石、腎衰竭，且停止暴露後腎功能障礙仍持續。","**不符合／錯誤**：鎘不是與骨鈣結合來保護骨骼，而是抑制腎小管功能使維生素 D 製造不足、鈣磷重吸收減少，間接引起骨質疏鬆與骨軟化，骨骼疾病是增加不是減少。"],"explanation":"本題考慢性鎘中毒的全貌。腎：早期為近端腎小管重吸收功能障礙，尿中出現低分子量蛋白（β2 微球蛋白）、葡萄糖尿、高胺基酸尿、高磷酸尿（Fanconi 樣症候群），繼之高分子量蛋白（白蛋白、轉鐵蛋白）也因腎絲球損害排泄增加，晚期腎功能衰竭且不可逆，也會腎結石。骨：全身骨痛、骨質疏鬆、骨軟化、自發性骨折，即日本神通川流域的痛痛病。肺：長期吸入約 100 μg/m3 可造成慢性進行性阻塞性肺氣腫，最終肺心症，肺功能異常通常在蛋白尿之後出現。其他：慢性鼻炎合併嗅覺喪失、門牙及犬齒頸部黃色鎘環、體重減輕、低色素性貧血（鎘阻礙腸道鐵吸收）、神經精神異常。致癌：IARC Group 1（肺癌）。113-4 版本以「牙齒整個變黑」當錯誤選項：鎘環是黃色，黑色或藍紫色齒齦線是鉛。","dispute":"","review":{"key_points":["慢性鎘中毒＝==腎小管障礙（β2 微球蛋白尿）＋骨軟化自發性骨折（痛痛病）==＋肺氣腫","門齒犬齒==黃色==鎘環、嗅覺喪失、貧血；黑色齒齦線是鉛","鎘半衰期 10–30 年；腎功能障礙即使不再暴露仍持續"],"refs":[{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"早期表現為近端腎小管重吸收功能障礙，尿中出現低分子蛋白"},{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"全身骨痛，伴不同程度骨質疏鬆、骨軟化症、自發性骨折和嚴重腎小管功能障礙綜合症"},{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"門牙及犬齒的頸部出現黃色環、體重減輕"}],"note_ref":"一、鎘及其化合物"}},{"qid":"c09q05","q":"有關鎘之毒理，下列敘述何者錯誤？","options":["小鼠實驗中，經消化道進入的鎘約 88% 由糞便排出，僅約 1% 經腎或肝代謝","體內鎘主要經由腸胃道及尿液排出","鎘經腸道吸收後，在血液中與金屬硫蛋白（metallothionein）結合運送","鎘之毒性主要因抑制含硫氫基（sulfhydryl）之酵素，且此毒性與鋅具有加成作用"],"answer":3,"recon":"full","src":["113-9","114-02"],"optexp":["**正確**：口服鎘的吸收率只有約 5%（人體 5–10%），絕大部分隨糞便排出；動物實驗中腸胃道排泄量也高於尿液，回憶版「88% 由糞便排出、僅約 1% 經腎或肝代謝」與此一致。","**正確**：認定指引「進入體內的鎘主要通過腎臟經尿排出，但也有相當數量由肝臟經膽汁隨糞便排出」，腸胃道與尿液是兩條排泄路徑。","**正確**：鎘吸收入血液後主要與紅血球結合，並與低分子量的金屬硫蛋白（metallothionein）結合而停留於體內、蓄積於肝腎。","**錯誤（本題答案）**：鎘毒性確與抑制含硫氫基的酵素有關，但鋅對鎘是拮抗而不是加成——鋅誘導金屬硫蛋白合成並與鎘競爭，認定指引明寫「攝入鋅時，鎘的吸收可被抑制」；鈣、鐵攝入不足才會增加鎘吸收。"],"explanation":"本題考鎘的吸收、運送、排泄與拮抗關係。吸收：肺內約 25–40%，腸胃道僅 5–10%（鈣、鐵、蛋白質攝取不足時增加；鋅抑制），皮膚吸收微乎其微。分布：血中與紅血球結合，組織中與金屬硫蛋白結合，肝與腎貯存約體內總量 60%（40–60 歲正常人體內約 30 mg，腎 10 mg、肝 4 mg）。排泄：主要經尿，也有相當量經膽汁隨糞便排出；非暴露者每日尿排 0.5–2.0 μg/L 或體內蓄積量的 0.01%；半衰期 10–30 年。機轉：鎘與含硫氫基（-SH）的酵素結合使其失活，並抑制腎小管功能造成維生素 D 不足與鈣磷流失；鋅可誘導金屬硫蛋白、與鎘競爭，對鎘毒性有保護作用。114-01 版本直接考「鈣、鐵攝取不足時鎘吸收增加，鋅攝取增加時吸收反被抑制」，是同一考點。","dispute":"","review":{"key_points":["鎘腸胃道吸收率僅 ==5–10%==，肺 25–40%；鈣鐵不足吸收增加，==鋅抑制吸收==（拮抗非加成）","吸收後與紅血球及金屬硫蛋白（metallothionein）結合，貯存肝腎（約 60%）","排泄主要經尿，亦有相當量經膽汁隨糞便排出；半衰期 10–30 年"],"refs":[{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"例如鈣、鐵攝入量低時，鎘吸收可明顯增加，而攝入鋅時，鎘的吸收可被抑制"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"因腸胃道對鎘的吸收率只有5％"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"主要是和一種低分子量的金屬結合蛋白質（metallothionin）結合"}],"note_ref":"一、鎘及其化合物"}},{"qid":"c09q06","q":"有關鎘之敘述，下列何者錯誤？","options":["動物實驗顯示鎘無致癌性","鎘對人體無明顯生理益處","IARC 將鎘及其化合物列為第一類致癌物","長期暴露可造成腎臟永久性傷害與腎結石"],"answer":0,"recon":"partial","src":["113-10","113-8"],"optexp":["**錯誤（本題答案）**：分級指引「鎘可能導致人類罹患前列腺癌及腎癌，動物罹患肺癌及睪丸癌」，動物實驗明確有致癌性；認定指引也寫 IARC 因吸入鎘確定增加肺癌而列為第一類致癌物。","**正確**：鎘是非必需的毒性金屬，對人體沒有任何已知生理功能或益處，與鋅、鐵、銅、三價鉻等必需微量元素不同。","**正確**：IARC 將鎘及鎘化合物列為 Group 1 人類致癌物，主要證據是職業吸入暴露造成的肺癌，前列腺癌則屬可能相關。","**正確**：分級指引「長期低濃度暴露會導致腎永久性傷害，造成腎結石，亦會損害肝臟」；晚期腎功能障礙即使停止暴露仍持續存在。"],"explanation":"本題考鎘的致癌性與器官毒性。IARC 於 1993 年（完整版另記 2009 年再確認）將鎘與鎘化合物列為 Group 1，證據來自職業吸入暴露的肺癌；前列腺癌、腎癌為可能相關（前列腺癌證據等級 2A），動物實驗則有肺癌與睪丸癌。鎘同時可能損害男性睪丸及女性生殖系統，並具致畸胎性。器官毒性以腎（永久性腎小管傷害、腎結石、蛋白尿）、骨（骨質疏鬆、骨痛、自發性骨折）、肺（慢性鼻炎、咽喉炎、慢性阻塞性肺病）為主，另有貧血、舌味覺喪失、疲勞、牙齒黃斑。「對人體無明顯生理益處」是鉛、汞、鎘共同的特徵（見 c09q22）。113-10 版本問法相同：「動物實驗無致癌性」為錯，「對身體無明顯益處」為對。","dispute":"","review":{"key_points":["鎘為 IARC ==Group 1==（肺癌）；人類可能前列腺癌、腎癌，動物肺癌與睪丸癌","鎘長期低濃度暴露→腎永久性傷害、腎結石，亦損害肝臟","鎘、鉛、汞皆為對人體無已知生理益處的毒性金屬"],"refs":[{"src":"24_鎘及其化合物作業管理分級參考","file":"_ref/分級指引/24_鎘及其化合物作業管理分級參考.txt","quote":"鎘可能導致人類罹患前列腺癌及腎癌，動物罹患肺癌及睪丸癌"},{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"吸入鎘確定會增加肺癌的發生率，故將鎘的致癌分類列為第一類致癌物"},{"src":"24_鎘及其化合物作業管理分級參考","file":"_ref/分級指引/24_鎘及其化合物作業管理分級參考.txt","quote":"長期低濃度暴露會導致腎永久性傷害，造成腎結石，亦會損害肝臟"}],"note_ref":"一、鎘及其化合物"}},{"qid":"c09q07","q":"有關鎘中毒之敘述，下列何者錯誤？","options":["鎘於人體中之半衰期長達數十年","停止暴露多年後，仍可由尿中鎘濃度評估體內累積含量","鎘對人體並無已知的好處","慢性鎘中毒具有高度特異性、可單憑臨床表現診斷之症狀"],"answer":3,"recon":"full","src":["114-02","114-03","114-04"],"optexp":["**正確**：鎘的生物半衰期估計 10–30 年，長達數十年，這是四個選項中最無爭議的一句。","**正確**：尿中鎘反映身體負荷量（腎皮質累積量），因半衰期極長，停止暴露多年後仍可由尿鎘評估體內含量，完整版指引寫「尿中的鎘可表示身體的含量」。例外是腎小管已受損時鎘大量從尿排出，尿鎘便不再代表身體含量。","**正確**：鎘對人體沒有已知的生理功能或好處。","**錯誤（本題答案）**：慢性鎘中毒的腎小管障礙、蛋白尿、骨痛、貧血、肺氣腫都是非特異性表現，指引描述鎘暴露勞工「被檢查出有一些非特異性的徵狀」；診斷要靠職業暴露史、尿鎘大於 5 μg/g creatinine 與排除其他腎臟病，不能單憑臨床表現。"],"explanation":"本題考鎘生物偵測的意義與慢性鎘中毒的診斷邏輯。血中鎘代表最近的暴露量；尿中鎘代表身體負荷（腎皮質蓄積量），正常情況小於 5 μg/g creatinine，單泡尿必須同時測尿肌酸酐才能換算；當腎臟中鎘濃度達臨界值後，尿鎘也會直接受最近暴露影響；腎小管一旦受損、鎘大量從尿流失，尿鎘就失去代表性，此時指引建議複檢血中鎘、採樣工作區空氣並仔細評估腎功能。認定指引的診斷基準是：鎘暴露史＋符合鎘中毒的腎臟病變或骨骼損害＋暴露在前的時序性＋合理排除其他原因；也就是說臨床表現本身不具特異性，必須靠暴露證據與生物偵測。四個選項中 A、C 明確正確，B 與 D 是回憶版兩派爭點，本題以 D 為錯誤選項，理由見爭議註記。","dispute":"回憶版三個版本（114-02、114-03、114-04）選項一致，但都沒有載明正解。114-04 回憶者認為錯在「尿中鎘」（理由是指引用 24 小時尿或 μg/g creatinine 換算，單看尿鎘濃度不準）；114-03 回憶者查資料後認為「停止暴露多年後尿鎘仍反映體內存量」可能是對的。依完整版指引原文「尿中鎘反映身體負荷量」「尿中的鎘可表示身體的含量」，加上半衰期 10–30 年，停止暴露多年後尿鎘仍可評估累積量，B 的敘述成立（只有在鎘已引起腎病變時尿鎘才失去價值）。相對地，慢性鎘中毒的表現（腎小管障礙、骨軟化、貧血、肺氣腫）都不具特異性，指引明寫要靠暴露史、尿鎘大於 5 μg/g creatinine 與排除其他腎病才能診斷，所以 D「具高度特異性、可單憑臨床表現診斷」與原文不符。本題以 D 為錯誤選項；應試時若題目把 B 改寫成「尿鎘不能反映體內負荷」，那句才是錯的。","review":{"key_points":["血中鎘＝最近暴露；尿中鎘＝身體負荷，正常 ==\u003c5 μg/g creatinine==，須同時測尿肌酸酐換算","腎小管受損後鎘大量由尿排出，尿鎘不再代表身體含量→複檢血鎘、環測與腎功能","慢性鎘中毒表現非特異，診斷靠暴露史＋尿鎘 >5 μg/g Cr＋排除其他腎病"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"尿中鎘反映身體負荷量"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"尿中的鎘可表示身體的含量。但是在腎功能被破壞後，因為鎘大量從尿中排出，就不能再代表身體的含量"},{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"慢性鎘中毒常發生腎小管機能的障礙，此時應先排除其他可能引起腎臟病的原因"}],"note_ref":"一、鎘及其化合物"}},{"qid":"c09q08","q":"有關鎘作業特殊健康檢查之項目與判讀，下列何者錯誤？","options":["尿中鎘（健康檢查項目，變更作業者無須檢測）","肺功能檢查包含 FEV1、FVC 及一氧化碳擴散能力（DLCO）","尿蛋白檢查","門齒或犬齒鎘黃色環之身體檢查"],"answer":1,"recon":"full","src":["113-6"],"optexp":["**正確**：尿中鎘是特殊健康檢查項目，附表十註明「變更作業者無須檢測」，也就是受僱或變更作業時的體格檢查不含此項。","**錯誤（本題答案）**：附表十規定呼吸器官有自覺症狀時實施胸部身體檢查及肺功能檢查，內容是用力肺活量（FVC）、一秒最大呼氣量（FEV1）及 FEV1/FVC，沒有一氧化碳擴散能力（DLCO）；所有作業的法定肺功能都只有這三項。","**正確**：尿蛋白檢查是鎘作業體格檢查與健康檢查都要做的項目，蛋白尿達二價（≥100 mg/dL）是第三、四級管理的判定條件之一。","**正確**：門齒或犬齒鎘黃色環、鼻黏膜及貧血之身體檢查是法定項目，門齒犬齒黃色鎘環也是第三、四級管理的判定依據。"],"explanation":"本題考鎘作業法定項目的細節與分級門檻。項目：作業經歷調查、鎘引起之呼吸器官症狀與胃腸症狀既往病史、體重測量、門齒或犬齒鎘黃色環／鼻黏膜／貧血之身體檢查、尿蛋白；健康檢查加尿中鎘（變更作業者免）；呼吸器官有自覺症狀時加胸部身體檢查及肺功能（FVC、FEV1、FEV1/FVC，變更作業者免）。分級：第三級為骨頭病變、骨痛、自發性骨折、門齒犬齒黃色鎘環、蛋白尿達二價（≥100 mg/dL）或尿中鎘 ≥5 μg/g creatinine，且無法由工作以外原因解釋；第四級為相同表現且可由工作相關原因解釋。異常追蹤：貧血者查血清鐵、鐵蛋白、TIBC 排除缺鐵；蛋白尿者 1 週至 3 個月內複檢，持續異常可收 24 小時尿測肌酸酐廓清率；尿鎘 >5 時建議複檢血鎘與環測。DLCO 只在指引描述石綿肺、慢性鈹病等臨床評估時出現，不是任何作業的法定項目。","dispute":"","review":{"key_points":["鎘作業肺功能＝FVC、FEV1、FEV1/FVC，==無 DLCO==，且只在呼吸器官有自覺症狀時做","鎘分級門檻：尿鎘 ==≥5 μg/g creatinine==、蛋白尿達二價（≥100 mg/dL）、骨痛骨折、黃色鎘環","尿中鎘與肺功能都是健康檢查項目，變更作業者無須檢測"],"refs":[{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"呼吸器官有自覺症狀時，應實施胸部身體檢查及肺功能檢查"},{"src":"24_鎘及其化合物作業管理分級參考","file":"_ref/分級指引/24_鎘及其化合物作業管理分級參考.txt","quote":"2.2尿中鎘濃度≥5μg/gcreatinine"},{"src":"24_鎘及其化合物作業管理分級參考","file":"_ref/分級指引/24_鎘及其化合物作業管理分級參考.txt","quote":"有骨頭病變、骨痛、自發性骨折、門齒犬齒有黃色"}],"note_ref":"一、鎘及其化合物"}},{"qid":"c09q09","q":"水泥工人的手部皮膚炎，貼膚試驗（patch test）最常呈陽性的物質為何？","options":["六價鉻（chromate）","鈷","甲醛","對苯二胺"],"answer":0,"recon":"full","src":["113-2","113-4","113-8","113-11"],"optexp":["**符合／正確（本題答案）**：水泥原料含微量六價鉻（鉻酸鹽），是水泥工過敏性接觸皮膚炎最常見的過敏原；鉻酸認定指引把「水泥工人」列為潛在暴露職業並註明鉻過敏性皮膚炎可用皮膚貼布試驗證實，皮膚病指引列台灣常見接觸過敏原第一位就是鉻。","**不符合／錯誤**：鈷也存在於水泥並可致敏，但貼膚陽性率次於鉻，且常與鉻同時陽性，不是最常見。","**不符合／錯誤**：甲醛是防腐劑、樹脂、皮革與食品加工業的過敏原，不是水泥的成分。","**不符合／錯誤**：對苯二胺（PPD）是染髮劑、橡膠與皮革染料的過敏原（美髮業），與水泥無關。"],"explanation":"本題考職業性接觸皮膚炎的過敏原配對。鉻：水泥（建築業）、電鍍、製革（三價鉻鞣劑）、不鏽鋼焊接、印刷，六價鉻水溶性高、易穿透皮膚致敏；鎳：電鍍、金屬飾品，是最常見的金屬過敏原（約影響 30% 人口，女多於男）；鈷：水泥、硬質合金；環氧樹脂：塑膠、黏著劑、電子業；thiuram、carbamate：橡膠手套；對苯二胺：染髮劑；甲醛：防腐劑。皮膚病指引列台灣常見引起接觸性皮膚炎的物質為鉻、鎳、鈷、香料、環氧樹脂、thiuram、丁香酚、對苯二胺。診斷靠貼膚試驗，判讀時間為貼膚後 48 小時及 72 或 96 小時。113-8 回憶「鉻是水泥還原劑」說法不精確：水泥中的鉻是原料雜質，業界反而會添加還原劑把六價鉻還原成三價以降低致敏。","dispute":"","review":{"key_points":["水泥工手部皮膚炎貼膚試驗最常陽性：==六價鉻==；其次鈷","台灣常見接觸過敏原：鉻、鎳、鈷、香料、環氧樹脂、thiuram、丁香酚、對苯二胺","貼膚試驗判讀時間：48 小時及 72 或 96 小時"],"refs":[{"src":"職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引","file":"_ref/認定指引/all/職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引.txt","quote":"鉻過敏性皮膚炎可用皮膚貼布試驗來證實"},{"src":"職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引","file":"_ref/認定指引/all/職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引.txt","quote":"水泥工人cementworker"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"引起接觸性皮膚炎物質為鉻(chromium)、鎳(nickel),鈷(cobalt)"}],"note_ref":"二、鉻酸及其鹽類"}},{"qid":"c09q10","q":"鉻酸及其鹽類作業最具特徵的健康危害為何？","options":["鼻中膈穿孔與皮膚潰瘍（鉻瘡）","類巴金森症候群","膜性腎絲球腎炎","肝血管肉瘤"],"answer":0,"recon":"full","src":["113-4","113-11","114-03","整理-表格"],"optexp":["**符合／正確（本題答案）**：六價鉻霧滴或粉塵反覆暴露造成鼻中膈潰瘍進而穿孔（0.18–1.4 mg/m3 暴露 2 週刺激、4 週潰瘍、8 週穿孔），皮膚接觸造成無痛性腐蝕潰瘍即鉻孔／鉻瘡；兩者都是分級指引第三、四級的判定依據。","**不符合／錯誤**：類巴金森症候群是錳（以及二硫化碳）的慢性神經毒性，鉻酸沒有神經毒性。","**不符合／錯誤**：膜性腎絲球腎炎是無機汞的免疫性腎病變；鉻的腎損害是近端腎小管傷害與急性腎衰竭。","**不符合／錯誤**：肝血管肉瘤是氯乙烯（以及無機砷、二氧化釷）的特徵癌症；鉻酸的職業癌是肺癌（六價鉻 IARC Group 1）與鼻竇癌。"],"explanation":"本題考鉻酸及其鹽類作業的特徵危害與法定項目。急性：吸入霧滴刺激眼鼻喉呼吸道、氣喘性支氣管炎；皮膚急性刺激性或過敏性皮膚炎；食入腸胃出血、急性腎衰竭、肝壞死；濺到眼睛可致嚴重角膜損害。慢性：鼻中膈潰瘍與穿孔、鉻潰瘍（手指甲根部、前臂、指關節、指蹼）、過敏性皮膚炎、慢性咽喉炎與支氣管炎、肝炎黃疸，六價鉻為 IARC Group 1 肺癌，鉻酸鹽顏料業另有鼻竇癌。法定項目：咳嗽、咳痰、胸痛、鼻腔異常、皮膚症狀既往病史；呼吸系統（鼻黏膜異常、鼻中膈穿孔）及皮膚（皮膚炎、潰瘍）身體檢查；從事四年以上加胸部 X 光；健康檢查加尿中鉻（變更作業者免）。分級：第三級為鼻中膈穿孔、暴露部位皮膚潰瘍或肺部癌症病變，輔助基準 PEL-TWA ≥0.025 mg/m3；第四級加尿中鉻（可溶性）工作結束後 ≥30 μg/g creatinine 或工作中增加 ≥10 μg/g creatinine。PEL-TWA 六價鉻 0.05 mg/m3。","dispute":"","review":{"key_points":["鉻酸特徵＝==鼻中膈穿孔＋鉻潰瘍==＋過敏性皮膚炎＋氣喘；六價鉻 IARC Group 1（肺癌、鼻竇癌）","鉻酸作業法定項目：呼吸系統與皮膚身體檢查、==四年以上加胸部 X 光==、健檢加尿中鉻","分級：第三級鼻中膈穿孔／皮膚潰瘍／肺癌，PEL-TWA ≥0.025 mg/m3；第四級尿鉻 ≥30 μg/g Cr 或工作中增加 ≥10"],"refs":[{"src":"23_鉻酸及其鹽類作業管理分級參考","file":"_ref/分級指引/23_鉻酸及其鹽類作業管理分級參考.txt","quote":"反覆或長期暴露於鉻酸粉塵或霧滴可能導致鼻中膈潰瘍及穿孔"},{"src":"職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引","file":"_ref/認定指引/all/職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引.txt","quote":"無痛性腐蝕潰瘍，且很久才會癒合，稱為鉻孔(chromeholes)"},{"src":"23_鉻酸及其鹽類作業管理分級參考","file":"_ref/分級指引/23_鉻酸及其鹽類作業管理分級參考.txt","quote":"從事工作四年以上者，應實施胸部"}],"note_ref":"二、鉻酸及其鹽類"}},{"qid":"c09q11","q":"下列何者沒有神經毒性？","options":["正己烷","1-溴丙烷","鉻酸","錳"],"answer":2,"recon":"full","src":["113-6","113-11"],"optexp":["**不符合／錯誤（有神經毒性）**：正己烷經代謝成 2,5-己二酮，長期暴露 500 ppm 以下即影響手腳神經，造成遠端感覺運動多發性神經病變。","**不符合／錯誤（有神經毒性）**：1-溴丙烷的慢性神經學症狀是肢體麻木、刺痛、走路困難、自覺聽力異常、手部反應變慢、耳鳴、嗜睡，兼具中樞與末梢神經毒性。","**符合／正確（本題答案）**：鉻酸的危害集中在鼻黏膜與皮膚潰瘍、呼吸道刺激、氣喘與肺癌，分級指引與認定指引都沒有神經毒性的記載。","**不符合／錯誤（有神經毒性）**：錳造成錐體外徑症狀（步行障礙、轉身困難、僵直、姿勢反射消失、肌張力不全）與精神症狀，法定項目要做含巴金森症候群的神經身體檢查。"],"explanation":"本題考特別危害物質「有無神經毒性」的歸類。有神經毒性：正己烷（周邊）、溴丙烷（中樞加周邊）、錳（基底核、類巴金森）、二硫化碳（精神人格異常、類巴金森、周邊神經、聽神經）、鉛與四烷基鉛、汞（震顫、erethism）、砷（末梢神經炎）、鉈、甲苯（中樞、小腦、白質病變）、三氯乙烯（三叉神經）、一氧化碳、有機磷、氯乙烯（三叉神經、錐體外症候群）、四氯乙烷。沒有神經毒性：鉻酸、鎳（僅四羰基鎳急性中毒後期腦水腫）、鈹、銦、石綿、粉塵，苯以血液毒性為主（高濃度只有麻醉作用）。分級指引溴丙烷章還特別列出需鑑別的其他神經毒物：鉛、有機磷、二硫化碳、丙烯醯胺、正己烷、苯、甲苯、三氯乙烯。113-6 版本問法完全相同，答鉻酸。","dispute":"","review":{"key_points":["無神經毒性的特化物：==鉻酸==、鎳、鈹、銦；有的：正己烷、溴丙烷、錳、二硫化碳、鉛、汞、砷、鉈、甲苯","正己烷→周邊神經；溴丙烷→中樞加周邊；錳→錐體外徑（類巴金森）","鉻酸危害＝黏膜皮膚潰瘍、氣喘、肺癌"],"refs":[{"src":"12_正己烷作業管理分級參考","file":"_ref/分級指引/12_正己烷作業管理分級參考.txt","quote":"會影響手及腳的神經，嚴重時可造成周圍神經炎"},{"src":"27_溴丙烷作業管理分級參考","file":"_ref/分級指引/27_溴丙烷作業管理分級參考.txt","quote":"肢體麻木、刺痛感、走路困難、自覺聽力異常、手部反應變"},{"src":"19_錳及其化合物作業管理分級參考","file":"_ref/分級指引/19_錳及其化合物作業管理分級參考.txt","quote":"出現錐體外徑之神經症狀和徵候"}],"note_ref":"二、鉻酸及其鹽類"}},{"qid":"c09q12","q":"鎳及其化合物作業之特殊健康檢查應注意之健康危害表現，下列何者不包括？","options":["皮膚暴露部位之接觸性或過敏性皮膚炎","鼻中膈穿孔、鼻炎、鼻竇炎","氣喘、氣管炎","周邊神經病變"],"answer":3,"recon":"partial","src":["113-3","114-03","114-01"],"optexp":["**正確（包括）**：鎳是最常見的金屬過敏原，造成接觸性及過敏性皮膚炎、鎳癢症；皮膚暴露部位的接觸性或過敏性皮膚炎是第三、四級的判定條件。","**正確（包括）**：慢性吸入鎳造成鼻炎、鼻竇炎、鼻中膈穿孔，長期暴露另致鼻腔癌與鼻竇癌。","**正確（包括）**：氣喘、氣管炎與塵肺症是鎳的慢性呼吸道危害，急性則有呼吸道刺激、金屬燻煙熱與肺炎。","**錯誤（本題答案）**：鎳的分級與認定指引都沒有周邊神經病變；唯一與神經相關的是四羰基鎳急性中毒後期的腦水腫、譫妄與癲癇，屬中樞而非周邊，且不是一般鎳作業的健檢重點。"],"explanation":"本題考鎳及其化合物的健康危害範圍。急性：金屬燻煙刺激呼吸道（咳嗽、呼吸急促、胸緊）、金屬燻煙熱、氣喘、肺炎、過敏性皮膚炎、眼睛及黏膜刺激；四羰基鎳極毒（PEL-TWA 0.001 ppm），吸入初期只有頭痛噁心，2–3 天後化學性肺炎與肺水腫，5–15 天可進展至腦水腫。慢性：接觸性及過敏性皮膚炎（鎳癢症）、氣喘、氣管炎、鼻炎、鼻竇炎、塵肺症、鼻中膈穿孔；鎳化合物為 IARC Group 1，職業癌為肺癌、鼻腔癌、鼻竇癌。法定項目：呼吸系統與皮膚系統既往病史；鼻腔、皮膚、呼吸道、腸胃及神經系統之身體檢查（項目名稱雖含神經系統，指引的危害清單並無神經病變）；胸部 X 光；尿蛋白、尿潛血、尿沉渣；肌酸酐；血球比容、血色素、紅血球、白血球；肺功能；健康檢查加尿中鎳。分級門檻：尿中鎳 ≥30 μg/g creatinine（或 45 μg/L）。114-01 新題「造成皮膚紅疹角化的是鎳」亦屬此範圍。","dispute":"","review":{"key_points":["鎳危害：==過敏性皮膚炎（鎳癢症）、氣喘、鼻炎鼻竇炎、鼻中膈穿孔、塵肺症==，癌症為肺癌鼻腔癌鼻竇癌；無周邊神經病變","尿中鎳分級門檻 ==≥30 μg/g creatinine（或 45 μg/L）==","四羰基鎳 PEL 0.001 ppm，急性中毒 2–3 天後化學性肺炎，5–15 天可腦水腫"],"refs":[{"src":"25_鎳及其化合物作業管理分級參考","file":"_ref/分級指引/25_鎳及其化合物作業管理分級參考.txt","quote":"接觸性及過敏性皮膚炎，鎳癢症"},{"src":"25_鎳及其化合物作業管理分級參考","file":"_ref/分級指引/25_鎳及其化合物作業管理分級參考.txt","quote":"氣喘、氣管炎、鼻炎、鼻竇炎和塵肺症"},{"src":"25_鎳及其化合物作業管理分級參考","file":"_ref/分級指引/25_鎳及其化合物作業管理分級參考.txt","quote":"尿中鎳濃度≥30μg/gcreatinine(或45μg/L)"}],"note_ref":"三、鎳及其化合物"}},{"qid":"c09q13","q":"下列何者為認可醫療機構得委託指定機構辦理之九項生物偵測項目？","options":["血清銦、尿中無機砷、血中汞","尿中銦、血中砷、血中鎳","血中鉻、血中鎘、尿中錳","血中鈹、尿中鈹、血中鎳"],"answer":0,"recon":"full","src":["113-1","113-2","113-3","113-4","113-10","113-11","114-04"],"optexp":["**符合／正確（本題答案）**：認可辦法第 17 條列出得委託指定機構辦理的九項：血中鉛、尿中鉛、尿中鎳、尿中無機砷、尿中鎘、血中汞、尿中汞、尿中鉻、血清銦，A 的三項全在其中。","**不符合／錯誤**：銦的法定項目是血清銦不是尿中銦；砷是尿中無機砷不是血中砷；鎳只有尿中鎳沒有血中鎳。","**不符合／錯誤**：鉻是尿中鉻、鎘是尿中鎘，都不是血中；錳作業法定項目沒有生物偵測，血錳 ≥1 μg/dL 或尿錳 ≥3 μg/g creatinine 只是第四級判定的輔助值。","**不符合／錯誤**：鈹作業法定項目沒有血鈹或尿鈹（尿鈹 ≥0.4 μg/L 只是第四級的輔助判定），鎳是尿中鎳不是血中鎳。"],"explanation":"本題考「辦理勞工體格與健康檢查醫療機構認可及管理辦法」第 17 條：檢查項目除血中鉛、尿中鉛、尿中鎳、尿中無機砷、尿中鎘、血中汞、尿中汞、尿中鉻、血清銦或其他經中央主管機關指定公告之項目，得由指定公告之機構辦理外，不得委託其他機構；受委託機構應取得第三者認證機構之有效認證。記法：血＝鉛、汞、銦（血清）；尿＝鉛、鎳、無機砷、鎘、汞、鉻。鉛與汞血尿都有（血中鉛對應鉛作業、尿中鉛對應四烷基鉛作業；血中汞對應乙基汞作業、尿中汞對應汞及其無機化合物作業），鎳、砷、鎘、鉻只有尿，銦只有血清。這九項也正對應附表十各作業的法定生物偵測項目；除鉛作業的血中鉛在體格檢查與健康檢查都要做之外，其餘多為健康檢查項目且註明變更作業者無須檢測（砷只免測 MMA、DMA）。114-04 回憶「血清銦／尿砷／血汞（o），9 種要唸熟」。","dispute":"","review":{"key_points":["九項委託生物偵測：血＝==鉛、汞、銦（血清）==；尿＝==鉛、鎳、無機砷、鎘、汞、鉻==","鎳、砷、鎘、鉻只驗尿；銦只驗血清；鉛與汞血尿皆有（依作業別）","受委託檢驗機構須取得第三者認證；受委託檢驗機構須取得第三者認證；血中鉛在鉛作業體格與健康檢查都要做，其餘多為健康檢查項目、變更作業者免"],"refs":[{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"除血中鉛、尿中鉛、尿中鎳、尿中無機砷、尿中鎘、血中汞、尿中汞、尿中鉻、血清銦"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"前項受委託辦理檢驗之機構，應取得第三者認證機構之有效認證"}],"note_ref":"五、九項委託生物偵測項目與各金屬分級門檻"}},{"qid":"c09q14","q":"有關鈹及其化合物之敘述，下列何者錯誤？","options":["可造成間質性肺病與類肉瘤樣肉芽腫病變（慢性鈹病）","國防、航太工業可能使用鈹合金","有慢性肝炎者不適合從事鈹作業","暴露初期即會出現肺高壓"],"answer":3,"recon":"full","src":["113-4","113-11","114-01","114-04","114-05"],"optexp":["**正確**：慢性鈹病是非乾酪性肉芽腫與間質性發炎反應（肉芽腫纖維化），以肺為主，肝、脾、心臟、淋巴結也可見；影像與類肉瘤症難以區分，靠鈹淋巴球增生試驗（BeLPT）鑑別。","**正確**：鈹質輕、耐金屬疲勞、無磁性、耐腐蝕，認定指引寫「在國防和電子工業上有相當重要的用途」，也用於人造衛星、太空船、飛機零件與核工業中子減速劑。","**正確**：分級指引與附表十二鈹作業考量疾病包含心血管疾病、慢性阻塞性肺疾病、慢性氣管炎、氣喘、接觸性皮膚疾病、慢性肝炎、酒精性肝炎、腎臟疾病。","**錯誤（本題答案）**：肺高壓、心肺症與右心室衰竭是慢性鈹病「末期」的併發症，續發於肺纖維化與肺功能受損，不是暴露初期的表現；初期是急性化學性肺炎或無症狀的致敏。"],"explanation":"本題考鈹的疾病譜與時序。急性：高濃度（大於 1000 μg/m3）造成上下呼吸道發炎、化學性肺炎、肺水腫；受傷皮膚接觸可致接觸性皮膚炎、潰瘍與皮下肉芽腫（完整皮膚不吸收）。慢性鈹病（CBD）：細胞媒介的遲發性過敏，沉積肺部的鈹刺激 T 細胞增生，發炎細胞堆積形成肉芽腫纖維化；症狀乾咳、喘、哮鳴、發燒、盜汗、體重減輕、杵狀指；肺功能可為侷限、阻塞或混合型並 DLCO 下降；末期肺高壓、右心衰竭；腎病變致高尿鈣、腎結石（可達 30%）。IARC Group 1（肺癌）。法定項目：咳嗽、呼吸困難、體重減輕、皮膚炎、肝及關節病變既往病史；呼吸系統、肝臟、腎臟及皮膚身體檢查；胸部 X 光；肺功能；沒有生物偵測，尿鈹 ≥0.4 μg/L 只是第四級輔助。PEL-TWA 0.002 mg/m3（2 μg/m3），分級輔助基準 PEL-TWA ≥0.1 μg/m3。特化附表一以鈹重量比超過 1%（鈹合金以鈹重量比超過 3%）的混合物計。114-01 回憶把本題誤記為銦。","dispute":"","review":{"key_points":["慢性鈹病＝==非乾酪性肉芽腫＋間質性肺病==，類肉瘤樣，BeLPT 鑑別；==末期==才肺高壓右心衰竭","鈹作業考量疾病：心血管、COPD、慢性氣管炎、氣喘、接觸性皮膚疾病、慢性肝炎、酒精性肝炎、腎臟疾病","鈹 PEL-TWA 0.002 mg/m3；分級輔助 ≥0.1 μg/m3；第四級輔助尿鈹 ≥0.4 μg/L；IARC Group 1"],"refs":[{"src":"7職業暴露鈹及其化合物引起之中毒認定參考指引","file":"_ref/認定指引/all/7職業暴露鈹及其化合物引起之中毒認定參考指引.txt","quote":"在疾病的末期，可能會出現肺臟高血壓、心肺症與右心室衰竭的症狀"},{"src":"7職業暴露鈹及其化合物引起之中毒認定參考指引","file":"_ref/認定指引/all/7職業暴露鈹及其化合物引起之中毒認定參考指引.txt","quote":"慢性鈹疾病（chronicberylliumdisease）是一種非乾酪性肉芽腫與間質性的發炎反應"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"接觸性皮膚疾病、慢性肝炎、酒精性肝炎、腎臟疾病等"}],"note_ref":"四、鈹與銦"}},{"qid":"c09q15","q":"有關銦及其化合物作業之敘述，下列何者錯誤？","options":["氧化銦錫（ITO）粉塵為主要暴露來源，常見於面板、靶材製造與回收業","血清銦 ≥3 μg/L 為健康管理分級之異常門檻","主要健康危害為間質性肺病、肺纖維化與肺泡蛋白沉積症","有心血管疾病者不適合從事銦作業"],"answer":3,"recon":"partial","src":["114-03","113-11"],"optexp":["**正確**：目前大於七成的銦以氧化銦錫（ITO）用於面板等產業，靶材濺鍍、研磨更換、銲料燻煙與靶材／螢幕回收粉碎是主要暴露來源。","**正確**：分級指引第三、四級判定條件都含「血清銦 ≥3 μg/L」，源自日本產業衛生協會 2007 年建議值，我國 2019 年起新增此健檢項目。","**正確**：長期暴露造成肺纖維化、間質性肺病與肺泡蛋白質沉著症（PAP，合稱銦肺病），肺病理見肺間質纖維化與膽固醇肉芽腫。","**錯誤（本題答案）**：銦作業考量疾病是呼吸道疾病（氣喘、慢性氣管炎、肺氣腫）、眼睛疾病、皮膚疾病，附表十二只寫「肺部疾病」，不包含心血管疾病；心血管疾病是鈹、TDI、石綿、粉塵、噪音等作業的考量項目。"],"explanation":"本題考銦及其化合物作業的重點。暴露：ITO 靶材製造、濺鍍、研磨、回收，面板業與銦回收廠。危害：急性刺激呼吸道、眼睛、皮膚黏膜；慢性肺纖維化、間質性肺病、PAP；磷化銦 IARC 2A（2006）、氧化銦錫 2B（2018）。動力學：ITO 在肺中幾乎不溶解、可累積數年，日本世代研究顯示血清銦生物半衰期可長達 8.09 年，代表較長期累積暴露；尿中銦半衰期可達數月、代表短期暴露。法定項目：呼吸系統既往病史、呼吸系統及皮膚黏膜（含眼睛結膜）身體檢查、胸部 X 光、肺功能；健康檢查加血清銦（變更作業者免）。分級：第三級為血清銦 ≥3 μg/L，或有刺激性皮膚炎、結膜角膜刺激性病灶、咳嗽呼吸困難肺纖維化症狀、肺部惡性腫瘤，輔助 PEL-TWA ≥0.05 mg/m3；第四級再加胸部 X 光或電腦斷層有間質性及纖維化病變。PEL-TWA 0.1 mg/m3。114-01 回憶「尿中銦反映最近暴露」屬概念混淆：法定測的是血清銦，反映累積暴露。","dispute":"","review":{"key_points":["銦作業：ITO 面板業，法定加==血清銦==，分級門檻 ==≥3 μg/L==；血清銦半衰期約 8 年代表累積暴露","銦危害：間質性肺病、肺纖維化、肺泡蛋白質沉著症；磷化銦 IARC 2A、ITO 2B","銦考量疾病：呼吸道疾病、眼睛疾病、皮膚疾病（附表十二寫肺部疾病），不含心血管疾病"],"refs":[{"src":"30_銦及其化合物作業管理分級參考","file":"_ref/分級指引/30_銦及其化合物作業管理分級參考.txt","quote":"考量不適合從事作業之疾病，如呼吸道疾病(氣喘、慢性氣管炎、"},{"src":"30_銦及其化合物作業管理分級參考","file":"_ref/分級指引/30_銦及其化合物作業管理分級參考.txt","quote":"2.3血清銦≥3μg/L。"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"血清銦生物半衰期可長達8.09年"}],"note_ref":"四、鈹與銦"}},{"qid":"c09q16","q":"下列何者不是 IARC 第一類（Group 1）致癌物？","options":["鎳化合物","磷化銦","砷及無機砷化合物","鎘及其化合物"],"answer":1,"recon":"full","src":["113-2","113-9","113-11","114-04"],"optexp":["**不符合／錯誤（是 Group 1）**：鎳化合物是 IARC 確認的人類致癌物，職業癌為肺癌、鼻竇癌與鼻癌。","**符合／正確（本題答案）**：磷化銦於 2006 年被 IARC 列為 Group 2A，氧化銦錫 2018 年列為 2B，銦化合物都不是第一類致癌物。","**不符合／錯誤（是 Group 1）**：砷及無機砷化合物 IARC 於 1980 與 1987 年確認為第一類致癌物，致皮膚癌、肺癌、膀胱癌等。","**不符合／錯誤（是 Group 1）**：鎘及鎘化合物 1993 年即因吸入鎘確定增加肺癌而列 Group 1。"],"explanation":"本題考 IARC 致癌分類。特別危害健康作業物質中的 Group 1：砷、鎘、六價鉻、鎳化合物、鈹、苯、氯乙烯、石綿、甲醛、1,3-丁二烯、游離輻射、聯苯胺與 4-胺基聯苯類、MOCA（2012 年列第一級，致膀胱癌）。Group 2A：磷化銦（2006）、二甲基甲醯胺（2018）。Group 2B：四氯化碳、1,1,2,2-四氯乙烷、1-溴丙烷（2017 年列入，我國分級指引仍註記「動物有肝毒性、人體未證實」）、氧化銦錫（2018）。沒有明確致癌分級或非致癌重點：錳、正己烷、二硫化碳、鉻酸以外的三價鉻。113-10 版本問「何者非致癌物？鎳／鉻／鎘／銦」答銦，理由相同：銦本身沒有被列入 Group 1，題目寫磷化銦或銦都選它。","dispute":"","review":{"key_points":["IARC Group 1 金屬：==砷、鎘、六價鉻、鎳化合物、鈹==；銦類最高只到 2A（磷化銦）／2B（ITO）","Group 1 有機物：苯、氯乙烯、甲醛、1,3-丁二烯、MOCA；石綿與游離輻射亦為 Group 1","2A：磷化銦、DMF；2B：四氯化碳、四氯乙烷、1-溴丙烷、氧化銦錫"],"refs":[{"src":"8職業暴露銦及其化合物引起之疾病認定參考指引","file":"_ref/認定指引/all/8職業暴露銦及其化合物引起之疾病認定參考指引.txt","quote":"氧化銦錫於2018年IARC致癌分類列為Group2B"},{"src":"30_銦及其化合物作業管理分級參考","file":"_ref/分級指引/30_銦及其化合物作業管理分級參考.txt","quote":"IARC2006年將其致癌分類列為Group2A"},{"src":"職業暴露鎳及其化合物引起之疾病認定參考指引","file":"_ref/認定指引/all/職業暴露鎳及其化合物引起之疾病認定參考指引.txt","quote":"鎳化合物（nickelcompounds）是IARC確認的人類致癌物"}],"note_ref":"六、其他金屬與重金屬通論"}},{"qid":"c09q17","q":"長期暴露下列何種金屬，容易造成禿髮（alopecia）？","options":["鉈","鉻","鉛","鎘"],"answer":0,"recon":"full","src":["113-1","113-10"],"optexp":["**符合／正確（本題答案）**：鉈中毒三聯徵是暴露後 2–3 週脫髮、疼痛性上行性周邊神經病變與腸胃症狀，指甲可見 Mees' lines；來源為殺鼠劑、光學玻璃、半導體。","**不符合／錯誤**：鉻造成鼻中膈穿孔、鉻潰瘍、過敏性皮膚炎與肺癌，沒有掉髮。","**不符合／錯誤**：鉛造成貧血、腹絞痛、運動神經病變（垂腕）、腦病變與齒齦鉛線，沒有掉髮。","**不符合／錯誤**：鎘造成腎小管障礙、骨軟化、黃色鎘環、嗅覺喪失與貧血，沒有掉髮。"],"explanation":"本題考金屬中毒的特徵性體徵配對。掉髮：鉈最典型，砷慢性中毒也會（分級指引「體重減輕、掉頭髮」）。指甲橫向白線（Mees' lines）：砷、鉈，砷化氫中毒後 2–3 週也會出現。齒齦線：鉛（黑或藍紫色硫化鉛）。牙齒黃色環：鎘。垂腕：鉛。震顫、齒齦炎、erethism：汞。類巴金森：錳。鼻中膈穿孔：鉻、砷、鎳。鉈的其他表現：急性期以腸胃症狀為主，數日後出現由遠端上行、以疼痛為主的周邊神經病變與腦神經病變、意識改變，脫髮延遲數週才出現；治療用普魯士藍。113-10 版本問法相同。本題庫參考檔中的殺鼠劑指引只在毒性分級列出鉈（Thallium），未詳述臨床，以上臨床描述依 note 整理。","dispute":"","review":{"key_points":["禿髮：==鉈==（暴露後 2–3 週）、砷；Mees' lines：砷、鉈、砷化氫","鉈三聯徵：脫髮、疼痛性上行性周邊神經病變、腸胃症狀；來源殺鼠劑、光學玻璃、半導體","體徵配對：垂腕與齒齦線＝鉛、黃色齒環＝鎘、震顫齒齦炎＝汞、類巴金森＝錳"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"Mee氏線、毛髮脫落、色素沉著、脫色斑、或表皮角化症"},{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"體重減輕、掉頭髮、時而痢疾，時而便秘"}],"note_ref":"六、其他金屬與重金屬通論"}},{"qid":"c09q18","q":"電焊作業吸入高濃度鋅或銅之金屬氧化物燻煙，會導致下列何種急性病症？","options":["垂腕症","退伍軍人症","金屬燻煙熱（metal fume fever）","類巴金森症候群"],"answer":2,"recon":"full","src":["113-1","113-4","113-5","113-11"],"optexp":["**不符合／錯誤**：垂腕症是鉛造成的橈神經運動神經病變（手腕伸肌無力），要吸入或食入鉛數年才出現，不是急性燻煙反應。","**不符合／錯誤**：退伍軍人症是嗜肺性退伍軍人菌經冷卻水塔、水霧吸入造成的感染性肺炎，與金屬燻煙無關。","**符合／正確（本題答案）**：吸入新生成的氧化鋅、氧化銅等金屬氧化物燻煙，數小時後發燒、寒顫、肌肉痠痛、口中金屬味、白血球升高，24–48 小時自癒；錳與鎳的分級指引都把金屬燻煙熱列為急性危害。","**不符合／錯誤**：類巴金森症候群是錳（以及二硫化碳）慢性暴露的錐體外徑神經毒性，不是急性燻煙症狀。"],"explanation":"本題考金屬燻煙熱（metal fume fever）。機轉是吸入粒徑極小的新生成金屬氧化物燻煙（氧化鋅最典型，如鍍鋅鋼材電焊；氧化銅、鎂、鎘、錳、鎳亦可）引起的急性發炎反應，不是過敏也不是感染。臨床：暴露後數小時發燒、寒顫、胃不適、嘔吐、喉乾、咳嗽、肢體疼痛、頭痛、昏睡虛弱、口中金屬味、白血球增多，24–48 小時自癒，連續暴露會產生耐受、休假後再暴露又發作（星期一熱）。鑑別：鎘燻煙除類似燻煙熱症狀外可造成化學性肺炎與肺水腫甚至死亡；四羰基鎳急性中毒初期類似燻煙熱但 2–3 天後惡化為化學性肺炎。本題另一考點是微粒型態：燻煙（fume）是金屬熔融蒸發後再凝結的固態微粒，與電鍍槽液產生的霧滴（mist）不同（見 c09q19）。","dispute":"","review":{"key_points":["金屬燻煙熱＝吸入新生成==氧化鋅、氧化銅==燻煙→數小時後發燒寒顫肌痛金屬味，24–48 小時自癒，有星期一熱耐受現象","非過敏、非感染；鎘燻煙與四羰基鎳可進展為化學性肺炎肺水腫，須鑑別","燻煙（fume）＝高溫熔融金屬蒸發凝結的固態微粒；電焊、熔煉"],"refs":[{"src":"19_錳及其化合物作業管理分級參考","file":"_ref/分級指引/19_錳及其化合物作業管理分級參考.txt","quote":"吸入高濃度燻煙會產生金屬燻煙熱。症狀如寒顫並發燒"},{"src":"25_鎳及其化合物作業管理分級參考","file":"_ref/分級指引/25_鎳及其化合物作業管理分級參考.txt","quote":"金屬燻煙會刺激呼吸道(咳嗽、呼吸急促、呼吸困難、胸緊)、金屬燻煙熱"}],"note_ref":"六、其他金屬與重金屬通論"}},{"qid":"c09q19","q":"從事電鍍作業之勞工，主要暴露之微粒物質型態為何？","options":["燻煙（fume）","蒸氣（vapor）","霧滴（mist）","纖維（fiber）"],"answer":2,"recon":"full","src":["113-10","113-11","113-12","114-04"],"optexp":["**不符合／錯誤**：燻煙（fume）是金屬在焊接、熔煉等高溫下蒸發再凝結成的固態微粒，電鍍槽在常溫電解不產生燻煙。","**不符合／錯誤**：蒸氣（vapor）是液體或固體揮發成的氣態分子，例如有機溶劑；電鍍前處理脫脂會有溶劑蒸氣，但電鍍作業本身的主要危害物是槽液成分。","**符合／正確（本題答案）**：電鍍槽液（鉻酸、鎳鹽、氰化物）因電解產生的氫氣氣泡破裂，把液滴帶入空氣形成霧滴（mist），分級指引即稱「鉻酸霧滴及粉塵」。","**不符合／錯誤**：纖維（fiber）是石綿、人造礦物纖維等長寬比大的固態微粒，與電鍍無關。"],"explanation":"本題考空氣中有害物的物理型態與作業配對。氣態污染物：氣體（gas，常溫常壓即為氣態，如砷化氫、一氧化碳、氯氣）與蒸氣（vapor，常溫液體或固體揮發成的氣態，如甲苯、正己烷、汞蒸氣）。粒狀污染物：粉塵（dust，研磨、切割、破碎產生的固態微粒）、燻煙（fume，金屬高溫蒸發後氧化凝結，粒徑極小，電焊、熔煉）、霧滴（mist，液體被機械攪動、噴灑或電解氣泡打散成液滴，電鍍、噴漆、酸洗）、纖維（fiber，石綿）、煙（smoke，不完全燃燒）。電鍍作業的鉻酸霧滴致鼻中膈穿孔與鉻潰瘍，鎳鹽致皮膚炎與氣喘。這個分類也決定呼吸防護具：蒸氣氣體用濾毒罐，粉塵燻煙霧滴用濾材。113-10、113-11、113-12、114-04 皆考過，答霧滴。","dispute":"","review":{"key_points":["電鍍作業暴露型態＝==霧滴（mist）==：槽液被電解氣泡打散成液滴","燻煙（fume）＝焊接熔煉金屬蒸發凝結固態微粒；蒸氣（vapor）＝溶劑揮發；粉塵＝研磨切割","鉻酸霧滴→鼻中膈穿孔、鉻潰瘍；防護：氣體蒸氣用濾毒罐，粒狀物用濾材"],"refs":[{"src":"23_鉻酸及其鹽類作業管理分級參考","file":"_ref/分級指引/23_鉻酸及其鹽類作業管理分級參考.txt","quote":"鉻酸霧滴及粉塵會嚴重刺激鼻子、喉嚨、支氣管、肺及皮膚"},{"src":"職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引","file":"_ref/認定指引/all/職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引.txt","quote":"工業上常以鉻電鍍方式將六價鉻離子還原成鉻金屬，鍍於物件表面"}],"note_ref":"六、其他金屬與重金屬通論"}},{"qid":"c09q20","q":"重金屬最常造成人體哪些器官系統之傷害？","options":["腎臟及肝臟","腎臟及神經系統","心臟及肝臟","肺臟及皮膚"],"answer":1,"recon":"full","src":["113-2","113-3","113-4","113-11","114-03"],"optexp":["**不符合／錯誤**：肝臟不是重金屬的主要標的（職業性肝毒物以有機溶劑為大宗）；鎘、砷、鉻雖可傷肝，相對於腎臟與神經系統屬次要。","**符合／正確（本題答案）**：鉛（神經病變、腎病變）、汞（震顫、erethism、腎病變）、砷（末梢神經炎、腎病變）、鉈（周邊神經病變）、鎘（腎小管障礙）的共同標的就是腎臟與神經系統，附表十二鉛、四烷基鉛、汞、錳作業的考量疾病同時列出神經系統與腎臟疾病（砷作業未列腎臟疾病）。","**不符合／錯誤**：心臟不是重金屬的典型標的；鎘與砷的心血管效應（高血壓、烏腳病）屬流行病學相關，不是最常見的器官傷害。","**不符合／錯誤**：肺與皮膚是吸入、接觸的入口與局部刺激處（鉻鼻中膈穿孔、砷皮膚角化、鎳皮膚炎），但題目問「最常造成人體傷害的器官系統」，要答全身性的標的器官。"],"explanation":"本題考重金屬的共同標的器官。多數重金屬經呼吸道或消化道吸收後，與含硫氫基的蛋白質結合，主要經腎排泄，因此腎小管（鎘、汞、鉛、鉻）是最常見的標的；神經系統則因鉛、汞、砷、鉈、錳、有機鉛、有機汞的親神經性而成為另一主要標的。各金屬特色：鉛→運動神經病變（垂腕）、腦病變、腎病、貧血；無機汞→震顫、erethism、腎病變；有機汞→視野狹窄、共濟失調；砷→感覺運動神經病變、皮膚、腎；鎘→腎小管與骨；錳→基底核；鉈→周邊神經；鉻→腎小管與局部潰瘍。附表十二鉛、四烷基鉛、汞、錳作業的考量疾病同時列出神經系統疾病與腎臟疾病（砷作業列神經但未列腎臟），鎘作業則列腎臟疾病、肌肉骨骼系統疾病、心血管、貧血、呼吸系統疾病。","dispute":"113-4 回憶者選「腎臟及神經系統」且系統顯示答對；113-3 版本回憶者猜「腎臟及肝臟」，未經證實。就毒理學與附表十二的考量疾病（鉛、四烷基鉛、汞、錳作業均同時列出精神或神經系統疾病與腎臟疾病；分級指引鎘作業列腎臟疾病），重金屬最常見的標的器官是腎臟與神經系統；肝臟主要是有機溶劑的標的器官（見第 12 章）。本題以 B「腎臟及神經系統」為準。","review":{"key_points":["重金屬最常見標的器官＝==腎臟＋神經系統==；肝臟主要是有機溶劑的標的","鉛：運動神經病變、腦病變、腎病、貧血；汞：震顫、erethism、腎病變；砷：末梢神經炎、皮膚、腎","附表十二鉛、四烷基鉛、汞、錳作業考量疾病皆含神經系統疾病與腎臟疾病（砷無腎臟）"],"refs":[{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"神經系統疾病、貧血等血液疾病、腎臟疾病"},{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"慢性暴露可能導致腎臟疾病"},{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"可能發生手腕和踝部運動神經病變"}],"note_ref":"六、其他金屬與重金屬通論"}},{"qid":"c09q21","q":"重金屬產生毒性的主要細胞機轉為何？","options":["與蛋白質及酵素之硫氫基（-SH）結合，使酵素失去活性","直接切斷 DNA 雙股","阻斷鈉離子通道","抑制乙醯膽鹼酯酶"],"answer":0,"recon":"partial","src":["113-6","113-11","114-03","114-04","115-02"],"optexp":["**符合／正確（本題答案）**：鉛（抑制 ALAD）、汞（二價汞與蛋白質氫硫根高度親和）、砷（三價砷極易與氫硫基結合，干擾呼吸鏈、麩胺基硫代謝與 DNA 修補）、鎘都以結合 -SH 使酵素失活為核心機轉。","**不符合／錯誤**：直接切斷 DNA 雙股是游離輻射的作用；重金屬的基因毒性多屬間接（氧化壓力、抑制 DNA 修復）。","**不符合／錯誤**：阻斷鈉離子通道是河豚毒素（tetrodotoxin）與局部麻醉劑的機轉，不是重金屬。","**不符合／錯誤**：抑制乙醯膽鹼酯酶是有機磷與胺基甲酸鹽殺蟲劑的機轉，不是重金屬。"],"explanation":"本題考重金屬的分子毒理。共同機轉：與蛋白質、酵素的硫氫基（-SH，sulfhydryl／thiol）結合使酵素失去活性，進而傷害粒線體（氧化磷酸化受阻、氧化壓力）、內質網與細胞色素 P450 系統，並抑制 DNA 修復。各金屬代表：鉛抑制 δ-ALAD 與 ferrochelatase 造成貧血與 ZPP 上升，並增加自由基；汞與 -SH、-SeH 結合造成非特異性細胞傷害；三價砷與 -SH 結合使呼吸鏈與麩胺基硫代謝受阻，五價砷則干擾氧化磷酸化的去偶合；鎘與含 -SH 酵素及金屬硫蛋白結合。這也是含 -SH 的螯合劑（BAL、DMSA、DMPS）能治療重金屬中毒的原理。回憶版問法有三種：「重金屬傷害哪裡？粒線體、P450、內質網」（多個都對的假單選）、「重金屬傷害哪裡？蛋白質氫硫基」、115-02「金屬物質毒性最少作用在哪個結構」，見爭議註記。","dispute":"回憶版有三種問法：113-6「重金屬傷害哪裡？P450、粒線體、內質網」（三者都是重金屬可傷害的胞器，屬假單選）；114-03、114-04「重金屬傷害哪裡？D 蛋白質氫硫基（o）」；115-02「金屬物質毒性最少作用在哪個結構」，選項為硫氫基／粒線體／CYP450／內質網，題意不清——若真問「最少」，四者都是已知標的而無從判定，若回憶者漏記「最主要」，答案應為硫氫基。本題重建為問主要細胞機轉，答「與硫氫基結合」；應試時若遇到「最少作用」版本，建議依題幹字面挑與重金屬最不相關者，並記住「與硫氫基結合」是各版本共同的核心答案。","review":{"key_points":["重金屬核心機轉＝與酵素==硫氫基（-SH）==結合使酵素失活，續發傷害粒線體、內質網、CYP450","鉛抑制 ALAD（ZPP 上升）；三價砷與 -SH 結合干擾呼吸鏈與麩胺基硫；二價汞與氫硫根高度親和","鈉通道阻斷＝河豚毒；抑制膽鹼酯酶＝有機磷；直接斷 DNA＝游離輻射"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"三價砷極易與氫硫基(-SH)結合而干擾許多酵素系統之運作"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"二價汞與細胞中蛋白質的氫硫根"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"並可以通過抑制ALAD而增加自由基"}],"note_ref":"六、其他金屬與重金屬通論"}},{"qid":"c09q22","q":"下列重金屬何者對人體無任何已知之生理益處？","options":["鉛","鋅","鐵","銅"],"answer":0,"recon":"rebuilt","src":["113-2","113-11"],"optexp":["**符合／正確（本題答案）**：鉛與汞、鎘同為非必需的毒性金屬，沒有任何已知生理功能，血鉛沒有安全值，任何蓄積都是負擔。","**不符合／錯誤**：鋅是數百種酵素的輔因子，與金屬硫蛋白合成有關（並可拮抗鎘的吸收），是必需微量元素。","**不符合／錯誤**：鐵是血紅素與細胞色素的成分；缺鐵性貧血反而是鉛、鎘作業健檢貧血異常時首先要排除的原因。","**不符合／錯誤**：銅是細胞色素氧化酶、超氧化物歧化酶等的輔因子，屬必需微量元素（過量仍有毒，如 Wilson 病）。"],"explanation":"本題考必需與非必需金屬的區分。必需微量元素：鐵、鋅、銅、錳、鈷（維生素 B12）、硒、碘、鉬與三價鉻（鉻酸認定指引：三價鉻是人體所必需的微量元素，為調控糖類代謝的葡萄糖耐受因子，缺乏時生長異常與神經系統異常）；這些元素缺乏會致病，過量也有毒性（錳→類巴金森、銅→肝損傷、六價鉻→潰瘍與肺癌）。非必需毒性金屬：鉛、汞、鎘、砷、鉈、鈹、銦（銦指引寫「銦非人體必須元素」），沒有已知生理益處。113-2 回憶版問「何者重金屬元素對人體無益處：鉛、汞」與「人體中不需要之金屬：鎳、鎘、鉛？皆是」——鎳雖有極微量生理功能的爭議，考試上歸類為人體不需要的金屬。","dispute":"","review":{"key_points":["無已知生理益處的金屬：==鉛、汞、鎘==、砷、鉈、鈹、銦","必需微量元素：鐵、鋅、銅、錳、鈷、硒、碘、==三價鉻==（葡萄糖耐受因子）","必需元素過量亦有毒：錳→類巴金森、銅→肝損傷；六價鉻毒性遠大於三價鉻"],"refs":[{"src":"職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引","file":"_ref/認定指引/all/職業性鉻酸及其鹽類或重鉻酸及其鹽類中毒認定參考指引.txt","quote":"三價鉻是人體所必需的微量元素"},{"src":"8職業暴露銦及其化合物引起之疾病認定參考指引","file":"_ref/認定指引/all/8職業暴露銦及其化合物引起之疾病認定參考指引.txt","quote":"銦非人體必須元素"}],"note_ref":"六、其他金屬與重金屬通論"}},{"qid":"c09q23","q":"下列何者不是重金屬直接沉積所形成的「金屬線」？","options":["鉛線（lead line）","Mees' lines（米氏線）","汞線（mercury line）","鉍線（bismuth line）"],"answer":1,"recon":"full","src":["113-4","114-05"],"optexp":["**不符合／錯誤（是金屬沉積線）**：鉛線是血中鉛與口腔微生物代謝產生的硫離子作用後生成的硫化鉛，沉積於齒齦交界處呈黑色或藍紫色；附表十鉛作業的身體檢查明列「齒齦鉛緣之有無」。","**符合／正確（本題答案）**：Mees' lines 是砷、鉈中毒（或砷化氫中毒後 2–3 週）使指甲基質生長暫停而形成的橫向白線，本質是生長障礙留下的痕跡，不是金屬直接沉積。","**不符合／錯誤（是金屬沉積線）**：汞線是汞化合物在齒齦緣沉積形成的色素線，常伴齒齦炎與口內炎。","**不符合／錯誤（是金屬沉積線）**：鉍線是含鉍藥物或暴露後硫化鉍沉積於齒齦形成的藍黑線，機轉與鉛線相同。"],"explanation":"本題考「金屬線」的成因分類。齒齦色素線（鉛線、汞線、鉍線）：金屬離子與口腔細菌代謝產生的硫離子作用生成金屬硫化物，沉積在齒齦邊緣；口腔衛生佳者可能不出現，檢查時要與齒垢區別，必要時洗牙後再比較；鉛線（齒齦鉛緣）是鉛作業的法定身體檢查項目。指甲橫向白線（Mees' lines）：砷、鉈及砷化氫中毒的急性事件使指甲生長暫停，之後隨指甲長出，可據此推估中毒時間；本質是生長障礙，不是沉積。鎘的黃色鎘環在門齒犬齒頸部，是硫化鎘沉積於牙釉質，也是法定檢查項目。114-05 版本的選項「bees line」是 Mees line 的誤植，答案相同。","dispute":"","review":{"key_points":["齒齦金屬線＝==鉛線、汞線、鉍線==：金屬硫化物沉積，與齒垢區別；鉛線是鉛作業法定檢查項目","==Mees' lines==＝砷、鉈、砷化氫中毒後指甲生長暫停的橫向白線，非金屬沉積","鎘＝門齒犬齒黃色鎘環（硫化鎘沉積牙釉質）"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"齒齦緣之鉛線為血中鉛與口腔微生物代謝之硫離子作用後，反應產生的硫化鉛"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"齒齦鉛緣之有無與血液系統"},{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"Mee氏線、毛髮脫落、色素沉著、脫色斑、或表皮角化症"}],"note_ref":"六、其他金屬與重金屬通論"}}]},{"idx":9,"order":9,"title":"砷、砷化氫與鉈","group":"重金屬","gi":2,"notes_md":"本章 12 題，砷是台灣本土色彩最重的職業／環境毒物（烏腳病），砷化氫則是半導體業的急症；兩者機轉完全不同，考題最愛把它們放在一起比較。鉈只考一個配對點。\n\n## 一、砷的來源、代謝與毒性排序\n- **台灣本土砷中毒＝飲用含砷深井水**：西南沿海（嘉義布袋、義竹，台南北門、學甲）與宜蘭盆地，造成烏腳病（周邊動脈硬化致肢體壞疽）、皮膚角化與色素變化、皮膚癌，膀胱癌、肺癌、腎癌死亡率與井水砷濃度呈劑量反應。\n- 職業暴露：半導體（砷化氫、砷化鎵）、銅鉛冶煉、木材防腐（全球砷產量約七成）、玻璃、農藥。\n- **毒性排序**：==砷化氫 > 三價無機砷 > 五價無機砷 > MMA／DMA > 砷甜菜鹼（海鮮，幾乎無毒）≈ 元素砷（不溶於水與體液）==。\n- 三價砷與 -SH 結合干擾呼吸鏈；五價砷在體內轉為三價；肝臟甲基化為 MMA、DMA 經尿排出，無機砷半衰期約 1–4 天。\n- 尿砷背景值：台北大學生約 30–35 μg/L；高砷井水區居民可達 91–113 μg/L。\n- **半導體製程中砷化氫暴露最高的步驟＝離子植入**（尤其機台維修與更換氣瓶）。對照：黃光→光阻溶劑；蝕刻→HF、氯；薄膜→矽烷、磷化氫；清洗→HF、硫酸、過氧化氫。\n\n## 二、慢性砷中毒的臨床表現與癌症\n- 皮膚三聯徵：==掌蹠角化過度＋色素沉著（夾雜雨滴狀脫色斑）＋皮膚癌（Bowen 氏病、基底細胞癌、鱗狀細胞癌）==。\n- **皮膚炎與潰瘍是急性腐蝕刺激，不是慢性砷中毒的表現，也不是過敏機轉**——「砷化物有過敏性，低劑量即易產生接觸性皮膚炎」是固定錯誤敘述。\n- 其他慢性表現：末梢感覺運動神經炎（下肢重於上肢）、指甲 Mees 氏線、掉髮、體重減輕、貧血與白血球減少、鼻中膈潰瘍穿孔、烏腳病、糖尿病。\n- 癌症（IARC Group 1）：==肺癌、皮膚癌、膀胱癌==證據充分；肝血管肉瘤、腎癌、攝護腺癌證據有限。**肝血管肉瘤三大病因：氯乙烯、無機砷、二氧化釷**。\n\n## 三、砷作業法定項目、尿砷判讀與分級\n- 法定項目：作業經歷、呼吸症狀既往病史、鼻腔皮膚呼吸道腸胃神經身體檢查、胸部 X 光、尿液常規、ALT 與 γ-GT、血球，健康檢查加==尿中無機砷（三價＋五價＋MMA＋DMA，非總砷、非血砷）==。\n- 分級門檻：**總無機砷 ≥35 μg/L**；或血球任一項低於正常、胸部 X 光疑似肺腫瘤、蛋白尿達二價（≥100 mg/dL）、肝病變、鼻中膈潰瘍穿孔、末梢神經炎、色素沉著或角化、疑似皮膚癌。\n- 採檢前須禁食海鮮、海帶（認定指引：48 小時內未食海產），否則有機砷會使數值偏高；飲食造成的偏高屬第二級（可由工作以外原因解釋）。尿液可接受範圍：肌酸酐 20–250 mg/dL、比重 1.003–1.020。\n- PEL-TWA：無機砷 0.01 mg/m3、有機砷 0.5 mg/m3、砷化氫 0.05 ppm。\n- 附表十二砷作業考量疾病六類：==精神或神經系統疾病、貧血、肝病、呼吸系統疾病、心血管疾病、接觸性皮膚疾病==（**不含腎臟疾病**）；砷亦列在職安法第 30 條妊娠中女性禁止暴露的化學品。\n\n## 四、砷化氫\n- 性質：無色、比空氣重，本身無臭，約 0.5 ppm 才被氧化產生大蒜味，但==致命濃度遠低於能聞到蒜味的濃度==（250 ppm 立即死亡、25–50 ppm 30 分鐘內死亡、10 ppm 數小時後出現症狀）。\n- 途徑：==主要經呼吸道吸入==（曾有皮膚接觸中毒紀錄，但極少），接觸當下無刺激感。，接觸當下無刺激感。\n- 機轉：==血管內溶血==（氧化壓力破壞紅血球）。\n- 病程：暴露後 ==1–24 小時==（非立即）出現頭痛、頭暈、腹痛、噁心；4–6 小時後深色血紅素尿；1–2 天後黃疸；最後急性腎衰竭。**三聯徵＝腹痛、血紅素尿、黃疸**。\n- 腎損傷機轉：溶血釋出的血紅素形成圓柱==堵塞腎小管==並造成腎小管壞死；尿潛血陽性但尿沉渣看不到紅血球（與橫紋肌溶解的肌球蛋白尿鑑別，Coombs 陰性排除自體免疫溶血）。\n- 處置：換血與血液透析。慢性低濃度暴露則有貧血、紅血球嗜鹼性彩斑、青銅色皮膚、中毒後 2–3 週 Mees 氏線。\n- 鑑別：變性血紅素＝苯胺類；抑制膽鹼酯酶＝有機磷；阻斷細胞色素氧化酶＝氰化物、硫化氫。\n\n## 五、鉈與砷、鉈、鉛、汞的鑑別\n- **皮膚症狀＋掉髮＋周邊神經病變三者兼具者＝砷與鉈**；鉛（貧血、垂腕、鉛線）與汞（震顫、erethism、齒齦炎）不掉髮。\n- 鉈三聯徵：脫髮（暴露後 2–3 週）、==疼痛性上行性周邊神經病變==、腸胃症狀；來源為殺鼠劑、光學玻璃、半導體。\n- 砷的神經病變是感覺為主的多發性神經炎、下肢重於上肢；Mees 氏線見於砷、鉈與砷化氫中毒。","questions":[{"qid":"c10q01","q":"台灣本土砷中毒最常見的原因為何？","options":["半導體製程暴露","飲用含砷之地下水（井水）","食用海鮮","農藥噴灑"],"answer":1,"recon":"full","src":["113-2","113-3","113-4","113-11","114-04"],"optexp":["**不符合／錯誤**：半導體（離子植入用砷化氫、砷化鎵磊晶）是職業暴露來源，但人數與規模遠小於本土地方性砷中毒；114-04 版本把半導體當成干擾選項。","**符合／正確（本題答案）**：台灣西南沿海（嘉義布袋、義竹，台南北門、學甲）與宜蘭盆地居民長期飲用含砷深井水，造成烏腳病、皮膚色素變化與角化、皮膚癌及內臟癌，是本土最經典的砷中毒；認定指引寫「無機砷亦被認為是造成台灣高砷井水地區烏腳病的危險因子」。","**不符合／錯誤**：海鮮含大量有機砷（砷甜菜鹼），幾乎無毒、以原型自尿排出，只會使尿中總砷偏高，不造成砷中毒。","**不符合／錯誤**：含砷農藥（砷酸鉛、砷酸鈣）曾是暴露來源之一，但在台灣不是最常見原因，且多屬職業或急性誤食暴露。"],"explanation":"本題考台灣本土砷中毒的流行病學。1950–60 年代台灣西南沿海烏腳病地區與宜蘭盆地高砷井水地區的居民長期飲用深井水，出現烏腳病（周邊動脈嚴重硬化導致肢體壞疽）、皮膚色素沉著與脫色斑、掌蹠角化、皮膚癌（Bowen 氏病、基底細胞癌、鱗狀細胞癌），而且膀胱癌、腎臟癌、皮膚癌、肺癌與男性攝護腺癌、肝癌以及心腦血管疾病死亡率都與井水砷濃度呈劑量反應關係；高暴露居民尿中砷平均可達 91–113 μg/L，台北地區大學生約 30–35 μg/L。職業暴露則見於半導體（砷化氫、砷化鎵離子植入與維修）、銅鉛冶煉、木材防腐（全球砷產量七成用於木材防腐）、玻璃、農藥製造等。IARC 於 1980 與 1987 年確認砷為第一類致癌物。","dispute":"","review":{"key_points":["台灣本土砷中毒＝==飲用含砷深井水==（西南沿海烏腳病地區、宜蘭盆地）","井水砷暴露→烏腳病、皮膚角化與色素變化、皮膚癌、膀胱癌、肺癌、腎癌，呈劑量反應","尿砷背景：台北大學生約 30–35 μg/L；高砷井水區居民 91–113 μg/L"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"無機砷亦被認為是造成台灣高砷井水地區烏腳病"},{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"高暴露居民的尿中砷平均濃度則可高達91~113μg/L"}],"note_ref":"一、砷的來源、代謝與毒性排序"}},{"qid":"c10q02","q":"下列何者不是慢性砷中毒的皮膚表現？","options":["手掌、腳底皮膚角化","色素沉著（合併雨滴狀脫色）","皮膚炎","皮膚癌（Bowen 氏病、基底細胞癌、鱗狀細胞癌）"],"answer":2,"recon":"full","src":["113-7","113-9","113-10","113-11","113-12","114-04","115-01"],"optexp":["**正確（是慢性表現）**：掌蹠角化（arsenic keratosis）好發於手掌及腳掌的點狀突起，四肢軀幹亦可散在出現，病灶變大或潰瘍要懷疑 Bowen 氏病或皮膚癌。","**正確（是慢性表現）**：色素沉著呈淡褐色至青銅色、彌漫均勻，中間夾雜脫色斑，即所謂雨滴狀色素變化。","**錯誤（本題答案）**：砷化物具腐蝕刺激性，急性高濃度接觸可致刺激性皮膚炎、潰瘍與結膜炎，但那是急性局部效應，不是慢性砷中毒的皮膚表現，也不是過敏機轉；113-4「砷化物有過敏性，低劑量即易產生接觸性皮膚炎或潰瘍」為錯誤敘述。","**正確（是慢性表現）**：慢性砷暴露的皮膚癌以 Bowen 氏病（原位鱗狀細胞癌）、基底細胞癌與鱗狀細胞癌為主，被視為角化症的續發變化。"],"explanation":"本題考慢性砷中毒的皮膚三聯徵：掌蹠角化過度（hyperkeratosis）、色素沉著合併脫色斑（hyperpigmentation with raindrop depigmentation）、皮膚癌（Bowen 氏病、基底細胞癌、鱗狀細胞癌，可發生於非曝曬部位）。其他慢性表現：末梢感覺運動神經炎（下肢重於上肢）、指甲白色橫向 Mees 氏線、毛髮脫落、體重減輕、貧血與白血球減少、肝腫大、鼻中膈潰瘍穿孔、周邊血管病變（烏腳病）、糖尿病。分級指引砷作業第三、四級判定條件即包含鼻中膈黏膜潰瘍或穿孔、末梢神經炎、皮膚暴露部位色素沉著或角化、疑似皮膚癌或肝臟腫瘤。皮膚炎與潰瘍屬急性腐蝕刺激，不是慢性砷中毒的表現。歐盟指引：皮膚癌最小累積期限 1 年、最長潛伏期 5 年。","dispute":"","review":{"key_points":["慢性砷皮膚三聯徵：==掌蹠角化＋色素沉著（雨滴狀脫色斑）＋皮膚癌（Bowen 氏病、BCC、SCC）==","皮膚炎與潰瘍是急性腐蝕刺激，不是慢性砷中毒表現，也非過敏","砷作業第三、四級判定：鼻中膈潰瘍穿孔、末梢神經炎、色素沉著或角化、疑似皮膚癌或肝腫瘤"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"慢性砷暴露導致之皮膚病變很常見"},{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"皮膚癌症以波汶氏病、基底細胞癌及麟狀細胞癌為主"},{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"皮膚暴露部位色素沉著或角化、疑似皮膚癌"}],"note_ref":"二、慢性砷中毒的臨床表現與癌症"}},{"qid":"c10q03","q":"砷化氫（arsine, AsH3）造成人體危害的主要機轉為何？","options":["血管內溶血","抑制乙醯膽鹼酯酶","與血紅素結合形成變性血紅素","阻斷粒線體細胞色素氧化酶"],"answer":0,"recon":"full","src":["113-2","113-4","113-5","113-11","114-02","114-05","115-02"],"optexp":["**符合／正確（本題答案）**：砷化氫經呼吸道吸入後與紅血球結合，經氧化壓力造成急性大量血管內溶血；認定指引「急性砷化氫暴露會導致血管內溶血」，腹痛、血紅素尿、黃疸為三聯徵。","**不符合／錯誤**：抑制乙醯膽鹼酯酶是有機磷與胺基甲酸鹽殺蟲劑的機轉，與砷化氫無關。","**不符合／錯誤**：變性血紅素血症是苯胺、硝基苯等芳香族硝基／胺基化合物把血紅素二價鐵氧化成三價鐵的結果；砷化氫是破壞紅血球造成溶血，不是氧化血紅素鐵。","**不符合／錯誤**：阻斷粒線體細胞色素氧化酶是氰化物、硫化氫的機轉；無機砷雖干擾氧化磷酸化，但砷化氫急性毒性的核心是溶血。"],"explanation":"本題考砷化氫（arsine，AsH3）的毒理。性質：無色、比空氣重，本身無臭，空氣中約 0.5 ppm 時被氧化產生輕微大蒜味，但致命濃度遠低於能聞到蒜味的濃度（250 ppm 立即死亡、25–50 ppm 30 分鐘內死亡、10 ppm 數小時後出現症狀），為半導體製程的摻雜氣體，含砷金屬遇酸也會產生。機轉：吸入後與紅血球結合，經氧化壓力造成血管內溶血。臨床：不刺激、當下無感覺，暴露後 1–24 小時（通常數小時）出現頭痛、頭暈、腹痛、反胃，4–6 小時後深色血紅素尿，1–2 天後黃疸，最後急性腎衰竭；慢性低濃度暴露則有貧血、紅血球嗜鹼性彩斑、青銅色皮膚、肝脾腫大，中毒後 2–3 週指甲出現 Mees 氏線。治療：換血與血液透析減少溶血與腎損傷。PEL-TWA 0.05 ppm（0.16 mg/m3）。回憶版三種問法（砷化氫的毒性／對腎臟的影響／砷造成危害的機制）答案都指向溶血。","dispute":"","review":{"key_points":["砷化氫機轉＝==血管內溶血==→腹痛、血紅素尿、黃疸三聯徵→急性腎衰竭","砷化氫無色、約 0.5 ppm 才有大蒜味但致命濃度更低；症狀延遲 1–24 小時；PEL-TWA ==0.05 ppm==","鑑別：變性血紅素＝苯胺類；抑制膽鹼酯酶＝有機磷；阻斷細胞色素氧化酶＝氰化物、硫化氫"],"refs":[{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"急性砷化氫暴露會導致血管內溶血"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"血紅素尿及黃疸等三大症狀時(triad)，應強烈懷疑是砷化氫暴露所"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"其致命濃度遠低於能聞到蒜頭氣味的濃度"}],"note_ref":"四、砷化氫"}},{"qid":"c10q04","q":"砷化氫中毒對腎臟造成傷害的原因為何？","options":["紅血球破裂釋出之血紅素堵塞腎小管","直接沉積於腎絲球","引起膜性腎絲球腎炎","造成腎結石"],"answer":0,"recon":"full","src":["113-8","113-11","113-12","114-02"],"optexp":["**符合／正確（本題答案）**：溶血釋出的大量游離血紅素在腎小管形成血紅素圓柱堵塞並直接毒害腎小管上皮，造成急性腎小管壞死與急性腎衰竭；指引寫 4–6 小時深色血尿、1–2 天黃疸、最後急性腎衰竭，急性期以換血與洗腎減少溶血及腎臟傷害。","**不符合／錯誤**：砷化氫不是以砷沉積於腎絲球致病；砷及其代謝物主要經腎排出，急性腎損傷是溶血產物的續發效應。","**不符合／錯誤**：膜性腎絲球腎炎是無機汞的免疫性腎病變，不是砷化氫。","**不符合／錯誤**：腎結石是鎘（腎小管鈣磷流失）與鈹（高尿鈣）的慢性表現，不是砷化氫急性中毒。"],"explanation":"本題考砷化氫腎損傷的機轉，並鑑別其他金屬的腎病變。砷化氫：血管內溶血→游離血紅素→血紅素圓柱堵塞腎小管加上腎小管壞死→急性腎衰竭；尿潛血陽性但尿沉渣鏡檢不見紅血球（血紅素尿），須與橫紋肌溶解的肌球蛋白尿鑑別；Coombs 試驗陰性可排除自體免疫溶血；急性期以換血、血液透析處理，文獻多能痊癒。鑑別：鎘→近端腎小管重吸收障礙（低分子量蛋白尿）與腎結石；無機汞→近端腎小管壞死與免疫性膜性腎絲球腎炎（腎病症候群）；鉛→慢性間質性腎炎、痛風性腎病；鉻→近端腎小管傷害與急性腎衰竭；鈹→肉芽腫與腎間質纖維化、高尿鈣、腎結石；四氯化碳→急性腎小管壞死伴寡尿水腫。砷化氫作業的健康管理比照砷及其化合物作業，法定項目含尿蛋白、尿潛血及尿沉渣鏡檢。","dispute":"","review":{"key_points":["砷化氫腎衰竭＝==溶血後血紅素堵塞腎小管＋腎小管壞死==；尿潛血陽性但沉渣無紅血球","急性期處置：換血、血液透析；監測貧血、黃疸、腎功能","腎病變鑑別：鎘→腎小管與腎結石；無機汞→膜性腎絲球腎炎；鉻→急性腎衰竭；鈹→高尿鈣腎結石"],"refs":[{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"4-6小時後出現深色血尿，接著一、二天後就出現黃疸之症狀，最後急性腎衰竭"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"建議急性期可以藉由換血(bloodexchange)和洗腎(hemodialysis)的方式來減少溶血以及腎臟的傷害"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"血管內溶血出現血紅素尿、或因橫紋肌溶解出現肌球蛋白尿皆會有尿潛血反應"}],"note_ref":"四、砷化氫"}},{"qid":"c10q05","q":"關於半導體業使用之砷化氫，下列敘述何者正確？","options":["中毒症狀在接觸後立即出現，沒有延遲","中毒時應注意聽診心音，觀察是否有心臟音破損現象","砷化氫主要經由呼吸道進入人體，毒性主要來自對紅血球的溶血作用","砷化氫主要經皮膚吸收進入體內"],"answer":2,"recon":"full","src":["113-11","114-02","114-04"],"optexp":["**不符合／錯誤**：砷化氫不刺激、接觸當下沒有感覺，症狀延遲 1–24 小時（通常前幾小時）才出現，114-04 版本註記「x 2hr 後」就是指這個延遲。","**不符合／錯誤**：「心臟音破損」不是醫學名詞，砷化氫中毒的監測重點是血紅素尿、黃疸、貧血、腎功能與高血鉀，不是聽診心音。","**符合／正確（本題答案）**：認定指引「主要途徑還是吸入後中毒」，急性砷化氫暴露導致血管內溶血。","**不符合／錯誤**：砷化氫是氣體，雖曾有皮膚接觸中毒的紀錄，主要途徑是吸入；經皮吸收顯著的是 DMF、二硫化碳等有機溶劑，無機砷化物經皮吸收量也極微少。"],"explanation":"本題考半導體業砷化氫的暴露特性。用途：AsH3 是摻雜氣體，用於砷化鎵等半導體材料的化學氣相沉積與離子植入。物性：無色、比空氣重、幾乎無臭（約 0.5 ppm 才有微弱大蒜味，但中毒閾值更低，114-03「聞到已中毒」即此意），常溫穩定。途徑：吸入為主。時序：暴露後 1–24 小時（通常前幾小時）出現症狀，潛伏期與濃度和時間有關；早期頭痛、頭暈、腹痛、反胃，4–6 小時深色血尿，1–2 天黃疸，之後急性腎衰竭。實驗室：貧血、網狀球增加、游離血紅素上升、Coombs 陰性、尿潛血陽性但沉渣無紅血球。PEL-TWA 0.05 ppm（0.16 mg/m3）。認定基準：從事可能接觸砷化氫之作業＋24 小時內有急性血管內溶血的臨床表現＋合理排除其他原因；輔助基準含同事出現相同症狀、游離血紅素升高、48 小時內未食海產而尿砷超過 100 μg/g creatinine。","dispute":"","review":{"key_points":["砷化氫：==吸入為主要途徑==，症狀延遲 ==1–24 小時==，接觸當下無刺激感","嗅覺閾值約 0.5 ppm（大蒜味）但致命濃度更低；PEL-TWA 0.05 ppm","認定：作業暴露＋24 小時內急性血管內溶血＋排除其他原因；輔助：48 小時未食海產尿砷 >100 μg/g Cr"],"refs":[{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"主要途徑還是吸入後中毒"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"在暴露後1至24內出現症狀，通常在前幾小時內"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"空氣中有大約0.5ppm的砷化氫存在時，它便可被空氣氧化產生輕微類似大蒜的氣味"}],"note_ref":"四、砷化氫"}},{"qid":"c10q06","q":"有關砷及砷化物之毒性，下列敘述何者正確？","options":["元素砷因不溶於水與體液，毒性較三價砷與五價砷小","砷化物具高度過敏性，低劑量即易產生接觸性皮膚炎或潰瘍","五價砷之毒性大於三價砷","有機砷（海鮮中之砷甜菜鹼）毒性最強"],"answer":0,"recon":"full","src":["113-4","113-11","114-02"],"optexp":["**符合／正確（本題答案）**：元素砷（0 價）不溶於水與體液、幾乎不被吸收，毒性遠低於可溶的三價與五價無機砷化物；113-4 回憶此句為正確敘述。","**不符合／錯誤**：砷化物的皮膚傷害是腐蝕刺激性（高濃度粉塵或溶液造成皮膚炎、潰瘍、結膜炎），不是高度過敏性，低劑量也不易產生接觸性皮膚炎；113-4 回憶此句為錯誤敘述。","**不符合／錯誤**：認定指引「三價砷之毒性較五價砷為強」，五價砷要在體內轉化為三價砷才致毒，三價砷極易與硫氫基結合。","**不符合／錯誤**：海鮮的有機砷（砷甜菜鹼 arsenobetaine）結構穩定、難被代謝分解，幾乎無毒，以原型自尿排出，是毒性最低的一類。"],"explanation":"本題考砷化物的毒性排序與代謝。毒性由強至弱：砷化氫（氣體，溶血）> 三價無機砷（亞砷酸鹽、三氧化二砷即砒霜，120 mg 可致死）> 五價無機砷（砷酸鹽）> 甲基化代謝物（MMA、DMA）> 海鮮有機砷（砷甜菜鹼，幾乎無毒）與元素砷（不溶、幾乎不吸收）。代謝：無機砷經呼吸道或攝入吸收（皮膚吸收極微），與紅血球結合分布至肝、腎、肌肉骨骼、皮膚及毛髮；三價砷與 -SH 結合干擾呼吸鏈、麩胺基硫代謝與 DNA 修補，五價砷干擾氧化磷酸化並轉化為三價；三價砷在肝臟甲基化為 MMA、DMA 由尿排出，無機砷半衰期約 1–4 天、甲基化代謝物（MMA、DMA）約 30 小時（認定指引另寫經尿排出半衰期約 10 小時），有機砷以原型排出。這正是法定項目測「尿中無機砷（三價、五價、MMA、DMA 合計）」而非總砷的原因。急性中毒似霍亂（嘔吐、血樣稀便、腹絞痛），存活者數週後出現以感覺神經軸突變性為主的周邊神經病變。","dispute":"","review":{"key_points":["砷毒性排序：==砷化氫 > 三價無機砷 > 五價無機砷 > MMA/DMA > 砷甜菜鹼（海鮮）≈ 元素砷==","三價砷與 -SH 結合；五價砷體內轉為三價；三價砷與 -SH 結合；五價砷體內轉為三價；肝臟甲基化為 MMA、DMA 經尿排出（無機砷半衰期 1–4 天、MMA/DMA 約 30 小時）","砷化物皮膚傷害是腐蝕刺激不是過敏；無機砷經皮吸收極微，主要經呼吸道與攝入"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"三價砷之毒性較五價砷為強"},{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"海產類食物中常見的有機砷化合物如arsenobetaine等幾乎是無毒的"},{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"無機砷化物通常經由呼吸道或攝入進入體內，經皮膚吸收之量極微少"}],"note_ref":"一、砷的來源、代謝與毒性排序"}},{"qid":"c10q07","q":"半導體製程中，下列哪一個步驟最容易暴露砷化氫？","options":["黃光（微影）作業","薄膜作業","蝕刻作業","離子植入作業"],"answer":3,"recon":"full","src":["113-2","113-4","113-11","113-12"],"optexp":["**不符合／錯誤**：黃光（微影）作業使用光阻劑、顯影劑與有機溶劑，不使用砷化氫。","**不符合／錯誤**：薄膜（CVD）製程主要用矽烷、磷化氫、氨、氯氣等，砷化氫只在砷化鎵磊晶才用到；113-2 回憶寫「鍍膜／植入」，其餘版本一致以植入為正解。","**不符合／錯誤**：蝕刻作業用氫氟酸、氯氣、溴化氫、氟碳化物等，不使用砷化氫。","**符合／正確（本題答案）**：砷化氫與磷化氫是離子植入的摻雜氣體來源；砷指引引用的研究顯示離子植入維修過程空氣砷 7.7 μg/m3 高於操作過程 1.6 μg/m3，機台內維修可達 218.6 μg/m3，維修與更換氣瓶時暴露最高。"],"explanation":"本題考半導體製程的砷暴露點。離子植入（ion implantation）以砷化氫、磷化氫、三氟化硼為摻雜氣體，把砷離子打入矽晶圓；正常操作在密閉機台內，暴露主要來自機台維修（拆卸離子源、清理沉積的砷粉塵）與更換氣瓶。指引數據：離子植入維修過程平均空氣砷 7.7 μg/m3、操作過程 1.6 μg/m3，機台內維修 218.6 μg/m3，乾式維修 56.4 μg/m3、濕式 0.6 μg/m3，擦拭採樣可達 146 μg/cm2；維修人員尿中無機砷代謝物平均 29.5 μg/L，MMA 占比隨維修上升。砷化鎵（GaAs）製程另以砷化氫做化學氣相沉積。健康管理：這類勞工屬砷及其化合物作業，做尿中無機砷；砷化氫外洩則是急性溶血事件，靠氣體偵測警報防範。其他製程對照：黃
