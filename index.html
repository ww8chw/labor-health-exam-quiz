/* ---------- QUIZ ---------- */
let session=null;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function collectQuestions(opt){
  let list=[];
  if(opt.source==='mod'){ list = DATA[opt.mod].questions.map(q=>q.qid); }
  else if(opt.source==='wrong'){ list=wrongQids().sort((a,b)=>wrongCount(b)-wrongCount(a)); }
  else { DATA.forEach(m=>m.questions.forEach(q=>list.push(q.qid))); }
  if(opt.shuffleQ!==false) list=shuffle(list);
  if(opt.source==='random' && opt.count!=='all'){ list=list.slice(0, +opt.count); }
  return list;
}
function startQuiz(opt){
  opt = Object.assign({shuffleOpt:true, shuffleQ:true, count:'all'}, opt);
  const ids = collectQuestions(opt);
  if(!ids.length){
    setup.classList.remove('hidden'); runner.classList.add('hidden');
    if(opt.source==='wrong'){ alert('錯題演練目前是空的，先去做幾題，答錯的題目會累積在這裡。'); renderSetup(); }
    return;
  }
  session={ ids, opt, pos:0, correct:0, answered:0, order:{}, answers:{},
    title: opt.source==='mod'?('第 '+(opt.mod+1)+' 章｜'+DATA[opt.mod].title)
          : opt.source==='wrong'?'錯題演練'
          : opt.source==='random'?'隨機抽題':'全部題庫混合' };
  setup.classList.add('hidden'); runner.classList.remove('hidden');
  renderQuestion();
}
function getOrder(pos,q){
  if(session.order[pos]) return session.order[pos];
  const n=q.options.length; let idx=[...Array(n).keys()];
  if(session.opt.shuffleOpt) idx=shuffle(idx);
  session.order[pos]=idx; return idx;
}
function revealOpts(opts,q,chosen){
  opts.forEach(x=>{
    x.disabled=true; x.classList.add('reveal');
    const xi=+x.dataset.oi;
    if(xi===q.answer) x.classList.add('correct');
    else if(xi===chosen) x.classList.add('wrong');
    else x.classList.add('dim');
  });
}
function renderQuestion(){
  const pos=session.pos;
  const q = QMAP[session.ids[pos]];
  const ans = session.answers[pos];            // undefined until answered
  const done = session.answers[pos]!==undefined;
  const prog = Math.round((pos+(done?1:0))/session.ids.length*100);
  const wc = wrongCount(q.qid);
  const letters=['A','B','C','D','E','F'];
  const isLast = pos===session.ids.length-1;
  let h =
    '<div class="q-top">'+
      '<span class="q-progress">第 '+(pos+1)+' / '+session.ids.length+' 題</span>'+
      '<div class="q-bar"><i style="width:'+prog+'%"></i></div>'+
      '<span class="q-score">✔ '+session.correct+'</span>'+
      (wc>0?'<span class="q-tag wrong-tag">答錯 '+wc+' 次</span>':'')+
      '<button class="q-abort" id="abortBtn">結束本輪</button>'+
    '</div>'+
    '<div class="q-mod">'+esc(session.title)+'　·　'+esc(q.modTitle)+'　·　'+esc(q.qid)+(q.recon==='rebuilt'?'<span class="q-tag">選項重建</span>':q.recon==='partial'?'<span class="q-tag">部分選項重建</span>':'')+(q.src&&q.src.length?'<span class="q-tag src-tag">考古 '+esc(q.src.join('、'))+'</span>':'')+'</div>'+
    '<div class="q-text">'+esc(q.q)+'</div>'+
    (q.dispute?'<div class="q-dispute"><b>⚠️ 爭議註記</b>'+inlineMd(q.dispute)+'</div>':'');

  const order=getOrder(pos,q);
  h+='<div class="opts" id="opts">';
  order.forEach((oi,di)=>{
    const oe = (q.optexp&&q.optexp[oi])?('<div class="oe"><b>'+letters[di]+'　解析：</b>'+inlineMd(q.optexp[oi])+'</div>'):'';
    h+='<button class="opt" data-oi="'+oi+'"><span class="k">'+letters[di]+'</span><span class="otext">'+esc(q.options[oi])+'</span>'+oe+'</button>';
  });
  h+='</div>';
  h+='<div class="explain'+(done&&q.explanation?' show':'')+'" id="exp"><span class="lab">總詳解　</span><span id="expText">'+(done?inlineMd(q.explanation||''):'')+'</span></div>';
  h+=deepHtml(q, done, true);
  h+='<div class="q-nav">'+
       (pos>0?'<button class="btn ghost" id="prevBtn">← 上一題</button>':'')+
       '<div class="spacer"></div>'+
       '<button class="btn'+(done?'':' hidden')+'" id="nextBtn">'+(isLast?'看結果 →':'下一題 →')+'</button>'+
     '</div>';
  runner.innerHTML=h;
  document.getElementById('abortBtn').onclick=()=>renderSetup();
  const pb=document.getElementById('prevBtn'); if(pb) pb.onclick=prevQuestion;
  const nb=document.getElementById('nextBtn'); if(nb) nb.onclick=nextQuestion;
  bindGoNote(runner);

  const opts=[...runner.querySelectorAll('.opt')];
  if(done){
    revealOpts(opts,q,ans.chosen);
    return;
  }
  opts.forEach(b=>b.onclick=()=>{
    if(session.answers[pos]!==undefined) return;
    const chosen=+b.dataset.oi;
    const correct = chosen===q.answer;
    session.answers[pos]={chosen, correct};
    revealOpts(opts,q,chosen);
    flashOX(correct);
    if(q.explanation){
      document.getElementById('expText').innerHTML = inlineMd(q.explanation);
      document.getElementById('exp').classList.add('show');
    }
    const dp=document.getElementById('deep'); if(dp) dp.classList.add('show');
    document.getElementById('nextBtn').classList.remove('hidden');
    grade(q, correct);
  });
}
function flashOX(correct){
  const wrap=document.createElement('div');
  wrap.className='oxflash';
  wrap.innerHTML='<span class="mark '+(correct?'ok':'no')+'">'+(correct?'○':'✕')+'</span>';
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),900);
}
function grade(q, correct){          // 每題只計一次（回上一題不重複計分）
  session.answered++; stats.answered++;
  if(correct){ session.correct++; stats.correct++; }
  else { wrongMap[q.qid] = (wrongMap[q.qid]||0) + 1; }
  persistWrong(); persistStats(); updateGlobalStat();
}
function prevQuestion(){
  if(session.pos>0){ session.pos--; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function nextQuestion(){
  if(session.pos < session.ids.length-1){ session.pos++; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
  else finishQuiz();
}
function finishQuiz(){
  const total=session.answered;
  const acc = total? Math.round(session.correct/total*100):0;
  const wrong=total-session.correct;
  let msg = acc>=90?'表現優異 🎉':acc>=70?'不錯，繼續加強！':'再多練幾輪就會更熟！';
  runner.innerHTML=
    '<div class="result">'+
      '<div class="lbl">本次正確率</div>'+
      '<div class="big">'+acc+'%</div>'+
      '<div class="lbl">'+esc(msg)+'</div>'+
      '<div class="rbar">'+
        '<div><b>'+session.ids.length+'</b>本次題數</div>'+
        '<div class="g"><b>'+session.correct+'</b>答對</div>'+
        '<div class="b"><b>'+wrong+'</b>答錯</div>'+
      '</div>'+
      '<div class="q-nav" style="justify-content:center">'+
        (wrongQids().length?'<button class="btn" id="reviewWrong">錯題演練（'+wrongQids().length+'）</button>':'')+
        (wrongQids().length?'<button class="btn ghost" id="wrongList2">錯題複習清單</button>':'')+
        '<button class="btn ghost" id="againBtn">再練一輪</button>'+
        '<button class="btn soft" id="backSetup">回設定</button>'+
      '</div>'+
    '</div>';
  const rw=document.getElementById('reviewWrong'); if(rw) rw.onclick=()=>startQuiz({source:'wrong'});
  const wl=document.getElementById('wrongList2'); if(wl) wl.onclick=()=>renderWrongList();
  document.getElementById('againBtn').onclick=()=>startQuiz(session.opt);
  document.getElementById('backSetup').onclick=()=>renderSetup();
  updateGlobalStat();
}

/* ---------- init ---------- */
buildToc(); selectMod(curMod); updateGlobalStat();
</script>
</body>
