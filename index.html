光→光阻與溶劑；蝕刻→HF、氯、溴化氫；薄膜→矽烷、磷化氫；清洗→HF、硫酸、過氧化氫、異丙醇。","dispute":"","review":{"key_points":["半導體砷化氫暴露最高的步驟＝==離子植入==，尤其機台維修與換氣瓶","離子植入維修空氣砷 7.7 μg/m3 vs 操作 1.6 μg/m3；機台內維修可達 218.6 μg/m3","製程對照：黃光→光阻溶劑；蝕刻→HF、氯；薄膜→矽烷、磷化氫；清洗→HF、硫酸、過氧化氫"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"離子植入維修過程平均空氣中砷濃度7.7μg/m³高於離子植入操作過程的1.6μg/m³"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"為製程中的摻雜氣體(dopantgas)"}],"note_ref":"一、砷的來源、代謝與毒性排序"}},{"qid":"c10q08","q":"砷作業勞工之尿中砷檢查，下列敘述何者最正確？","options":["採檢前應禁食海鮮、海帶等含砷食物（約一天），以免總砷值偏高","採檢前吃海鮮不影響結果","尿中總砷即等於無機砷","應改採血中砷作為法定項目"],"answer":0,"recon":"partial","src":["114-03"],"optexp":["**符合／正確（本題答案）**：海鮮、海帶含大量有機砷（砷甜菜鹼），食後尿中總砷大幅偏高；認定指引輔助基準要求「48 小時內未食海產類等富含砷的食物」，分級指引第二級也列「飲食因素造成之砷濃度偏高」；實務上採檢前約 1–3 天避免海鮮，114-03 回憶以「NPO 一天」為合理答案。","**不符合／錯誤**：吃海鮮會使總砷升高，部分海藻的砷糖也會代謝成 DMA，確實影響判讀。","**不符合／錯誤**：尿中總砷包含有機砷；法定項目與分級門檻都是「無機砷」（三價、五價、MMA、DMA 合計 ≥35 μg/L），總砷不等於無機砷。","**不符合／錯誤**：法定項目與認可辦法第 17 條委託項目都是尿中無機砷；血中砷只在急性砷化氫中毒急診時考慮，砷血中半衰期短，不適合慢性暴露監測。"],"explanation":"本題考砷生物偵測的判讀。法定項目：尿中無機砷檢查（包括三價砷、五價砷、單甲基砷、雙甲基砷及尿液肌酸酐；變更作業者無須檢測單甲基砷及雙甲基砷）。分級門檻：尿中三價砷、五價砷、MMA、DMA 合計之總無機砷 ≥35 μg/L，是第三級（無法由工作以外原因解釋）或第四級（可由工作解釋）的判定條件；認定指引另寫 ≥30 μg/g creatinine（或 ≥35 μg/L），並要求 48 小時內未食海產。干擾：海鮮、海帶、大型魚類的砷甜菜鹼幾乎無毒但使總砷升高；分級指引把「飲食因素造成之砷濃度偏高」列為第二級（工作以外原因）的例子。尿液品質：肌酸酐 20–250 mg/dL、比重 1.003–1.020 為可接受，稀釋尿要重採。台灣一般人尿砷背景約 30–35 μg/L，高砷井水地區可達 91–113 μg/L。血砷只用於急性中毒；毛髮與指甲砷可反映數月前暴露但受外部污染影響。","dispute":"","review":{"key_points":["法定項目＝==尿中無機砷（三價＋五價＋MMA＋DMA）==，非總砷、非血砷；分級門檻 ==≥35 μg/L==","採檢前禁食海鮮海帶（認定指引：48 小時內未食海產）；飲食造成砷偏高屬第二級（工作以外原因）","尿液可接受：肌酸酐 20–250 mg/dL、比重 1.003–1.020"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"48小時內未食海產類等富含砷的食物"},{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"異常項目可由工作以外的原因解釋，如飲食因素造成"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"尿中無機砷檢查(包括三價砷、五價砷、單甲基砷、雙甲基砷及"}],"note_ref":"三、砷作業法定項目、尿砷判讀與分級"}},{"qid":"c10q09","q":"有關砷及其化合物作業健康管理分級建議指引，下列何者正確？","options":["尿中無機砷（三價砷、五價砷、MMA、DMA 合計）≥35 μg/L 為第三級管理之判定依據之一","尿中總砷 ≥35 μg/g creatinine 即列第四級","只要皮膚色素沉著即列第四級","砷作業無須做胸部 X 光"],"answer":0,"recon":"rebuilt","src":["114-03","113-11"],"optexp":["**符合／正確（本題答案）**：分級指引砷作業第三級 2.3「尿中三價砷、五價砷、MMA、DMA 等砷及其代謝物檢驗值合計之總無機砷數 ≥35 μg/L」，第四級亦同。","**不符合／錯誤**：門檻是無機砷不是總砷，單位是 μg/L 不是 μg/g creatinine；而且達門檻而無法由工作以外原因解釋是第三級，能由工作相關原因解釋才是第四級。","**不符合／錯誤**：皮膚色素沉著是符合砷危害的表現，但要「可由工作相關原因解釋」才列第四級；無法確定與工作相關者列第三級請職醫評估，可由工作以外原因解釋者列第二級。","**不符合／錯誤**：砷作業法定項目含胸部 X 光（大片），用以偵測肺部腫瘤，「胸部 X 光出現疑似肺部腫瘤」也是第三、四級的判定條件。"],"explanation":"本題考砷作業的健康管理分級。法定項目：作業經歷調查、呼吸系統症狀既往病史、鼻腔／皮膚／呼吸道／腸胃及神經系統身體檢查、胸部 X 光、尿蛋白尿潛血尿沉渣、ALT 與 γ-GT、血球比容血色素紅血球白血球，健康檢查加尿中無機砷。第二級：異常可由工作以外原因解釋（飲食造成砷偏高、缺鐵性貧血、尿路感染或結石）。第三級（符合任一且無法由工作以外原因解釋，或事業單位未提供足以判定的環測紀錄）：2.1 鼻中膈黏膜潰瘍或穿孔、末梢神經炎、暴露部位色素沉著或角化、疑似皮膚癌或肝臟腫瘤；2.2 白血球、紅血球或血小板至少一項低於正常、胸部 X 光疑似肺腫瘤、蛋白尿達二價（≥100 mg/dL）、肝病變；2.3 總無機砷 ≥35 μg/L。第四級：相同表現且可由工作相關原因解釋。考量疾病：精神或神經系統疾病、貧血、肝病、呼吸系統疾病、心血管疾病、接觸性皮膚疾病及妊娠中勞工。PEL-TWA：無機砷 0.01 mg/m3、有機砷 0.5 mg/m3、砷化氫 0.05 ppm。","dispute":"","review":{"key_points":["砷分級門檻：總無機砷 ==≥35 μg/L==；血球任一項低於正常、胸部 X 光疑似肺腫瘤、蛋白尿達二價、肝病變","砷作業法定項目含胸部 X 光、ALT 與 γ-GT、血球、尿液常規、尿中無機砷","PEL-TWA：無機砷 0.01 mg/m3、有機砷 0.5 mg/m3、砷化氫 0.05 ppm"],"refs":[{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"尿中三價砷、五價砷、MMA、DMA等砷及其代謝物檢驗值合計之總無機砷數≥35μg/L"},{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"血液檢查(白血球、紅血球或血小板)至少一項低於正常、胸部X光出現疑似肺部腫瘤"},{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"砷及其無機化合物(以砷計)八小時日時量平均容許濃度(PEL-TWA)：0.01"}],"note_ref":"三、砷作業法定項目、尿砷判讀與分級"}},{"qid":"c10q10","q":"下列哪些重金屬中毒會同時出現皮膚症狀、掉髮與周邊神經病變？（1）砷（2）鉈（3）鉛（4）汞","options":["（1）（2）（3）","（2）（3）","（1）（2）","（1）（2）（3）（4）"],"answer":2,"recon":"full","src":["113-8","114-02","115-02"],"optexp":["**不符合／錯誤**：含鉛。鉛以貧血、腹絞痛、運動神經病變（垂腕）、腦病變為主，沒有掉髮，皮膚表現只有齒齦鉛線，不符合三項同時出現。","**不符合／錯誤**：含鉛且漏掉砷；鉛不掉髮，砷才同時有皮膚角化色素變化、毛髮脫落與多發性神經炎。","**符合／正確（本題答案）**：砷（掌蹠角化、色素變化、Mees 氏線、毛髮脫落、感覺運動周邊神經病變）與鉈（脫髮、疼痛性周邊神經病變、Mees 氏線）同時具備皮膚、掉髮、周邊神經三項。","**不符合／錯誤**：汞以震顫、齒齦炎口內炎、erethism 與腎病變為主，掉髮不是典型表現；鉛亦不符，不能全選。"],"explanation":"本題考「皮膚症狀＋掉髮＋周邊神經病變」這組三聯表現的金屬鑑別。砷：認定指引理學檢查列「指甲出現白色橫向 Mee 氏線、毛髮脫落、色素沉著、脫色斑、或表皮角化症」，分級指引慢性中毒列「體重減輕、掉頭髮」，神經系統為多發性神經炎（感覺為主、下肢重於上肢）。鉈：脫髮（暴露後 2–3 週）、疼痛性上行性周邊神經病變、Mees 氏線，來源殺鼠劑、光學玻璃、半導體。鉛：貧血、腹絞痛、運動神經病變（垂腕）、腦病變、齒齦鉛線，無掉髮。汞：無機汞震顫、erethism、口內炎、腎病變；有機汞視野狹窄、共濟失調、感覺異常；均無典型掉髮。所以答（1）（2）砷與鉈。回憶版差異見爭議註記。","dispute":"114-02 回憶者標（D）全選，115-02 回憶者答「鉈、砷」。依認定指引與分級指引原文：砷有掉髮（「體重減輕、掉頭髮」「毛髮脫落」）、Mees 氏線與多發性神經炎；鉈有脫髮、周邊神經病變與 Mees 氏線；鉛的臨床表現（貧血、腹絞痛、運動神經病變、齒齦鉛線）與汞（震顫、erethism、口內炎、腎病變）都沒有掉髮，鉛也沒有典型皮膚表現。故以（1）（2）砷、鉈為準，不全選。","review":{"key_points":["皮膚＋掉髮＋周邊神經三聯：==砷、鉈==；鉛（貧血、垂腕、鉛線）與汞（震顫、erethism）不掉髮","Mees 氏線：砷、鉈、砷化氫中毒後 2–3 週","砷神經病變＝感覺為主的多發性神經炎、下肢重於上肢；鉈＝疼痛性上行性周邊神經病變"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"Mee氏線、毛髮脫落、色素沉著、脫色斑、或表皮角化症"},{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"無多發性神經炎導致之感覺或運動神經異常"},{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"體重減輕、掉頭髮、時而痢疾，時而便秘"}],"note_ref":"五、鉈與砷、鉈、鉛、汞的鑑別"}},{"qid":"c10q11","q":"下列何者為砷暴露相關之癌症？","options":["肺癌、皮膚癌、膀胱癌與肝臟血管肉瘤","僅皮膚癌","鼻咽癌","白血病"],"answer":0,"recon":"rebuilt","src":["113-2","整理-表格"],"optexp":["**符合／正確（本題答案）**：IARC 1980、1987 年確認砷為第一類致癌物，認定指引「會導致人類皮膚癌、肺癌、淋巴癌、膀胱癌及肝血管瘤等」；氯乙烯指引也把含砷製劑列為肝血管肉瘤的病因；台灣井水研究顯示膀胱癌、腎臟癌、皮膚癌、肺癌與攝護腺癌、肝癌有劑量反應關係。","**不符合／錯誤**：不只皮膚癌，肺癌（暴露三氧化砷 25 年的煉銅工人肺癌死亡率為對照組 5 倍）與膀胱癌證據都充分。","**不符合／錯誤**：鼻咽癌與鼻竇癌的職業因子是甲醛、木屑、鎳等；砷會造成鼻中膈潰瘍穿孔，但不是鼻咽癌的認定致癌物。","**不符合／錯誤**：白血病是苯、游離輻射、1,3-丁二烯的職業癌；砷雖可致骨髓抑制與再生不良性貧血，不列為白血病致癌物。"],"explanation":"本題考砷相關癌症。IARC Group 1，充分證據：肺癌（吸入，煉銅、農藥製造）、皮膚癌（Bowen 氏病、基底細胞癌、鱗狀細胞癌）、膀胱癌；有限證據：肝血管肉瘤、腎癌、攝護腺癌、肝癌。歐盟 2009 年職業病診斷指引：肺癌最小累積暴露劑量 250 μg/m3 年、最長潛伏期 15 年；皮膚癌最小累積期限 1 年、最長潛伏期 5 年。肝血管肉瘤的三大職業／環境病因：氯乙烯、無機砷（含砷製劑）、二氧化釷（thorotrast）。113-2 回憶「肝毒性物質中會導致肝癌者：砷（台灣則否）」指台灣本土砷致肝癌的證據來自井水地區研究而非職業暴露；整理表格的肝癌清單另列氯乙烯、四氯化碳、三氯乙烯、多氯聯苯、DMF，其中職業認定最明確的是氯乙烯。","dispute":"","review":{"key_points":["砷 IARC Group 1：==肺癌、皮膚癌、膀胱癌==（充分）；肝血管肉瘤、腎癌、攝護腺癌、肝癌（有限）","肝血管肉瘤三大病因：氯乙烯、無機砷、二氧化釷","歐盟指引：砷肺癌最小累積 250 μg/m3 年、潛伏期 ≤15 年；皮膚癌累積 ≥1 年、潛伏期 ≤5 年"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"會導致人類皮膚癌、肺癌、淋巴癌、膀胱癌及肝血管瘤等"},{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"肝血管肉瘤的其他病因包括thorotrast（二氧化釷）、arsenicals（含砷製劑）"},{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"也與男女性的膀胱癌、腎臟癌、皮膚癌及肺癌有劑量反應關係"}],"note_ref":"二、慢性砷中毒的臨床表現與癌症"}},{"qid":"c10q12","q":"有關砷作業之選配工時宜考量疾病，下列何者正確？","options":["精神或神經系統疾病、貧血、肝病、呼吸系統疾病、心血管疾病、接觸性皮膚疾病","僅考量腎臟疾病","僅考量聽力障礙","無須考量任何疾病"],"answer":0,"recon":"rebuilt","src":["整理-表格"],"optexp":["**符合／正確（本題答案）**：附表十二「砷及其化合物之作業」考量疾病為精神或神經系統疾病、貧血、肝病、呼吸系統疾病、心血管疾病、接觸性皮膚疾病；分級指引另加妊娠中勞工之健康保護。","**不符合／錯誤**：腎臟疾病是鎘、鉛、四烷基鉛、汞、鈹、氯乙烯、DMF 等作業的考量項目，砷作業附表十二未列腎臟疾病，也不是「僅」考量一項。","**不符合／錯誤**：聽力異常是噪音作業（心血管疾病、聽力異常）與高架作業（聽力障礙）的考量項目，與砷無關。","**不符合／錯誤**：砷作業有六類考量疾病，而且職業安全衛生法第 30 條明列妊娠中之女性勞工不得從事暴露於砷及其化合物之工作。"],"explanation":"本題考附表十二砷作業的選配工考量疾病，並連結母性保護。砷作業六類：精神或神經系統疾病（砷致多發性神經炎）、貧血（骨髓抑制、白血球減少）、肝病（肝腫大、肝功能異常、肝癌）、呼吸系統疾病（呼吸道刺激、肺癌）、心血管疾病（烏腳病、缺血性心臟病）、接觸性皮膚疾病（角化、色素沉著、皮膚癌）。職業安全衛生法第 30 條第 1 項：雇主不得使妊娠中之女性勞工從事鉛及其化合物散布場所之工作（第 2 款）、處理或暴露於二硫化碳、三氯乙烯、環氧乙烷、丙烯醯胺、次乙亞胺、砷及其化合物、汞及其無機化合物等危害性化學品之工作（第 5 款）。對照記憶其他金屬作業的考量疾病：鎘→腎臟、肌肉骨骼、心血管、貧血、呼吸系統；鉻酸→呼吸系統疾病、接觸性皮膚疾病；鎳→呼吸系統疾病、皮膚炎；銦→肺部疾病；錳→精神或中樞神經系統疾病（巴金森症候群）、慢性呼吸道疾病、肝病、腎臟疾病、接觸性皮膚疾病。","dispute":"","review":{"key_points":["砷作業考量疾病六類：==精神或神經系統、貧血、肝病、呼吸系統、心血管、接觸性皮膚疾病==（無腎臟）","職安法第 30 條：妊娠中女性不得暴露於二硫化碳、三氯乙烯、環氧乙烷、丙烯醯胺、次乙亞胺、==砷==、汞及其無機化合物","對照：鎘考量腎臟骨骼；鉻酸考量呼吸道皮膚；鎳考量呼吸系統皮膚炎；銦考量肺部疾病"],"refs":[{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"考量不適合從事作業之疾病，如精神或神經系統疾病、貧血、肝病"},{"src":"18_砷及其化合物作業管理分級參考","file":"_ref/分級指引/18_砷及其化合物作業管理分級參考.txt","quote":"呼吸系統疾病、心血管疾病、接觸性皮膚疾病，及妊娠中勞工之健"},{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"處理或暴露於二硫化碳、三氯乙烯、環氧乙烷、丙烯醯胺、次乙亞胺、砷及其化合物、汞及其無機化合物"}],"note_ref":"三、砷作業法定項目、尿砷判讀與分級"}}]},{"idx":10,"order":10,"title":"有機溶劑與其他化學物質","group":"化學性危害","gi":3,"notes_md":"本章 29 題、全卷第二多，涵蓋有機溶劑與其他化學物質。策略是「一個物質記一個標的器官與一個生物偵測」：正己烷→周邊神經、甲苯→中樞神經、二硫化碳→心血管、氯乙烯→肝、DMF→肝、TDI→氣喘、苯胺→變性血紅素、MOCA→膀胱癌。\n\n## 一、有機溶劑通論：暴露途徑與作業型態\n- 暴露途徑：==吸入＞皮膚＞食入==。吸入經肺泡直接進入體循環，不經肝臟首渡代謝，也是「毒物最快最嚴重的進入方式」。\n- 容許暴露標準附表一的符號：==皮==＝可經皮吸收、==瘤==＝致癌性、==高==＝最高容許濃度。生物偵測涵蓋吸入與皮膚兩條途徑，空氣採樣只反映吸入。\n- 塗裝暴露量排序：==噴塗＞滾塗≒刷塗＞浸塗==；噴漆工同時暴露溶劑蒸氣、漆霧、顏料金屬與硬化劑異氰酸酯。\n- 控制優先順序：取代＞工程控制（局部排氣）＞行政管理＞個人防護具。\n\n## 二、正己烷與溴丙烷：周邊神經病變\n- **正己烷**：CYP450→2-己醇→==2,5-己二酮==（神經毒性代謝物，與軸突蛋白交聯）。生物偵測為尿中 2,5-己二酮，半衰期 ==13–14 小時==（班末採檢），BEI 游離型 0.4 mg/L。\n  - 臨床：遠端感覺運動多發性神經病變，下肢為主，跟腱反射喪失、無法以腳跟行走、==跨閾步態==；停止暴露後可能先惡化（coasting）再恢復。\n  - 認定指引：暴露 >50 ppm，最短接觸 1 個月、最長潛伏期 6 個月。台灣 1983–84 年彩色打樣公司群聚事件為經典案例。\n  - **法規版本**：考試當時的舊附表十，正己烷作業只有作業經歷、既往病史與神經皮膚身體檢查，==沒有任何抽血或生物偵測==；115 年新附表十才加列尿中游離型 2,5-己二酮。\n- **1-溴丙烷**：取代三氯乙烯的新興清洗劑（金屬與電子零件清洗、噴膠、乾洗），以==吸入==為主。PEL-TWA ==0.5 ppm（皮）==。毒性為中樞及末梢神經病變＋皮膚紅疹；==動物有肝毒性，人體尚無明確證據==；IARC 2017 年列 ==2B==。\n- 〔10/03 課堂〕溴丙烷群聚：102 年 5 月（職安署 104.4.17 新聞稿；認定指引記載 102 年 8–10 月陸續發病）某**高爾夫球桿頭**製造廠員工在近乎密閉、通風不良的環境用溴丙烷清洗桿頭，出現腰部麻木、走路不穩、雙下肢肌肉痙攣疼痛、頻尿便秘，確診==多發性神經病變==，為國內職業病鑑定==首例群聚案==（職安署 104.4.17 發布）。\n- 同樣造成周邊神經病變者：正己烷、溴丙烷、二硫化碳、丙烯醯胺；**甲苯與苯不是**。\n\n## 三、甲苯：中樞神經毒性\n- 標的是==中樞神經==：急性麻醉（欣快、幻覺、運動失調、意識障礙）、慢性小腦萎縮與腦白質病變、認知障礙、感覺神經性聽力損失、視神經病變。\n- 生物偵測＝尿中馬尿酸（半衰期約 3 小時，蔬果中的苯甲酸會干擾）或尿中鄰位甲酚；PEL 50 ppm（皮）。\n- 甲苯與噪音併存會加重聽力損失，可加做純音聽力與腦幹聽覺誘發電位。\n- 陷阱：**周邊神經病變是正己烷，白血病是苯**，都不是甲苯。\n\n## 四、二硫化碳：心血管與神經\n- 行業：嫘縈人造絲、玻璃紙、橡膠硫化、殺蟲劑。PEL-TWA ==10 ppm（皮）==。\n- 危害：加速==動脈硬化==（冠心病、腦血管、腎動脈病變）、類巴金森、精神人格異常（急性 500–1000 ppm 即情緒失常）、周邊神經病變、==眼底微動脈瘤==、視神經與聽神經病變。\n- **沒有脊髓病變**（脊髓亞急性合併退化要想到笑氣與維生素 B12）。\n- 法定項目含==心電圖==——附表十要做心電圖的只有三個作業：**高溫、異常氣壓（40 歲以上或疑有心臟病者）、二硫化碳**。\n\n## 五、氯乙烯：肝毒性與致癌性\n- 慢性危害三組：\n  1. ==肝纖維化／非硬化性門脈高壓==：從肝竇周圍纖維化開始，可在肝硬化前就出現脾腫大與門脈高壓（Banti 氏症候群）。\n  2. ==氯乙烯疾病==：肢端骨溶解、雷諾氏現象、遠端皮膚硬皮樣變化。\n  3. ==肝血管肉瘤與肝細胞癌==。\n- 認定門檻：血管肉瘤／肝癌最短暴露與最短誘導期各 ==10 年==；肝纖維化合併門脈高壓需 ==≥50 ppm==、最短暴露 2 年、最短誘導期 5 年、最長潛伏期 30 年；雷諾與肢端溶解最短暴露 1 年。\n- **腎臟：無已知人類相關研究資料**——「氯乙烯不會造成何種癌症」答腎臟癌；職業性腎癌要想到三氯乙烯與鎘。\n- 追蹤以==腹部超音波==（門靜脈擴大、脾腫大、肝纖維化）比肝功能指數敏感。PEL-TWA 1 ppm（瘤），IARC Group 1。\n- **肝血管肉瘤三大病因：氯乙烯、無機砷、二氧化釷（thorotrast）**。\n\n## 六、合成皮與 PU 製程：DMF、DMAC 與異氰酸酯\n- 同一條產線上要分清兩個標的：**呼吸道致敏＝TDI／MDI／IPDI；肝毒性＝DMF**。\n- **異氰酸酯**：低分子量致敏物之首，佔職業性氣喘約 46.6%，也可致過敏性肺炎。容許濃度：TDI ==最高容許濃度 0.005 ppm==、MDI 0.02 ppm、IPDI PEL-TWA 0.005 ppm。法定項目含氣喘與過敏病史、呼吸系統與皮膚檢查、==肺功能==；健康檢查的胸部 X 光只有變更作業者要做。\n  - 氣喘可為立即性、遲發性或雙重反應；遲發型常夜間發作、易誤判與工作無關。診斷順位：工作相關病史＋尖峰呼氣流速記錄→特異性 IgE→==特異性支氣管激發試驗（黃金標準）==。\n  - 低分子量致敏物：異氰酸酯、酸酐、鉑鹽、鎳、鉻、環氧樹脂硬化劑、甲醛、松香、木粉；高分子量：麵粉、乳膠、動物蛋白、酵素、海鮮。\n- **DMF**：合成皮／PU 樹脂溶劑，經吸入與皮膚吸收→中毒性肝炎，==飲酒後臉部潮紅==是特徵。法定項目為酗酒及肝病既往病史、肝腎心血管皮膚檢查、==ALT 與 γ-GT==；PEL-TWA 10 ppm；IARC 2A。DMAC 用於壓克力與芳香族聚醯胺纖維，不是合成皮製程。\n\n## 七、化學性肝毒素的分類\n| 類型 | 性質 | 代表物 |\n|---|---|---|\n| 內因性直接型 | 數分鐘至數小時即壞死或脂化 | ==四氯化碳、氯仿、四氯乙烷==、DMF（指引表一）；考題中黃磷**不算**直接型 |\n| 內因性間接型 | 經代謝活化或阻斷代謝路徑 | 乙醇、urethane、黴菌毒素、==黃磷==（課程分類；Zimmerman 教科書列為直接型）（肝細胞型）；methylene dianiline（膽汁鬱積型） |\n| 特異體質型 | 不可預測、與劑量無關 | ==halothane==（過敏性 1–4 週）、isoniazid（代謝異常） |\n- 四氯化碳＝CYP2E1 活化成==自由基==→脂質過氧化→==小葉中心（zone 3）==壞死與脂肪肝；人類以急性為主，無轉慢性的報告。\n- 慢性肝傷害合併再生結節與纖維化：多氯聯苯、1,1,2,2-四氯乙烷。多數肝毒物與致癌物須先經 ==MFO／CYP450== 活化。\n\n## 八、芳香族胺與硝基化合物：變性血紅素血症與膀胱癌\n- **變性血紅素血症**：==苯胺、硝基苯、TNT、對苯二胺、聯苯胺類==與硝基烷烴、亞硝酸鹽。機轉為 Fe2+→Fe3+ 無法攜氧，表現==發紺、巧克力色血液、給氧不改善==，治療用==亞甲藍==（蠶豆症禁用）。苯胺 PEL-TWA 2 ppm（皮）。**苯、甲苯、二甲苯都不造成變性血紅素血症**。\n- **職業性膀胱癌**：聯苯胺、4-胺基聯苯、β-萘胺、二氯聯苯胺、α-萘胺、鄰甲苯胺與 ==MOCA==（PU 硬化劑，IARC Group 1，PEL-TWA 0.02 ppm）。MOCA 認定：最短暴露 ==1 年==、最短誘導期 ==10 年==、無最長潛伏期。對照：苯引起白血病最短暴露 6 個月、誘導期 5 年。\n\n## 九、氫氟酸灼傷\n- HF 是弱酸，但==未解離分子脂溶性高、可穿透深層組織==；氟離子與鈣鎂結合造成深部壞死。\n- 疼痛劇烈但可延遲：==≥50% 立即==、20–50% 需 1–8 小時、\u003c20% 可晚至 24 小時。\n- 全身性低血鈣風險門檻：濃度 ==≥50% 且體表面積 ≥1%==，或任何濃度而體表面積 ≥5%。致死機轉為低血鈣、低血鎂、高血鉀→QT 延長與心律不整；治療用==葡萄糖酸鈣==凝膠或局部注射。\n\n## 十、農藥：有機磷與巴拉刈\n- **有機磷三階段**：\n  1. 急性膽鹼性危象：蕈毒鹼症狀（DUMBELS：流涎、流淚、多汗、腹瀉、縮瞳）＋菸鹼症狀（==肌束顫抖==、無力）。\n  2. ==中間症候群==（24–96 小時）：頸屈肌、近端肢體、腦神經支配肌無力與呼吸衰竭，對 atropine 與 pralidoxime 無效，重點是呼吸監測。\n  3. ==OPIDN 遲發性神經病變==（1–3 週）：抑制 ==NTE（神經病變標的酯酶）==並老化→遠端軸突病變，與膽鹼酯酶抑制無關；方向是**粗長纖維＞細纖維、遠端＞近端、軸突＞髓鞘**。\n  - 診斷：血漿與紅血球==膽鹼酯酶活性==下降。毒蕈（muscarine 型）只有蕈毒鹼症狀，無肌束顫抖與中間症候群。\n- **巴拉刈**：法定項目只有三條，重點是==皮膚角化、黑斑、疑似皮膚癌既往病史＋皮膚及指甲身體檢查==。慢性職業暴露可能引起==皮膚癌==，另有研究顯示與巴金森氏病有關（流行病學關聯，非直接中毒）。急性食入為口咽灼傷、腎小管壞死與進行性==肺纖維化==（急救時限制給氧）。容許濃度：聯吡啶不得檢出、巴拉刈 0.1 mg/m3。\n\n## 十一、多氯聯苯與一氧化碳\n- **PCB**：==氯痤瘡==（臉、耳後、腋窩、軀幹、外生殖器，不侵犯鼻子）、色素沉著、==軸突性==周邊神經病變、腦波減慢、肝功能異常、後代智能發育障礙。**不會**造成類巴金森與==脫髓鞘性==神經病變。經典事件：日本 Yusho（1968）、台灣米糠油油症（1979）。職業與中毒性神經病變幾乎都是軸突性遠端 dying-back（正己烷、丙烯醯胺、砷、鉛、OPIDN）。\n- **一氧化碳**：指引原文寫腦部異常==最常見的病灶在大腦白質==（去髓鞘、水腫、局部壞死、出血點）；==最具特徵性==的急性影像則是兩側==蒼白核==對稱性低密度。遲發性神經病變在正常期 1–41 天後出現（智能減退、類帕金森、大小便失禁），高壓氧可降低發生率。COHb >10% 且神智改變或有心臟症狀者應做心電圖並監測 troponin。\n\n## 十二、塑膠與橡膠業的皮膚過敏原\n- 塑膠業最重要的接觸過敏原＝==環氧樹脂==（及其胺類硬化劑）；苯乙烯、酸類、溶劑屬刺激原；聚合完成的成品（聚丙烯）惰性不致敏。\n- 橡膠業：過敏原＝橡膠添加劑（==thiuram、carbamate==）；刺激原＝滑石、硬脂酸鋅、溶劑。\n- 刺激性皮膚炎＝非免疫、首次接觸即可發生、首次接觸即可發生（台灣資料刺激性與過敏性約各半）；過敏性＝第四型、需先致敏、靠貼膚試驗診斷。","questions":[{"qid":"c11q01","q":"正己烷作業之生物偵測，應檢驗下列何種物質？","options":["尿中馬尿酸","尿中 2,5-己二酮（2,5-hexanedione）","血中正己烷","尿中三氯醋酸"],"answer":1,"recon":"full","src":["113-2","113-4","113-7","113-8","113-11","114-05","整理-表格"],"optexp":["**不符合／錯誤**：尿中馬尿酸（hippuric acid）是甲苯的代謝指標，甲苯經氧化為苯甲酸再與甘胺酸接合成馬尿酸，半衰期約三小時；蔬果中的苯甲酸會干擾判讀，低暴露者更不可靠。與正己烷無關。","**符合／正確（本題答案）**：正己烷經 CYP450 代謝為 2-己醇再轉為 2,5-己二酮（2,5-hexanedione），此代謝物才是神經毒性的元兇；尿中排泄半衰期約 13–14 小時，與空氣中正己烷濃度相關性良好，是公認的生物偵測指標。","**不符合／錯誤**：血中正己烷本體半衰期極短、易揮發流失，採檢與保存困難，濃度只反映採血前數十分鐘的暴露，國內外都不用它當生物偵測項目。","**不符合／錯誤**：尿中三氯醋酸（trichloroacetic acid）是三氯乙烯與四氯乙烯的代謝指標，三氯乙烯另可測尿中三氯乙醇；不是正己烷的指標。"],"explanation":"本題考各有機溶劑的生物偵測指標對照。正己烷→CYP2E1→2-己醇→2,5-己二酮，ACGIH 生物暴露指標（BEI）為尿中游離型 2,5-己二酮 0.4 mg/L（3.5 μmol/L）、總量 5 mg/g creatinine，半衰期 13–14 小時故於班末採檢。要注意法規版本：考試當時適用的舊附表十，正己烷作業只有三項（作業經歷與自覺症狀調查、皮膚呼吸器官肝腎與神經系統既往病史調查、神經及皮膚身體檢查），並沒有生物偵測；115 年修正的新附表十才在特殊健康檢查加列「尿中游離型 2,5-己二酮（變更作業者無須檢測）」。整組對照要背：甲苯→尿中馬尿酸（或鄰位甲酚）；二甲苯→尿中甲基馬尿酸；三氯乙烯、四氯乙烯→尿中三氯醋酸；苯→尿中反反式黏康酸或 S-苯基硫醇尿酸；溴丙烷→尿中 AcPrCys 與溴離子；DMF→尿中 NMF。正己烷 PEL-TWA 50 ppm（皮）。","dispute":"","review":{"key_points":["正己烷生物偵測＝尿中==2,5-己二酮==，半衰期 ==13–14 小時==，BEI 游離型 0.4 mg/L、總量 5 mg/g Cr","舊附表十正己烷作業無任何生物偵測；==115 年新附表十==才加列尿中游離型 2,5-己二酮（變更作業者免）","對照：甲苯→馬尿酸；二甲苯→甲基馬尿酸；三氯乙烯／四氯乙烯→三氯醋酸；苯→t,t-黏康酸"],"refs":[{"src":"正己烷中毒","file":"_ref/認定指引/正己烷中毒.txt","quote":"尿中排泄2,5-己二酮的半衰期約為13-14小時"},{"src":"正己烷中毒","file":"_ref/認定指引/正己烷中毒.txt","quote":"尿中2,5-己二酮濃度與正己烷暴露濃度有良好的相關性"},{"src":"附表十_clean","file":"_ref/annex_new/附表十_clean.txt","quote":"尿中游離型(freeform)2,5-己二酮(2,5-hexanedione)檢查"}],"note_ref":"二、正己烷與溴丙烷：周邊神經病變"}},{"qid":"c11q02","q":"下列何種有機溶劑最容易引起多發性（遠端感覺運動）周邊神經病變？","options":["正己烷","甲苯","四氯乙烯","苯"],"answer":0,"recon":"full","src":["113-4","113-12","114-04"],"optexp":["**符合／正確（本題答案）**：正己烷的代謝物 2,5-己二酮與神經絲蛋白交聯，造成遠端長軸突的軸突病變，臨床即遠端感覺運動多發性神經病變，以下肢為主，是教科書與認定指引的標準答案。","**不符合／錯誤**：甲苯以中樞神經毒性為主（急性麻醉、慢性小腦萎縮與腦白質病變、認知障礙、感覺神經性聽力損失、視神經病變），周邊神經病變不是甲苯的特徵。","**不符合／錯誤**：四氯乙烯的主要危害是中樞神經抑制（混亂、記憶力差、顫抖）、肝損傷與皮膚炎，並有膀胱癌、非何杰金氏淋巴瘤疑慮；不以多發性神經病變表現。","**不符合／錯誤**：苯的標的是骨髓：全血球減少、再生不良性貧血與白血病；長時間低濃度暴露雖有頭痛暈眩等神經症狀，但不是周邊神經病變。"],"explanation":"本題考「哪個有機溶劑造成周邊神經病變」。正己烷與甲基丁酮（MBK）同屬 γ-diketone 機轉：代謝物 2,5-己二酮使神經絲去磷酸化、交聯堆積，造成遠端為主的軸突退化（dying-back）。臨床表現：由下肢遠端開始的觸覺振動異常、抽筋性疼痛、對稱性手足麻木刺痛，繼之肌肉無力萎縮、跟腱反射喪失、無法以腳跟行走、跨閾步態，嚴重時四肢癱瘓與呼吸肌麻痺；停止暴露後症狀仍可能先惡化數週（coasting）再緩慢恢復。認定指引：暴露濃度大於 50 ppm、最短接觸時間一個月、最長潛伏期六個月。台灣 1983–84 年台北彩色打樣公司群聚事件是經典案例（約 16% 員工發病）。同樣會造成周邊神經病變的職業溶劑還有溴丙烷、二硫化碳、丙烯醯胺；鑑別診斷必須排除糖尿病、酒精、尿毒症、維生素缺乏與鉛、砷等重金屬。","dispute":"","review":{"key_points":["正己烷（與 MBK）＝==遠端感覺運動多發性神經病變==，下肢為主，機轉為 2,5-己二酮造成軸突病變","體徵：跟腱反射喪失、無法以腳跟行走、==跨閾步態==；停止暴露後可能先惡化（coasting）再恢復","認定指引：暴露 >50 ppm，最短接觸 ==1 個月==、最長潛伏期 ==6 個月==","同樣致周邊神經病變者：溴丙烷、二硫化碳、丙烯醯胺；甲苯、苯不是"],"refs":[{"src":"正己烷中毒","file":"_ref/認定指引/正己烷中毒.txt","quote":"臨床表現為遠端感覺運動多發性神經病變，且以下肢為主"},{"src":"正己烷中毒","file":"_ref/認定指引/正己烷中毒.txt","quote":"出現跟腱反射喪失、無法以腳跟行走、有跨閾步態(steppagegait)等"},{"src":"正己烷中毒","file":"_ref/認定指引/正己烷中毒.txt","quote":"其最短接觸時間為一個月，最大潛伏期為六個月"}],"note_ref":"二、正己烷與溴丙烷：周邊神經病變"}},{"qid":"c11q03","q":"有關 1-溴丙烷之敘述，下列何者正確？","options":["為新興清洗溶劑，可造成中樞及周邊神經病變","主要暴露行業為人造纖維業","IARC 列為第一類致癌物","主要經皮膚吸收"],"answer":0,"recon":"partial","src":["113-10","113-11","114-04","113-4"],"optexp":["**符合／正確（本題答案）**：1-溴丙烷是取代三氯乙烯與氟氯碳化物的新興工業清洗劑；慢性暴露造成肢體麻木、刺痛、走路困難、聽力異常、耳鳴、嗜睡等中樞與末梢神經症狀，國內 102 年高爾夫球桿頭鍍膜廠六人群聚事件即為毒性神經病變。","**不符合／錯誤**：主要暴露行業是金屬鑄件與電子零件清洗（電鍍前處理去油脂）、噴膠與噴霧黏著劑、乾洗業、油漆製造；人造纖維業是二硫化碳（嫘縈）與二甲基乙醯胺的場域。","**不符合／錯誤**：1-溴丙烷不是第一類致癌物。我國認定指引寫「IARC 尚未列入正溴丙烷致癌性的資料」，美國 NTP 依動物實驗列為「合理預期為人類致癌物」，IARC 2017 年第 115 冊才列為 2B（可能致癌）。","**不符合／錯誤**：暴露途徑主要有二：吸入揮發氣體或霧滴，以及皮膚接觸；以吸入為主，皮膚為輔，故 PEL 註記「皮」字，但不能說「主要經皮膚吸收」。"],"explanation":"本題考溴丙烷這個新興危害物的四個要點：用途、途徑、毒性、法規。用途：1-溴丙烷（正溴丙烷）物性與清洗力近似三氯乙烯而對臭氧層破壞小，用於金屬與電子零件清洗、噴膠、乾洗、塗料，國內因非列管毒化物而用量漸增。途徑：吸入為主、皮膚接觸為輔。毒性：中樞與末梢神經（肢體麻木、走路困難、耳鳴、嗜睡、手部反應變慢）、皮膚紅疹、血球數減少與生殖毒性（對溴丙烷更明顯）。法規：PEL-TWA 0.5 ppm（皮），ACGIH TLV 0.1 ppm；溴丙烷重量比超過 5% 之混合物作業屬特別危害健康作業，法定項目包含胸部 X 光、ALT 與 γ-GT、血球檢查，分級輔助基準為八小時平均濃度 >0.05 ppm。","dispute":"113-10 回憶版把正解記為「對人體有肝毒性」，但分級指引與完整版都明白註記「溴丙烷雖在動物實驗發現有肝毒性，然人體目前仍未有明確肝毒性的證據」，故「對人體有肝毒性」依原文應屬錯誤敘述；法定項目雖有 ALT、γ-GT，那是為了鑑別與監測，不等於已證實人體肝毒性。致癌性方面，我國認定指引（較早版本）寫「IARC 尚未列入正溴丙烷致癌性的資料」，114-04 回憶版也把「溴丙烷為 IARC 致癌物」判為錯誤選項；但 IARC 已於 2017 年第 115 冊將 1-溴丙烷列為 Group 2B。應試原則：選項寫「第一類（Group 1）致癌物」一定錯；寫「2B／可能為人類致癌物」時，依國際現況為真、依我國指引原文則為「尚未列入」，若與其他明顯正確的選項並列，不要選它。","review":{"key_points":["1-溴丙烷＝取代三氯乙烯的新興清洗劑（金屬／電子零件清洗、噴膠、乾洗），途徑以==吸入==為主、皮膚為輔","PEL-TWA ==0.5 ppm（皮）==、ACGIH TLV 0.1 ppm；分級輔助基準 >0.05 ppm","毒性＝中樞及末梢神經病變＋皮膚紅疹；==動物有肝毒性，人體尚無明確證據==","致癌性：NTP 列合理預期為人類致癌物、IARC 2017 年列 ==2B==，我國指引原文寫「尚未列入」"],"refs":[{"src":"27_溴丙烷作業管理分級參考","file":"_ref/分級指引/27_溴丙烷作業管理分級參考.txt","quote":"溴丙烷雖在動物實驗發現有肝毒性，然人體目前仍未有明確肝毒性的證據"},{"src":"職業性溴丙烷中毒及其續發症認定參考指引","file":"_ref/認定指引/all/職業性溴丙烷中毒及其續發症認定參考指引.txt","quote":"正溴丙烷的暴露途徑主要有二：(1)吸入正溴丙烷揮發氣體或霧滴、(2)皮膚接觸"},{"src":"27_溴丙烷作業管理分級參考","file":"_ref/分級指引/27_溴丙烷作業管理分級參考.txt","quote":"八小時日時量平均容許濃度(PEL-TWA)為0.5ppm，2.6mg/m3(皮)"}],"note_ref":"二、正己烷與溴丙烷：周邊神經病變"}},{"qid":"c11q04","q":"有機溶劑最常見（也是最快、最嚴重）的暴露途徑為何？","options":["食入","吸入","皮膚吸收","眼睛黏膜"],"answer":1,"recon":"full","src":["113-2","113-5","113-11","114-03"],"optexp":["**不符合／錯誤**：食入在職場屬意外事件（誤飲、虹吸），量少且會經肝臟首渡代謝，不是有機溶劑的主要暴露途徑；但誤食氯化烴類仍可致死，不可輕忽。","**符合／正確（本題答案）**：有機溶劑揮發性高，作業環境中以蒸氣形式存在，經肺泡吸收後直接進入體循環、不經肝臟首渡代謝，因此吸入是最主要、最快也最嚴重的途徑，作業環境監測與 PEL 也是以空氣中濃度訂定。","**不符合／錯誤**：皮膚吸收是重要的次要途徑，容許暴露標準附表一標「皮」者（如甲苯、正己烷、二硫化碳、四氯化碳、溴丙烷、DMF）可經皮吸收而使總暴露量被低估，但速度與量不及吸入。","**不符合／錯誤**：眼睛黏膜以局部刺激（流淚、結膜炎、角膜損傷）為主，全身吸收量很小，不會是主要的系統性暴露途徑。"],"explanation":"本題考有機溶劑的暴露途徑排序：吸入＞皮膚＞食入。理由是有機溶劑沸點低、蒸氣壓高，肺泡表面積約 70 平方公尺且血流豐富，吸收後直接進入動脈血抵達腦部，故急性麻醉作用最快出現；相對地，皮膚吸收需通過角質層，速度較慢但持續，且不受呼吸防護具保護，噴灑、浸泡、徒手擦拭或手套選錯時特別重要。實務上兩件事要一起記：一是容許暴露標準附表一的符號，「皮」代表可經皮膚大量吸收、「瘤」代表致癌性、「高」代表最高容許濃度；二是生物偵測之所以重要，正是因為它同時涵蓋吸入與皮膚兩條途徑，空氣採樣則只能反映吸入。溴丙烷認定指引即明載暴露途徑有吸入與皮膚接觸兩者，評估時須合併考量。","dispute":"","review":{"key_points":["有機溶劑暴露途徑：==吸入＞皮膚＞食入==；吸入經肺泡直接入體循環，不經肝臟首渡代謝","容許暴露標準附表一符號：==皮==＝可經皮吸收、==瘤==＝致癌性、==高==＝最高容許濃度","生物偵測涵蓋吸入＋皮膚兩途徑，空氣採樣只反映吸入"],"refs":[{"src":"職業性溴丙烷中毒及其續發症認定參考指引","file":"_ref/認定指引/all/職業性溴丙烷中毒及其續發症認定參考指引.txt","quote":"正溴丙烷的暴露途徑主要有二：(1)吸入正溴丙烷揮發氣體或霧滴、(2)皮膚接觸"}],"note_ref":"一、有機溶劑通論：暴露途徑與作業型態"}},{"qid":"c11q05","q":"下列何種油漆施作方式，勞工暴露之有機溶劑最多？","options":["刷塗","滾塗","噴漆","浸塗"],"answer":2,"recon":"full","src":["113-4"],"optexp":["**不符合／錯誤**：刷塗以刷子沾取塗料，塗料表面積與擴散範圍有限，溶劑蒸氣主要在漆膜乾燥時逸散，勞工暴露量明顯低於噴塗。","**不符合／錯誤**：滾塗與刷塗類似，塗料被壓在滾筒與被塗面之間，不會霧化成懸浮粒，暴露以蒸氣為主且濃度較低。","**符合／正確（本題答案）**：噴漆把塗料霧化成細微漆霧，溶劑蒸氣與含漆霧的氣膠同時大量產生並隨氣流擴散，作業者位於噴槍下風處、又常在密閉或通風不良的噴漆室內作業，吸入暴露遠高於其他施作方式。","**不符合／錯誤**：浸塗把工件浸入塗料槽，逸散面只有液面，且可加蓋與局部排氣控制，勞工並未站在蒸氣雲中，暴露量低於噴漆。"],"explanation":"本題考作業型態與暴露量的關係，是配工與環境控制的基本判斷。塗裝作業的暴露量排序大致為噴塗＞滾塗≒刷塗＞浸塗；噴塗因為霧化產生氣膠，除了溶劑蒸氣還多了可吸入性漆霧（含顏料中的鉻、鉛等金屬與異氰酸酯硬化劑），所以噴漆工同時面臨有機溶劑、金屬與致敏物三重危害，PU 與汽車烤漆更要注意 HDI、IPDI 等異氰酸酯。控制對策的優先順序是取代（改水性漆、高固含量塗料）→ 工程控制（密閉、局部排氣、下抽式噴漆台）→ 行政管理 → 呼吸防護具（噴漆須用供氣式或全面罩有機氣體濾罐）。同一組概念常考的還有：脫脂、清洗、乾燥、封閉空間內作業與加溫製程都會提高蒸氣濃度。","dispute":"","review":{"key_points":["塗裝暴露量排序：==噴塗＞滾塗≒刷塗＞浸塗==；噴塗同時產生溶劑蒸氣與漆霧氣膠","噴漆工的三重危害：有機溶劑、顏料中的金屬、硬化劑中的異氰酸酯","控制優先順序：取代＞工程控制（局部排氣）＞行政管理＞防護具"],"refs":[],"note_ref":"一、有機溶劑通論：暴露途徑與作業型態"}},{"qid":"c11q06","q":"有關甲苯（吸食強力膠）之神經毒性，下列敘述何者錯誤？","options":["長期反覆暴露之神經傷害以持續性周邊神經病變為主","急性中毒表現包括頭痛、幻覺、運動失調與意識障礙","慢性中毒可出現認知功能減退、聽力損失與小腦功能受損","長期反覆暴露會引起甲苯性腦白質病變（toluene leukoencephalopathy）"],"answer":0,"recon":"full","src":["113-2","113-4","113-11","115-02"],"optexp":["**錯誤（本題答案）**：甲苯的長期神經傷害以中樞神經為主，不是持續性周邊神經病變；會造成周邊神經病變的是正己烷與甲基丁酮。若吸膠者同時出現周邊神經病變，通常是強力膠中混有正己烷所致。","**正確**：急性大量吸入（吸膠）先有欣快與麻醉作用，接著頭痛、頭暈、幻覺、運動失調、噁心，嚴重時意識障礙、抽搐、心律不整甚至猝死（心肌對兒茶酚胺敏感化）。","**正確**：長期暴露可見認知功能減退、記憶力與注意力下降、小腦性運動失調與步態不穩、感覺神經性聽力損失、視神經病變與辨色力異常。","**正確**：長期反覆接觸甲苯會引起甲苯性腦白質病變，磁振造影可見瀰漫性皮質、小腦與大腦萎縮及白質訊號變化，是慢性甲苯濫用的標誌性影像。"],"explanation":"本題考甲苯毒性「中樞為主、周邊為輔」的分界。甲苯經 CYP 氧化為苯甲醇→苯甲酸，再與甘胺酸接合成馬尿酸由尿排出（約 68%），馬尿酸半衰期約三小時，故班末採檢；但蔬果中的苯甲酸會干擾，低暴露者可改測尿中鄰位甲酚。臨床要背三層：急性＝麻醉與心律不整；慢性＝腦白質病變、小腦萎縮、認知障礙、感覺神經性聽力損失（與噪音有加成作用）、視神經病變與色覺異常；其他＝遠端腎小管酸中毒、肝功能異常、生殖毒性。甲苯不會造成白血病（那是苯），也不以周邊神經病變表現（那是正己烷）——這兩個對比幾乎每年都考。慢性吸膠者週末或假日症狀減輕、上班後再現，是判斷工作相關性的線索；回憶版「假日未接觸可能會興奮」指的是戒斷與再暴露現象。PEL-TWA 50 ppm（皮）。","dispute":"","review":{"key_points":["甲苯＝==中樞神經==毒性（麻醉、小腦萎縮、腦白質病變、認知障礙、感覺神經性聽力損失、視神經病變）","周邊神經病變是==正己烷==不是甲苯；白血病是==苯==不是甲苯","生物偵測＝尿中馬尿酸（半衰期約 ==3 小時==，蔬果苯甲酸會干擾）或尿中鄰位甲酚；PEL 50 ppm（皮）","甲苯與噪音併存會加重聽力損失，可加做純音聽力與腦幹聽覺誘發電位"],"refs":[{"src":"甲苯中毒","file":"_ref/認定指引/甲苯中毒.txt","quote":"長期反覆性接觸甲苯，會引起腦白質病變(toluene-inducedleukoencephalopathy)"},{"src":"甲苯中毒","file":"_ref/認定指引/甲苯中毒.txt","quote":"馬尿酸在體內的半衰期約為三小時"},{"src":"甲苯中毒","file":"_ref/認定指引/甲苯中毒.txt","quote":"感覺神經性聽力損失、失智、皮層脊髓束功能障礙"}],"note_ref":"三、甲苯：中樞神經毒性"}},{"qid":"c11q07","q":"皮革／人造皮（PU 合成皮）製程中，下列何種物質最容易引起呼吸道刺激與職業性氣喘？","options":["1-溴丙烷","二異氰酸甲苯（TDI）","重鉻酸鹽","三氯乙烯"],"answer":1,"recon":"full","src":["113-2","113-6","113-11","114-04","114-05"],"optexp":["**不符合／錯誤**：1-溴丙烷雖用於清洗與噴膠，主要危害是中樞與末梢神經病變與皮膚紅疹，急性吸入會刺激鼻腔口咽，但不是職業性氣喘的典型致敏物。","**符合／正確（本題答案）**：二異氰酸甲苯（TDI）是 PU 合成皮、泡綿與塗料製程的主要異氰酸酯，屬低分子量致敏物，會引起氣喘、氣管過敏狀態與過敏性肺炎；韓國資料顯示異氰酸酯類佔所有職業性氣喘的 46.6%，居第一位。","**不符合／錯誤**：重鉻酸鹽的職業危害以皮膚（鉻潰瘍、過敏性接觸皮膚炎）與鼻中膈潰瘍穿孔、肺癌為主；雖也可能誘發氣喘，但不是皮革／PU 製程呼吸道致敏的代表物。","**不符合／錯誤**：三氯乙烯是脫脂清洗溶劑，危害為中樞神經抑制、肝損傷、皮膚炎與過敏性皮膚藥物疹樣反應（hypersensitivity syndrome），不以氣喘表現。"],"explanation":"本題考異氰酸酯類＝職業性氣喘首位致敏物。三個要記的數字與項目：（1）容許濃度 TDI 最高容許濃度 0.005 ppm、MDI 0.02 ppm、IPDI PEL-TWA 0.005 ppm，都是丙類第一種特定化學物質；（2）法定檢查項目重點是氣喘、慢性氣管炎及過敏既往病史調查、呼吸系統及皮膚身體檢查，加上肺功能檢查（FVC、FEV1、FEV1/FVC），體格檢查另做胸部 X 光，健康檢查則是變更作業者才增列胸部 X 光；（3）分級輔助基準 TDI 與 IPDI ≥0.0025 ppm、MDI ≥0.01 ppm。臨床特徵：反應可為立即型、遲發型或雙重型，常下班前後發作、整夜持續、次晨改善，離開工作場所後仍可能持續數年；診斷靠工作與非工作日的尖峰呼氣流速比較、特異性 IgE 與特異性支氣管激發試驗。同一製程還要分辨：PU 合成皮的肝毒物是 DMF，呼吸道致敏物才是 TDI。","dispute":"","review":{"key_points":["異氰酸酯（TDI／MDI／IPDI）＝低分子量致敏物，佔職業性氣喘 ==46.6%== 居首，也可致過敏性肺炎","容許濃度：TDI ==最高容許濃度 0.005 ppm==、MDI 0.02 ppm、IPDI PEL-TWA 0.005 ppm","法定項目：氣喘與過敏病史、呼吸系統及皮膚檢查、==肺功能（FVC、FEV1、FEV1/FVC）==；健康檢查的胸部 X 光只有變更作業者要做","PU 合成皮：呼吸道致敏＝TDI，肝毒性＝DMF"],"refs":[{"src":"16_苯作業管理分級參考","file":"_ref/分級指引/16_苯作業管理分級參考.txt","quote":"吸入：會引起呼吸道之過敏，產生氣喘或過敏性肺炎"},{"src":"異氰酸酯類引起職業性氣喘認定參考指引-2015修","file":"_ref/認定指引/all/異氰酸酯類引起職業性氣喘認定參考指引-2015修.txt","quote":"Isocyanates所引發的氣喘占所有職業性氣喘的46.6%，為第一位"},{"src":"16_苯作業管理分級參考","file":"_ref/分級指引/16_苯作業管理分級參考.txt","quote":"TDI)最高容許濃度(PEL-ceiling;PEL-C)：0.005ppm"}],"note_ref":"六、合成皮與 PU 製程：DMF、DMAC 與異氰酸酯"}},{"qid":"c11q08","q":"人造皮革（PU）工廠勞工發生肝功能異常，最可能的致病物質為何？","options":["二甲基甲醯胺（DMF）","二甲基乙醯胺（DMAC）","正己烷","二異氰酸甲苯（TDI）"],"answer":0,"recon":"full","src":["113-2","113-4","113-6","113-8","113-11","115-02"],"optexp":["**符合／正確（本題答案）**：二甲基甲醯胺（DMF）是 PU 樹脂與合成皮製程的主要溶劑，經吸入與皮膚吸收，造成中毒性肝炎；國內王榮德等研究發現合成皮廠高暴露勞工 ALT 異常顯著較高，切片可見中央區帶狀壞死。","**不符合／錯誤**：二甲基乙醯胺（DMAC）同樣有肝毒性，但用途是聚丙烯腈與芳香族聚醯胺纖維、聚醯亞胺薄膜、電線絕緣塗料與脫漆劑，不是合成皮製程的溶劑。","**不符合／錯誤**：正己烷雖也用於皮革與黏著劑，危害是遠端感覺運動多發性神經病變；法定項目只有神經與皮膚檢查，不含肝功能，不會造成群聚性肝功能異常。","**不符合／錯誤**：TDI 在同一製程確實存在，但它的標的是呼吸道與皮膚（氣喘、過敏性肺炎、皮膚敏感），法定項目是肺功能，不是肝毒物。"],"explanation":"本題考「合成皮工廠＋肝功能異常＝DMF」這個台灣本土經典配對。DMF 為無色液體、有淡魚腥味，與水及多種有機溶劑互溶，用於 PU 樹脂、壓克力樹脂纖維、PVC 樹脂與合成皮製造，也用於殺蟲劑、底片添加物與表面處理，潛在暴露行業即合成皮、壓克力纖維、人造絲、藥品、殺蟲劑、除漆劑與染料。臨床特徵：腹痛、食慾不振、噁心嘔吐，特別是飲酒後臉部潮紅（類 disulfiram 反應），肝功能以 ALT 與 γ-GT 上升為主，病理為小泡性與大泡性脂肪化、點狀壞死、中央區帶狀壞死，移除暴露後 1–5 個月多可恢復、不留纖維化。法規：PEL-TWA 10 ppm，IARC 2018 年列 Group 2A；法定檢查項目為酗酒及肝臟疾病既往病史調查、肝腎心血管及皮膚身體檢查、ALT 與 γ-GT，分級輔助基準 PEL-TWA ≥5 ppm。B 型肝炎帶原與肥胖會與 DMF 產生交互作用，複檢時必須一併評估。","dispute":"","review":{"key_points":["DMF＝==合成皮／PU 樹脂==溶劑，經吸入與皮膚吸收→中毒性肝炎；飲酒後==臉部潮紅==是特徵","法定項目＝酗酒及肝病既往病史、肝腎心血管皮膚身體檢查、==ALT 與 γ-GT==；分級輔助基準 ≥5 ppm","PEL-TWA ==10 ppm==；IARC ==2A==；病理為脂肪化與中央區帶狀壞死，移除暴露多可恢復","DMAC 用於壓克力／芳香族聚醯胺纖維與塗料，不是合成皮製程"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"潛在暴露行業為從事合成皮、壓克力纖維、人造絲纖維、藥品、殺蟲劑、除漆劑、染料等製造之勞工"},{"src":"11_二甲基甲醯胺作業管理分級參考","file":"_ref/分級指引/11_二甲基甲醯胺作業管理分級參考.txt","quote":"臉部發紅(尤其在飲酒後)、肝傷害、興奮、血壓增加"},{"src":"11_二甲基甲醯胺作業管理分級參考","file":"_ref/分級指引/11_二甲基甲醯胺作業管理分級參考.txt","quote":"IARC2018年將之分類為對人類很可能有致癌性(Group2A)"}],"note_ref":"六、合成皮與 PU 製程：DMF、DMAC 與異氰酸酯"}},{"qid":"c11q09","q":"下列何種特別危害健康作業之特殊健康檢查須包含心電圖檢查？","options":["二硫化碳作業","正己烷作業","四氯化碳作業","苯作業"],"answer":0,"recon":"full","src":["113-2","113-7","113-8","113-10","113-11","114-01","114-04","115-02"],"optexp":["**符合／正確（本題答案）**：二硫化碳會加速動脈硬化，增加冠狀動脈疾病、腦血管與腎動脈病變，所以附表十二硫化碳作業的體格檢查與健康檢查都列有心電圖檢查，是 32 項特別危害健康作業中少數要做心電圖者。","**不符合／錯誤**：正己烷作業的法定項目只有作業經歷與自覺症狀調查、皮膚呼吸器官肝腎與神經系統既往病史調查、神經及皮膚身體檢查（新法加尿中 2,5-己二酮），沒有心電圖。","**不符合／錯誤**：四氯化碳作業的法定項目是腎臟及肝臟既往病史調查、腎肝及皮膚身體檢查、尿蛋白及尿潛血、ALT 與 γ-GT，標的是肝腎而非心臟，沒有心電圖。","**不符合／錯誤**：苯作業的法定項目是血液、腎臟、肝臟疾病及長期服藥既往病史調查、血液系統與皮膚黏膜及結膜身體檢查，加上血液學檢查，標的是骨髓，沒有心電圖。"],"explanation":"本題考附表十中「哪些作業要做心電圖」。答案只有三處：高溫作業（體格與健康檢查都做）、異常氣壓作業（年齡四十歲以上或懷疑有心臟疾病者做）、二硫化碳作業（都做）。二硫化碳之所以入列，是因為它是典型的促動脈硬化物質：慢性暴露使頭部與腎臟動脈硬化並提高冠狀動脈疾病風險，流行病學上嫘縈（人造絲）工人心血管死亡率增加。二硫化碳其餘危害要一起記：中樞神經（情緒不穩、興奮、憂鬱、偏執、自殺，長期可成類巴金森氏症）、周邊神經病變、眼底微動脈瘤與視神經病變、聽神經病變、腎臟動脈病變與蛋白尿、內分泌與生殖功能障礙。法定項目還包含尿蛋白與尿潛血、ALT 與 γ-GT；PEL-TWA 10 ppm（皮），分級輔助基準 ≥5 ppm。","dispute":"","review":{"key_points":["附表十要做心電圖的作業只有三個：==高溫==、==異常氣壓（40 歲以上或疑有心臟病）==、==二硫化碳==","二硫化碳法定項目：神經心血管腎肝皮膚及眼睛病史與身體檢查、尿蛋白尿潛血、ALT／γ-GT、==心電圖==","二硫化碳＝加速動脈硬化（冠心病、腦血管、腎動脈）＋類巴金森＋周邊神經病變＋眼底微動脈瘤","PEL-TWA ==10 ppm（皮）==，分級輔助基準 ≥5 ppm"],"refs":[{"src":"09_二硫化碳作業管理分級參考","file":"_ref/分級指引/09_二硫化碳作業管理分級參考.txt","quote":"心血管影響：類似因年老而動脈硬化，發生於頭及腎的動脈，並增高心臟冠狀動脈疾病"},{"src":"09_二硫化碳作業管理分級參考","file":"_ref/分級指引/09_二硫化碳作業管理分級參考.txt","quote":"6.心電圖檢查。"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"(５)年齡在四十歲以上或懷疑有心臟"}],"note_ref":"四、二硫化碳：心血管與神經"}},{"qid":"c11q10","q":"有關二硫化碳中毒之敘述，下列何者錯誤？","options":["視網膜出血、眼底微動脈瘤","脊髓病變（myelopathy）為典型表現","周邊神經病變","心血管疾病（冠狀動脈疾病）"],"answer":1,"recon":"full","src":["115-02"],"optexp":["**正確**：二硫化碳會造成眼睛結構與功能改變及眼睛血管損壞，分級判定條件明列眼底微動脈瘤與視神經病變，視網膜微動脈瘤是二硫化碳暴露的特徵性眼底所見。","**錯誤（本題答案）**：脊髓病變不是二硫化碳的典型表現。二硫化碳的神經毒性是腦病變（人格與精神改變、類巴金森氏症）與周邊神經病變；亞急性合併脊髓病變（subacute combined degeneration）要想到笑氣與維生素 B12 缺乏。","**正確**：二硫化碳可造成末梢神經病變，表現為麻痺、肌肉虛弱、肌肉痛與肢端感覺喪失，分級第三、四級判定條件也列有周邊神經性病變。","**正確**：二硫化碳加速動脈硬化，提高冠狀動脈疾病、腦血管疾病與腎動脈病變風險，因此法定項目要做心電圖，是它最具代表性的全身性危害。"],"explanation":"本題考二硫化碳毒性的「有」與「沒有」。有的四大類：中樞神經（最初不穩定、興奮、喪失個性，進展為憂鬱、焦慮、偏執，甚至自殺；持續暴露可出現類巴金森氏症）、周邊神經（麻痺、耳鳴、肌肉無力與痛、末端感覺喪失）、心血管與腎血管（動脈硬化、冠狀動脈疾病、腎動脈病變、蛋白尿達二價 ≥100 mg/dL）、眼睛（眼底微動脈瘤、視神經病變）；另有腸胃與肝膽功能障礙、內分泌與生殖功能障礙。沒有的是脊髓病變——這是鑑別點：笑氣（nitrous oxide）抑制維生素 B12 依賴的甲硫胺酸合成酶而造成脊髓亞急性合併退化，臨床上會看到後索與皮質脊髓束症狀。暴露行業是嫘縈（人造絲）製造、玻璃紙、橡膠硫化與殺蟲劑製造。急性高濃度（500–1000 ppm）即可造成嚴重情緒與人格失常，4800 ppm 30 分鐘可致命。","dispute":"","review":{"key_points":["二硫化碳有：類巴金森、精神人格異常、周邊神經病變、==動脈硬化與冠心病==、==眼底微動脈瘤==、腎動脈病變","二硫化碳沒有：==脊髓病變==（脊髓亞急性合併退化要想到笑氣與維生素 B12）","行業＝嫘縈人造絲、玻璃紙、橡膠硫化、殺蟲劑；急性 500–1000 ppm 即情緒人格失常"],"refs":[{"src":"09_二硫化碳作業管理分級參考","file":"_ref/分級指引/09_二硫化碳作業管理分級參考.txt","quote":"繼續暴露可能成類似巴金森氏疾病"},{"src":"09_二硫化碳作業管理分級參考","file":"_ref/分級指引/09_二硫化碳作業管理分級參考.txt","quote":"末梢神經系統：可能會麻痺或耳鳴、肌肉虛弱、肌肉痛、末端喪失感覺"},{"src":"09_二硫化碳作業管理分級參考","file":"_ref/分級指引/09_二硫化碳作業管理分級參考.txt","quote":"眼底微動脈瘤與視神經病變、聽神經病變"}],"note_ref":"四、二硫化碳：心血管與神經"}},{"qid":"c11q11","q":"有關氯乙烯單體（VCM）之毒性，下列敘述何者錯誤？","options":["可造成肝血管肉瘤（angiosarcoma）與肝細胞癌","急性大量暴露有中樞神經麻醉作用","可造成肢端骨溶解症、雷諾氏現象與硬皮症樣皮膚病變","只會造成急性肝傷害，不會造成慢性肝傷害或癌症"],"answer":3,"recon":"full","src":["113-2","113-11","114-02","114-04","115-02"],"optexp":["**正確**：氯乙烯是 IARC 第一類人體致癌物，確立造成肝血管肉瘤；2008 年 IARC 更新評估後也認定會增加肝細胞癌風險，兩者的最短暴露期間與最短誘導期均為十年。","**正確**：短時間大量暴露主要是中樞神經抑制：頭痛、頭暈、嗜睡、欣快感、動作失調、四肢麻木刺痛，嚴重者意識障礙、呼吸抑制甚至死亡，極高濃度（>70000 ppm）可致意識喪失。","**正確**：氯乙烯疾病（vinyl chloride disease）包括遠端肢體皮膚硬皮樣變化、雷諾氏現象與肢端骨溶解症，多見於過去高濃度暴露的聚氯乙烯清槽勞工，最短暴露期間一年。","**錯誤（本題答案）**：氯乙烯的主要危害正是慢性：肝竇周圍纖維化、門脈高壓、肝硬化與肝血管肉瘤、肝細胞癌；說它「只造成急性肝傷害」完全相反。急性大量暴露反而以中樞神經抑制為主。"],"explanation":"本題考氯乙烯的全貌。急性：中樞神經抑制與凍傷（液體迅速揮發）。慢性分三組：（1）肝臟——無症狀肝功能異常、脂肪肝、肝竇周圍與門脈周圍纖維化、門脈高壓、食道靜脈曲張、脾腫大與血小板低下，部分人以 Banti 氏症候群（不明原因門脈高壓）表現；（2）氯乙烯疾病——肢端骨溶解症、雷諾氏現象、遠端皮膚硬皮樣變化，PEL 降至 1 ppm 後幾近絕跡；（3）癌症——肝血管肉瘤與肝細胞癌。認定指引的時間門檻要背：肝血管肉瘤／肝細胞癌最短暴露期間十年、最短誘導期十年；肝纖維化合併門脈高壓需暴露濃度至少 50 ppm、最短暴露二年、最短誘導期五年、最長潛伏期三十年；雷諾氏症、肢端溶解症、硬皮症最短暴露一年。法定項目為肝炎輸血服藥與接觸肝毒性化學物既往病史調查、肝脾腎手部皮膚及呼吸系統身體檢查、胸部 X 光、ALT 與 γ-GT；PEL-TWA 1 ppm（瘤），分級輔助基準 ≥0.5 ppm。","dispute":"","review":{"key_points":["氯乙烯慢性三組：==肝纖維化／門脈高壓==、==氯乙烯疾病（肢端骨溶解、雷諾、硬皮樣）==、==肝血管肉瘤與肝細胞癌==","認定門檻：血管肉瘤／肝癌最短暴露與誘導期各 ==10 年==；肝纖維化合併門脈高壓 ≥50 ppm、暴露 2 年、誘導 5 年、潛伏 30 年","法定項目：肝炎與肝毒物接觸病史、肝脾腎與手部皮膚檢查、胸部 X 光、==ALT 與 γ-GT==","PEL-TWA ==1 ppm（瘤）==，分級輔助基準 ≥0.5 ppm；IARC Group 1"],"refs":[{"src":"15_氯乙烯作業管理分級參考","file":"_ref/分級指引/15_氯乙烯作業管理分級參考.txt","quote":"引起肝臟血管肉瘤－一種人體罕見的肝癌"},{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"肝血管肉瘤或肝細胞癌之最短暴露期間為10年、最短誘導期為10年"},{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"遠端肢體皮膚硬皮樣變化、雷諾氏症、肢端骨溶解等符合氯乙烯疾病的表現"}],"note_ref":"五、氯乙烯：肝毒性與致癌性"}},{"qid":"c11q12","q":"氯乙烯不會造成下列何種癌症？","options":["肝血管肉瘤","肝細胞癌","血液或淋巴系統癌症","腎臟癌"],"answer":3,"recon":"full","src":["113-2","113-10","113-11","114-01","114-03","114-04"],"optexp":["**不符合／錯誤（氯乙烯會造成）**：肝血管肉瘤是氯乙烯最具特異性的職業癌，1974 年美國 PVC 聚合部門勞工的叢集事件即因此被發現，IARC 據以認定氯乙烯為第一類致癌物。","**不符合／錯誤（氯乙烯會造成）**：IARC 2008 年更新評估後已指出氯乙烯會增加肝細胞癌風險；歐洲多中心世代研究顯示原發性肝癌與累積暴露有劑量反應關係。","**不符合／錯誤（氯乙烯可能有關）**：分級指引明載氯乙烯「也與腦、肺、血液和淋巴系統的癌症有關連」，故血液或淋巴系統癌症不是本題要選的「不會造成」。","**符合／正確（本題答案）**：腎臟癌與氯乙烯無關。認定指引在腎臟影響一節直接寫「無已知人類相關之研究資料」，氯乙烯雖會蓄積於肝腎，卻沒有腎毒性或腎癌的人體證據；會造成腎臟癌的職業物質是三氯乙烯。"],"explanation":"本題考氯乙烯的致癌譜與其邊界。確立者：肝血管肉瘤（最具特異性）與肝細胞癌，IARC Group 1。分級指引另提到氯乙烯與腦、肺、血液和淋巴系統癌症有關連，但認定指引整理後續研究後指出：除肝血管肉瘤與肝細胞癌外，其他癌症因研究結果欠缺一致性、樣本太少或無明顯劑量反應關係，IARC 並不支持其相關性——所以考題若把「腦、肺、淋巴」列為選項，要依出題脈絡判斷，本題以「腎臟癌」為最明確的不會。腎臟的部分，認定指引寫得很乾脆：無已知人類相關之研究資料。對照記憶：職業性腎臟癌想到三氯乙烯（IARC Group 1）與鎘；職業性膀胱癌想到聯苯胺、4-胺基聯苯、β-萘胺、MOCA；職業性肝血管肉瘤想到氯乙烯、無機砷、二氧化釷。","dispute":"","review":{"key_points":["氯乙烯確立的癌症＝==肝血管肉瘤＋肝細胞癌==；指引另提及腦、肺、血液與淋巴系統癌症有關連","==腎臟：無已知人類相關之研究資料==；職業性腎臟癌要想到三氯乙烯與鎘","肝血管肉瘤三大職業／環境病因：==氯乙烯、無機砷、二氧化釷（thorotrast）=="],"refs":[{"src":"15_氯乙烯作業管理分級參考","file":"_ref/分級指引/15_氯乙烯作業管理分級參考.txt","quote":"氯乙烯也與腦、肺、血液和淋巴系統的癌症有關連"},{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"(6)腎臟的影響：無已知人類相關之研究資料"},{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"IARC並不支持氯乙烯與其他癌症之相關性"}],"note_ref":"五、氯乙烯：肝毒性與致癌性"}},{"qid":"c11q13","q":"有關氯乙烯職業病認定，下列敘述何者錯誤？","options":["短時間大量暴露會有中樞神經毒性","肝硬化／肝纖維化合併門脈高壓之最短暴露時間為 2 年","初次暴露至產生肝血管肉瘤與肝癌之時間至少為 5 年","氯乙烯疾病包含遠端肢體硬皮症樣病變、雷諾氏症與肢端骨溶解"],"answer":2,"recon":"full","src":["115-02"],"optexp":["**正確**：認定指引載明短時間大量暴露主要造成中樞神經系統毒性，接觸後快速出現頭痛、頭暈、嗜睡、動作失調、欣快感、四肢麻木刺痛，嚴重者意識障礙、呼吸抑制甚至死亡。","**正確**：肝臟纖維化合併門脈高壓（與肝硬化）的最短暴露時間為二年，且暴露濃度須至少 50 ppm、最短誘導期五年、最長潛伏期三十年，敘述與指引一致。","**錯誤（本題答案）**：肝血管肉瘤與肝細胞癌的最短暴露期間與最短誘導期都是十年，不是五年；五年是「首次暴露至肝臟纖維化併門脈高壓、肝硬化發病」的最短間隔，兩者不可混用。","**正確**：氯乙烯疾病（vinyl chloride disease）包含遠端肢體皮膚硬皮樣變化、雷諾氏症與肢端骨溶解症，最短暴露時間為一年，多見於過去高濃度暴露的清槽勞工。"],"explanation":"本題考職業性氯乙烯中毒認定參考指引的時間門檻，是硬記題。把三組數字排成表最不會混：肝血管肉瘤或肝細胞癌——最短暴露十年、最短誘導期十年（即發病須在首次暴露十年以後）；肝臟纖維化合併門脈高壓或肝硬化——暴露濃度至少 50 ppm（全程工作日時量平均）、最短暴露二年、最短誘導期五年、最長潛伏期三十年；雷諾氏症候群、肢端溶解症、硬皮症——最短暴露一年（歐盟指引另訂最長潛伏期三年）。實際流行病學數字則長得多：肝血管肉瘤潛伏期中位數約 36 年、肝細胞癌約 48 年，累積暴露大於 865 ppm-years 與發病密切相關。認定時病毒性肝炎與酒精不是排除條件，因為兩者與氯乙烯至少有累加性交互作用，有足夠暴露證據就不因 B、C 肝或脂肪肝而排除職業性。","dispute":"","review":{"key_points":["肝血管肉瘤／肝細胞癌：最短暴露 ==10 年==、最短誘導期 ==10 年==","肝纖維化合併門脈高壓／肝硬化：濃度 ==≥50 ppm==、最短暴露 ==2 年==、最短誘導期 ==5 年==、最長潛伏期 30 年","雷諾氏症、肢端溶解症、硬皮症：最短暴露 ==1 年==","B、C 型肝炎與酒精不構成排除理由，與氯乙烯至少有累加性交互作用"],"refs":[{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"肝血管肉瘤或肝細胞癌之最短暴露期間為10年、最短誘導期為10年"},{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"最短暴露期間2年、最長潛伏期30年、最短誘導期"},{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"「雷諾氏症候群、肢端溶解症、硬皮症」為1年"}],"note_ref":"五、氯乙烯：肝毒性與致癌性"}},{"qid":"c11q14","q":"下列何種物質最容易引起變性血紅素血症（methemoglobinemia）？","options":["二甲苯","苯","苯胺（aniline）","甲苯"],"answer":2,"recon":"full","src":["113-2","113-4","113-8","113-11","114-01","114-04","114-05"],"optexp":["**不符合／錯誤**：二甲苯是第二種有機溶劑，危害為中樞神經抑制、皮膚脫脂性皮膚炎與肝腎影響，生物偵測為尿中甲基馬尿酸；不造成變性血紅素血症。","**不符合／錯誤**：苯的標的是骨髓（全血球減少、再生不良性貧血、急性骨髓性白血病），PEL 1 ppm；它不會把血紅素鐵氧化成三價鐵。","**符合／正確（本題答案）**：苯胺（aniline）屬芳香族胺類，代謝產生的苯基羥胺會把血紅素中的二價鐵氧化為三價鐵，形成無法攜氧的變性血紅素，臨床出現發紺、頭痛、暈眩、心跳加速與巧克力色血液；PEL-TWA 2 ppm（皮），可大量經皮吸收。","**不符合／錯誤**：甲苯造成中樞神經毒性（麻醉、腦白質病變、小腦萎縮），生物偵測為尿中馬尿酸；與變性血紅素血症無關。"],"explanation":"本題考「哪一類化學物質造成變性血紅素血症」。致病族群是芳香族與脂肪族的硝基與胺基化合物：苯胺、硝基苯、二硝基苯、三硝基甲苯（TNT）、對苯二胺、萘胺與聯苯胺類，以及硝基烷烴、亞硝酸鹽與某些藥物（dapsone、benzocaine、局部麻醉劑）。機轉是代謝物將血紅素的 Fe2+ 氧化為 Fe3+，變性血紅素無法攜氧且使氧解離曲線左移，臨床出現與缺氧程度不成比例的發紺、血液呈巧克力色、脈搏血氧飽和度卡在 85% 左右且給氧無法改善；診斷靠動脈血氣分析加測 MetHb%，治療用亞甲藍（methylene blue），蠶豆症患者禁用、改用高劑量維生素 C 或換血。這類物質多可經皮吸收（PEL 標「皮」），且部分兼具膀胱癌風險（聯苯胺、4-胺基聯苯、β-萘胺為第一類致癌物）。","dispute":"115-02 版本的選項是苯／聯苯／甲苯／二甲苯，回憶答案為「聯苯」，依據是分級指引精簡版第 27 頁的聯苯胺及其鹽類作業，其中 4-胺基聯苯與 α-萘胺明載「可影響血液攜氧能力（變性血紅素血症）」、「因血紅素變性而使皮膚及粘膜變藍」。要注意兩件事：（1）嚴格說 biphenyl（聯苯）與 benzidine（聯苯胺）／4-aminobiphenyl（4-胺基聯苯）是不同物質，真正造成變性血紅素血症的是後者的胺基衍生物，回憶版的「聯苯」應理解為聯苯胺類的簡記；（2）不論哪個版本，作答邏輯一致——四個選項中挑出「芳香族胺基或硝基化合物」那一個，苯、甲苯、二甲苯這三個單純芳香烴都不會。","review":{"key_points":["變性血紅素血症＝==芳香族硝基／胺基化合物==（苯胺、硝基苯、TNT、對苯二胺、聯苯胺類）與硝基烷烴、亞硝酸鹽","機轉：Fe2+→Fe3+ 無法攜氧；表現為==發紺、巧克力色血液、給氧不改善==；診斷加測 MetHb%","治療用==亞甲藍==（蠶豆症禁用，改高劑量維生素 C 或換血）","苯胺 PEL-TWA ==2 ppm（皮）==；苯、甲苯、二甲苯都不造成變性血紅素血症"],"refs":[{"src":"13_聯苯胺及其鹽類作業管理分級參考","file":"_ref/分級指引/13_聯苯胺及其鹽類作業管理分級參考.txt","quote":"可影響血液攜氧能力(變性血紅素血症)，導致頭痛、暈眩、疲倦"},{"src":"13_聯苯胺及其鹽類作業管理分級參考","file":"_ref/分級指引/13_聯苯胺及其鹽類作業管理分級參考.txt","quote":"因血紅素變性而使皮膚及粘膜變藍"},{"src":"職業性烷屬烴化合物-硝基及胺基衍生物中毒及其續發症認定參考指引","file":"_ref/認定指引/all/職業性烷屬烴化合物-硝基及胺基衍生物中毒及其續發症認定參考指引.txt","quote":"在暴露硝基烷烴後，產生發紺的現象，應考慮是否有變性血紅素症的可能"}],"note_ref":"八、芳香族胺與硝基化合物：變性血紅素血症與膀胱癌"}},{"qid":"c11q15","q":"有關氫氟酸（HF）灼傷之敘述，下列何者正確？","options":["濃度越高 pH 越高","被氫氟酸腐蝕不會疼痛","濃度大於 30% 才需擔心低血鈣","脂溶性高，會快速穿透並損傷深層組織"],"answer":3,"recon":"full","src":["113-1","113-3","113-11","114-04"],"optexp":["**不符合／錯誤**：酸的濃度越高 pH 越低。氫氟酸雖因解離度只有鹽酸的千分之一而被歸為弱酸，但濃度增加時解離度上升、酸性也跟著上升，純無水氫氟酸的酸性與純硫酸相當，屬中強酸。","**不符合／錯誤**：氫氟酸灼傷的疼痛非常劇烈難忍（猶如燙傷或鐵鎚擊打），只是低濃度時會延遲發作——濃度 50% 以上立即疼痛發紅，20–50% 可能 1–8 小時後才出現，20% 以下可能晚至 24 小時。","**不符合／錯誤**：門檻不是 30%。指引所列可能造成低血鈣的情形是：接觸濃度 50% 以上且體表面積達 1% 以上，或任何濃度但接觸體表面積 5% 以上，或吸入、食入氫氟酸。","**符合／正確（本題答案）**：未解離的 HF 分子脂溶性高、以非離子狀態迅速穿透表皮進入深部軟組織，解離後的氟離子與鈣、鎂結合成不溶複合物沉澱，造成深層組織壞死、劇痛與全身電解質異常，這就是氫氟酸的「雙重危險」。"],"explanation":"本題考氫氟酸灼傷的四個考點。機轉：氫離子的腐蝕性加上氟離子滲透深層組織，氟離子與鈣、鎂形成不溶複合物造成組織壞死，並抑制含金屬酵素；鈣耗竭後局部神經細胞釋出鉀離子，是劇痛的來源；氟離子接觸骨頭造成去鈣化壞死，故有「化骨水」之稱。全身毒性：低血鈣、低血鎂與高血鉀，造成 QT 延長、torsades de pointes 與心搏停止，是致死主因，而且可能在皮膚外觀還不嚴重時就發生。危險門檻：濃度 ≥50% 且體表面積 ≥1%，或任何濃度而體表面積 ≥5%，或吸入、食入。處置：大量清水沖洗、局部葡萄糖酸鈣凝膠塗抹，指端可用含鈣溶液浸泡或皮下注射、嚴重者動脈內注射，同時監測心電圖與血鈣血鎂血鉀並積極補鈣，不可只當一般化學灼傷觀察。氟化氫 PEL 為 3 ppm。","dispute":"","review":{"key_points":["HF 是弱酸但==未解離分子脂溶性高、穿透深層組織==；高濃度時酸性可與純硫酸相當","疼痛劇烈但可延遲：==≥50% 立即==、20–50% 需 1–8 小時、\u003c20% 可晚至 24 小時","低血鈣風險門檻：濃度 ==≥50% 且體表面積 ≥1%==，或==任何濃度而體表面積 ≥5%==","致死機轉＝低血鈣／低血鎂／高血鉀→QT 延長與心律不整；治療用==葡萄糖酸鈣=="],"refs":[{"src":"5職業性氫氟酸中毒認定參考指引","file":"_ref/認定指引/all/5職業性氫氟酸中毒認定參考指引.txt","quote":"因此極易以非離子狀態穿透表皮到深部軟組織"},{"src":"5職業性氫氟酸中毒認定參考指引","file":"_ref/認定指引/all/5職業性氫氟酸中毒認定參考指引.txt","quote":"包括接觸氫氟酸濃度50%以上，且接觸體表面積達1%以上"},{"src":"5職業性氫氟酸中毒認定參考指引","file":"_ref/認定指引/all/5職業性氫氟酸中毒認定參考指引.txt","quote":"濃度50%以上，立即產生疼痛發紅"}],"note_ref":"九、氫氟酸灼傷"}},{"qid":"c11q16","q":"40 歲農民出現多汗、流涎、腹痛腹瀉、四肢無力與肌束顫抖，住院第 3 天出現吞嚥困難、複視與近端肌無力。最可能為下列何種中毒？","options":["八角蓮","河豚毒","急性有機磷","蕈類"],"answer":2,"recon":"full","src":["113-2","113-4","113-11"],"optexp":["**不符合／錯誤**：八角蓮（鬼臼毒素）中毒以噁心嘔吐、腹瀉、肝腎損傷與遲發性周邊神經病變、骨髓抑制為主，不會出現多汗流涎縮瞳的蕈毒鹼症狀，也沒有肌束顫抖。","**不符合／錯誤**：河豚毒（tetrodotoxin）阻斷鈉離子通道，食後數十分鐘內出現口周與肢體麻木、無力、上行性麻痺與呼吸衰竭，病人意識清楚、瞳孔常放大，沒有多汗流涎腹瀉等膽鹼過量表現。","**符合／正確（本題答案）**：農民＋蕈毒鹼症狀（多汗、流涎、腹痛腹瀉）＋菸鹼症狀（肌束顫抖、無力），住院第 3 天再出現頸屈肌與近端肢體無力、腦神經症狀（吞嚥困難、複視），正是有機磷中毒的中間症候群，時間點與症狀組合完全吻合。","**不符合／錯誤**：含蕈毒鹼（muscarine）的蕈類（如 Inocybe、Clitocybe）確實可造成流涎流淚多汗腹瀉縮瞳，但只有蕈毒鹼症狀，不會有肌束顫抖等菸鹼症狀，也不會在第 3 天出現中間症候群；其他常見毒蕈以腸胃炎或肝毒性（鵝膏毒肽）表現。"],"explanation":"本題考有機磷中毒的三階段病程，這是與毒蕈鑑別的關鍵。第一階段急性膽鹼性危象（數分鐘至數小時）：蕈毒鹼作用可用 DUMBELS 記（Diarrhea、Urination、Miosis、Bradycardia／Bronchorrhea、Emesis、Lacrimation、Salivation），菸鹼作用則是肌束顫抖、抽搐、肌無力、心搏過速與高血壓，中樞則有意識混亂與抽搐。第二階段中間症候群（intermediate syndrome，約 24–96 小時、常在第 1–4 天）：頸屈肌、近端肢體肌群與腦神經支配肌肉無力，導致抬頭困難、吞嚥困難、複視、眼瞼下垂，嚴重者呼吸肌無力需插管，此時 atropine 與解磷定已無效，靠支持性治療。第三階段遲發性多發性神經病變（1–3 週後）：遠端感覺運動神經病變。診斷靠血漿與紅血球膽鹼酯酶活性下降，治療為除污、atropine 與 pralidoxime。本題的「住院第 3 天出現吞嚥困難、複視與近端肌無力」就是中間症候群的定義性描述。","dispute":"本題在回憶版中答案不一致：113-2 標「蕈類」，113-4 標「急性有機磷」但註明不確定，整理者依【整理】版定為急性有機磷。依臨床邏輯應選有機磷：含蕈毒鹼的毒蕈只會產生蕈毒鹼症狀（流涎、流淚、多汗、腹瀉、縮瞳、支氣管分泌增加），不會有題幹中的肌束顫抖（菸鹼作用），更不會在第 3 天出現以頸屈肌、近端肢體與腦神經為主的中間症候群；毒蕈中毒的第二波表現是鵝膏毒肽造成的猛暴性肝衰竭（約 24–48 小時後轉氨酶飆升），與本題描述不同。應試時凡看到「農民＋膽鹼過量＋肌束顫抖」就選有機磷；只有在題幹僅有蕈毒鹼症狀、沒有肌束顫抖與中間症候群時才考慮毒蕈。","review":{"key_points":["有機磷三階段：==急性膽鹼性危象（DUMBELS＋肌束顫抖）→中間症候群（24–96 小時，頸屈肌／近端肢體／腦神經無力）→遲發性神經病變（1–3 週）==","中間症候群對 atropine 與 pralidoxime 無效，重點是呼吸監測與支持治療","毒蕈（muscarine 型）只有蕈毒鹼症狀，==無肌束顫抖、無中間症候群==；鵝膏毒肽型以猛暴性肝衰竭表現","診斷：血漿與紅血球==膽鹼酯酶活性==下降"],"refs":[],"note_ref":"十、農藥：有機磷與巴拉刈"}},{"qid":"c11q17","q":"有關有機磷引起之遲發性神經病變（OPIDN），下列敘述何者正確？","options":["細神經纖維比粗神經纖維更易受傷害","髓鞘（myelin）比軸突（axon）先發生病變","周邊神經近端比遠端更易受傷害","與神經病變標的酯酶（neuropathy target esterase, NTE）被磷酸化並老化有關"],"answer":3,"recon":"full","src":["113-4","113-11"],"optexp":["**不符合／錯誤**：方向相反。OPIDN 是遠端軸突病變（dying-back），受害的是直徑粗、長度長的有髓鞘纖維，細小纖維相對耐受；臨床先出現下肢遠端無力與垂足，而非細纖維的痛溫覺喪失。","**不符合／錯誤**：軸突先於髓鞘。OPIDN 的原發病灶是軸突變性，髓鞘崩解是繼發於軸突退化的結果；原發性脫髓鞘病變要想到 Guillain-Barré 症候群與鉛（動物模式）。","**不符合／錯誤**：遠端先於近端。長軸突的最遠端最先失去代謝支持而退化，所以症狀從足部開始往上發展，跟腱反射先消失，這是所有中毒性軸突病變的共通模式。","**符合／正確（本題答案）**：OPIDN 的機轉是神經病變標的酯酶（neuropathy target esterase, NTE）被有機磷磷酸化後再發生「老化」（aging，側鏈脫離使抑制不可逆），抑制須超過約 70% 才會發病；此機轉與乙醯膽鹼酯酶抑制無關，所以急性症狀輕重不能預測會不會發生 OPIDN。"],"explanation":"本題考有機磷遲發性神經病變（OPIDN）的機轉與病理方向。時序：急性中毒後約 1–3 週（部分文獻 7–21 天）出現，先有下肢遠端麻木刺痛與抽筋，接著垂足、步態不穩、跟腱反射消失，嚴重者上肢也受累，數月後可能留下痙攣性下肢輕癱（因合併脊髓長徑路受損）。機轉：NTE 被磷酸化後老化，造成軸突內運輸障礙與遠端軸突退化。病理三個方向要一起背：粗大長纖維＞細纖維、遠端＞近端、軸突＞髓鞘。代表物質是三鄰甲苯磷酸酯（TOCP，歷史上的 Ginger Jake 癱瘓事件）與部分有機磷農藥（如 chlorpyrifos 大量暴露）。與中間症候群的區別在於時間與部位：中間症候群在 24–96 小時、以近端與腦神經支配肌肉為主；OPIDN 在 1–3 週後、以遠端感覺運動神經為主。治療上兩者皆無特效藥，OPIDN 恢復緩慢且常不完全。","dispute":"","review":{"key_points":["OPIDN＝有機磷抑制 ==NTE（神經病變標的酯酶）==並老化→遠端軸突病變，與膽鹼酯酶抑制無關","時序：急性中毒後 ==1–3 週==；表現為遠端麻木、垂足、跟腱反射消失","病理方向：==粗長纖維＞細纖維、遠端＞近端、軸突＞髓鞘==","與中間症候群區別：中間症候群 24–96 小時、近端與腦神經；OPIDN 1–3 週、遠端"],"refs":[],"note_ref":"十、農藥：有機磷與巴拉刈"}},{"qid":"c11q18","q":"巴拉刈（paraquat）製造作業長期暴露，下列何種健康危害為其特殊健康檢查之重點？","options":["皮膚角化、黑斑與皮膚癌","類巴金森症候群","肝血管肉瘤","腎病症候群"],"answer":0,"recon":"full","src":["113-4","113-11","115-01","整理-表格"],"optexp":["**符合／正確（本題答案）**：附表十聯吡啶或巴拉刈作業的法定項目就是「皮膚角化、黑斑及疑似皮膚癌症病變既往病史之調查」與「皮膚及指甲之身體檢查」，分級指引也寫巴拉刈慢性暴露可能引起皮膚癌，皮膚正是特殊健檢的重點。","**不符合／錯誤**：分級指引雖提及有研究顯示巴拉刈與巴金森氏病有關，但那是流行病學上的關聯，不是法定特殊健檢項目；類巴金森症候群的法定監測對象是錳作業（身體檢查明列巴金森症候群）與二硫化碳。","**不符合／錯誤**：肝血管肉瘤是氯乙烯（另有無機砷、二氧化釷）的特徵，巴拉刈作業的法定項目完全沒有肝臟檢查或影像。","**不符合／錯誤**：巴拉刈急性食入會造成腎小管壞死與急性腎衰竭，但那是自殺或誤食的急性事件，不是製造作業長期暴露的健檢重點；腎病症候群也不是巴拉刈的典型腎病型態。"],"explanation":"本題考巴拉刈作業特殊健檢的方向：皮膚與指甲。要把「急性食入」與「職業長期暴露」分開記。急性食入巴拉刈：口咽與食道灼傷、腎小管壞死與肝損傷，數日後進行性肺纖維化與多重器官衰竭，高濃度氧氣會加重肺傷害，故急救時反而要限制給氧，血中濃度與攝食時間可用 Proudfoot nomogram 判斷預後。職業長期暴露（製造與噴灑）：皮膚刺激與皮膚炎、陰囊與臀間皮疹、指甲異常與脫落、鼻出血、角膜潰瘍結痂，慢性可能引起皮膚癌，另有研究顯示與巴金森氏病有關。法定項目只有三條：作業經歷生活習慣及自覺症狀調查、皮膚角化黑斑及疑似皮膚癌症病變既往病史調查、皮膚及指甲之身體檢查；附表十二的考量疾病也只列皮膚疾病。容許濃度：聯吡啶為作業環境空氣中不得檢出，巴拉刈 PEL-TWA 0.1 mg/m3，分級輔助基準 ≥0.05 mg/m3。","dispute":"","review":{"key_points":["巴拉刈作業法定項目只有三條，重點是==皮膚角化、黑斑、疑似皮膚癌既往病史＋皮膚及指甲身體檢查==","慢性職業暴露＝皮膚炎、指甲異常、==可能引起皮膚癌==，另有研究顯示與巴金森氏病有關","急性食入＝口咽灼傷、腎小管壞死、進行性==肺纖維化==與多重器官衰竭（急救時限制給氧）","容許濃度：聯吡啶==不得檢出==、巴拉刈 ==0.1 mg/m3==，分級輔助基準 ≥0.05 mg/m3"],"refs":[{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"皮膚角化、黑斑及疑似皮膚癌症"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"(３)皮膚及指甲之身體檢查。"},{"src":"21_聯吡啶或巴拉刈作業管理分級參考","file":"_ref/分級指引/21_聯吡啶或巴拉刈作業管理分級參考.txt","quote":"可能引起皮膚癌，另有研究顯示和巴金森氏病有關"}],"note_ref":"十、農藥：有機磷與巴拉刈"}},{"qid":"c11q19","q":"3,3'-二氯-4,4'-二胺基苯化甲烷（MOCA）引起之職業性膀胱癌，其認定參考指引所定之最短暴露時間為何？","options":["六個月","一年","五年","十年"],"answer":1,"recon":"full","src":["113-12","114-02","114-03","114-04","114-05"],"optexp":["**不符合／錯誤**：六個月是苯引起白血病的最短暴露時間，不是 MOCA。兩個指引的數字不要互換。","**符合／正確（本題答案）**：MOCA 引起之職業性膀胱癌認定參考指引明定最短暴露時間為一年，且膀胱癌須發生於開始暴露的十年以後。","**不符合／錯誤**：五年不是 MOCA 的任何一個門檻；五年是苯中毒指引的最短誘導期，也是氯乙烯肝纖維化合併門脈高壓的最短誘導期。","**不符合／錯誤**：十年是 MOCA 的最短誘導期（發病須在開始暴露十年以後），不是最短暴露時間；題目問的是暴露多久，答案是一年。"],"explanation":"本題考 MOCA 膀胱癌認定指引的四個數字，容易與苯、氯乙烯混淆。MOCA（3,3'-二氯-4,4'-二胺基苯化甲烷）是聚胺酯橡膠與 PU 彈性體的硬化劑，IARC 第一類致癌物，經皮膚吸收顯著（PEL 註記「皮」與「瘤」），我國 PEL-TWA 0.02 ppm（0.22 mg/m3），屬丙類第一種特定化學物質。指引數字：最短暴露時間一年、最短誘導期十年、最長潛伏期「無」、罹病時序性要求膀胱癌發生於開始暴露十年以後。診斷需組織病理證實膀胱癌，並合理排除長期抽菸等非職業因素（抽菸在已開發國家佔膀胱癌病因五成以上）。其他職業性膀胱癌致病物：聯苯胺、4-胺基聯苯、β-萘胺、二氯聯苯胺、α-萘胺（附表十把這些與 MOCA 的健檢重點放在泌尿系統含腰側擊痛與皮膚檢查、尿蛋白尿潛血與尿沉渣鏡檢，必要時細胞診斷檢查）。對照組數字：苯中毒指引最短暴露六個月、最短誘導期五年、無最長潛伏期。","dispute":"","review":{"key_points":["MOCA 膀胱癌：最短暴露 ==1 年==、最短誘導期 ==10 年==、最長潛伏期==無==，膀胱癌須發生於開始暴露 10 年以後","MOCA＝PU／聚胺酯橡膠硬化劑，IARC ==Group 1==，PEL-TWA ==0.02 ppm（皮、瘤）==","對照：苯引起白血病最短暴露 ==6 個月==、最短誘導期 5 年","職業性膀胱癌其他致病物：聯苯胺、4-胺基聯苯、β-萘胺、二氯聯苯胺、α-萘胺"],"refs":[{"src":"MOCA膀胱癌","file":"_ref/認定指引/MOCA膀胱癌.txt","quote":"最短暴露時間為1年"},{"src":"MOCA膀胱癌","file":"_ref/認定指引/MOCA膀胱癌.txt","quote":"最短誘導期為10年"},{"src":"MOCA膀胱癌","file":"_ref/認定指引/MOCA膀胱癌.txt","quote":"其膀胱癌發生於開始暴露的10年以後"}],"note_ref":"八、芳香族胺與硝基化合物：變性血紅素血症與膀胱癌"}},{"qid":"c11q20","q":"塑膠製造業中，接觸下列何種物質最容易產生皮膚過敏（過敏性接觸皮膚炎）？","options":["苯乙烯","酸類","環氧樹脂","聚丙烯"],"answer":2,"recon":"full","src":["113-10","113-11","114-03","114-04"],"optexp":["**不符合／錯誤**：苯乙烯在職業性皮膚病指引中被列為塑膠工業的「刺激原」，造成刺激性皮膚炎與脫脂，並非典型的過敏原；它的主要職業危害是中樞神經（頭暈、反應變慢）與聽力（與噪音有加成作用）。","**不符合／錯誤**：酸類是典型刺激原，造成刺激性接觸皮膚炎或化學灼傷，屬非免疫機轉、任何人暴露足量都會發生，不需要致敏期，與過敏性接觸皮膚炎不同。","**符合／正確（本題答案）**：職業性皮膚病認定參考指引明載塑膠工業中「環氧樹脂是最重要的原因」，其未聚合的單體與胺類硬化劑是強力接觸過敏原，可造成第四型遲發性過敏反應，補綴試驗常呈陽性。","**不符合／錯誤**：聚丙烯是已聚合的惰性高分子成品，分子量大、無法穿透角質層當半抗原，不會致敏；塑膠成品本身不易造成過敏性接觸皮膚炎，問題出在未聚合的單體、添加劑與硬化劑。"],"explanation":"本題考刺激原與過敏原的分辨。刺激性接觸皮膚炎：非免疫機轉、首次暴露即可發生、與濃度和接觸時間成正比、界線常與接觸部位一致，約佔職業性接觸皮膚炎的多數（國外常引八成，我國指引引述台灣資料為刺激性與過敏性約各半）；過敏性接觸皮膚炎：第四型遲發性過敏、需先致敏、再暴露微量即發作、可擴散至非接觸部位，靠補綴試驗（patch test）確診。各行業的對照要記：塑膠業刺激原為溶劑、酸類、氧化劑、苯乙烯、酚類、丙烯酸單體與甲醛，過敏原為金屬與環氧樹脂；橡膠業刺激原為滑石、硬脂酸鋅與溶劑，過敏原為橡膠添加劑（thiuram、carbamate、mercaptobenzothiazole）；機械業刺激原為切削油與溶劑，過敏原為切削油添加劑與鉻、鎳、鈷；建築業為水泥（六價鉻）；美髮業為對苯二胺與燙髮劑。環氧樹脂的接觸來源包括黏著劑、金屬工具、鑄件、電器、油漆與樹脂，同時也是電子業重要過敏原。","dispute":"","review":{"key_points":["塑膠工業最重要的接觸過敏原＝==環氧樹脂==（及其胺類硬化劑）；苯乙烯、酸類、溶劑屬刺激原","刺激性皮膚炎＝非免疫、首次即可發生、刺激性皮膚炎＝非免疫、首次即可發生（台灣資料刺激性與過敏性約各半）；過敏性＝第四型、需致敏、靠==補綴試驗==；過敏性＝第四型、需致敏、靠==補綴試驗==","橡膠業過敏原＝橡膠添加劑（==thiuram、carbamate==），刺激原＝滑石、硬脂酸鋅、溶劑","聚合完成的塑膠成品（如聚丙烯）惰性、不致敏"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"環氧樹脂(epoxyresin)是最重要的原因，它接觸來源是黏著劑"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"塑膠成品不易造成過敏性接觸皮膚炎"}],"note_ref":"十二、塑膠與橡膠業的皮膚過敏原"}},{"qid":"c11q21","q":"多氯聯苯（PCB）中毒不會造成下列何者？","options":["氯痤瘡","軸突性周邊神經病變","類巴金森症候群","後代智能障礙"],"answer":2,"recon":"full","src":["113-2","113-6","113-8","113-12","114-01","114-02","114-04"],"optexp":["**不符合／錯誤（PCB 會造成）**：氯痤瘡是多氯聯苯中毒最明顯也最具特異性的症狀，為稻草色針頭至豌豆大小的皮膚囊腫，分布於臉部、雙耳、耳後、腋窩、軀幹與外生殖器，通常不侵犯鼻子。","**不符合／錯誤（PCB 會造成）**：多氯聯苯中毒可出現周邊神經病變，型態是軸突性（axonal）、以感覺神經為主，常與氯痤瘡合併出現；指引把它列為與氯痤瘡同時出現的支持性表現。","**符合／正確（本題答案）**：類巴金森症候群不是多氯聯苯的表現。職業暴露造成錐體外症候群要想到錳（典型）、一氧化碳（遲發性）、二硫化碳與甲基溴；多氯聯苯的神經影響是周邊神經病變與腦電波減慢。","**不符合／錯誤（PCB 會造成）**：台灣米糠油油症事件的「油症兒」出現生長遲滯、皮膚色素沉著、指甲異常與認知發展落後，經胎盤與母乳的暴露造成後代智能與發育障礙是多氯聯苯的重要危害。"],"explanation":"本題考多氯聯苯（PCB）中毒的表現清單與它的「不會」。會的：氯痤瘡（最明顯、與血中濃度不一定相關）、皮膚與牙齦黏膜及指甲色素沉著、皮膚角質增生、指甲橫紋與凹陷、眼瞼腫脹與眼睛分泌物增多、軸突性周邊神經病變（以感覺為主）、廣泛性腦電波減慢、肝功能異常與三酸甘油脂血糖升高、甲狀腺腫大與功能異常、貧血、關節炎、女性經期異常與死胎，以及後代（油症兒）的發育與智能障礙。不會的：類巴金森症候群（錳）、脫髓鞘性神經病變（PCB 是軸突性）。診斷依據是職業或食用污染食物的暴露史、氯痤瘡的典型分布與病理（鱗狀上皮與角質增生形成囊腫）、血清中 PCB／PCDF／PCQ 濃度超過 1–2 µg/g-lipid，並排除 dichloroaniline 等其他致氯痤瘡物質。1968 年日本 Yusho 與 1979 年台灣彰化米糠油事件是兩起經典中毒事件。","dispute":"","review":{"key_points":["PCB 會：==氯痤瘡（臉、耳後、腋窩、軀幹、外生殖器，不侵犯鼻子）==、色素沉著、==軸突性==周邊神經病變、腦波減慢、肝功能異常、後代智能發育障礙","PCB 不會：==類巴金森症候群==（想到錳、一氧化碳）與==脫髓鞘性==神經病變","診斷：暴露史＋典型氯痤瘡＋血清 PCB 濃度 ==>1–2 µg/g-lipid==，排除 dichloroaniline","經典事件：日本 Yusho（1968）、台灣米糠油油症（1979）"],"refs":[{"src":"多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引","file":"_ref/認定指引/all/多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引.txt","quote":"氯痤瘡是多氯聯苯慢性中毒最明顯的症狀"},{"src":"多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引","file":"_ref/認定指引/all/多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引.txt","quote":"涵蓋臉部、雙耳、耳後、腋窩、軀幹與外生殖器，通常不侵犯鼻子"},{"src":"多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引","file":"_ref/認定指引/all/多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引.txt","quote":"(3)與(2)同時合併出現的周邊神經病變；貧血、肝功能異常"}],"note_ref":"十一、多氯聯苯與一氧化碳"}},{"qid":"c11q22","q":"下列何者為多氯聯苯（PCB）中毒之典型表現組合？（A）廣泛性氯痤瘡（B）後代認知缺陷（C）腦電波變慢（D）脫髓鞘神經病變","options":["A、B","A、B、C","A、B、C、D","A、D"],"answer":1,"recon":"full","src":["113-12","114-02"],"optexp":["**不符合／錯誤**：只選 A、B 漏掉了 C。廣泛性腦電波減慢是多氯聯苯中毒的中樞神經表現之一，油症患者的追蹤研究有相關報告，不能排除。","**符合／正確（本題答案）**：A 廣泛性氯痤瘡、B 後代認知缺陷、C 腦電波變慢三者都是多氯聯苯中毒的表現；D 脫髓鞘神經病變則不是，PCB 造成的是軸突性周邊神經病變。","**不符合／錯誤**：包含 D 就錯了。認定指引與多份回憶版都強調 PCB 的神經病變屬軸突性（axonal），不是脫髓鞘性（demyelinating）。","**不符合／錯誤**：A、D 的組合同時漏掉正確的 B、C，又納入錯誤的 D，是四個選項中最不可能的答案。"],"explanation":"本題與前一題是同一考點的正反問法，重點只有一個：PCB 的周邊神經病變是軸突性而非脫髓鞘性。把三個「會」記牢：（1）廣泛性氯痤瘡——最具特異性，分布於臉部、雙耳、耳後、腋窩、軀幹與外生殖器且不侵犯鼻子，對一般痤瘡治療反應不佳、可持續多年；（2）後代認知缺陷——經胎盤與母乳傳遞，台灣油症兒有生長遲滯、指甲異常、牙齒與皮膚色素異常及認知發展落後；（3）腦電波變慢——中樞神經受累的客觀證據。至於周邊神經，指引列的是「與氯痤瘡合併出現的周邊神經病變」，電生理型態為軸突性、以感覺神經為主。考試若把選項寫成「脫髓鞘神經病變」，一律當錯。臨床上的脫髓鞘性職業／中毒性神經病變極少見，較常見的職業性神經病變（正己烷、丙烯醯胺、砷、鉛、有機磷 OPIDN）幾乎都是軸突性的遠端 dying-back 型。","dispute":"","review":{"key_points":["PCB 典型組合＝==氯痤瘡＋後代認知缺陷＋腦電波變慢==","PCB 的周邊神經病變是==軸突性==，不是脫髓鞘性","職業／中毒性神經病變幾乎都是==軸突性遠端 dying-back==（正己烷、丙烯醯胺、砷、鉛、OPIDN）"],"refs":[{"src":"多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引","file":"_ref/認定指引/all/多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引.txt","quote":"氯痤瘡是多氯聯苯急性中毒最明顯的症狀"},{"src":"多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引","file":"_ref/認定指引/all/多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引.txt","quote":"(3)與(2)同時合併出現的周邊神經病變；貧血、肝功能異常"}],"note_ref":"十一、多氯聯苯與一氧化碳"}},{"qid":"c11q23","q":"依職業暴露一氧化碳引起之疾病認定參考指引，一氧化碳中毒之腦部異常最常見的病灶位於何處？","options":["大腦白質（含遲發性去髓鞘病變）","蒼白核","腦幹","視丘"],"answer":0,"recon":"partial","src":["113-12","114-03"],"optexp":["**符合／正確（本題答案）**：職業暴露一氧化碳引起之疾病認定參考指引原文寫「一氧化碳中毒的腦部異常最常見的病灶在大腦白質，包括去髓鞘作用、水腫、局部壞死及出血點」，白質也是遲發性神經病變去髓鞘變化的所在。","**不符合／錯誤（但為教科書上的典型影像）**：雙側蒼白核低密度壞死是急性一氧化碳中毒最具特徵性的影像所見，指引也提到典型病灶見於兩側視丘蒼白核處；但本題問的是「最常見」，依指引原文應答大腦白質。","**不符合／錯誤**：腦幹不是一氧化碳中毒的好發部位。一氧化碳造成的是缺氧合併再灌流氧化傷害，好發於代謝需求高、血流分水嶺區的白質與基底核，腦幹相對耐受。","**不符合／錯誤**：視丘可在嚴重個案受累，指引描述典型低密度缺血顯像時把「兩側視丘蒼白核處」並列，但單獨的視丘病灶既非最常見也非最具特徵，不是本題所問。"],"explanation":"本題考一氧化碳中毒的腦部病灶位置，關鍵在「最常見」與「最典型」是兩個不同的問法。一氧化碳與血紅素親和力約為氧的 200–250 倍，形成 COHb 使攜氧量下降並使氧解離曲線左移，同時與細胞色素氧化酶及肌紅蛋白結合，造成組織缺氧與再灌流時的脂質過氧化與發炎反應，所以白質的少突膠質細胞與基底核最易受害。臨床分兩期：急性期頭暈頭痛噁心嘔吐、意識障礙、心肌缺血（COHb >10% 且神智改變或有心臟症狀者要做心電圖並驗 troponin）；遲發性神經病變則在正常期（1–41 天）後出現智能減退、意識障礙、錐體外症候群（類帕金森）、大小便失禁、偏癱、步態不穩與失語，積極高壓氧治療可降低發生率。診斷靠 COHb 或呼氣一氧化碳濃度、影像（電腦斷層或磁振造影在基底核或大腦白質的缺血表現）與暴露證據。","dispute":"本題兩個答案的差別在於問法。依職安署認定指引原文，「一氧化碳中毒的腦部異常最常見的病灶在大腦白質，包括去髓鞘作用、水腫、局部壞死及出血點」，同一段接著寫「典型病灶則可見在兩側視丘蒼白核處有對稱性低密度的缺血顯像」，職業病認定基準一節也寫「腦部電腦斷層或核磁共振檢查在基底核或大腦白質有典型的缺血表現」。教科書上一般教「雙側蒼白核（globus pallidus）壞死最具特徵性」。因此：題目問「最常見」「遲發性去髓鞘」時選大腦白質（114-03 回憶者也是這樣判斷）；題目問「最具特徵性」「急性期典型影像」時選蒼白核。113-12 的版本選項不詳，作答時依題幹用字判斷即可。","review":{"key_points":["指引原文：一氧化碳中毒腦部異常==最常見的病灶在大腦白質==（去髓鞘、水腫、局部壞死、出血點）","==最具特徵性==的急性影像是兩側==蒼白核==（指引寫兩側視丘蒼白核處）對稱性低密度","遲發性神經病變：正常期 ==1–41 天==後出現智能減退、類帕金森、大小便失禁、偏癱；高壓氧可降低發生率","COHb >10% 且神智改變或有心臟症狀者應做心電圖並監測 troponin"],"refs":[{"src":"職業暴露一氧化碳引起之疾病認定參考指引","file":"_ref/認定指引/all/職業暴露一氧化碳引起之疾病認定參考指引.txt","quote":"一氧化碳中毒的腦部異常最常見的病灶在大腦白質，包括去髓鞘作用、水腫、局部壞死及出血點"},{"src":"職業暴露一氧化碳引起之疾病認定參考指引","file":"_ref/認定指引/all/職業暴露一氧化碳引起之疾病認定參考指引.txt","quote":"典型病灶則可見在兩側視丘蒼白核處有對稱性"},{"src":"職業暴露一氧化碳引起之疾病認定參考指引","file":"_ref/認定指引/all/職業暴露一氧化碳引起之疾病認定參考指引.txt","quote":"腦部電腦斷層或核磁共振檢查在基底核或大腦白質有典型的缺血表現"}],"note_ref":"十一、多氯聯苯與一氧化碳"}},{"qid":"c11q24","q":"下列何者不是內因性（intrinsic）直接型肝細胞毒性物質？","options":["四氯化碳","氯仿","1,1,2,2-四氯乙烷","黃磷"],"answer":3,"recon":"full","src":["113-2","113-6","113-8","113-11","114-01"],"optexp":["**不符合／錯誤（四氯化碳是直接型）**：四氯化碳是內因性直接型肝毒素的代表，經 CYP2E1 活化為三氯甲基自由基，直接攻擊細胞膜與內質網並引發脂質過氧化，暴露後數分鐘至數小時即造成小葉中心壞死與脂肪化。","**不符合／錯誤（氯仿是直接型）**：氯仿與四氯化碳同屬鹵化甲烷，急性肝傷害認定指引的分類表把 CCl4 與 Chloroform 並列為內因性直接型的代表例子。","**不符合／錯誤（四氯乙烷是直接型）**：1,1,2,2-四氯乙烷是毒性最強的氯化烴之一，造成肝脂肪變性、壞死與萎縮，屬同一類直接型肝細胞毒素，法定項目也列 ALT 與 γ-GT。","**符合／正確（本題答案）**：黃磷不在指引的直接型代表清單中。指引表一列的直接型例子是 CCl4、Chloroform 與 Dimethylformamide；黃磷的肝損傷屬課程分類的內因性間接型（干擾代謝路徑），與黴菌毒素、乙醇、urethane 同組。"],"explanation":"本題考肝毒性物質的機轉分類。職業暴露有機溶劑引起之急性肝傷害認定參考指引把肝毒物分兩大類：內因性（intrinsic）——發生率高、動物可重現、有劑量效應、潛伏期短，又分直接型（細胞膜與胞器整體受損，暴露後數分鐘至數小時即壞死或脂化，例子為 CCl4、chloroform、dimethylformamide）與間接型（經生物轉化或競爭性阻斷代謝路徑，潛伏期數小時至數日，肝細胞毒性型例子為 ethanol、urethane、mycotoxin、ethionine、bromobenzene；膽汁鬱積型例子為 methylene dianiline、rapeseed oil）；特異體質型（idiosyncratic）——發生率低、動物再現性低、無劑量效應、潛伏期長，分過敏性（halothane，1–4 週）與代謝異常（isoniazid、iproniazid、cincophen，數週至數月）。本題的四個選項中，三個氯烷類都在直接型清單裡，黃磷不是，所以答黃磷。114-01 的版本把選項換成氯仿／四氯化碳／DMF／黃磷，用同一張表也能解出黃磷。","dispute":"黃磷的分類有出入：經典教科書（Zimmerman 分類）把黃磷列為內因性直接型肝毒物，但本考試的課程分類與 113-2、114-01 回憶版答案都把黃磷視為「不是直接型」，認定指引表一的直接型例子也只列 CCl4、氯仿、DMF；應試選黃磷。","review":{"key_points":["內因性直接型代表：==四氯化碳、氯仿、DMF==（也含四氯乙烷等氯烷類），數分鐘至數小時即壞死或脂化","內因性間接型：==乙醇、urethane、黴菌毒素、ethionine、bromobenzene==（肝細胞型）、==methylene dianiline==（膽汁鬱積型）","特異體質型：==halothane==（過敏性 1–4 週）、isoniazid／iproniazid（代謝異常，數週至數月）","分辨口訣：內因性＝可預測、劑量相關、動物可重現；特異體質＝不可預測、與劑量無關"],"refs":[{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"內因性肝傷害的發生較常見，潛伏期短"},{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"暴露後數分鐘至數小時立即產生傷害，造成肝細胞帶狀壞死或脂化"},{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"間接肝毒性是化學物質經生物轉化或競爭性地阻斷代謝路徑"}],"note_ref":"七、化學性肝毒素的分類"}},{"qid":"c11q25","q":"有關化學性肝毒素之敘述，下列何者錯誤？","options":["四氯化碳經生物活化產生自由基而造成急性肝損傷","氯乙烯只會造成急性肝傷害，不會造成慢性傷害或癌症","多氯聯苯和四氯乙烷會造成慢性肝傷害，導致肝細胞壞死合併再生性結節與纖維化","大部分肝毒性物質及致癌物最初經由混合功能氧化酶（MFO）活化"],"answer":1,"recon":"full","src":["113-2","113-11","114-02","114-04"],"optexp":["**正確**：四氯化碳經細胞色素 P450（CYP2E1）活化為三氯甲基自由基與三氯甲基過氧自由基，引發脂質過氧化破壞細胞膜與內質網，造成小葉中心（zone 3）壞死與脂肪肝，是急性化學性肝傷害的教科書範例。","**錯誤（本題答案）**：完全相反。氯乙烯的代表性危害正是慢性——肝竇周圍與門脈周圍纖維化、非硬化性門脈高壓、脾腫大血小板低下，以及肝血管肉瘤與肝細胞癌（IARC 第一類致癌物）。","**正確**：多氯聯苯與 1,1,2,2-四氯乙烷都會造成慢性肝傷害；四氯乙烷的慢性病變為肝脂肪變性、壞死與萎縮，多氯聯苯則有肝功能異常與慢性肝病變，反覆壞死後出現再生性結節與纖維化。","**正確**：多數肝毒性物質與致癌物本身並不活潑，要先經肝細胞內質網的混合功能氧化酶系統（MFO／細胞色素 P450）代謝活化成親電性中間產物或自由基，才產生毒性，這也是 zone 3 最易受害的原因。"],"explanation":"本題考化學性肝毒素的通則與氯乙烯這個常考陷阱。三個通則：（1）多數肝毒物與致癌物需經混合功能氧化酶（MFO，即 CYP450）活化，故誘導酵素的因子（酒精、苯巴比妥、禁食）會加重毒性，而抑制者（二硫化碳對四氯化碳）反而減輕；（2）小葉中心（zone 3，中央靜脈周圍）CYP450 含量最高、氧分壓最低，是需活化型肝毒物的病變好發區；（3）急性與慢性要分開記：四氯化碳與氯仿以急性壞死為主（人類目前無轉為慢性的報告，動物實驗則可致肝硬化），四氯乙烷與多氯聯苯可造成慢性肝傷害合併再生結節與纖維化，氯乙烯與砷則以慢性纖維化、門脈高壓與癌症為特徵。本題四個版本回憶完全一致，選項 B 一望即知與氯乙烯的已知危害相反，是可以秒殺的送分題。","dispute":"","review":{"key_points":["四氯化碳＝CYP2E1 活化成==自由基==→脂質過氧化→==小葉中心（zone 3）==壞死與脂肪肝","多數肝毒物與致癌物須先經==混合功能氧化酶（MFO／CYP450）==活化才有毒性","慢性肝傷害合併再生結節與纖維化：==多氯聯苯、1,1,2,2-四氯乙烷==；氯乙烯則以纖維化、門脈高壓與癌症為特徵","四氯化碳在人類以急性肝傷害為主，無轉為慢性的報告（動物實驗可致肝硬化）"],"refs":[{"src":"07_1,1,2,2-四氯乙烷作業管理分級參考","file":"_ref/分級指引/07_1,1,2,2-四氯乙烷作業管理分級參考.txt","quote":"肝臟病變：肝脂肪變性(硬化)壞疽(細胞死亡)、萎縮"},{"src":"08_四氯化碳作業管理分級參考","file":"_ref/分級指引/08_四氯化碳作業管理分級參考.txt","quote":"重覆暴露可能造成嚴重的腎、肝損害、心、肺衰弱與傷害神經系統"},{"src":"15_氯乙烯作業管理分級參考","file":"_ref/分級指引/15_氯乙烯作業管理分級參考.txt","quote":"引起肝臟血管肉瘤－一種人體罕見的肝癌"}],"note_ref":"七、化學性肝毒素的分類"}},{"qid":"c11q26","q":"下列何者為職業性肝血管肉瘤（hepatic angiosarcoma）之典型致病物質？","options":["苯","氯乙烯單體","四氯乙烯","正己烷"],"answer":1,"recon":"full","src":["113-10","113-11","114-04"],"optexp":["**不符合／錯誤**：苯的標的是骨髓，造成再生不良性貧血、骨髓化生不良症候群與急性骨髓性白血病，與肝血管肉瘤無關；苯中毒指引的最短暴露為六個月、最短誘導期五年。","**符合／正確（本題答案）**：氯乙烯單體是職業性肝血管肉瘤的代表物。1974 年美國 PVC 聚合部門勞工的叢集事件首度確立此因果關係，IARC 據以認定氯乙烯為第一類人體致癌物，主要增加肝臟血管肉瘤與肝細胞癌。","**不符合／錯誤**：四氯乙烯造成肝功能異常與神經症狀，流行病學上與膀胱癌、多發性骨髓瘤及非何杰金氏淋巴瘤風險增加有關，並非肝血管肉瘤的致病物。","**不符合／錯誤**：正己烷的標的是周邊神經，法定項目連肝功能都沒有，與肝臟癌症無關。"],"explanation":"本題考肝血管肉瘤（hepatic angiosarcoma）這個罕見肝癌的三大職業與環境病因：氯乙烯單體、無機砷（早年葡萄園殺蟲劑與含砷藥物 Fowler 溶液）、二氧化釷（thorotrast，舊時血管攝影顯影劑）。這三者也都可造成非硬化性門脈高壓，是同一組記憶。氯乙烯的部分要背：IARC Group 1；肝血管肉瘤與肝細胞癌的最短暴露期間與最短誘導期各十年；實際潛伏期中位數肝血管肉瘤約 36 年、肝細胞癌約 48 年；累積暴露大於 865 ppm-years 與發病密切相關。台灣本土資料則顯示目前發現的肝血管肉瘤病患尚無足夠證據與氯乙烯相關，但氯乙烯勞工肝細胞癌與肝硬化住院率有增加，且與 B、C 型肝炎有協同作用。臨床上肝血管肉瘤預後極差，超音波與電腦斷層不易早期診斷，故對氯乙烯勞工的追蹤重點是腹部超音波（門靜脈擴大、脾腫大、肝纖維化比肝功能指數更敏感）。","dispute":"","review":{"key_points":["肝血管肉瘤三大職業／環境病因：==氯乙烯單體、無機砷、二氧化釷（thorotrast）==","氯乙烯為 IARC ==Group 1==，血管肉瘤與肝細胞癌最短暴露與誘導期各 ==10 年==","追蹤氯乙烯勞工以==腹部超音波==（門靜脈擴大、脾腫大、肝纖維化）比肝功能指數敏感","苯→白血病；四氯乙烯→膀胱癌、淋巴瘤疑慮；正己烷→周邊神經"],"refs":[{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"氯乙烯已被IARC認定為第一類人體致癌物，主要為增加肝臟血管肉瘤"},{"src":"15_氯乙烯作業管理分級參考","file":"_ref/分級指引/15_氯乙烯作業管理分級參考.txt","quote":"引起肝臟血管肉瘤－一種人體罕見的肝癌"}],"note_ref":"五、氯乙烯：肝毒性與致癌性"}},{"qid":"c11q27","q":"下列何種物質容易造成肝臟纖維化，但較少造成硬化性肝臟門脈高壓（以非硬化性門脈高壓為特徵）？","options":["多氯聯苯","錳","氯乙烯","砷"],"answer":2,"recon":"full","src":["113-10","113-11","114-02"],"optexp":["**不符合／錯誤**：多氯聯苯造成肝功能異常與慢性肝傷害，可有壞死後再生結節與纖維化，但它不是以「非硬化性門脈高壓」為特徵的代表物，認定指引也沒有門脈高壓的描述。","**不符合／錯誤**：錳的標的是中樞神經（錐體外症候群、精神症狀）與肺（錳因性肺炎），附表十二只列精神或中樞神經系統疾病、慢性呼吸道疾病、肝病、腎臟疾病為考量疾病，錳本身不造成肝纖維化或門脈高壓。","**符合／正確（本題答案）**：氯乙烯的肝臟受損位置主要是肝竇，早期為肝竇周圍與血管周圍纖維化，可在肝硬化尚不明顯時就出現脾腫大與門脈高壓（Banti 氏症候群）；大型世代研究並未發現氯乙烯增加肝硬化風險，切片也常不見肝硬化，正是非硬化性門脈高壓的典型。","**不符合／錯誤**：無機砷確實也會造成非硬化性門脈高壓與肝血管肉瘤，是與氯乙烯同組的鑑別診斷；但在本題四個選項中，以氯乙烯為職業醫學最具代表性、也是回憶版與整理者定的答案。"],"explanation":"本題考「肝纖維化但不走向肝硬化」的特殊病理。氯乙烯的肝損傷起點在肝竇：暴露初期只有肝竇周圍（perisinusoidal）與血管周圍（perivascular）纖維化，之後才逐漸發展為門脈周圍、門脈區與被膜下纖維化；因為纖維化沿肝竇分布而非形成再生結節，門脈壓力在肝實質結構還相對完整時就已上升，臨床上以脾腫大、血小板低下、食道靜脈曲張表現，即 Banti 氏症候群。流行病學也支持：Frullanti 在 2012 年分析四萬名北美與歐洲氯乙烯勞工，未發現肝硬化風險增加（相對風險 0.73），且氯乙烯所致肝血管肉瘤病人的肝組織切片也未顯示肝硬化。實務意義：追蹤氯乙烯勞工不能只看 ALT，要做腹部超音波看門靜脈擴大、脾腫大與肝臟結構變化，因為肝功能指數常正常（台灣 2004 年研究中 20 位肝纖維化者只有 10 位肝指數異常）。相同機轉的物質還有無機砷與二氧化釷。","dispute":"本題回憶版答案不一致：113-10 標多氯聯苯（A），114-02 與【整理】版標氯乙烯。依原文應以氯乙烯為準——職業性氯乙烯中毒認定參考指引明確描述肝竇周圍纖維化與 Banti 氏症候群（肝臟纖維化尚不明顯時就已伴隨脾腫大及門脈高壓），完整版指引並引述大型世代研究顯示氯乙烯勞工無肝硬化風險增加、血管肉瘤病人切片也未見肝硬化；相對地多氯聯苯的認定指引完全沒有門脈高壓的敘述。應試時記住配對：非硬化性門脈高壓＝氯乙烯（或無機砷、二氧化釷）；多氯聯苯＝氯痤瘡＋肝功能異常。","review":{"key_points":["氯乙烯的肝損傷從==肝竇周圍纖維化==開始，可在肝硬化前就出現脾腫大與門脈高壓（==Banti 氏症候群==）","大型世代研究未見氯乙烯增加肝硬化風險；血管肉瘤病人切片也未顯示肝硬化","追蹤重點是==腹部超音波==（門靜脈擴大、脾腫大、肝纖維化），肝功能指數常正常","同組物質：==無機砷、二氧化釷==也造成非硬化性門脈高壓"],"refs":[{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"此症候群即不明原因的門脈高壓，意指在肝臟纖維化尚不明顯時就已經伴隨脾臟腫大及門脈高壓"},{"src":"2職業性氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/2職業性氯乙烯中毒認定參考指引.txt","quote":"暴露初期可能只有perisinusoidal與perivascularfibrosis"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"研究報告中指出氯乙烯致肝血管瘤病人肝組織切片也未顯示肝硬化"}],"note_ref":"五、氯乙烯：肝毒性與致癌性"}},{"qid":"c11q28","q":"下列何者為職業性氣喘之典型致病物？","options":["二異氰酸甲苯（TDI）","二甲基甲醯胺（DMF）","四氯化碳","正己烷"],"answer":0,"recon":"full","src":["113-6","113-11"],"optexp":["**符合／正確（本題答案）**：二異氰酸甲苯（TDI）是低分子量致敏物的代表，能直接刺激黏膜皮膚與呼吸道並作為致敏原引起氣喘與氣道過度反應；異氰酸酯類佔所有職業性氣喘的四成以上，居致病物之首。","**不符合／錯誤**：DMF 的標的是肝臟（中毒性肝炎、飲酒後臉部潮紅），法定項目是 ALT 與 γ-GT，不是呼吸道致敏物。","**不符合／錯誤**：四氯化碳的標的是肝與腎（小葉中心壞死、急性腎小管壞死），法定項目為尿蛋白尿潛血與肝功能，不造成職業性氣喘。","**不符合／錯誤**：正己烷造成遠端感覺運動多發性神經病變，法定項目只有神經與皮膚檢查（新法加尿中 2,5-己二酮），與氣喘無關。"],"explanation":"本題考職業性氣喘的致病物分類。低分子量（\u003c1000 Da，多為半抗原，需與蛋白質結合後致敏）：異氰酸酯類（TDI、MDI、HDI、IPDI）、酸酐類、鉑鹽、鎳與鉻、環氧樹脂硬化劑、甲醛、glutaraldehyde、松香（軟焊）、木粉（西部紅雪松）、藥品（青黴素）、persulfate（美髮漂劑）。高分子量（蛋白質，IgE 媒介明確）：麵粉與穀類（烘焙師氣喘）、天然乳膠、動物皮屑與尿蛋白（實驗動物工作者）、酵素（洗衣粉蛋白酶）、海鮮與蝦蟹。臨床診斷流程：確認氣喘（可逆性阻塞或支氣管過度反應）→ 建立與工作的時序關係（工作日惡化、假日改善，記錄工作與非工作日的尖峰呼氣流速至少 2 週）→ 特異性 IgE／皮膚試驗 → 必要時特異性支氣管激發試驗（診斷黃金標準）。反應型態可為立即性、遲發性或雙重性，遲發性常在下班後或夜間發作，容易被誤認為與工作無關；一旦致敏，即使離開工作場所仍可能持續數年。","dispute":"","review":{"key_points":["低分子量致敏物：==異氰酸酯、酸酐、鉑鹽、鎳、鉻、環氧樹脂硬化劑、甲醛、松香、木粉==","高分子量致敏物：==麵粉、乳膠、動物蛋白、酵素、海鮮==","異氰酸酯氣喘可為==立即性、遲發性或雙重反應==；遲發型常夜間發作，易誤判與工作無關","診斷順位：工作相關病史＋尖峰呼氣流速記錄→特異性 IgE→==特異性支氣管激發試驗（黃金標準）=="],"refs":[{"src":"異氰酸酯類引起職業性氣喘認定參考指引-2015修","file":"_ref/認定指引/all/異氰酸酯類引起職業性氣喘認定參考指引-2015修.txt","quote":"異氰酸酯類能直接刺激黏膜、皮膚及呼吸道，且為一種致敏感物"},{"src":"異氰酸酯類引起職業性氣喘認定參考指引-2015修","file":"_ref/認定指引/all/異氰酸酯類引起職業性氣喘認定參考指引-2015修.txt","quote":"Isocyanates所引發的氣喘可為立即性，遲發性或雙重反應"},{"src":"異氰酸酯類引起職業性氣喘認定參考指引-2015修","file":"_ref/認定指引/all/異氰酸酯類引起職業性氣喘認定參考指引-2015修.txt","quote":"Isocyanates所引發的氣喘占所有職業性氣喘的46.6%，為第一位"}],"note_ref":"六、合成皮與 PU 製程：DMF、DMAC 與異氰酸酯"}},{"qid":"c11q29","q":"下列何種化學物質引起中毒時，特殊健康檢查應注意勞工體重變化並有較高的皮膚癌風險，且其相關認定指引提到與巴金森氏病有關？","options":["巴拉刈","苯","二硫化碳","甲醛"],"answer":0,"recon":"rebuilt","src":["補充"],"optexp":["**符合／正確（本題答案）**：巴拉刈同時符合三個條件——法定特殊健檢以皮膚角化、黑斑及疑似皮膚癌病變為重點，分級指引寫慢性暴露可能引起皮膚癌，且明載「另有研究顯示和巴金森氏病有關」；急性中毒時亦見體重下降與全身衰竭。","**不符合／錯誤**：苯的健檢重點是血液系統與血液學檢查，慢性危害是骨髓抑制與白血病，與皮膚癌、巴金森氏病都無關。","**不符合／錯誤**：二硫化碳確實會造成類巴金森氏症，但那是它本身的神經毒性表現，不是「研究顯示與巴金森氏病有關」的流行病學關聯；且二硫化碳的健檢重點是心電圖、尿蛋白與肝功能，沒有皮膚癌風險。","**不符合／錯誤**：甲醛的健檢重點是呼吸系統與皮膚黏膜、肺功能與血液學檢查，致癌性為鼻咽癌與骨髓性白血病，不是皮膚癌，也與巴金森氏病無關。"],"explanation":"本題是整合題，考「皮膚癌＋巴金森氏病關聯」這組只屬於巴拉刈的敘述。分級指引聯吡啶或巴拉刈作業慢性危害欄只有一句話：「可能引起皮膚癌，另有研究顯示和巴金森氏病有關」，這句話就是本題的出處。要與容易混淆的三者分清楚：二硫化碳與錳造成的是中毒本身的類巴金森症候群（錐體外症候群），一氧化碳造成的是遲發性錐體外神經病變，這三者是「中毒直接導致」；巴拉刈則是流行病學上與巴金森氏病發生率相關的農藥（同類還有 rotenone）。皮膚方面，會造成職業性皮膚癌的是砷（Bowen 氏病與鱗狀細胞癌）、煤焦油瀝青與多環芳香烴、游離輻射與日曬，巴拉刈則列在分級指引的慢性危害。法定項目只有三條，配工考量疾病也只列皮膚疾病（接觸性皮膚炎、皮膚角化、黑斑或疑似皮膚癌病變）。","dispute":"","review":{"key_points":["巴拉刈慢性危害＝==可能引起皮膚癌，另有研究顯示和巴金森氏病有關==（分級指引原文）","類巴金森是==中毒直接造成==的有：錳、二硫化碳、一氧化碳（遲發性）；巴拉刈是==流行病學關聯==","職業性皮膚癌：==砷（Bowen 氏病）、煤焦油瀝青與多環芳香烴、游離輻射==","巴拉刈附表十二考量疾病只有皮膚疾病（接觸性皮膚炎、角化、黑斑、疑似皮膚癌）"],"refs":[{"src":"21_聯吡啶或巴拉刈作業管理分級參考","file":"_ref/分級指引/21_聯吡啶或巴拉刈作業管理分級參考.txt","quote":"可能引起皮膚癌，另有研究顯示和巴金森氏病有關"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"皮膚疾病如：接觸性皮膚炎、皮膚角化、黑斑或疑"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"皮膚角化、黑斑及疑似皮膚癌症"}],"note_ref":"十、農藥：有機磷與巴拉刈"}}]},{"idx":11,"order":11,"title":"職業性肝毒性","group":"器官系統毒理","gi":4,"notes_md":"本章 11 題，考的是肝毒性的「架構題」：兩大致病機轉、病程三分法、暴露途徑、ALT 與 ALP 的判定門檻、以及哪些作業把肝病列為配工考量。個別物質的肝毒性見第 11 章。\n\n## 一、肝毒性的兩大致病機轉\n| | 內因性（intrinsic） | 特異體質型（idiosyncratic） |\n|---|---|---|\n| 發生率 | 較常見 | 少見 |\n| 潛伏期 | ==短（數分鐘至數天）== | ==長（數週至數月）== |\n| 動物再現性 | 可重現 | 低 |\n| 劑量效應 | ==有== | ==沒有== |\n| 機轉 | 直接毒性或代謝活化 | 過敏，或代謝異常體質 |\n| 代表 | 四氯化碳、氯仿、黃磷、三硝基甲苯 | halothane、isoniazid、phenytoin |\n- 內因性再分兩型：**直接型**——細胞內漿膜、內質網、粒線體、細胞核、溶小體全體受損，暴露後數分鐘至數小時即帶狀壞死或脂化；**間接型**——經生物轉化或競爭性阻斷代謝路徑產生毒性代謝物，潛伏期數小時至數天，再分肝細胞毒性與膽汁鬱積性。\n- **病變位置**：需 CYP450 活化者（四氯化碳、氯仿、三氯乙烯、對乙醯胺酚）病變在==小葉中心（zone 3）==，因該區 CYP450 最多、含氧最低；不需 CYP450 活化的毒物（黃磷、鐵）則傷==門脈周邊（zone 1）==。考題常把這兩者的理由對調。\n- 細胞層次標的：==粒線體、內質網、CYP450==（回憶版兩種問法的固定答案）；重金屬另以結合硫氫基使酵素失活為主。「只作用於細胞核 DNA」是錯誤敘述。\n\n## 二、病程分類與臨床表現\n- **急性**：暴露後 24–48 小時內，大量暴露四氯化碳、黃磷、三硝基甲苯，可為大片壞死或脂化。\n- **亞急性**：反覆或大量暴露後==二至三星期==發生，症狀漸進、數星期至數月後才出現黃疸，伴==噁心、嘔吐、疲倦、頭暈、心律不整==；代表為三硝基甲苯、四氯乙烷、DMF 的工廠群聚事件。\n- **慢性**：肝硬化（三硝基甲苯、多氯聯苯、四氯乙烷、乙醇）、硬化樣變化（砷、氯乙烯）、肝癌（氯乙烯之肝血管肉瘤）。\n\n## 三、暴露途徑與代表物質\n- 排序：==吸入＞皮膚＞食入==；注射不是職業途徑（醫療針扎屬生物性危害，傳染 B、C 型肝炎）。\n- 容許暴露標準附表一標「==皮==」者可經皮吸收：DMF、二硫化碳、正己烷、溴丙烷、甲苯。\n- 職業性肝毒物清單：鹵化烴（四氯化碳、氯仿、四氯乙烷、三氯乙烯、四氯乙烯）、==DMF==與 DMAC、氯乙烯、三硝基甲苯、黃磷、多氯聯苯、砷。\n\n## 四、職業性肝病的原因與判讀\n- **造成最多職業性肝傷害的是有機溶劑**（使用普遍、揮發性高、多經 CYP450 活化）。\n- 但勞工肝功能異常最常見的原因是**非職業性**的：==B、C 型肝炎、脂肪肝與肥胖、飲酒、藥物==——分級指引各章第二級管理都寫「肝功能異常可由 B、C 肝炎、脂肪肝、肥胖、高血脂、喝酒等工作以外的原因解釋」。\n- 「長期以酒精擦拭物體」不是職業性肝病的原因：飲酒是要排除的個人因素，不是職業暴露。\n- 屬職業病的病毒性肝炎只有醫療人員針扎（另有專屬認定指引）。\n- 肝功能異常複檢的正確處置：詢問 B、C 肝病史與飲酒藥物、調查特別危害物質暴露、安排腹部超音波；==不可直接令其停工==。\n\n## 五、肝功能判讀與分級\n- 肝傷害型態與門檻（認定指引）：\n  - 肝細胞損傷型：舊版 1 ==ALT >2 倍==、舊版 2 ==ALT >3 倍==、新版（國際藥物性肝傷害共識）==ALT >5 倍==正常值上限。\n  - 膽汁鬱積型：==ALP >2 倍==正常值上限（三代標準一致，寫 3 倍即錯），最好搭配 γ-GT 上升判讀，因單獨 ALP 升高可能來自骨骼。\n  - 一般肝傷害定義：ALT >3 倍、ALP >2 倍或總膽紅素 >2 倍，再加臨床表現。\n  - R 值（ALT/ALP）：R ≥5 肝細胞型、R ≤2 膽汁鬱積型、中間為混合型。\n- 職業性肝病臨床表現與病毒性肝炎相似，沒有特異性，靠職業暴露史、時序性與排除診斷。\n- **要驗 ALT 的作業**：四氯乙烷、四氯化碳、二硫化碳、三氯乙烯與四氯乙烯、DMF、氯乙烯、砷、黃磷、溴丙烷、游離輻射（115 年新法另新增苯乙烯、甲苯、二甲苯作業）。\n- **不驗 ALT 的作業**：==正己烷==（考試當時連抽血都沒有，只做病史與神經皮膚檢查）、噪音、高溫、異常氣壓、粉塵、石綿、錳、鉛、鎘、鎳、汞、苯（只有血液學）、TDI（肺功能）。\n\n## 六、肝病與配工\n- 附表十二把==肝病==列為考量疾病的作業：鉛、四烷基鉛、四氯乙烷、三氯乙烯與四氯乙烯、DMF、氯乙烯、鈹、==苯及苯之衍生物==、二硫化碳、脂肪族鹵化碳氫化合物、刺激性氣體、砷、錳、黃磷、有機磷、醇及酮、汞、重體力勞動。\n- 不含肝病的干擾選項：硫化氫（角膜或結膜炎、精神或中樞神經系統疾病、嗅覺障礙）、鎳（呼吸系統疾病、皮膚炎）、噪音（心血管疾病、聽力異常）、粉塵與石綿（心血管、COPD、慢性氣管炎、氣喘）、鉻酸（呼吸系統、接觸性皮膚疾病）。\n- 物質與皮膚病灶配對（常與肝毒性題混考）：==氯痤瘡＝多氯聯苯、戴奧辛==；==油性痤瘡＝礦物油、切削油==；砷→Bowen 氏病；鉻酸→皮膚潰瘍與鼻中膈穿孔；對苯二胺→接觸性皮膚炎。","questions":[{"qid":"c12q01","q":"有關肝臟特異體質型毒性（idiosyncratic hepatotoxicity）之性質，下列何者為非？","options":["典型代表為 halothane（氟烷）","通常與過敏（免疫）機轉或代謝異常有關","具有明顯的劑量–效應關係","發生率低且難以預測"],"answer":2,"recon":"full","src":["113-2","113-4","113-11"],"optexp":["**正確（非答案）**：halothane（氟烷）是特異體質型肝毒性的教科書代表，反覆麻醉後可引起猛爆性肝炎；isoniazid、phenytoin、methyldopa 亦屬此型。","**正確（非答案）**：認定指引寫特異體質型「機轉有二，一是過敏引起者，一是代謝異常體質引起的」；過敏型常伴發燒、皮疹、嗜伊紅血球增多，代謝異常型與個體酵素多型性有關。","**錯誤（本題答案）**：特異體質型「在動物實驗的再現性低，沒有劑量效應關係」；有明顯劑量–效應關係的是內因性（intrinsic）肝毒性，兩者剛好相反。","**正確（非答案）**：特異體質型較內因性者少見、不可預期，從暴露到發病時間較長（數週至數月），同一毒物可引起多種不同的組織變化。"],"explanation":"本題考肝毒性物質的兩大致病機轉分類，對照表要背熟。內因性（intrinsic）：發生率較高、潛伏期短（數分鐘至數天）、動物實驗可重現、有劑量效應，代表物為四氯化碳、氯仿、黃磷、三硝基甲苯；內因性又分直接型（漿膜、內質網、粒線體、細胞核、溶小體全面受損，暴露後數分鐘至數小時即帶狀壞死或脂化）與間接型（經生物轉化產生毒性代謝物或阻斷代謝路徑，潛伏期數小時至數天，再分肝細胞毒性與膽汁鬱積性）。特異體質型（idiosyncratic）：少見、不可預期、動物再現性低、沒有劑量效應、潛伏期數週至數月、組織變化多端，機轉為過敏或代謝異常體質，代表物以藥物為主（halothane、isoniazid、phenytoin）。考題常以「何者為非」問特異體質型的性質，固定的錯誤敘述就是「有劑量–效果關係」。","dispute":"","review":{"key_points":["特異體質型：少見、不可預期、動物再現性低、==沒有劑量效應==、潛伏期數週至數月、過敏或代謝異常體質","內因性：常見、潛伏期短（數分鐘至數天）、動物可重現、==有劑量效應==","特異體質型代表＝halothane；內因性代表＝四氯化碳、氯仿、黃磷"],"refs":[{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"特異體質型的肝毒性較內因性者少見，屬於不可預期"},{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"在動物實驗的再現性低，沒有劑量效應關係"},{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"機轉有二，一是過敏引起者，一是代謝異常體質引起的"}],"note_ref":"一、肝毒性的兩大致病機轉"}},{"qid":"c12q02","q":"有關內因性（intrinsic）肝細胞毒性之敘述，下列何者錯誤？","options":["毒性與劑量相關，潛伏期通常較短","有些物質直接造成肝傷害，有些在肝內轉換成具肝毒性之代謝物","產生之肝損傷型態包括小葉中心壞死、脂肪肝及肝細胞壞死","肝損傷以門脈周邊（zone 1）為主，因該區含最多 CYP450"],"answer":3,"recon":"partial","src":["115-01"],"optexp":["**正確**：認定指引寫內因性肝傷害「潛伏期短(數分鐘至數天)，可重覆地在動物上表現其肝毒性且有劑量效應」，敘述無誤。","**正確**：內因性分直接型（自身即具肝細胞毒性）與間接型（「經生物轉化或競爭性地阻斷代謝路徑，產生有毒性的代謝產物」），敘述無誤。","**正確**：直接肝毒性造成肝細胞帶狀壞死或脂化，臨床可見 ALT、AST 上升；四氯化碳的動物與人體病理即為小葉中心壞死伴脂肪浸潤，敘述無誤。","**錯誤（本題答案）**：需經 CYP450 活化的肝毒物（四氯化碳、氯仿、三氯乙烯），病變以小葉中心（zone 3，中央靜脈周圍）為主，因為 zone 3 的 CYP450 含量最高、含氧量最低；門脈周邊（zone 1）壞死見於黃磷、鐵等不需 CYP450 活化的毒物，與本選項的理由剛好相反。"],"explanation":"本題考內因性肝毒性的病理位置與理由。肝小葉分三帶：zone 1（門脈周邊，含氧與養分最高、氧化代謝與糖質新生為主）、zone 3（中央靜脈周圍，含氧最低，CYP450 與混合功能氧化酶含量最高）。需要經 CYP450 代謝活化才產生自由基的毒物（四氯化碳→三氯甲基自由基、氯仿、三氯乙烯、對乙醯胺酚）在 zone 3 產生最多毒性代謝物，加上該處缺氧，故典型病變是小葉中心壞死伴脂肪變性；不需經 CYP450 活化的物質（黃磷、鐵、無機砷）則先傷到最早接觸的 zone 1（門脈周邊）。指引也寫直接肝毒性「細胞內的各種細微組織如漿膜、內質網、粒線體、細胞核、溶小體等全體都可受到損傷」，暴露後數分鐘至數小時即造成肝細胞帶狀壞死或脂化。115-01 回憶版此題選項含「尤其是門脈周邊損傷」，考的就是這個位置與理由的配對。","dispute":"115-01 回憶版只記得四個選項的大意（內因性與劑量相關潛伏期短／有些直接造成肝傷害／有些在肝內轉換成肝毒性代謝物／損傷型態含小葉中心壞死、脂肪肝及肝細胞壞死，尤其是門脈周邊損傷），未載明答案。依病理學與指引，經 CYP450 活化者以小葉中心（zone 3）為主，本題以「門脈周邊為主、因該區 CYP450 最多」為錯誤選項重建；應試時記住「CYP450 多→zone 3→小葉中心壞死」。","review":{"key_points":["zone 3（小葉中心、中央靜脈周圍）==CYP450 最多、含氧最低==→四氯化碳、氯仿、對乙醯胺酚的壞死位置","zone 1（門脈周邊）＝不需活化的直接毒物（黃磷、鐵）","內因性：潛伏期數分鐘至數天、動物可重現、有劑量效應；分直接型與間接型（代謝活化）"],"refs":[{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"內因性肝傷害的發生較常見，潛伏期短"},{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"間接肝毒性是化學物質經生物轉化或競爭性地阻斷代謝路徑"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"肝組織學檢查顯示小葉中心壞死伴脂肪浸潤"}],"note_ref":"一、肝毒性的兩大致病機轉"}},{"qid":"c12q03","q":"有關亞急性職業性肝傷害之敘述，下列何者正確？","options":["通常在暴露大量肝毒性物質後發生","通常於暴露後二至三星期發生","症狀緩慢出現，數星期至數月後出現黃疸，可有噁心、嘔吐、疲倦、頭暈、心律不整等","以上皆是"],"answer":3,"recon":"full","src":["113-6","113-9","113-11"],"optexp":["**正確（敘述正確，屬正解之一部）**：亞急性肝傷害常發生在反覆或大量暴露肝毒性物質之後，典型情境是工廠群聚事件（三硝基甲苯、四氯乙烷、二甲基甲醯胺）。","**正確（敘述正確，屬正解之一部）**：與急性型在 24–48 小時內發作不同，亞急性型多在暴露後二至三星期出現。","**正確（敘述正確，屬正解之一部）**：症狀緩慢出現，數星期至數月後才現黃疸，期間可有噁心、嘔吐、疲倦、頭暈，嚴重者心律不整；113-11 的重點整理即列此組症狀。","**正確（本題答案）**：三個敘述都對，故選以上皆是；113-6 回憶版此題答案亦為「以上皆是」。"],"explanation":"本題考職業性肝傷害依病程的三分法。急性：暴露後 24–48 小時內發作，如四氯化碳、黃磷、三硝基甲苯大量暴露，可為大片壞死或脂化。亞急性：反覆或大量暴露後數週發生，症狀漸進、數星期至數月後出現黃疸，伴噁心嘔吐、疲倦、頭暈、心律不整；認定指引的肝傷害型態表把三硝基甲苯列為亞急性的代表。慢性：長期低劑量暴露造成肝硬化（三硝基甲苯、多氯聯苯、四氯乙烷、乙醇）、肝硬化樣硬化（砷、氯乙烯）與肝癌（氯乙烯之肝血管肉瘤）。考題三種問法都出現過：問亞急性的定義（答以上皆是）、問亞急性的臨床表現（噁心、嘔吐、疲倦、頭暈、心律不整）、問「關於亞急性肝疾病何者錯誤」。","dispute":"","review":{"key_points":["急性 24–48 小時／亞急性==二至三星期、黃疸在數星期至數月後==／慢性長期","亞急性症狀：噁心、嘔吐、疲倦、頭暈、心律不整，黃疸較晚","慢性肝硬化代表：三硝基甲苯、多氯聯苯、四氯乙烷、乙醇；硬化：砷、氯乙烯"],"refs":[{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"三硝基甲苯、多氯聯苯、四氯乙烷、乙醇"}],"note_ref":"二、病程分類與臨床表現"}},{"qid":"c12q04","q":"職業性肝毒性物質進入人體最主要的途徑為何？","options":["皮膚吸收","食入","吸入","注射"],"answer":2,"recon":"full","src":["113-10","113-11","114-01","114-03","114-04"],"optexp":["**不符合／錯誤**：皮膚吸收是重要的次要途徑（二甲基甲醯胺、二硫化碳、四氯化碳、正己烷在容許暴露標準附表一均標示「皮」），但不是最主要。","**不符合／錯誤**：食入多見於誤服或意外事故，職場上不是主要途徑。","**符合／正確（本題答案）**：職場肝毒物以揮發性有機溶劑為大宗，經呼吸道吸入後由肺泡大量吸收、直接進入體循環，是最主要的進入途徑。","**不符合／錯誤**：注射不是職業暴露途徑（醫療針扎屬生物性危害，傳染 B、C 型肝炎，與化學性肝毒物無關）。"],"explanation":"本題考肝毒性物質的暴露途徑排序：吸入 > 皮膚 > 食入。職業性肝病的主角是揮發性有機溶劑（四氯化碳、氯仿、三氯乙烯、四氯乙烯、二甲基甲醯胺、氯乙烯），蒸氣壓高、在作業環境中以氣態存在，經肺泡吸收後直接進入血流，所以吸入是最主要也是最快的途徑。皮膚吸收不可忽略：容許暴露標準附表一在物質後面標示「皮」者即表示可經皮膚吸收，二甲基甲醯胺、二硫化碳、正己烷、溴丙烷、甲苯都有此標示，赤手擦拭、浸泡零件時吸收量可觀。114-03 回憶版此題的討論也是「應該還是吸入大於皮膚」。同一組觀念也用在毒物學通則題：「毒素最快最嚴重進入人體的方式」答吸入。","dispute":"","review":{"key_points":["肝毒物途徑排序：==吸入 > 皮膚 > 食入==；注射不是職業途徑","容許暴露標準附表一標「==皮==」者可經皮吸收：DMF、二硫化碳、正己烷、溴丙烷、甲苯","同一觀念：毒物最快最嚴重的進入方式＝吸入"],"refs":[],"note_ref":"三、暴露途徑與代表物質"}},{"qid":"c12q05","q":"有關職業性肝臟疾病之敘述，下列何者錯誤？","options":["大量氯乙烯單體暴露會引發肝血管肉瘤","長期以酒精擦拭物體是職業性肝病的重要原因","有二萬多種化學物質可能引起肝臟疾病，以有機溶劑為大宗","台灣職業性肝病之原因包含四氯化碳、氯仿、二甲基甲醯胺"],"answer":1,"recon":"full","src":["115-02","114-01"],"optexp":["**正確**：氯乙烯單體是肝血管肉瘤（angiosarcoma）的確定致癌物，也造成肝纖維化、非硬化性門脈高壓與肝細胞癌，IARC Group 1。","**錯誤（本題答案）**：以酒精擦拭物體所產生的乙醇蒸氣暴露量極低，遠不足以造成肝病；職業性肝病的酒精因素指的是個人飲酒習慣（判讀肝功能異常時要排除的干擾因子），不是工作中接觸乙醇。115-02 回憶版亦註「未查詢到揮發性酒精造成職業傷害的相關資料」。","**正確**：文獻上可能引起肝臟疾病的化學物質達二萬多種，職場上以有機溶劑為大宗。","**正確**：台灣職業性肝病的代表物質包括四氯化碳、氯仿、二甲基甲醯胺（合成皮業群聚事件）、三氯乙烯、氯乙烯。"],"explanation":"本題考職業性肝病的常見原因與干擾因子。真正的職業性肝毒物：鹵化烴類（四氯化碳、氯仿、四氯乙烷、三氯乙烯、四氯乙烯）、二甲基甲醯胺與二甲基乙醯胺（合成皮、電子業）、氯乙烯、三硝基甲苯、黃磷、多氯聯苯、砷。判讀勞工肝功能異常時，最常見的原因其實是非職業性的：B、C 型肝炎帶原、脂肪肝與肥胖、飲酒、藥物與保健食品，所以分級指引各章的第二級管理都寫「肝功能異常可由 B、C 型肝炎、脂肪肝、肥胖、高血脂、喝酒等工作以外的原因解釋」。把「酒精」與「職業暴露」混為一談是本題的陷阱：飲酒是要排除的個人因素，不是職業暴露來源。114-04 的相關新題則考肝功能異常複檢的處置：應詢問 B、C 肝病史、調查特別危害物質暴露、安排腹部超音波，不可直接令其停工。","dispute":"","review":{"key_points":["職業性肝毒物：鹵化烴（CCl4、氯仿、四氯乙烷、三氯乙烯）、==DMF==、氯乙烯、三硝基甲苯、黃磷、PCB、砷","肝功能異常先排除非職業因素：==B/C 肝、脂肪肝、肥胖、高血脂、飲酒、藥物==","肝功能異常複檢：問肝炎病史、查危害物暴露、排腹部超音波；==不可直接令其停工=="],"refs":[{"src":"15_氯乙烯作業管理分級參考","file":"_ref/分級指引/15_氯乙烯作業管理分級參考.txt","quote":"常可由B、C肝炎、脂肪肝、肥胖、高血脂、喝酒"}],"note_ref":"四、職業性肝病的原因與判讀"}},{"qid":"c12q06","q":"下列何者造成最多的職業性肝臟傷害？","options":["重金屬","有機溶劑","病毒感染","游離輻射"],"answer":1,"recon":"partial","src":["114-01"],"optexp":["**不符合／錯誤**：重金屬中砷可致肝硬化樣病變與肝血管肉瘤，但職業暴露人數與致病比例遠低於有機溶劑。","**符合／正確（本題答案）**：職場上可能引起肝臟疾病的化學物質雖多，但以有機溶劑（鹵化烴、二甲基甲醯胺、氯乙烯等）為大宗，是造成最多職業性肝傷害者。","**不符合／錯誤**：病毒性肝炎在台灣盛行率高，是勞工肝功能異常最常見的「原因」，但屬於個人疾病；只有醫療照護人員的針扎感染才算職業病，總數遠少於溶劑暴露。","**不符合／錯誤**：游離輻射的主要健康危害是造血系統、甲狀腺與癌症；雖然法定檢查含 ALT，但不是職業性肝病的主要來源。"],"explanation":"本題與上一題是同一組概念的兩種問法。職業性肝病的來源以有機溶劑為大宗，理由是：溶劑在職場使用普遍、揮發性高易吸入、多數經肝臟 CYP450 代謝活化。要分清三個層次：造成職業性肝病最多的暴露＝有機溶劑；造成勞工肝功能異常最多的原因（含非職業）＝B、C 型肝炎與脂肪肝、飲酒；屬於職業病的病毒性肝炎＝醫療人員針扎（職安署另有職業因素感染 B 型或 C 型肝炎的認定指引）。114-01 為新題，回憶者選有機溶劑。","dispute":"本題為 114-01 新題，回憶者自填答案為有機溶劑，無官方解答。依認定指引「能造成肝損傷的因素眾多」與職場暴露實況（溶劑使用最普遍、揮發性高），有機溶劑為最合理答案；若題目問的是「勞工肝功能異常最常見的原因」（含非職業因素），答案則是病毒性肝炎與脂肪肝，兩種問法要分清楚。","review":{"key_points":["造成最多職業性肝傷害＝==有機溶劑==（鹵化烴、DMF、氯乙烯）","勞工肝功能異常最常見原因（含非職業）＝B/C 肝、脂肪肝、飲酒","病毒性肝炎屬職業病者：醫療人員針扎（另有專屬認定指引）"],"refs":[],"note_ref":"四、職業性肝病的原因與判讀"}},{"qid":"c12q07","q":"有關職業性肝病之診斷與檢查，下列敘述何者不正確？","options":["ALT 上升達正常上限 5 倍以上為顯著肝細胞損傷之參考標準","ALP 上升達正常上限 3 倍以上為膽汁鬱滯型肝損傷之參考標準","臨床表現大多與病毒性肝炎相似，須靠職業暴露史與排除診斷","肝功能異常時應詢問 B、C 型肝炎、飲酒、藥物與特別危害物質暴露史，並安排腹部超音波"],"answer":1,"recon":"partial","src":["114-05","114-04"],"optexp":["**正確**：國際上對藥物／毒物性肝傷害的共識為血清 ALT 超過正常值上限 5 倍（或 ALP 超過 2 倍），此定義可排除脂肪肝等干擾因子，準確性較好。","**錯誤（本題答案）**：膽汁鬱積型的基本定義是鹼性磷酸酶（ALP）大於正常值上限「2 倍」，不是 3 倍；且最好搭配 γ-GT 上升一起判讀，因為單獨 ALP 升高可能來自骨骼系統。","**正確**：職業性肝病的臨床表現大多與病毒性肝炎相似（食慾不振、噁心、疲倦、黃疸），沒有特異性，必須靠職業暴露史、時序性與排除其他原因來診斷。","**正確**：肝功能異常的複檢應詢問 B、C 型肝炎病史與飲酒、藥物，調查特別危害物質暴露，並安排腹部超音波；114-04 版本以「直接停工」為錯誤處置。"],"explanation":"本題考職業性肝病的實驗室判定門檻。認定指引列出三代標準：舊版 1 為 ALT >2 倍正常值上限、舊版 2 為 ALT >3 倍、新版為 ALT >5 倍（三者的膽汁鬱積型定義都是 ALP >2 倍正常值上限）；一般性的肝傷害定義則是 ALT >3 倍、ALP >2 倍或總膽紅素 >2 倍加上臨床表現。實務上台灣的職業性毒性肝炎分類仍多採 ALT >2 倍為判定基準，文獻則在 2 倍與 3 倍之間。要記住的固定數字是「ALP 2 倍」——不論哪一版標準，膽汁鬱積型都是 2 倍，所以選項寫 3 倍即為錯誤。另需搭配 R 值（ALT/ALP 比值）分型：R ≥5 為肝細胞型、R ≤2 為膽汁鬱積型、介於中間為混合型。","dispute":"114-05 回憶版此題選項為「A ALT 大於 5 倍、B ALP 大於 3 倍、C 大多與病毒性肝炎症狀相似」，回憶者標 B 但不確定。核對指引原文：膽汁鬱積型定義為 ALP >2 倍正常值上限（三代標準一致），故 B「3 倍」確為錯誤敘述；A 的 ALT >5 倍與國際藥物性肝傷害共識相符。應試時記「ALT 2／3／5 倍三代標準，ALP 固定 2 倍」。","review":{"key_points":["膽汁鬱積型＝==ALP >2 倍==正常值上限（三代標準都一樣），最好搭配 γ-GT","肝細胞型：舊版 ALT >2 倍或 >3 倍、新版（藥物性肝傷害共識）==ALT >5 倍==","R 值＝ALT/ALP：R ≥5 肝細胞型、R ≤2 膽汁鬱積型、中間為混合型","職業性肝病無特異表現，靠暴露史＋時序性＋排除診斷"],"refs":[{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"膽汁鬱積型的基本定義則是鹼性磷酸酶"},{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"對藥物性肝傷害之共識為血清ALT超過正常值上限5倍或ALP超過正常值上限2倍"},{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"肝傷害之定義為血清ALT超過正常值上限3倍、ALP超過正常值上限2倍"}],"note_ref":"五、肝功能判讀與分級"}},{"qid":"c12q08","q":"新進勞工體格檢查發現肝功能異常（肝臟疾病），依附表十二選配工時宜考量疾病之建議，最不適合從事下列何種作業？","options":["苯及其衍生物之作業","硫化氫作業","鎳及其化合物作業","噪音作業"],"answer":0,"recon":"full","src":["113-10","113-11","113-12","114-03","114-04","114-05"],"optexp":["**符合／正確（本題答案）**：附表十二「苯及苯之衍生物之作業」考量疾病為血液疾病、肝病、神經系統疾病、接觸性皮膚疾病，肝病名列其中；分級指引苯作業章亦同。","**不符合／錯誤**：附表十二硫化氫之作業考量的是角膜或結膜炎、精神或中樞神經系統疾病、嗅覺障礙，不含肝病。","**不符合／錯誤**：鎳及其化合物之作業考量呼吸系統疾病與皮膚炎，不含肝病。","**不符合／錯誤**：噪音作業考量心血管疾病與聽力異常，與肝臟無關。"],"explanation":"本題考附表十二「選配工時宜考量疾病之建議表」中，哪些作業把「肝病」列為考量疾病。列有肝病者：鉛、四烷基鉛、四氯乙烷、三氯乙烯與四氯乙烯、二甲基甲醯胺、氯乙烯、鈹、苯及苯之衍生物、二硫化碳、脂肪族鹵化碳氫化合物、氯氣與氟化氫等刺激性氣體、砷、錳、黃磷、有機磷、非有機磷農藥、醇及酮、苯之硝基醯胺、汞及其無機化合物與有機汞、重體力勞動。不含肝病者是本題的干擾選項：硫化氫（角膜結膜炎、中樞神經、嗅覺障礙）、鎳（呼吸系統、皮膚炎）、噪音（心血管、聽力）、粉塵與石綿（心血管、慢性阻塞性肺疾病、慢性氣管炎、氣喘）、鉻酸（呼吸系統、接觸性皮膚疾病）。回憶版四個版本的選項組合略有不同（含鉻酸、硫化氫、鎳），答案都是苯。","dispute":"","review":{"key_points":["==苯及苯之衍生物==考量疾病：血液疾病、肝病、神經系統疾病、接觸性皮膚疾病","硫化氫：角膜或結膜炎、精神或中樞神經系統疾病、嗅覺障礙（無肝病）","鎳：呼吸系統疾病、皮膚炎；噪音：心血管疾病、聽力異常","列有肝病的作業還有：鉛、四烷基鉛、四氯乙烷、三氯／四氯乙烯、DMF、氯乙烯、鈹、二硫化碳、砷、錳、黃磷、汞"],"refs":[{"src":"16_苯作業管理分級參考","file":"_ref/分級指引/16_苯作業管理分級參考.txt","quote":"考量不適合從事作業之疾病，如血液疾病、肝病、神經系統疾病、"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"鎳及其化合物之作業 呼吸系統疾病、皮膚炎"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"噪音作業 心血管疾病、聽力異常"}],"note_ref":"六、肝病與配工"}},{"qid":"c12q09","q":"下列何種特別危害健康作業之特殊健康檢查「不需」檢驗血清丙胺酸轉胺酶（ALT）？","options":["正己烷作業","三氯乙烯作業","苯作業","游離輻射作業"],"answer":0,"recon":"partial","src":["113-3","113-4","113-10","114-03","115-02"],"optexp":["**符合／正確（本題答案）**：附表十正己烷作業只有三項——作業經歷與自覺症狀調查、皮膚呼吸器官肝臟腎臟及神經系統疾病既往病史調查、神經及皮膚之身體檢查，沒有任何抽血項目（115 年修正後才在健康檢查加列尿中游離型 2,5-己二酮）。114-03 回憶版註明「僅需 Hx taking、NE、PE 而已」。","**不符合／錯誤**：三氯乙烯、四氯乙烯作業法定項目含 ALT 及 γ-GT（肝毒性明確），要驗。","**不符合／錯誤**：苯作業的法定項目是完整血球計數與分類，嚴格說也沒有 ALT；但回憶版的選項組合以正己烷為答案，見爭議註記。","**不符合／錯誤**：游離輻射作業的健康檢查項目含血清丙胺酸轉胺酶（ALT）及肌酸酐（現行新法另加腎絲球過濾率），要驗。"],"explanation":"本題考附表十各作業的法定檢查項目，考點是「誰不用抽血驗肝功能」。要驗 ALT（多數含 γ-GT）的：四氯乙烷、四氯化碳、二硫化碳、三氯乙烯與四氯乙烯、二甲基甲醯胺、氯乙烯、砷、黃磷、溴丙烷、游離輻射（115 年新法另新增苯乙烯、甲苯、二甲苯作業，也要驗 ALT）。不驗 ALT 的：正己烷（考試當時完全沒有實驗室項目）、噪音、高溫、異常氣壓、粉塵、石綿、錳、鉛（驗血鉛與血液學）、鎘（尿蛋白與尿鎘）、鎳與汞（腎功能與血液學）、苯（只有血液學）、TDI/MDI/IPDI（肺功能）。正己烷的毒性在周邊神經而非肝臟，所以只做病史與神經、皮膚身體檢查；其生物偵測指標尿中 2,5-己二酮是 ACGIH 的 BEI，115 年修正才入法。","dispute":"選項瑕疵：嚴格依附表十，苯作業的法定項目只有血液學檢查（紅血球數、血球比容值、血色素、MCV、MCH、MCHC、血小板數、白血球數及分類），同樣沒有 ALT，因此 A、C 兩個選項都符合題意。114-03 回憶版的原始選項為三氯乙烯、苯、游離作業，回憶者答正己烷；正己烷是考試當時唯一「連抽血都沒有」的作業，最符合出題意圖。應試時選正己烷。","review":{"key_points":["考試當時正己烷作業==沒有任何實驗室項目==：只有作業經歷、既往病史、神經及皮膚身體檢查","要驗 ALT：四氯乙烷、四氯化碳、二硫化碳、三氯／四氯乙烯、DMF、氯乙烯、砷、黃磷、溴丙烷、游離輻射（新法另加苯乙烯、甲苯、二甲苯）","苯作業只有血液學檢查，也沒有 ALT（選項瑕疵見爭議註記）","尿中 2,5-己二酮是 ACGIH BEI，115 年修正附表十才入法"],"refs":[{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"神經及皮膚之身體檢查"},{"src":"12_正己烷作業管理分級參考","file":"_ref/分級指引/12_正己烷作業管理分級參考.txt","quote":"神經及皮膚之身體檢 身 體 3. 神經及皮膚之身體檢查。"}],"note_ref":"五、肝功能判讀與分級"}},{"qid":"c12q10","q":"下列有關肝毒性物質之配對，何者錯誤？","options":["四氯乙烯：肝功能異常","二甲基甲醯胺（DMF）：中毒性肝炎","四氯化碳：小葉中心壞死","礦物油：氯痤瘡"],"answer":3,"recon":"partial","src":["114-02","114-03","114-04"],"optexp":["**正確**：四氯乙烯的法定特殊健檢含 ALT 與 γ-GT，長期過度暴露可使肝臟受損，肝功能異常是其典型表現。","**正確**：二甲基甲醯胺（DMF）是合成皮與電子業的溶劑，經皮膚與吸入吸收，造成中毒性肝炎（噁心、腹痛、飲酒後臉潮紅），是台灣職業性肝病的代表物質。","**正確**：四氯化碳經 CYP450 活化為自由基，造成小葉中心壞死伴脂肪浸潤，是內因性直接型肝毒性的教科書範例。","**錯誤（本題答案）**：氯痤瘡是多氯聯苯、戴奧辛等鹵化芳香烴中毒最明顯的症狀；礦物油與切削油造成的是油性痤瘡（oil acne）與毛囊炎，兩者要分清。"],"explanation":"本題考物質與病灶的配對，陷阱在痤瘡的兩種類型。氯痤瘡（chloracne）由多氯聯苯、多氯聯苯呋喃、戴奧辛等鹵化芳香烴引起，指引描述為「稻草色針頭或豌豆大小的皮膚囊腫，類似黑頭或白頭粉刺」，好發於眼周、耳後、腋下與生殖器周圍，是 PCB 中毒最明顯的症狀，且急性與慢性中毒都會出現。油性痤瘡（oil acne）由礦物油、切削油、瀝青等阻塞毛囊引起，好發於接觸部位（前臂、大腿）與被油污衣物摩擦處，長期還可致皮膚癌（陰囊癌是掃煙囪工人的歷史案例）。其餘配對：四氯乙烯與 DMF 是肝，四氯化碳是小葉中心壞死，砷是 Bowen 氏病，鉻酸是皮膚潰瘍與鼻中膈穿孔，對苯二胺是接觸性皮膚炎。","dispute":"","review":{"key_points":["==氯痤瘡＝多氯聯苯、戴奧辛==（鹵化芳香烴）；==油性痤瘡＝礦物油、切削油==","四氯乙烯、DMF→肝功能異常；四氯化碳→小葉中心壞死","其他配對：砷→Bowen 氏病；鉻酸→皮膚潰瘍、鼻中膈穿孔；對苯二胺→接觸性皮膚炎"],"refs":[{"src":"多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引","file":"_ref/認定指引/all/多苯基芳香族化合物及其衍生物-多氯聯苯引起之中毒及其續發症之職業病認定參考指引.txt","quote":"氯痤瘡是多氯聯苯急性中毒最明顯的症狀"}],"note_ref":"六、肝病與配工"}},{"qid":"c12q11","q":"有關重金屬與溶劑對肝臟之毒性標的，下列敘述何者錯誤？","options":["肝毒性物質可作用於粒線體","肝毒性物質可作用於內質網與細胞色素 P450 系統","多數肝毒物需先經混合功能氧化酶（MFO）活化","肝毒物只作用於細胞核 DNA"],"answer":3,"recon":"rebuilt","src":["113-6","114-03"],"optexp":["**正確**：粒線體是肝毒物的重要標的，受損後 ATP 生成障礙、β 氧化受阻而形成脂肪變性（如四氯化碳、黃磷）。","**正確**：內質網是 CYP450 所在的位置，毒物在此被活化，也在此造成脂質過氧化與蛋白質合成障礙。","**正確**：多數肝毒性物質與致癌物需先經混合功能氧化酶（MFO／CYP450）活化為反應性中間產物，才產生毒性。","**錯誤（本題答案）**：指引寫直接肝毒性時「細胞內的各種細微組織如漿膜、內質網、粒線體、細胞核、溶小體等全體都可受到損傷」，並非只作用於細胞核 DNA；DNA 加合物只是致癌機轉的一部分。"],"explanation":"本題考肝毒物的細胞層次標的。認定指引明寫直接肝毒性會使細胞內各種細微構造全面受損：漿膜（細胞膜）、內質網、粒線體、細胞核、溶小體。對應到考題常見的三個關鍵字就是「CYP450（內質網）、粒線體、內質網」，回憶版兩種問法（重金屬傷害哪裡／物質肝毒性作用在哪些結構）都是這組答案。機轉上：毒物經 MFO／CYP450 活化成自由基或親電性中間產物→與細胞膜脂質進行過氧化、與蛋白質及 DNA 形成共價鍵→鈣離子恆定失衡、粒線體功能障礙→細胞壞死或凋亡；重金屬則另以與蛋白質硫氫基（-SH）結合使酵素失活為主。把「只作用於細胞核 DNA」這種單一機轉的敘述當成錯誤選項。","dispute":"","review":{"key_points":["直接肝毒性損傷==漿膜、內質網、粒線體、細胞核、溶小體==全體，非單一構造","考題關鍵字組合：==CYP450、粒線體、內質網==","多數肝毒物與致癌物需經 ==MFO／CYP450== 活化；重金屬另以結合硫氫基使酵素失活"],"refs":[{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"細胞內的各種細微組織如漿膜、內質網、粒線體、細胞核、溶小體"},{"src":"職業暴露有機溶劑引起之急性肝傷害認定參考指引","file":"_ref/認定指引/all/職業暴露有機溶劑引起之急性肝傷害認定參考指引.txt","quote":"造成肝細胞帶狀壞死或脂化"}],"note_ref":"一、肝毒性的兩大致病機轉"}}]},{"idx":12,"order":12,"title":"職業性腎毒性","group":"器官系統毒理","gi":4,"notes_md":"本章約 9 題，考腎臟易中毒的生理原因、各金屬腎病變配對、腎功能指標選擇，以及尿鎘判讀陷阱。\n\n## 一、腎臟為何容易中毒\n- 佔體重約 ==0.5%==，卻接受約 ==20–25%（四分之一）== 心輸出量。\n- 腎小管**濃縮**、髓質**逆流交換**→毒物濃度升高；近端小管有**主動運輸**與 CYP450 **代謝活化**。\n- 陷阱：正常尿液 pH ==5–6==（弱酸性），寫「弱鹼性」即錯。\n\n## 二、腎臟各部位受傷程度與代表毒物\n| 部位 | 受傷程度 | 代表毒物 |\n|---|---|---|\n| 腎絲球（濾液未濃縮） | 相對最輕 | 汞：免疫性膜性腎絲球腎炎→腎病症候群 |\n| 近端腎小管（濃縮＋活化） | 最常受傷 | 鎘（β2 微球蛋白尿、糖尿、胺基酸尿）、鉛（→間質性腎炎、痛風腎）、無機汞、砷化氫（溶血血紅素堵管） |\n| 髓質／集尿管（濃度最高） | 止痛劑腎病變 | — |\n- 輸尿管不屬腎臟（113-3 命題瑕疵）；錳無腎毒性。記法：**汞打絲球、鎘鉛打小管、砷化氫靠溶血**。\n\n## 三、腎功能評估指標\n- 最常用且方便＝血清肌酸酐推估之 ==eGFR==；精確 GFR 要 24 小時尿 Ccr。\n- 尿蛋白只是損傷篩檢（陽性≠功能障礙、陰性不能排除）；早期小管毒性看 β2 微球蛋白、RBP、NAG。\n\n## 四、職業性急性腎損傷\n- 職業性 AKI ==不常見==，多為慢性病程。會造成者：砷化氫（吸入後數小時症狀、==4–6 小時== 血紅素尿、1–2 天黃疸→急性腎衰竭；三聯徵腹痛、血紅素尿、黃疸）、四氯化碳（飲酒習慣加重）、乙二醇、無機汞鹽；型態為少尿型 ATN。\n\n## 五、鎘的腎毒性與生物偵測\n- 半衰期 ==10–30 年==；近端小管 Fanconi 型→晚期腎絲球損害、腎結石、痛痛病，停止暴露仍持續。\n- 尿鎘反映身體負荷（正常 ==\u003c5 μg/g creatinine==，須同測尿肌酸酐）；血鎘反映近期暴露。==已致腎病變時鎘大量從尿排出，尿鎘不再代表身體含量==→改驗血鎘＋環測＋腎功能。\n- 分級門檻：尿鎘 ≥5 μg/g Cr、蛋白尿二價（≥100 mg/dL）、骨痛／自發性骨折／鎘黃環；尿鎘為健康檢查項目（變更作業免測）。\n\n## 六、腎臟相關異常的健檢處置與分級\n- 尿潛血先問==月經==（結束 2–3 天後複檢）、感染、結石、運動、藥物→可由工作以外原因解釋者第二級；符合危害表現但無法確定→第三級交職醫；符合「且」可由工作解釋→第四級，不得逕判。\n- 游離輻射危害表現：血球減少（淋巴球）、甲狀腺功能低下／癌、輻射性皮膚炎、白內障、骨癌。","questions":[{"qid":"c13q01","q":"腎臟血流量約佔心輸出量的多少？","options":["5%","10%","25%","50%"],"answer":2,"recon":"full","src":["113-2","113-4","113-10","113-11","114-03","114-04","114-05"],"optexp":["**不符合／錯誤**：5% 遠低於實際值。腎臟只佔體重約 0.5%，若只分到 5% 的心輸出量，無法解釋它為何是重金屬與溶劑最常見的標的器官之一。","**不符合／錯誤**：10% 仍偏低。腎臟灌流量以每公克組織計算是全身最高的器官之一，遠高於體重比例。","**符合／正確（本題答案）**：腎臟接受約 20–25%（約四分之一）的心輸出量，約 1.2 L/min。高血流量加上腎小管濃縮與逆流交換機制，使毒物在腎臟達到高濃度，是腎臟容易受毒物傷害的第一個原因。","**不符合／錯誤**：50% 過高。沒有單一器官分到一半的心輸出量；肝臟約 25%、腦約 15%，腎臟約四分之一。"],"explanation":"本題考腎臟易受毒物傷害的第一個生理基礎：血流量。腎臟重量只佔體重約 0.5%，卻接受約 20–25% 的心輸出量（約 1.2 L/min），單位重量灌流量居各器官之冠，所以血中的重金屬（鎘、鉛、汞、砷化氫溶血後的血紅素）與溶劑（四氯化碳、乙二醇）都會大量流經腎臟。考試常以「四分之一」或「25%」出現，同一組概念還包括：腎小管重吸收水分使濾液中毒物濃縮、髓質逆流交換使濃度再往上、近端腎小管上皮有主動運輸與代謝活化酵素、腎絲球內皮表面積大。回憶版另有「腎臟容易受毒性物質傷害的原因何者錯誤」的問法（見下一題），答案都繞著這幾點。","dispute":"","review":{"key_points":["腎臟佔體重約 ==0.5%==，卻接受約 ==20–25%== 的心輸出量（約 1.2 L/min）","高血流量＋腎小管濃縮＋逆流交換＋代謝活化＝腎臟易受毒物傷害的四大原因","職業性腎毒物：鎘、鉛、汞、砷化氫、四氯化碳、乙二醇"],"refs":[],"note_ref":"一、腎臟為何容易中毒"}},{"qid":"c13q02","q":"腎臟容易受毒性物質傷害的原因，下列何者錯誤？","options":["腎臟血流量大，佔心輸出量約四分之一","腎小管會濃縮尿液，使毒物濃度升高","尿液酸鹼值為弱鹼性，使毒物解離","腎小管上皮細胞具有代謝活化毒物的酵素系統"],"answer":2,"recon":"full","src":["113-1","113-8","114-04"],"optexp":["**正確**：腎臟血流量約佔心輸出量四分之一（20–25%），是腎臟暴露量大的主因，敘述無誤。","**正確**：腎小管重吸收水分後，濾液中的毒物濃度可比血漿高數十倍到百倍以上，濃度越高、傷害越大，敘述無誤。","**錯誤（本題答案）**：正常尿液 pH 約 5–6，是弱酸性而非弱鹼性。酸性尿液會影響弱酸／弱鹼藥物的解離與再吸收，但題目把酸鹼寫反了，114-04 回憶版也記為「弱鹼 (x)，弱酸 pH 5–6」。","**正確**：近端腎小管上皮細胞含 cytochrome P450 與 β-lyase 等酵素，會把某些化合物代謝活化成更毒的產物（例如鹵化烴類），敘述無誤。"],"explanation":"本題考腎臟易受毒性物質傷害的原因，必須把正確的四點與陷阱記在一起。正確原因：(1) 血流量大，約佔心輸出量四分之一；(2) 腎小管濃縮尿液，毒物濃度隨水分被回收而升高；(3) 髓質逆流交換機制使髓質與集尿管濃度最高；(4) 腎小管上皮細胞有主動運輸（把毒物從血中拉進細胞）與代謝活化酵素系統；另外腎絲球內皮表面積大、金屬硫蛋白（metallothionein）複合體會在近端腎小管被重吸收。陷阱是尿液酸鹼值：正常尿液呈弱酸性（pH 約 5–6），不是弱鹼性；解離度確實會影響毒物排泄，但方向與題目寫的相反。回憶版另一問法是「腎臟容易受到毒性物質影響的原因？濃縮尿液 (o)、尿液弱鹼 (x)」。","dispute":"","review":{"key_points":["正常尿液 pH 約 ==5–6==（弱酸性），選項寫「弱鹼性」即為錯誤","腎小管濃縮＋逆流交換→毒物在髓質、集尿管濃度最高","近端腎小管：主動運輸＋CYP450 代謝活化＋金屬硫蛋白重吸收"],"refs":[{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"早期表現為近端腎小管重吸收功能障礙，尿中出現低分子蛋白"}],"note_ref":"一、腎臟為何容易中毒"}},{"qid":"c13q03","q":"依「物質越濃縮、毒性越高」的原理判斷，腎臟下列何處受毒性物質傷害的程度相對最輕？","options":["腎絲球","近端腎小管","集尿管","腎髓質"],"answer":0,"recon":"partial","src":["113-1","113-3","113-11"],"optexp":["**符合／正確（本題答案）**：腎絲球濾液剛濾出時與血漿等張、毒物尚未濃縮，腎絲球細胞代謝活性也低，依「越濃縮毒性越高」的原理，是腎臟內相對受傷最輕的部位。【整理】版亦寫「腎絲球受傷較輕」。","**不符合／錯誤**：近端腎小管重吸收約三分之二的濾液與溶質，濃縮最多、主動運輸與代謝活化最強，鎘、鉛、汞、砷化氫血紅素的主要傷害處都在此，是最常受傷的部位。","**不符合／錯誤**：集尿管位於濃縮末端，濾液已接近最終尿液濃度，毒物濃度極高；止痛劑腎病變的乳突壞死就發生在髓質與集尿管一帶。","**不符合／錯誤**：腎髓質靠逆流交換機制維持高滲透壓，間質內溶質與毒物濃度為全腎最高，並非受傷最輕之處。"],"explanation":"本題考「濃縮程度決定毒性部位」。腎絲球濾液是血漿的超濾液，濃度與血漿相同，且腎絲球本身代謝活性低，所以在單純濃縮原理下受傷最輕（免疫機轉造成的腎絲球腎炎是另一回事，見汞那一題）。往下走，近端腎小管把大部分水分與溶質回收，毒物濃度急升，加上主動運輸與代謝活化，成為鎘（β2 微球蛋白尿、Fanconi 型）、鉛（胺基酸尿、糖尿）、無機汞（近曲小管壞死）、砷化氫（血紅素堵塞小管）的共同標的；髓質與集尿管靠逆流交換濃度最高，止痛劑腎病變的乳突壞死即在此。113-3 回憶版的選項含「輸尿管」且回憶者選輸尿管，但輸尿管不是腎臟的一部分，題幹問「腎臟何處」時應選腎絲球。","dispute":"回憶版分歧：113-3 版本的選項含「輸尿管」，回憶者選輸尿管；113-1、113-11 與【整理】版則記「腎絲球受傷較輕」。輸尿管只是輸送尿液的管道，不屬於腎臟實質，若題幹問的是「腎臟何處」則不應列入；以腎臟內部四個部位比較，腎絲球濾液未濃縮、代謝活性低，受毒物傷害最輕。應試時若選項同時出現輸尿管與腎絲球，需看題幹是否限定「腎臟」；本題以腎絲球為準。","review":{"key_points":["腎絲球濾液＝血漿等張、未濃縮→受傷相對最輕","近端腎小管＝濃縮＋主動運輸＋代謝活化→鎘、鉛、汞、砷化氫的共同標的","髓質／集尿管濃度最高→止痛劑腎病變（乳突壞死）","輸尿管不屬腎臟，113-3 版本選它是命題瑕疵"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"初期影響近端腎小管及亨利氏環"},{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"早期表現為近端腎小管重吸收功能障礙，尿中出現低分子蛋白"}],"note_ref":"二、腎臟各部位受傷程度與代表毒物"}},{"qid":"c13q04","q":"臨床上最常用且最方便的腎功能評估指標為何？","options":["由血清肌酸酐推估之腎絲球過濾率（eGFR）","腎臟超音波","腎臟磁振造影","尿蛋白"],"answer":0,"recon":"full","src":["113-2","113-10","114-01","114-04"],"optexp":["**符合／正確（本題答案）**：抽一管血測肌酸酐，加上年齡、性別即可算出 eGFR（MDRD 或 CKD-EPI 公式），是臨床上最常用、最方便的腎功能指標；分級指引汞作業章也把 BUN/CRE 與 eGFR 列為腎功能指標。","**不符合／錯誤**：腎臟超音波看的是結構（大小、水腎、結石、囊腫），不能量化腎功能，且需要儀器與操作者，談不上「最方便」。","**不符合／錯誤**：MRI 昂貴、耗時，主要用於腫瘤與血管評估，臨床不用來評估腎功能。","**不符合／錯誤**：尿蛋白確實常用又便宜，但它反映的是腎絲球或腎小管「損傷」而非「功能」：陽性不等於腎功能障礙（發燒、運動、姿勢性蛋白尿都會陽性），陰性也不能排除腎功能已下降。"],"explanation":"本題考腎功能評估的層次。精確的 GFR 要用菊糖或同位素廓清率、或收 24 小時尿液算肌酸酐廓清率（Ccr），臨床不方便；最常用且方便的是由血清肌酸酐加年齡、性別推估的 eGFR，分級指引汞作業章亦寫「BUN/CRE 及 eGFR 可作為腎功能的指標」。特殊健檢的尿蛋白、尿潛血是「篩檢腎臟損傷」的工具：尿蛋白陽性代表腎絲球屏障或腎小管重吸收出問題，但不直接等於 GFR 下降，也會受發燒、運動、脫水影響；早期腎小管毒性（鎘、汞）更要靠 β2 微球蛋白、RBP、NAG 等低分子量蛋白。114-04 回憶版答 eGFR；【整理】版寫「尿蛋白」，見爭議註記。","dispute":"回憶版分歧：114-04 回憶答「eGFR（血清肌酸酐推估）」；【整理】版記為「尿蛋白」。依講義與分級指引，血清肌酸酐推估之 eGFR 才是最常用且最方便的「腎功能」指標，尿蛋白只是損傷篩檢，陽性不等於功能障礙、陰性不能排除。應試時選 eGFR。","review":{"key_points":["最常用、最方便的腎功能指標＝血清肌酸酐推估之 ==eGFR==","精確 GFR 要 24 小時尿液 Ccr 或同位素廓清率","尿蛋白＝損傷篩檢，陽性≠功能障礙、陰性不能排除；早期小管毒性看 β2 微球蛋白、RBP、NAG"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"BUN/CRE 及 eGFR 可作為腎功能的指標"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"可收集 24 小時尿液求其肌酐酸廓清試驗 (creatinine clearance rate; CCR)"}],"note_ref":"三、腎功能評估指標"}},{"qid":"c13q05","q":"有關職業性急性腎損傷（AKI）之敘述，下列何者正確？","options":["通常以尿崩症（多尿）表現","通常在暴露後數分鐘內即發生","通常與工作中同時大量飲酒有關","職業性急性腎損傷在實務上並不常見，多數職業性腎病為慢性病程"],"answer":3,"recon":"full","src":["114-01","114-04","115-02"],"optexp":["**不符合／錯誤**：職業性 AKI 的典型表現是少尿型急性腎小管壞死（ATN），不是多尿的尿崩症；尿崩症與鋰、demeclocycline 等藥物有關，不是職業毒物的典型。","**不符合／錯誤**：多數在暴露後數小時至數天才發作。以砷化氫為例，指引寫吸入後數小時才感覺到症狀、4–6 小時後出現深色血尿、一兩天後黃疸，最後急性腎衰竭；四氯化碳、乙二醇也要經代謝活化。","**不符合／錯誤**：飲酒會誘導 CYP450，使四氯化碳等鹵化烴的腎毒性增強，但指的是工作前後的飲酒習慣，不是「工作中同時大量飲酒」；把飲酒說成職業性 AKI 的通則也不對。","**符合／正確（本題答案）**：講義明寫職業性急性腎損傷在實務上並不常見，職業性腎病多為慢性病程（鎘、鉛、汞的慢性腎小管或間質病變）；114-04 回憶版註「D 職業性 AKI 不常見 (o 講義寫的)」。"],"explanation":"本題考職業性急性腎損傷（AKI）的整體樣貌。實務上職業性 AKI 少見，多數職業性腎病是慢性、緩慢進行的（鎘的近端小管障礙、鉛的間質性腎炎、汞的腎病症候群）。少數會造成 AKI 的暴露有：砷化氫（血管內溶血，血紅素堵塞腎小管）、四氯化碳與氯仿等鹵化烴（需 CYP450 活化，飲酒者更嚴重）、乙二醇（草酸鈣結晶）、無機汞鹽（近曲小管壞死），型態多為少尿型急性腎小管壞死，發作時間在暴露後數小時到數天，砷化氫的三聯徵是腹痛、血紅素尿、黃疸。判讀時把「數分鐘內發作」「多尿」「工作中飲酒」這三個描述都當成錯誤敘述。","dispute":"","review":{"key_points":["職業性 AKI ==不常見==，多數職業性腎病為慢性病程","會造成 AKI 的暴露：砷化氫（溶血）、四氯化碳（CYP450 活化，飲酒加重）、乙二醇、無機汞鹽","砷化氫：吸入後數小時出現症狀、==4–6 小時== 深色血尿、1–2 天黃疸→急性腎衰竭；三聯徵＝腹痛、血紅素尿、黃
