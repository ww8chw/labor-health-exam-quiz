疸"],"refs":[{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"深色血尿，接著一、二天後就出現黃疸之症狀，最後急性腎衰竭"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"急性砷化氫暴露會導致血管內溶血"}],"note_ref":"四、職業性急性腎損傷"}},{"qid":"c13q06","q":"下列何種金屬慢性中毒最容易造成腎絲球腎炎與腎病症候群？","options":["汞","砷","鉛","錳"],"answer":0,"recon":"full","src":["113-9","113-11","113-12"],"optexp":["**符合／正確（本題答案）**：無機汞除了直接傷害近曲小管，還會經免疫機轉造成膜性腎絲球腎炎，臨床以蛋白尿甚至腎病症候群表現；分級指引寫汞「也會導致免疫性腎絲球腎炎」，腎切片可見免疫球蛋白與補體沉積在腎絲球膜。","**不符合／錯誤**：慢性砷中毒以皮膚（色素沉著、角化、皮膚癌）、周邊神經與肺癌為主；砷化氫則是溶血後的急性腎小管壞死，兩者都不是腎絲球腎炎。","**不符合／錯誤**：慢性鉛腎病是腎間質纖維化與腎小管萎縮（慢性間質性腎炎），早期為近端小管的胺基酸尿、糖尿，晚期尿酸排泄下降造成痛風腎，蛋白尿輕至中度，不是腎病症候群。","**不符合／錯誤**：錳的標的器官是中樞神經（基底核，類巴金森症），無明顯腎毒性。"],"explanation":"本題考各種金屬腎病變的「型態對照」，是本章最常考的配對題。汞：近曲小管壞死＋免疫性（膜性）腎絲球腎炎→腎病症候群；鎘：近端腎小管重吸收障礙→低分子量蛋白尿（β2 微球蛋白、RBP）、糖尿、胺基酸尿、磷酸尿，晚期腎絲球損害與腎結石；鉛：慢性間質性腎炎、腎小管萎縮、痛風腎與高血壓；砷化氫：血管內溶血→血紅素堵塞腎小管→急性腎衰竭；錳：無腎毒性。記法：「汞打絲球、鎘鉛打小管、砷化氫靠溶血」。分級指引也提醒汞作業的貧血可當腎病變的輔助證據，尿蛋白陽性可加做 UPCR 確認是否達腎病症候群標準。","dispute":"","review":{"key_points":["==汞==：免疫性（膜性）腎絲球腎炎→腎病症候群；也傷近曲小管","鎘：近端小管 Fanconi 型；鉛：慢性間質性腎炎＋痛風腎；砷化氫：溶血性 ATN；錳：無腎毒性","尿蛋白陽性→UPCR 判斷是否達腎病症候群"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"也會導致免疫性腎絲球腎炎"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"汞及其無機物可導致蛋白尿、腎病症候群，也會造成免疫性腎絲球腎炎"}],"note_ref":"二、腎臟各部位受傷程度與代表毒物"}},{"qid":"c13q07","q":"下列何種金屬慢性暴露主要造成近端腎小管功能障礙，尿中出現 β2 微球蛋白、糖尿、胺基酸尿？","options":["鎘","錳","鉻","鈷"],"answer":0,"recon":"rebuilt","src":["114-01","115-02"],"optexp":["**符合／正確（本題答案）**：鎘與金屬硫蛋白結合後在近端腎小管被重吸收、解離，累積到臨界濃度就造成重吸收功能障礙；認定指引寫早期出現 β2 微球蛋白等低分子蛋白尿，還可出現葡萄糖尿、高胺基酸尿與高磷酸尿（Fanconi 型）。","**不符合／錯誤**：錳的毒性在中樞神經（蒼白球），沒有腎小管病變。","**不符合／錯誤**：六價鉻的問題是鼻中隔潰瘍穿孔、皮膚潰瘍、氣喘與肺癌；雖有高劑量急性腎炎的個案，但不是以慢性近端小管 Fanconi 型障礙聞名。","**不符合／錯誤**：鈷的職業病是硬金屬肺病、氣喘、接觸性皮膚炎與心肌病變，不是腎小管病變。"],"explanation":"本題考鎘腎病變的完整圖像。鎘在肝臟與金屬硫蛋白結合，複合體經腎絲球濾出後在近端腎小管重吸收並釋出游離鎘，生物半衰期長達 10–30 年，腎皮質鎘濃度達臨界值後出現：(1) 近端腎小管重吸收障礙→低分子量蛋白尿（β2 微球蛋白、視黃醇結合蛋白）、糖尿、胺基酸尿、磷酸尿；(2) 之後腎絲球損害→白蛋白等高分子量蛋白尿；(3) 鈣磷流失→腎結石、骨軟化、骨質疏鬆、自發性骨折（痛痛病）。晚期即使停止暴露腎功能障礙仍持續。管理分級門檻：尿鎘 ≥5 μg/g creatinine、蛋白尿達二價（≥100 mg/dL）、骨病變或門齒犬齒鎘黃環→第三級（無法確定與工作相關）或第四級（可由工作解釋）。","dispute":"","review":{"key_points":["鎘：近端腎小管 Fanconi 型障礙＝==β2 微球蛋白尿==、RBP、糖尿、胺基酸尿、磷酸尿","鎘生物半衰期 ==10–30 年==；晚期腎絲球損害、腎結石、骨軟化（痛痛病）","分級門檻：尿鎘 ==≥5 μg/g creatinine==、蛋白尿二價（≥100 mg/dL）、骨痛／自發性骨折／鎘黃環"],"refs":[{"src":"14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/14職業暴露鎘及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"早期表現為近端腎小管重吸收功能障礙，尿中出現低分子蛋白"},{"src":"24_鎘及其化合物作業管理分級參考","file":"_ref/分級指引/24_鎘及其化合物作業管理分級參考.txt","quote":"尿中鎘濃度 ≥ 5 μg/g creatinine"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"鎘在人體的生物半衰期據估計在 10~30 年之間"}],"note_ref":"五、鎘的腎毒性與生物偵測"}},{"qid":"c13q08","q":"游離輻射作業之女性勞工特殊健康檢查發現尿潛血陽性，健檢醫師之處置下列何者錯誤？","options":["詢問是否為月經期間受檢","詢問泌尿道感染、結石等過去病史","直接判定為第四級管理","安排複檢或健康追蹤檢查以釐清原因"],"answer":2,"recon":"full","src":["114-04"],"optexp":["**正確**：女性尿潛血最常見的干擾就是月經污染，分級指引建議與月經造成的異常仔細鑑別，可在月經結束 2–3 天後複檢，是必問事項。","**正確**：泌尿道感染、結石、腎炎、劇烈運動、藥物都是尿潛血的常見非職業原因，屬「可由工作以外原因解釋」的依據。","**錯誤（本題答案）**：第四級管理必須是異常項目符合游離輻射的健康危害表現（血球減少、甲狀腺功能低下、輻射性皮膚炎、白內障等）且可由工作相關原因解釋；單一尿潛血陽性未釐清原因就逕判第四級，不符合分級指引。","**正確**：無法確定原因時應安排複檢或健康追蹤檢查；可由工作以外原因解釋者為第二級，無法確定者第三級交職業醫學科醫師評估。"],"explanation":"本題考四級管理的判定邏輯，用尿潛血當情境。游離輻射作業特殊健檢有尿蛋白、尿糖、尿潛血及尿沉渣鏡檢，但尿潛血陽性最常見的原因是月經、泌尿道感染、結石、運動或藥物；分級指引第二級的定義是「異常項目可由工作以外的原因解釋」，第三級是異常符合該作業危害表現但無法確定與工作相關、需請職業醫學科專科醫師評估，第四級則要求異常符合游離輻射危害表現（血球減少特別是淋巴球、疑似白血病、甲狀腺功能低下或甲狀腺癌、輻射性皮膚炎、輻射性肺炎、骨癌、白內障）且可由工作相關原因解釋。健檢醫師正確的處置順序是：問月經、問病史、複檢（尿沉渣看紅血球，必要時超音波），再依結果分級；114-04 回憶版註「C 逕判四級 (x)」。","dispute":"","review":{"key_points":["尿潛血陽性先問==月經==、泌尿道感染、結石、運動、藥物→可由工作以外原因解釋者為第二級","第四級＝異常符合該作業危害表現「且」可由工作相關原因解釋；無法確定→第三級交職醫評估","游離輻射危害表現：血球減少（淋巴球）、甲狀腺功能低下／癌、輻射性皮膚炎、白內障、骨癌"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"女性血尿應與月經造成的異常仔細鑑別，建議可在月經結束 2~3 天後複檢"},{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"異常項目可由工作以外的原因解釋"},{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"尿蛋白、尿糖、尿潛血及尿沉渣鏡檢"}],"note_ref":"六、腎臟相關異常的健檢處置與分級"}},{"qid":"c13q09","q":"有關砷化氫與鎘對腎臟之影響，下列敘述何者錯誤？","options":["砷化氫造成血管內溶血，血紅素堵塞腎小管造成急性腎衰竭","鎘長期暴露造成腎永久性傷害與腎結石","鎘引起腎病變後，尿中鎘濃度仍是評估暴露的最佳指標","鎘為腎小管毒物，早期指標為尿中低分子量蛋白"],"answer":2,"recon":"rebuilt","src":["113-8","113-11","114-04"],"optexp":["**正確**：砷化氫吸入後造成血管內溶血，釋出的血紅素堵塞腎小管並直接傷害小管上皮，指引描述 4–6 小時後深色血尿、一兩天後黃疸、最後急性腎衰竭，敘述無誤。","**正確**：分級指引鎘作業章明寫「長期低濃度暴露會導致腎永久性傷害，造成腎結石」，認定指引也說晚期即使不再接觸，腎功能障礙仍將持續存在。","**錯誤（本題答案）**：分級指引完整版指出尿鎘反映身體負荷，但在鎘已引起腎病變的案例，腎小管無法再重吸收、鎘大量從尿排出，尿鎘就「不能再代表身體的含量」，不是有價值的暴露試驗；此時應複檢血鎘、作業環境測定並評估腎功能。","**正確**：鎘為近端腎小管毒物，最早的指標是尿中 β2 微球蛋白、視黃醇結合蛋白等低分子量蛋白。"],"explanation":"本題把砷化氫與鎘的腎毒性合併考，關鍵陷阱是尿鎘的意義。平常尿鎘反映身體（腎皮質）鎘負荷，正常 \u003c5 μg/g creatinine，單泡尿必須同時測肌酸酐換算；血鎘則反映近期暴露。但當鎘已造成腎小管病變，重吸收功能喪失、鎘從尿中大量流失，尿鎘反而失去代表性——所以分級指引說尿鎘 >5 μg/g creatinine 時要複檢血鎘、採樣工作區空氣並仔細評估腎功能。鎘的其他要點：長期低濃度暴露造成腎永久性傷害與腎結石、骨軟化（痛痛病）、可能致肺癌與前列腺癌，尿鎘為特殊健康檢查項目（變更作業者無須檢測）。砷化氫則是急性溶血→血紅素尿→急性腎衰竭，鑑別要看 Coombs test 陰性、腹痛與黃疸三聯徵。113-8 回憶版問「鎘對腎臟損害小？」答錯，長期暴露會導致永久性傷害、腎結石。","dispute":"","review":{"key_points":["尿鎘反映身體負荷，正常 ==\u003c5 μg/g creatinine==，須同測尿肌酸酐換算；血鎘反映近期暴露","鎘已致腎病變→鎘大量從尿排出，==尿鎘不再代表身體含量==，非有價值的暴露試驗→改驗血鎘＋環測＋腎功能","砷化氫：血管內溶血→血紅素堵塞腎小管→急性腎衰竭；鎘：永久性腎傷害、腎結石、痛痛病"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"但是在鎘引起的腎病變案例，尿中鎘就不是一個有價值的暴露試驗"},{"src":"24_鎘及其化合物作業管理分級參考","file":"_ref/分級指引/24_鎘及其化合物作業管理分級參考.txt","quote":"長期低濃度暴露會導致腎永久性傷害，造成腎結石"},{"src":"砷化氫之職業病認定參考指引","file":"_ref/認定指引/all/砷化氫之職業病認定參考指引.txt","quote":"急性砷化氫暴露會導致血管內溶血"}],"note_ref":"五、鎘的腎毒性與生物偵測"}}]},{"idx":13,"order":13,"title":"血液毒性與職業性癌症","group":"器官系統毒理","gi":4,"notes_md":"本章約 12 題，考苯的血液毒性與認定指引數字、致癌物與癌症配對、IARC 分類，苯幾乎每份考古題都出現。\n\n## 一、苯的血液毒性\n- 慢性作用：骨髓抑制→三系==減少==（泛血球減少、再生不良性貧血）→MDS→白血病；血小板==增多==與苯無關。\n- 白血病以==骨髓性==為主、==AML== 最常見（ALL、CML 亦有）；慢性暴露第 2、4、==7== 對染色體受損，第 7 對長臂缺損＝MDS 特徵。\n- 對照：游離輻射→==CML== 最具代表性；CLL 與兩者皆無關。甲苯、二甲苯、正己烷無骨髓毒性。\n- 認定基準：白血球 \u003c4000 或嗜中性球 \u003c2000 伴血小板 \u003c60×10³；或白血球 \u003c3000 或嗜中性球 \u003c1500。\n\n## 二、苯中毒認定指引的數字\n| 項目 | 數字 |\n|---|---|\n| 白血病最短暴露期 | ==六個月==（除非有骨髓再生障礙前例） |\n| 誘導期／最長潛伏期 | ==五年==／==不適用==（通常暴露 5 年後發生；至少三年） |\n| 非致癌血液病變 | 骨髓抑制 1 個月內、骨髓增生 1 年內；再生不良性貧血停止暴露後半年內 |\n| 生物偵測 | 血中苯 >5 μg/L、S-PMA >45 μg/g Cr、t,t-MA >2 mg/L |\n| 暴露來源 | 汽油含 ==1–5%== 苯：加油站、石化、橡膠／輪胎、製鞋、黏著劑、印刷；乾洗店＝四氯乙烯不含苯 |\n- 沒有 5 ppm 門檻、沒有 20 年上限；113-6 的「10.5 年」不在指引。\n\n## 三、職業性癌症致癌物配對\n| 癌症 | 致癌物 |\n|---|---|\n| 白血病 | 苯、游離輻射、環氧乙烷、1,3-丁二烯、甲醛、烷化劑（鎳、甲苯無關） |\n| 膀胱癌 | 芳香胺（聯苯胺、β-萘胺、4-胺基聯苯、鄰甲苯胺）、MOCA；染料、橡膠、皮革業；紀錄保存 30 年 |\n| 肺癌 | 石綿、砷、六價鉻、鎳、鎘、結晶型矽、游離輻射、焦油 |\n| 肝血管肉瘤 | 氯乙烯 |\n| 鼻咽癌／鼻竇癌 | 甲醛／鎳、木粉 |\n| 石綿 | 肺癌、喉癌、惡性間皮瘤（潛伏期 30–40 年、與吸菸無關）、肋膜斑；肺癌與吸菸==相乘== |\n\n## 四、IARC 致癌物分類\n- Group 1：結晶型矽（1997）、石綿、苯、氯乙烯、==三氯乙烯（2014）==、甲醛、1,3-丁二烯、環氧乙烷、砷、鎘、六價鉻、鎳化合物、鈹、聯苯胺、4-胺基聯苯、β-萘胺、MOCA、煤焦油、木粉、游離輻射。\n- Group 2A：==無機鉛（2006）==、DMF（2018）、四氯乙烯、磷化銦、苯乙烯；2B：1-溴丙烷、金屬鉛、金屬鎳、四氯化碳、四氯乙烷、TDI、甲基汞；3：有機鉛、無機汞、α-萘胺。完整對照與「30 年保存」的關係見第 20 章。\n\n## 五、苯作業的法規數字\n- 門檻：苯==體積比超過 1%==；PEL-TWA ==1 ppm==（3.2 mg/m3）。\n- 健檢：CBC＋MCV/MCH/MCHC＋白血球分類（變更作業者免分類）；==無 ALT==。\n- 三系 ==2 項以上== 異常→第三／四級，輔助基準 PEL-TWA ≥0.5 ppm；缺鐵性貧血→第二級；紀錄保存 30 年。","questions":[{"qid":"c14q01","q":"苯引起的白血病，最常見的類型為何？","options":["慢性骨髓性白血病（CML）","急性淋巴性白血病（ALL）","急性骨髓性白血病（AML）","慢性淋巴性白血病（CLL）"],"answer":2,"recon":"full","src":["113-3","113-11"],"optexp":["**不符合／錯誤**：CML 在苯暴露者雖有報告（指引寫苯引起的白血病主要是 AML、ALL 和 CML），但不是最常見型；CML 是游離輻射最具代表性的白血病，不要混淆。","**不符合／錯誤**：ALL 在苯暴露者「亦曾被報告過」，屬少數；苯主要傷害骨髓系造血。","**符合／正確（本題答案）**：苯中毒認定指引寫「因苯暴露導致之白血病種類，以骨髓性白血病較常見」，AML 為主；慢性苯暴露的骨髓細胞可見第 2、4、7 對染色體受損，第 7 對長臂缺損是骨髓化生不良（MDS）的特殊變化，可作為毒物傷害骨髓的證據。","**不符合／錯誤**：CLL 與苯及游離輻射都「較無相關」，是白血病配對題裡固定的錯誤選項。"],"explanation":"本題考苯白血病的型態。苯的慢性造血毒性從骨髓抑制（泛血球減少、再生不良性貧血）、骨髓化生不良症候群（MDS）一路到白血病，型態以骨髓性為主，AML 最常見，ALL、CML 亦曾報告；骨髓染色體檢查若出現第 7 對染色體變異（長臂缺損）可作為毒性物質傷害骨髓的證據，急性苯中毒則不會有染色體變化。必背對照：苯→AML；游離輻射→CML 最具代表性（原爆倖存者資料，AML 也增加）；CLL 與兩者皆無關。回憶版另以「游離輻射與苯各自代表性的白血病」整合出題（見本章末題）。","dispute":"","review":{"key_points":["苯白血病以==骨髓性==為主，==AML== 最常見；ALL、CML 亦曾報告","慢性苯暴露：第 2、4、==7== 對染色體受損；第 7 對長臂缺損＝MDS 特徵；急性中毒無染色體變化","游離輻射→CML 最具代表性；CLL 與苯、游離輻射皆無關"],"refs":[{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"以骨髓性白血病較常見，淋巴性白血病亦曾被報告過"},{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"第 7 對染色體長臂缺損為骨髓成形不良症候群"}],"note_ref":"一、苯的血液毒性"}},{"qid":"c14q02","q":"下列何種血液檢查異常與苯暴露最無關？","options":["白血球 3,000/μL","血色素 10 g/dL","白血球 40,000/μL","血小板 450,000/μL"],"answer":3,"recon":"full","src":["113-2","113-4","113-11","114-03"],"optexp":["**不符合／錯誤**：白血球 3,000/μL 是白血球減少，正是苯骨髓抑制的表現；認定指引慢性苯中毒的血液基準之一就是「白血球計數低於 3000/μL」。","**不符合／錯誤**：血色素 10 g/dL 的貧血符合苯造成的正球性正色素性貧血或再生不良性貧血。","**不符合／錯誤**：白血球 40,000/μL 的異常增多伴不成熟芽細胞，符合苯所致白血病（AML、CML）。","**符合／正確（本題答案）**：血小板 450,000/μL 是血小板增多，苯造成的是血小板「減少」（骨髓抑制、再生不良性貧血），血小板增多與苯暴露最無關；反應性血小板增多多見於發炎、缺鐵、脾切除。"],"explanation":"本題考苯血液毒性的方向：三系都往「減少」走，或往「白血病」走。苯的慢性作用是骨髓抑制→白血球減少（顆粒性白血球減少、淋巴球比例相對增加）、貧血（正球性正色素性）、血小板減少、泛血球減少與再生不良性貧血；再往前是 MDS 與白血病（白血球異常增多、芽細胞）。所以白血球 3,000、血色素 10、白血球 40,000 都可以是苯的表現，唯獨血小板 450,000（增多）不是。分級管理也是這個邏輯：苯作業第三、四級的判定重點是紅血球、白血球及血小板出現 2 項以上異常或其他血液學變化；認定指引的慢性苯中毒血液基準為白血球 \u003c4000/μL 或嗜中性球 \u003c2000/μL 伴血小板 \u003c60×10³/μL，或白血球 \u003c3000/μL 或嗜中性球 \u003c1500/μL。","dispute":"","review":{"key_points":["苯→三系==減少==（白血球、血色素、血小板）或白血病（白血球異常增多）；血小板==增多==與苯無關","認定基準：白血球 \u003c4000 或嗜中性球 \u003c2000 伴血小板 \u003c60×10³；或白血球 \u003c3000 或嗜中性球 \u003c1500","分級：紅血球、白血球及血小板出現 ==2 項以上== 異常→第三／四級"],"refs":[{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"白血球計數低於 3000/μL"},{"src":"16_苯作業管理分級參考","file":"_ref/分級指引/16_苯作業管理分級參考.txt","quote":"白血球及血小板出現2項以上異常"}],"note_ref":"一、苯的血液毒性"}},{"qid":"c14q03","q":"下列何者會造成再生不良性貧血（aplastic anemia）？","options":["苯","甲苯","二甲苯","正己烷"],"answer":0,"recon":"full","src":["113-4","113-6","113-12","114-05"],"optexp":["**符合／正確（本題答案）**：苯的慢性作用以造血系統為主，指引寫「造成泛血球減少症及再生不良性貧血」，長期暴露 100 ppm 以上發生率顯著增加，持續或停止暴露後半年內都可能發生。","**不符合／錯誤**：甲苯以中樞神經（急性麻醉、慢性腦白質病變、小腦萎縮）與肝腎毒性為主，不造成再生不良性貧血也不致血癌（113-6：「甲苯：不會血癌」）。","**不符合／錯誤**：二甲苯同樣以中樞神經抑制與黏膜刺激為主，沒有苯的骨髓毒性。","**不符合／錯誤**：正己烷的標的是周邊神經（2,5-己二酮造成遠端感覺運動多發性神經病變），與造血系統無關。"],"explanation":"本題考「苯 vs 甲苯、二甲苯、正己烷」的標的器官區分。苯是芳香族溶劑中唯一的骨髓毒物：骨髓抑制→泛血球減少、再生不良性貧血、MDS→白血病，IARC Group 1；認定指引指出暴露一個月內可能發生骨髓抑制，持續或停止暴露後半年內可能發生再生不良性貧血，白血病通常於暴露 5 年後發生。甲苯與二甲苯雖也是芳香族，但甲基取代後代謝走側鏈氧化（馬尿酸、甲基馬尿酸），不產生苯的環氧化代謝物，所以沒有血液毒性；它們的問題是中樞神經抑制、肝腎與黏膜刺激。正己烷是脂肪族，代謝成 2,5-己二酮造成周邊神經病變。苯作業勞工要特別注意白血病與再生不良性貧血。","dispute":"","review":{"key_points":["==苯==→泛血球減少、再生不良性貧血、MDS、白血病（唯一有骨髓毒性的常見溶劑）","甲苯、二甲苯→中樞神經與肝腎，不致血癌；正己烷→周邊神經","苯：骨髓抑制 1 個月內、再生不良性貧血停止暴露後半年內、白血病通常暴露 5 年後"],"refs":[{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"造成泛血球減少症(pancytopenia)及再生不良性貧血"},{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"白血病通常於暴露 5 年後發生"}],"note_ref":"一、苯的血液毒性"}},{"qid":"c14q04","q":"下列何種職業暴露不會造成白血病？","options":["苯","鎳","環氧乙烷","游離輻射"],"answer":1,"recon":"full","src":["113-1","113-12","114-01","114-02","114-05","115-01"],"optexp":["**不符合／錯誤**：苯是最經典的職業性白血病致癌物（AML 為主），IARC Group 1。","**符合／正確（本題答案）**：鎳化合物是 IARC Group 1，但標的器官是肺、鼻腔及鼻竇（肺癌、鼻竇癌），與白血病無關；114-01 版本「何者不會造成血球變異」亦以鎳為答案。","**不符合／錯誤**：環氧乙烷為 IARC Group 1，我國職業病種類表將其列為可能引起血癌的危害物質，與淋巴造血系統癌症及乳癌相關。","**不符合／錯誤**：游離輻射造成白血病（CML 最具代表性，AML 亦增加），是原爆與放射線工作者資料確立的關聯。"],"explanation":"本題考「哪些職業暴露會造成白血病」。有充分證據的：苯（AML）、游離輻射（CML、AML）、烷化劑（化療藥）；環氧乙烷（淋巴造血系統癌症，我國職業病種類表列為可能引起血癌）、1,3-丁二烯、甲醛（IARC 認可誘發骨髓性白血病）也常列入。不會造成白血病的常見干擾選項：鎳（肺癌、鼻腔鼻竇癌）、甲苯（不致血癌，114-03 版本）、六價鉻（肺癌）、石綿（肺癌、間皮瘤）。記法：白血病＝「苯、放射、環氧乙烷、丁二烯、甲醛」；鎳、鉻、石綿、砷都是「呼吸道與肺」。","dispute":"","review":{"key_points":["白血病職業致癌物：==苯、游離輻射、環氧乙烷==、1,3-丁二烯、甲醛、烷化劑","鎳化合物：Group 1 但標的為==肺、鼻腔及鼻竇==，與白血病無關","甲苯不致血癌；六價鉻、石綿、砷→肺"],"refs":[{"src":"職業暴露環氧乙烷引起之中毒認定參考指引","file":"_ref/認定指引/all/職業暴露環氧乙烷引起之中毒認定參考指引.txt","quote":"我國職業病種類表亦將環氧乙烷列為可能引起血癌之危害物質"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"致癌的標的器官為肺、鼻腔及鼻竇"}],"note_ref":"三、職業性癌症致癌物配對"}},{"qid":"c14q05","q":"依職業性苯中毒認定參考指引（參考歐盟 2009 職業病診斷指引），有關苯所致白血病之認定，下列何者正確？","options":["最長潛伏期為 20 年","作業環境苯濃度須達 5 ppm 以上才可能致病","最短暴露期為 5 年","最短暴露期為六個月（除非有骨髓再生障礙前例），誘導期為五年，最長潛伏期不適用"],"answer":3,"recon":"partial","src":["113-5","113-11","114-02"],"optexp":["**不符合／錯誤**：指引寫白血病的最長潛伏期「不適用」，沒有 20 年的上限；20 年是回憶版 113-5 選項中被判定為錯的那一項。","**不符合／錯誤**：指引沒有 5 ppm 的致病門檻，作業環境監測只寫「苯濃度可能引起血液疾病，八小時時量平均濃度 1 ppm」（即 PEL）；且研究顯示 \u003c1 ppm 就可能影響血球數。","**不符合／錯誤**：最短暴露期是六個月，不是 5 年；「五年」是誘導期。","**符合／正確（本題答案）**：指引參考歐盟 2009 職業病診斷指引，白血病的認定：最短暴露期六個月（除非有骨髓再生障礙的前例）、最長潛伏期不適用、誘導期五年。"],"explanation":"本題考苯白血病的三個時間數字，必須分清「最短暴露期、誘導期、最長潛伏期」。認定指引輔助基準（歐盟 2009）：白血病最短暴露期六個月（除非有骨髓再生障礙前例）、誘導期五年、最長潛伏期不適用；生物偵測血中苯 >5 μg/L、尿中 S-PMA >45 μg/g creatinine、t,t-MA >2 mg/L；作業環境監測 TWA 1 ppm。非致癌血液病變則是：高濃度數天即可骨髓抑制、血球變化一個月內出現、骨髓增生一年內出現。指引另寫「白血病通常於暴露 5 年後發生」與「暴露苯導致白血病至少需暴露三年以上」，是不同研究來源的數字。回憶版有「何者為非」與「何者正確」兩種問法，錯誤選項固定是 5 ppm、5 年最短暴露、20 年最長潛伏期；113-6 記的「誘導期 10.5 年」見爭議註記。","dispute":"回憶版數字分歧：113-5 版本「何者為非：A 最低暴露 5 ppm、B 誘導期 5 年、C 最長潛伏期 20 年、D 最短暴露期」，【整理】定 C 為非；114-02 版本「何者正確」以 D（六個月／五年／不適用）為正解。另 113-6 回憶「苯白血病誘導期幾年？10.5 年」是課程講義引用的流行病學數字，認定指引本文並無 10.5 年，指引寫的是誘導期五年、通常於暴露 5 年後發生、至少需暴露三年以上。應試以認定指引為準：最短暴露期六個月、誘導期五年、最長潛伏期不適用，5 ppm 與 20 年皆錯。","review":{"key_points":["苯白血病：最短暴露期 ==六個月==（除非有骨髓再生障礙前例）、誘導期 ==五年==、最長潛伏期 ==不適用==","生物偵測：血中苯 >5 μg/L、S-PMA >45 μg/g Cr、t,t-MA >2 mg/L；環測 TWA ==1 ppm==","非致癌血液病變：骨髓抑制一個月內、骨髓增生一年內；沒有 5 ppm 門檻、沒有 20 年上限"],"refs":[{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"最短暴露期：六個月(除非有骨髓再生障礙的前例)；最長潛伏期：不適用；誘導期：五年"},{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"目前一般而言暴露苯導致白血病至少需暴露三年以上"}],"note_ref":"二、苯中毒認定指引的數字"}},{"qid":"c14q06","q":"下列何種作業場所的勞工，苯暴露量最少？","options":["加油站","乾洗店","輪胎製造廠","製膠（黏著劑）工廠"],"answer":1,"recon":"full","src":["113-9","113-10","114-03","114-04"],"optexp":["**不符合／錯誤**：汽油含 1% 至 5% 的苯，加油站是苯中毒認定指引明列的暴露職業之一（排在石化工業之後第二位），暴露量不是最少。","**符合／正確（本題答案）**：乾洗店使用的溶劑是四氯乙烯（或石油系溶劑），不含苯，是四個選項中苯暴露最少的；113-10 #6 與 114-04 #36 版本皆答乾洗店。","**不符合／錯誤**：橡膠工業是指引列舉的苯暴露職業，輪胎製造使用含苯溶劑與橡膠溶劑。","**不符合／錯誤**：黏著劑（製膠）是指引列舉的苯暴露職業，早期強力膠、黏合劑以苯為溶劑，現雖多以甲苯取代，仍屬高暴露來源。"],"explanation":"本題考苯的暴露來源。認定指引列出一百多種暴露職業，前幾項是石化工業、加油站、橡膠工業、塑膠業、製鞋業、樹脂合成、黏著劑、染料、塗料、印刷、人造皮、油漆去污；汽油含 1–5% 苯，所以加油站員工有低濃度但持續的暴露；香菸也含苯，一天一包菸的血中苯濃度約為 1 ppm 作業環境的 1/30。乾洗店的主力溶劑是四氯乙烯（三氯乙烯、四氯乙烯作業另有分級指引，重點是肝腎與神經），不含苯，因此暴露最少。答題時記住「乾洗＝四氯乙烯」「加油站、輪胎、製膠、製鞋、印刷＝苯」。回憶版另一版本（選項加油站／鍍膜／乾洗／輪胎）答加油站，與指引不符，見爭議註記。","dispute":"回憶版分歧：113-10 首段與 114-03 版本（選項加油站／鍍膜／乾洗店／輪胎）回憶者答「加油站」；113-10 #6 與 114-04 #36 版本答「乾洗店」。依苯中毒認定指引，汽油含 1–5% 苯且加油站明列為暴露職業，乾洗店用的是四氯乙烯不含苯，因此苯暴露最少者應為乾洗店，本題以乾洗店為準。","review":{"key_points":["汽油含 ==1–5%== 苯；加油站、石化、橡膠／輪胎、製鞋、黏著劑、印刷、塗料＝苯暴露職業","乾洗店＝==四氯乙烯==，不含苯→苯暴露最少","一天一包菸的血中苯≈1 ppm 作業環境的 1/30"],"refs":[{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"汽油中含 1%至 5%的苯"},{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"包括石化工業、橡膠工業、塑膠業、製鞋業、印刷業"}],"note_ref":"二、苯中毒認定指引的數字"}},{"qid":"c14q07","q":"下列何種行業的勞工最容易罹患職業性膀胱癌？","options":["染料（芳香胺）製造業","電焊工","電燈組裝工","水泥工"],"answer":0,"recon":"full","src":["113-4","113-5","113-8","113-11","114-03"],"optexp":["**符合／正確（本題答案）**：染料業使用聯苯胺、β-萘胺、4-胺基聯苯、鄰甲苯胺等芳香胺，是職業性膀胱癌的經典族群；分級指引寫聯苯胺「為致癌物，會引起膀胱癌，吸煙會增加罹患率」。","**不符合／錯誤**：電焊工的職業病是金屬燻煙熱、電焊工塵肺症（肺鐵質沉積）、眼傷與可能的肺癌，與膀胱癌無關。","**不符合／錯誤**：電燈組裝無芳香胺暴露；早期螢光燈製造有汞暴露，但汞不致膀胱癌。","**不符合／錯誤**：水泥工的問題是六價鉻引起的接觸皮膚炎、刺激性皮膚炎與粉塵，不是膀胱癌。"],"explanation":"本題考職業性膀胱癌的致癌物與行業。致癌物是芳香胺類：聯苯胺、β-萘胺、4-胺基聯苯、4-硝基聯苯、二氯聯苯胺、α-萘胺、鄰甲苯胺，以及 MOCA（3,3'-二氯-4,4'-二胺基苯化甲烷，聚氨酯硬化劑），見於染料、顏料、橡膠（抗氧化劑）、皮革、印刷業。法規上這六種芳香胺作業列為特別危害健康作業，特殊健檢項目包含藥品服用狀況、腎臟疾病及家族史、泌尿系統（含腰側擊痛）身體檢查、尿蛋白、尿潛血及尿沉渣鏡檢，醫師認有必要時得實施細胞診斷檢查；紀錄依勞工健康保護規則第 20 條保存 30 年。膀胱癌潛伏期長（約 15–20 年以上），吸菸會加成。","dispute":"","review":{"key_points":["膀胱癌致癌物：==芳香胺類==（聯苯胺、β-萘胺、4-胺基聯苯、鄰甲苯胺）與 MOCA；行業＝染料、顏料、橡膠、皮革","六種芳香胺作業健檢：尿蛋白、尿潛血、尿沉渣鏡檢，必要時細胞診斷；紀錄保存 ==30 年==","電焊工→肺；水泥工→鉻皮膚炎"],"refs":[{"src":"13_聯苯胺及其鹽類作業管理分級參考","file":"_ref/分級指引/13_聯苯胺及其鹽類作業管理分級參考.txt","quote":"為致癌物，會引起膀胱癌，吸煙會增加罹患率"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"(４)尿蛋白、尿潛血及尿沉渣鏡檢。"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"從事下列作業之各項特殊體格（健康）檢查紀錄，應至少保存三十年"}],"note_ref":"三、職業性癌症致癌物配對"}},{"qid":"c14q08","q":"下列致癌物與癌症之配對，何者錯誤？","options":["石綿：肺癌、喉癌、惡性間皮瘤","六價鉻：肺癌、鼻竇癌","氯乙烯：肝血管肉瘤","苯：鼻咽癌"],"answer":3,"recon":"rebuilt","src":["113-10","114-04","整理-表格"],"optexp":["**正確**：石綿引起肺癌、喉癌、惡性間皮瘤（另有卵巢癌），職安署有肺癌、喉癌、間皮細胞瘤三份癌症認定指引；114-04 回憶版註「石棉-喉癌 (o 指引有)」。","**正確**：六價鉻確定致肺癌（鉻酸鹽工廠肺癌率較高），鼻腔鼻竇癌證據較有限但常一併列出，配對可接受。","**正確**：氯乙烯為 IARC Group 1，特徵性癌症是肝血管肉瘤，也增加肝細胞癌風險。","**錯誤（本題答案）**：苯的標的是造血系統（白血病），不是鼻咽癌；職業性鼻咽癌的致癌物是甲醛（IARC Group 1，可誘發鼻咽癌與骨髓性白血病）。"],"explanation":"本題考致癌物與癌症的配對表，是本章與整份考試的高頻題型。肝癌：氯乙烯（肝血管肉瘤）、四氯化碳、三氯乙烯、多氯聯苯、DMF；肺癌：焦油類、游離輻射、石綿、砷、六價鉻、鎳、鎘、結晶型矽；皮膚癌：煤焦油、瀝青、礦物油、砷、紫外線、巴拉刈；膀胱癌：萘胺類、聯苯胺類、MOCA；白血病：苯、游離輻射、環氧乙烷；鼻咽癌：甲醛；鼻腔鼻竇癌：鎳、木粉、六價鉻；喉癌與間皮瘤：石綿；肝血管肉瘤：氯乙烯（也見於砷、二氧化釷）。苯只跟白血病配，把它配到鼻咽癌就是錯誤配對。","dispute":"","review":{"key_points":["苯→白血病；==甲醛→鼻咽癌==（及骨髓性白血病）","氯乙烯→==肝血管肉瘤==；石綿→肺癌、喉癌、間皮瘤；六價鉻→肺癌（鼻竇癌證據較弱）","鎳→肺、鼻腔鼻竇；砷→肺、皮膚、膀胱；芳香胺→膀胱"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"主要增加肝臟血管肉瘤與肝細胞癌的風險"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"可誘發鼻咽癌或骨髓性白血病"}],"note_ref":"三、職業性癌症致癌物配對"}},{"qid":"c14q09","q":"石綿暴露會導致下列何種疾病？","options":["肺癌、喉癌、惡性間皮瘤、石綿肺症與肋膜斑","白血病","膀胱癌","鼻咽癌"],"answer":0,"recon":"full","src":["113-1","113-2","113-8","113-11","114-03"],"optexp":["**符合／正確（本題答案）**：石綿引起的疾病包括惡性間皮細胞瘤、石綿肺症、肺癌、肋膜斑及瀰漫性肋膜增厚，並可能增加喉癌、卵巢癌與消化系統癌症風險；職安署有石綿肺症、肺癌、喉癌、間皮細胞瘤四份認定指引。","**不符合／錯誤**：白血病的職業致癌物是苯、游離輻射、環氧乙烷，石綿不致白血病。","**不符合／錯誤**：膀胱癌與芳香胺、MOCA 有關，石綿無關。","**不符合／錯誤**：鼻咽癌與甲醛有關，石綿無關。"],"explanation":"本題考石綿相關疾病的全貌。良性肋膜病變：肋膜斑（最常見，潛伏期 20–30 年，常鈣化）、良性石綿肋膜積液（潛伏期最短，約 10 年內）、瀰漫性肋膜增厚、圓形肺塌陷；肺實質：石綿肺症（下肺葉瀰漫性間質纖維化，潛伏期通常 10 年以上）；惡性：肺癌（與吸菸相乘，潛伏期約 20 年）、惡性間皮瘤（潛伏期可長達 30–40 年，與吸菸無關）、喉癌，另可能增加卵巢癌與消化道癌。113-8 回憶版問「間皮瘤與肋膜斑與何者有關」答石綿。IARC 1977 年即將所有種類石綿列為 Group 1；台灣 107 年起全面禁用。","dispute":"","review":{"key_points":["石綿疾病：石綿肺症、肋膜斑、瀰漫性肋膜增厚、良性肋膜積液、==肺癌、喉癌、惡性間皮瘤==、卵巢癌","間皮瘤潛伏期 ==30–40 年==、與吸菸無關；肺癌與吸菸==相乘==；肋膜斑潛伏期 20–30 年","職安署四份石綿認定指引：石綿肺症、肺癌、喉癌、間皮細胞瘤"],"refs":[{"src":"1職業暴露石綿引起之癌症認定參考指引-肺癌","file":"_ref/認定指引/all/1職業暴露石綿引起之癌症認定參考指引-肺癌.txt","quote":"石綿暴露引起惡性間皮細胞瘤的潛伏期可長達30至40年"},{"src":"1職業暴露石綿引起之癌症認定參考指引-肺癌","file":"_ref/認定指引/all/1職業暴露石綿引起之癌症認定參考指引-肺癌.txt","quote":"石綿暴露亦可能增加喉癌、卵巢癌及消化系統癌症的風險"},{"src":"1職業暴露石綿引起之癌症認定參考指引-肺癌","file":"_ref/認定指引/all/1職業暴露石綿引起之癌症認定參考指引-肺癌.txt","quote":"其肺癌風險會呈現相乘地 (multiplicatively)增加"}],"note_ref":"三、職業性癌症致癌物配對"}},{"qid":"c14q10","q":"下列何者為國際癌症研究總署（IARC）第一類（Group 1）致癌物？","options":["結晶型游離二氧化矽（石英）粉塵","1-溴丙烷","二甲基甲醯胺（DMF）","無機鉛化合物"],"answer":0,"recon":"rebuilt","src":["補充","113-2"],"optexp":["**符合／正確（本題答案）**：IARC 於 1997 年將結晶型游離二氧化矽（石英、方矽石）列為第一類（Group 1）人類致癌物，主要是肺癌；職安署另有「矽肺症合併肺癌」認定指引。","**不符合／錯誤**：1-溴丙烷是 IARC Group 2B（可能致癌），分級指引完整版（111 年）甚至寫 IARC 尚未列入其致癌性資料；不是 Group 1。","**不符合／錯誤**：DMF 於 2018 年被 IARC 列為 Group 2A（很可能致癌），主要證據是睪丸癌，不是 Group 1。","**不符合／錯誤**：無機鉛化合物於 2006 年被 IARC 重新分類為 Group 2A（動物證據充分、人類有限），金屬鉛為 2B、有機鉛為 3，都不是 Group 1。"],"explanation":"本題考 IARC 分類，必須把「Group 1」清單背熟。Group 1（確定致癌）：結晶型游離二氧化矽、石綿（所有種類）、苯、氯乙烯、甲醛、1,3-丁二烯、環氧乙烷、砷及無機砷化合物、鎘、六價鉻、鎳化合物、鈹、煤焦油、木粉、游離輻射、三氯乙烯（分級指引寫 Group 1）、多氯聯苯。Group 2A（很可能）：無機鉛、DMF、四氯乙烯、巴拉刈以外的部分農藥。Group 2B（可能）：1-溴丙烷、金屬鉛、鎳金屬與鎳合金、耐火陶瓷纖維與特殊用途玻璃纖維（一般隔熱用玻璃棉、岩棉於 2001 年已改列 Group 3）。Group 3（不可分類）：有機鉛、四甲基鉛、非結晶型矽。考試常用「哪一個是 Group 1」或「哪一個不是」的形式，鉛與 DMF 是最常見的陷阱。","dispute":"","review":{"key_points":["IARC Group 1：==結晶型矽（1997）==、石綿、苯、氯乙烯、甲醛、1,3-丁二烯、環氧乙烷、砷、鎘、六價鉻、鎳化合物、鈹、煤焦油、木粉、游離輻射","Group 2A：==無機鉛（2006）==、DMF（2018）；Group 2B：1-溴丙烷、金屬鉛、鎳金屬合金","Group 3：有機鉛、四甲基鉛、非結晶型矽"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"將結晶型游離二氧化矽列為第一類"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"2006 年公告將無機鉛重新分類為「2A 類，可能致癌物」"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"IARC 2018 年將二甲基甲醯胺分類為對人類很可能有致癌性"}],"note_ref":"四、IARC 致癌物分類"}},{"qid":"c14q11","q":"有關苯作業特殊健康檢查與管理分級，下列何者正確？","options":["健康檢查項目包含紅血球數、血球比容值、血色素、MCV、MCH、MCHC、血小板數、白血球數及白血球分類","苯作業之特殊健康檢查須包含肝功能（ALT）","第三級管理之判定為血球任一項異常即可","苯之八小時日時量平均容許濃度為 10 ppm"],"answer":0,"recon":"rebuilt","src":["補充","113-11"],"optexp":["**符合／正確（本題答案）**：附表十苯作業特殊健康檢查項目為紅血球數、血球比容值、血色素、平均紅血球體積、平均血球血色素、平均紅血球血色素濃度、血小板數、白血球數及白血球分類（變更作業者無須檢測白血球分類）；特殊體格檢查則只有紅血球數、血球比容值、血色素、血小板數、白血球數。","**不符合／錯誤**：苯作業的法定項目沒有肝功能；既往病史雖要問血液疾病、腎臟疾病、肝臟疾病及長期服藥，但檢驗只做血液。ALT 是四氯化碳、DMF、三氯乙烯等肝毒物作業的項目。","**不符合／錯誤**：第三級的判定重點是紅血球、白血球及血小板出現 2 項以上異常（或其他血液學變化）且無法確定與工作相關，不是任一項異常即可；輔助基準 PEL-TWA ≥0.5 ppm。","**不符合／錯誤**：苯的八小時日時量平均容許濃度是 1 ppm（3.2 mg/m3），10 ppm 是美國 OSHA 1969 年的舊標準（1987 年降為 1 ppm）。"],"explanation":"本題整合苯作業的法規數字。特別危害健康作業的門檻：製造、處置或使用苯或其體積比超過 1% 之混合物（其他特定化學物質為重量比）。附表十項目：作業經歷與自覺症狀調查；血液疾病、腎臟疾病、肝臟疾病及長期服藥等既往病史；血液系統、皮膚黏膜（含口腔、鼻腔）及結膜身體檢查；完整血球計數（體格檢查五項；健康檢查加 MCV、MCH、MCHC 與白血球分類）；無肝功能。管理分級：紅血球、白血球及血小板出現 2 項以上異常或其他血液學變化，無法確定與工作相關→第三級、可由工作解釋→第四級，輔助基準 PEL-TWA ≥0.5 ppm；缺鐵性貧血等可由工作以外原因解釋→第二級。PEL-TWA 1 ppm（3.2 mg/m3），紀錄保存 30 年，不適合從事作業的疾病為血液疾病、肝病、神經系統疾病、接觸性皮膚疾病。","dispute":"","review":{"key_points":["苯作業門檻：苯==體積比超過 1%== 之混合物；PEL-TWA ==1 ppm==（3.2 mg/m3）","健檢項目：CBC＋MCV/MCH/MCHC＋白血球分類（變更作業者免分類）；==無 ALT==","第三／四級：三系出現 ==2 項以上== 異常；輔助基準 PEL-TWA ≥0.5 ppm；紀錄保存 30 年"],"refs":[{"src":"16_苯作業管理分級參考","file":"_ref/分級指引/16_苯作業管理分級參考.txt","quote":"八小時日時量平均容許濃度(PEL-TWA)：1 ppm (或 3.2 mg/m3)"},{"src":"16_苯作業管理分級參考","file":"_ref/分級指引/16_苯作業管理分級參考.txt","quote":"輔助基準：八小時日時量平均濃度(PEL-TWA) ≥ 0.5 ppm"},{"src":"0000306055","file":"_ref/annex_mol/0000306055.txt","quote":"（苯為體積比）超過百分之一之混合物之作業"}],"note_ref":"五、苯作業的法規數字"}},{"qid":"c14q12","q":"游離輻射與苯所引起之白血病，其最具代表性之類型分別為何？","options":["游離輻射：CML；苯：AML","游離輻射：AML；苯：CML","游離輻射：CLL；苯：ALL","兩者皆為 CLL"],"answer":0,"recon":"rebuilt","src":["113-2","113-3","114-01"],"optexp":["**符合／正確（本題答案）**：游離輻射以 CML 最具代表性（原爆倖存者資料，AML 亦增加）；苯以骨髓性白血病為主，AML 最常見。","**不符合／錯誤**：兩者對調了。苯雖也有 CML 報告，但以 AML 為主；游離輻射則以 CML 最具代表性。","**不符合／錯誤**：CLL 與游離輻射「較無相關」（台灣勞研所游離輻射血癌認定草案明寫），苯也不是以 ALL 為主。","**不符合／錯誤**：CLL 與苯、游離輻射兩者都無關，是固定的錯誤選項。"],"explanation":"本題是整合題，考兩大白血病致癌物的代表型態。游離輻射認定指引附錄的血癌認定草案：血液與骨髓切片確定為血癌，包含急性骨髓性、急性淋巴性、慢性骨髓性，而慢性淋巴性白血病（CLL）與游離輻射曝露較無相關；其中 CML 是原爆倖存者資料中最具代表性的類型。苯中毒認定指引：苯引起的白血病主要是 AML、ALL 和 CML，以骨髓性較常見，AML 為主。所以配對是「游離輻射：CML；苯：AML」，而 CLL 對兩者都不算。延伸記憶：甲醛→骨髓性白血病；環氧乙烷→淋巴造血系統癌症；烷化劑→治療相關 AML／MDS。","dispute":"","review":{"key_points":["游離輻射→==CML== 最具代表性（AML 亦增加）；苯→==AML== 為主","CLL 與游離輻射、苯皆無關","甲醛→骨髓性白血病；環氧乙烷→淋巴造血系統癌症"],"refs":[{"src":"13職業曝露游離輻射引起之疾病認定參考指引","file":"_ref/認定指引/all/13職業曝露游離輻射引起之疾病認定參考指引.txt","quote":"(Chronic lymphocytic leukemia)與游離輻射曝露較無相關"},{"src":"苯中毒","file":"_ref/認定指引/苯中毒.txt","quote":"苯引起的白血病，主要是 AML、ALL、和 CML"}],"note_ref":"一、苯的血液毒性"}}]},{"idx":14,"order":14,"title":"粉塵、塵肺症與職業性肺病","group":"粉塵、皮膚、肌骨與神經","gi":5,"notes_md":"本章約 18 題，是分量最重的章節之一：粉塵粒徑與容許濃度、矽肺症與石綿肺症的對比、ILO 分類與分型、石綿法規，以及肺功能檢查的品質與判讀。\n\n## 一、粉塵粒徑與沉積部位\n| 分類 | 截取粒徑 | 到達部位 | 機轉 |\n|---|---|---|---|\n| 可吸入性 inhalable | \u003c==100 μm== | 口鼻、上呼吸道 | 慣性衝擊 |\n| 胸腔性 thoracic | \u003c==10 μm== | 氣管、支氣管（纖毛清除） | 沉降 |\n| 可呼吸性 respirable | \u003c==4 μm== | 無纖毛終細支氣管、肺泡（==危害最大==） | 擴散、巨噬細胞 |\n- 法規定義：可呼吸性粉塵＝「會進入無纖毛呼吸道之粉塵」，採樣需**分粒裝置**；完整版寫「小於 5 微米」利於沉積肺泡，回憶版兩種說法並存。\n- 10 μm 以上卡在鼻咽、咽喉；肉眼可見約 50 μm；石綿纖維長 ≥5 μm、徑 \u003c3 μm、長寬比 ≥3。\n\n## 二、塵肺症的種類與高風險行業\n- 纖維化性：**粒狀或塊狀**（矽肺症、煤礦工塵肺症）、**瀰漫性間質性**（石綿肺症）；肉芽腫性（鈹、硬金屬）；良性非纖維化（鐵、錫、鋇）；肋膜病變。\n- 矽肺高風險：採礦、隧道、==噴砂==、鑄造、玻璃、陶瓷、石材（花崗岩含石英 25–40%）、耐火材料；補教業無風險。\n- ==濕式作業==＝工程控制基本手段（附表一「不包括濕潤物」、坑外濕式採掘除外；連續注水免適用設施規定）；控制層級取代→密閉→濕式→局部排氣→整體換氣→呼吸防護具（經檢定防塵口罩 ==N95 以上== 或 PAPR）。\n\n## 三、矽肺症與石綿肺症的對比\n| | 矽肺症 | 石綿肺症 |\n|---|---|---|\n| 纖維化型態 | 粒狀／塊狀 | 瀰漫性間質性 |\n| 好發部位 | ==上肺葉== | ==下肺葉== |\n| ILO 小陰影 | 圓形 p/q/r | 不規則 s/t/u |\n| 特徵 | 蛋殼狀鈣化肺門淋巴結、融合大陰影 PMF | 肋膜斑（最常見，潛伏期 20–30 年）、肋膜增厚、蜂窩狀 |\n| 病程 | 慢性型暴露約 10 年發病；加速型 5–10 年；急性型數週至 4–5 年（噴砂）；==停止暴露仍持續惡化==，無法治癒 | 潛伏期 10 年以上；限制型、DLCO 下降 |\n| 合併症 | ==肺結核==、COPD、肺癌、自體免疫 | 肺癌（與吸菸相乘）、間皮瘤（30–40 年） |\n\n## 四、石綿的法規與殘留暴露\n- 台灣 86 年禁青石綿、褐石綿，==107 年全面禁用==；殘留暴露＝煞車來令片更換、含石綿建材拆除修繕、耐熱爐鍋爐拆解、拆船。\n- 石綿作業＝特別危害健康作業「以處置或使用作業為限」；PEL ==0.15 f/cc==；紀錄保存 30 年；健檢加杵狀指與皮膚檢查。\n\n## 五、粉塵容許濃度與法定檢查\n- 分級指引（考試當時）：第一種粉塵（結晶型游離二氧化矽 ==≥10%==）可呼吸性 10/(%SiO2+2)、總粉塵 30/(%SiO2+2) mg/m3；第二種 1／4；第三種石綿 0.15 f/cc；第四種厭惡性 5／10 mg/m3。\n- 現行附表二（116.1.1 施行）：結晶型游離二氧化矽（石英、方矽石、鱗矽石）可呼吸性 ==0.1 mg/m3==、石綿 0.15 f/cc、厭惡性 5／10。\n- 附表十粉塵作業：既往病史（==肺結核、哮喘、塵肺症、心臟疾病==）、呼吸與心臟循環身體檢查、胸部 X 光大片、肺功能（FVC、FEV1、FEV1/FVC）；==HRCT 非法定項目==。\n- 附表十二考量疾病（粉塵、石綿）：心血管疾病、COPD、慢性氣管炎、氣喘；法源保護規則第 23 條。紀錄保存 30 年；環測紀錄粉塵保存 10 年。\n\n## 六、ILO 分類與塵肺症分型\n- 圓形小陰影：==p \u003c1.5、q 1.5–3、r 3–10 mm==；不規則 s／t／u；密集度 0–3；大陰影（≥1 cm）A 總和直徑 \u003c5 cm、B 介於、C 超過右上肺區（右肺上 1/3）面積。\n- 分型（勞保審定準則）：第一型少數、第二型多數、第三型極多（皆無大陰影）；==第四型＝有大陰影==。認定主要基準：ILO 第一型以上。\n\n## 七、肺功能檢查的品質與判讀\n- 可接受性：BEV \u003c5% FVC 或 0.1 L、第一秒無咳嗽、無聲門閉合、無漏氣＋EOFE 三選一（呼氣高原最後 1 秒 ≤0.025 L、呼氣時間 ≥15 秒、FVC 達重複範圍）。\n- 可重複性：至少 ==3 次== 可接受，兩最大 FVC 差與兩最大 FEV1 差皆 ==≤150 mL==；最多 8 次。曲線重疊＝可重複≠準確。\n- 判讀：正常 FVC ≥80% 且 FEV1/FVC ≥70%；阻塞 ==FEV1/FVC \u003c70%==（輕 ≥80、中 50–79、重 30–49、極重 \u003c30）；限制 FVC \u003c80% 且比值 ≥70%（確診需 TLC \u003c80%）；混合＝比值 \u003c70% 且 TLC \u003c80%。","questions":[{"qid":"c15q01","q":"粒徑小於多少微米（μm）的粉塵（可呼吸性粉塵）最容易沉積於肺部深處（肺泡）？","options":["4 μm","10 μm","50 μm","100 μm"],"answer":0,"recon":"full","src":["113-5","113-10","113-11","114-02","114-03","114-04","整理-表格"],"optexp":["**符合／正確（本題答案）**：可呼吸性粉塵（respirable dust）的採樣慣例以 4 μm 為 50% 截取粒徑，這一級粉塵可通過纖毛區到達無纖毛的終細支氣管與肺泡並沉積，是造成塵肺症、危害最大的粒徑；分級指引完整版寫「粉塵小於 5 微米、吸氣深而慢，利於粉塵沉積於無纖毛的終細支氣管及肺泡」。","**不符合／錯誤**：10 μm 是胸腔性粉塵（thoracic）的截取粒徑，可進入氣管、支氣管區，但多數被纖毛黏液清除，不是沉積肺泡的主力。","**不符合／錯誤**：50 μm 左右才是肉眼可見的粒徑，多被鼻腔與上呼吸道攔截。","**不符合／錯誤**：100 μm 是可吸入性粉塵（inhalable）的上限截取粒徑，只到口鼻與上呼吸道。"],"explanation":"本題考粉塵三分類的粒徑門檻。依 ACGIH／ISO 採樣慣例（50% 截取粒徑）：可吸入性粉塵 \u003c100 μm，經口鼻進入呼吸系統；胸腔性粉塵 \u003c10 μm，可沉降於氣管、支氣管；可呼吸性粉塵 \u003c4 μm，可到達肺泡並沉積，無法靠溶解或呼出清除而累積，所以健康效應最嚴重。法規本身（容許暴露標準附表二）對可呼吸性粉塵的定義是「會進入無纖毛呼吸道之粉塵」，沒有寫出微米數；分級指引完整版則用「小於 5 微米、吸氣深而慢利於沉積肺泡」描述，這就是回憶版「小於 5 微米」說法的出處，考試以 4 μm 為答案即可，兩者不衝突。其他數字：肉眼可見約 50 μm 以上；奈米粒子 \u003c100 nm；石綿纖維定義為長度 ≥5 μm、直徑 \u003c3 μm、長寬比 ≥3。","dispute":"","review":{"key_points":["可吸入性 \u003c==100 μm==（口鼻）、胸腔性 \u003c==10 μm==（氣管支氣管）、可呼吸性 \u003c==4 μm==（肺泡、危害最大）","法規定義：可呼吸性粉塵＝會進入==無纖毛呼吸道==之粉塵；完整版寫「小於 5 微米」利於沉積肺泡","石綿纖維：長 ≥5 μm、徑 \u003c3 μm、長寬比 ≥3；肉眼可見約 50 μm 以上"],"refs":[{"src":"0000387836","file":"_ref/annex_pel/0000387836.txt","quote":"可呼吸性粉塵係指會進入無纖毛呼吸道之粉塵"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"粉塵小於 5 微米 (μm)、吸氣深而慢，利於粉塵沉積於無纖毛的終細支氣管及肺泡"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"可呼吸性粉塵對於人體健康效應影響最為嚴重"}],"note_ref":"一、粉塵粒徑與沉積部位"}},{"qid":"c15q02","q":"粒徑 10 μm 以上的粉塵，吸入後主要沉積於呼吸道何處？","options":["肺泡","支氣管","鼻咽、咽喉（上呼吸道）","細支氣管"],"answer":2,"recon":"full","src":["整理-表格"],"optexp":["**不符合／錯誤**：肺泡沉積的是可呼吸性粉塵（\u003c4 μm，講義表格寫 \u003c0.5 μm 以擴散為主沉積），10 μm 以上的粒子到不了肺泡。","**不符合／錯誤**：支氣管沉積的是胸腔性粉塵（\u003c10 μm），靠慣性衝擊與沉降；10 μm 以上多在更上游就被攔下。","**符合／正確（本題答案）**：10 μm 以上的粉塵因慣性衝擊，多數在鼻咽、咽喉（上呼吸道）就被攔截，講義表格寫「粒徑 10 μm 以上卡在咽喉」，靠鼻毛、黏液與吞嚥清除。","**不符合／錯誤**：細支氣管沉積的粒徑更小（約 0.5–2.5 μm），與 10 μm 以上無關。"],"explanation":"本題考粒徑與沉積部位的對應，機轉是慣性衝擊（大顆粒、高流速處，如鼻咽）、重力沉降（中等顆粒，氣管支氣管）與擴散（\u003c0.5 μm 的小顆粒，肺泡）。講義表格的粗略對應：10 μm 以上卡在咽喉（上呼吸道）；2.5–10 μm 鼻腔；0.5–2.5 μm 支氣管；\u003c0.5 μm 肺泡。與分級指引的三分類合起來記：>100 μm 幾乎不吸入；10–100 μm 停在鼻咽喉；4–10 μm 進到氣管支氣管、靠纖毛黏液清除；\u003c4 μm 到肺泡、由巨噬細胞處理，清不掉就累積纖維化。石綿纖維雖長但直徑細（0.5–5 μm），仍可沿氣流深入終細支氣管與肺泡，這是它危險的原因。","dispute":"","review":{"key_points":["==10 μm 以上==→鼻咽、咽喉（慣性衝擊）；胸腔性 4–10 μm→氣管支氣管（沉降、纖毛清除）；\u003c4 μm→肺泡（擴散、巨噬細胞）","講義表格：>10 咽喉、2.5–10 鼻腔、0.5–2.5 支氣管、\u003c0.5 肺泡","石綿纖維直徑 0.5–5 μm 可深入肺泡"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"胸腔性粉塵 (thoracic dust)：進入呼吸系統可沉降於氣管或支氣管區者"}],"note_ref":"一、粉塵粒徑與沉積部位"}},{"qid":"c15q03","q":"下列何種行業罹患塵肺症的風險最低？","options":["玻璃製造業","噴砂作業","鑄造業","補教業"],"answer":3,"recon":"full","src":["113-5","113-11","114-05"],"optexp":["**不符合／錯誤**：玻璃製造業（glassmaking）、玻璃搪瓷是矽肺症認定指引列舉的高風險職業，原料矽砂含大量結晶型二氧化矽。","**不符合／錯誤**：噴砂業（sand blasting）風險最高，急性矽肺症多來自噴砂，數週至 4–5 年即可發病。","**不符合／錯誤**：鑄造工（foundry work）用矽砂做砂模、拆模除砂粉塵大，是指引列舉職業。","**符合／正確（本題答案）**：補教業沒有礦物性粉塵暴露，不屬粉塵危害預防標準附表一的粉塵作業，塵肺症風險最低。"],"explanation":"本題考塵肺症的高風險行業。矽肺症認定指引列舉：採礦、隧道工程、採石、鑄造、噴砂、玻璃製造、玻璃搪瓷、陶瓷製造、石材製品、耐火材料、磨料製造等；台灣本土資料以石材（花崗岩含石英 25–40%）、陶瓷（衛生陶瓷上釉）、煤礦、窯業為主。煤礦工塵肺症見於煤礦採礦、修整、運送與石墨採礦。判斷方式：作業是否符合粉塵危害預防標準附表一甲欄的「粉塵作業」（採掘、搗碎粉碎篩選、切斷雕刻研磨、噴砂、鑄造拆模除砂、水泥岩石粉末裝袋等），有就是特別危害健康作業，需做粉塵特殊健檢並保存紀錄 30 年；補教業、辦公室當然不是。","dispute":"","review":{"key_points":["矽肺高風險：採礦、隧道、==噴砂==（急性矽肺）、鑄造、玻璃、陶瓷、石材、耐火材料","台灣本土：石材（花崗岩含石英 25–40%）、陶瓷上釉、煤礦、窯業","粉塵作業＝粉塵危害預防標準附表一甲欄；粉塵作業健檢紀錄保存 30 年"],"refs":[{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"噴砂業(sand blasting)"},{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"玻璃製造業(glassmaking)"},{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"鑄造工(foundry work)"}],"note_ref":"二、塵肺症的種類與高風險行業"}},{"qid":"c15q04","q":"下列何者受粉塵危害的程度相對較低？","options":["陶器及後製作業之乾式打磨","礦坑內採濕式作業之礦產搬運","玻璃製造及相關加工","水泥原料傾倒及攪拌作業"],"answer":1,"recon":"partial","src":["113-10","113-11"],"optexp":["**不符合／錯誤**：陶器乾式打磨釋出含結晶型二氧化矽的細粉塵，是典型高暴露作業；粉塵危害預防標準對室內以動力研磨、修飾的處所要求局部排氣或濕潤化，正因為它危害高。","**符合／正確（本題答案）**：濕式作業是粉塵工程控制的基本手段，粉塵危害預防標準附表一把「濕潤物」的搬運排除在粉塵作業之外、坑外濕式採掘也排除，且設備以連續注水操作時可免適用第 6–24 條設施規定；礦坑內濕式搬運的粉塵飛揚遠低於其他三者。","**不符合／錯誤**：玻璃製造及加工使用矽砂，是矽肺症指引列舉的高風險行業。","**不符合／錯誤**：水泥原料傾倒與攪拌粉塵飛揚大，也是附表一列舉的粉塵作業。"],"explanation":"本題考「濕式作業」在粉塵控制的意義。粉塵危害預防標準的設計邏輯就是把濕潤狀態當作低危害：附表一甲欄粉塵作業的定義多處寫「不包括濕潤物」「坑外以濕式採掘之作業除外」，乙欄對特定粉塵發生源要求「維持濕潤狀態」或設置密閉設備、局部排氣，第 5 條規定設備以連續注水或注油操作時可免適用設施規定；分級指引完整版的石綿工廠調查也寫「濕式作業及加裝局部排氣者其石綿濃度顯著較低」。所以四個選項中，礦坑內採濕式作業的礦產搬運危害最低；陶器乾式打磨、玻璃加工、水泥攪拌都是高粉塵、含矽的作業。工程控制的層級：取代→密閉→濕式→局部排氣→整體換氣→呼吸防護具。","dispute":"113-10 回憶者自填答案為 (A) 陶器及後製作業之乾式打磨，【整理】版沿用。依粉塵危害預防標準，濕潤物的搬運與坑外濕式採掘被排除在粉塵作業之外、設備連續注水可免適用設施規定，濕式作業是工程控制手段，危害程度應相對較低；乾式打磨含矽陶器則是高暴露作業。回憶答案與工程控制原理不符，本題以 (B) 礦坑內濕式作業之礦產搬運為準。","review":{"key_points":["==濕式作業==＝粉塵工程控制基本手段；附表一「不包括濕潤物」、坑外濕式採掘除外","設備連續注水或注油操作→免適用粉塵標準第 6–24 條設施規定","工程控制層級：取代→密閉→濕式→局部排氣→整體換氣→呼吸防護具"],"refs":[{"src":"粉塵危害預防標準","file":"_ref/粉塵危害預防標準.txt","quote":"下列各款粉塵作業之設備如以連續注水或注油操作時，該作業得免適用第六條至第二十四條之規定"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"濕式作業及加裝局部排氣者其石綿濃度顯著較低"},{"src":"0000233186","file":"_ref/annex_dust/0000233186.txt","quote":"維持濕潤狀態"}],"note_ref":"二、塵肺症的種類與高風險行業"}},{"qid":"c15q05","q":"粉塵作業勞工為預防塵肺症，應配戴下列何種呼吸防護具？","options":["紗布口罩","活性碳口罩","N95 以上等級之防塵口罩","外科口罩"],"answer":2,"recon":"full","src":["113-8","113-12","114-03","114-04"],"optexp":["**不符合／錯誤**：紗布口罩纖維孔隙大、貼合度差，過濾不了 \u003c4 μm 的可呼吸性粉塵。","**不符合／錯誤**：活性碳口罩靠吸附去除有機蒸氣與異味，對微粒過濾能力取決於其濾材等級，單純活性碳層不是防塵設計。","**符合／正確（本題答案）**：粉塵作業應使用經檢定的防塵口罩，N95（過濾 0.3 μm 粒子 ≥95%）以上等級或動力濾淨式呼吸防護具；粉塵危害預防標準附表一丙欄列出「應著用呼吸防護具之作業」，要求供給適當之呼吸防護具。","**不符合／錯誤**：外科口罩設計是阻擋飛沫向外，邊緣漏氣大，不能作為粉塵呼吸防護具。"],"explanation":"本題考粉塵作業的個人防護。呼吸防護是控制層級的最後一道，粉塵危害預防標準第 22–23 條與附表一丙欄規定衝擊式鑿岩、坑內卸礦、手提動力工具切斷研磨、室外噴砂等作業應著用呼吸防護具，整體換氣裝置設置例外時也以「供給勞工使用適當之呼吸防護具」為條件。適當的防塵口罩須經檢定（國內 CNS 14755 或美國 NIOSH N95、N99、N100；油性微粒用 R／P 系列），必要時用動力濾淨式（PAPR）；配戴前要做密合度測試，留鬍子會漏氣。紗布、外科口罩擋不住可呼吸性粉塵，活性碳口罩是針對有機蒸氣異味。石綿作業則要求更高等級（P100 或 PAPR）。","dispute":"","review":{"key_points":["粉塵作業呼吸防護具＝經檢定之防塵口罩，==N95 以上==或動力濾淨式；需密合度測試","紗布、外科口罩擋不住可呼吸性粉塵；活性碳口罩針對有機蒸氣","粉塵標準附表一丙欄列「應著用呼吸防護具之作業」；換氣裝置例外須供給適當呼吸防護具"],"refs":[{"src":"粉塵危害預防標準","file":"_ref/粉塵危害預防標準.txt","quote":"供給勞工使用適當之呼吸防護具"},{"src":"0000233186","file":"_ref/annex_dust/0000233186.txt","quote":"應著用呼吸防護具之作業"}],"note_ref":"二、塵肺症的種類與高風險行業"}},{"qid":"c15q06","q":"矽肺症患者停止粉塵暴露後，病程會如何？","options":["1 年後停止惡化","5 年後停止惡化","10 年後停止惡化","即使停止暴露仍可能持續惡化"],"answer":3,"recon":"full","src":["113-6","113-8","113-11","114-01"],"optexp":["**不符合／錯誤**：沒有 1 年停止惡化的說法；矽肺的纖維化在停止暴露後仍繼續。","**不符合／錯誤**：5 年是加速型矽肺症「發病」的時間尺度（暴露後 5–10 年），不是惡化停止的年限。","**不符合／錯誤**：10 年是慢性矽肺症通常的發病潛伏期（暴露約 10 年後），同樣不是惡化停止的年限。","**符合／正確（本題答案）**：矽肺症認定指引明寫「不管是急性或慢性矽肺症，即使停止矽塵的暴露，肺內的纖維化過程仍會繼續進行」，且常合併肺結核、進行至呼吸衰竭或肺心症。"],"explanation":"本題考矽肺症的病程特性：不可逆且會持續進行。結晶型二氧化矽化學性質穩定、溶解度低，進入肺部不易排出，巨噬細胞吞噬後死亡再釋出，反覆引發纖維化，所以停止暴露後纖維化仍會進行，單純型可進展為融合型（進行性大塊纖維化 PMF）。三種型態：慢性矽肺症（暴露約 10 年後發病，進行緩慢，最常見）、加速型（暴露後 5–10 年）、急性矽肺症（數週至 4–5 年，噴砂業，矽蛋白質症，一年內死亡）。合併症：肺結核（免疫力下降）、COPD、肺癌（IARC Group 1）、自體免疫疾病、腎病變。這點與噪音性聽力損失（停止暴露後不再進行）形成對比，考試常一起出。目前無法治癒，只能預防與早期發現。","dispute":"","review":{"key_points":["矽肺症==停止暴露後纖維化仍持續進行==，無法治癒；對比噪音性聽損停止暴露即不再惡化","慢性型暴露約 ==10 年== 後發病；加速型 5–10 年；急性型數週至 4–5 年（噴砂、矽蛋白質症）","合併症：==肺結核==、COPD、肺癌、自體免疫疾病、腎病變、肺心症"],"refs":[{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"即使停止矽塵的暴露，肺內的纖維化過程仍會繼續進行"},{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"矽肺症常合併肺結核"}],"note_ref":"三、矽肺症與石綿肺症的對比"}},{"qid":"c15q07","q":"有關矽肺症之敘述，下列何者錯誤？","options":["屬瀰漫性間質性纖維化型塵肺症，病灶以下肺葉為主","目前無法治癒","X 光呈粒狀（結節狀）或塊狀纖維化，以上肺葉為主","打石工、噴砂工可能罹患矽肺症"],"answer":0,"recon":"full","src":["113-1","114-01","114-02","114-04"],"optexp":["**錯誤（本題答案）**：矽肺症屬「粒狀或塊狀纖維化」型塵肺症，病灶以上肺葉為主；「瀰漫性間質性纖維化、下肺葉為主」描述的是石綿肺症。","**正確**：矽肺症目前無法治癒，停止暴露後仍會進行，只能預防、早期發現與處理合併症。","**正確**：分級指引把矽肺症、煤礦工塵肺症歸在「粒狀或塊狀纖維化」，認定指引寫雙側多顆圓形陰影「大多出現在肺部的上三分之一處」，可融合成大塊。","**正確**：打石工、噴砂工、採石、隧道、鑄造、陶瓷、玻璃都是矽肺症高風險職業。"],"explanation":"本題考纖維化性塵肺症的兩大型態，是分級指引粉塵作業章的分類：(1) 粒狀或塊狀纖維化：矽肺症、煤礦勞工塵肺症——X 光為圓形小陰影（ILO p/q/r），好發上肺葉，可融合成大陰影（PMF），肺門淋巴結可見蛋殼狀鈣化；(2) 瀰漫性間質性纖維化：石綿肺症——不規則小陰影（s/t/u），好發下肺葉，伴肋膜斑、肋膜增厚，晚期蜂窩狀。另外還有肉芽腫性塵肺症（鈹肺、硬金屬病）、良性非纖維化塵肺症（鐵、錫、鋇）與肋膜病變。114-01 回憶版整理得很清楚：「矽肺症與塵肺症都出現在肺部上方，粒狀或塊狀纖維化；石綿肺症出現在下肺葉，瀰漫性纖維化，亦有肋膜斑、不規則線條」。","dispute":"","review":{"key_points":["矽肺症、煤礦工塵肺症＝==粒狀或塊狀纖維化==，圓形小陰影 p/q/r，==上肺葉==，可融合 PMF、蛋殼狀鈣化","石綿肺症＝==瀰漫性間質性纖維化==，不規則小陰影 s/t/u，==下肺葉==，肋膜斑","肉芽腫性（鈹、硬金屬）、良性非纖維化（鐵、錫、鋇）塵肺症"],"refs":[{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"1.1 粒狀或塊狀纖維化：矽肺症、煤礦勞工塵肺症、其他。"},{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"1.2 瀰漫性間質性纖維化：石綿肺症、非職業性石綿肺症、其他。"},{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"大多出現在肺部的上三分之一處"}],"note_ref":"三、矽肺症與石綿肺症的對比"}},{"qid":"c15q08","q":"有關石綿肺症之胸部 X 光表現，下列何者正確？","options":["肋膜斑（pleural plaques）與下肺葉瀰漫性間質纖維化（不規則小陰影）","上肺葉粒狀或塊狀纖維化","單側肺門淋巴結腫大","蛋殼狀鈣化淋巴結"],"answer":0,"recon":"full","src":["113-1","113-5","114-01"],"optexp":["**符合／正確（本題答案）**：石綿肺症認定指引寫「典型的石綿肺主要表現在下肺葉，以小顆不規則結節變化為主」，X 光呈瀰漫性間質性網狀浸潤，晚期肋膜下蜂窩狀；肋膜斑是石綿暴露最常見的病徵（常鈣化）。","**不符合／錯誤**：上肺葉粒狀或塊狀纖維化是矽肺症與煤礦工塵肺症的表現。","**不符合／錯誤**：單側肺門淋巴結腫大要想到肺癌、結核或淋巴瘤，不是石綿肺症；石綿肺症的肺門淋巴腺不腫大。","**不符合／錯誤**：蛋殼狀鈣化的肺門／縱膈淋巴結是矽肺症（尤其融合型）的特徵，也見於類肉瘤症。"],"explanation":"本題考石綿肺症的影像學。肺實質：下肺葉為主的不規則小陰影（ILO s/t/u），瀰漫性間質性網狀浸潤，進展為蜂窩狀，肺門淋巴腺不腫大；胸膜：肋膜斑（最常見，潛伏期 20–30 年，多在壁層肋膜與橫膈，常鈣化）、瀰漫性肋膜增厚（肋膈角消失且增厚 3 mm 以上）、良性肋膜積液、圓形肺塌陷。大片不透光變化不是石綿肺的表現，要考慮矽肺或肺癌。肺功能為限制型、DLCO 下降，兩下肺野吸氣末細爆裂音，晚期杵狀指。矽肺症相對地是上肺葉圓形小陰影（p/q/r）、蛋殼狀鈣化肺門淋巴結、可融合成大陰影。","dispute":"","review":{"key_points":["石綿肺症 X 光：==下肺葉==不規則小陰影（s/t/u）、瀰漫性間質網狀浸潤、蜂窩狀；肺門淋巴腺不腫大","==肋膜斑==＝石綿暴露最常見病徵，潛伏期 20–30 年，常鈣化；瀰漫性肋膜增厚＝肋膈角消失＋增厚 ≥3 mm","蛋殼狀鈣化淋巴結＝矽肺症；大片不透光要想矽肺或肺癌"],"refs":[{"src":"4職業暴露石綿引起之石綿肺症認定參考指引_七稿","file":"_ref/認定指引/all/4職業暴露石綿引起之石綿肺症認定參考指引_七稿.txt","quote":"典型的石綿肺主要表現在下肺葉，以小顆不規則結節變化"},{"src":"4職業暴露石綿引起之石綿肺症認定參考指引_七稿","file":"_ref/認定指引/all/4職業暴露石綿引起之石綿肺症認定參考指引_七稿.txt","quote":"最常見是肋膜斑(pleural plaque)"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"肺門或縱膈淋巴結出現蛋殼形鈣化"}],"note_ref":"三、矽肺症與石綿肺症的對比"}},{"qid":"c15q09","q":"某勞工從事防火建材破壞與修整工作 10 年，健康檢查發現肋膜斑，最可能與下列何種物質有關？","options":["石英粉塵","石綿","煤塵","水泥粉塵"],"answer":1,"recon":"full","src":["113-10","113-11","114-04"],"optexp":["**不符合／錯誤**：石英粉塵造成的是矽肺症（上肺葉圓形小陰影、蛋殼狀鈣化），不會產生肋膜斑。","**符合／正確（本題答案）**：肋膜斑是石綿暴露的特徵性標記，潛伏期一般 20–30 年；防火建材（石綿板、防火隔熱材）的破壞與修整正是指引列舉的殘留暴露來源。","**不符合／錯誤**：煤塵造成煤礦工塵肺症（煤塵斑、上肺葉結節、PMF），與肋膜斑無關。","**不符合／錯誤**：水泥粉塵屬厭惡性／低纖維化粉塵，主要是刺激與慢性支氣管炎，不產生肋膜斑。"],"explanation":"本題考肋膜斑的專一性與台灣的石綿殘留暴露。肋膜斑（pleural plaque）是石綿暴露最常見的病徵，可見於高達 58% 的暴露工人，潛伏期 20–30 年，本身多無症狀、與肺功能無明顯相關，但代表曾有石綿暴露，要追蹤肺癌與間皮瘤。台灣民國 107 年起全面禁用石綿，現在的暴露主要來自既有含石綿建材（防火板、石綿瓦、隔熱材）的拆除、修繕與破壞，以及耐熱爐、鍋爐拆解、舊煞車來令片更換與拆船；115-02 回憶版另有「最可能有石綿暴露：使用或拆解耐熱構造爐」。石綿暴露者的健康監測：胸部 X 光（必要時 HRCT）、肺功能，暴露結束後仍建議長期追蹤（間皮瘤潛伏期 30–40 年）。","dispute":"","review":{"key_points":["==肋膜斑＝石綿暴露的特徵性標記==，潛伏期 20–30 年，多無症狀、需追蹤肺癌與間皮瘤","台灣殘留暴露：含石綿建材拆除修繕、耐熱爐／鍋爐拆解、舊來令片、拆船","石英→矽肺；煤塵→煤礦工塵肺；水泥→厭惡性粉塵，皆無肋膜斑"],"refs":[{"src":"4職業暴露石綿引起之石綿肺症認定參考指引_七稿","file":"_ref/認定指引/all/4職業暴露石綿引起之石綿肺症認定參考指引_七稿.txt","quote":"潛伏期一般為 20 至 30 年"},{"src":"4職業暴露石綿引起之石綿肺症認定參考指引_七稿","file":"_ref/認定指引/all/4職業暴露石綿引起之石綿肺症認定參考指引_七稿.txt","quote":"房舍維修中含石綿建材之裝設，破損，移除及修繕，都可能有石綿暴露"}],"note_ref":"四、石綿的法規與殘留暴露"}},{"qid":"c15q10","q":"台灣目前下列何種行業仍可能有石綿暴露？","options":["煞車來令片製造與更換","半導體黃光作業","加油站","乾洗店"],"answer":0,"recon":"full","src":["113-6","114-03","114-04"],"optexp":["**符合／正確（本題答案）**：石綿肺症認定指引寫民國 105 年以後各種石綿職業「除了煞車來令片外可能多不存在」，汽機車製造與維修產業的來令片材料含石綿；雖然 107 年起全面禁用，既有車輛舊來令片更換與拆解仍是殘留暴露來源。","**不符合／錯誤**：半導體黃光作業的危害是光阻劑溶劑（PGMEA 等）、砷、氫氟酸與光化學物質，沒有石綿。","**不符合／錯誤**：加油站的暴露是汽油中的苯，與石綿無關。","**不符合／錯誤**：乾洗店的暴露是四氯乙烯，與石綿無關。"],"explanation":"本題考台灣石綿管制的時間軸與殘留暴露。環保署 78 年列管石綿為毒性化學物質，80 年禁用於飲用水管，86 年禁止青石綿與褐石綿，94 年底公告含石綿建材禁用，107 年起全面禁用（含煞車來令片製造輸入）。台灣過去石綿主要用途就是煞車來令片，其次為石綿瓦、板等建材，絕大部分進口。現在的暴露來自：既有含石綿建材的拆除、修繕；耐熱爐、鍋爐、蒸汽管隔熱材拆解；舊車煞車來令片更換；拆船。法規上，石綿列為特別危害健康作業「以處置或使用作業為限」，PEL 0.15 f/cc，特殊健檢紀錄保存 30 年，附表十二考量疾病為心血管疾病、COPD、慢性氣管炎、氣喘。","dispute":"","review":{"key_points":["台灣 ==107 年== 起全面禁用石綿；86 年先禁青石綿、褐石綿","殘留暴露：==煞車來令片==更換、含石綿建材拆除修繕、耐熱爐鍋爐拆解、拆船","石綿作業＝特別危害健康作業（==以處置或使用作業為限==），PEL 0.15 f/cc，紀錄保存 30 年"],"refs":[{"src":"4職業暴露石綿引起之石綿肺症認定參考指引_七稿","file":"_ref/認定指引/all/4職業暴露石綿引起之石綿肺症認定參考指引_七稿.txt","quote":"除了煞車來令片外可能多不存在"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"民國 107 年我國完全禁用石綿"},{"src":"0000306055","file":"_ref/annex_mol/0000306055.txt","quote":"石綿（以處置或使用作業為限)"}],"note_ref":"四、石綿的法規與殘留暴露"}},{"qid":"c15q11","q":"下列何種粉塵最容易造成肺纖維化（塵肺症）？","options":["石英砂（結晶型游離二氧化矽）","水泥砂","石灰","碳酸鈣"],"answer":0,"recon":"full","src":["113-1","113-6","113-10","113-11","114-01","整理-表格"],"optexp":["**符合／正確（本題答案）**：結晶型游離二氧化矽（石英、方矽石、鱗矽石）纖維化能力最強，造成矽肺症，IARC 1997 年列為 Group 1；含結晶型二氧化矽 10% 以上的礦物性粉塵在分級指引列為第一種粉塵。","**不符合／錯誤**：水泥砂的游離矽含量低，屬厭惡性／低纖維化粉塵，主要是刺激與慢性支氣管炎、皮膚炎（六價鉻）。","**不符合／錯誤**：石灰（氧化鈣、氫氧化鈣）是刺激性鹼性粉塵，不造成纖維化。","**不符合／錯誤**：碳酸鈣（石灰石、大理石）屬厭惡性粉塵，肺內可溶解清除，不致塵肺。"],"explanation":"本題考粉塵的纖維化能力排序。最強的是結晶型游離二氧化矽（石英、方矽石、鱗矽石，非結晶型如矽藻土為 Group 3 不算），其次石綿、煤塵、滑石、高嶺土等矽酸鹽；水泥、石灰、碳酸鈣、氧化鐵、錫、鋇屬厭惡性或良性粉塵。113-10 回憶版「採礦業各種粉塵危害最大的是二氧化矽」是同一考點。法規面：分級指引（111 年）的粉塵容許濃度表以 %SiO2 分四種——第一種粉塵（含結晶型游離二氧化矽 10% 以上）可呼吸性 10/(%SiO2+2)、總粉塵 30/(%SiO2+2) mg/m3，第二種（未滿 10%）1 與 4 mg/m3，第三種石綿 0.15 f/cc，第四種厭惡性 5 與 10 mg/m3；現行容許暴露標準附表二（114 年修正、116 年 1 月 1 日施行）已改為結晶型游離二氧化矽可呼吸性粉塵 0.1 mg/m3 單一值。","dispute":"","review":{"key_points":["纖維化能力：==結晶型游離二氧化矽==（石英、方矽石、鱗矽石）最強；水泥、石灰、碳酸鈣＝厭惡性粉塵","第一種粉塵＝含結晶型游離二氧化矽 ==10% 以上==；分級指引 PEL 依 %SiO2 計算（10/(%SiO2+2)）","現行附表二（116.1.1 施行）：結晶型游離二氧化矽可呼吸性 ==0.1 mg/m3=="],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"將結晶型游離二氧化矽列為第一類"},{"src":"0000387836","file":"_ref/annex_pel/0000387836.txt","quote":"結晶型游離二氧化矽係指石英、方矽石及"},{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"含結晶型游離二氧化矽 10%以"}],"note_ref":"五、粉塵容許濃度與法定檢查"}},{"qid":"c15q12","q":"塵肺症胸部 X 光判讀（ILO 分類）中，p、q、r 代表什麼？","options":["圓形小陰影的大小","不規則小陰影的大小","大陰影的大小","圓形小陰影的密度"],"answer":0,"recon":"full","src":["113-2","113-4","113-11","114-03","114-04","114-05"],"optexp":["**符合／正確（本題答案）**：ILO 分類中 p、q、r 是圓形小陰影的大小：p 直徑 \u003c1.5 mm、q 1.5–3 mm、r 3–10 mm。","**不符合／錯誤**：不規則小陰影的大小用 s（細）、t（較粗）、u（粗）表示。","**不符合／錯誤**：大陰影（最大直徑 1 cm 以上）用 A、B、C：A 總和直徑 \u003c5 cm，B 介於 A 與 C，C 總面積超過右上肺區（右肺上三分之一）之面積。","**不符合／錯誤**：密集度（profusion）用 0–3 級（0/-、0/0…3/+ 的 12 小類）表示，不是 p/q/r。"],"explanation":"本題考 ILO 塵肺症 X 光國際分類的符號系統。小陰影（\u003c1 cm）分形狀與大小：圓形 p（\u003c1.5 mm）、q（1.5–3 mm）、r（3–10 mm）；不規則 s（細線狀）、t（較粗）、u（粗）。密集度 0–3 級，記錄為主要／次要（如 1/0、2/1），1 稀疏（肺紋理可見）、2 密集、3 極密（肺紋理模糊）。大陰影（≥1 cm）：A 總和直徑 \u003c5 cm；B 介於 A、C 之間；C 總面積超過右上肺區（右肺上三分之一）之面積。另記肋膜異常（肋膜斑、瀰漫性增厚、鈣化）與符號（如 es 蛋殼鈣化、tb 結核）。矽肺症典型是上肺野 p/q 圓形陰影，石綿肺症是下肺野 s/t 不規則陰影。114-04 回憶版整理：「p/q/r 圓形小陰影大小 (o)；不規則 stu；大陰影 ABC；密度 0123」。","dispute":"","review":{"key_points":["圓形小陰影：==p \u003c1.5 mm、q 1.5–3 mm、r 3–10 mm==；不規則：s、t、u","密集度 0–3；大陰影（≥1 cm）：A 總和直徑 \u003c5 cm、B 介於、C 超過右上肺區（右肺上 1/3）面積","矽肺＝上肺野 p/q；石綿肺＝下肺野 s/t"],"refs":[{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"p：圓形陰影其直徑 \u003c1.5mm。"},{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"s：細的不規則或線狀陰影。"},{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"A：大陰影總和直徑 \u003c5cm。"}],"note_ref":"六、ILO 分類與塵肺症分型"}},{"qid":"c15q13","q":"依塵肺症 X 光照像分型基準，「證明有大陰影者」屬於第幾型？","options":["第一型","第二型","第三型","第四型"],"answer":3,"recon":"full","src":["113-2","114-05","115-01"],"optexp":["**不符合／錯誤**：第一型是兩肺野有少數粒狀影或不規則陰影，且無大陰影。","**不符合／錯誤**：第二型是多數粒狀影或不規則陰影，且無大陰影。","**不符合／錯誤**：第三型是極多粒狀影或不規則陰影，且無大陰影。","**符合／正確（本題答案）**：第四型定義就是「證明有大陰影者」，不論小陰影多寡。"],"explanation":"本題考塵肺症 X 光照像分型基準（勞工保險塵肺症審定準則，民國 84 年）的四型：第一型——兩肺野有因塵肺發生之少數粒狀影或不規則陰影，且無大陰影；第二型——多數，且無大陰影；第三型——極多，且無大陰影；第四型——有大陰影者。大陰影即 ILO 的 A/B/C（最大直徑 1 cm 以上）。這套分型用於職業病認定與勞保給付，矽肺症認定指引的主要基準就是「胸部 X 光依國際勞工聯盟分類第一型以上」；台灣早年調查以第一型最多（55.9%）。115-01 回憶版完整列出四型定義，題目也可能反過來問「兩肺野少數粒狀影且無大陰影屬第幾型」（第一型）。","dispute":"","review":{"key_points":["塵肺 X 光分型：第一型少數、第二型多數、第三型極多（皆無大陰影）；==第四型＝有大陰影==","大陰影＝最大直徑 ==≥1 cm==（ILO A/B/C）","矽肺症認定主要基準：X 光依 ILO 分類第一型以上"],"refs":[{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"(4)第四型：有大陰影者"},{"src":"10職業性矽肺症及煤礦工作塵肺症認定參考指引","file":"_ref/認定指引/all/10職業性矽肺症及煤礦工作塵肺症認定參考指引.txt","quote":"少數粒狀影或不規則陰影，且無大陰影者"}],"note_ref":"六、ILO 分類與塵肺症分型"}},{"qid":"c15q14","q":"有關粉塵之定義與容許濃度，下列敘述何者錯誤？","options":["粒徑 100 μm 以下稱可吸入性粉塵，10 μm 以下稱胸腔性粉塵，4 μm 以下稱可呼吸性粉塵","可呼吸性粉塵之採樣需經分粒裝置（如旋風分離器）分離","第一種粉塵（含結晶型游離二氧化矽 10% 以上）之容許濃度依二氧化矽百分比計算","可呼吸性粉塵因粒徑小、不易沉積肺部，對健康危害最小"],"answer":3,"recon":"rebuilt","src":["114-03","整理-表格"],"optexp":["**正確**：依 ACGIH／ISO 採樣慣例，可吸入性粉塵截取粒徑 100 μm、胸腔性 10 μm、可呼吸性 4 μm，敘述正確。","**正確**：可呼吸性粉塵採樣需經分粒裝置（旋風分離器或衝擊器）先把大顆粒分離，只收集會進入無纖毛呼吸道的部分。","**正確**：分級指引（111 年）的粉塵容許濃度：第一種粉塵（含結晶型游離二氧化矽 10% 以上）可呼吸性 10/(%SiO2+2) mg/m3、總粉塵 30/(%SiO2+2) mg/m3，依二氧化矽百分比計算；現行附表二已改為可呼吸性 0.1 mg/m3 單一值，但考試當時仍以此為準。","**錯誤（本題答案）**：可呼吸性粉塵正因粒徑小才能到達並沉積於肺泡，清除不掉會累積，健康危害最大，不是最小。"],"explanation":"本題整合粉塵定義與容許濃度。粒徑分類：可吸入性 \u003c100 μm、胸腔性 \u003c10 μm、可呼吸性 \u003c4 μm（會進入無纖毛呼吸道，需分粒裝置採樣），危害以可呼吸性最大。容許濃度（分級指引 111 年版）：第一種粉塵（結晶型游離二氧化矽 ≥10%）可呼吸性 10/(%SiO2+2)、總粉塵 30/(%SiO2+2) mg/m3；第二種（\u003c10%）1 與 4 mg/m3；第三種石綿 0.15 f/cc；第四種厭惡性粉塵 5 與 10 mg/m3。現行容許暴露標準附表二（114.4.11 修正，116.1.1 施行）簡化為：結晶型游離二氧化矽可呼吸性粉塵 0.1 mg/m3、石綿 0.15 f/cc（纖維長 ≥5 μm、徑 \u003c3 μm、長寬比 ≥3）、厭惡性粉塵可呼吸性 5、總粉塵 10 mg/m3，考試若問「現行」要用這組。","dispute":"","review":{"key_points":["可呼吸性粉塵 \u003c4 μm、需==分粒裝置==採樣、==危害最大==","分級指引 PEL：第一種 10/(%SiO2+2) 與 30/(%SiO2+2)；第二種 1／4；石綿 0.15 f/cc；厭惡性 5／10 mg/m3","現行附表二（116.1.1）：結晶型矽可呼吸性 ==0.1 mg/m3==、石綿 0.15 f/cc、厭惡性 5／10"],"refs":[{"src":"0000387836","file":"_ref/annex_pel/0000387836.txt","quote":"可呼吸性粉塵係指會進入無纖毛呼吸道之粉塵"},{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"第三種粉塵 石綿纖維 0.15 f/cc"},{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"第四種粉塵 厭惡性粉塵 5 mg/m3 10 mg/m3"}],"note_ref":"五、粉塵容許濃度與法定檢查"}},{"qid":"c15q15","q":"下列何者不是粉塵作業特殊健康檢查之法定項目？","options":["胸部 X 光（大片）攝影","肺功能檢查（FVC、FEV1、FEV1/FVC）","肺部電腦斷層","肺結核、哮喘、塵肺症、心臟疾病既往病史調查"],"answer":2,"recon":"full","src":["113-9","113-11"],"optexp":["**正確**：附表十粉塵作業體格與健康檢查都要做胸部 X 光（大片）攝影。","**正確**：肺功能檢查包括 FVC、FEV1 及 FEV1/FVC，是粉塵作業法定項目。","**錯誤（本題答案）**：肺部電腦斷層（HRCT）是進一步評估工具，不是附表十的法定項目；附表十只有 X 光與肺功能。","**正確**：既往病史調查明列肺結核、哮喘、塵肺症、心臟疾病。"],"explanation":"本題考附表十粉塵作業的法定項目：(1) 作業經歷、生活習慣及自覺症狀之調查；(2) 肺結核、哮喘、塵肺症、心臟疾病等既往病史之調查；(3) 呼吸系統及心臟循環之身體檢查；(4) 胸部 X 光（大片）攝影檢查；(5) 肺功能檢查（FVC、FEV1 及 FEV1/FVC）。體格檢查與健康檢查項目相同。石綿作業項目類似但身體檢查加「含杵狀指」及皮膚。高解析度電腦斷層對早期纖維化、毛玻璃變化更敏感，矽肺症認定指引把它列為進一步檢查，但不在法定健檢內。分級：疑似 ILO 塵肺陰影、肺功能減損等異常→第三／四級；陳舊性肺結核鈣化結節可由工作以外原因解釋→第二級。紀錄保存 30 年。","dispute":"","review":{"key_points":["粉塵作業法定項目：既往病史（==肺結核、哮喘、塵肺症、心臟疾病==）、呼吸與心臟循環身體檢查、胸部 X 光大片、肺功能（FVC、FEV1、FEV1/FVC）","==HRCT 非法定項目==，是進一步評估工具","石綿作業加杵狀指與皮膚檢查；紀錄皆保存 30 年"],"refs":[{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"肺結核、哮喘、塵肺症、心臟"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"胸部Ｘ光（大片）攝影檢查"},{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"呼吸系統及心臟循環之"}],"note_ref":"五、粉塵容許濃度與法定檢查"}},{"qid":"c15q16","q":"肺功能檢查：FEV1 為預測值 60%、FVC 為預測值 70%、FEV1/FVC 為 60%。最符合下列何種判讀？","options":["限制型","阻塞型","正常","純混合型（需 TLC 降低）"],"answer":1,"recon":"partial","src":["113-12","整理-表格"],"optexp":["**不符合／錯誤**：限制型的定義是 FVC 減少而 FEV1/FVC 正常或升高（≥70%），本題 FEV1/FVC 60% 已低於 70%，不是單純限制型。","**符合／正確（本題答案）**：FEV1/FVC 60% \u003c70%（或低於正常下限）即為阻塞型通氣功能障礙，嚴重度再依 FEV1 % 預測值分級（60% 屬中度）。","**不符合／錯誤**：正常需 FVC ≥80% 預測值且 FEV1/FVC ≥70%，本題兩者皆不符。","**不符合／錯誤**：混合型需 FEV1/FVC \u003c70% 且 TLC \u003c80% 預測值才能確認；肺量計看到 FVC 70% 偏低只是「疑似」合併限制，沒有 TLC 不能判定純混合型。"],"explanation":"本題考肺量計判讀的決策順序：先看 FEV1/FVC，再看 FVC（或 TLC）。分級指引完整版的判讀：正常＝FVC ≥80% 預測值且 FEV1/FVC ≥70%；阻塞型＝FEV1/FVC \u003c70%，嚴重度依 FEV1（或 FVC）% 預測值分輕（≥80）、中（50–79）、重（30–49）、極重（\u003c30）；限制型＝FEV1 與 FVC 都下降但 FEV1/FVC ≥70% 且 FVC \u003c80%，確診需 TLC \u003c80% 預測值；混合型＝FEV1/FVC \u003c70% 且 TLC \u003c80%。本題 FEV1 60%、FVC 70%、FEV1/FVC 60%→阻塞型（中度），FVC 偏低可能是氣體滯留造成，要靠 TLC 才能說合併限制。塵肺症以限制型為主，但煤礦工與吸菸者常合併阻塞。","dispute":"回憶版（113-12、【整理】表格）題目數字記為 FVC 70 幾%、FEV1 60 幾%、FEV1/FVC 90 幾% 但答案為阻塞型；FEV1/FVC 90% 的話依定義不可能是阻塞型，數字顯然誤記。本題已重建為一致的阻塞型數字（FEV1/FVC 60%），應試時只要記住「FEV1/FVC \u003c70% 即阻塞、FVC 低而比值正常即限制（需 TLC 確認）」。","review":{"key_points":["阻塞型：==FEV1/FVC \u003c70%==；嚴重度依 % 預測值輕 ≥80、中 50–79、重 30–49、極重 \u003c30","限制型：FVC \u003c80% 且 FEV1/FVC ≥70%，確診需 ==TLC \u003c80%==；混合型＝比值 \u003c70% 且 TLC \u003c80%","正常：FVC ≥80% 且 FEV1/FVC ≥70%；塵肺以限制型為主"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"阻塞型通氣功能障礙 [27]: FEV1/FVC\u003c70%"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"正常：FVC,% Pred ≧ 80 % 且 FEV1/FVC ≧ 70%"}],"note_ref":"七、肺功能檢查的品質與判讀"}},{"qid":"c15q17","q":"判讀肺量計（spirometry）圖形之可接受性與可重複性時，下列何者正確？","options":["至少需三次可接受之測試，且最大二次 FVC 與 FEV1 之差異在 150 mL 以內","呼氣時間須達 15 秒 FVC 才算可接受","三條曲線重疊性高就代表檢查一定準確","只要一次測試即可判讀"],"answer":0,"recon":"rebuilt","src":["113-3","114-01","115-02"],"optexp":["**符合／正確（本題答案）**：ATS/ERS 標準要求至少三次可接受的用力呼氣，可重複性為兩個最大 FVC 之間與兩個最大 FEV1 之間的差異皆 ≤0.150 L（150 mL），分級指引完整版寫「至少取得三次可接受的測量結果，其中 2 個最大 FVC 值的差異以及 2 個最大 FEV1 值的差異都應小於 0.15 升」。","**不符合／錯誤**：呼氣時間不是「須達 15 秒」；可接受性的用力呼氣終點（EOFE）只需符合三項之一：呼氣高原（最後 1 秒 ≤0.025 L）、呼氣時間 ≥15 秒、或 FVC 在重複性範圍內或大於先前最大 FVC。回憶版「FVC 沒吹滿 15 秒所以不準」是錯的（舊版 2005 標準用 6 秒）。","**不符合／錯誤**：三條曲線重疊性高只代表「可重複」，若三次都有起始遲緩、咳嗽、提早終止或漏氣，重複的錯誤仍是錯誤，準確度要先看可接受性。","**不符合／錯誤**：一次測試無法判斷可重複性，至少三次可接受、最多 8 次。"],"explanation":"本題考肺量計的品質判讀，分「可接受性」與「可重複性」兩層。可接受性（每一次吹氣）：反向外推容積 BEV \u003c5% FVC 或 0.1 L（起始要用力）、第一秒無咳嗽、無聲門閉合、無漏氣或阻塞口含器、無零流量錯誤，且達到三個 EOFE 指標之一——呼氣高原（最後 1 秒 ≤0.025 L）、呼氣時間 ≥15 秒、或 FVC 在重複性範圍內／大於先前最大 FVC。可重複性：至少三次可接受，兩個最大 FVC 差 ≤0.150 L、兩個最大 FEV1 差 ≤0.150 L（FVC ≤1 L 者用 0.100 L），不符可再測、最多 8 次。回憶版考題給圖問「FEV1 準不準」「沒吹滿 15 秒不準嗎」「三條線重疊代表準嗎」，答法是：看起始與終止是否可接受，15 秒只是 EOFE 選項之一，重疊只證明可重複。","dispute":"","review":{"key_points":["可重複性：至少 ==3 次== 可接受，兩最大 FVC 差與兩最大 FEV1 差皆 ==≤150 mL==；最多 8 次","可接受性：BEV \u003c5% FVC 或 0.1 L、第一秒無咳嗽、無聲門閉合、無漏氣＋EOFE 三選一（高原 ≤0.025 L/1 s、呼氣 ≥15 秒、FVC 達重複範圍）","曲線重疊＝可重複≠準確；一次測試不能判讀"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"測試結果至少要獲得三個符合可接受性準則的肺量圖"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"兩個最大 FVC 值之間的差異必須 ≤0.150 L"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"呼氣時間 ≥15 秒"}],"note_ref":"七、肺功能檢查的品質與判讀"}},{"qid":"c15q18","q":"依附表十二，粉塵作業選配工時宜考量之疾病為何？","options":["心血管疾病、慢性阻塞性肺疾病、慢性支氣管炎、氣喘","貧血、肝病","聽力障礙","腎臟疾病"],"answer":0,"recon":"rebuilt","src":["整理-表格"],"optexp":["**符合／正確（本題答案）**：附表十二粉塵作業選配工時宜考量之疾病為心血管疾病、慢性阻塞性肺疾病、慢性氣管炎、氣喘等；石綿作業相同，分級指引另加妊娠中勞工之健康保護。","**不符合／錯誤**：貧血、肝病是苯、鉛、四氯化碳等血液或肝毒物作業的考量疾病，與粉塵無關。","**不符合／錯誤**：聽力障礙是噪音作業的考量疾病。","**不符合／錯誤**：腎臟疾病是鎘、鉛、汞、四氯乙烷等腎毒物作業的考量疾病。"],"explanation":"本題考附表十二（選配工時宜考量疾病之建議表）中呼吸道作業的一組：粉塵、石綿作業皆為「心血管疾病、慢性阻塞性肺疾病、慢性氣管炎、氣喘等」；鈹作業加接觸性皮膚疾病與肝炎、腎病；二異氰酸酯類為氣喘、慢性氣管炎、過敏；鎳為呼吸系統疾病、皮膚炎。邏輯是：粉塵會加重既有的阻塞性肺病與心肺負荷，所以有 COPD、氣喘、心血管疾病者不宜配置。法源是勞工健康保護規則第 23 條：雇主應參採醫師依附表十二之建議，告知勞工並適當配置，不能適應原有工作者應變更作業場所、更換工作或縮短工時。其他常考配對：噪音→聽力障礙；高溫→心血管、腎、甲狀腺；鉛→貧血、神經、腎；有機溶劑→肝、神經。","dispute":"","review":{"key_points":["粉塵、石綿作業考量疾病：==心血管疾病、COPD、慢性氣管炎、氣喘==（＋妊娠）","鈹加皮膚與肝腎；二異氰酸酯＝氣喘、氣管炎、過敏；鎳＝呼吸系統疾病、皮膚炎","法源：勞工健康保護規則第 ==23== 條，參採附表十二建議適當配置"],"refs":[{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"心血管疾病、慢性阻塞性肺疾病、慢性氣管炎、氣"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"參採醫師依附表十二規定之建議，告知勞工，並適當配置勞工於工作場所作業"},{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"考量不適合從事作業之疾病，如心血管疾病、慢性肺阻塞性疾"}],"note_ref":"五、粉塵容許濃度與法定檢查"}}]},{"idx":15,"order":15,"title":"職業性皮膚病","group":"粉塵、皮膚、肌骨與神經","gi":5,"notes_md":"本章約 20 題，考職業性皮膚病的流行病學、第一型 vs 第四型免疫型態、貼膚試驗的時程與偽陰／偽陽性、白斑與皮膚癌的致病物，以及各行業的刺激原與過敏原。\n\n## 一、職業性皮膚病總論\n- 職業性皮膚病＝最常見的職業病；約 95% 為接觸性皮膚炎，90% 以上屬濕疹（病變在==表皮==：海綿樣水腫、表皮內水泡）。\n- ==刺激性接觸性皮膚炎（ICD）最常見==（教科書約 80%）：非免疫、任何人接觸足量足久皆發生（濕手工作、清潔劑、溶劑、切削油、酸鹼、水泥、玻璃纖維）。\n- ACD：==第四型== T 細胞、需致敏、少數人、極少量即誘發；常見過敏原鉻、鎳、鈷、香料、環氧樹脂、thiuram、對苯二胺。\n- 好發部位＝==手部==；診斷要件：暴露史、型態部位、病程（工作惡化休假改善）、貼膚試驗、同事類似症狀。\n- 致病因子四類：化學性（主因）、機械性（磨擦壓力）、==物理性（冷熱、振動、光、紫外線、放射線）==、生物性（微生物、動植物）。\n- 既有嚴重手部濕疹者不宜從事美容美髮等濕手工作；疣、灰指甲可治療。\n\n## 二、接觸性蕁麻疹與乳膠過敏\n| | 接觸性蕁麻疹 | 過敏性接觸皮膚炎 |\n|---|---|---|\n| 免疫型 | ==第一型 IgE==／非免疫性直接釋放組織胺 | 第四型 T 細胞 |\n| 時程 | 數分鐘至 1 小時風疹塊，可致休克 | 24–72 小時濕疹樣病灶 |\n| 檢查 | 開放塗抹、==點刺（15–30 分鐘）==、特異性 IgE（RAST） | ==貼膚試驗== |\n- 乳膠手套：乳膠==蛋白==→第一型；橡膠==添加劑==（thiuram、carbamate）→第四型。問「乳膠蛋白」答第一型、問「乳膠手套」兩型皆可能。醫院其他過敏原：甲醛、戊二醛、麻醉劑、抗生素。\n\n## 三、貼膚試驗\n- 判讀 ==48 小時及 72 或 96 小時==；金屬、neomycin、對苯二胺等遲發反應物第 ==7== 天再看。刺激反應漸退、過敏反應漸強→必須二次判讀。\n- 偽陰性：全身性類固醇／免疫抑制劑、近期紫外線、過敏原濃度不足或吸收不佳、貼片脫落、判讀太早。偽陽性：==嚴重活動性濕疹（angry back）==、刺激性反應。\n- 陽性要配合病灶與病史；陰性不能排除。外用藥最常致敏：==抗生素 neomycin／bacitracin、局部麻醉劑 benzocaine==；類固醇藥膏少見。\n\n## 四、特殊型態的職業性皮膚病\n- 空氣傳播性接觸皮膚炎：粉塵、噴霧、揮發物（環氧樹脂、木粉、水泥、菊科植物），==職業暴露為主==，對稱、暴露部位＋==曬不到的皺摺處（眼皮、耳後、下頜下）也有==（與光敏感鑑別）。\n- 化學性白斑：==酚類、兒茶酚類==（對第三丁基苯酚 PTBP、對苯二酚單苯醚；黏著劑、合成橡膠、消毒劑）；選項無酚類時選==砷==（青銅色色素沉著夾雜脫色斑、掌蹠角化、Mee 氏線）。\n- 切削油：水性→ICD 最常見；防腐劑、鉻鎳→ACD；油性→油性痤瘡；礦物油長期→皮膚癌、陰囊癌。氯痤瘡＝氯化芳香烴。玻璃纖維→機械性刺激性皮膚炎（劇癢、細丘疹、摩擦處）。\n\n## 五、各行業的刺激原與過敏原\n| 行業 | 刺激原 | 過敏原 |\n|---|---|---|\n| 橡膠業 | ==滑石、硬脂酸鋅、溶劑== | 橡膠添加劑、對苯二胺 |\n| 機械金屬 | 溶劑、切削油 | 切削油防腐劑、鉻、鎳 |\n| 建築業 | 酸、玻璃纖維、水泥 | 水泥六價鉻、鈷、環氧樹脂 |\n| 醫療業 | 濕手工作、肥皂、酒精 | 乳膠手套、麻醉劑、抗生素、甲醛、戊二醛 |\n| 美容美髮 | 濕手工作、清潔劑、燙髮藥水 | 染劑（對苯二胺）、甲基丙烯酸酯、防腐劑 |\n- 通則：溶劑、酸鹼、清潔劑、粉塵纖維、水＝刺激；金屬、樹脂、橡膠添加劑、染料、防腐劑、香料、乳膠蛋白＝過敏。\n\n## 六、職業性皮膚癌\n- ==煤焦油、瀝青、煤煙（PAH；掃煙囪陰囊癌）、礦物油／頁岩油（陰囊癌）、砷（波汶氏病、BCC、SCC；最小累積 1 年、最長潛伏 5 年）、紫外線、游離輻射、巴拉刈==。乳膠、水泥、溶劑不致癌。","questions":[{"qid":"c16q01","q":"最常見的職業性皮膚病為何？","options":["刺激性接觸皮膚炎（irritant contact dermatitis, ICD）","過敏性接觸皮膚炎（allergic contact dermatitis, ACD）","接觸性蕁麻疹","職業性痤瘡"],"answer":0,"recon":"full","src":["113-2","113-4","113-10","113-11","114-01","114-04"],"optexp":["**符合／正確（本題答案）**：職業性皮膚病認定指引明寫「刺激性接觸性皮膚炎為最常見的職業性皮膚病」；它是非免疫性發炎反應，任何人接觸足量、足久的刺激物（溶劑、清潔劑、切削油、酸鹼、濕手工作）都會發生，不需致敏過程。","**不符合／錯誤**：過敏性接觸皮膚炎是第四型遲發型過敏，需先致敏、只有少數體質者發生，比例低於刺激性；教科書常引 ICD 約 80%、ACD 約 20%。","**不符合／錯誤**：接觸性蕁麻疹（第一型或非免疫性）在職業性皮膚病中相對少見，多見於乳膠、食物蛋白、動物接觸。","**不符合／錯誤**：職業性痤瘡（油性痤瘡、氯痤瘡）是特定暴露（礦物油、氯化芳香烴）的表現，比例遠低於接觸性皮膚炎。"],"explanation":"本題考職業性皮膚病的流行病學。指引指出職業性皮膚病是職業病中最常見的一種，其中約 95% 是接觸性皮膚炎，90% 以上屬濕疹類病變；接觸性皮膚炎分刺激性（ICD，非免疫性，任何人皆可發生，佔多數，教科書常引約 80%）與過敏性（ACD，第四型過敏，需致敏，少數人發生）。指引引用台大資料時寫刺激性與過敏性約各佔半數，但結論仍是「刺激性接觸性皮膚炎為最常見的職業性皮膚病」。常見 ICD 致因：濕手工作、肥皂清潔劑、溶劑、切削油、酸鹼、水泥、玻璃纖維；常見 ACD 過敏原：鉻、鎳、鈷、香料、環氧樹脂、橡膠添加劑（thiuram）、對苯二胺。好發部位為手部。","dispute":"","review":{"key_points":["職業性皮膚病＝最常見的職業病；約 95% 為接觸性皮膚炎，90% 以上屬濕疹","==刺激性接觸性皮膚炎（ICD）最常見==（教科書約 80%）；非免疫、任何人接觸足量皆發生","ACD＝第四型、需致敏、少數人；常見過敏原鉻、鎳、鈷、香料、環氧樹脂、thiuram、對苯二胺"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"刺激性接觸性皮膚炎為最常見的職業性皮膚病"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"職業性皮膚病是職業病中最常見的一種病"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"90 %以上屬於濕疹類病變"}],"note_ref":"一、職業性皮膚病總論"}},{"qid":"c16q02","q":"職業性皮膚病最常發生於身體何部位？","options":["臉部","手部","軀幹","下肢"],"answer":1,"recon":"full","src":["113-2","114-01","114-03"],"optexp":["**不符合／錯誤**：臉部是空氣傳播性接觸皮膚炎與光敏感皮膚炎的好發處，但整體比例遠低於手部。","**符合／正確（本題答案）**：指引寫「在職業性皮膚病人來說，手是好發部位」，手部（手背、指縫、手腕）與工作物質直接接觸最多，約 80–90% 的職業性接觸皮膚炎在手，其次為前臂。","**不符合／錯誤**：軀幹多被衣物保護，只有職業性痤瘡（衣著摩擦處）或玻璃纖維皮膚炎會累及。","**不符合／錯誤**：下肢暴露機會少，除非工作靴、水泥（膝部）等特殊情境。"],"explanation":"本題考病灶部位的診斷意義。指引強調「濕疹必定是發生在首當其衝的部位」，皮膚病出現的位置必須與工作上的接觸暴露相關；若只局限在手部就要考慮外因性濕疹，職業性皮膚病以手為好發部位，其次前臂、臉部（空氣傳播、光敏感）。診斷職業相關性的五個要件：(1) 有暴露史（SDS、工廠訪視）；(2) 病變型態與部位符合（濕疹樣病變在手部）；(3) 病程——工作時復發或惡化、休假時改善；(4) 貼膚試驗或其他檢查；(5) 同事有類似症狀。手部濕疹要與異位性皮膚炎、汗皰疹、乾癬、黴菌感染（KOH）鑑別。","dispute":"","review":{"key_points":["職業性皮膚病好發部位＝==手部==（手背、指縫、手腕），其次前臂、臉部","病灶部位必須與工作接觸相符；空氣傳播性→臉部與暴露部位","診斷要件：暴露史、型態部位、病程（工作惡化休假改善）、貼膚試驗、同事類似症狀"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"在職業性皮膚病人來說，手是好發部位"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"濕疹樣的皮膚病變發生在手部"}],"note_ref":"一、職業性皮膚病總論"}},{"qid":"c16q03","q":"濕疹（接觸性皮膚炎）的主要病變位於皮膚哪一層？","options":["表皮（epidermis）","真皮淺層","真皮深層","皮下組織"],"answer":0,"recon":"full","src":["113-2","113-4","113-11"],"optexp":["**符合／正確（本題答案）**：濕疹（接觸性皮膚炎）的組織學特徵是表皮海綿樣水腫（spongiosis）、表皮內水泡與角化不全，病變主體在表皮；指引描述職業性皮膚病 90% 以上屬濕疹類病變（紅腫、脫皮、結痂、急性時小疱）。","**不符合／錯誤**：真皮淺層只有血管周圍的淋巴球浸潤，是伴隨反應，不是主要病變所在。","**不符合／錯誤**：真皮深層病變見於硬皮症、深部血管炎，不是濕疹。","**不符合／錯誤**：皮下組織病變是脂膜炎、結節性紅斑的層次，與濕疹無關。"],"explanation":"本題考濕疹的病理層次。急性濕疹：表皮細胞間水腫（海綿樣變化）→表皮內小水泡→滲出、結痂；慢性濕疹：表皮增厚（棘皮症）、角化過度與角化不全、苔癬化；真皮僅淺層血管周圍發炎浸潤。所以「主要病變在表皮」。這也解釋臨床表現：刺激物或過敏原從外向內作用，先破壞角質層屏障（刺激性）或由 Langerhans 細胞呈現抗原（過敏性），病灶都是紅腫、丘疹、小水泡、脫屑、龜裂、增厚。鑑別上，指引提到需與異位性皮膚炎、神經性皮膚炎等內因性濕疹區分，必要時做 KOH 真菌檢查與皮膚切片。","dispute":"","review":{"key_points":["濕疹主要病變在==表皮==：海綿樣水腫、表皮內水泡、角化不全；慢性→棘皮症、苔癬化","真皮只有淺層血管周圍浸潤；深層與皮下病變不是濕疹","鑑別：異位性、神經性皮膚炎、黴菌（KOH）、乾癬；必要時切片"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"90 %以上屬於濕疹類病變"}],"note_ref":"一、職業性皮膚病總論"}},{"qid":"c16q04","q":"接觸性蕁麻疹（contact urticaria）屬於下列何種免疫反應？","options":["第一型（IgE 媒介之立即型過敏）","第二型（細胞毒性）","第三型（免疫複合體）","第四型（遲發型細胞免疫）"],"answer":0,"recon":"full","src":["113-2","113-10","113-11"],"optexp":["**符合／正確（本題答案）**：免疫性接觸性蕁麻疹由過敏原專一性 IgE 媒介，接觸後數分鐘至 1 小時內出現風疹塊，嚴重可致全身反應甚至休克（乳膠、食物蛋白、動物皮屑），屬第一型立即型過敏。","**不符合／錯誤**：第二型細胞毒性反應是抗體對細胞表面抗原（如藥物引起溶血、血小板減少），與蕁麻疹無關。","**不符合／錯誤**：第三型免疫複合體反應是血清病、Arthus 反應、部分血管炎，不是蕁麻疹的機轉。","**不符合／錯誤**：第四型遲發型細胞免疫是過敏性接觸皮膚炎的機轉，發作在 24–72 小時後，與立即出現的風疹塊不同。"],"explanation":"本題考接觸性蕁麻疹的免疫分類，並與 ACD 對照。接觸性蕁麻疹分兩類：免疫性（IgE 媒介，第一型）——乳膠蛋白、食物蛋白、動物，可伴鼻炎、氣喘、過敏性休克；非免疫性——直接釋放血管活性物質（如安息香酸、肉桂醛、蕁麻），不需致敏。指引把天然乳膠歸為巨分子量物質過敏原，並要求對光敏感或接觸性蕁麻疹實施特殊檢查（光貼膚測試、點刺測試）。對照表：第一型 IgE→蕁麻疹、氣喘、休克，檢查用點刺、開放塗抹、RAST；第四型 T 細胞→過敏性接觸皮膚炎，24–72 小時濕疹樣病灶，檢查用貼膚試驗。乳膠手套同時可引起兩者（蛋白→第一型；橡膠添加劑→第四型）。","dispute":"","review":{"key_points":["接觸性蕁麻疹（免疫性）＝==第一型 IgE==，數分鐘至 1 小時風疹塊，可致休克；非免疫性＝直接釋放血管活性物質","ACD＝第四型 T 細胞，24–72 小時濕疹樣病灶","檢查：第一型→點刺、開放塗抹、RAST；第四型→貼膚試驗"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"若是光敏感或接觸性蕁麻疹，必須實施其他特殊檢查"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"巨分子量物質：動植物來源之物質(例：天然乳膠)"}],"note_ref":"二、接觸性蕁麻疹與乳膠過敏"}},{"qid":"c16q05","q":"接觸性蕁麻疹的檢測方式，下列何者正確？","options":["開放性塗抹試驗（open application test）或皮膚點刺試驗（prick test），並於 15–30 分鐘內判讀；部分過敏原可抽血驗特異性 IgE（RAST）","貼膚試驗於 48 小時判讀","只能以皮膚切片診斷","以血中組織胺濃度診斷"],"answer":0,"recon":"rebuilt","src":["113-1","114-04"],"optexp":["**符合／正確（本題答案）**：立即型反應要用立即型檢查——開放性塗抹試驗（把可疑物塗在前臂觀察 15–30 分鐘）、皮膚點刺試驗（prick test），或抽血測特異性 IgE（RAST／ImmunoCAP），指引明寫接觸性蕁麻疹須實施點刺測試等特殊檢查；114-04 回憶版註「某些 contact urticaria 用抽血 RAST 檢測 (o)」。","**不符合／錯誤**：貼膚試驗 48 小時判讀是給第四型遲發型（ACD）用的，對立即型的蕁麻疹反應無法評估。","**不符合／錯誤**：皮膚切片對蕁麻疹只見真皮水腫與少量浸潤，無特異性，不是診斷方法。","**不符合／錯誤**：血中組織胺半衰期極短、變異大，臨床不用來診斷接觸性蕁麻疹。"],"explanation":"本題考「反應型態決定檢查方法」。第一型（接觸性蕁麻疹、乳膠過敏）：開放塗抹試驗、點刺試驗、必要時抽血驗特異性 IgE（RAST、ImmunoCAP），判讀在 15–30 分鐘內看風疹塊；點刺有全身反應風險，需有急救準備。第四型（ACD）：貼膚試驗，48 小時與 72 或 96 小時判讀，遲發反應物（金屬、neomycin、對苯二胺）可第 7 天再看。光敏感：光貼膚試驗。113-1 回憶版直接問「contact urticaria 的檢測方式」，答法就是「立即型檢查」；答錯的典型是把 48 小時貼膚試驗套到蕁麻疹上。","dispute":"","review":{"key_points":["接觸性蕁麻疹檢查：==開放塗抹、點刺試驗（15–30 分鐘判讀）、特異性 IgE（RAST）==","貼膚試驗 48／72／96 小時＝ACD 專用；光敏感→光貼膚試驗","點刺有全身反應風險，需急救準備"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"點刺測試(prick test)"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"若是光敏感或接觸性蕁麻疹，必須實施其他特殊檢查"}],"note_ref":"二、接觸性蕁麻疹與乳膠過敏"}},{"qid":"c16q06","q":"醫療環境中最容易引起接觸性過敏（含第一型與第四型）的物質為何？","options":["乳膠手套","石綿","汞","水泥"],"answer":0,"recon":"full","src":["113-2","113-11"],"optexp":["**符合／正確（本題答案）**：乳膠手套是醫療環境最重要的接觸性過敏原——乳膠蛋白引起第一型（接觸性蕁麻疹、鼻炎、氣喘、過敏性休克），手套中的橡膠添加劑（thiuram、carbamate）引起第四型 ACD；指引列醫療業「穿戴手套(含乳膠)」為致病因。","**不符合／錯誤**：石綿不是接觸性過敏原，其危害是吸入造成石綿肺症、肺癌、間皮瘤。","**不符合／錯誤**：汞（牙科汞齊、溫度計）少數可致 ACD，但在醫療環境中遠不如乳膠常見。","**不符合／錯誤**：水泥（六價鉻）是建築業最重要的過敏原，不是醫療環境。"],"explanation":"本題考醫療環境的皮膚致病因。指引列出健康照護產業的刺激原：反覆接觸水（濕手工作）、肥皂清潔劑、酒精、藥物、環氧乙烷；過敏原：橡膠手套、麻醉劑、抗生素、甲醛、吩噻嗪類、戊二醛、對氯間二甲苯酚。乳膠手套特殊之處在於同時涵蓋第一型（乳膠蛋白，含粉手套讓蛋白飄散造成吸入性症狀）與第四型（橡膠加速劑 thiuram、carbamate、mercaptobenzothiazole）。甲醛與戊二醛（內視鏡消毒）也是醫院常見 ACD 過敏原，113-2 回憶版提到「甲醛、乳膠手套兩樣都有可能，單選選乳膠手套」。預防：改用無粉低蛋白乳膠或非乳膠（nitrile）手套。","dispute":"","review":{"key_points":["醫療環境最重要接觸性過敏原＝==乳膠手套==：蛋白→第一型；添加劑 thiuram／carbamate→第四型","醫院其他過敏原：甲醛、戊二醛、麻醉劑、抗生素、吩噻嗪；刺激原：濕手工作、清潔劑、酒精","預防：無粉低蛋白乳膠或 nitrile 手套"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"健康照護產業工作者因接觸清潔抗菌劑、穿戴手套(含乳膠)"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"橡膠手套、麻醉劑、"}],"note_ref":"二、接觸性蕁麻疹與乳膠過敏"}},{"qid":"c16q07","q":"乳膠手套過敏屬於下列何種過敏反應？","options":["僅第一型","僅第四型","第一型（乳膠蛋白）與第四型（橡膠添加劑）都有可能","第三型"],"answer":2,"recon":"full","src":["113-2","113-11"],"optexp":["**不符合／錯誤**：只答第一型漏掉了橡膠添加劑造成的第四型 ACD；若題目只問「乳膠蛋白本身」，才是單純第一型。","**不符合／錯誤**：只答第四型漏掉乳膠蛋白的 IgE 立即型反應，而後者才是乳膠過敏最危險的部分（休克）。","**符合／正確（本題答案）**：113-2 補充問答明寫「乳膠手套過敏是屬於何種過敏反應？第一型跟第四型都有可能」：乳膠蛋白→第一型接觸性蕁麻疹；橡膠添加劑（thiuram、carbamate）→第四型 ACD。","**不符合／錯誤**：第三型免疫複合體反應與乳膠過敏無關。"],"explanation":"本題考乳膠手套的雙重過敏機轉。天然乳膠蛋白（Hev b 系列）是巨分子量完全抗原，引起 IgE 媒介的第一型反應——接觸性蕁麻疹、鼻結膜炎、氣喘、過敏性休克，含粉手套會讓蛋白隨澱粉粉末飄散造成吸入暴露；手套製程中的橡膠加速劑與抗氧化劑（thiuram、carbamate、mercaptobenzothiazole）是低分子量半抗原，引起 T 細胞媒介的第四型 ACD，病灶在手背、手腕呈濕疹樣。臨床上兩者可並存。檢查對應：第一型用點刺、特異性 IgE；第四型用貼膚試驗（橡膠系列）。113-11 單選版本答「第一型」，是因為題目問的是乳膠蛋白本身，見爭議註記。","dispute":"回憶版兩種版本：113-2 補充問答答「第一型跟第四型都有可能」；113-11 單選版本答「第一型」。差別在題目問的對象——問「乳膠蛋白」則為第一型 IgE 反應；問「乳膠手套過敏」則蛋白（第一型）與橡膠添加劑（第四型）都可能。應試時先看題幹是問乳膠蛋白還是乳膠手套，若選項有「兩者皆可能」且題幹問手套，選兩者皆可能。","review":{"key_points":["乳膠==蛋白==→第一型 IgE（蕁麻疹、氣喘、休克）；橡膠==添加劑== thiuram／carbamate→第四型 ACD","題幹問「乳膠蛋白」→第一型；問「乳膠手套」→兩型皆可能","含粉手套使蛋白飄散→吸入性症狀；檢查：點刺／IgE vs 貼膚試驗"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"巨分子量物質：動植物來源之物質(例：天然乳膠)"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"屬第 4 型過敏反應"}],"note_ref":"二、接觸性蕁麻疹與乳膠過敏"}},{"qid":"c16q08","q":"有關過敏性接觸皮膚炎（ACD）之敘述，下列何者錯誤？","options":["屬第四型遲發型過敏反應","最常見的診斷方法是抽血檢驗過敏原","貼膚試驗（patch test）為診斷之黃金標準","需先致敏，再次接觸後 24–72 小時出現病灶"],"answer":1,"recon":"full","src":["113-10","114-04"],"optexp":["**正確**：指引寫過敏性接觸性皮膚炎「屬第 4 型過敏反應」，由 T 細胞媒介。","**錯誤（本題答案）**：抽血驗過敏原（特異性 IgE）只對第一型有用，對第四型的 ACD 無用；ACD 的診斷靠貼膚試驗。114-04 回憶版註「最常見診斷方法是抽血驗過敏源 (x 皮膚貼布測試)」。","**正確**：指引明寫「貼膚測試之重要是在診斷過敏性接觸性皮膚炎」，是黃金標準，用標準系列加工作相關物質。","**正確**：ACD 需先致敏（一星期到數年不等），已致敏者再接觸後數小時至數日（典型 24–72 小時）出現濕疹樣病灶。"],"explanation":"本題考 ACD 的特性與診斷。指引列出 ACD 五特性：致敏時間一星期到數年；一人可對一種或數種物質過敏；引發反應所需量非常小；皮膚反應不一定只局限接觸部位；通常只有少數人發生。與 ICD 對照：ICD 非免疫、任何人、劑量與時間相關、局限接觸部位。診斷靠貼膚試驗（48 小時及 72／96 小時判讀，遲發反應物第 7 天再看），陽性配合病灶部位與病史才有意義，陰性也不能排除；抽血 IgE、RAST 是第一型的工具。114-04 同一題還把「某些 contact urticaria 用抽血 RAST 檢測」列為正確，兩者要分清楚。","dispute":"","review":{"key_points":["ACD＝第四型 T 細胞遲發型；需致敏；再接觸 ==24–72 小時== 出現；少數人、極少量即可誘發","ACD 診斷黃金標準＝==貼膚試驗==；抽血 IgE／RAST 對第四型無用","陽性要配合病灶部位與病史；陰性不能排除"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"貼膚測試之重要是在診斷過敏性接觸性皮膚炎"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"屬第 4 型過敏反應"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"但如果結果為陰性也不能排除"}],"note_ref":"三、貼膚試驗"}},{"qid":"c16q09","q":"有關貼膚試驗（patch test）之判讀時間，下列何者正確？","options":["貼膚後 10 分鐘","貼膚後 30 分鐘","貼膚後 45 分鐘","貼膚後 48 小時（第 2 天）及 72 或 96 小時（第 3 或 4 天）"],"answer":3,"recon":"partial","src":["114-02"],"optexp":["**不符合／錯誤**：10 分鐘是點刺試驗才會看的時間尺度，貼膚試驗此時貼片都還沒拆。","**不符合／錯誤**：30 分鐘同樣屬立即型檢查（點刺、開放塗抹）的判讀時間，不是貼膚試驗。","**不符合／錯誤**：45 分鐘與貼膚試驗無關。","**符合／正確（本題答案）**：指引寫一般判讀時間為貼膚後 48 小時（Day 2）及 72 或 96 小時（Day 3 或 4）；強烈懷疑金屬、neomycin、對苯二胺等遲發反應物者可在第 7 天再判讀一次。"],"explanation":"本題考貼膚試驗的時程。標準做法：把可疑過敏原以標準化濃度貼在背部，48 小時拆除並第一次判讀（Day 2），再於 72 或 96 小時（Day 3 或 4）第二次判讀；金屬、外用抗生素 neomycin、染劑成分對苯二胺等遲發反應物（late reactor）可在第 7 天再看一次。判讀用 ICDRG 評分：+ 輕微紅斑、++ 紅斑浸潤丘疹、+++ 水泡，IR 刺激反應，NT 未測。48 小時只看一次容易把刺激反應（漸退）當成過敏反應（漸強），所以一定要有第二次判讀。114-02 回憶版的「何者錯誤」問法，三個分鐘級選項都不是貼膚試驗時間，見爭議註記。","dispute":"114-02 回憶版題目為「Patch test 判讀時間何者錯誤：A 10 分鐘、B 30 分鐘、C 45 分鐘、D 48 小時」，三個分鐘級選項都不是貼膚試驗的判讀時間，若問「何者錯誤」會有三個答案，題意不清，可能是回憶時把「何者正確」記成「何者錯誤」。本題改為「何者正確」，以 48 小時（及 72／96 小時）為正確判讀時間；應試時若遇到原版題型，判斷原則仍是「只有 48 小時是貼膚試驗的時間」。","review":{"key_points":["貼膚試驗判讀：==48 小時（Day 2）及 72 或 96 小時（Day 3 或 4）==；遲發反應物（金屬、neomycin、對苯二胺）第 ==7== 天再判讀","刺激反應漸退、過敏反應漸強→必須第二次判讀","ICDRG：+ 紅斑、++ 浸潤丘疹、+++ 水泡、IR 刺激"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"為貼膚後 48 小時(Day2)及 72 或 96 小時(Day 3 或 4)"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"可在第七天再判讀一次"}],"note_ref":"三、貼膚試驗"}},{"qid":"c16q10","q":"下列何者「不會」造成貼膚試驗偽陰性？","options":["近期紫外線（日光）暴露","近期使用大量全身性類固醇或免疫抑制劑","嚴重活動性濕疹（angry back）","過敏原濃度不足或吸收不佳"],"answer":2,"recon":"partial","src":["113-6","113-11"],"optexp":["**不符合／錯誤（此項會造成偽陰性）**：近期紫外線或日光暴露會抑制皮膚 Langerhans 細胞與局部免疫反應，使真正過敏者測不出來，是偽陰性原因。","**不符合／錯誤（此項會造成偽陰性）**：全身性類固醇（一般認為 prednisolone >20 mg/日）或免疫抑制劑會壓抑第四型反應，造成偽陰性；測試前應停用或減量。","**符合／正確（本題答案）**：嚴重活動性濕疹造成的是「激動皮膚症候群」（excited skin syndrome、angry back）——整片背部反應性過高，出現多個非特異性陽性，是偽陽性而非偽陰性；應待皮膚炎緩解再測。","**不符合／錯誤（此項會造成偽陰性）**：過敏原濃度不足、載體不當、吸收不佳，或貼片脫落、判讀太早，都會讓真陽性測不出來。"],"explanation":"本題考貼膚試驗的偽陰性與偽陽性原因，關鍵是分清方向。偽陰性（測不出真過敏）：全身性類固醇或免疫抑制劑、近期紫外線暴露、過敏原濃度或載體不當、吸收不佳、貼片脫落或貼合不良、判讀太早（遲發反應物未到第 7 天）、測試部位曾用外用類固醇。偽陽性（測出假過敏）：激動皮膚症候群（angry back，背部有活動性濕疹或一個強陽性帶動鄰近多個弱陽性）、刺激性反應（濃度過高、刺激性物質）、貼片壓力或膠帶反應。指引也提醒貼膚結果陽性要配合病灶部位與病史，陰性不能排除。113-6 回憶版問「哪個會 false negative」，【整理】記答案為嚴重濕疹，見爭議註記。","dispute":"113-6 回憶版題目為「Patch test 哪個會 false negative？近期紫外線暴露／近期吃大量類固醇／嚴重濕疹／過敏物吸收不佳」，【整理】記答案「嚴重濕疹」。但嚴重活動性濕疹造成的是激動皮膚症候群（偽陽性），另外三項才是偽陰性原因；若原題問「何者會造成偽陰性」則會有三個答案，較合理的題意是「何者不會造成偽陰性」，答案為嚴重濕疹。本題依此重建，應試時記住「濕疹＝偽陽性；類固醇、紫外線、濃度不足＝偽陰性」。","review":{"key_points":["偽陰性：==全身性類固醇／免疫抑制劑、近期紫外線、過敏原濃度不足或吸收不佳==、貼片脫落、判讀太早","偽陽性：==嚴重活動性濕疹（angry back／激動皮膚症候群）==、刺激性反應、膠帶反應","測試時機：皮膚炎緩解後、停用全身性類固醇"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"但如果結果為陰性也不能排除"}],"note_ref":"三、貼膚試驗"}},{"qid":"c16q11","q":"有關空氣傳播性接觸皮膚炎（airborne contact dermatitis）之敘述，下列何者錯誤？","options":["多數與職業無關","病灶出現在暴露於空氣的部位，包括曬不到太陽的皺摺處，如眼皮摺痕、耳後、下巴下方","常呈對稱分布","診斷黃金標準為貼膚試驗"],"answer":0,"recon":"full","src":["113-2","113-9","113-10","113-11","114-01"],"optexp":["**錯誤（本題答案）**：空氣傳播性接觸皮膚炎的來源是粉塵、噴霧、揮發性物質（環氧樹脂、木粉、水泥粉塵、玻璃纖維、菊科植物、殺蟲劑），職業暴露是主要來源，說「多數與職業無關」不對；113-9 回憶版即以此為錯誤敘述。","**正確**：病灶在暴露於空氣的部位——臉、頸、前臂，而且包括曬不到太陽的皺摺處（眼皮摺痕、耳後、下巴下方、鼻唇溝），這是與光敏感皮膚炎最重要的鑑別點。","**正確**：因為是懸浮物質均勻接觸，病灶常呈對稱分布。","**正確**：多數空氣傳播性接觸皮膚炎為過敏性，診斷仍靠貼膚試驗（必要時光貼膚試驗排除光敏感）。"],"explanation":"本題考空氣傳播性接觸皮膚炎（airborne contact dermatitis）的特徵與鑑別。致因是空氣中的粉塵、纖維、噴霧與揮發性蒸氣，可為刺激性（玻璃纖維、水泥粉塵、酸鹼霧）或過敏性（環氧樹脂、木粉、菊科植物 sesquiterpene lactone、殺蟲劑、藥物粉塵），以職業暴露為主。分布：暴露於空氣的部位，對稱，臉頸前臂，最具鑑別性的是「曬不到太陽的皺摺處也有病灶」——眼皮、耳後、下頜下、鼻唇溝；光敏感皮膚炎則相反，這些遮蔽處會被放過（Wilkinson 三角、耳後、上眼皮乾淨）。診斷：貼膚試驗（黃金標準），懷疑光敏感時加光貼膚試驗。處理：減少懸浮暴露（局部排氣、防護），比單純戴手套更重要。","dispute":"","review":{"key_points":["空氣傳播性接觸皮膚炎：粉塵、噴霧、揮發物（環氧樹脂、木粉、水泥、玻璃纖維、菊科植物），==職業暴露為主==","分布對稱、暴露部位＋==曬不到的皺摺處（眼皮、耳後、下頜下）也有==＝與光敏感皮膚炎的鑑別點","診斷黃金標準貼膚試驗，懷疑光敏感加光貼膚試驗"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"貼膚測試之重要是在診斷過敏性接觸性皮膚炎"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"點刺測試(prick test)"}],"note_ref":"四、特殊型態的職業性皮膚病"}},{"qid":"c16q12","q":"化學性白斑（chemical leukoderma）最典型的致病物質為何？","options":["酚類與兒茶酚類化合物（如對第三丁基酚、對苯二酚單苯醚）","乳膠","水泥","切削油"],"answer":0,"recon":"full","src":["115-01"],"optexp":["**符合／正確（本題答案）**：白斑症認定指引寫「可引發白斑症的主要化學物質為酚和鄰苯二酚（兒茶酚）」，包括對苯二酚單苯醚（MBEH）、對苯二酚、對第三丁基苯酚（PTBP）、對第三丁基兒茶酚，它們結構類似酪胺酸，選擇性破壞黑色素細胞；115-01 回憶版「化學性白斑的成因？酚」。","**不符合／錯誤**：乳膠造成蕁麻疹與 ACD，不脫色。","**不符合／錯誤**：水泥造成六價鉻 ACD 與鹼性刺激性皮膚炎、灼傷，不是白斑。","**不符合／錯誤**：切削油造成刺激性接觸皮膚炎、油性痤瘡，長期礦物油暴露可致皮膚癌，與白斑無關。"],"explanation":"本題考化學性白斑（chemical leukoderma）的經典致病物：酚類與兒茶酚類——對苯二酚單苯醚（MBEH）、對苯二酚（hydroquinone）、對第三丁基苯酚（PTBP）、對第三丁基兒茶酚（PTBC）、對第三戊基苯酚、對甲酚等；它們用於黏著劑、合成橡膠（抗氧化劑）、消毒劑、相片顯影、塗料、殺蟲劑製造，所以指引列的職業有合成橡膠業、配戴合成橡膠手套者、相片業、化妝品業、製藥、清潔、美髮、殺蟲劑、塗料、塑膠、印刷、接觸潤滑油機油者。機轉是結構類似酪胺酸、阻斷黑色素合成並產生氧化壓力使黑色素細胞凋亡。臨床：好發手掌、手腕、前臂，常對稱，可合併接觸性皮膚炎，遠端未接觸處也可出現；最短暴露數天、最長潛伏期數個月。職安署指引名稱即「對第三丁基苯酚與其他酚類、兒茶酚類化學物質引起的皮膚白斑症」。","dispute":"","review":{"key_points":["化學性白斑經典致病物＝==酚類、兒茶酚類==：MBEH、對苯二酚、==對第三丁基苯酚（PTBP）==、PTBC","來源：黏著劑、合成橡膠（抗氧化劑）、消毒劑、相片顯影、塗料；機轉＝類酪胺酸、破壞黑色素細胞","好發手掌、手腕、前臂，對稱；最短暴露數天、最長潛伏期數個月"],"refs":[{"src":"對第三丁基苯酚與其他酚類-兒茶酚類化學物質引起的皮膚白斑症參考認定指引","file":"_ref/認定指引/all/對第三丁基苯酚與其他酚類-兒茶酚類化學物質引起的皮膚白斑症參考認定指引.txt","quote":"可引發白斑症的主要化學物質為酚(phenols)和鄰苯二酚"},{"src":"對第三丁基苯酚與其他酚類-兒茶酚類化學物質引起的皮膚白斑症參考認定指引","file":"_ref/認定指引/all/對第三丁基苯酚與其他酚類-兒茶酚類化學物質引起的皮膚白斑症參考認定指引.txt","quote":"對第三丁基苯酚[p-tert-butylphenol(PTBP)]"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"接觸對苯二酚(hydroquinone)等酚類所致化學性白斑"}],"note_ref":"四、特殊型態的職業性皮膚病"}},{"qid":"c16q13","q":"下列何者會造成化學性白斑？","options":["染料","殺蟲劑","有機溶劑","砷"],"answer":3,"recon":"partial","src":["113-6","113-12","114-05"],"optexp":["**不符合／錯誤**：染料（對苯二胺等）主要造成過敏性接觸皮膚炎與色素沉著，不是典型脫色原因。","**不符合／錯誤**：殺蟲劑本身不是脫色劑；白斑指引提到的是殺蟲劑「製造」過程中的酚類中間體。","**不符合／錯誤**：有機溶劑造成去脂性刺激性皮膚炎，不脫色。","**符合／正確（本題答案）**：慢性砷中毒的皮膚表現是淡褐至青銅色的瀰漫性色素沉著，中間夾雜雨滴狀脫色斑（leukomelanosis），另有掌蹠角化與皮膚癌；本題選項無酚類時以砷為答案（114-05：「應該是 4. 砷」）。"],"explanation":"本題考「會造成白斑（脫色）的職業暴露」。經典答案是酚類、兒茶酚類（見前一題）；當選項沒有酚類時，砷是另一個會造成脫色斑的暴露——砷中毒認定指引描述典型皮膚為「青銅色之色素沉著，中間夾雜一些脫色斑」，形成雨滴狀的 leukomelanosis，伴隨掌蹠點狀角化、Mee 氏線、波汶氏病與皮膚癌（皮膚癌最小累積暴露 1 年、最長潛伏期 5 年）。要區分：砷是「色素沉著中夾脫色」，酚類是「單純脫色白斑」；染料、殺蟲劑、溶劑都不是脫色原因。113-6 與 113-12 回憶版選項各有不同，見爭議註記。","dispute":"回憶版分歧：113-6 回憶「染料、砷、殺蟲劑皆有可能」；113-12 版本選項為染料／殺蟲劑／有機溶劑／忘了；114-05 答「應該是砷」。依認定指引，化學性白斑的經典致病物是酚類、兒茶酚類（對第三丁基苯酚、對苯二酚單苯醚），砷則是慢性中毒造成色素沉著夾雜脫色斑；本題選項中無酚類，故以砷為答案。應試時若選項有酚類，選酚類；只有砷時選砷。","review":{"key_points":["慢性砷中毒皮膚：==青銅色色素沉著夾雜雨滴狀脫色斑==、掌蹠角化、Mee 氏線、波汶氏病、皮膚癌","白斑經典致病物仍是酚類、兒茶酚類；選項無酚類時選砷","砷皮膚癌：最小累積暴露 1 年、最長潛伏期 5 年"],"refs":[{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"典型砷暴露之皮膚會出現青銅色之色素沉著，中間夾雜一些脫色斑"},{"src":"對第三丁基苯酚與其他酚類-兒茶酚類化學物質引起的皮膚白斑症參考認定指引","file":"_ref/認定指引/all/對第三丁基苯酚與其他酚類-兒茶酚類化學物質引起的皮膚白斑症參考認定指引.txt","quote":"可引發白斑症的主要化學物質為酚(phenols)和鄰苯二酚"}],"note_ref":"四、特殊型態的職業性皮膚病"}},{"qid":"c16q14","q":"長期接觸切削油（cutting oil）的金屬加工勞工手部出現濕疹，最可能之診斷為何？","options":["刺激性接觸皮膚炎","氯痤瘡","接觸性蕁麻疹","白斑"],"answer":0,"recon":"full","src":["114-02","114-04"],"optexp":["**符合／正確（本題答案）**：水性切削液含乳化劑、防腐劑、鹼性成分，加上濕手工作，長期接觸使角質層脫脂受損，造成刺激性接觸皮膚炎；指引把切削油與水、清潔劑並列為需數週數月長期接觸才發病的刺激性物質。114-04 回憶版答「接觸性皮膚炎」。","**不符合／錯誤**：氯痤瘡是氯化芳香烴（多氯聯苯、戴奧辛、氯萘）造成的，切削油造成的是油性痤瘡、毛囊炎，且本題表現是濕疹。","**不符合／錯誤**：接觸性蕁麻疹是立即型風疹塊，不是長期接觸後的濕疹。","**不符合／錯誤**：白斑是酚類或砷造成的脫色，與切削油無關。"],"explanation":"本題考切削油的皮膚危害。切削油分油性（礦物油為主，可含少量動植物油）與水性（礦物油＋水＋乳化劑＋防腐劑；合成液不含礦物油），指引指出各種油類中的抗菌劑（酚類、甲醛釋放劑）與乳化劑對皮膚科最重要。臨床型態：(1) 刺激性接觸皮膚炎——最常見，水性切削液、濕手工作、鹼性 pH；(2) 過敏性接觸皮膚炎——防腐劑（甲醛釋放劑、isothiazolinone）、乳化劑、金屬屑中的鉻鎳鈷；(3) 油性痤瘡與毛囊炎——油性切削油，在衣著摩擦部位；(4) 礦物油長期暴露可致皮膚癌、陰囊癌（職安署有礦物油皮膚癌認定指引）。診斷金屬加工者手部濕疹先想 ICD，貼膚試驗排除 ACD。","dispute":"","review":{"key_points":["切削油（水性）→==刺激性接觸皮膚炎==最常見；防腐劑、乳化劑、鉻鎳→ACD","油性切削油→油性痤瘡、毛囊炎；礦物油長期→皮膚癌、陰囊癌","氯痤瘡＝氯化芳香烴（多氯聯苯、戴奧辛），不是切削油"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"是水、清潔劑及切削油等刺激性的物質"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"因皮膚接觸石油類(petroleum)及其衍生物、煤焦油、瀝青所致"}],"note_ref":"四、特殊型態的職業性皮膚病"}},{"qid":"c16q15","q":"二十多歲女性欲從事美容業，若有下列何種情況，除治療外更應建議其考慮更換工作？","options":["手部病毒疣","手部嚴重濕疹（手部皮膚炎）","手部灰指甲","臉部嚴重痤瘡"],"answer":1,"recon":"full","src":["114-02"],"optexp":["**不符合／錯誤**：病毒疣可冷凍或藥物治療，治癒後不影響從業，且與美容業的化學暴露無關。","**符合／正確（本題答案）**：美容美髮業是濕手工作，接觸肥皂清潔劑、溶劑、漂白劑、燙髮藥水、染劑、胺類、甲基丙烯酸酯、防腐劑；手部已有嚴重濕疹者皮膚屏障受損，極易惡化成慢性職業性手部皮膚炎並致敏，除治療外應建議考慮更換工作。","**不符合／錯誤**：灰指甲可用口服或外用抗黴菌藥治療，不是更換工作的理由，但要注意美甲業的交叉感染。","**不符合／錯誤**：臉部痤瘡與手部工作無關，治療即可。"],"explanation":"本題考「既有皮膚疾病與作業適配」。指引列美容美髮業的刺激原（肥皂、清潔劑、溶劑、漂白劑、燙髮藥水、洗髮精、反覆接觸水）與過敏原（染劑對苯二胺、胺類、松香、防腐劑、手套、甲基丙烯酸乙酯）；濕手工作本身就是刺激性接觸皮膚炎的最大危險因子，而異位性體質與既有手部濕疹者角質層屏障已受損，更容易發病與致敏。因此對有嚴重手部濕疹的求職者，健檢醫師除治療外應建議考慮其他工作或嚴格防護（手套、護手霜、減少濕手時間）。疣、灰指甲屬可治療的感染，臉部痤瘡與手部作業無關。附表十二的邏輯相同：接觸性皮膚疾病者不宜配置於鉛、有機溶劑、鉻、鎳等作業。","dispute":"","review":{"key_points":["美容美髮＝==濕手工作==＋染劑、燙髮劑、清潔劑、甲基丙烯酸酯→手部 ICD／ACD 高風險","既有嚴重手部濕疹、異位性體質→屏障受損、易致敏→建議考慮更換工作或嚴格防護","疣、灰指甲可治療；臉部痤瘡與工作無關"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"美容、美甲、美髮師常接觸到各式化妝品、香水"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"是水、清潔劑及切削油等刺激性的物質"}],"note_ref":"一、職業性皮膚病總論"}},{"qid":"c16q16","q":"下列外用藥膏中，何者最容易造成過敏性接觸皮膚炎？（A）抗生素藥膏（B）類固醇藥膏（C）局部麻醉劑","options":["A、B","A、B、C","B、C","A、C"],"answer":3,"recon":"partial","src":["113-12"],"optexp":["**不符合／錯誤**：A、B 漏掉局部麻醉劑，且把類固醇藥膏列為最容易致敏並不恰當。","**不符合／錯誤**：三者都列入不精確；外用類固醇雖可致 ACD（貼膚試驗標準系列含 tixocortol、budesonide），但發生率遠低於抗生素與局部麻醉劑。","**不符合／錯誤**：B、C 漏掉最重要的外用抗生素。","**符合／正確（本題答案）**：外用抗生素（neomycin、bacitracin）與局部麻醉劑（benzocaine 等）是貼膚試驗標準系列中常見陽性的外用藥過敏原；指引把 neomycin 列為遲發反應物，並將醫療業的麻醉劑、抗生素列為過敏原。"],"explanation":"本題考外用藥的致敏排序。教科書與貼膚試驗標準系列顯示：外用抗生素 neomycin（常與 bacitracin 交叉）與局部麻醉劑 benzocaine（酯類，與對苯二胺、磺胺類交叉反應）是最常見的外用藥過敏原；指引在貼膚試驗段落把外用抗生素 neomycin 與金屬、對苯二胺並列為需第 7 天再判讀的遲發反應物，在醫療業過敏原欄列出麻醉劑、抗生素，並在一般過敏性物質列「防腐劑：外用藥及化妝品所含之成分」。外用類固醇本身也可能引起 ACD（tixocortol pivalate、budesonide 為標準系列篩檢物），臨床線索是「濕疹愈擦愈糟」，但頻率較低。所以答案為 A（抗生素）＋C（局部麻醉劑）。113-12 未載答案，見爭議註記。","dispute":"113-12 回憶版只記題目未載答案。本題依教科書與貼膚試驗標準系列定為 A、C（外用抗生素 neomycin／bacitracin 與局部麻醉劑 benzocaine）；外用類固醇雖亦可造成 ACD（tixocortol、budesonide），但相對少見，故不列入「最容易」。應試時若選項組合不同，優先選含抗生素與局部麻醉劑者。","review":{"key_points":["外用藥最常見致敏：==抗生素 neomycin／bacitracin==、==局部麻醉劑 benzocaine==（與對苯二胺、磺胺交叉）","外用類固醇也可致 ACD（tixocortol、budesonide 篩檢），但少見；線索＝愈擦愈糟","neomycin、金屬、對苯二胺＝遲發反應物，貼膚第 7 天再判讀"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"對金屬、外用抗生素(neomycin)或染劑成分如對苯二胺"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"橡膠手套、麻醉劑、"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"防腐劑：外用藥及化妝品所含之成分"}],"note_ref":"三、貼膚試驗"}},{"qid":"c16q17","q":"在橡膠業中，接觸下列何種物質最容易產生「刺激性」皮膚反應？","options":["溶劑","橡膠添加劑（thiuram、carbamate）","乳膠蛋白","對苯二胺"],"answer":0,"recon":"full","src":["113-11","114-04"],"optexp":["**符合／正確（本題答案）**：指引列橡膠製造業的刺激原為滑石（talc）、硬脂酸鋅、溶劑，溶劑靠去脂作用直接損傷角質層造成刺激性皮膚反應；114-04 回憶版答「A 溶劑」。","**不符合／錯誤**：橡膠添加劑（促進劑 thiuram、carbamate、mercaptobenzothiazole，抗氧化劑）是橡膠業的「過敏原」，造成第四型 ACD，不是刺激性反應。","**不符合／錯誤**：乳膠蛋白造成第一型接觸性蕁麻疹，是免疫性反應。","**不符合／錯誤**：對苯二胺是染劑（染髮劑、黑色橡膠抗氧化劑衍生物）的強力過敏原，屬第四型。"],"explanation":"本題考「刺激原 vs 過敏原」的分類，以橡膠業為例。指引的行業對照表把每個行業分成刺激性物質與過敏性物質兩欄：橡膠製造業——刺激原：滑石、硬脂酸鋅、溶劑；過敏原：橡膠（添加劑）。同樣邏輯：機械工業刺激原是溶劑、冷卻劑、切削油、柴油汽油潤滑油，過敏原是切削油添加物、防腐劑、鉻鎳；建築業刺激原是酸、玻璃纖維、水泥、溶劑，過敏原是水泥中的鉻、鈷、環氧樹脂；醫療業刺激原是濕手工作、肥皂、酒精，過敏原是橡膠手套、麻醉劑、抗生素、甲醛、戊二醛。判斷原則：溶劑、酸鹼、清潔劑、粉塵纖維、水＝刺激；金屬離子、樹脂、橡膠添加劑、染料、防腐劑、香料、乳膠蛋白＝過敏。","dispute":"","review":{"key_points":["橡膠業刺激原：==滑石、硬脂酸鋅、溶劑==；過敏原：橡膠添加劑（thiuram、carbamate、MBT）、對苯二胺","刺激原通則：溶劑、酸鹼、清潔劑、粉塵纖維、水；過敏原通則：金屬、樹脂、橡膠添加劑、染料、防腐劑、香料","乳膠蛋白＝第一型；添加劑＝第四型"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"滑石(talc)、硬脂酸鋅"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"橡膠類：橡膠用品及橡膠製造業"}],"note_ref":"五、各行業的刺激原與過敏原"}},{"qid":"c16q18","q":"接觸玻璃纖維的勞工出現極度搔癢之紅疹，最可能為何？","options":["機械性刺激性接觸皮膚炎","過敏性接觸皮膚炎","氯痤瘡","接觸性蕁麻疹"],"answer":0,"recon":"rebuilt","src":["114-05"],"optexp":["**符合／正確（本題答案）**：玻璃纖維、岩棉的細小纖維刺入角質層造成機械性刺激性接觸皮膚炎——劇癢、細小丘疹，好發暴露部位與衣領袖口等摩擦處，非免疫機轉；指引把玻璃纖維列在建築業與電子業的刺激性物質欄。","**不符合／錯誤**：玻璃纖維本身不是過敏原（黏結用的環氧樹脂或酚醛樹脂才可能致 ACD），典型表現不是遲發型濕疹。","**不符合／錯誤**：氯痤瘡與氯化芳香烴有關，與玻璃纖維無關。","**不符合／錯誤**：接觸性蕁麻疹是 IgE 或直接釋放組織胺的風疹塊，玻璃纖維皮膚炎是機械性刺激。"],"explanation":"本題考機械性刺激性接觸皮膚炎的代表——玻璃纖維皮膚炎。指引把致病因子分四類：化學性（主要原因）、機械性（磨擦、壓力）、物理性（冷熱、振動、光、紫外線、放射線）、生物性（微生物、動植物）。玻璃纖維、岩棉、陶瓷纖維直徑數微米，接觸後纖維刺入角質層造成劇癢、紅斑、細丘疹，多在手、前臂、頸、腰際等衣物摩擦處，新進員工最明顯，數週後常「硬化」適應；診斷靠病史與皮膚刮取鏡檢可見纖維，處理是沖洗、膠帶黏除、寬鬆衣物與隔離霜。要區分：纖維製品中的樹脂黏結劑（環氧、酚醛樹脂）可造成過敏性接觸皮膚炎，那才需要貼膚試驗。","dispute":"","review":{"key_points":["玻璃纖維、岩棉→==機械性刺激性接觸皮膚炎==：劇癢、細丘疹、摩擦處，非免疫；新進員工明顯、可硬化適應","致病因子四類：化學性（主因）、機械性（磨擦壓力）、物理性、生物性","纖維製品的樹脂黏結劑才可能致 ACD"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"酸類、玻璃纖維、水"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"機械性：由磨擦、壓力傷害所致"}],"note_ref":"五、各行業的刺激原與過敏原"}},{"qid":"c16q19","q":"下列職業性皮膚癌之致病物配對，何者錯誤？","options":["煤焦油、瀝青：皮膚癌","巴拉刈：皮膚癌","礦物油（切削油）：皮膚癌（陰囊癌）","乳膠：皮膚癌"],"answer":3,"recon":"rebuilt","src":["整理-表格","113-4","115-01"],"optexp":["**正確**：煤焦油、瀝青含多環芳香烴（PAH），是經典的職業性皮膚癌致癌物，職安署有煤焦油瀝青與煤煙焦油兩份皮膚癌認定指引；掃煙囪工人陰囊癌是史上第一個職業癌。","**正確**：巴拉刈製造作業的分級指引寫「可能引起皮膚癌」，健檢要注意皮膚角化、黑斑及疑似皮膚癌病變。","**正確**：礦物油（切削油、頁岩油）長期暴露與皮膚癌和陰囊癌相關，職安署有礦物油皮膚癌認定指引。","**錯誤（本題答案）**：乳膠造成第一型接觸性蕁麻疹與（添加劑）第四型 ACD，不致癌。"],"explanation":"本題考職業性皮膚癌的致病物清單：煤焦油、瀝青、煤煙、焦油（PAH）；礦物油、頁岩油（切削油、機油，陰囊癌）；砷（波汶氏病、基底細胞癌、鱗狀細胞癌，繼發於角化症）；紫外線（戶外工作者的日光角化症、基底細胞癌、鱗狀細胞癌、黑色素瘤）；游離輻射；巴拉刈（製造作業，分級指引列可能引起皮膚癌）。指引皮膚腫瘤段落寫長期日光工作（漁夫、農夫）與多環芳香烴、砷或游離性輻射等物質可能引發皮膚腫瘤。乳膠、水泥、溶劑、切削油的急性表現是皮膚炎與痤瘡，不致癌（但礦物油長期可致癌，要分清「切削油濕疹」與「礦物油皮膚癌」是不同時間尺度的問題）。","dispute":"","review":{"key_points":["職業性皮膚癌致病物：==煤焦油、瀝青、煤煙（PAH）、礦物油／頁岩油（陰囊癌）、砷、紫外線、游離輻射、巴拉刈==","砷皮膚癌＝波汶氏病、BCC、SCC，繼發於角化症；戶外工作者→日光角化症、BCC、SCC","乳膠→蕁麻疹、ACD，不致癌"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"砷或游離性幅射等物質可能會引發皮膚腫瘤"},{"src":"21_聯吡啶或巴拉刈作業管理分級參考","file":"_ref/分級指引/21_聯吡啶或巴拉刈作業管理分級參考.txt","quote":"可能引起皮膚癌，另有研究顯示和巴金森氏病有關"},{"src":"礦物油-mineral-oil-頁岩油-shale-oil-引起的職業性皮膚癌和陰囊癌認定參考指引","file":"_ref/認定指引/all/礦物油-mineral-oil-頁岩油-shale-oil-引起的職業性皮膚癌和陰囊癌認定參考指引.txt","quote":"與皮膚癌和陰囊癌相關"}],"note_ref":"六、職業性皮膚癌"}},{"qid":"c16q20","q":"下列何者為職業性皮膚病之物理性致病因子？","options":["冷、熱、振動、光、紫外線與游離輻射","細菌與黴菌","酸與鹼","植物花粉"],"answer":0,"recon":"rebuilt","src":["補充"],"optexp":["**符合／正確（本題答案）**：指引把物理性致病因子定義為「由冷熱、振動、光、紫外線、放射性光線所致」——凍傷、燙傷、振動引起的雷諾氏症（白指）、光敏感皮膚炎、日光角化與皮膚癌、輻射性皮膚炎都屬此類。","**不符合／錯誤**：細菌與黴菌屬生物性因子（微生物、動植物）。","**不符合／錯誤**：酸與鹼屬化學性因子，是職業性皮膚病的主要原因。","**不符合／錯誤**：植物花粉屬生物性（植物性）因子，如菊科植物的 sesquiterpene lactone 造成過敏。"],"explanation":"本題考職業性皮膚病致病因子的分類。指引分四類：化學性——有機或無機化學物質，是職業性皮膚病的主要原因（刺激物、過敏原、光敏感物）；機械性——磨擦、壓力（硬繭、玻璃纖維、痤瘡）；物理性——冷熱、振動、光、紫外線、放射性光線；生物性——微生物、動植物（細菌、黴菌、病毒、寄生蟲、植物）。歐盟 2009 指引另把過敏原分低分子量（金屬、橡膠塑膠化合物、染料）、巨分子量（天然乳膠等動植物物質）與光敏感物（植物、香料）。考題常以「何者屬物理性／生物性」形式出現，記法：看得見的能量（溫度、振動、光、輻射）是物理，活的東西是生物，分子是化學，摩擦壓力是機械。","dispute":"","review":{"key_points":["致病因子四類：化學性（主因）、機械性（磨擦壓力）、==物理性（冷熱、振動、光、紫外線、放射線）==、生物性（微生物、動植物）","物理性代表病：凍傷燙傷、振動白指、光敏感皮膚炎、日光角化／皮膚癌、輻射性皮膚炎","過敏原分低分子量（金屬、橡膠、染料）、巨分子量（乳膠）、光敏感物（植物、香料）"],"refs":[{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"物理性：由冷熱、振動、光、紫外線、放射性光線所致"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"生物性：由微生物、動植物等致因"},{"src":"職業性皮膚病認定參考指引","file":"_ref/認定指引/all/職業性皮膚病認定參考指引.txt","quote":"機械性：由磨擦、壓力傷害所致"}],"note_ref":"一、職業性皮膚病總論"}}]},{"idx":16,"order":16,"title":"肌肉骨骼疾病與人因工程","group":"粉塵、皮膚、肌骨與神經","gi":5,"notes_md":"本章約 12 題，考四份肌肉骨骼認定指引的數字（腰椎椎間盤突出、腕隧道、蹲跪膝關節、旋轉肌袖）與人因工程常識。\n\n## 一、腰椎椎間盤突出\n- 疾病證據（三者同時）：==急性下肢痛麻==（可合併下背痛，單純下背痛不算）＋SLRT ==30–70 度== 陽性兩次或 NCV/EMG 急性腰薦神經根病變＋MRI/CT ==L3/4–L5/S1== 單側 herniation（protrusion、extrusion、sequestration；==bulging 不算==）。\n- 暴露證據：每年 ==220 日==、診斷前 ==8–10 年==、每日搬抬總重==男 2 噸／女 1.5 噸==（單件男 ≥20 kg、女 ≥15 kg 才計入）、每班至少一半時間；過肩、每分鐘 >1 次、扭轉、全身振動可下修至約 5 年。\n- 時序：暴露結束至發病最長==半年==；排除 BMI ≥30、滑脫、側彎、吸菸等。全身振動指引：駕駛強烈振動車輛 8–10 年、0.6–0.8 m/s²。\n- 檢查分工：影像黃金標準 MRI；神經根病變客觀電生理證據 NCV/EMG。\n\n## 二、腕隧道症候群\n- ==正中神經==在腕隧道受壓；拇、食、中指與無名指橈側半麻痛；Tinel、Phalen（60 秒）；魚際肌萎縮僅約 15%。\n- 早期症狀好發==夜間==（麻醒甩手）、騎機車、握持、腕屈曲；工作活動時反而少。\n- 職業性特徵：症狀==先出現於慣用手==、兩手不對稱。非職業因素：避孕藥、懷孕、授乳、RA、肥胖、糖尿病、==甲狀腺功能低下==、膠原病、雷諾氏病、肢端肥大症。\n- 五項危害因子：每分鐘 >10 件或 >20 個反覆動作、捏握 >1 kg、不良屈伸姿勢、振動手工具、腕部壓迫；每天 ≥一半（==4 小時==）、發病在作業開始 ==3 個月== 後。電腦鍵盤、久坐不是列舉因子。\n\n## 三、膝關節：半月板與骨關節炎\n| | 半月板病變 | 骨關節炎 |\n|---|---|---|\n| 暴露姿勢 | 跪、深蹲、爬行＋內外旋剪力 | 跪或蹲（磁磚、浴室、屋頂、地板） |\n| 每日時間 | ==≥1 小時== | 佔一半工作時間 |\n| 累積 | >13,000 小時、年資 ==≥5 年== | >13,000 小時、年資 ==>10 年== |\n| 診斷 | MRI 或關節鏡，排除急性外傷 | 症狀＋理學＋X 光 ==K/L ≥3==，==單側或雙側皆可== |\n- BMI 為競爭因子非必要條件：26–30 RR≈2.0；>30 應考量、>35 建議排除。離職 1 年後才發病者排除。\n\n## 四、肩部：旋轉肌袖症候群\n- 手臂==高舉過肩==（肩屈曲／外展 ≥90 度、手肘過肩、手過頭）：油漆工、天花板、清潔、營造、倉儲；以棘上肌為主（肌腱炎、撕裂、斷裂、夾擠）。\n- 暴露：高風險作業每日 ==≥4 小時==；肌腱炎最短 3 個月、撕裂／斷裂最短 1 年；==98 年 5 月 1 日== 納入職業病種類，114 年 8 月修正。\n- 配對：全身振動→腰椎；手持振動工具→白指症、CTS；蹲跪→膝；過肩→旋轉肌袖；電腦作業→頸肩肌筋膜疼痛（非旋轉肌袖撕裂）。\n\n## 五、人因工程：工作站與評估工具\n- 螢幕頂端與眼同高或略低，視線==俯視 15–25 度==（不超過 30 度）、正前方、一臂長；手肘 90 度、腕中立；椅背腰部支撐；文件架與螢幕同高。視線向上＝錯。\n- 評估工具：KIM（抬舉搬運、推拉、手工物料）、HAL-TLV、RULA／REBA／OWAS、NIOSH 抬舉公式、Strain Index；==NMQ 是症狀問卷，不是人因評估工具==。","questions":[{"qid":"c17q01","q":"依職業性腰椎椎間盤突出認定參考指引，下列敘述何者錯誤？","options":["影像須顯示椎間盤突出（herniation，含 protrusion、extrusion、sequestration），不能只有膨出（bulging）","須有急性下肢痛麻（神經根症狀），不能只有下背痛","受影響節段為 L3/4 至 L5/S1 之單一或多個椎間盤","每日搬抬總重量男性至少 3 噸、女性至少 1.5 噸，且工作 5–8 年"],"answer":3,"recon":"full","src":["113-6","113-10","113-11","114-01","114-02"],"optexp":["**正確**：指引疾病證據第 3 點：MRI 或 CT 顯示單側腰椎椎間盤突出（herniation），包括 protrusion、extrusion 與 sequestration，「不能只有膨大（bulging）」。","**正確**：疾病證據第 1 點是「急性下肢痛麻；可能合併下背痛」，也就是必須有神經根症狀，單純下背痛不符合；113-11 與 114-02 回憶版把這句標成錯誤選項，見爭議註記。","**正確**：從 L3/4 到 L5/S1 有單一或多個椎間盤受影響，排除只有 L1/2 和／或 L2/3 者。","**錯誤（本題答案）**：暴露證據是每年至少工作 220 日、診斷前至少已工作 8–10 年，每日搬抬總重男性至少 2 噸、女性至少 1.5 噸（男 ≥20 kg、女 ≥15 kg 才計入）；「3 噸、5–8 年」數字錯誤，113-6 版本即以「男生搬 3 噸」為錯。"],"explanation":"本題考職業性腰椎椎間盤突出認定指引的主要基準，數字必須背熟。疾病證據三點同時存在：(1) 急性下肢痛麻，可合併下背痛；(2.1) SLRT 30–70 度陽性至少兩次，或 (2.2) NCV／EMG 顯示急性腰薦神經根病變；(3) MRI／CT 顯示 L3/4 至 L5/S1 單側椎間盤突出（protrusion、extrusion、sequestration），不能只有 bulging。暴露證據：每年至少 220 日、診斷前至少工作 8–10 年、每日搬抬總重男 ≥2 噸／女 ≥1.5 噸（單件男 ≥20 kg、女 ≥15 kg 才計入）、每班至少一半時間；或人因軟體估算單次腰部應力男 3.2 kN／女 2.5 kN、每日累積負荷男 >5,500 Nh／女 >3,500 Nh。特殊考量（過肩搬抬、每分鐘超過一次快速搬抬、扭轉彎腰、長距離、超過 1/2 臂長、全身振動）可把工作年限下修到約 5 年。時序：暴露結束至發病最長半年。排除：Meyerding ≥II 級滑脫、脊椎融合、側彎、BMI ≥30、吸菸、強烈家族史等，無法排除時職業貢獻須達 50%。","dispute":"回憶版兩處分歧：(1) 113-6 版本的錯誤選項是「男生每日搬 3 噸」，指引為男 2 噸、女 1.5 噸，本題沿用此為答案。(2) 113-11 與 114-02 回憶把「一定要有坐骨神經痛症狀，不能只有下背痛」標為錯誤選項；但指引疾病證據第 1 點明寫「急性下肢痛麻；可能合併下背痛」，鑑別診斷也排除只有下背痛的慢性反覆性下背痛與假性坐骨神經痛，因此「須有急性下肢痛麻（神經根症狀），不能只有下背痛」依原文是正確敘述，回憶標記應為誤植。應試時以指引為準：神經根症狀必要、bulging 不算、2 噸／1.5 噸、220 日、8–10 年。","review":{"key_points":["疾病證據：==急性下肢痛麻==（可合併下背痛）＋SLRT ==30–70 度== 或 NCV/EMG 神經根病變＋MRI/CT ==L3/4–L5/S1== herniation（==bulging 不算==）","暴露證據：每年 ==220 日==、診斷前 ==8–10 年==、每日搬抬總重==男 2 噸／女 1.5 噸==（單件男 ≥20 kg、女 ≥15 kg）、每班至少一半時間","特殊情形（過肩、每分鐘 >1 次、扭轉、全身振動）年限可下修至約 5 年；暴露結束至發病最長半年；BMI ≥30 等為排除因子"],"refs":[{"src":"腰椎椎間盤突出","file":"_ref/認定指引/腰椎椎間盤突出.txt","quote":"每日搬抬總男性至少 2 噸、女性至少 1.5 噸"},{"src":"腰椎椎間盤突出","file":"_ref/認定指引/腰椎椎間盤突出.txt","quote":"每年至少工作 220 日、診斷前至少已工作 8-10 年"},{"src":"腰椎椎間盤突出","file":"_ref/認定指引/腰椎椎間盤突出.txt","quote":"不能只有膨大（bulging）"}],"note_ref":"一、腰椎椎間盤突出"}},{"qid":"c17q02","q":"腰椎椎間盤突出引起坐骨神經痛，用以確認神經根病變最重要的電生理檢查為何？","options":["神經傳導檢查與肌電圖（NCV／EMG）","腦波","骨密度檢查","誘發電位"],"answer":0,"recon":"partial","src":["113-2","114-01"],"optexp":["**符合／正確（本題答案）**：指引把「神經傳導檢查（NCV）與肌電圖（EMG）顯示急性腰薦神經根病變」列為疾病證據之一（與 SLRT 二擇一），是確認神經根病變的客觀電生理檢查；回憶版問「診斷坐骨神經痛最重要的檢查」答肌電圖。","**不符合／錯誤**：腦波評估大腦皮質活動，與腰薦神經根無關。","**不符合／錯誤**：骨密度檢查看骨質疏鬆，不能證明神經根病變。","**不符合／錯誤**：體感誘發電位偶爾輔助評估神經根，但敏感度、特異度不如針極肌電圖，不是指引列的電生理檢查。"],"explanation":"本題考腰椎椎間盤突出的檢查分工。影像的黃金標準是 MRI（CT 次之），用來證明椎間盤突出的型態（protrusion、extrusion、sequestration）與節段（L3/4–L5/S1）；但 40 歲以上約 30% 無症狀者影像也有異常，所以影像必須配合臨床。神經根「病變」的客觀證據靠電生理：NCV 與針極 EMG 可顯示急性腰薦神經根病變（去神經電位、H 反射異常），指引把它與 SLRT 30–70 度陽性並列為二擇一的疾病證據。理學檢查：SLRT（抬高 30–70 度誘發患側疼痛，對側抬腿誘發患側痛更具意義）、坐姿膝伸展測試、神經根對應的感覺運動反射。所以「確認神經根病變最重要的電生理檢查」是 NCV／EMG，「影像最重要」是 MRI，題目問哪一個要看清楚。","dispute":"","review":{"key_points":["神經根病變的客觀電生理證據＝==NCV／EMG==（與 SLRT 30–70 度二擇一）","影像黃金標準＝==MRI==（CT 次之）；40 歲以上 30% 無症狀者影像也異常，須配合臨床","SLRT：抬高 30–70 度誘發患側痛；對側抬腿誘發患側痛更具意義"],"refs":[{"src":"腰椎椎間盤突出","file":"_ref/認定指引/腰椎椎間盤突出.txt","quote":"神經傳導檢查（NCV）與肌電圖（EMG）顯示急性腰薦神經根病變"},{"src":"腰椎椎間盤突出","file":"_ref/認定指引/腰椎椎間盤突出.txt","quote":"直腿抬舉法（SLRT）30-70 度為陽性，至少兩次測試"}],"note_ref":"一、腰椎椎間盤突出"}},{"qid":"c17q03","q":"腕隧道症候群是哪一條神經在腕部受到壓迫？","options":["正中神經","尺神經","橈神經","肌皮神經"],"answer":0,"recon":"full","src":["113-4","113-11","114-03","114-04"],"optexp":["**符合／正確（本題答案）**：指引寫「腕隧道症候群乃是正中神經在通過狹窄的腕隧道時受到壓迫」，腕隧道由腕骨與橫腕韌帶圍成，症狀在正中神經支配區（拇、食、中指及無名指橈側半）。","**不符合／錯誤**：尺神經在肘部受壓是肘隧道症候群，在腕部受壓是 Guyon 管症候群，症狀在小指與無名指尺側。","**不符合／錯誤**：橈神經受壓（如週末夜麻痺、鉛中毒）造成垂腕，不經過腕隧道。","**不符合／錯誤**：肌皮神經支配肱二頭肌與前臂外側感覺，與腕部無關。"],"explanation":"本題考腕隧道症候群的解剖與臨床。正中神經與九條屈指肌腱一起穿過腕隧道（腕骨為底、橫腕韌帶為頂），腔內壓力升高或肌腱滑膜增厚即壓迫神經。症狀：拇、食、中指與無名指橈側半的感覺異常（灼熱、針刺、麻木）、疼痛，可向前臂上臂放射，夜間加重、甩手緩解，晚期魚際肌萎縮（只有約 15% 出現）。理學檢查：Tinel's sign（叩擊腕隧道誘發指端感覺異常）、Phalen's test（腕屈曲 60 秒內誘發，10–15 秒內出現代表神經極易受刺激）、正中神經支配區針刺覺下降。電生理：正中神經運動遠端潛時 \u003c4.6 ms、與尺神經差 ≤1.8 ms、感覺遠端潛時 \u003c3.5 ms、兩手差 ≤0.5 ms 為正常。鑑別：尺神經病變、頸椎神經根病變（C6/7）、胸廓出口症候群。","dispute":"","review":{"key_points":["CTS＝==正中神經==在腕隧道（腕骨＋橫腕韌帶）受壓；症狀在拇、食、中指與無名指橈側半","Tinel、Phalen（60 秒；10–15 秒內陽性＝極易受刺激）、針刺覺下降、魚際肌萎縮（僅約 15%）","NCV 正常值：正中運動遠端潛時 \u003c4.6 ms、與尺神經差 ≤1.8 ms、感覺 \u003c3.5 ms、兩手差 ≤0.5 ms"],"refs":[{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"腕隧道症候群乃是正中神經在通過狹窄的腕隧道時受到壓迫"},{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"正中神經運動遠端潛時小於 4.6 毫秒(ms)"}],"note_ref":"二、腕隧道症候群"}},{"qid":"c17q04","q":"早期腕隧道症候群的症狀，不易發生於下列何種時候？","options":["睡覺時","騎機車時","工作時","手腕長時間屈曲時"],"answer":2,"recon":"full","src":["113-3","113-8","113-11","114-02"],"optexp":["**不符合／錯誤（睡覺時容易發生）**：指引寫病人常在晚上特別容易出現症狀，因疼痛或麻痺由睡眠中覺醒，甩手、搓揉可緩解，是最典型的早期表現。","**不符合／錯誤（騎機車時容易發生）**：指引明寫長時間騎乘機車或手腕過度用力勞動後容易加重症狀；持續握持姿勢（握把、方向盤、電話）使腕隧道壓力升高。","**符合／正確（本題答案）**：早期 CTS 在工作中活動時反而較少發作，症狀集中在夜間與靜態握持姿勢；三個回憶版本答案一致為「工作時」。","**不符合／錯誤（長時間屈曲時容易發生）**：腕部屈曲使腕隧道內壓力上升，Phalen 試驗正是用持續屈曲 60 秒來誘發症狀。"],"explanation":"本題考早期腕隧道症候群的症狀時機。夜間為何加重：睡眠時腕部常不自覺屈曲、組織液重新分布使腕隧道壓力上升，病人因麻痛醒來、甩手（flick sign）緩解；騎機車、握方向盤、拿電話、閱讀等持續握持或屈曲姿勢同樣升高隧道內壓，也會誘發。工作時因手部反覆活動、肌肉幫浦作用，早期反而較少有症狀（但長期反覆用力與振動仍是致病因子，這是「誘發時機」與「致病暴露」的差別）。感覺症狀先於運動症狀，晚期才有握力下降、魚際肌萎縮。理學檢查 Phalen 與 Tinel 都是模擬「靜態壓迫」來誘發。","dispute":"","review":{"key_points":["早期 CTS 好發時機：==夜間==（麻醒、甩手緩解）、持續握持（騎機車、握方向盤、拿電話）、腕部長時間屈曲","工作活動時反而較少發作；致病暴露（反覆用力、振動）
