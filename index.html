≠誘發時機","感覺症狀先於運動症狀；晚期握力下降、魚際肌萎縮"],"refs":[{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"病人常在晚上特別容易出現症狀"},{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"長時間騎乘機車，或手腕部過度用力勞動之後均容易加重症狀"}],"note_ref":"二、腕隧道症候群"}},{"qid":"c17q05","q":"有關職業性腕隧道症候群之敘述，下列何者最正確？","options":["職業引起者會因慣用手不同，而有左右手嚴重程度不同的差異","是因尺神經受壓迫造成","需鑑別非職業因素，如懷孕、甲狀腺功能亢進、肥胖","使用電腦的行政作業是認定指引所列的主要危害因子"],"answer":0,"recon":"full","src":["113-4","113-8","113-11","113-12","114-05"],"optexp":["**符合／正確（本題答案）**：指引寫「通常症狀會先出現於慣用手」，職業性 CTS 因慣用手暴露較多，左右手嚴重程度不同；113-11 回憶版特別標星「若是職業病引發，會有慣用手兩手程度不一樣的差別」。","**不符合／錯誤**：CTS 是正中神經受壓，尺神經受壓是肘隧道或 Guyon 管症候群。","**不符合／錯誤**：需鑑別的非職業因素是口服避孕藥、懷孕、授乳、類風濕性關節炎、肥胖、糖尿病、「甲狀腺功能低下」、膠原病、雷諾氏病、肢端肥大症；選項寫甲狀腺功能「亢進」是錯的。","**不符合／錯誤**：指引的五項危害因子是高反覆、高使力、不良姿勢、振動工具、腕部壓迫；電腦鍵盤作業與 CTS 的因果證據薄弱，不是指引列舉的主要因子。"],"explanation":"本題考職業性 CTS 認定的三個面向。(1) 職業性特徵：症狀先出現於慣用手、兩手程度不對稱；同一工作環境其他人也有類似症狀。(2) 非職業因素（鑑別）：口服避孕藥、懷孕、授乳、類風濕性關節炎或非特異性肌腱炎、肥胖、糖尿病、甲狀腺功能低下、膠原病、雷諾氏病、肢端肥大症、慢性腎衰竭、腕部骨折脫臼、痛風。(3) 危害因子五項：腕部高度反覆（每分鐘 >10 件或 >20 個動作）、用力（捏握 >1 kg）、不良屈伸姿勢、振動手工具、腕部或手掌根部壓迫；暴露證據要求每天至少一半（4 小時）從事，發病在開始作業至少 3 個月後。電腦作業的證據不足，指引列舉的高風險職業是服裝製造、食品加工、包裝、油漆工、木工、屠宰、振動工具使用者等。","dispute":"","review":{"key_points":["職業性 CTS：症狀==先出現於慣用手==、兩手不對稱","非職業因素：避孕藥、懷孕、授乳、RA、肥胖、糖尿病、==甲狀腺功能低下==（非亢進）、膠原病、雷諾氏病、肢端肥大症","五項危害因子：高反覆、高使力、不良姿勢、振動工具、腕部壓迫；電腦鍵盤非指引列舉因子"],"refs":[{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"通常症狀會先出現於慣用手"},{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"肥胖、糖尿病、甲狀腺功能低下症"}],"note_ref":"二、腕隧道症候群"}},{"qid":"c17q06","q":"依職業性腕隧道症候群認定參考指引，下列何者不是列舉之工作相關危害因子？","options":["腕部高度反覆性動作（每分鐘操作超過 10 件或超過 20 個反覆動作）","手指出力捏握物件超過 1 公斤","經常使用振動手工具或壓迫手掌根部","每日久坐超過 8 小時"],"answer":3,"recon":"rebuilt","src":["補充"],"optexp":["**不符合／錯誤（是列舉因子）**：高度反覆性動作定義為每分鐘操作超過 10 件物品或超過 20 個反覆動作，是第一項危害因子。","**不符合／錯誤（是列舉因子）**：用力作業定義為手指出力捏握物件超出 1 公斤以上，是第二項危害因子。","**不符合／錯誤（是列舉因子）**：經常手持振動工具、直接對腕隧道或手掌根部施加壓迫，分別是第四、五項危害因子。","**符合／正確（本題答案）**：久坐與腕部的生物力學負荷無關，不在指引列舉的五項危害因子中；久坐是腰椎與心血管的議題。"],"explanation":"本題考腕隧道症候群認定指引的暴露證據。國內專家共識：下列危害因素有一項以上發生於日常工作，每天應有一半以上（四小時）的時間從事，且發病在開始該作業至少 3 個月後，得視為暴露證據：(1) 腕部高度反覆性動作——每分鐘操作超過 10 件物品或超過 20 個反覆動作；(2) 腕部用力——手指出力捏握物件超出 1 公斤以上；(3) 腕部以不良的屈曲或伸展姿勢或長時間工作；(4) 經常手持振動工具；(5) 腕部或手掌基部經常承受長時間壓力。NIOSH 監視定義也是同樣五項。人因檢核表（KIM、ACGIH HAL-TLV）可作風險等級參考，指引提醒 KIM 的流行病學相關性研究不足，HAL-TLV 有較多資料。","dispute":"","review":{"key_points":["五項危害因子：==每分鐘 >10 件或 >20 個反覆動作==、==捏握 >1 kg==、不良屈伸姿勢、振動手工具、腕部／手掌根部壓迫","暴露門檻：每天至少一半（==4 小時==）從事、發病在作業開始 ==3 個月== 後","久坐不是 CTS 危害因子；KIM 流病證據不足、HAL-TLV 資料較多"],"refs":[{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"每天應有一半以上（四小時）的時間從事該工作"},{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"每分鐘操作超過 10 件物品，或每分鐘超過 20 個反覆動作"},{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"手指出力捏握物件超出 1 公斤以上"}],"note_ref":"二、腕隧道症候群"}},{"qid":"c17q07","q":"膝關節半月狀軟骨病變，容易出現在下列何種勞工？","options":["長期蹲跪姿勢工作者","長時間使用電腦者","噪音作業勞工","夜班工作者"],"answer":0,"recon":"full","src":["113-8"],"optexp":["**符合／正確（本題答案）**：半月板指引寫「在反覆蹲跪與伸直膝關節的過程中，不當的內旋或外旋膝關節常會造成半月狀軟骨的傷害」，研究族群為礦工、舖水管工、舖地板工、木匠、水電工。","**不符合／錯誤**：長時間使用電腦與頸肩、上肢累積性傷害有關，膝關節沒有負荷。","**不符合／錯誤**：噪音作業造成聽力損失，與膝關節無關。","**不符合／錯誤**：夜班工作與代謝、心血管、睡眠障礙有關，不造成半月板病變。"],"explanation":"本題考蹲跪作業的膝關節職業病。職安署有兩份指引：「職業性長期以蹲跪姿勢工作引起之膝關節半月狀軟骨病變」與「長期以蹲跪姿勢工作引起之膝關節骨關節炎」。半月板機轉：內側半月板吸收力量較小、受力較大，深蹲時半月板後移，反覆蹲跪伸直合併內外旋產生剪力造成退化性裂傷（縱向裂傷最常見）。認定基準：退化性半月板病變（排除急性外傷）＋症狀（疼痛、腫脹、卡住、無法伸展）＋理學檢查（McMurray、Apley 等）＋關節鏡或 MRI 證實；暴露：跪姿、深蹲或爬行姿勢每工作日平均累計至少 1 小時、累積超過 13,000 小時、年資至少 5 年（例：每日 4 小時×每年 220 日約 15 年）；間斷不超過一年可累計。輔助：狹窄空間無法伸膝、扭轉膝蓋、爬梯每天 >30 段、搬 50 kg 以上每週 >10 次。排除：年齡 >65、BMI >30、非職業外傷、負荷性休閒活動。","dispute":"","review":{"key_points":["半月板病變＝反覆蹲跪伸直＋不當內外旋剪力；礦工、舖地板、水電、木匠","暴露基準：蹲跪爬行每日累計 ==≥1 小時==、累積 ==>13,000 小時==、年資 ==≥5 年==（4 小時×220 日約 15 年）","診斷：退化性（排除急性外傷）＋症狀＋理學檢查＋MRI 或關節鏡；排除年齡 >65、BMI >30"],"refs":[{"src":"14職業性長期以蹲跪姿勢工作引起之膝關節半月狀軟骨病變認定參考指引","file":"_ref/認定指引/all/14職業性長期以蹲跪姿勢工作引起之膝關節半月狀軟骨病變認定參考指引.txt","quote":"在反覆蹲跪與伸直膝關節的過程中，不當的內旋或外旋膝關節常會造成半月狀軟骨的傷害"},{"src":"14職業性長期以蹲跪姿勢工作引起之膝關節半月狀軟骨病變認定參考指引","file":"_ref/認定指引/all/14職業性長期以蹲跪姿勢工作引起之膝關節半月狀軟骨病變認定參考指引.txt","quote":"累積暴露時數超過 13,000 小時，其工作暴露年資最短至少 5 年"}],"note_ref":"三、膝關節：半月板與骨關節炎"}},{"qid":"c17q08","q":"依長期以蹲跪姿勢工作引起之膝關節骨關節炎認定參考指引，下列敘述何者錯誤？","options":["工作中須有長期經常性的蹲姿或跪姿動作為必要條件","須排除外傷、風濕性疾病等其他原因","BMI 大於 30 是認定之必要條件","肥胖是膝關節骨關節炎的非職業性危險因子"],"answer":2,"recon":"partial","src":["113-10","114-01","114-03"],"optexp":["**正確**：指引職業暴露證據要求「跪姿或蹲姿工作數年」，每天平均蹲跪佔一半工作時間、累積超過 13,000 小時、年資最短超過 10 年，蹲跪暴露是必要條件。","**正確**：指引第 4 點排除非職業性致病因素：運動傷害、非職業外傷、十字韌帶損傷、半月板損傷、關節排列不正、風濕性關節炎、全身性疾病、感染等。","**錯誤（本題答案）**：BMI 是競爭因子而非認定條件——指引寫 BMI 超過 30 時其作用應加以考量、超過 35 建議排除職業相關；流行病學資料顯示 BMI 26–30 相對危險約 2.0、>30 更高。把「BMI >30」當成必要條件是錯的，113-10 回憶版亦標「BMI 需 >30（應該是錯）」。","**正確**：指引列肥胖為非職業性致病因子之一（另有基因、性別、年齡、外傷、骨骼結構異常、激烈運動）。"],"explanation":"本題考蹲跪膝關節骨關節炎認定指引的主要基準。疾病證據三項同時符合：主觀症狀（疼痛腫脹、負重痛休息緩解、無力不穩、摩擦聲、活動受限）＋客觀理學（積液、摩擦聲、股四頭肌萎縮、變形）＋X 光 Kellgren-Lawrence 三級以上，可為單側或雙側（114-01 回憶「須兩膝都有」被列為錯誤，符合指引）。職業暴露：跪姿或蹲姿工作數年，典型為磁磚鋪設、浴室修繕、屋頂、地板工人，累積蹲跪超過 13,000 小時、每天平均佔一半工作時間、年資最短超過 10 年（合併負重抬舉或膝外傷可酌減）。時序：停止蹲跪工作前須已有 K/L 三級以上；離職或轉不需蹲跪工作 1 年後才出現者排除。排除非職業因素；BMI >30 應考量其貢獻、>35 建議排除。半月板指引則把「每日至少一小時、年資 5 年」作為門檻，兩者數字不同要分清。","dispute":"","review":{"key_points":["膝 OA 認定：症狀＋理學＋X 光 ==K/L ≥3 級==，==單側或雙側皆可==","暴露：蹲跪工作數年、累積 ==>13,000 小時==、每天佔一半、年資 ==>10 年==；離職 1 年後才發病者排除","BMI 是==競爭因子非必要條件==：26–30 RR≈2.0；>30 應考量、>35 建議排除職業相關"],"refs":[{"src":"長期以蹲跪姿勢工作引起之膝關節骨關節炎認定參考指引","file":"_ref/認定指引/all/長期以蹲跪姿勢工作引起之膝關節骨關節炎認定參考指引.txt","quote":"必須建立單側或雙側膝關節骨關節炎的診斷"},{"src":"長期以蹲跪姿勢工作引起之膝關節骨關節炎認定參考指引","file":"_ref/認定指引/all/長期以蹲跪姿勢工作引起之膝關節骨關節炎認定參考指引.txt","quote":"BMI 超過 30 時，其作用應加以考量，若 BMI 超過 35 時，建議予以排除職業相關"},{"src":"長期以蹲跪姿勢工作引起之膝關節骨關節炎認定參考指引","file":"_ref/認定指引/all/長期以蹲跪姿勢工作引起之膝關節骨關節炎認定參考指引.txt","quote":"體重過重(BMI 介於 26-30 間)的相對危險性為 2.02"}],"note_ref":"三、膝關節：半月板與骨關節炎"}},{"qid":"c17q09","q":"長期手臂高舉過肩工作（如油漆粉刷、天花板施工）最容易造成下列何種職業病？","options":["肩旋轉肌袖症候群","腕隧道症候群","腰椎椎間盤突出","白指症"],"answer":0,"recon":"full","src":["整理-表格","115-02"],"optexp":["**符合／正確（本題答案）**：旋轉肌袖症候群（棘上肌肌腱炎、撕裂、斷裂、夾擠）與反覆或持續手臂高舉過肩有關，指引列油漆工、清潔人員、營造、倉儲為高風險，丹麥研究顯示房屋油漆工棘上肌肌腱炎盛行率最高；98 年 5 月 1 日納入勞保職業病種類，114 年 8 月修正指引。","**不符合／錯誤**：腕隧道症候群的危害因子是腕部反覆、用力、振動、壓迫，與過肩無關。","**不符合／錯誤**：腰椎椎間盤突出與搬抬重物、全身振動有關；過肩搬抬只是腰椎指引的加重考量之一，不是主要對應。","**不符合／錯誤**：白指症是手持振動工具（鏈鋸、鑿岩機）造成的手臂振動症候群。"],"explanation":"本題考旋轉肌袖症候群的職業暴露。機轉：手臂高舉過肩時棘上肌肌腱在肩峰下空間受夾擠（impingement），反覆則發炎、退化、撕裂。認定指引（114 年 8 月修正）主要基準——疾病：肩痛、高舉過肩或外展加內轉疼痛，倒罐子試驗、疼痛弧、Neer、Hawkins 陽性，超音波或 MRI 或手術證實棘上肌病變；暴露：高風險作業（肩屈曲或外展 ≥90 度、手肘過肩、手過頭）累積平均每日 4 小時以上，肌腱炎最短暴露 3 個月、撕裂或斷裂最短 1 年；抬舉 >90 度合併負重 >10 kg 且每分鐘 ≥15 次可酌減時間；油漆工只計抬舉塗漆時間。排除運動傷害、先天疾病、滑囊炎、冷凍肩。表格記法：「肩袖症候群＝長期手舉過肩，油漆工」。","dispute":"","review":{"key_points":["旋轉肌袖症候群＝==手臂高舉過肩==（肩屈曲／外展 ≥90 度、手過頭）的反覆作業：油漆工、天花板施工、清潔、營造、倉儲","暴露：高風險作業每日 ==≥4 小時==；肌腱炎最短 ==3 個月==、撕裂／斷裂最短 ==1 年==","==98 年 5 月 1 日== 納入勞保職業病種類；114 年 8 月修正指引；以棘上肌病變為主"],"refs":[{"src":"職業性旋轉肌袖症候群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性旋轉肌袖症候群認定參考指引-11408修正.txt","quote":"勞動部於民國 98 年 5 月 1 日起即將旋轉肌袖症候群納入新增"},{"src":"職業性旋轉肌袖症候群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性旋轉肌袖症候群認定參考指引-11408修正.txt","quote":"高風險作業時間累積平均每日達 4 小時以上"},{"src":"職業性旋轉肌袖症候群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性旋轉肌袖症候群認定參考指引-11408修正.txt","quote":"肌腱炎最短暴露期為 3 個月"}],"note_ref":"四、肩部：旋轉肌袖症候群"}},{"qid":"c17q10","q":"有關電腦工作站之人因工程，下列敘述何者錯誤？","options":["椅子應有椅背並提供腰部支撐","電腦螢幕頂端高度應使視線略向上 15 度","螢幕應置於正前方，避免扭轉軀幹作業","文件架高度應與螢幕高度相近"],"answer":1,"recon":"full","src":["115-02","整理-表格"],"optexp":["**正確**：座椅應有椅背並提供腰部支撐（腰靠），維持腰椎前凸，減少椎間盤壓力。","**錯誤（本題答案）**：螢幕頂端應約與眼睛同高或略低，使視線向下俯視約 15–25 度（最低不超過 30 度）；視線向上會使頸部後仰、增加頸椎與眼睛負荷。表格：「坐下電腦螢幕最適宜角度：俯視 15–25 度，最低不超過 30 度」。","**正確**：螢幕與鍵盤置於正前方，避免扭轉軀幹或頸部作業。","**正確**：文件架應與螢幕高度、距離相近，減少頭頸反覆上下與調焦。"],"explanation":"本題考電腦工作站（VDT）的人因工程原則。螢幕：頂端與眼睛同高或略低、視線俯視 15–25 度（不超過 30 度）、距離約一臂長（50–70 cm）、正前方、避免反光；鍵盤滑鼠：手肘約 90 度、前臂與地面平行、手腕保持中立不上翹、有前臂或手腕支撐；座椅：高度可調使雙腳平放（必要時腳踏）、椅背有腰部支撐、大腿與地面平行；文件架與螢幕同高同距；每工作 50–60 分鐘休息或變換姿勢，並注意照明與眩光。常見錯誤設計：螢幕過高（頸後仰）、過低（頸前屈）、鍵盤過高（聳肩、腕背屈）、椅子無腰靠。這些原則也用於評估辦公室員工的頸肩、上肢肌肉骨骼不適。","dispute":"","review":{"key_points":["螢幕頂端與眼睛同高或略低，視線==俯視 15–25 度==（最低不超過 30 度），距離約一臂長，正前方","手肘約 90 度、腕部中立、有支撐；椅背腰部支撐、雙腳平放、文件架與螢幕同高","視線向上＝頸部後仰＝錯誤設計；定時休息變換姿勢"],"refs":[],"note_ref":"五、人因工程：工作站與評估工具"}},{"qid":"c17q11","q":"下列何者不是人因工程之肌肉骨骼危害評估工具？","options":["KIM（關鍵指標法：抬舉／搬運、推拉、手工物料作業）","HAL-TLV（手部活動等級／危害暴露極限，評估上肢重複性作業）","RULA（快速上肢評估表）","NMQ（北歐肌肉骨骼症狀問卷）"],"answer":3,"recon":"full","src":["整理-表格"],"optexp":["**不符合／錯誤（是評估工具）**：KIM（關鍵指標法）是德國／歐盟發展的人因負荷評估工具，分抬舉搬運（KIM-LHC）、推拉（KIM-PP）、手工物料處理（KIM-MHO）等模組，肌腱炎指引提到 KIM-MHO2019。","**不符合／錯誤（是評估工具）**：ACGIH 的 HAL-TLV（手部活動等級／閾限值）評估上肢重複性作業的手部活動與尖峰施力，腕隧道指引指出它有較多流行病學資料。","**不符合／錯誤（是評估工具）**：RULA（快速上肢評估）依上肢、頸、軀幹姿勢與肌肉用力、負荷評分，屬觀察式姿勢評估工具；同類還有 REBA、OWAS。","**符合／正確（本題答案）**：NMQ（北歐肌肉骨骼症狀問卷）是自覺症狀盛行率調查問卷（過去 12 個月、7 天各部位不適），評估「結果」而非「暴露」，不是人因工程的危害評估工具；表格註「(C) NMQ（非人因工程量表）」。"],"explanation":"本題考人因工程評估工具的分類。暴露／負荷評估工具：觀察式姿勢評估——RULA（上肢）、REBA（全身）、OWAS（背、上臂、前臂、腿的姿勢分類）；關鍵指標法 KIM（抬舉搬運、推拉、手工物料處理）；ACGIH HAL-TLV（手部活動等級與尖峰施力）；NIOSH 抬舉公式與 Strain Index（工作負荷指數）；EAWS。結果／症狀評估：NMQ 北歐問卷（自覺症狀盛行率）、身體不適圖。指引的立場：檢核表可作風險等級參考，但無法直接當「超過兩倍致病風險」的證據，KIM 的流行病學研究不足、HAL-TLV 資料較多；認定職業病仍要工作現場觀察、錄影、量化頻率與重量。考題以「何者不是人因工程評估工具」出現，答案固定是 NMQ。","dispute":"","review":{"key_points":["人因暴露評估工具：==KIM==（抬舉搬運、推拉、手工物料）、==HAL-TLV==（手部活動）、==RULA／REBA／OWAS==（姿勢）、NIOSH 抬舉公式、Strain Index","==NMQ＝北歐症狀問卷==，評估自覺症狀盛行率，不是人因評估工具","檢核表只能當風險等級參考；KIM 流病證據不足、HAL-TLV 資料較多"],"refs":[{"src":"職業性腕隧道症侯群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性腕隧道症侯群認定參考指引-11408修正.txt","quote":"KIM 工具的流行病學相關性研究不足"},{"src":"職業性肌腱炎認定參考指引-11408修正","file":"_ref/認定指引/all/職業性肌腱炎認定參考指引-11408修正.txt","quote":"關鍵指標法——手工物料處理(KIM-MHO2019)"}],"note_ref":"五、人因工程：工作站與評估工具"}},{"qid":"c17q12","q":"下列何種職業性肌肉骨骼疾病與暴露之配對錯誤？","options":["全身振動（長途駕駛）：腰椎椎間盤突出","手持振動工具（電鑽、鏈鋸）：白指症、腕隧道症候群","長期蹲跪：膝關節半月狀軟骨病變、膝關節骨關節炎","長期使用電腦：肩旋轉肌袖撕裂"],"answer":3,"recon":"rebuilt","src":["整理-表格","113-12"],"optexp":["**正確**：全身振動（長途駕駛、重機械操作）與腰椎椎間盤突出有專屬認定指引，基準為每天暴露強烈振動車輛連續 8–10 年、振動約 0.6–0.8 m/s²。","**正確**：手持振動工具造成手臂振動症候群（白指症、雷諾現象）並列為腕隧道症候群的五項危害因子之一。","**正確**：長期蹲跪對應膝關節半月狀軟骨病變與膝關節骨關節炎，各有認定指引。","**錯誤（本題答案）**：肩旋轉肌袖撕裂與手臂高舉過肩、負重抬舉有關；電腦作業主要與頸肩肌筋膜疼痛、上肢累積性傷害相關，不是旋轉肌袖撕裂的認定暴露。"],"explanation":"本題整合肌肉骨骼職業病的暴露配對：搬抬重物（每日 2 噸／1.5 噸、8–10 年）與全身振動（車輛駕駛 8–10 年、0.6–0.8 m/s²）→腰椎椎間盤突出；手持振動工具→手臂振動症候群（白指症）、腕隧道症候群；腕部高反覆、用力、不良姿勢、壓迫→腕隧道症候群、肌腱炎；長期蹲跪（每日 ≥1 小時、13,000 小時）→半月板病變、膝關節骨關節炎；手臂高舉過肩（每日 ≥4 小時）→旋轉肌袖症候群；頸部前屈負重→頸椎椎間盤突出。電腦作業在指引中沒有對應的認定疾病，它與頸肩肌筋膜疼痛、眼睛疲勞有關，證據不及過肩作業，所以「長期使用電腦：旋轉肌袖撕裂」是錯誤配對。","dispute":"","review":{"key_points":["腰椎椎間盤突出：搬抬（2 噸／1.5 噸）或==全身振動（駕駛 8–10 年）==","手持振動工具→白指症、CTS；蹲跪→半月板、膝 OA；==過肩→旋轉肌袖==","電腦作業→頸肩肌筋膜疼痛，非旋轉肌袖撕裂的認定暴露"],"refs":[{"src":"全身振動腰椎椎間盤突出","file":"_ref/認定指引/全身振動腰椎椎間盤突出.txt","quote":"每天暴露強烈振動車輛連續 8 到 10 年"},{"src":"職業性旋轉肌袖症候群認定參考指引-11408修正","file":"_ref/認定指引/all/職業性旋轉肌袖症候群認定參考指引-11408修正.txt","quote":"高風險作業時間累積平均每日達 4 小時以上"}],"note_ref":"四、肩部：旋轉肌袖症候群"}}]},{"idx":17,"order":17,"title":"神經毒性與神經學檢查","group":"粉塵、皮膚、肌骨與神經","gi":5,"notes_md":"本章約 8 題，考神經學檢查工具、周邊 vs 中樞病變的徵候，以及神經毒物與標的部位的配對。\n\n## 一、神經學檢查與周邊神經病變\n- 門診器材：眼底鏡、筆燈、==叩診槌==、音叉（128 Hz 振動覺）、針、棉花；==顯微鏡不是==身體檢查器材。\n- 周邊神經病變（下運動神經元）：無力、遠端先萎縮、==肌腱反射減弱或消失==（跟腱最早）、手套襪套型感覺異常、跨閾步態。\n- 上運動神經元：反射增強、痙攣、Babinski 陽性。\n\n## 二、神經毒物與標的部位配對\n| 毒物 | 標的／表現 |\n|---|---|\n| 鉛 | 成人==周邊運動神經==（垂腕、垂足；運動＞感覺、上肢＞下肢、慣用手重）；NCV 感覺與運動傳導速率降低（血鉛 30–50 μg/dL 即可見）；兒童鉛腦症 |\n| 汞 | ==手抖==（最初症狀）→意向性顫抖、興奮增盛、牙齦炎；晚期似巴金森 |\n| 錳 | ==蒼白球==（基底核）→類巴金森：對稱、雞步、易後倒、levodopa 反應差 |\n| 正己烷、1-溴丙烷 | 遠端感覺運動==多發性周邊神經病變==（2,5-己二酮；尿 2,5-HD 半衰期 13–14 小時） |\n| 三氯乙烯 | ==三叉神經==（腦神經）病變 |\n| 甲苯 | 急性中樞抑制欣快；慢性==腦白質病變、小腦與大腦萎縮==、視神經、聽力 |\n| 一氧化碳 | ==蒼白核==對稱壞死＋==大腦白質==去髓鞘；延遲性神經病變（1–41 天正常期後），高壓氧可降低 |\n| 二硫化碳 | 周邊神經＋類巴金森、精神症狀 |\n| 砷、鉈 | 對稱手套襪套型感覺運動神經病變 |\n- 鎳、鉻、鈷、鎘無神經毒性；甲醇→視神經、殼核。\n- 記法：鉛垂腕、汞手抖、錳巴金森、己烷周邊、甲苯小腦白質、CO 蒼白核、三氯乙烯三叉。\n\n## 三、甲苯與有機溶劑的中樞作用\n- 職業暴露症狀：一天結束時出現、週末假日減輕或消失；濫用者假日停用出現興奮、焦躁、失眠、渴求＝==戒斷症狀==。\n- 甲苯生物偵測：尿中馬尿酸、鄰甲酚；不致血癌（苯才會）。","questions":[{"qid":"c18q01","q":"職業醫學門診之基本神經學檢查，下列何種器材最少使用？","options":["眼底鏡","筆燈","叩診槌","顯微鏡"],"answer":3,"recon":"full","src":["113-2","113-11","114-05"],"optexp":["**不符合／錯誤（常用）**：眼底鏡用來看視乳頭水腫（顱內壓）、視網膜病變（糖尿病、高血壓）與視神經萎縮（甲醇、甲苯），是神經學檢查器材。","**不符合／錯誤（常用）**：筆燈檢查瞳孔大小、對光反射、眼球運動與咽反射，是腦神經檢查的基本工具。","**不符合／錯誤（常用）**：叩診槌檢查深部肌腱反射（二頭肌、三頭肌、膝、踝），周邊神經病變反射減弱、上運動神經元病變反射增強，是門診最常用的神經學器材。","**符合／正確（本題答案）**：顯微鏡是實驗室工具（尿沉渣、血液抹片），不是床邊神經學身體檢查的器材。"],"explanation":"本題考職業醫學門診基本神經學檢查的工具箱。身體檢查用具：眼底鏡（視乳頭、視網膜、視神經）、筆燈（瞳孔、腦神經）、叩診槌（深部肌腱反射、Babinski）、音叉（128 Hz 振動覺，正己烷、鉛、砷的周邊神經病變早期）、針與棉花（痛覺、輕觸覺，手套襪套型感覺缺損）、量角器與握力計。檢查內容：意識與認知（MMSE）、腦神經、運動（肌力、肌張力、萎縮、震顫）、感覺、反射、協調（小腦：指鼻、輪替、步態）、自主神經。顯微鏡、腦波、神經傳導檢查屬實驗室或進一步檢查。回憶版三份都問「最少使用」的器材，答案為顯微鏡。","dispute":"","review":{"key_points":["神經學身體檢查器材：眼底鏡、筆燈、==叩診槌==、音叉、針、棉花；==顯微鏡不是==","音叉 128 Hz 振動覺＝周邊神經病變早期指標；叩診槌看反射減弱（周邊）或增強（中樞）","顯微鏡、腦波、NCV 屬實驗室或進一步檢查"],"refs":[],"note_ref":"一、神經學檢查與周邊神經病變"}},{"qid":"c18q02","q":"有關周邊（末梢）神經受損之症狀與徵候，下列何者錯誤？","options":["肌肉無力","感覺麻木或異常","肌腱反射增強","遠端肌肉萎縮"],"answer":2,"recon":"full","src":["115-02"],"optexp":["**正確**：周邊神經（運動纖維）受損造成肌肉無力，正己烷指引描述肌肉無力或萎縮導致握物困難、走路困難。","**正確**：感覺纖維受損造成肢體末端感覺異常（刺痛、燒灼、麻木）或感覺消失，呈手套襪套型。","**錯誤（本題答案）**：周邊神經病變的肌腱反射是「減弱或消失」（跟腱反射最早喪失）；反射增強、痙攣、Babinski 陽性是上運動神經元（中樞）病變的徵候。","**正確**：軸突病變由最長的神經開始，遠端肌肉先萎縮（足部、手部小肌肉），出現跨閾步態。"],"explanation":"本題考周邊神經病變與中樞病變的徵候對照。下運動神經元／周邊神經病變：肌力下降、肌張力低下、肌萎縮、肌束顫動、深部肌腱反射減弱或消失、感覺異常呈手套襪套型、遠端先受影響（正己烷指引：肢體末端感覺異常、肌腱反射降低或消失、跟腱反射喪失、無法以腳跟行走、跨閾步態）。上運動神經元病變：痙攣性肌張力增加、反射增強、陣攣、Babinski 陽性、無明顯萎縮。職業神經毒物的對應：周邊神經——正己烷、溴丙烷、鉛（運動為主）、砷、鉈、丙烯醯胺、二硫化碳（混合）；中樞——錳、一氧化碳、甲苯、汞、甲醇（視神經）。115-02 回憶版直接問周邊神經受損徵候何者錯誤，答案是反射增強。","dispute":"","review":{"key_points":["周邊神經病變：無力、萎縮（遠端先）、==反射減弱或消失==、手套襪套型感覺異常、跟腱反射最早喪失、跨閾步態","上運動神經元：反射增強、痙攣、Babinski 陽性","周邊毒物：正己烷、溴丙烷、鉛、砷、鉈；中樞毒物：錳、CO、甲苯、汞"],"refs":[{"src":"正己烷中毒","file":"_ref/認定指引/正己烷中毒.txt","quote":"肌腱反射降低或消失，出現跟腱反射喪失"},{"src":"正己烷中毒","file":"_ref/認定指引/正己烷中毒.txt","quote":"肢體末端感覺異常(dysesthesia)刺痛、燒灼、麻木"}],"note_ref":"一、神經學檢查與周邊神經病變"}},{"qid":"c18q03","q":"許多重金屬中毒主要出現中樞神經症狀，但下列何者以周邊神經病變（運動神經為主之垂腕、垂足）為典型表現？","options":["鉛","鎳","鉻","鈷"],"answer":0,"recon":"partial","src":["113-3","113-11"],"optexp":["**符合／正確（本題答案）**：鉛中毒認定指引寫「鉛對人體的毒性，在成人多為周邊性運動神經病變」，運動神經受影響大於感覺神經、上肢比下肢嚴重，典型為橈神經垂腕、腓神經垂足；兒童則多見鉛腦症。","**不符合／錯誤**：鎳的職業病是接觸性皮膚炎、氣喘、鼻中隔病變與肺癌、鼻竇癌，無神經毒性。","**不符合／錯誤**：鉻造成鼻中隔潰瘍穿孔、皮膚潰瘍、氣喘與肺癌，無神經毒性。","**不符合／錯誤**：鈷造成硬金屬肺病、氣喘、心肌病變與皮膚炎，無周邊神經病變。"],"explanation":"本題考重金屬神經毒性的分布。多數重金屬以中樞神經為主：錳（基底核類巴金森）、無機汞（顫抖、興奮增盛）、鉛（兒童鉛腦症）、四烷基鉛（精神症狀）；以周邊神經病變聞名的是：鉛（成人，運動神經為主，垂腕垂足）、砷（感覺運動多發性神經病變，手套襪套型對稱麻痛）、鉈（痛性感覺神經病變、脫髮）、有機汞（感覺型周邊神經病變合併小腦與視野）；鎳、鉻、鈷、鎘無神經毒性。113-3 回憶版是複選型假單選（鉛、鎳、鉻、汞、鈷、碲）答鉛，【整理】記「鉛＋汞」，因有機汞亦可致周邊神經病變；本題單選只留鉛。鉛神經病變在血鉛約 30 μg/dL 就有初期表現（握力下降、刺麻、振動覺閾值異常），垂腕多在血鉛 >60–80 μg/dL。","dispute":"","review":{"key_points":["==鉛==：成人周邊性==運動==神經病變（垂腕、垂足），運動＞感覺、上肢＞下肢；兒童鉛腦症","周邊神經病變金屬：鉛、砷（對稱手套襪套）、鉈、有機汞；鎳、鉻、鈷、鎘無神經毒性","鉛神經初期表現血鉛約 30 μg/dL；垂腕多在 >60–80 μg/dL"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"鉛對人體的毒性，在成人多為周邊性運動神經病變"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"鉛對運動神經之毒性比感覺神經要大，上肢比下肢嚴重"},{"src":"職業性砷中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性砷中毒認定參考指引-2015修.txt","quote":"手或足部之麻痛感通常是對稱性分布(stockings and gloves)"}],"note_ref":"二、神經毒物與標的部位配對"}},{"qid":"c18q04","q":"下列有機溶劑中，何者會造成周邊神經病變？（1）正己烷（2）1-溴丙烷（3）三氯乙烯（4）氯仿","options":["（1）（2）","（1）（3）","（2）（4）","（3）（4）"],"answer":0,"recon":"full","src":["113-3","113-11"],"optexp":["**符合／正確（本題答案）**：正己烷經 2,5-己二酮造成遠端感覺運動多發性神經病變（運動與感覺傳導速率降低）；1-溴丙烷亦造成多發性神經病變（遠端潛時延長、周邊與中樞軸突髓鞘退化）。113-3 回憶版答 (1)(2)。","**不符合／錯誤**：三氯乙烯的特徵是腦神經病變（三叉神經功能與型態改變，可能與二氯乙炔有關）與中樞抑制，週邊神經病變極少。","**不符合／錯誤**：氯仿是中樞麻醉劑與肝毒物，1-溴丙烷才是周邊神經毒物。","**不符合／錯誤**：三氯乙烯與氯仿都不以周邊神經病變為主。"],"explanation":"本題考有機溶劑的神經毒性分型。周邊神經病變：正己烷（代謝物 2,5-己二酮，尿中 2,5-HD 為生物暴露指標，半衰期 13–14 小時；遠端對稱感覺運動神經病變，跟腱反射喪失、跨閾步態，停止暴露後可先惡化數月再緩慢恢復）、甲基丁酮（同樣代謝為 2,5-己二酮）、1-溴丙烷（下肢無力、走路不穩、感覺異常，脛神經遠端潛時延長）、二硫化碳（周邊與中樞混合）、丙烯醯胺。腦神經病變：三氯乙烯（三叉神經、前庭）。中樞為主：甲苯（小腦、白質）、氯仿與多數鹵化烴（麻醉、肝腎）。分級指引正己烷作業第三級判定即為「暴露後才發生之周邊神經病變」，溴丙烷作業要鑑別糖尿病等其他末梢神經病變原因。","dispute":"","review":{"key_points":["周邊神經溶劑：==正己烷（2,5-己二酮）、1-溴丙烷==、甲基丁酮、二硫化碳、丙烯醯胺","三氯乙烯→==三叉神經==（腦神經）病變；氯仿→中樞麻醉、肝毒性","正己烷尿中 2,5-HD 半衰期 13–14 小時；停止暴露後可先惡化數月"],"refs":[{"src":"正己烷中毒","file":"_ref/認定指引/正己烷中毒.txt","quote":"造成多發性神經病變，使運動神經和感覺神經的傳導速率降低"},{"src":"職業性溴丙烷中毒及其續發症認定參考指引","file":"_ref/認定指引/all/職業性溴丙烷中毒及其續發症認定參考指引.txt","quote":"周邊神經和中樞神經軸突髓鞘的退化"},{"src":"職業性三氯乙烯中毒認定參考指引","file":"_ref/認定指引/all/職業性三氯乙烯中毒認定參考指引.txt","quote":"三氯乙烯導致的腦神經病變主要見於三叉神經"}],"note_ref":"二、神經毒物與標的部位配對"}},{"qid":"c18q05","q":"下列神經毒物與其病變之配對，何者錯誤？","options":["鉛：垂腕（運動神經病變）","汞：手部顫抖","錳：類巴金森症候群","正己烷：小腦病變"],"answer":3,"recon":"full","src":["114-04"],"optexp":["**正確**：鉛造成以運動神經為主的周邊神經病變，橈神經受累出現垂腕（wrist drop），腓神經受累垂足。","**正確**：汞中毒指引寫「手抖可能是最初的症狀」，從靜止時細緻手抖進展為意向性顫抖，合併興奮增盛（erethism）。","**正確**：錳沉積基底核，尤其蒼白球神經細胞變性，造成類巴金森症候群（對稱、雞步、易後倒、對 levodopa 反應不佳）。","**錯誤（本題答案）**：正己烷造成的是遠端感覺運動多發性周邊神經病變，不是小腦病變；小腦萎縮與運動失調是甲苯（吸食強力膠）的特徵。114-04 回憶版註「正己烷／小腦病變 (x 遠端感覺運動多發性神經病變)」。"],"explanation":"本題考神經毒物與病變的配對，是本章核心。鉛：周邊運動神經病變（垂腕、垂足）、兒童鉛腦症、認知影響；汞（元素汞、無機汞）：手抖（最初症狀）→意向性顫抖、興奮增盛、牙齦炎、流涎，晚期似巴金森；錳：蒼白球病變→類巴金森（對稱、姿勢性顫抖、雞步、易後倒、levodopa 效果差、精神症狀早）；正己烷、溴丙烷：遠端周邊神經病變；甲苯：急性麻醉欣快，慢性腦白質病變、小腦與大腦萎縮、視神經病變、聽力惡化；一氧化碳：蒼白核與大腦白質、延遲性神經病變；二硫化碳：周邊神經與類巴金森、精神症狀；三氯乙烯：三叉神經；甲醇：視神經。記法「鉛垂腕、汞手抖、錳巴金森、己烷周邊、甲苯小腦白質、CO 蒼白核」。","dispute":"","review":{"key_points":["鉛→==垂腕==（運動神經）；汞→==手抖==、興奮增盛；錳→==蒼白球／類巴金森==","正己烷→遠端感覺運動多發性周邊神經病變（不是小腦）；甲苯→小腦萎縮、腦白質病變","CO→蒼白核、白質、延遲性神經病變；二硫化碳→周邊＋類巴金森；三氯乙烯→三叉神經"],"refs":[{"src":"甲苯中毒","file":"_ref/認定指引/甲苯中毒.txt","quote":"瀰漫性皮質、小腦和大腦萎縮"},{"src":"職業性汞中毒認定參考指引-2015修","file":"_ref/認定指引/all/職業性汞中毒認定參考指引-2015修.txt","quote":"手抖可能是最初的症狀"},{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"錳中毒主要病變在大腦基底核，尤其在蒼白球的神經細胞變性"}],"note_ref":"二、神經毒物與標的部位配對"}},{"qid":"c18q06","q":"下列神經毒物之標的部位配對，何者正確？","options":["錳：蒼白核；一氧化碳：蒼白核與大腦白質；甲苯：小腦與大腦白質","錳：小腦；一氧化碳：海馬迴；甲苯：脊髓","錳：周邊神經；一氧化碳：周邊神經；甲苯：周邊神經","三者皆為視神經"],"answer":0,"recon":"rebuilt","src":["113-2","113-12","114-03","115-02"],"optexp":["**符合／正確（本題答案）**：錳沉積基底核、主要病變在蒼白球；一氧化碳典型病灶為兩側蒼白核對稱性低密度，最常見的異常在大腦白質（去髓鞘、水腫、壞死）；甲苯慢性吸食造成腦白質病變與小腦、大腦萎縮。","**不符合／錯誤**：錳不以小腦為主，一氧化碳雖可累及海馬迴但典型在蒼白核與白質，甲苯不以脊髓為主。","**不符合／錯誤**：三者都是中樞神經毒物，周邊神經是正己烷、溴丙烷、鉛、砷的標的。","**不符合／錯誤**：視神經是甲醇的標的（甲苯也有視神經病變，但不是三者共同標的）。"],"explanation":"本題整合三種中樞神經毒物的影像與病理部位。錳：MRI T1 基底核高訊號，病理以蒼白球神經細胞變性為主、黑質較少，臨床類巴金森。一氧化碳：急性期兩側蒼白核對稱性缺血壞死（CT 低密度），最常見病灶在大腦白質（去髓鞘、水腫、出血點）；延遲性神經病變（1–41 天正常期後出現智能減退、類巴金森、大小便失禁、步態不穩），積極高壓氧可降低發生率。甲苯：長期吸食強力膠造成腦白質病變（toluene leukoencephalopathy）、瀰漫性皮質、小腦與大腦萎縮，症狀有運動失調、認知缺陷、視神經病變、感覺神經性聽損。其他：二硫化碳→腦病變與類巴金森；甲醇→視神經與殼核；正己烷、溴丙烷、鉛、砷、鉈→周邊神經。","dispute":"","review":{"key_points":["==錳→蒼白球==（基底核，T1 高訊號）；==CO→蒼白核對稱壞死＋大腦白質去髓鞘==；==甲苯→小腦、大腦白質==","CO 延遲性神經病變：1–41 天正常期後智能減退、類巴金森；高壓氧可降低","甲醇→視神經、殼核；二硫化碳→類巴金森；周邊神經＝正己烷、溴丙烷、鉛、砷、鉈"],"refs":[{"src":"職業暴露一氧化碳引起之疾病認定參考指引","file":"_ref/認定指引/all/職業暴露一氧化碳引起之疾病認定參考指引.txt","quote":"一氧化碳中毒的腦部異常最常見的病灶在大腦白質"},{"src":"甲苯中毒","file":"_ref/認定指引/甲苯中毒.txt","quote":"長期反覆性接觸甲苯，會引起腦白質病變"},{"src":"17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正","file":"_ref/認定指引/all/17職業暴露錳及其化合物引起之中毒認定參考指引-10803修正.txt","quote":"錳中毒主要病變在大腦基底核，尤其在蒼白球的神經細胞變性"}],"note_ref":"二、神經毒物與標的部位配對"}},{"qid":"c18q07","q":"有關鉛中毒之神經傳導檢查（NCV），下列敘述何者正確？","options":["運動神經傳導速度減慢，且運動神經受影響大於感覺神經","只有感覺神經傳導異常","神經傳導檢查完全正常","以近端肌肉病變為主"],"answer":0,"recon":"rebuilt","src":["113-2","114-01"],"optexp":["**符合／正確（本題答案）**：鉛中毒指引寫神經生理學檢查「可見感覺和運動神經傳導速率降低和感覺閥值異常」，且「鉛對運動神經之毒性比感覺神經要大，上肢比下肢嚴重」，末期不對稱肌力減退（慣用手較嚴重）、垂腕垂足。","**不符合／錯誤**：鉛不是「只有感覺神經」異常；感覺閾值雖會變，但運動神經才是主要受害者。","**不符合／錯誤**：血鉛 30–50 μg/dL 即可見正中與尺神經傳導速率降低，不會完全正常。","**不符合／錯誤**：鉛神經病變是軸突病變、遠端為主（手的抓握力下降、垂腕），不是近端肌肉病變。"],"explanation":"本題考鉛神經毒性的電生理特徵。鉛在成人造成周邊性運動神經病變，病理為節段性脫髓鞘、軸突變性與節前阻斷，大而快速的感覺神經對鉛特別敏感、早期可逆；NCV 顯示感覺與運動神經傳導速率降低、振幅下降與感覺閾值異常，Seppalainen 發現血鉛 30–50 μg/dL 即有正中與尺神經傳導變慢；末期不對稱肌力減退（慣用手較重）、肌肉萎縮、垂腕、垂足。整體而言鉛對運動神經的毒性大於感覺神經、上肢比下肢嚴重，這是它與正己烷（感覺運動對稱、下肢先）、砷（感覺為主、對稱）的區別。114-01 回憶版「何者非鉛中毒之症狀：垂腕／急性腦症／傳導神經變慢／運動神經受損」四項都是鉛中毒表現，題目本身有瑕疵，本題整合為正確敘述。分級指引鉛作業的神經學檢查也包含 NCV。","dispute":"","review":{"key_points":["鉛 NCV：==感覺與運動傳導速率降低==、振幅下降；血鉛 30–50 μg/dL 即可見","==運動＞感覺、上肢＞下肢==、慣用手較重；末期垂腕垂足、肌萎縮","對比：正己烷感覺運動對稱下肢先；砷感覺為主對稱"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"可見感覺和運動神經傳導速率降低和感覺閥值異常"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"鉛對運動神經之毒性比感覺神經要大"}],"note_ref":"二、神經毒物與標的部位配對"}},{"qid":"c18q08","q":"吸食強力膠（甲苯）者，若假日未接觸可能出現興奮、焦躁等現象，此反映下列何種情形？","options":["戒斷症狀（withdrawal）","遲發性神經病變","甲苯的肝毒性","變性血紅素血症"],"answer":0,"recon":"rebuilt","src":["113-4","113-11"],"optexp":["**符合／正確（本題答案）**：長期吸食甲苯者已產生依賴，假日停用時出現焦躁、興奮、失眠、渴求等戒斷表現；113-4 回憶版選項「假日未接觸可能會興奮」即指此。","**不符合／錯誤**：遲發性神經病變是一氧化碳（延遲性神經病變）或有機磷（OPIDN）的概念，甲苯無此表現。","**不符合／錯誤**：甲苯的肝毒性輕微，且不會以「假日興奮」表現。","**不符合／錯誤**：變性血紅素血症是苯胺、硝基苯、亞硝酸鹽的表現，與甲苯無關。"],"explanation":"本題考甲苯的濫用與戒斷。甲苯急性作用是中樞抑制——欣快、麻醉、頭暈、協調失常，高濃度可致心律不整猝死（sudden sniffing death）；長期吸食產生耐受與依賴，停用時出現戒斷症狀（焦躁、興奮、失眠、渴求、噁心），所以「假日未接觸反而興奮焦躁」反映的是戒斷。要與一般溶劑職業暴露的型態區分：認定指引描述慢性甲苯中毒症狀（黏膜刺激、欣快、頭痛、眩暈）「一般出現於一天結束時，一週結束時更嚴重，而週末或假日則減輕或消失」——這是暴露相關症狀，方向與戒斷相反。甲苯慢性神經毒性：腦白質病變、小腦與大腦萎縮、認知缺陷、視神經病變、聽力惡化（與噪音協同）；生物偵測用尿中馬尿酸或鄰甲酚。","dispute":"","review":{"key_points":["甲苯濫用者假日停用出現興奮、焦躁、失眠、渴求＝==戒斷症狀==","職業暴露症狀型態相反：一天結束時出現、週末假日減輕或消失","甲苯急性＝中樞抑制、欣快、猝死；慢性＝腦白質病變、小腦萎縮、視神經、聽力；生物偵測尿馬尿酸、鄰甲酚"],"refs":[{"src":"甲苯中毒","file":"_ref/認定指引/甲苯中毒.txt","quote":"這些症狀一般出現於一天結束時，一週結束時更嚴重，而週末或假日則減輕或消失"},{"src":"甲苯中毒","file":"_ref/認定指引/甲苯中毒.txt","quote":"長時間甲苯濫用暴露者(吸食強力膠)表現出多種中樞神經系統危害"}],"note_ref":"三、甲苯與有機溶劑的中樞作用"}}]},{"idx":18,"order":18,"title":"32 項作業總表：危害、特殊檢查與三四級門檻","group":"考前總表","notes_md":"","notes_html":"\u003cp class=\"sum-lead\">依《勞工特殊健康檢查健康管理分級建議指引（精簡版手冊，111.11）》逐項整理勞工健康保護規則舊附表一的 \u003cb>32 項\u003c/b>特別危害健康作業。每列抓「急性／慢性危害、和別項不一樣的檢查、第三級與第四級的判定門檻、考點」。底色依 307 題考古題中提到該作業的題數：\u003cspan class=\"sum-key hi\">高頻（≥15 題）\u003c/span>噪音、游離輻射、鉛、苯、砷及其化合物、錳及其化合物、粉塵、鎘及其化合物、汞及其無機化合物；\u003cspan class=\"sum-key mid\">中頻（8–14 題）\u003c/span>高溫、正己烷、氯乙烯、鉻酸及其鹽類、鎳及其化合物。\u003c/p>\n\n\u003cdiv class=\"sum-rules\">\n\u003ch3>先記通則，表格只看例外\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>二級\u003c/b>＝異常但可由工作以外原因解釋（多數作業會舉例：脂肪肝、病毒性肝炎、缺鐵性貧血、泌尿道感染、陳舊性肺結核、糖尿病神經病變、乾癬…；TDI、錳、鎘未舉例）。\u003c/li>\n\u003cli>\u003cb>三級\u003c/b>＝異常且\u003cmark class=\"hl\">符合該作業的健康危害表現\u003c/mark>，又\u003cmark class=\"hl\">無法由工作以外原因解釋，或事業單位未提供足以判定之環測紀錄\u003c/mark>→請職醫評估；職醫追蹤複檢後不宜維持三級。\u003c/li>\n\u003cli>\u003cb>四級\u003c/b>＝同樣的表現，但\u003cmark class=\"hl\">可由工作相關原因解釋\u003c/mark>。所以多數作業三、四級的數字門檻\u003cb>一模一樣\u003c/b>，差別只在「能不能歸因於工作」。\u003c/li>\n\u003cli>例外：\u003cb>鉻酸（尿鉻）、鈹（尿鈹）、錳（血錳尿錳）\u003c/b>的數字只出現在第四級，當作工作相關的佐證。\u003c/li>\n\u003cli>共用門檻：\u003cmark class=\"hl\">蛋白尿 ≥2 價（≥100 mg/dL）\u003c/mark>出現在 12 項（高溫、鉛、四烷基鉛、四氯乙烷、四氯化碳、二硫化碳、三四氯乙烯、聯苯胺、砷、鎘、乙基汞、無機汞）。\u003c/li>\n\u003cli>輔助基準（環測濃度）多數是 \u003cmark class=\"hl\">PEL 的一半\u003c/mark>；例外是溴丙烷 1/10、鈹 1/20、不得檢出者「檢出即算」。沒有輔助基準的：物理性四項、鉛、四烷基鉛、石綿、粉塵、砷、鎘、鎳、乙基汞。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\n\u003cdiv class=\"sum-ctrl\" role=\"group\" aria-label=\"總表顯示設定\">\n\u003cspan class=\"sum-ctrl-l\">篩選\u003c/span>\n\u003cbutton type=\"button\" class=\"sum-btn on\" data-sumfilter=\"all\">全部 32 項\u003c/button>\n\u003cbutton type=\"button\" class=\"sum-btn\" data-sumfilter=\"hot\">只看常考 14 項\u003c/button>\n\u003cspan class=\"sum-ctrl-l\">欄位（點一下隱藏，可用來自我測驗）\u003c/span>\n\u003cbutton type=\"button\" class=\"sum-btn on\" data-sumcol=\"haz\">急慢性危害\u003c/button>\n\u003cbutton type=\"button\" class=\"sum-btn on\" data-sumcol=\"exam\">特殊檢查\u003c/button>\n\u003cbutton type=\"button\" class=\"sum-btn on\" data-sumcol=\"g3\">第三級\u003c/button>\n\u003cbutton type=\"button\" class=\"sum-btn on\" data-sumcol=\"g4\">第四級\u003c/button>\n\u003cbutton type=\"button\" class=\"sum-btn on\" data-sumcol=\"diff\">考點\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"sum-wrap\" id=\"sumWrap\">\n\u003ctable class=\"sum-table\">\n\u003cthead>\u003ctr>\n\u003cth scope=\"col\" class=\"c-name\">作業\u003c/th>\n\u003cth scope=\"col\" class=\"col-haz\">急性危害\u003c/th>\n\u003cth scope=\"col\" class=\"col-haz\">慢性危害\u003c/th>\n\u003cth scope=\"col\" class=\"col-exam\">和別項不一樣的特殊檢查\u003c/th>\n\u003cth scope=\"col\" class=\"col-g3\">第三級門檻\u003c/th>\n\u003cth scope=\"col\" class=\"col-g4\">第四級門檻\u003c/th>\n\u003cth scope=\"col\" class=\"col-diff\">與別人不一樣／考點\u003c/th>\n\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"t-mid\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">01\u003c/span>\u003cb>高溫\u003c/b>\u003cspan class=\"sum-cat\">物理\u003c/span>\u003cspan class=\"sum-badge mid\">中頻・10 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">中暑、熱衰竭、熱痙攣；誘發氣喘；心血管病、糖尿病、腎臟病惡化\u003c/td>\u003ctd class=\"col-haz\">熱紅疹；角膜、水晶體灼傷；不孕、低血鉀、低血鈉、腎結石\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>藥物史\u003c/strong>（利尿劑、降壓藥、鎮定劑、抗痙攣、抗凝血、抗膽鹼）；\u003cstrong>飯前血糖、BUN、肌酸酐、Na/K/Cl\u003c/strong>；血色素；肺功能；\u003cstrong>心電圖\u003c/strong>\u003c/td>\u003ctd class=\"col-g3\">符合表現：熱紅疹、\u003cmark class=\"hl\">高 BUN\u003c/mark>、\u003cmark class=\"hl\">血鈉／血鉀異常\u003c/mark>、蛋白尿 \u003cmark class=\"hl\">≥2 價（≥100 mg/dL）\u003c/mark>、\u003cmark class=\"hl\">高血色素\u003c/mark>（脫水）\u003c/td>\u003ctd class=\"col-g4\">同三級表現（如\u003cstrong>反覆發作\u003c/strong>之熱紅疹）＋可由工作解釋\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>BUN 與電解質只在高溫\u003c/strong>（附表九一般檢查沒有 BUN）；要問\u003cstrong>目前服用藥物\u003c/strong>（利尿劑等會干擾散熱）；考量疾病含\u003cstrong>無汗症\u003c/strong>\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">02\u003c/span>\u003cb>噪音（≥85 dBA）\u003c/b>\u003cspan class=\"sum-cat\">物理\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・41 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">\u003cstrong>&gt;140 dB\u003c/strong> 瞬間撕裂柯氏器與基底膜→永久聽損（聲創傷，常伴耳鳴，爆破作業）\u003c/td>\u003ctd class=\"col-haz\">漸進、\u003cmark class=\"hl\">兩耳對稱\u003c/mark>（差 ≤10 dB）、\u003cstrong>感覺神經性\u003c/strong>；由高頻 3–6K 開始，3K／4K／6K 凹陷、6K 或 8K \u003cstrong>up-turn\u003c/strong>\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>聽力檢查\u003c/strong>：至少 \u003cmark class=\"hl\">500、1K、2K、3K、4K、6K、8K\u003c/mark> 純音並建立聽力圖；耳道檢查；耳毒性藥物史（\u003cstrong>水楊酸、鏈黴素\u003c/strong>）\u003c/td>\u003ctd class=\"col-g3\">4K 或 6K 凹陷且 \u003cmark class=\"hl\">4K／6K ≥40 dB\u003c/mark>，或 \u003cmark class=\"hl\">高頻平均(3K+4K+6K)/3 比低頻平均(0.5K+1K+2K)/3 差 ≥10 dB\u003c/mark>；\u003cstrong>須到合格聽力室複檢\u003c/strong>後請職醫評估；或未提供環測／聽力防護紀錄\u003c/td>\u003ctd class=\"col-g4\">凹陷 ≥40＋三分法 ≤25＋高低差 &lt;10（或凹陷 ≤40＋高低差 ≥10）→\u003cstrong>早期噪音性聽損\u003c/strong>，聽力防護計畫；凹陷 ≥40＋三分法 ≥25＋高低差 ≥10→\u003cstrong>噪音性聽損\u003c/strong>，防護＋配工；三分法與前一年比 \u003cmark class=\"hl\">變化 ≥10 dB\u003c/mark>→考慮暫停暴露\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>第二級直接給數字\u003c/strong>：三分法 \u003cmark class=\"hl\">≥25 dB\u003c/mark> 列二級追蹤；第四級要依情境\u003cstrong>加註\u003c/strong>；全聾者仍須做噪音健檢；健檢人數與第四級人數都是第一（課堂：105 年第四級 2301 人）\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">03\u003c/span>\u003cb>游離輻射\u003c/b>\u003cspan class=\"sum-cat\">物理\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・19 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">\u003cmark class=\"hl\">≥100 cGy\u003c/mark> 6 小時內倦怠、腸胃不適；一週內造血與腸胃問題；&lt;600 cGy 治療後預後佳\u003c/td>\u003ctd class=\"col-haz\">皮膚病變、肺纖維化、\u003cstrong>白內障\u003c/strong>、\u003cstrong>甲狀腺腫瘤\u003c/strong>、\u003cstrong>白血病\u003c/strong>、阻塞性動脈炎、腸道狹窄\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>甲狀腺功能（free T4、TSH）\u003c/strong>；眼睛（含\u003cstrong>白內障\u003c/strong>）；\u003cstrong>心智及精神檢查\u003c/strong>；胸部 X 光；\u003cstrong>全套血球含白血球分類、血小板\u003c/strong>；尿糖、尿沉渣鏡檢；肺功能只在\u003cstrong>體格\u003c/strong>檢查（核電廠／廢料貯存場定期也要加）\u003c/td>\u003ctd class=\"col-g3\">\u003cstrong>血球減少（特別是淋巴球）\u003c/strong>、疑似白血病、\u003cstrong>甲狀腺功能低下或甲狀腺癌\u003c/strong>、輻射性皮膚炎／皮膚癌、肺炎或肺纖維化、骨癌、白內障；或未提供\u003cstrong>劑量計（配章）\u003c/strong>紀錄\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋可由工作解釋\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>沒有生物偵測，看劑量\u003c/strong>：職業劑量限度 \u003cmark class=\"hl\">50 mSv／年、100 mSv／連續 5 年\u003c/mark>；單次意外 \u003cmark class=\"hl\">&gt;50 mSv\u003c/mark> 須特別醫務監護；\u003cstrong>唯一做甲狀腺功能（free T4、TSH）與「心智及精神檢查」\u003c/strong>；紀錄保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">04\u003c/span>\u003cb>異常氣壓\u003c/b>\u003cspan class=\"sum-cat\">物理\u003c/span>\u003cspan class=\"sum-badge\">3 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">加壓期\u003cstrong>擠壓症\u003c/strong>（耳膜、鼻竇）；減壓期倦怠、皮膚癢、皮下氣腫、\u003cstrong>關節痛（最常見）\u003c/strong>；氮迷醉、O₂／CO／CO₂ 中毒\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>異壓性骨壞死\u003c/strong>、中樞神經退化（記憶力衰退、注意力不集中）\u003c/td>\u003ctd class=\"col-exam\">胸部 X 光、肺功能；\u003cmark class=\"hl\">40 歲以上\u003c/mark>或疑心臟病做\u003cstrong>心電圖\u003c/strong>（必要時心臟超音波）；體格檢查加\u003cstrong>抗壓力檢查、耐氧試驗\u003c/strong>；作業滿 \u003cmark class=\"hl\">5 年\u003c/mark>且肩、髖關節有問題→\u003cstrong>長骨 X 光\u003c/strong>\u003c/td>\u003ctd class=\"col-g3\">作業後暈眩、運動／知覺／平衡異常、慢性中耳炎、關節痛；胸部 X 光\u003cstrong>肺擠壓傷\u003c/strong>相關異常；\u003cstrong>異壓性骨壞死\u003c/strong>（骨 X 光放射線不透性陰影）\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋可由工作解釋\u003c/td>\u003ctd class=\"col-diff\">既往病史清單最長：\u003cstrong>自發性氣胸、耳部手術、活動性氣喘\u003c/strong>、酒癮毒癮、癲癇、胰臟炎、開胸手術、肱骨／股骨骨折、長期類固醇；\u003cstrong>妊娠中絕對禁止\u003c/strong>（職安法第 30 條）\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">05\u003c/span>\u003cb>鉛\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・33 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">急性腦病、昏迷、死亡；腎臟受損、貧血；注意力變差、抽搐（課堂：急性效應血鉛 \u003cmark class=\"hl\">&gt;80 μg/dL\u003c/mark>、鉛絞痛）\u003c/td>\u003ctd class=\"col-haz\">金屬味、便秘、\u003cstrong>齒齦鉛線\u003c/strong>、貧血、\u003cstrong>手腕／足踝運動神經病變（垂腕垂足）\u003c/strong>、腎病、痛風、生殖（流產、精蟲減少）\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>血中鉛\u003c/strong>；\u003cstrong>齒齦鉛緣\u003c/strong>檢查；血球比容、血色素、紅血球數；尿蛋白、尿潛血；生育狀況與消化道症狀病史\u003c/td>\u003ctd class=\"col-g3\">\u003cstrong>小球性低血色素\u003c/strong>（原因未明）、周邊神經病變（垂腕垂足）、蛋白尿 ≥2 價；或血鉛 \u003cmark class=\"hl\">男 ≥40、女 ≥30 μg/dL\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">鉛絞痛、齒齦鉛緣、小球性貧血（\u003cstrong>排除缺鐵性與海洋性\u003c/strong>）、神經病變、腎病變；或血鉛 \u003cmark class=\"hl\">男 ≥40、女 ≥30\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>男女門檻不同的唯一作業\u003c/strong>；二級舉例「缺鐵性貧血」「飲食造成血鉛偏高」；母性保護另一套：血鉛 \u003cmark class=\"hl\">&lt;5／5–&lt;10／≥10 μg/dL\u003c/mark>；\u003cstrong>妊娠與產後一年絕對禁止\u003c/strong>；尺神經小運動纖維傳導是最敏感的周邊指標（課堂）\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">06\u003c/span>\u003cb>四烷基鉛\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge\">1 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">\u003cstrong>中樞神經精神\u003c/strong>：失眠、惡夢、焦慮、妄想、痙攣、昏迷；心跳慢、體溫降低\u003c/td>\u003ctd class=\"col-haz\">精神異常、永久性腦損傷、血壓上升、腎臟受損、可能傷害胎兒\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>尿中鉛\u003c/strong>（不是血中鉛；變更作業者免測）；神經、精神、心臟血管、皮膚身體檢查；尿蛋白、尿潛血\u003c/td>\u003ctd class=\"col-g3\">中樞神經病變（如\u003cstrong>四肢深部肌腱反射增加\u003c/strong>）、精神異常（焦慮、失眠、夢魘、記憶障礙）、蛋白尿 ≥2 價；或\u003cmark class=\"hl\">尿中鉛 ≥150 μg/L\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級＋須定期健康追蹤、鉛危害防護及配工\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>有機鉛查尿鉛、無機鉛查血鉛\u003c/strong>；脂溶性可經皮、過血腦障壁→以中樞症狀為主；PEL \u003cmark class=\"hl\">0.075 mg/m³\u003c/mark>\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">07\u003c/span>\u003cb>1,1,2,2-四氯乙烷\u003c/b>\u003cspan class=\"sum-cat\">有機溶劑\u003c/span>\u003cspan class=\"sum-badge\">3 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">噁心嘔吐、\u003cstrong>肝臟傷害\u003c/strong>（可致死）、周邊神經（手指腳趾刺痛）、中樞抑制、肺水腫、腎損害；經皮吸收\u003c/td>\u003ctd class=\"col-haz\">肝脂肪變性、壞死、萎縮；周邊與中樞神經傷害；白血球增加\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>ALT、γ-GT\u003c/strong>；尿蛋白、尿潛血；神經、肝、腎、皮膚身體檢查\u003c/td>\u003ctd class=\"col-g3\">肝功能異常、蛋白尿 ≥2 價、頭痛／震顫／頭暈／嗜睡等中樞症狀；輔助基準 \u003cmark class=\"hl\">TWA ≥0.5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋輔助基準 \u003cmark class=\"hl\">TWA ≥0.5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>有輔助基準（PEL 1 ppm 的一半）\u003c/strong>；屬於「肝毒性溶劑」一組（與四氯化碳、氯乙烯、DMF 同查 ALT）\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">08\u003c/span>\u003cb>四氯化碳\u003c/b>\u003cspan class=\"sum-cat\">有機溶劑\u003c/span>\u003cspan class=\"sum-badge\">6 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">中樞抑制、\u003cstrong>肝腎損傷\u003c/strong>（200 ppm 數週）；皮膚灼燒感；酒精會加強毒性\u003c/td>\u003ctd class=\"col-haz\">嚴重肝腎損害；疑似致癌（動物肝腫瘤）\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>ALT、γ-GT\u003c/strong>；尿蛋白、尿潛血；腎、肝、皮膚身體檢查\u003c/td>\u003ctd class=\"col-g3\">\u003cstrong>接觸性皮膚炎\u003c/strong>、肝功能異常、蛋白尿 ≥2 價；輔助基準 \u003cmark class=\"hl\">TWA ≥1 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級＋輔助基準 \u003cmark class=\"hl\">TWA ≥1 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">經典\u003cstrong>肝小葉中心壞死\u003c/strong>；\u003cstrong>醇類、苯巴比妥會加強毒性，二硫化碳會降低毒性\u003c/strong>；PEL 2 ppm\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">09\u003c/span>\u003cb>二硫化碳\u003c/b>\u003cspan class=\"sum-cat\">有機溶劑\u003c/span>\u003cspan class=\"sum-badge\">3 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">500–1000 ppm 情緒人格失常（激動、惡夢、精神異常、\u003cstrong>自殺\u003c/strong>）；4800 ppm 30 分鐘昏睡致命\u003c/td>\u003ctd class=\"col-haz\">精神異常→\u003cstrong>類巴金森症\u003c/strong>；周邊神經病變；\u003cstrong>動脈硬化、冠心病\u003c/strong>；眼睛血管損壞；生殖功能障礙\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>心電圖\u003c/strong>；ALT、γ-GT；尿蛋白、尿潛血；神經、心血管、腎、肝、皮膚、\u003cstrong>眼睛\u003c/strong>身體檢查\u003c/td>\u003ctd class=\"col-g3\">腦神經疾病、精神人格異常、巴金森氏症、周邊神經病變、腦血管與\u003cstrong>冠狀動脈疾病\u003c/strong>、腎動脈病變、\u003cstrong>眼底微動脈瘤\u003c/strong>與視神經病變、聽神經病變、蛋白尿；輔助基準 \u003cmark class=\"hl\">TWA ≥5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋輔助基準 \u003cmark class=\"hl\">TWA ≥5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">溶劑中\u003cstrong>以心血管（動脈硬化、冠心病）為特色\u003c/strong>，所以要做心電圖；\u003cstrong>眼底微動脈瘤\u003c/strong>是特色；考量疾病含\u003cstrong>嗅覺障礙\u003c/strong>\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">10\u003c/span>\u003cb>三氯乙烯、四氯乙烯\u003c/b>\u003cspan class=\"sum-cat\">有機溶劑\u003c/span>\u003cspan class=\"sum-badge\">7 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">黏膜刺激；中樞抑制（暈眩、頭痛）；高濃度意識喪失、\u003cstrong>心律不整\u003c/strong>；皮膚炎、化學灼傷\u003c/td>\u003ctd class=\"col-haz\">皮膚炎、肝損害、神經（顫抖、記憶差）；三氯乙烯→\u003cstrong>腎臟癌\u003c/strong>、肝癌、淋巴癌；四氯乙烯→膀胱癌、多發性骨髓瘤、NHL\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>ALT、γ-GT\u003c/strong>；尿蛋白、尿潛血；神經、肝、腎、\u003cstrong>心臟\u003c/strong>、皮膚身體檢查\u003c/td>\u003ctd class=\"col-g3\">皮膚黏膜刺激或\u003cstrong>脫脂\u003c/strong>（接觸性皮膚炎、\u003cstrong>鼻黏膜乾裂出血\u003c/strong>）、肝功能異常或肝腫大、蛋白尿或血尿、\u003cstrong>心律異常\u003c/strong>、\u003cstrong>顏面神經麻痺\u003c/strong>、短期記憶缺損、\u003cstrong>Romberg\u003c/strong> 異常；輔助基準 \u003cmark class=\"hl\">TWA ≥25 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋輔助基準 \u003cmark class=\"hl\">TWA ≥25 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">三級表現清單最雜（皮膚＋肝＋腎＋心律＋顏面神經＋平衡）；\u003cstrong>紀錄保存 30 年\u003c/strong>（三氯乙烯 IARC 1）；PEL 50 ppm、輔助基準 25（一半）\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">11\u003c/span>\u003cb>二甲基甲醯胺（DMF）\u003c/b>\u003cspan class=\"sum-cat\">有機溶劑\u003c/span>\u003cspan class=\"sum-badge\">5 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">腹痛、噁心嘔吐、\u003cstrong>飲酒後臉紅\u003c/strong>、肝傷害、血壓上升；\u003cstrong>立即經皮吸收\u003c/strong>\u003c/td>\u003ctd class=\"col-haz\">皮膚發疹、\u003cstrong>可恢復性肝傷害\u003c/strong>；IARC 2018 列 \u003cstrong>2A\u003c/strong>\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>ALT、γ-GT\u003c/strong>（唯一實驗室檢查）；\u003cstrong>酗酒\u003c/strong>及肝病史；肝、腎、心血管、皮膚身體檢查\u003c/td>\u003ctd class=\"col-g3\">肝功能異常或肝腫大、暴露部位接觸性皮膚炎；輔助基準 \u003cmark class=\"hl\">TWA ≥5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋輔助基準 \u003cmark class=\"hl\">TWA ≥5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>沒有驗尿\u003c/strong>（多數溶劑都有尿蛋白尿潛血）；問診特別問\u003cstrong>酗酒\u003c/strong>（類戒酒發硫醇反應）；PEL 10 ppm\u003c/td>\u003c/tr>\u003ctr class=\"t-mid\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">12\u003c/span>\u003cb>正己烷\u003c/b>\u003cspan class=\"sum-cat\">有機溶劑\u003c/span>\u003cspan class=\"sum-badge mid\">中頻・14 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">呼吸道刺激、暈眩困倦；吸入肺中→化學性肺炎\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>周邊神經病變\u003c/strong>（手腳麻木刺痛、肌無力、行走困難）；視覺異常；輕微貧血\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>只有問診＋神經及皮膚身體檢查，沒有任何實驗室檢查\u003c/strong>（115 年新附表十才加尿中 2,5-己二酮）\u003c/td>\u003ctd class=\"col-g3\">接觸性皮膚炎；\u003cstrong>暴露後才發生\u003c/strong>之周邊神經病變（手足指尖針刺麻木、\u003cstrong>踝反射喪失\u003c/strong>、\u003cstrong>無法以腳跟行走\u003c/strong>、\u003cstrong>跨閾步態 slapping gait\u003c/strong>、上肢無力）；輔助基準 \u003cmark class=\"hl\">TWA ≥25 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋輔助基準 \u003cmark class=\"hl\">TWA ≥25 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>與巴拉刈同為完全沒有抽血、驗尿、影像的作業\u003c/strong>；二級舉例「\u003cstrong>糖尿病\u003c/strong>多發神經病變」；代謝物 2,5-hexanedione 致軸突病變（考題常出）\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">13\u003c/span>\u003cb>聯苯胺及其鹽類等六種\u003c/b>\u003cspan class=\"sum-cat\">特化物\u003c/span>\u003cspan class=\"sum-badge\">4 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">過敏性皮膚炎、快速經皮吸收；4-胺基聯苯、萘胺→\u003cstrong>變性血紅素血症\u003c/strong>（發紺）、出血性膀胱炎\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>膀胱癌\u003c/strong>（吸菸加重）、血尿、排尿疼痛\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>尿蛋白、尿潛血、尿沉渣鏡檢\u003c/strong>；醫師認有必要時\u003cstrong>尿液細胞學（細胞診斷）\u003c/strong>；泌尿系統（含\u003cstrong>腰側擊痛\u003c/strong>）；藥品服用與\u003cstrong>家族史\u003c/strong>\u003c/td>\u003ctd class=\"col-g3\">過敏性或接觸性皮膚炎、\u003cstrong>皮膚發紺\u003c/strong>、出血性膀胱炎、\u003cstrong>尿液細胞學出現異常細胞或癌細胞\u003c/strong>、蛋白尿 ≥2 價；輔助基準：\u003cmark class=\"hl\">空氣中檢出任何濃度\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級＋\u003cstrong>膀胱癌\u003c/strong>、腎病變（血尿或蛋白尿 ≥2 價）；輔助基準：\u003cmark class=\"hl\">檢出任何濃度\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>PEL＝不得檢出\u003c/strong>，所以輔助基準是「檢出就算」；六種＝聯苯胺、4-胺基聯苯、4-硝基聯苯、β-萘胺、二氯聯苯胺、α-萘胺；分級指引在本項二級明寫「建議雇主應提供勞工個人健康指導」（依舊規則第 21 條，所有二級管理雇主本來就應提供）；課堂：只有這類查尿液細胞學\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">14\u003c/span>\u003cb>鈹\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge\">3 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">皮疹、傷口潰爛；鼻喉肺刺激→化學性支氣管炎、肺炎\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>慢性鈹病\u003c/strong>（肉芽腫、類肉瘤樣，咳嗽、杵狀指、發紺）、\u003cstrong>肺癌\u003c/strong>、腎結石\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>胸部 X 光、肺功能\u003c/strong>；呼吸、肝、腎、皮膚身體檢查（法定項目\u003cstrong>沒有\u003c/strong>尿鈹）\u003c/td>\u003ctd class=\"col-g3\">接觸性皮膚炎；胸部 X 光\u003cstrong>不規則結節、肺門淋巴結病變\u003c/strong>、擴散浸潤、肺部腫瘤；輔助基準 \u003cmark class=\"hl\">TWA ≥0.1 μg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">皮膚炎、肉芽腫、肝脾腫大、氣喘、COPD、\u003cstrong>類肉瘤症\u003c/strong>、過敏性肺炎、肺纖維化、肺腫瘤；工作相關證據如\u003cmark class=\"hl\">複檢尿鈹 ≥0.4 μg/L\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>尿鈹不在法定檢查，只當第四級的佐證\u003c/strong>；外觀像\u003cstrong>類肉瘤症（sarcoidosis）\u003c/strong>是鑑別重點；PEL \u003cmark class=\"hl\">2 μg/m³\u003c/mark>、輔助基準 0.1（只有 PEL 的 \u003cmark class=\"hl\">1/20\u003c/mark>）；IARC 1\u003c/td>\u003c/tr>\u003ctr class=\"t-mid\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">15\u003c/span>\u003cb>氯乙烯\u003c/b>\u003cspan class=\"sum-cat\">特化物\u003c/span>\u003cspan class=\"sum-badge mid\">中頻・9 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">中樞抑制（暈眩、陶醉感）；液體揮發致\u003cstrong>凍傷\u003c/strong>\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>肝血管肉瘤\u003c/strong>（罕見肝癌）；肢端溶骨症、雷諾氏現象（皮膚與骨病）；三叉神經病變\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>胸部 X 光\u003c/strong>、\u003cstrong>ALT、γ-GT\u003c/strong>；\u003cstrong>肝、脾\u003c/strong>、腎、手部皮膚、呼吸身體檢查；\u003cstrong>肝炎、輸血、肝毒性藥物\u003c/strong>病史\u003c/td>\u003ctd class=\"col-g3\">肝臟病變（\u003cstrong>門靜脈擴大\u003c/strong>、肝纖維化、\u003cstrong>肝脾腫大\u003c/strong>、肝腫瘤、肝功能異常）、接觸性皮膚炎或凍傷；輔助基準 \u003cmark class=\"hl\">TWA ≥0.5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋輔助基準 \u003cmark class=\"hl\">TWA ≥0.5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>肝血管肉瘤\u003c/strong>是招牌；身體檢查特別要查\u003cstrong>脾臟\u003c/strong>；問\u003cstrong>輸血史\u003c/strong>；PEL 1 ppm；IARC 1、保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">16\u003c/span>\u003cb>苯\u003c/b>\u003cspan class=\"sum-cat\">特化物\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・23 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">中樞抑制（困倦、暈眩、欣快）、高濃度喪失知覺、死亡\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>骨髓抑制\u003c/strong>（白血球、紅血球、血小板減少）→\u003cstrong>再生不良性貧血\u003c/strong>、\u003cstrong>白血病（AML）\u003c/strong>；染色體異常\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>全套血球\u003c/strong>：RBC、Hct、Hb、\u003cstrong>MCV、MCH、MCHC\u003c/strong>、血小板、WBC 及\u003cstrong>白血球分類\u003c/strong>（變更作業免分類）；血液、皮膚黏膜（含口腔、鼻腔）、結膜檢查\u003c/td>\u003ctd class=\"col-g3\">骨髓抑制或造血系統癌症：\u003cstrong>紅血球、白血球、血小板 \u003cmark class=\"hl\">2 項以上\u003c/mark>異常\u003c/strong>或其他血液學變化；輔助基準 \u003cmark class=\"hl\">TWA ≥0.5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級（\u003cstrong>三系列 ≥2 項異常\u003c/strong>）＋輔助基準 \u003cmark class=\"hl\">TWA ≥0.5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>沒有肝功能、沒有驗尿，只驗血球\u003c/strong>；「三系列中 ≥2 項」是苯獨有的判準；二級舉例「缺鐵性貧血」；PEL \u003cmark class=\"hl\">1 ppm\u003c/mark>；白血病認定最短暴露 6 個月、誘導期 5 年\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">17\u003c/span>\u003cb>二異氰酸甲苯等（TDI／MDI／IPDI）\u003c/b>\u003cspan class=\"sum-cat\">特化物\u003c/span>\u003cspan class=\"sum-badge\">3 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">呼吸道刺激、化學性支氣管炎、肺水腫（\u003cstrong>症狀可延遲數小時\u003c/strong>）；角膜混濁\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>職業性氣喘\u003c/strong>、過敏性肺炎；\u003cstrong>皮膚過敏\u003c/strong>（IPDI 強過敏原）\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>肺功能\u003c/strong>（FVC、FEV1、FEV1/FVC）；胸部 X 光只在\u003cstrong>體格\u003c/strong>檢查（變更作業增列）；\u003cstrong>氣喘、慢性氣管炎、過敏\u003c/strong>病史\u003c/td>\u003ctd class=\"col-g3\">\u003cstrong>暴露後才出現\u003c/strong>慢性咳嗽、氣喘、阻塞性肺功能或原有氣喘加劇；接觸性或刺激性皮膚炎；輔助基準 TDI \u003cmark class=\"hl\">≥0.0025 ppm\u003c/mark>、MDI \u003cmark class=\"hl\">≥0.01 ppm\u003c/mark>、IPDI \u003cmark class=\"hl\">≥0.0025 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋同輔助基準\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>定期健檢沒有胸部 X 光，只做肺功能\u003c/strong>（氣喘看肺功能）；TDI、MDI 用 \u003cstrong>PEL-ceiling\u003c/strong>（0.005、0.02 ppm）；IARC：TDI 2B、MDI 3、IPDI 未評估\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">18\u003c/span>\u003cb>石綿\u003c/b>\u003cspan class=\"sum-cat\">粉塵類\u003c/span>\u003cspan class=\"sum-badge\">6 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">呼吸困難、胸痛、皮膚黏膜刺激\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>石綿肺\u003c/strong>、\u003cstrong>肺癌\u003c/strong>、\u003cstrong>間皮瘤\u003c/strong>；肺功能下降、\u003cstrong>杵狀指\u003c/strong>\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>胸部 X 光、肺功能\u003c/strong>；呼吸系統（\u003cstrong>含杵狀指\u003c/strong>）及皮膚身體檢查\u003c/td>\u003ctd class=\"col-g3\">胸部 X 光不規則陰影、腫瘤或\u003cstrong>肋膜病變\u003c/strong>、肺功能減損；異常結果「無法\u003cstrong>完全\u003c/strong>由工作以外原因解釋」\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋工作相關證據：環測紀錄、\u003cstrong>石綿小體\u003c/strong>等客觀證據，或符合文獻之職業史（主觀證據）\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>沒有輔助基準數字\u003c/strong>，四級改看客觀／主觀暴露證據；二級舉例「\u003cstrong>陳舊性肺結核\u003c/strong>肺尖鈣化結節」；PEL 0.15 f/cc；保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">19\u003c/span>\u003cb>砷及其化合物\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・23 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">呼吸道刺激、\u003cstrong>鼻中膈穿孔\u003c/strong>；食入→金屬或大蒜味、嘔吐腹瀉、心律不整\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>手掌腳底角化過度\u003c/strong>、色素沉著、\u003cstrong>末梢神經炎\u003c/strong>；\u003cstrong>皮膚癌、肺癌\u003c/strong>；白血病、再生不良性貧血\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>尿中無機砷\u003c/strong>（三價、五價、\u003cstrong>MMA、DMA\u003c/strong> 加總＋尿肌酸酐）；胸部 X 光；尿蛋白、潛血、\u003cstrong>沉渣鏡檢\u003c/strong>；ALT、γ-GT；血球；\u003cstrong>鼻腔\u003c/strong>、皮膚、腸胃、神經身體檢查\u003c/td>\u003ctd class=\"col-g3\">鼻中膈潰瘍或穿孔、末梢神經炎、皮膚\u003cstrong>色素沉著或角化\u003c/strong>、疑似皮膚癌或肝腫瘤；血球（白、紅、血小板）\u003cmark class=\"hl\">至少 1 項低於正常\u003c/mark>；X 光疑似肺腫瘤；蛋白尿；肝病變；\u003cmark class=\"hl\">總無機砷 ≥35 μg/L\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現或\u003cmark class=\"hl\">總無機砷 ≥35 μg/L\u003c/mark>＋可由工作解釋\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>總無機砷不含砷甜菜鹼\u003c/strong>，二級舉例「\u003cstrong>飲食\u003c/strong>（海鮮）造成砷偏高」；門檻單位是 \u003cmark class=\"hl\">μg/L\u003c/mark>（不是 μg/g Cr）；唯一同時有影像＋尿＋肝＋血＋生物偵測五類檢查的作業（項目數最多的是鎳 9 項、游離輻射體格檢查 10 項）；IARC 1、保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">20\u003c/span>\u003cb>錳及其化合物\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・16 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">\u003cstrong>金屬燻煙熱\u003c/strong>（寒顫發燒）；皮膚黏膜刺激\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>錳性巴金森症\u003c/strong>（錐體外徑：轉身困難、\u003cstrong>倒退走困難\u003c/strong>、僵直、姿勢反射消失、\u003cstrong>肌張力不全\u003c/strong>）；\u003cstrong>錳狂\u003c/strong>（不自主哭笑、幻覺）；\u003cstrong>錳性肺炎\u003c/strong>\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>胸部 X 光\u003c/strong>；肺臟、神經（\u003cstrong>含巴金森症候群\u003c/strong>）及\u003cstrong>精神\u003c/strong>身體檢查；酗酒病史。\u003cstrong>沒有抽血驗尿\u003c/strong>\u003c/td>\u003ctd class=\"col-g3\">胸部症狀合併 X 光浸潤增加或肺炎；精神症狀；錐體外徑症狀（步行障礙、僵直、姿勢反射消失、靈巧度下降、肌張力不全）；輔助基準 燻煙 \u003cmark class=\"hl\">≥0.5 mg/m³\u003c/mark>、無機化合物 \u003cmark class=\"hl\">≥2.5 mg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現；工作相關證據如複檢\u003cmark class=\"hl\">血錳 ≥1 μg/dL 或尿錳 ≥3 μg/g Cr\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>血錳、尿錳不在法定檢查，只當第四級佐證\u003c/strong>（與鈹的尿鈹同類）；錳巴金森\u003cstrong>對 L-dopa 反應差、少靜止型顫抖\u003c/strong>；PEL 燻煙 1、無機 5 mg/m³\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">21\u003c/span>\u003cb>黃磷\u003c/b>\u003cspan class=\"sum-cat\">特化物\u003c/span>\u003cspan class=\"sum-badge\">1 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">燃燒蒸氣刺激呼吸道（可延遲數小時）；皮膚著火灼傷；食入→嘔吐物\u003cstrong>大蒜味、暗處發光\u003c/strong>、黃疸\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>磷毒性頜骨壞死（phossy jaw）\u003c/strong>：頷骨痛腫、牙痛牙鬆；骨骼易碎；肝腎傷害、貧血\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>牙齒及下顎（疼痛、變形）\u003c/strong>身體檢查；ALT、γ-GT；血球含\u003cstrong>白血球分類\u003c/strong>；眼睛、呼吸、肝、腎、皮膚檢查\u003c/td>\u003ctd class=\"col-g3\">肺水腫、肝毒性（肝腫大、肝功能異常、\u003cstrong>黃疸\u003c/strong>）、眼睛皮膚灼傷、\u003cstrong>貧血合併白血球減少\u003c/strong>、\u003cstrong>磷毒性頜壞死\u003c/strong>；輔助基準 \u003cmark class=\"hl\">TWA ≥0.05 mg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋輔助基準 \u003cmark class=\"hl\">TWA ≥0.05 mg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>唯一檢查下顎（疼痛、變形）\u003c/strong>，牙齒則與鎘共有；考量疾病第一個是\u003cstrong>牙齒支持組織疾病\u003c/strong>；PEL 0.1 mg/m³\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">22\u003c/span>\u003cb>聯吡啶或巴拉刈（製造）\u003c/b>\u003cspan class=\"sum-cat\">特化物\u003c/span>\u003cspan class=\"sum-badge\">3 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">眼鼻喉皮膚刺激、\u003cstrong>鼻出血\u003c/strong>、\u003cstrong>指甲異常脫落\u003c/strong>；食入→口喉灼傷、心腎肺損害（肺纖維化）\u003c/td>\u003ctd class=\"col-haz\">可能皮膚癌；與\u003cstrong>巴金森氏病\u003c/strong>有關的研究\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>只有問診（皮膚角化、黑斑、疑似皮膚癌病史）＋皮膚及指甲身體檢查\u003c/strong>，沒有任何實驗室檢查\u003c/td>\u003ctd class=\"col-g3\">暴露部位刺激性皮膚炎、\u003cstrong>角化、黑斑\u003c/strong>或疑似皮膚癌；輔助基準：聯吡啶\u003cmark class=\"hl\">檢出任何濃度\u003c/mark>、巴拉刈 \u003cmark class=\"hl\">TWA ≥0.05 mg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現＋同輔助基準\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>與正己烷同為「沒有任何抽血、驗尿、影像」的作業\u003c/strong>；\u003cstrong>只看皮膚與指甲\u003c/strong>；二級舉例「\u003cstrong>乾癬\u003c/strong>」；聯吡啶 PEL＝不得檢出\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">23\u003c/span>\u003cb>粉塵\u003c/b>\u003cspan class=\"sum-cat\">粉塵類\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・21 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">\u003cstrong>無\u003c/strong>（32 項中唯一急性寫「無」）\u003c/td>\u003ctd class=\"col-haz\">塵肺症：矽肺、煤礦工人塵肺（粒狀／塊狀纖維化）、石綿肺（瀰漫間質纖維化）、肉芽腫性、良性塵肺；肋膜病變；肺癌\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>胸部 X 光、肺功能\u003c/strong>；呼吸系統及\u003cstrong>心臟循環\u003c/strong>身體檢查；肺結核、哮喘、塵肺症、心臟疾病病史\u003c/td>\u003ctd class=\"col-g3\">\u003cstrong>ILO 胸部 X 光\u003c/strong>疑似塵肺症陰影、肺功能減損、其他相關病徵\u003c/td>\u003ctd class=\"col-g4\">同三級（\u003cstrong>符合 ILO\u003c/strong> 胸部 X 光塵肺陰影）＋可由工作解釋\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>沒有輔助基準\u003c/strong>；二級舉例「\u003cstrong>陳舊性肺結核\u003c/strong>肺尖鈣化結節」；粉塵分四種（第一種含結晶型游離 SiO₂ ≥10%）；紀錄保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-mid\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">24\u003c/span>\u003cb>鉻酸及其鹽類\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge mid\">中頻・13 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">皮膚\u003cstrong>潰瘍（鉻瘡）\u003c/strong>；鼻喉刺激；\u003cstrong>2 週刺激→4 週鼻中膈潰瘍→8 週穿孔\u003c/strong>；角膜損害\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>鼻中膈潰瘍、穿孔\u003c/strong>；過敏性皮膚炎；\u003cstrong>肺癌（六價鉻）\u003c/strong>\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>尿中鉻\u003c/strong>（變更作業免測）；從事工作 \u003cmark class=\"hl\">4 年以上\u003c/mark>才做\u003cstrong>胸部 X 光\u003c/strong>；呼吸系統（\u003cstrong>鼻黏膜、鼻中膈穿孔\u003c/strong>）及皮膚（皮膚炎、潰瘍）檢查\u003c/td>\u003ctd class=\"col-g3\">\u003cstrong>鼻中膈穿孔\u003c/strong>、暴露部位\u003cstrong>皮膚潰瘍\u003c/strong>、肺部癌症；輔助基準 \u003cmark class=\"hl\">TWA ≥0.025 mg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現；工作相關證據：複檢尿鉻\u003cmark class=\"hl\">工作結束後 ≥30 μg/g Cr，或工作中增加 ≥10 μg/g Cr\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>胸部 X 光要滿 4 年才做\u003c/strong>（唯一有年資條件的胸部 X 光；異常氣壓另有滿 5 年且肩髖有問題做長骨 X 光）；\u003cstrong>尿鉻門檻只寫在第四級\u003c/strong>；二級舉例過敏性鼻炎、感冒、濕疹；PEL 六價鉻 0.05 mg/m³\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">25\u003c/span>\u003cb>鎘及其化合物\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・17 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">吸入→\u003cstrong>化學性肺炎、肺水腫\u003c/strong>；食入→急性腸胃炎\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>腎小管傷害\u003c/strong>（蛋白尿）、腎結石；\u003cstrong>骨軟化、骨質疏鬆、自發性骨折（痛痛病）\u003c/strong>；\u003cstrong>門齒犬齒黃色鎘環\u003c/strong>、嗅覺／味覺喪失；肺癌、前列腺癌\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>尿中鎘\u003c/strong>；\u003cstrong>尿蛋白\u003c/strong>（沒有尿潛血）；\u003cstrong>體重測量\u003c/strong>；\u003cstrong>門齒或犬齒鎘黃色環\u003c/strong>、鼻黏膜、貧血檢查；有呼吸症狀才做胸部檢查＋肺功能\u003c/td>\u003ctd class=\"col-g3\">骨病變、骨痛、自發性骨折、\u003cstrong>黃色鎘環\u003c/strong>、蛋白尿 ≥2 價；\u003cmark class=\"hl\">尿鎘 ≥5 μg/g Cr\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現或\u003cmark class=\"hl\">尿鎘 ≥5 μg/g Cr\u003c/mark>＋可由工作解釋\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>唯一要量體重\u003c/strong>的作業；\u003cstrong>牙齒黃色環\u003c/strong>（鎘）vs 齒齦藍線（鉛）；尿鎘反映\u003cstrong>體內累積量\u003c/strong>（半衰期 10–30 年）；IARC 1、保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-mid\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">26\u003c/span>\u003cb>鎳及其化合物\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge mid\">中頻・8 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">金屬燻煙熱、氣喘、肺炎；過敏性皮膚炎\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>接觸性／過敏性皮膚炎（鎳癢症）\u003c/strong>；氣喘、鼻炎、鼻竇炎；\u003cstrong>肺癌、鼻腔癌、鼻竇癌\u003c/strong>\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>尿中鎳\u003c/strong>；胸部 X 光；\u003cstrong>肺功能\u003c/strong>；尿蛋白、潛血、沉渣鏡檢；\u003cstrong>肌酸酐\u003c/strong>；血球；鼻腔、皮膚、呼吸道檢查\u003c/td>\u003ctd class=\"col-g3\">接觸性或過敏性皮膚炎、\u003cstrong>鼻中膈穿孔\u003c/strong>、氣喘、氣管炎、鼻炎、鼻竇炎；\u003cmark class=\"hl\">尿鎳 ≥30 μg/g Cr（或 45 μg/L）\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現或\u003cmark class=\"hl\">尿鎳 ≥30 μg/g Cr（或 45 μg/L）\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>唯一門檻同時給 μg/g Cr 與 μg/L 兩種單位\u003c/strong>；鎳是\u003cstrong>最常見的接觸性過敏原\u003c/strong>；鼻中膈穿孔三兄弟：\u003cstrong>鉻、砷、鎳\u003c/strong>；四羰基鎳 PEL 0.007 mg/m³\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">27\u003c/span>\u003cb>乙基汞\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge\">5 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">急性神經精神症狀（言語、步行、聽覺障礙、\u003cstrong>視野狹窄\u003c/strong>）、昏迷\u003c/td>\u003ctd class=\"col-haz\">四肢\u003cstrong>手套襪套型\u003c/strong>或口唇感覺異常→\u003cstrong>運動失調\u003c/strong>、意向性顫抖、平衡障礙、\u003cstrong>視野狹窄\u003c/strong>、\u003cstrong>聽力減退\u003c/strong>；腎小管傷害；胎兒神經發育\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>血中汞\u003c/strong>（不是尿汞；變更作業免測）；胸部 X 光；尿蛋白、潛血、沉渣；肌酸酐；血球；口腔鼻腔、\u003cstrong>眼睛\u003c/strong>、神經及\u003cstrong>精神\u003c/strong>身體檢查\u003c/td>\u003ctd class=\"col-g3\">過敏性蕁麻疹或刺激性皮膚炎、\u003cstrong>口內炎\u003c/strong>、神經精神異常、蛋白尿、\u003cstrong>聽力視力或視野異常\u003c/strong>、明顯體重減輕；\u003cmark class=\"hl\">血汞 ≥10.0 μg/dL\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現或\u003cmark class=\"hl\">血汞 ≥10.0 μg/dL\u003c/mark>（或已排除非職業來源）\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>有機汞驗血、無機汞驗尿\u003c/strong>；有機汞表現＝\u003cstrong>水俁病\u003c/strong>（Hunter-Russell：運動失調、構音障礙、視野縮小）；考量疾病含\u003cstrong>癲癇、糖尿病\u003c/strong>\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">28\u003c/span>\u003cb>溴丙烷\u003c/b>\u003cspan class=\"sum-cat\">有機溶劑\u003c/span>\u003cspan class=\"sum-badge\">7 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">中樞神經抑制；鼻、口咽刺激\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>周邊神經病變\u003c/strong>（肢體麻木、刺痛、走路困難）、頭痛頭暈；皮膚紅疹；動物有肝毒性（人體未明）\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>胸部 X 光\u003c/strong>；ALT、γ-GT；\u003cstrong>血球含血小板\u003c/strong>；皮膚、\u003cstrong>肌肉骨骼\u003c/strong>及神經系統身體檢查\u003c/td>\u003ctd class=\"col-g3\">暴露部位接觸性皮膚炎、\u003cstrong>暴露後才發生\u003c/strong>之神經病變（\u003cstrong>同時\u003c/strong>符合：異常＋無法以工作外原因解釋）；輔助基準 \u003cmark class=\"hl\">TWA &gt;0.05 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">\u003cstrong>同時符合三項\u003c/strong>：①有暴露事實且\u003cstrong>暴露在前、病症在後\u003c/strong>（時序性）②有暴露引起的症狀 ③身體檢查有皮膚炎、四肢肌肉萎縮無力或反射降低等；輔助基準 \u003cmark class=\"hl\">TWA &gt;0.05 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>分級用「同時符合」寫法，與別項的「符合其一」相反\u003c/strong>；\u003cstrong>二級要「大致（可能性 &gt;50%）排除職業原因」\u003c/strong>才能放；輔助基準 0.05 是 PEL 0.5 ppm 的 \u003cmark class=\"hl\">1/10\u003c/mark>（多數項目是 PEL 的 1/2）；課堂：102 年\u003cstrong>高爾夫球桿頭\u003c/strong>清洗群聚多發性神經病變，國內首例職業病群聚\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">29\u003c/span>\u003cb>1,3-丁二烯\u003c/b>\u003cspan class=\"sum-cat\">特化物\u003c/span>\u003cspan class=\"sum-badge\">2 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">眼鼻喉刺激；極高濃度類似\u003cstrong>酒醉、意識不清\u003c/strong>\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>白血病等血液惡性腫瘤\u003c/strong>（IARC 1）\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>全套血球含白血球分類\u003c/strong>（無變更作業豁免）；淋巴血液及皮膚黏膜身體檢查；血液、肝、皮膚、\u003cstrong>生殖及免疫\u003c/strong>系統病史\u003c/td>\u003ctd class=\"col-g3\">皮膚黏膜\u003cstrong>不明出血或瘀斑\u003c/strong>，或血球異常疑似\u003cstrong>白血病\u003c/strong>（白血球大增或大減、大量不成熟白血球、貧血、血小板減少）；輔助基準 \u003cmark class=\"hl\">TWA ≥2.5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同上表現，且經\u003cstrong>血液腫瘤科\u003c/strong>周邊血液抹片或\u003cstrong>骨髓穿刺／切片\u003c/strong>確定診斷為白血病等血液惡性腫瘤；輔助基準 \u003cmark class=\"hl\">TWA ≥2.5 ppm\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>第四級要血液腫瘤科確診\u003c/strong>才能判；與苯同屬「只驗血球」組；PEL \u003cmark class=\"hl\">5 ppm\u003c/mark>（課堂講義寫 10 ppm 是舊值）；保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">30\u003c/span>\u003cb>甲醛\u003c/b>\u003cspan class=\"sum-cat\">特化物\u003c/span>\u003cspan class=\"sum-badge\">2 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">眼鼻刺激、流淚；呼吸道刺激、\u003cstrong>誘發氣喘\u003c/strong>；高濃度肺水腫；接觸性皮膚炎\u003c/td>\u003ctd class=\"col-haz\">過敏性皮膚炎（濕疹）；氣喘；\u003cstrong>鼻咽癌\u003c/strong>、骨髓性白血病\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>肺功能\u003c/strong>；\u003cstrong>全套血球含 MCV／MCH／MCHC 與白血球分類\u003c/strong>（變更作業免測）；胸部 X 光只在\u003cstrong>體格\u003c/strong>檢查（變更作業增列）；呼吸系統及皮膚黏膜檢查\u003c/td>\u003ctd class=\"col-g3\">過敏性或刺激性皮膚炎、化學灼傷、\u003cstrong>結膜角膜\u003c/strong>刺激或糜爛、\u003cstrong>氣喘\u003c/strong>、呼吸道過激、\u003cstrong>鼻咽癌或白血病\u003c/strong>相關發現；附各症狀誘發濃度參考（眼刺激 0.01–2.0 ppm、上呼吸道 0.1–0.45 ppm…）\u003c/td>\u003ctd class=\"col-g4\">同三級表現；輔助基準 \u003cmark class=\"hl\">TWA ≥0.5 ppm 或 STEL ≥2 ppm\u003c/mark>，或接觸 \u003cmark class=\"hl\">0.05–0.1%\u003c/mark> 液態固態甲醛\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>第二級附「排除參考值」\u003c/strong>（空氣 \u003cmark class=\"hl\">&lt;0.1 ppm\u003c/mark> 或接觸濃度 &lt;0.1%，銦也有）；唯一同時用 TWA 與 \u003cstrong>STEL\u003c/strong> 當輔助基準；PEL：指引寫 1 ppm（輔助基準 0.5 由此而來），\u003cmark class=\"hl\">現行容許暴露標準已改 0.75 ppm（瘤）\u003c/mark>；IARC 1、保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-lo\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">31\u003c/span>\u003cb>銦及其化合物\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge\">5 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">咳嗽、胸痛、呼吸困難、支氣管炎；眼睛皮膚黏膜刺激\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>肺間質纖維化\u003c/strong>與肉芽腫（間質性肺炎）；IARC \u003cstrong>2A\u003c/strong>（動物肺癌、肝癌、嗜鉻細胞瘤）\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>血清銦\u003c/strong>（變更作業免測）；胸部 X 光、肺功能；呼吸系統及皮膚黏膜（\u003cstrong>含眼睛黏膜\u003c/strong>）檢查\u003c/td>\u003ctd class=\"col-g3\">刺激性皮膚炎、結膜角膜刺激、咳嗽、呼吸困難、\u003cstrong>肺纖維化\u003c/strong>、肺惡性腫瘤；\u003cmark class=\"hl\">血清銦 ≥3 μg/L\u003c/mark>；輔助參考 TWA \u003cmark class=\"hl\">≥0.05 mg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級＋\u003cstrong>胸部 X 光或 CT\u003c/strong> 有間質性及纖維化病變；\u003cmark class=\"hl\">血清銦 ≥3 μg/L\u003c/mark>；輔助基準 TWA ≥0.05 mg/m³\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>唯一用「血清」驗的金屬\u003c/strong>；\u003cstrong>第四級提到胸部電腦斷層\u003c/strong>；二級也有排除參考值（空氣 \u003cmark class=\"hl\">&lt;0.01 mg/m³\u003c/mark>）；PEL 0.1 mg/m³；面板（LCD）、半導體產業；保存 30 年\u003c/td>\u003c/tr>\u003ctr class=\"t-hi\">\u003cth scope=\"row\" class=\"c-name\">\u003cspan class=\"sum-no\">32\u003c/span>\u003cb>汞及其無機化合物\u003c/b>\u003cspan class=\"sum-cat\">重金屬\u003c/span>\u003cspan class=\"sum-badge hi\">高頻・21 題\u003c/span>\u003c/th>\u003ctd class=\"col-haz\">高濃度汞蒸氣→化學性肺炎、肺水腫；嚴重\u003cstrong>腎臟受損\u003c/strong>；口腔潰爛\u003c/td>\u003ctd class=\"col-haz\">\u003cstrong>手部（眼皮、唇、舌）細顫\u003c/strong>、\u003cstrong>口腔炎\u003c/strong>、唾液增加、牙齒掉落；\u003cstrong>精神干擾（汞毒性神經衰弱 erethism）\u003c/strong>、記憶力喪失；腎病症候群\u003c/td>\u003ctd class=\"col-exam\">\u003cstrong>尿中汞\u003c/strong>（變更作業免測）；胸部 X 光；尿蛋白、潛血、沉渣；肌酸酐；血球；口腔鼻腔、\u003cstrong>眼睛\u003c/strong>、神經及\u003cstrong>精神\u003c/strong>身體檢查\u003c/td>\u003ctd class=\"col-g3\">皮膚炎、\u003cstrong>口內炎\u003c/strong>、神經精神異常、蛋白尿、視力或視野異常、明顯體重減輕；\u003cmark class=\"hl\">尿汞 ≥35 μg/g Cr\u003c/mark>（上班前或下班時）；輔助基準 \u003cmark class=\"hl\">TWA ≥0.025 mg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-g4\">同三級表現或\u003cmark class=\"hl\">尿汞 ≥35 μg/g Cr\u003c/mark>＋輔助基準 \u003cmark class=\"hl\">TWA ≥0.025 mg/m³\u003c/mark>\u003c/td>\u003ctd class=\"col-diff\">\u003cstrong>無機汞驗尿、乙基汞驗血\u003c/strong>；附表一舊版寫作「汞及其無機化合物」（課堂手寫第 32 項）；甲基汞\u003cstrong>不在\u003c/strong> 32 項內；PEL 0.05 mg/m³（皮）\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cp class=\"sum-note\">表格可左右捲動，作業欄固定在左側。「特殊檢查」只列該作業特有或少見的項目；作業經歷、生活習慣、自覺症狀調查每項都有，不再重複。新版附表一（117.1.1 施行）另加苯乙烯、甲苯、二甲苯，考試仍以舊版 32 項為準。\u003c/p>\n\n\u003ch2>生物偵測門檻速記\u003c/h2>\n\u003ctable class=\"sum-mini\">\u003cthead>\u003ctr>\u003cth>檢體指標\u003c/th>\u003cth>作業\u003c/th>\u003cth>三／四級門檻\u003c/th>\u003cth>記法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>血中鉛\u003c/b>\u003c/td>\u003ctd>鉛\u003c/td>\u003ctd>男 \u003cmark class=\"hl\">≥40\u003c/mark>、女 \u003cmark class=\"hl\">≥30 μg/dL\u003c/mark>\u003c/td>\u003ctd>三、四級同門檻；唯一男女不同；職前體格檢查也要驗（其他生物偵測只在定期）；母性保護 &lt;5／5–&lt;10／≥10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>尿中鉛\u003c/b>\u003c/td>\u003ctd>四烷基鉛\u003c/td>\u003ctd>\u003cmark class=\"hl\">≥150 μg/L\u003c/mark>\u003c/td>\u003ctd>三、四級同門檻；有機鉛驗尿\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>尿中總無機砷\u003c/b>\u003c/td>\u003ctd>砷\u003c/td>\u003ctd>\u003cmark class=\"hl\">≥35 μg/L\u003c/mark>\u003c/td>\u003ctd>三價＋五價＋MMA＋DMA 合計；不含海鮮的砷甜菜鹼\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>尿中鎘\u003c/b>\u003c/td>\u003ctd>鎘\u003c/td>\u003ctd>\u003cmark class=\"hl\">≥5 μg/g Cr\u003c/mark>\u003c/td>\u003ctd>三、四級同門檻；反映體內累積量\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>尿中鎳\u003c/b>\u003c/td>\u003ctd>鎳\u003c/td>\u003ctd>\u003cmark class=\"hl\">≥30 μg/g Cr（或 45 μg/L）\u003c/mark>\u003c/td>\u003ctd>唯一給兩種單位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>尿中汞\u003c/b>\u003c/td>\u003ctd>無機汞\u003c/td>\u003ctd>\u003cmark class=\"hl\">≥35 μg/g Cr\u003c/mark>\u003c/td>\u003ctd>上班前或下班時皆可\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>血中汞\u003c/b>\u003c/td>\u003ctd>乙基汞\u003c/td>\u003ctd>\u003cmark class=\"hl\">≥10.0 μg/dL\u003c/mark>\u003c/td>\u003ctd>有機汞驗血\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>血清銦\u003c/b>\u003c/td>\u003ctd>銦\u003c/td>\u003ctd>\u003cmark class=\"hl\">≥3 μg/L\u003c/mark>\u003c/td>\u003ctd>唯一驗「血清」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>尿中鉻\u003c/b>\u003c/td>\u003ctd>鉻酸\u003c/td>\u003ctd>工作結束後 \u003cmark class=\"hl\">≥30 μg/g Cr\u003c/mark>，或工作中增加 \u003cmark class=\"hl\">≥10\u003c/mark>\u003c/td>\u003ctd>法定項目，但門檻\u003cstrong>只寫在第四級\u003c/strong>（複檢佐證）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>尿中鈹（非法定）\u003c/b>\u003c/td>\u003ctd>鈹\u003c/td>\u003ctd>複檢 \u003cmark class=\"hl\">≥0.4 μg/L\u003c/mark>\u003c/td>\u003ctd>只當第四級工作相關佐證\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>血錳／尿錳（非法定）\u003c/b>\u003c/td>\u003ctd>錳\u003c/td>\u003ctd>血 \u003cmark class=\"hl\">≥1 μg/dL\u003c/mark>、尿 \u003cmark class=\"hl\">≥3 μg/g Cr\u003c/mark>\u003c/td>\u003ctd>只當第四級工作相關佐證\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp class=\"sum-note\">單位口訣：\u003cb>血液用 μg/dL\u003c/b>（血鉛、血汞），\u003cb>尿液多用 μg/g Cr 校正\u003c/b>（鎘、鎳、汞、鉻），例外是尿砷、四烷基鉛的尿鉛與血清銦用 μg/L。前九項就是認可辦法允許委託檢驗的九項生物偵測。\u003c/p>\n\n\u003ch2>輔助基準（作業環境濃度）對照\u003c/h2>\n\u003ctable class=\"sum-mini\">\u003cthead>\u003ctr>\u003cth>作業\u003c/th>\u003cth>PEL\u003c/th>\u003cth>輔助基準\u003c/th>\u003cth>比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>四氯乙烷\u003c/td>\u003ctd>1 ppm\u003c/td>\u003ctd>≥0.5 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>四氯化碳\u003c/td>\u003ctd>2 ppm\u003c/td>\u003ctd>≥1 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>二硫化碳\u003c/td>\u003ctd>10 ppm\u003c/td>\u003ctd>≥5 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>三氯乙烯、四氯乙烯\u003c/td>\u003ctd>50 ppm\u003c/td>\u003ctd>≥25 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DMF\u003c/td>\u003ctd>10 ppm\u003c/td>\u003ctd>≥5 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>正己烷\u003c/td>\u003ctd>50 ppm\u003c/td>\u003ctd>≥25 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>氯乙烯\u003c/td>\u003ctd>1 ppm\u003c/td>\u003ctd>≥0.5 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>苯\u003c/td>\u003ctd>1 ppm\u003c/td>\u003ctd>≥0.5 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1,3-丁二烯\u003c/td>\u003ctd>5 ppm\u003c/td>\u003ctd>≥2.5 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無機汞\u003c/td>\u003ctd>0.05 mg/m³\u003c/td>\u003ctd>≥0.025 mg/m³\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鉻酸\u003c/td>\u003ctd>0.05 mg/m³\u003c/td>\u003ctd>≥0.025 mg/m³\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>黃磷\u003c/td>\u003ctd>0.1 mg/m³\u003c/td>\u003ctd>≥0.05 mg/m³\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>巴拉刈\u003c/td>\u003ctd>0.1 mg/m³\u003c/td>\u003ctd>≥0.05 mg/m³\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>錳\u003c/td>\u003ctd>燻煙 1／無機 5 mg/m³\u003c/td>\u003ctd>≥0.5／≥2.5 mg/m³\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>銦\u003c/td>\u003ctd>0.1 mg/m³\u003c/td>\u003ctd>≥0.05 mg/m³（三級寫「輔助參考」）\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TDI／MDI／IPDI\u003c/td>\u003ctd>C 0.005／C 0.02／TWA 0.005 ppm\u003c/td>\u003ctd>TWA ≥0.0025／≥0.01／≥0.0025 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>甲醛\u003c/td>\u003ctd>指引 1 ppm（現行 0.75）\u003c/td>\u003ctd>TWA ≥0.5 或 STEL ≥2 ppm\u003c/td>\u003ctd>1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>溴丙烷\u003c/strong>\u003c/td>\u003ctd>0.5 ppm\u003c/td>\u003ctd>\u003cstrong>&gt;0.05 ppm\u003c/strong>\u003c/td>\u003ctd>\u003cmark class=\"hl\">1/10\u003c/mark>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>鈹\u003c/strong>\u003c/td>\u003ctd>2 μg/m³\u003c/td>\u003ctd>\u003cstrong>≥0.1 μg/m³\u003c/strong>\u003c/td>\u003ctd>\u003cmark class=\"hl\">1/20\u003c/mark>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>聯苯胺等六種、聯吡啶\u003c/strong>\u003c/td>\u003ctd>不得檢出\u003c/td>\u003ctd>\u003cstrong>檢出任何濃度\u003c/strong>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\n\u003ch2>檢查項目分組速記\u003c/h2>\n\u003ctable class=\"sum-mini\">\u003cthead>\u003ctr>\u003cth>特色\u003c/th>\u003cth>作業\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>沒有任何抽血、驗尿、影像\u003c/b>\u003c/td>\u003ctd>正己烷、巴拉刈（只做問診＋身體檢查）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>只有胸部 X 光、沒有抽血驗尿\u003c/b>\u003c/td>\u003ctd>錳\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>只驗血球（沒有肝功能、沒有驗尿）\u003c/b>\u003c/td>\u003ctd>苯、1,3-丁二烯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>肝功能 ALT＋γ-GT\u003c/b>\u003c/td>\u003ctd>四氯乙烷、四氯化碳、二硫化碳、三／四氯乙烯、DMF、氯乙烯、砷、黃磷、溴丙烷（游離輻射只有 ALT）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>心電圖\u003c/b>\u003c/td>\u003ctd>高溫、二硫化碳、異常氣壓（40 歲以上或疑心臟病）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>肺功能\u003c/b>\u003c/td>\u003ctd>高溫、異常氣壓、鈹、TDI、石綿、粉塵、鎳、甲醛、銦；鎘有呼吸症狀才做；游離輻射只在體格檢查（核電廠定期也加）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>定期只做肺功能、胸部 X 光只在體格檢查\u003c/b>\u003c/td>\u003ctd>TDI、甲醛\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>尿沉渣鏡檢\u003c/b>\u003c/td>\u003ctd>游離輻射、聯苯胺等六種（必要時加尿液細胞學）、砷、鎳、乙基汞、無機汞\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>看牙齒\u003c/b>\u003c/td>\u003ctd>鉛（齒齦鉛緣）、鎘（門齒犬齒黃色環）、黃磷（牙齒及下顎）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>三、四級列鼻中膈穿孔\u003c/b>\u003c/td>\u003ctd>鉻酸、砷、鎳（身體檢查另要看鼻腔／鼻黏膜的還有鎘、苯、乙基汞、無機汞）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>有年資條件\u003c/b>\u003c/td>\u003ctd>鉻酸：工作 4 年以上才照胸部 X 光；異常氣壓：滿 5 年且肩髖有問題做長骨 X 光\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>只有一項作業做\u003c/b>\u003c/td>\u003ctd>甲狀腺功能、心智及精神檢查（游離輻射）、BUN 與電解質（高溫）、聽力檢查（噪音）、體重（鎘）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n","wide":true,"questions":[]},{"idx":19,"order":19,"title":"必背清單：保存年限、IARC 分類與常考數字","group":"考前總表","notes_md":"考前最後一輪要背的清單：檢查紀錄保存年限（7／10／30 年）、32 項作業的 IARC 致癌分類、同一元素不同型態的毒性排名、致癌物與癌症配對，以及全卷反覆出現的數字。保存年限以考試適用的 110 年舊版勞工健康保護規則第 19、20 條為準；IARC 分類以 IARC 專刊清單為準（截至 2024 年，之後的新評估不涉及這 32 項）。\n\n## 一、記錄保存年限總覽\n\n| 紀錄 | 保存年限 | 法源 |\n|---|---|---|\n| 一般體格檢查、一般健康檢查（附表九） | ==7 年== | 舊第 19 條 |\n| 特殊體格／健康檢查（附表十） | ==10 年== | 舊第 19 條 |\n| 15 款特定作業的特殊檢查 | ==30 年== | 舊第 20 條（新第 21 條多一款苯乙烯） |\n| 作業環境監測結果（一般） | ==3 年==（116.1.1 起 10 年） | 環測辦法舊第 12 條 |\n| 粉塵監測紀錄 | ==10 年== | 同上 |\n| 附表四（新附表六）化學物質的監測紀錄 | ==30 年== | 同上 |\n| 監測計畫、監測評估小組紀錄 | 3 年 | 環測辦法 |\n| 聽力保護措施執行紀錄 | 3 年 | 設施規則第 300-1 條 |\n| 認可醫療機構品質管理文件 | 3 年 | 認可辦法第 18 條 |\n| 病歷 | 7 年 | 醫療法第 70 條 |\n\n- 健檢紀錄和環測紀錄不同套：正己烷健檢 10 年、環測 3 年；粉塵健檢 30 年、環測 10 年。\n\n## 二、30 年 vs 10 年：32 項逐項對照\n\n**一句話記法：30 年＝含 IARC Group 1 物質的 14 項作業＋銦。**其餘 17 項保存 10 年。\n\n| 編號 | 作業 | 保存 | IARC 分類 | 陷阱 |\n|---|---|---|---|---|\n| 1 | 高溫 | 10 年 | 不適用 | |\n| 2 | 噪音 | 10 年 | 不適用 | |\n| 3 | 游離輻射 | ==30 年== | X 光、γ 射線 1 | 物理性只有它 30 年 |\n| 4 | 異常氣壓 | 10 年 | 不適用 | |\n| 5 | 鉛 | 10 年 | 無機鉛化合物 ==2A==、金屬鉛 2B | **2A 但只存 10 年** |\n| 6 | 四烷基鉛 | 10 年 | 有機鉛 3 | |\n| 7 | 1,1,2,2-四氯乙烷 | 10 年 | 2B | |\n| 8 | 四氯化碳 | 10 年 | 2B | |\n| 9 | 二硫化碳 | 10 年 | 未評估 | |\n| 10 | 三氯乙烯、四氯乙烯 | ==30 年== | 三氯乙烯 ==1==（2014 升級）、四氯乙烯 2A | 七種有機溶劑中唯一存 30 年 |\n| 11 | 二甲基甲醯胺（DMF） | 10 年 | ==2A==（2018） | **2A 但只存 10 年** |\n| 12 | 正己烷 | 10 年 | 未評估 | |\n| 13 | 聯苯胺等六種 | ==30 年== | 聯苯胺、4-胺基聯苯、β-萘胺 1；二氯聯苯胺 2B；4-硝基聯苯、α-萘胺 3 | **α-萘胺、4-硝基聯苯是 Group 3，仍跟著存 30 年** |\n| 14 | 鈹 | ==30 年== | 1 | |\n| 15 | 氯乙烯 | ==30 年== | 1 | |\n| 16 | 苯 | ==30 年== | 1 | |\n| 17 | 二異氰酸甲苯等 | 10 年 | TDI 2B、MDI 3、IPDI 未評估 | |\n| 18 | 石綿 | ==30 年== | 1 | |\n| 19 | 砷 | ==30 年== | 無機砷 1（DMA 2B） | |\n| 20 | 錳 | 10 年 | 未評估 | |\n| 21 | 黃磷 | 10 年 | 未評估 | 課堂講義列為 Group 1 是錯的 |\n| 22 | 聯吡啶或巴拉刈 | 10 年 | 未評估 | |\n| 23 | 粉塵 | ==30 年== | 結晶型游離二氧化矽 1（煤塵 3） | 致塵肺也是理由 |\n| 24 | 鉻酸 | ==30 年== | 六價鉻 1（三價鉻、金屬鉻 3） | 法條寫「鉻酸與其鹽類、重鉻酸及其鹽類」 |\n| 25 | 鎘 | ==30 年== | 1 | |\n| 26 | 鎳 | ==30 年== | 鎳化合物 1、金屬鎳 2B | |\n| 27 | 乙基汞 | 10 年 | 未單獨評估（甲基汞化合物 2B） | |\n| 28 | 溴丙烷 | 10 年 | 2B（2017） | |\n| 29 | 1,3-丁二烯 | ==30 年== | 1 | |\n| 30 | 甲醛 | ==30 年== | 1 | |\n| 31 | 銦 | ==30 年== | 磷化銦 ==2A==、ITO 2B | **沒有 Group 1 也存 30 年**（肺間質纖維化） |\n| 32 | 汞及其無機化合物 | 10 年 | 3 | |\n| 新 | 苯乙烯（117.1.1 施行） | ==30 年== | 2A（2018） | 新第 21 條第 16 款 |\n| 新 | 甲苯、二甲苯（117.1.1 施行） | 10 年 | 3 | |\n\n### 背 10 年清單比較快（17 項）\n- 物理性 3：高溫、噪音、異常氣壓。\n- 鉛 2：鉛、四烷基鉛。汞 2：乙基汞、無機汞。\n- 有機溶劑 6：四氯乙烷、四氯化碳、二硫化碳、DMF、正己烷、溴丙烷。\n- 其他 4：二異氰酸甲苯、錳、黃磷、巴拉刈。\n\n### 30 年清單法條原文順序（15 款）\n游離輻射、粉塵、三氯乙烯及四氯乙烯、聯苯胺等六種、鈹、氯乙烯、苯、鉻酸、砷、鎳、1,3-丁二烯、甲醛、銦、石綿、鎘；新法加苯乙烯。\n\n## 三、IARC 分類整理\n\n- 定義：Group 1＝對人類致癌；2A＝很可能致癌（probably）；2B＝可能致癌（possibly）；3＝無法分類。2019 年起已取消 Group 4。\n- **Group 1（32 項內）**：游離輻射、結晶型矽、石綿、苯、氯乙烯、三氯乙烯、甲醛、1,3-丁二烯、聯苯胺、4-胺基聯苯、β-萘胺、鈹、砷、鎘、六價鉻、鎳化合物。\n- **Group 1（32 項外常考）**：MOCA、環氧乙烷、煤焦油、木粉、皮革粉塵、經代謝產生聯苯胺的染料。\n- **Group 2A**：==無機鉛化合物==、==DMF==、四氯乙烯、==磷化銦==、苯乙烯。\n- **Group 2B**：金屬鉛、金屬鎳、四氯化碳、1,1,2,2-四氯乙烷、二氯聯苯胺、TDI、1-溴丙烷、甲基汞化合物、ITO（氧化銦錫）、DMA。\n- **Group 3**：有機鉛、無機汞、MDI、4-硝基聯苯、α-萘胺、三價鉻與金屬鉻、煤塵、甲苯、二甲苯。\n- **同一元素分不同組**（最常拿來出題）：\n\n| 元素 | 分類 |\n|---|---|\n| 鉛 | 無機化合物 2A＞金屬 2B＞有機 3 |\n| 鎳 | 化合物 1＞金屬 2B |\n| 鉻 | 六價 1＞三價、金屬 3 |\n| 汞 | 甲基汞 2B＞無機汞 3 |\n| 銦 | 磷化銦 2A＞ITO 2B |\n| 萘胺 | β-萘胺 1＞α-萘胺 3 |\n| 二氧化矽 | 結晶型 1；煤塵 3 |\n| 氯乙烯類 | 氯乙烯 1、三氯乙烯 1、四氯乙烯 2A |\n\n## 四、同一元素不同型態的毒性排名\n\n括號內是現行容許暴露標準的 PEL-TWA，數字越小代表管得越嚴、毒性越高，可以拿來幫忙記排名（砷化氫例外，見備註）。\n\n| 元素 | 毒性排名（高 → 低） | 為什麼 | 考點 |\n|---|---|---|---|\n| 砷 | ==砷化氫 ＞ 三價無機砷 ＞ 五價無機砷 ＞ 有機砷（MMA、DMA）＞ 砷甜菜鹼 ≈ 元素砷== | 砷化氫造成急性溶血；三價砷與 -SH 結合干擾呼吸鏈；五價在體內轉為三價；肝臟甲基化成 MMA、DMA 排出是解毒 | 無機砷 0.01 mg/m³、有機砷 0.5 mg/m³；尿中「總無機砷」＝三價＋五價＋MMA＋DMA，不含海鮮的砷甜菜鹼 |\n| 汞 | ==有機汞（甲基、乙基）＞ 汞蒸氣 ＞ 無機汞鹽 ＞ 液態元素汞（口服）==；汞鹽中二價（昇汞）＞ 一價（甘汞） | 有機汞脂溶性、腸胃吸收幾乎完全、穿過血腦障壁與胎盤；汞蒸氣肺吸收約 80%；無機汞鹽腸胃吸收 7–15%、打腎臟；液態汞口服吸收約 0.01%（排名指慢性全身毒性；急性口服昇汞也會腐蝕腸胃、急性腎衰竭致死） | 有機汞 0.01、汞蒸氣及無機汞 0.05 mg/m³；**有機汞驗血、無機汞驗尿** |\n| 鉛 | 急性神經毒性：==有機鉛（四乙基鉛）＞ 無機鉛==；致癌分類反過來：==無機鉛化合物 2A ＞ 金屬鉛 2B ＞ 有機鉛 3== | 有機鉛脂溶性、可經皮、易進腦→中樞精神症狀；無機鉛→貧血、周邊運動神經、腎 | **有機鉛驗尿鉛（≥150 μg/L）、無機鉛驗血鉛（男 40／女 30）** |\n| 鉻 | ==六價鉻 ＞ 三價鉻 ＞ 金屬鉻== | 六價鉻經陰離子通道進入細胞，在細胞內還原時傷 DNA；三價鉻不易進細胞，是必需微量元素 | 六價 0.05、三價 0.5、金屬鉻 1 mg/m³；六價 Group 1，三價與金屬 Group 3 |\n| 鎳 | 急性毒性：==四羰化鎳 ＞ 可溶性鎳化合物 ＞ 金屬與非溶性鎳==；致癌：==鎳化合物 1 ＞ 金屬鎳 2B== | 四羰化鎳是揮發性液體，吸入後延遲出現化學性肺炎、肺水腫 | 四羰化鎳 0.007、可溶性 0.1、金屬與非溶性 1 mg/m³ |\n| 錳 | ==環戊二烯三羰基錳 ＞ 甲基環戊二烯三羰基錳 ＞ 錳燻煙 ＞ 錳及其無機化合物== | 有機錳管得最嚴；燻煙粒徑小、易吸入 | 0.1／0.2／1／5 mg/m³（分級指引所列） |\n| 錫 | ==有機錫（三烷基錫）＞ 無機錫== | 有機錫（如三甲基錫、三乙基錫）傷中樞神經；無機錫粉塵只造成良性的錫肺症 | 有機錫 0.1（皮）、無機錫 2 mg/m³ |\n| 磷 | ==磷化氫（氣體）、黃磷（白磷）＞＞ 紅磷== | 黃磷會自燃、劇毒，慢性造成**磷毒性頜骨壞死**；紅磷幾乎無毒；磷化氫是燻蒸劑與半導體製程的劇毒氣體 | 黃磷 0.1 mg/m³、磷化氫 0.3 ppm；特別危害作業只有「黃磷」 |\n| 鋇 | ==可溶性鋇鹽（氯化鋇、碳酸鋇）＞＞ 硫酸鋇== | 可溶性鋇造成嚴重低血鉀、肌肉無力；碳酸鋇會溶於胃酸；硫酸鋇不溶，所以能當顯影劑 | 鋇及其可溶性化合物 0.5 mg/m³ |\n| 銦 | 致癌分類：==磷化銦 2A ＞ 氧化銦錫（ITO）2B== | 兩者都會造成肺間質纖維化（銦肺） | 驗血清銦 ≥3 μg/L |\n\n**非元素但同樣常考的「型態排名」**\n\n| 物質 | 排名（高 → 低） | 重點 |\n|---|---|---|\n| 二氧化矽 | ==結晶型（方矽石、鱗矽石 ＞ 石英）＞＞ 非結晶型（矽藻土、熔融矽）== | 方矽石、鱗矽石較強是傳統教科書說法；新鮮破碎的結晶型矽（噴砂、切割）致纖維化力最強；結晶型 Group 1 |\n| 石綿 | 致間皮瘤力：==角閃石類（青石綿 ＞ 褐石綿）＞ 蛇紋石類（溫石綿）== | 角閃石纖維直、難清除；台灣 86 年先禁青石綿與褐石綿，107 年全面禁用；所有石綿都是 Group 1 |\n\n- 備註：砷化氫的 PEL 是 0.05 ppm（0.16 mg/m³），以 mg/m³ 看反而比無機砷寬，但急性毒性最強（溶血、急性腎衰竭），排名以毒性為準，不要用 PEL 推。\n\n## 五、致癌物與目標癌症\n\n| 致癌物 | 主要癌症 |\n|---|---|\n| 苯 | 白血病（==AML==）、骨髓化生不良症候群 |\n| 游離輻射 | 白血病（考題以 ==CML== 為輻射代表型；AML、ALL 也會增加，CLL 與輻射無關）、甲狀腺癌、骨癌、皮膚癌 |\n| 1,3-丁二烯 | 白血病等血液惡性腫瘤 |\n| 甲醛 | ==鼻咽癌==、骨髓性白血病 |\n| 氯乙烯 | ==肝血管肉瘤==（另兩個病因：無機砷、二氧化釷） |\n| 石綿 | 肺癌（和吸菸相乘）、==惡性間皮瘤==（與吸菸無關）、喉癌 |\n| 聯苯胺、β-萘胺、4-胺基聯苯、MOCA | ==膀胱癌==（所以要驗尿沉渣、必要時尿液細胞學） |\n| 砷 | 皮膚癌、肺癌、膀胱癌 |\n| 六價鉻 | 肺癌、鼻竇癌 |\n| 鎳化合物 | 肺癌、鼻腔與鼻竇癌 |\n| 鎘 | 肺癌（另與前列腺癌、腎癌有關） |\n| 鈹、結晶型矽 | 肺癌 |\n| 三氯乙烯 | ==腎臟癌== |\n| 木粉 | 鼻腔鼻竇腺癌 |\n\n## 六、全卷反覆出現的數字\n\n| 主題 | 數字 |\n|---|---|\n| 一般健檢頻率（考試適用舊法） | 未滿 40 歲每 ==5 年==、40–64 歲每 ==3 年==、65 歲以上==每年==；新法（117.1.1）3 年／2 年（40–59）／每年（60 以上） |\n| 特殊健檢 | ==每年==或變更作業時 |\n| 免一般體格檢查 | ==6 個月內==短期工作、其他法規已有規定（外籍勞工）；短期工作、其他法規已有規定只能免一般體格檢查（特殊體格檢查不適用這兩款；但距前次檢查未超過定期期限並提出證明者，一般與特殊體格檢查皆得免） |\n| 健檢醫師訓練 | 初訓 ==28 小時==；在職每 ==3 年 10 小時==、網路最多 ==5 小時==、職醫專科醫師 2 小時 |\n| 特殊健檢登錄 | 檢查日起 ==10 日內== |\n| 噪音法規 | ==80== 算劑量、==85== 戴防護具與特殊健檢、==90== 工程控制；連續 ==115==、衝擊 ==140 dB== |\n| 噪音容許時間 | 90 dB 8 小時，每加 ==5 dB 減半==（95→4、100→2、105→1、110→0.5、115→0.25） |\n| 聽力檢查 | 檢查前停止暴露 ==14 小時==；STS ==30 日內==重測、追蹤前休息 ==40 小時==；三分法 ==≥25 dB==；凹陷差 ==10 dB==；兩耳差 ==10 dB== |\n| 聽力保護計畫 | 勞工 ==100 人以上==要訂計畫 |\n| 聽力室背景噪音 | 500／1K／2K／4K／8K Hz：40／40／==47==／==57==／62 dB |\n| 環測頻率（舊法） | 高溫 WBGT ==3 個月==；噪音、CO2、粉塵、有機溶劑、特化物 ==6 個月==；鉛、四烷基鉛==每年== |\n| 環測通報 | 計畫 ==15 日前==（舊法；115 年新法改 10 日前）、結果 ==45 日內== |\n| 分級門檻 | 蛋白尿 ==≥2 價（100 mg/dL）==；輔助基準多為 ==PEL 一半==（溴丙烷 1/10、鈹 1/20） |\n| 母性保護 | 第 9 條（一般生殖毒性物質）空氣濃度 \u003c1/10 PEL 一級、1/10–1/2 二級、==≥1/2== 三級；第 10 條**鉛只看血鉛** ==\u003c5／5–\u003c10／≥10 μg/dL== |\n| 妊娠中絕對禁止 | 礦坑、==鉛==、==異常氣壓==、弓形蟲／德國麻疹；分娩後未滿一年：礦坑、鉛 |\n| 預防職業病健檢（災保法） | 加保連續滿 ==1 年==；健康追蹤檢查==一年一次== |\n| 職災傷病給付 | 不能工作==第 4 日==起；前 2 個月全額、第 3 個月起 ==70%==、最長 ==2 年== |\n| 職業病鑑定 | 職業因素貢獻度 ==>50%==；鑑定會 9 人、職醫 5 人 |\n| 過勞 | 異常事件 ==24 小時==、短期 ==1 週==、長期 ==6 個月==；前 1 個月加班 ==>100 小時==或 2–6 個月月均 ==>80 小時== |\n| 苯白血病 | 最短暴露 ==6 個月==、誘導期 ==5 年== |\n| 腰椎椎間盤突出 | 每年 220 日、==8–10 年==、每日搬抬==男 2 噸／女 1.5 噸== |\n| 腕隧道症候群 | 每天 ==4 小時==以上、作業 ==3 個月==後發病 |","wide":true,"questions":[]}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const LS = { wrong:'lh_wrongcounts_v1', stats:'lh_stats_v1', lastMod:'lh_lastmod_v1' };
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
let wrongMap = load(LS.wrong, {});
if(wrongMap===null || typeof wrongMap!=='object' || Array.isArray(wrongMap)) wrongMap={};
let stats = load(LS.stats, {answered:0, correct:0});
function persistWrong(){ save(LS.wrong, wrongMap); }
function persistStats(){ save(LS.stats, stats); }
function wrongCount(qid){ return wrongMap[qid]||0; }
function wrongQids(){ return Object.keys(wrongMap).filter(id=>wrongMap[id]>0 && QMAP[id]); }
/* 錯題代碼：DMW1|作答數,答對數|qid:次數,qid:次數,… */
function exportCode(){
  const ids=Object.keys(wrongMap).filter(id=>wrongMap[id]>0).sort((a,b)=>(wrongMap[b]-wrongMap[a])||a.localeCompare(b));
  return 'LHW1|'+(stats.answered||0)+','+(stats.correct||0)+'|'+ids.map(id=>id+':'+wrongMap[id]).join(',');
}
function importCode(str){
  const parts=(str||'').replace(/\s+/g,'').split('|');
  if(parts[0]!=='LHW1'||parts.length<3) throw new Error('bad format');
  const st=parts[1].split(',').map(Number);
  let n=0;
  parts[2].split(',').forEach(tok=>{
    if(!tok) return; const m=tok.match(/^([A-Za-z0-9_-]+):(\d+)$/); if(!m) return;
    const id=m[1], k=+m[2];
    if(QMAP[id] && k>0){ wrongMap[id]=Math.max(wrongMap[id]||0,k); n++; }
  });
  if(st.length===2 && !isNaN(st[0]) && !isNaN(st[1]) && st[0]>=(stats.answered||0)) stats={answered:st[0],correct:st[1]};
  persistWrong(); persistStats(); return n;
}

const QMAP = {};
DATA.forEach(m=>m.questions.forEach(q=>{ QMAP[q.qid] = {...q, modTitle:m.title, modIdx:m.idx}; }));
const TOTAL_Q = Object.keys(QMAP).length;
document.getElementById('fq').textContent = TOTAL_Q;

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- markdown ---------- */
function inlineMd(s){
  s = esc(s);
  s = s.replace(/==(.+?)==/g,'<mark class="hl">$1</mark>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  return s;
}
function mdToHtml(md){
  const lines = (md||'').replace(/\r/g,'').split('\n');
  let out=[], i=0;
  while(i<lines.length){
    let ln = lines[i];
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes('-')){
      let head = ln.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      i+=2; let rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim())); i++;
      }
      let t='<table><thead><tr>'+head.map(h=>'<th>'+inlineMd(h)+'</th>').join('')+'</tr></thead><tbody>';
      rows.forEach(r=>{ t+='<tr>'+head.map((_,ci)=>'<td>'+inlineMd(r[ci]||'')+'</td>').join('')+'</tr>'; });
      t+='</tbody></table>'; out.push(t); continue;
    }
    let h = ln.match(/^(#{2,5})\s+(.*)$/);
    if(h){ const lvl=Math.min(h[1].length+1,6); out.push('<h'+lvl+'>'+inlineMd(h[2].trim())+'</h'+lvl+'>'); i++; continue; }
    if(/^\s*[-*]\s+/.test(ln)){
      let listLines=[];
      while(i<lines.length && (/^\s*[-*]\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && listLines.length))){
        if(/^\s*[-*]\s+/.test(lines[i])) listLines.push(lines[i]);
        else if(listLines.length){ listLines[listLines.length-1]+=' '+lines[i].trim(); }
        i++;
      }
      let res=''; let l0=false,l1=false;
      listLines.forEach(L=>{
        let indent = L.match(/^(\s*)/)[1].length;
        let txt = L.replace(/^\s*[-*]\s+/,'');
        if(indent>=2){ if(!l1){ res+='<ul>'; l1=true; } res+='<li>'+inlineMd(txt)+'</li>'; }
        else { if(l1){ res+='</ul>'; l1=false; } if(!l0){ res+='<ul>'; l0=true; } res+='<li>'+inlineMd(txt)+'</li>'; }
      });
      if(l1) res+='</ul>'; if(l0) res+='</ul>';
      out.push(res); continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){
      let items=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+\.\s+/,'')); i++; }
      out.push('<ol>'+items.map(t=>'<li>'+inlineMd(t)+'</li>').join('')+'</ol>'); continue;
    }
    if(/^\s*$/.test(ln)){ i++; continue; }
    let para=[ln]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{2,5})\s/.test(lines[i])
          && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])
          && !/^\s*\|.*\|\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push('<p>'+inlineMd(para.join(' '))+'</p>');
  }
  return out.join('\n');
}

/* ---------- 深入複習區塊 ---------- */
function optSnip(q,i){ const t=(q.options&&q.options[i])||''; return t.length>22?t.slice(0,22)+'…':t; }
function deepHtml(q, show, withId){
  const r=q.review; if(!r) return '';
  let s='<div class="deep'+(show?' show':'')+'"'+(withId?' id="deep"':'')+'>';
  s+='<h4>深入複習</h4>';
  if(r.trap||r.trap_note) s+='<div class="trapline">'+(r.trap?'<span class="trap">'+esc(r.trap)+'</span>':'')+esc(r.trap_note||'')+'</div>';
  if(r.key_points&&r.key_points.length) s+='<ul>'+r.key_points.map(k=>'<li>'+inlineMd(k)+'</li>').join('')+'</ul>';
  if(r.refs&&r.refs.length) s+=r.refs.map(f=>'<div class="ref"><b>'+esc(f.src)+(f.page?'　頁 '+esc(String(f.page)):'')+'</b>　「'+esc(f.quote)+'」</div>').join('');
  let v='';
  const when=r.reviewed?('（'+esc(r.reviewed)+'）'):'';
  if(r.verdict==='fix' && r.prev_answer!==undefined && r.prev_answer!==q.answer) v='答案複審'+when+'：原標「'+esc(optSnip(q,r.prev_answer))+'」，經臨床審查改為「'+esc(optSnip(q,q.answer))+'」。';
  else if(r.verdict==='flag') v='答案複審'+when+'：維持「'+esc(optSnip(q,q.answer))+'」，但詳解撰寫者依原文提出異議，見 ⚠ 爭議註記。';
  else if(r.verdict) v='答案複審'+when+'：維持「'+esc(optSnip(q,q.answer))+'」，臨床正確。';
  if(r.note_ref) v+=(v?'<br>':'')+'章節筆記：'+esc(q.modTitle)+' › '+esc(r.note_ref)+'　<a href="#" class="gonote" data-mod="'+q.modIdx+'">前往閱讀 →</a>';
  if(v) s+='<div class="verdict">'+v+'</div>';
  s+='</div>'; return s;
}
