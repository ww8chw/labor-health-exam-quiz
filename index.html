聽力損失與噪音作業有關；中耳炎是傳導性聽力損失的非職業原因。"],"explanation":"本題考第二級管理「異常但可由工作以外原因解釋」在噪音作業的應用。噪音性聽力損失是感覺神經性、兩耳對稱、以 3–6K 高頻為主的漸進性損失；中耳炎、耳硬化等造成的是傳導性聽力損失（氣導骨導差距），藥物（水楊酸、鏈黴素等耳毒性藥物）、頭部外傷、遺傳、老化則是其他常見的非職業性感覺神經性原因，附表十噪音作業的既往病史調查就是要問這些。指引噪音第二級的兩種情形：(1) 三分法平均聽力損失≥25 dB，經醫師認定需於下年度前接受追蹤檢查；(2) 異常可由工作以外原因解釋，例如經醫師判定為中耳炎、藥物或外傷引起之非職業性聽力損失。第二級勞工雇主仍應提供個人健康指導，醫師應註明不適宜從事之作業與注意事項（噪音作業附表十二考量疾病：心血管疾病、聽力異常）；指引也提醒全聾者從事噪音作業仍須聽力防護與定期噪音健檢。若聽力圖非對稱，應評估單側中耳或內耳病變等複合性成因，而不是直接歸為噪音性。","dispute":"","review":{"key_points":["噪音第二級：==中耳炎、藥物、外傷==引起之非職業性聽力損失；或三分法 ≥25 dB 需追蹤","噪音性聽力損失＝感覺神經性、對稱、高頻 3–6K；中耳炎＝傳導性","雙耳非對稱→評估單側中耳或內耳病變","全聾者從事噪音作業仍須聽力防護及定期健檢"],"refs":[{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"例如經醫師判定為中耳炎、藥物"},{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"或外傷引起之非職業性聽力損失"},{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"全聾者從事噪音作業仍需執行聽力防護及接受定期噪音作業健康檢"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q14","q":"從事 1,1,2,2-四氯乙烷作業之勞工，特殊健康檢查發現 ALT 上升、尿蛋白 2+（≥100 mg/dL），事業單位提供之作業環境監測顯示八小時日時量平均濃度 0.6 ppm（容許濃度 1 ppm），且無 B、C 型肝炎、飲酒等其他原因。依健康管理分級建議指引，最適當之分級為何？","options":["第一級","第二級","第三級","第四級"],"answer":3,"recon":"rebuilt","src":["114-02"],"optexp":["**錯誤**：ALT 上升加尿蛋白≥100 mg/dL 都是四氯乙烷作業的健康危害表現（肝、腎、末梢與中樞神經），明確異常，不是第一級。","**錯誤**：第二級要求異常可由 B、C 型肝炎、脂肪肝、肥胖、喝酒等工作以外原因解釋；題目已排除這些原因。","**錯誤**：第三級適用於無法由工作以外原因解釋「但相關性仍不確定」或未提供環測紀錄的情形；本例雇主已提供環測 0.6 ppm（≥輔助基準 0.5 ppm）且已排除其他原因，異常可由工作相關原因解釋，符合第四級。若資料不足則先列第三級交職醫評估。","**正確（本題答案）**：指引四氯乙烷第四級：肝功能異常、尿蛋白≥100 mg/dL 或中樞神經症狀，異常結果可由工作相關原因解釋，輔助基準 PEL-TWA≥0.5 ppm；本例 0.6 ppm 且已排除其他原因→第四級。"],"explanation":"本題考 1,1,2,2-四氯乙烷作業的分級與「輔助基準」的用法。四氯乙烷（PEL-TWA 1 ppm）的危害：肝脂肪變性與壞死、腎損害、末梢神經病變（手指腳趾刺痛感覺喪失）、中樞神經抑制（頭痛、震顫、頭暈、嗜睡）。法定檢查項目：神經、肝、腎及皮膚身體檢查、尿蛋白尿潛血、ALT 與 γ-GT。分級：第二級—肝功能異常可由 B、C 肝炎、脂肪肝、肥胖、喝酒解釋；第三級—肝功能異常、尿蛋白達二價（≥100 mg/dL）或頭痛、震顫、頭暈、嗜睡等中樞神經症狀，且無法由工作以外原因解釋或未提供環測紀錄，輔助基準 PEL-TWA≥0.5 ppm；第四級—同樣表現，異常可由工作相關原因解釋，輔助基準≥0.5 ppm。輔助基準是 PEL 的一半（半數 PEL 原則），暴露達此濃度時支持異常與工作有關。本例環測 0.6 ppm≥0.5、已排除肝炎與飲酒、ALT 與尿蛋白同時異常，健檢醫師可判定異常可由工作相關原因解釋→第四級；114-02 回憶對三級或四級未定（見爭議註記）。","dispute":"114-02 回憶：「三級還四級？」未定。依指引，第三級與第四級的表現與輔助基準相同，差別只在異常「無法由工作以外原因解釋」（三級）或「可由工作相關原因解釋」（四級）；本題題幹已排除 B、C 肝與飲酒且環測 0.6 ppm 達輔助基準，符合第四級。實務上若健檢醫師拿不到足以判定的環測或病史資料、或尚未排除其他原因，應先列第三級交職醫評估，職醫追蹤複檢後再依結果改列二級或四級。","review":{"key_points":["四氯乙烷第三／四級表現：==肝功能異常、尿蛋白 ≥100 mg/dL、中樞神經症狀==；輔助基準 ==PEL-TWA ≥0.5 ppm==（PEL 1 ppm）","第三級＝無法由工作以外原因解釋或未提供環測；第四級＝可由工作相關原因解釋","第二級：B、C 肝、脂肪肝、肥胖、飲酒可解釋之肝功能異常","輔助基準通常是 PEL 的一半（鉻酸 0.025、無機汞 0.025 mg/m³、四氯乙烷 0.5 ppm）"],"refs":[{"src":"07_1,1,2,2-四氯乙烷作業管理分級參考","file":"_ref/分級指引/07_1,1,2,2-四氯乙烷作業管理分級參考.txt","quote":"輔助基準：八小時日時量平均容許濃度(PEL-TWA) ≥ 0.5"},{"src":"07_1,1,2,2-四氯乙烷作業管理分級參考","file":"_ref/分級指引/07_1,1,2,2-四氯乙烷作業管理分級參考.txt","quote":"四氯乙烷作業的健康危害表現，如肝功能異常、尿蛋白"},{"src":"07_1,1,2,2-四氯乙烷作業管理分級參考","file":"_ref/分級指引/07_1,1,2,2-四氯乙烷作業管理分級參考.txt","quote":"異常結果可由工作相關原因解釋。"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q15","q":"粉塵作業勞工工作三年，特殊健康檢查：FVC 3.9 L、FEV1 2.5 L、FEV1/FVC 64%，胸部 X 光正常，作業經歷與生活習慣資料不足以說明原因。依健康管理分級建議指引，健檢醫師應列為第幾級管理？","options":["第一級","第二級","第三級","第四級"],"answer":2,"recon":"rebuilt","src":["114-03"],"optexp":["**錯誤**：FEV1/FVC 64% 已低於 70%，屬阻塞型肺功能減損，是明確異常；胸部 X 光正常不能抵銷肺功能異常，不能列第一級。","**錯誤**：第二級要求異常可由工作以外原因解釋（如陳舊性肺結核鈣化結節，或抽菸、氣喘等）；題目說作業經歷與生活習慣資料不足以說明原因，無法歸為第二級。","**正確（本題答案）**：指引粉塵第三級 2.1：異常項目符合粉塵作業健康危害表現，如 ILO 胸部 X 光疑似塵肺症陰影、肺功能有減損；2.2 異常無法由工作以外原因解釋或未提供環測紀錄→請職醫評估。","**錯誤**：第四級須異常可由工作相關原因解釋；本例工作僅三年、X 光正常、原因資料不足，健檢醫師無法確認與工作有關，應先列第三級。"],"explanation":"本題考粉塵作業分級指引與肺功能判讀。粉塵作業（PEL：第一種含結晶型游離二氧化矽 10% 以上礦物性粉塵可呼吸性 10/(%SiO₂+2) mg/m³；第二種 1 mg/m³；第三種石綿 0.15 f/cc；第四種厭惡性粉塵 5 mg/m³）的慢性危害是塵肺症：矽肺症、煤礦工塵肺症、石綿肺症等纖維化性塵肺症，肉芽腫性與良性塵肺症、肋膜病變、肺癌。法定檢查項目：肺結核、哮喘、塵肺症、心臟疾病既往病史，呼吸系統及心臟循環身體檢查，胸部 X 光（大片），肺功能（FVC、FEV1、FEV1/FVC）。分級：第二級—異常可由工作以外原因解釋，如陳舊性肺結核在肺尖形成的鈣化性結節；第三級—ILO 胸部 X 光疑似塵肺症陰影、肺功能有減損或其他可能相關病徵，且無法由工作以外原因解釋或未提供環測紀錄；第四級—同樣表現且可由工作相關原因解釋。本例 FEV1 2.5 L／FVC 3.9 L＝64%，阻塞型變化（塵肺症典型為限制型，但早期或混合型也可見阻塞），X 光正常，資料不足以說明原因（抽菸、氣喘未排除）→第三級交職醫評估；114-03 回憶未給答案（見爭議註記）。","dispute":"114-03 回憶版未給答案。依指引，肺功能減損且原因資料不足時屬第三級（需職醫評估）；若病史明確為抽菸、氣喘等非職業因素可列第二級，胸部 X 光正常不能直接列第一級。應試選第三級。","review":{"key_points":["粉塵第三級：==ILO 胸部 X 光疑似塵肺症陰影或肺功能減損==＋無法由工作以外原因解釋或未提供環測","FEV1/FVC \u003c70% ＝阻塞型；塵肺症典型為限制型（FVC 下降），混合型亦可見","第二級例：陳舊性肺結核肺尖鈣化結節；抽菸、氣喘明確者亦可列第二級","法定項目：胸部 X 光（大片）＋肺功能（FVC、FEV1、FEV1/FVC）","粉塵健檢紀錄保存 30 年；環測紀錄考試當時 10 年"],"refs":[{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"ILO胸部X光照像有疑似塵肺症之陰影、肺功能有"},{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"異常結果無法由工作以外的原因解釋，或事業單"},{"src":"22_粉塵作業管理分級參考","file":"_ref/分級指引/22_粉塵作業管理分級參考.txt","quote":"如陳舊性肺結核"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q16","q":"依職業安全衛生法規定，懷孕八週之女性勞工正從事鉛及其化合物散布場所之工作，雇主應如何處理？","options":["立即調離該工作，不得使其從事鉛作業","經勞工書面同意後可繼續工作","妊娠滿三個月後再調離即可","縮短工作時間並加強防護即可"],"answer":0,"recon":"full","src":["113-2","113-8","114-03"],"optexp":["**正確（本題答案）**：職安法第 30 條第 1 項第 2 款：雇主不得使妊娠中之女性勞工從事鉛及其化合物散布場所之工作；第 3 項但書的書面同意例外不包含第 2 款，故應立即調離。","**錯誤**：第 30 條第 3 項但書只適用於第 1 項第 5 至 14 款及第 2 項第 3 至 5 款；鉛作業是第 1 項第 2 款、第 2 項第 2 款，不在可書面同意的範圍。","**錯誤**：禁止規定自妊娠中即適用，沒有滿三個月才調離的緩衝；分娩後未滿一年者亦不得從事鉛作業。","**錯誤**：鉛是絕對禁止作業，不是採取縮短工時、加強防護的分級管理就可以繼續。"],"explanation":"本題考職安法第 30 條妊娠及分娩後女性的禁止作業，關鍵是「哪些款可以書面同意例外」。第 1 項妊娠中禁止 14 款：礦坑；鉛及其化合物散布場所；異常氣壓；弓形蟲、德國麻疹等影響胎兒健康之工作；二硫化碳、三氯乙烯、環氧乙烷、丙烯醯胺、次乙亞胺、砷、汞及其無機化合物等中央主管機關規定之危害性化學品；鑿岩機等顯著振動；一定重量以上重物處理；有害輻射散布場所；已熔礦物或礦渣處理；起重機、人字臂起重桿運轉；動力捲揚機、運搬機及索道運轉；橡膠化合物及合成樹脂滾輾；致病或致死微生物感染風險；其他規定之工作。第 2 項分娩後未滿一年禁止 5 款：礦坑、鉛、顯著振動、重物處理、其他。第 3 項但書：第 1 項第 5 至 14 款及第 2 項第 3 至 5 款，雇主依第 31 條採取母性健康保護措施並經當事人書面同意者不在此限。所以礦坑、鉛、異常氣壓、弓形蟲德國麻疹（妊娠中）與礦坑、鉛（分娩後一年內）是絕對禁止，不能以書面同意繼續。雇主未經當事人告知妊娠或分娩事實而違反者得免罰，但明知或可得而知者不在此限。母性保護辦法第 4 條並規定鉛作業事業使女性勞工從事鉛作業者應實施母性健康保護（血鉛分級 5／10 μg/dL）。","dispute":"","review":{"key_points":["妊娠中絕對禁止（不得書面同意）：==礦坑、鉛、異常氣壓、弓形蟲／德國麻疹==（第 1 項第 1–4 款）","分娩後未滿一年絕對禁止：==礦坑、鉛==（第 2 項第 1–2 款）","書面同意例外：第 1 項第 5–14 款＋第 2 項第 3–5 款，須先依第 31 條採母性健康保護措施","雇主未經告知妊娠事實而違反者得免罰，明知或可得而知者除外"],"refs":[{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"雇主不得使妊娠中之女性勞工從事下列危險性或有害性工作："},{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"二、鉛及其化合物散布場所之工作。"},{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"雇主依第三十一條採取母性健康保護措施，經當事人書面同意者，不在此限"}],"note_ref":"四、母性健康保護與妊娠禁止作業"}},{"qid":"c02q17","q":"某勞工目前在有噪音的環境工作一年，在此之前於同一事業單位從事銦作業三年。下列敘述何者錯誤？","options":["事業單位應每年安排噪音作業特殊健康檢查","勞工可向勞動部勞工保險局申請預防職業病健康檢查或健康追蹤檢查","勞工本人得於變更作業後，向保險人申請銦作業之預防職業病健康追蹤檢查","事業單位應繼續每年為其安排銦作業之特殊健康檢查"],"answer":3,"recon":"partial","src":["113-3","113-4","113-9","113-11"],"optexp":["**正確**：勞工目前從事 85 分貝以上噪音作業，是附表一特別危害健康作業，雇主依勞工健康保護規則第 18 條應每年實施噪音作業特殊健康檢查。","**正確**：依災保法第 63 條及預防職業病健康檢查及健康追蹤檢查辦法，被保險人得由投保單位或本人向保險人（勞工保險局）申請預防職業病健康檢查（現職有害作業）或健康追蹤檢查（曾從事附表二作業）。","**正確**：辦法第 4 條：勞工曾從事第 2 條第 2 項（附表二）作業且加保年資連續滿一年者，於變更作業、離職或退保後，得由投保單位或勞工本人向保險人申請健康追蹤檢查；銦是附表二第四項第 (十七) 款。","**錯誤（本題答案）**：雇主的特殊健康檢查義務只針對勞工「現在從事」的特別危害健康作業；已變更作業三年以上不再從事銦作業，雇主無須每年為其安排銦作業特殊健康檢查，後續追蹤改走災保法的健康追蹤檢查。回憶版三個版本的錯誤選項一致。"],"explanation":"本題考「雇主特殊健康檢查義務」與「災保法健康追蹤檢查」的分工。雇主義務（勞工健康保護規則第 18 條）：使勞工從事特別危害健康作業，應每年或於變更作業時實施特殊健康檢查——變更作業當時做一次，之後只對新作業負責；紀錄則依作業別保存 10 或 30 年（銦 30 年）。勞工離開特定作業後的長期追蹤，由勞工職業災害保險承接：災保法第 63 條第 2 項規定曾從事中央主管機關另行指定有害作業者得向保險人申請健康追蹤檢查；辦法第 4 條要件是曾從事附表二作業、加保期間年資連續滿一年，於變更作業、離職或退保後，由投保單位或勞工本人向保險人申請，一年以一次為限（第 5 條），資格有疑義時可請認可醫療機構職醫協助評估。附表二追蹤檢查作業：游離輻射、粉塵、三氯乙烯、四氯乙烯、聯苯胺等芳香胺類、鈹、氯乙烯、苯、石綿、鉻酸、砷、鎘、鎳、甲醛、1,3-丁二烯、銦、巴拉刈製造等——幾乎就是健檢紀錄保存 30 年的清單。所以本例：噪音由雇主每年做，銦由勞工或投保單位向勞保局申請追蹤。","dispute":"","review":{"key_points":["雇主特殊健檢義務只及於==現職==特別危害健康作業；變更作業時做一次","曾從事附表二作業＋加保連續滿一年→變更作業、離職或退保後可申請==健康追蹤檢查==（辦法第 4 條）","申請對象：投保單位或勞工本人→保險人（勞保局）；一年一次","附表二追蹤作業≈健檢紀錄 30 年清單（游離輻射、粉塵、致癌物、銦…）"],"refs":[{"src":"勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法","file":"_ref/勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法.txt","quote":"其於變更作業、離職或退保後，得由投保單位或勞工本人向保險人申請預防職業病健康追蹤檢查"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"應每年或於變更其作業時"},{"src":"0000310868","file":"_ref/annex_n77/0000310868.txt","quote":"(十七)銦及其化合物。"}],"note_ref":"五、預防職業病健康檢查與健康追蹤檢查"}},{"qid":"c02q18","q":"依勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法，下列敘述何者正確？","options":["被保險人從事有害作業，最近加保年資連續滿一年者，得由投保單位向保險人申請預防職業病健康檢查；投保單位未申請者，被保險人得逕向保險人申請","勞工退保後即不得再申請預防職業病健康追蹤檢查","預防職業病健康檢查每半年得申請一次","申請應向勞動部職業安全衛生署提出"],"answer":0,"recon":"rebuilt","src":["113-6","113-8","115-01"],"optexp":["**正確（本題答案）**：辦法第 3 條：被保險人從事附表一有害作業，最近加保年資連續滿一年者，得由投保單位向保險人申請預防職業病健康檢查；投保單位未依規定申請者，被保險人得逕向保險人申請。","**錯誤**：第 4 條明定曾從事附表二作業且加保年資連續滿一年者，於變更作業、離職或「退保後」仍得申請健康追蹤檢查，退保不是障礙。","**錯誤**：第 5 條：預防職業病健康檢查及健康追蹤檢查一年以一次為限，情形特殊經中央主管機關認有必要者另行公告頻率；沒有每半年一次。","**錯誤**：申請對象是「保險人」即勞動部勞工保險局（113-8 回憶：向勞保局填單申請），不是職業安全衛生署；職安署是認可醫療機構與公告作業的中央主管機關。"],"explanation":"本題考勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法的四個要點。(1) 法源：災保法第 63 條，第 1 項預防職業病健康檢查（現職有害作業，附表一）、第 2 項健康追蹤檢查（曾從事指定作業，附表二），費用由保險人委託健保署支付。(2) 資格：預防職業病健康檢查—最近加保年資連續滿一年，由投保單位申請，投保單位不申請則被保險人逕行申請（第 3 條）；健康追蹤檢查—曾從事附表二作業且加保年資連續滿一年，於變更作業、離職或退保後，由投保單位或勞工本人申請（第 4 條）。(3) 頻率：一年以一次為限（第 5 條）。(4) 程序與機構：填申請書向保險人（勞工保險局）提出，審查合格核發證明單，於規定時間內受檢（第 6 條）；辦理的醫療機構須符合認可辦法資格（第 7 條）；檢查項目依勞工健康保護規則（第 2 條第 3 項）。與雇主端的特殊健康檢查區別：雇主的是每年義務、費用雇主付；災保法這套是保險給付、由勞工端申請，特別是離職退保後的追蹤。","dispute":"","review":{"key_points":["預防職業病健康檢查：==最近加保連續滿一年==，投保單位申請，不申請則==勞工逕向保險人申請==","健康追蹤檢查：曾從事附表二作業＋加保連續滿一年，==變更作業、離職或退保後==皆可申請","頻率：==一年一次==；申請對象：保險人＝勞工保險局","費用由保險人委託健保署支付；辦理機構須為認可醫療機構"],"refs":[{"src":"勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法","file":"_ref/勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法.txt","quote":"其最近加保年資連續滿一年者，得由投保單位向保險人申請預防職業病健康檢查；投保單位未依規定申請者，被保險人得逕向保險人申請"},{"src":"勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法","file":"_ref/勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法.txt","quote":"一年以一次為限"},{"src":"勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法","file":"_ref/勞工職業災害保險預防職業病健康檢查及健康追蹤檢查辦法.txt","quote":"得由投保單位或勞工本人向保險人申請預防職業病健康追蹤檢查"}],"note_ref":"五、預防職業病健康檢查與健康追蹤檢查"}},{"qid":"c02q19","q":"有關女性勞工母性健康保護之風險分級，經醫師評估「可能影響母體、胎兒或嬰兒健康」者，屬於第幾級管理？","options":["第一級管理","第二級管理","第三級管理","第四級管理"],"answer":1,"recon":"rebuilt","src":["整理-表格"],"optexp":["**錯誤**：母性保護辦法第 9 條第一級管理：作業場所空氣中暴露濃度低於容許暴露標準十分之一，或經醫師評估「無害」母體、胎兒或嬰兒健康。","**正確（本題答案）**：第 9 條第二級管理：暴露濃度在容許暴露標準十分之一以上未達二分之一，或經醫師評估「可能影響」母體、胎兒或嬰兒健康。","**錯誤**：第三級管理是暴露濃度在容許暴露標準二分之一以上，或經醫師評估「有危害」母體、胎兒或嬰兒健康。","**錯誤**：母性健康保護的風險分級只有三級，沒有第四級；四級是特殊健康檢查的健康管理分級，兩套制度不同。"],"explanation":"本題考女性勞工母性健康保護實施辦法第 9 條的三級風險分級，注意它與特殊健檢四級管理是不同制度。適用範圍：第 3 條—應配置醫護人員的事業單位（勞工健康保護規則第 3、4 條，即 50 人以上），勞工於保護期間從事 CNS 15030 生殖毒性第一級、生殖細胞致突變性第一級或影響哺乳的化學品、易造成健康危害的工作（姿勢、人力提舉、輪班、夜班、單獨工作、工作負荷）；第 4 條—鉛作業事業使女性從事鉛作業；第 5 條—職安法第 30 條第 1 項第 5 至 14 款及第 2 項第 3 至 5 款的工作。分級（第 9 條）：第一級—暴露濃度低於 PEL 十分之一，或醫師評估無害；第二級—PEL 十分之一以上未達二分之一，或醫師評估可能影響；第三級—PEL 二分之一以上，或醫師評估有危害；有害輻射依游離輻射防護安全標準辦理。鉛作業另依第 10 條以血鉛分級：\u003c5 μg/dL 第一級、5–\u003c10 第二級、≥10 第三級。保護期間為妊娠中及分娩後未滿一年；分娩滿一年後仍在哺乳者得請求雇主採取母性健康保護。回憶表格整理的就是「無害／可能影響／有危害」三級。","dispute":"","review":{"key_points":["母性保護三級：一級==無害==（\u003c1/10 PEL）、二級==可能影響==（1/10–\u003c1/2 PEL）、三級==有危害==（≥1/2 PEL）","鉛作業血鉛分級：\u003c5、5–\u003c10、≥10 μg/dL","母性保護三級 ≠ 特殊健檢四級","保護期間＝妊娠中＋分娩後未滿一年；哺乳者滿一年後得請求保護"],"refs":[{"src":"女性勞工母性健康保護實施辦法","file":"_ref/女性勞工母性健康保護實施辦法.txt","quote":"經醫師評估可能影響母體、胎兒或嬰兒健康"},{"src":"女性勞工母性健康保護實施辦法","file":"_ref/女性勞工母性健康保護實施辦法.txt","quote":"經醫師評估有危害母體、胎兒或嬰兒健康"},{"src":"女性勞工母性健康保護實施辦法","file":"_ref/女性勞工母性健康保護實施辦法.txt","quote":"二、第二級管理：血中鉛濃度在五 μg/dl 以上未達十 μg/dl。"}],"note_ref":"四、母性健康保護與妊娠禁止作業"}},{"qid":"c02q20","q":"依勞工健康保護規則，雇主使勞工從事特別危害健康作業，其健康管理分級與追蹤，下列何者錯誤？","options":["第三級管理者之健康追蹤檢查結果，應依評估結果重新分級，並將分級結果及採行措施依公告方式通報","第三級管理之健康追蹤檢查，應由職業醫學科專科醫師實施","定期特殊健康檢查之管理分級判讀，依認可辦法應由職業醫學科專科醫師為之","無法確定異常是否與工作有關者，雇主得自行決定分級"],"answer":3,"recon":"rebuilt","src":["114-03","114-04"],"optexp":["**正確**：第 21 條第 3 項：第三級管理者請職醫實施健康追蹤檢查、必要時現場評估，且應依評估結果重新分級，並將分級結果及採行措施依中央主管機關公告之方式通報。","**正確**：第 21 條第 3 項明定第三級管理者「應請職業醫學科專科醫師實施健康追蹤檢查」。","**正確**：認可辦法第 16 條（112.3.1 施行）：特殊健檢認可醫療機構辦理附表一特別危害健康作業「定期健康檢查」管理分級之判讀，應由職業醫學科專科醫師為之；115 年新版第 22 條也改為「經職醫綜合判定」。","**錯誤（本題答案）**：分級是醫師的綜合判定，雇主不得自行決定；無法確定異常是否與工作有關者依法列第三級，交職業醫學科專科醫師評估後重新分級。"],"explanation":"本題考「誰來分級」與第三級的處理流程。分級主體：勞工健康保護規則舊第 21 條寫「經醫師綜合判定」，但認可辦法第 16 條自 112 年 3 月 1 日起規定，定期特殊健康檢查管理分級之判讀應由職業醫學科專科醫師為之，該醫師得經事先報准至認可機構辦理（第 17 條第 3 項）；115 年修正的新第 22 條更直接改為「經職醫綜合判定」。雇主只能依分級結果採取措施，不能自己決定等級。第三級流程：健檢異常但無法確定與工作相關→列第三級→雇主請職醫實施健康追蹤檢查、必要時現場評估（新版須會同職業安全衛生人員）→依評估結果重新分級（改列二級或四級，不宜維持第三級）→分級結果及採行措施依公告方式通報。回憶版有兩種說法：114-04 把「管理分級只能由職醫判定」視為錯誤選項，114-03 則說「一般醫師初步可以評到第三級」；依法規，特殊「體格」檢查及一般健檢醫師可做檢查與初步判讀，但定期特殊健康檢查的管理分級判讀依認可辦法應由職醫為之（見爭議註記）。","dispute":"114-04 回憶把「管理分級只能由職醫判定」列為錯誤選項，114-03 則提到「一般醫師初步可以評到第三級」。依認可辦法第 16 條（112.3.1 施行），特別危害健康作業「定期健康檢查」的管理分級判讀應由職業醫學科專科醫師為之，115 年新版勞工健康保護規則第 22 條亦改為「職醫綜合判定」；健檢醫師可執行檢查、初步判讀與特殊體格檢查，但定期特殊健檢的分級判讀依法歸職醫。應試時仍以「雇主不得自行分級」為本題的錯誤選項。","review":{"key_points":["定期特殊健檢管理分級判讀：==職業醫學科專科醫師==為之（認可辦法第 16 條，112.3.1 施行）；新第 22 條寫「職醫綜合判定」","雇主不得自行分級；無法確定相關性→第三級→職醫追蹤檢查→重新分級→通報","職醫得經事先報准至認可機構辦理分級判讀（第 17 條第 3 項）","第三級不宜在職醫複檢後維持"],"refs":[{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"辦理勞工健康保護規則第二條附表一所定特別危害健康作業定期健康檢查管理分級之判讀，應由職業醫學科專科醫師為之"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"第三級管理者，應請職業醫學科專科醫師實施健康追蹤檢查"},{"src":"勞工健康保護規則","file":"_ref/勞工健康保護規則.txt","quote":"經職醫綜合判定為異常，而無法確定此異常與工作之相關性，應進一步請職醫評估者"}],"note_ref":"一、四級健康管理的定義與後續處理"}}]},{"idx":2,"order":2,"title":"作業環境監測與容許濃度","group":"法規與制度","gi":0,"notes_md":"本章 14 題，考作業環境監測實施辦法的頻率、通報、紀錄保存（舊版 105.11.02 考試適用、新版 115.6.12 部分 116.1.1 施行）、容許暴露標準的三種容許濃度與時量平均計算，以及工業衛生的基本概念；數字題居多。\n\n## 一、監測頻率與通報\n\n### 1. 頻率\n| 項目 | 考試當時（舊第 7、8 條） | 現行（新第 5、6 條） |\n|---|---|---|\n| 高溫作業 WBGT | ==每 3 個月== | 每 3 個月 |\n| 噪音 85 dB 以上、中央空調 CO2、坑內粉塵與 CO2 | 每 6 個月 | 每 6 個月 |\n| 特定粉塵、有機溶劑、特化物、煉焦爐 | 每 6 個月 | 每 6 個月；暴露 ==≥PEL 者每 3 個月== |\n| 鉛、四烷基鉛 | ==每年== | 每 6 個月（≥PEL 每 3 個月） |\n- 免測：臨時性作業（≤3 個月且一年內不重複）、作業時間短暫（每日 ≤1 小時）、作業期間短暫（≤1 個月且 6 個月內不再做）；已依室內空氣品質管理法測 CO2 者得免。\n\n### 2. 通報時限\n- 監測計畫：考試當時（舊第 10 條）實施監測 ==15 日前==；現行（新第 9 條）10 日前（特殊情形監測後 7 日內）。\n- 監測結果：採樣或測定後 ==45 日內==（新舊相同）。\n- 暴露評估報告：採樣或測定後 ==90 日內==（116.1.1）。\n- 對照：特殊健檢資料登錄檢查日起 10 日內（職安署公告）。\n\n## 二、監測紀錄保存年限\n| 紀錄 | 考試當時 | 現行（116.1.1） |\n|---|---|---|\n| 一般監測紀錄（如正己烷） | ==3 年== | 10 年 |\n| 粉塵 | ==10 年== | 10 年 |\n| 附表四（新附表六）致癌等化學物質 | ==30 年== | 30 年 |\n- 環測紀錄≠健檢紀錄：正己烷環測 3 年／健檢 10 年；粉塵環測 10 年／健檢 30 年。\n\n## 三、容許濃度的三種定義與計算\n- ==八小時日時量平均容許濃度（TWA）==：每天工作八小時、重複暴露不致不良反應。\n- ==短時間時量平均容許濃度（STEL）==：任何連續 ==15 分鐘== 不致有不可忍受之刺激、慢性或不可逆組織病變、麻醉昏暈、事故增加、工作效率降低；數值＝TWA×變量係數（\u003c1→3、1–10→2、10–100→1.5、100–1000→1.25、≥1000→1）。\n- ==最高容許濃度（C）==：符號欄「高」字，任何時間不得超過。沒有「月時量平均」。\n- 時量平均＝Σ(濃度×時間)／==總工作時間==：80 ppm×4 h＋0×4 h→40 ppm。混合暴露相加效應 Σ(Ci/PELi) >1 即超標。\n- 常考 PEL：==CO2 5000 ppm==（室內空氣品質標準 1000 ppm 是另一套）、苯 1 ppm、正己烷 50 ppm、二硫化碳 10 ppm、溴丙烷 0.5 ppm、四氯乙烷 1 ppm、鉛 0.05、汞 0.05、鈹 0.002、銦 0.1 mg/m³。\n- 單位：氣狀 ppm、粒狀 mg/m³、石綿 f/cc（25℃、1 atm）；本標準不得作為職業病鑑定唯一依據。\n\n## 四、職業衛生基本概念\n- 工業衛生四原則：==預期→認知→評估→控制==（anticipation、recognition、evaluation、control）；管理計畫步驟：分析、確認、執行、評值。\n- 控制優先順序：消除／取代＞==工程控制==（密閉、隔離、濕式作業、整體換氣、局部排氣、製程變更）＞行政管理（縮短工時、輪班、輪換職務、教育訓練）＞個人防護具（防毒面具、耳塞）。\n- 局部排氣裝置：氣罩→==吸氣導管==→空氣清淨裝置→排氣機→==排氣導管==→排氣口；需氣量小、效能優於整體換氣。\n- 職業史（工作調查）：工作內容、暴露物質與時間、防護具、日／週／月工時與輪班；==季工時==非慣用項目；雇主定期特殊健檢時應交付作業內容、最近一次環測紀錄與暴露情形。\n\n## 五、礦場坑內氧氣\n- 礦場職業衛生設施標準第 7 條：坑內氧氣 ==≥19%==，低於 19% 不得作業（戴空氣呼吸器搶救或處理通風設備者除外）。\n- 缺氧症預防規則：氧氣未滿 ==18%== 為缺氧。坑內每 6 個月監測粉塵與 CO2。","questions":[{"qid":"c03q01","q":"依勞工作業環境監測實施辦法，雇主應於採樣或測定後幾日內，將監測結果通報中央主管機關？","options":["七日","三十日","四十五日","六十日"],"answer":2,"recon":"full","src":["113-2","113-11","115-01"],"optexp":["**錯誤**：七日是新辦法第 9 條第 4 項但書：依第 7 條第 2 項辦理（作業型態變更等特殊情形）之監測，得於實施監測後七日內通報監測計畫；不是監測結果的通報期限。","**錯誤**：三十日不是環測辦法的通報期限；容易混淆的是醫師法歇業停業 30 日內報備、認可機構停業歇業或資格異動等事實發生後 30 日內申請停止業務。","**正確（本題答案）**：舊辦法第 12 條第 4 項：雇主應於採樣或測定後四十五日內完成監測結果報告，通報至中央主管機關指定之資訊系統；新辦法第 12 條第 3 項同為四十五日內通報。","**錯誤**：六十日不是環測辦法的數字；新辦法第 13 條要求採樣或測定後九十日內完成暴露評估報告（116.1.1 施行），也不是六十日。"],"explanation":"本題考作業環境監測的三個時限。監測結果通報：舊辦法（105.11.02 版，考試適用）第 12 條第 4 項與新辦法（115.6.12 版）第 12 條第 3 項都規定雇主應於採樣或測定後 45 日內將監測結果通報中央主管機關，登錄於指定資訊網站。監測計畫通報：新辦法第 9 條第 4 項規定雇主應於實施監測 10 日前將監測計畫通報中央主管機關，依第 7 條第 2 項辦理者得於實施監測後 7 日內通報。暴露評估報告：新辦法第 13 條第 1 項規定應於採樣或測定後 90 日內完成（自 116 年 1 月 1 日施行）。記法「10 日前計畫、45 日內結果、90 日內評估報告」。以直讀式儀器監測二氧化碳者，監測計畫及結果免通報（舊第 12-1 條）。本題 113-2、113-11、115-01 三次出現，都是 45 日；另一個容易混淆的是特殊健康檢查資料登錄的「檢查日起 10 日內」（職安署公告）。","dispute":"","review":{"key_points":["監測結果通報：採樣或測定後 ==45 日內==（新舊辦法相同）","監測計畫通報：考試當時（舊第 10 條）實施監測 ==15 日前==；現行新第 9 條改為 10 日前（特殊情形得於監測後 7 日內）","暴露評估報告：採樣或測定後 ==90 日內== 完成（116.1.1 施行）","直讀式儀器測 CO2 者免通報計畫與結果"],"refs":[{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"雇主應於採樣或測定後四十五日內完成監測結果報告，通報至中央主管機關指定之資訊系統。"},{"src":"勞工作業環境監測實施辦法","file":"_ref/勞工作業環境監測實施辦法.txt","quote":"雇主應於實施監測十日前，將監測計畫通報中央主管機關"},{"src":"勞工作業環境監測實施辦法","file":"_ref/勞工作業環境監測實施辦法.txt","quote":"於採樣或測定後九十日內完成暴露評估報告"}],"note_ref":"一、監測頻率與通報"}},{"qid":"c03q02","q":"高溫作業場所之綜合溫度熱指數（WBGT），雇主應多久監測一次以上？","options":["每個月","每三個月","每六個月","每年"],"answer":1,"recon":"full","src":["113-2","113-4","113-11","114-01","114-04","114-05"],"optexp":["**錯誤**：環測辦法沒有「每個月」的監測頻率；法定最短間隔就是每三個月，適用於高溫作業與（新法）暴露達容許濃度的化學性因子。","**正確（本題答案）**：舊辦法第 8 條第 1 項第 1 款與新辦法第 6 條第 1 項第 1 款：高溫作業場所應每三個月監測綜合溫度熱指數（WBGT）一次以上。","**錯誤**：每六個月是化學性因子（粉塵、有機溶劑、特定化學物質）、噪音、中央空調 CO2、坑內粉塵與 CO2 的頻率，不是高溫。","**錯誤**：每年是舊辦法鉛作業與四烷基鉛作業的監測頻率；新辦法已改為每六個月（116.1.1 施行）。高溫不是每年。"],"explanation":"本題考作業環境監測的頻率表，高溫 WBGT 是唯一「每三個月」的物理性因子。考試當時（舊辦法第 7、8 條）：中央空調建築物室內 CO2 每六個月；坑內作業（礦場採掘、隧道掘削、完工地下通道）粉塵與 CO2 每六個月；85 分貝以上噪音每六個月；高溫作業場所（鍋爐房、灼熱金屬壓軋鍛造、鑄造間、金屬加熱熔煉、搪瓷玻璃高溫熔料、蒸汽機車輪船機房、蒸汽操作燒窯）WBGT 在規定值以上者每三個月；特定粉塵、附表一有機溶劑、附表二特定化學物質、煉焦爐生成物每六個月；鉛與四烷基鉛每年。新辦法第 5、6 條（第 6 條化學性因子部分自 116.1.1 施行）：物理性因子與 CO2 不變，高溫仍每三個月；化學性因子（特定粉塵、有機溶劑、特化物、煉焦爐、鉛、四烷基鉛）一律每六個月，但勞工暴露濃度高於或等於容許濃度者每三個月，鉛從每年改為每六個月；指定業別的特定粉塵作業另增測結晶型游離二氧化矽；已依室內空氣品質管理法測 CO2 者得免監測。臨時性作業、作業時間短暫（每日一小時以內）、作業期間短暫（不超過一個月且六個月內不再實施）者不在此限。","dispute":"","review":{"key_points":["高溫作業 WBGT：==每 3 個月==（新舊相同）","噪音 85 dB 以上、中央空調 CO2、坑內粉塵與 CO2、化學性因子：==每 6 個月==","舊辦法鉛／四烷基鉛==每年==；新辦法改每 6 個月，且暴露 ≥PEL 者每 3 個月（116.1.1）","免測：臨時性作業（≤3 個月且一年內不重複）、作業時間短暫（每日 ≤1 小時）、作業期間短暫（≤1 個月且 6 個月內不再做）"],"refs":[{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"應每三個月監測綜合溫度熱指數一次以上"},{"src":"勞工作業環境監測實施辦法","file":"_ref/勞工作業環境監測實施辦法.txt","quote":"高溫作業勞工作息時間標準所定高溫作業場所，應每三個月監測綜合溫度熱指數一次以上"},{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"鉛中毒預防規則所稱鉛作業之作業場所，應每年監測鉛濃度一次以上"}],"note_ref":"一、監測頻率與通報"}},{"qid":"c03q03","q":"有關作業環境監測之頻率，下列敘述何者錯誤？","options":["高溫作業場所應每三個月監測綜合溫度熱指數一次以上","勞工噪音暴露工作日八小時日時量平均音壓級 85 分貝以上之作業場所，應每六個月監測噪音一次以上","有機溶劑、特定化學物質及特定粉塵作業場所應每六個月監測一次以上；勞工暴露濃度高於或等於容許濃度者，應每三個月監測一次以上","設有中央管理方式空氣調節設備之建築物室內作業場所，應每三個月監測二氧化碳濃度一次以上"],"answer":3,"recon":"rebuilt","src":["113-11","114-03"],"optexp":["**正確**：舊辦法第 8 條第 1 項第 1 款、新辦法第 6 條第 1 項第 1 款：高溫作業場所應每三個月監測綜合溫度熱指數一次以上。","**正確**：舊辦法第 7 條第 3 款、新辦法第 5 條第 1 項第 3 款：勞工噪音暴露工作日八小時日時量平均音壓級 85 分貝以上之作業場所，每六個月監測噪音一次以上。","**正確（依新辦法）**：新辦法第 6 條第 1 項第 2 款：特定粉塵、有機溶劑、特定化學物質等作業場所每六個月監測一次以上，暴露濃度高於或等於容許濃度者每三個月一次以上；舊辦法只有每六個月，沒有加密規定。","**錯誤（本題答案）**：中央管理方式空調建築物室內作業場所的二氧化碳是每「六個月」監測一次以上（舊第 7 條第 1 款、新第 5 條第 1 項第 1 款），不是每三個月。"],"explanation":"本題把監測頻率表的四個常考項目放在一起。每三個月：高溫作業 WBGT（唯一）；新辦法另加暴露濃度≥PEL 的化學性因子。每六個月：中央空調室內 CO2、坑內粉塵與 CO2、85 分貝以上噪音、特定粉塵、有機溶劑、特定化學物質、煉焦爐生成物；新辦法鉛與四烷基鉛也是每六個月。每年：舊辦法的鉛與四烷基鉛。選項 C 的「≥容許濃度者每三個月」是 115 年修正、116.1.1 施行的新規定，考試當時的舊辦法沒有這一句，但敘述本身在現行法下正確，且本題只有 D 明顯錯誤。CO2 的監測門檻另有一個數字要分清：容許暴露標準附表一二氧化碳 PEL-TWA 5000 ppm，室內空氣品質管理法的標準是 1000 ppm，環測辦法只管「多久測一次」。","dispute":"選項 C「暴露濃度高於或等於容許濃度者每三個月」是 115.6.12 修正、116.1.1 施行的新辦法第 6 條文字；113–115 年考試適用的舊辦法只規定每六個月，沒有加密條款。本題錯誤選項仍是 D（CO2 每六個月）。","review":{"key_points":["每 ==3 個月==：高溫 WBGT；（新法）化學性因子暴露 ≥PEL 者","每 ==6 個月==：中央空調 CO2、坑內粉塵與 CO2、噪音 85 dB、特定粉塵、有機溶劑、特化物、煉焦爐、（新法）鉛與四烷基鉛","每年：舊法鉛與四烷基鉛","CO2：PEL 5000 ppm（容許暴露標準）；室內空氣品質標準 1000 ppm"],"refs":[{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"應每六個月監測二氧化碳濃度一次以上"},{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"應每六個月監測噪音一次以上"},{"src":"勞工作業環境監測實施辦法","file":"_ref/勞工作業環境監測實施辦法.txt","quote":"但勞工暴露濃度高於或等於勞工作業場所容許暴露標準所定容許濃度者，應每三個月實施監測一次以上"}],"note_ref":"一、監測頻率與通報"}},{"qid":"c03q04","q":"依 113–115 年考試當時之勞工作業環境監測實施辦法，粉塵作業之作業環境監測紀錄應保存多久？","options":["三年","十年","三十年","永久"],"answer":1,"recon":"full","src":["113-3","113-8","113-6","113-11"],"optexp":["**錯誤**：三年是考試當時「一般」監測紀錄的保存年限（舊第 12 條第 2 項本文）；粉塵有特別規定。","**正確（本題答案）**：舊辦法第 12 條第 2 項但書後段：粉塵之監測紀錄應保存十年。回憶版：「只有粉塵 10 年，其餘都是 3 年或 30 年」。","**錯誤**：三十年是舊辦法附表四（新辦法附表六）所列致癌等化學物質（苯、氯乙烯、石綿、鉻酸、砷等）的監測紀錄保存年限，粉塵不在該附表。","**錯誤**：環測辦法沒有永久保存的規定；最長就是附表四（新附表六）化學物質的三十年。醫療法的「永久」只用於人體試驗病歷。"],"explanation":"本題考考試當時環測紀錄保存年限的三層結構，並要區分新舊法。舊辦法（105.11.02 版）第 12 條第 2 項：監測結果依附表三記錄並保存三年；但屬附表四所列化學物質者保存三十年；粉塵之監測紀錄保存十年。所以是「一般 3 年、粉塵 10 年、附表四化學物質 30 年」。新辦法（115.6.12 版）第 13 條第 2 項（116.1.1 施行）：監測結果及暴露評估報告一律保存十年，屬附表六所列化學物質者保存三十年，「3 年」這一層消失，粉塵與一般紀錄都變成 10 年。這套年限與勞工健康保護規則的健檢紀錄年限（一般 7 年、特殊 10 年、特定作業 30 年）是兩回事：粉塵作業的健檢紀錄是 30 年，環測紀錄考試當時是 10 年。回憶版多次出現「粉塵之環境監測記錄應保存多久？10 年」「正己烷 3 年、粉塵 10 年都正確」。","dispute":"","review":{"key_points":["考試當時環測紀錄：一般 ==3 年==、粉塵 ==10 年==、附表四化學物質 ==30 年==","新辦法（116.1.1）：監測結果及暴露評估報告一律 ==10 年==，附表六物質 30 年","粉塵：環測紀錄 10 年 vs 健檢紀錄 30 年——不同法規","健檢紀錄：一般 7 年、特殊 10 年、特定作業 30 年"],"refs":[{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"並保存三年。但屬附表四所列化學物質者，應保存三十年；粉塵之監測紀錄應保存十年。"},{"src":"勞工作業環境監測實施辦法","file":"_ref/勞工作業環境監測實施辦法.txt","quote":"應保存十年。但屬附表六所列化學物質者，應保存三十年。"}],"note_ref":"二、監測紀錄保存年限"}},{"qid":"c03q05","q":"依 113–115 年考試當時之規定，正己烷作業之作業環境監測紀錄應保存幾年？","options":["三年","七年","十年","三十年"],"answer":0,"recon":"full","src":["113-6","113-8","114-01"],"optexp":["**正確（本題答案）**：正己烷不是粉塵、也不在舊辦法附表四的 30 年清單，依舊第 12 條第 2 項本文保存三年（114-01 回憶：「正己烷環境檢測保存幾年？3 年」）。","**錯誤**：七年是勞工健康保護規則一般體格（健康）檢查紀錄與醫療法病歷的保存年限，環測辦法沒有七年。","**錯誤**：十年在考試當時只適用於粉塵的監測紀錄；116.1.1 起新辦法才把所有監測結果改為十年。另外正己烷「健檢」紀錄是 10 年（健康保護規則），不要混用。","**錯誤**：三十年是附表四（新附表六）致癌等化學物質，正己烷屬神經毒性有機溶劑，不在清單內。"],"explanation":"本題考同一套年限規則在有機溶劑的應用，並提醒兩種紀錄的區別。環測紀錄（考試當時）：一般 3 年、粉塵 10 年、附表四化學物質 30 年；正己烷是附表一有機溶劑作業，屬一般類，保存 3 年；116.1.1 起新辦法改為 10 年。健檢紀錄（勞工健康保護規則）：附表十特殊檢查紀錄 10 年，第 20 條清單 30 年；正己烷不在 30 年清單，保存 10 年。所以「正己烷 3 年」是環測、「正己烷 10 年」是健檢，題目問哪一種要看清楚。正己烷本身的常考數字：PEL-TWA 50 ppm（176 mg/m³，皮）；分級指引輔助基準 25 ppm；生物偵測為尿中 2,5-己二酮；毒性表現為周邊多發性神經病變（手套襪套型感覺異常、遠端肌無力）。","dispute":"","review":{"key_points":["正己烷環測紀錄：考試當時 ==3 年==；新辦法 10 年","正己烷健檢紀錄：==10 年==（不在 30 年清單）","正己烷 PEL-TWA ==50 ppm==（皮）；指引輔助基準 25 ppm；生物偵測尿中 2,5-己二酮","問「環境監測紀錄」與「健康檢查紀錄」答案不同"],"refs":[{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"前項監測結果應依附表三記錄，並保存三年"},{"src":"0000387835","file":"_ref/annex_pel/0000387835.txt","quote":"正己烷 n-Hexane CH3(CH2)4CH3 皮 50 176"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"檢查紀錄至少保存十年"}],"note_ref":"二、監測紀錄保存年限"}},{"qid":"c03q06","q":"下列何者不是勞工作業場所容許暴露標準所定之容許濃度種類？","options":["八小時日時量平均容許濃度","短時間時量平均容許濃度","最高容許濃度","月時量平均容許濃度"],"answer":3,"recon":"full","src":["114-05","114-02"],"optexp":["**是法定種類**：容許暴露標準第 3 條第 1 款：八小時日時量平均容許濃度（PEL-TWA），勞工每天工作八小時、一般勞工重複暴露此濃度以下不致有不良反應。","**是法定種類**：第 3 條第 2 款：短時間時量平均容許濃度（PEL-STEL），一般勞工連續暴露在此濃度以下任何十五分鐘不致有不可忍受之刺激等，數值＝TWA×變量係數。","**是法定種類**：第 3 條第 3 款：最高容許濃度（PEL-C），附表一符號欄註有「高」字者，不得使勞工有任何時間超過此濃度之暴露。","**不是（本題答案）**：容許暴露標準只有三種容許濃度，沒有「月時量平均」；評估暴露以全程工作日的時量平均、任何十五分鐘、任何時間為單位。"],"explanation":"本題考勞工作業場所容許暴露標準第 3 條的三種容許濃度。(1) 八小時日時量平均容許濃度：附表一符號欄未註「高」字者，為勞工每天工作八小時、一般勞工重複暴露此濃度以下不致有不良反應者。(2) 短時間時量平均容許濃度：附表一未註「高」字及附表二之容許濃度乘以變量係數所得，為一般勞工連續暴露在此濃度以下任何十五分鐘不致有不可忍受之刺激、慢性或不可逆之組織病變、麻醉昏暈作用、事故增加之傾向或工作效率之降低者；變量係數依 TWA 數值大小：未滿 1→3、1–10→2、10–100→1.5、100–1000→1.25、1000 以上→1。(3) 最高容許濃度：附表一符號欄註「高」字者，不得使勞工有任何時間超過此濃度之暴露，以防不可忍受之刺激或生理病變。第 8 條對應三條規則：全程工作日時量平均不得超過 TWA；任何連續十五分鐘不得超過 STEL；任何時間不得超過 C。114-02 另有一題回憶「工作暴露量評估何者正確」標「月暴露平均量」，題意與本題相反且回憶不確定（見爭議註記）。","dispute":"114-02 另有一題回憶為「工作暴露量評估何者正確」並標「月暴露平均量」，與本題問法相反且回憶者不確定；依容許暴露標準第 3 條，只有 8 小時日時量平均、短時間時量平均（15 分鐘）、最高容許濃度三種，「月時量平均」不是法定容許濃度，應試以此為準。","review":{"key_points":["三種容許濃度：==8 小時日時量平均（TWA）、短時間時量平均（STEL，任何 15 分鐘）、最高容許濃度（C，任何時間）==","STEL＝TWA×變量係數：\u003c1→3、1–10→2、10–100→1.5、100–1000→1.25、≥1000→1","「高」字＝最高容許濃度，不得有任何時間超過","沒有「月時量平均」這種容許濃度"],"refs":[{"src":"勞工作業場所容許暴露標準","file":"_ref/勞工作業場所容許暴露標準.txt","quote":"本標準所稱容許濃度如下：一、八小時日時量平均容許濃度"},{"src":"勞工作業場所容許暴露標準","file":"_ref/勞工作業場所容許暴露標準.txt","quote":"三、最高容許濃度：附表一符號欄註有「高」字之濃度，為不得使一般勞工有任何時間超過此濃度之暴露"},{"src":"勞工作業場所容許暴露標準","file":"_ref/勞工作業場所容許暴露標準.txt","quote":"二、任何一次連續十五分鐘內之時量平均濃度不得超過短時間時量平均容許濃度。"}],"note_ref":"三、容許濃度的三種定義與計算"}},{"qid":"c03q07","q":"依勞工作業場所容許暴露標準，「短時間時量平均容許濃度」之定義為何？","options":["勞工每天工作八小時，一般勞工重複暴露此濃度以下不致有不良反應者","一般勞工連續暴露在此濃度以下任何十五分鐘，不致有不可忍受之刺激、慢性或不可逆之組織病變、麻醉昏暈作用、事故增加之傾向或工作效率之降低者","不得使一般勞工有任何時間超過此濃度之暴露","勞工每週工作四十小時之平均暴露濃度"],"answer":1,"recon":"full","src":["整理-表格"],"optexp":["**錯誤**：這是第 3 條第 1 款「八小時日時量平均容許濃度」的定義：勞工每天工作八小時，一般勞工重複暴露此濃度以下不致有不良反應者。","**正確（本題答案）**：第 3 條第 2 款「短時間時量平均容許濃度」：一般勞工連續暴露在此濃度以下任何十五分鐘，不致有不可忍受之刺激、慢性或不可逆之組織病變、麻醉昏暈作用、事故增加之傾向或工作效率之降低者。","**錯誤**：這是第 3 條第 3 款「最高容許濃度」的定義：附表一符號欄註「高」字者，不得使一般勞工有任何時間超過此濃度之暴露。","**錯誤**：容許暴露標準沒有以每週四十小時為基準的定義；ACGIH 的 TLV-TWA 才以每週 40 小時描述，我國法規是每天八小時。"],"explanation":"本題考三種容許濃度的定義文字，是前一題的進階。八小時日時量平均容許濃度：每天工作八小時、重複暴露不致不良反應；短時間時量平均容許濃度：任何十五分鐘連續暴露不致有「不可忍受之刺激、慢性或不可逆之組織病變、麻醉昏暈作用、事故增加之傾向或工作效率之降低」五種效應；最高容許濃度：任何時間不得超過，以防不可忍受之刺激或生理病變。STEL 的數值不是另外表列，而是 TWA 乘變量係數（\u003c1→3、1–10→2、10–100→1.5、100–1000→1.25、≥1000→1）；例如正己烷 TWA 50 ppm，係數 1.5，STEL 75 ppm；苯 TWA 1 ppm，係數 2，STEL 2 ppm。單位：氣狀物 ppm、粒狀物 mg/m³、石綿 f/cc，皆在 25℃、一大氣壓條件下。第 10 條並規定本標準不適用於：以兩種有害物容許濃度比作為毒性指標、工作場所以外之空氣污染指標、職業疾病鑑定之唯一依據。","dispute":"","review":{"key_points":["STEL 定義關鍵字：==任何十五分鐘==、不致有不可忍受之刺激、慢性或不可逆組織病變、麻醉昏暈、事故增加、工作效率降低","TWA 定義：每天工作八小時重複暴露不致不良反應；C：任何時間不得超過","STEL＝TWA×變量係數（正己烷 50×1.5＝75 ppm；苯 1×2＝2 ppm）","單位：氣狀 ppm、粒狀 mg/m³、石綿 f/cc（25℃、1 atm）；不得作為職業病鑑定唯一依據"],"refs":[{"src":"勞工作業場所容許暴露標準","file":"_ref/勞工作業場所容許暴露標準.txt","quote":"為一般勞工連續暴露在此濃度以下任何十五分鐘，不致有不可忍受之刺激"},{"src":"勞工作業場所容許暴露標準","file":"_ref/勞工作業場所容許暴露標準.txt","quote":"為勞工每天工作八小時，一般勞工重複暴露此濃度以下，不致有不良反應者"},{"src":"勞工作業場所容許暴露標準","file":"_ref/勞工作業場所容許暴露標準.txt","quote":"三、職業疾病鑑定之唯一依據。"}],"note_ref":"三、容許濃度的三種定義與計算"}},{"qid":"c03q08","q":"某勞工從事正己烷作業，於 80 ppm 濃度下暴露 4 小時，其餘 4 小時無暴露，工作時間共 8 小時。其八小時日時量平均暴露濃度為多少？","options":["20 ppm","40 ppm","80 ppm","160 ppm"],"answer":1,"recon":"full","src":["113-10","113-11","114-01"],"optexp":["**錯誤**：20 ppm 是把 80 ppm 除以 4 小時的算法，時量平均要除以「總工作時間」8 小時，不是暴露時數。","**正確（本題答案）**：容許暴露標準第 4 條：時量平均濃度＝Σ（濃度×時間）／總工作時間＝(80×4＋0×4)／8＝40 ppm；低於正己烷 PEL-TWA 50 ppm，未超標。","**錯誤**：80 ppm 是暴露期間的濃度，不是八小時日時量平均；只有全程八小時都在 80 ppm 才會等於 80。","**錯誤**：160 ppm 是 80×4／2 的誤算，沒有任何合理的計算方式會得到此值。"],"explanation":"本題考容許暴露標準第 4 條時量平均濃度的計算。公式：（第一次濃度×工作時間＋第二次濃度×工作時間＋…＋第 n 次濃度×工作時間）／總工作時間；無暴露時段以 0 計入，分母是全程工作時間。本例 (80×4＋0×4)／8＝40 ppm。判定：第 8 條第 1 款規定全程工作日之時量平均濃度不得超過相當八小時日時量平均容許濃度，正己烷 TWA 為 50 ppm（176 mg/m³，皮），40 ppm 未超標；但第 2 款另要求任何連續十五分鐘不得超過 STEL（正己烷 50×1.5＝75 ppm），本例 80 ppm 的四小時暴露已超過 STEL，實務上仍屬違規，考題只問日時量平均。分級指引正己烷第三級輔助基準為 PEL-TWA≥25 ppm。混合暴露時（第 9 條）非相乘或獨立效應者視為相加效應，各成分濃度／容許濃度之總和大於 1 即超標。工作時間超過八小時者，要換算成「相當八小時日時量平均」再比較。","dispute":"","review":{"key_points":["時量平均＝Σ(濃度×時間)／==總工作時間==，無暴露時段以 0 計","(80×4＋0×4)／8＝==40 ppm==；正己烷 TWA 50 ppm 未超標，但 80 ppm 已超過 STEL 75 ppm","混合暴露相加效應：Σ(Ci/PELi) >1 即超標","正己烷輔助基準（分級指引）25 ppm"],"refs":[{"src":"勞工作業場所容許暴露標準","file":"_ref/勞工作業場所容許暴露標準.txt","quote":"一、全程工作日之時量平均濃度不得超過相當八小時日時量平均容許濃度。"},{"src":"勞工作業場所容許暴露標準","file":"_ref/勞工作業場所容許暴露標準.txt","quote":"並依下列規定計算，其總和大於一時，即屬超出容許濃度"},{"src":"0000387835","file":"_ref/annex_pel/0000387835.txt","quote":"正己烷 n-Hexane CH3(CH2)4CH3 皮 50 176"}],"note_ref":"三、容許濃度的三種定義與計算"}},{"qid":"c03q09","q":"我國勞工作業場所容許暴露標準規定，二氧化碳之八小時日時量平均容許濃度為多少？","options":["1,000 ppm","5,000 ppm","9,000 ppm","10,000 ppm"],"answer":1,"recon":"full","src":["整理-表格"],"optexp":["**錯誤**：1000 ppm 是室內空氣品質管理法對二氧化碳的室內空氣品質標準（8 小時值），不是勞工作業場所容許暴露標準。","**正確（本題答案）**：容許暴露標準附表一編號 70：二氧化碳 Carbon dioxide，八小時日時量平均容許濃度 5000 ppm（9000 mg/m³）。","**錯誤**：9000 是附表一同一列的 mg/m³ 值，不是 ppm；單位看錯就會選到這個。","**錯誤**：10000 ppm 不是我國 PEL；ACGIH 的 CO2 STEL 為 30000 ppm，也不是這個數字。"],"explanation":"本題考容許暴露標準附表一的二氧化碳數值，並區分另一套法規。附表一編號 70：二氧化碳 5000 ppm、9000 mg/m³，符號欄無「高」字，所以是 TWA，STEL 依變量係數（≥1000→1）亦為 5000 ppm。室內空氣品質管理法（環境部主管）的室內空氣品質標準 CO2 為 1000 ppm（8 小時值），適用於公眾場所室內空氣品質，與勞工作業場所容許暴露是不同的法規與目的；環測辦法第 5 條規定中央空調建築物室內作業場所每六個月監測 CO2，並允許已依室內空氣品質管理法檢測者免測，但判定用的容許濃度仍是 5000 ppm。附表一其他常考值：苯 1 ppm（特定化學物）、正己烷 50 ppm（皮）、二硫化碳 10 ppm、溴丙烷 0.5 ppm、苯乙烯 50 ppm、四氯乙烷 1 ppm、鉛 0.05 mg/m³、汞 0.05 mg/m³、鈹 0.002 mg/m³、銦 0.1 mg/m³。","dispute":"","review":{"key_points":["二氧化碳 PEL-TWA ==5000 ppm==（9000 mg/m³）；室內空氣品質標準 1000 ppm 是另一套法規","苯 1 ppm、正己烷 50 ppm、二硫化碳 10 ppm、溴丙烷 0.5 ppm、四氯乙烷 1 ppm","鉛 0.05、汞 0.05、鈹 0.002、銦 0.1 mg/m³","中央空調室內 CO2 每 6 個月監測；已依室內空氣品質管理法檢測者得免"],"refs":[{"src":"0000387835","file":"_ref/annex_pel/0000387835.txt","quote":"二氧化碳 Carbon dioxide CO2 5000 9000"},{"src":"勞工作業環境監測實施辦法","file":"_ref/勞工作業環境監測實施辦法.txt","quote":"前項第一款之作業場所，雇主已依室內空氣品質管理法規定實施二氧化碳檢驗測定者，得免監測。"}],"note_ref":"三、容許濃度的三種定義與計算"}},{"qid":"c03q10","q":"勞工作業經歷之工作調查（職業史），通常不包含下列何項？","options":["輪班情形","每週工時","每季工時","危害物暴露情形"],"answer":2,"recon":"partial","src":["113-3","113-11","114-03"],"optexp":["**通常包含**：輪班情形（輪班、夜班、班別）影響暴露時段與生理負荷，是職業史調查的基本欄位，也是母性保護與過勞評估的項目。","**通常包含**：每週工時（含加班）是評估暴露總量與工作負荷的基本資料，過勞認定指引也以週工時換算加班時數。","**通常不包含（本題答案）**：工作調查以日、週、月為單位描述工時與工作型態，「每季工時」不是慣用項目；回憶版三個版本都以此為答案。","**通常包含**：危害物暴露情形（暴露物質、濃度、時間、防護具使用）是職業史的核心，附表九、十第一項「作業經歷」調查的重點就是這個。"],"explanation":"本題考勞工作業經歷（職業史）調查的內容。附表九與附表十的第一個項目都是「作業經歷、既往病史、生活習慣及自覺症狀之調查」，作業經歷（職業史）的標準內容包括：現職與過去所有工作的雇主、行業、職稱、起迄年份；具體工作內容與製程；暴露的物理、化學、生物、人因危害及其濃度與時間；每日／每週工時、加班、輪班與夜班情形；防護具使用與工程控制；同事是否有類似症狀；兼職與嗜好暴露。工時以日、週、月為單位（過勞指引以每月 176 小時以外計加班），沒有「每季工時」這種慣用欄位。勞工健康保護規則第 18 條並要求雇主於定期特殊健康檢查時，將作業內容、最近一次環測紀錄與危害暴露情形交予醫師，就是補足職業史中勞工自述不足的部分。回憶版問法：「工作調查不包含何者：輪班／週工時／季工時」答季工時。","dispute":"","review":{"key_points":["職業史內容：雇主／行業／職稱／年份、工作內容、==暴露物質與時間==、==工時與輪班==、防護具、同事症狀、嗜好暴露","工時以日／週／月計，==季工時==非慣用項目","雇主應交付作業內容、最近一次環測紀錄、暴露情形給健檢醫師（第 18 條）","附表九、十第一項：作業經歷、既往病史、生活習慣及自覺症狀之調查"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"雇主使勞工接受定期特殊健康檢查時，應將勞工作業內容、最近一次之作業環境監測紀錄及危害暴露情形等作業經歷資料交予醫師。"}],"note_ref":"四、職業衛生基本概念"}},{"qid":"c03q11","q":"職業衛生（工業衛生）四大工作原則的順序為何？","options":["預期、認知、評估、控制","認知、預期、控制、評估","評估、認知、預期、控制","控制、評估、認知、預期"],"answer":0,"recon":"full","src":["整理-表格"],"optexp":["**正確（本題答案）**：工業衛生（職業衛生）四大工作原則依序為預期（anticipation）、認知（recognition）、評估（evaluation）、控制（control）。","**錯誤**：認知放在預期之前、控制放在評估之前，順序顛倒；必須先預期可能的危害、認知現場實際存在的危害，再評估暴露程度，最後才能控制。","**錯誤**：評估不能排在認知之前，沒有先辨識出作業場所存在哪些危害，就無從決定要監測、量化什麼。","**錯誤**：控制是四步驟的最後一步，必須以評估結果決定控制對象與優先順序；此選項把順序完全反過來。"],"explanation":"本題考職業衛生的基本工作架構。四大原則：預期（anticipation）—在製程設計或作業開始前預測可能產生的危害；認知（recognition）—辨識作業場所實際存在的物理、化學、生物、人因與心理社會危害；評估（evaluation）—以作業環境監測、生物偵測、暴露評估量化危害程度，與容許暴露標準比較；控制（control）—依優先順序消除／取代、工程控制、行政管理、個人防護具降低暴露。記法「預認評控」，對應英文 AREC。整理表格另記職業安全衛生管理計畫的步驟為分析、確認、執行、評值（PDCA 概念）。這個架構貫穿本章：環測辦法是「評估」的法規工具，容許暴露標準是「評估」的比較基準，工程控制與行政管理則是「控制」的手段；勞工健康檢查與分級管理則屬於評估與控制之後的健康監測。","dispute":"","review":{"key_points":["工業衛生四原則：==預期→認知→評估→控制==（anticipation, recognition, evaluation, control）","評估工具：作業環境監測、生物偵測、容許暴露標準","控制優先順序：消除／取代＞工程控制＞行政管理＞個人防護具","管理計畫步驟：分析、確認、執行、評值"],"refs":[],"note_ref":"四、職業衛生基本概念"}},{"qid":"c03q12","q":"下列何者屬於作業環境危害之「工程控制」？","options":["縮短工時","輪換工作職務","濕式作業與局部排氣裝置","配戴防毒面具"],"answer":2,"recon":"rebuilt","src":["整理-表格"],"optexp":["**不是工程控制**：縮短工時是行政管理（administrative control），透過減少暴露時間降低劑量，危害源本身沒有改變。","**不是工程控制**：輪換工作職務是行政管理，把暴露分攤到多人，屬人的管理而非設備或製程的改變。","**是工程控制（本題答案）**：濕式作業抑制粉塵發散、局部排氣裝置在發生源捕集有害物，都是改變製程或設備以阻斷危害傳播的工程控制。","**不是工程控制**：配戴防毒面具是個人防護具（PPE），控制順序中的最後手段。"],"explanation":"本題考危害控制的分類與優先順序。工程控制：從危害源或傳播路徑下手，包括取代（低毒性物質替代）、密閉設備、隔離、濕式作業、整體換氣（稀釋通風）、局部排氣裝置、製程變更或自動化、廠房設計及布置、設備保養維護；有機溶劑中毒預防規則第 3 條定義密閉設備為「密閉蒸氣發生源使其不致發散」、局部排氣裝置為「藉動力強制吸引並排出已發散蒸氣」、整體換氣裝置為「藉動力稀釋已發散蒸氣」。行政管理：縮短工時、輪班、輪換職務、作業標準、教育訓練、標示公告、健康檢查與管理。個人防護具：防毒面具、防塵口罩、面罩、眼罩、耳塞耳罩、防護衣手套。優先順序：消除／取代＞工程控制＞行政管理＞個人防護具，因為越靠近源頭的控制越不依賴勞工個人行為。設施規則第 300 條噪音超過 90 分貝時要求「工程控制、減少暴露時間」就是工程與行政並用，85 分貝以上戴防音防護具則是 PPE。","dispute":"","review":{"key_points":["工程控制：==取代、密閉、隔離、濕式作業、整體換氣、局部排氣==、製程變更、廠房布置","行政管理：縮短工時、輪班、輪換職務、教育訓練、標示","個人防護具：防毒面具、耳塞耳罩等，最後手段","優先順序：消除／取代＞工程＞行政＞PPE"],"refs":[{"src":"有機溶劑中毒預防規則","file":"_ref/有機溶劑中毒預防規則.txt","quote":"四、局部排氣裝置：指藉動力強制吸引並排出已發散有機溶劑蒸氣之設備。"},{"src":"有機溶劑中毒預防規則","file":"_ref/有機溶劑中毒預防規則.txt","quote":"五、整體換氣裝置：指藉動力稀釋已發散有機溶劑蒸氣之設備。"},{"src":"有機溶劑中毒預防規則","file":"_ref/有機溶劑中毒預防規則.txt","quote":"三、密閉設備：指密閉有機溶劑蒸氣之發生源使其蒸氣不致發散之設備。"}],"note_ref":"四、職業衛生基本概念"}},{"qid":"c03q13","q":"有關局部排氣裝置之敘述，下列何者錯誤？","options":["構成要素包括氣罩、導管、空氣清淨裝置及排氣機","有害物在污染作業場所空氣前即被捕集排出室外，效能優於整體換氣","所需排出及補充之空氣量小於整體換氣","排氣導管應設於氣罩與排氣機之間"],"answer":3,"recon":"rebuilt","src":["整理-表格"],"optexp":["**正確**：局部排氣裝置由氣罩（hood）、導管（duct）、空氣清淨裝置（air cleaner）、排氣機（fan）四要素組成，最後接排氣口。","**正確**：局部排氣在發生源直接捕集，有害物尚未擴散到作業場所空氣就被排出，效能優於靠稀釋的整體換氣。","**正確**：因為只抽發生源附近的空氣，局部排氣所需排出與補充的空氣量遠小於整體換氣，節省能源與空調負荷。","**錯誤（本題答案）**：氣罩與排氣機之間的是「吸氣導管」；「排氣導管」在排氣機與排氣口之間。整理表格原文：「排氣導管應在排氣機與排氣口之間；吸氣導管連結於氣罩與排氣機之間」。"],"explanation":"本題考局部排氣裝置的構造與名詞。氣流路徑：氣罩→吸氣導管→空氣清淨裝置→排氣機→排氣導管→排氣口。氣罩依型式分包圍式、外裝式（側方、下方、上方吸引）、接收式、吹吸式；吸氣導管搬運含有害物的空氣，連結氣罩與排氣機；空氣清淨裝置（除塵、洗滌、吸附等）放在排氣機之前以保護風機；排氣機之後的排氣導管把已淨化空氣送到排氣口排出室外，排氣口應設於室外。與整體換氣比較：局部排氣捕集效率高、需氣量小、可處理高毒性物質，但設置成本高、氣罩位置固定；整體換氣只能用於低毒性、發散量小、發生源分散的情形，所需換氣量大。有機溶劑中毒預防規則規定第一種有機溶劑室內作業應設密閉設備或局部排氣，第二種可用整體換氣，第三種限儲槽等或通風不充分場所才須設置。","dispute":"","review":{"key_points":["局排四要素與順序：==氣罩→吸氣導管→空氣清淨裝置→排氣機→排氣導管→排氣口==","吸氣導管在氣罩與排氣機之間；==排氣導管在排氣機與排氣口之間==","局排優點：源頭捕集、需氣量小、效能優於整體換氣","第一種有機溶劑：密閉或局排；第二種：可整體換氣"],"refs":[{"src":"有機溶劑中毒預防規則","file":"_ref/有機溶劑中毒預防規則.txt","quote":"四、局部排氣裝置：指藉動力強制吸引並排出已發散有機溶劑蒸氣之設備。"},{"src":"有機溶劑中毒預防規則","file":"_ref/有機溶劑中毒預防規則.txt","quote":"從事有關第一種有機溶劑或其混存物之作業，應於各該作業場所設置密閉設備或局部排氣裝置"}],"note_ref":"四、職業衛生基本概念"}},{"qid":"c03q14","q":"依礦場職業衛生設施標準，礦場坑內作業場所空氣中之氧氣濃度應保持在多少以上？","options":["16%","18%","19%","21%"],"answer":2,"recon":"full","src":["整理-表格"],"optexp":["**錯誤**：16% 不是任何法規的門檻；氧氣濃度 16% 以下人體開始出現明顯缺氧症狀，但那是生理數字。","**錯誤**：18% 是缺氧症預防規則所稱「缺氧」的定義（空氣中氧氣濃度未滿 18%），適用一般缺氧危險場所，不是礦場坑內標準。","**正確（本題答案）**：礦場職業衛生設施標準第 7 條：雇主對於坑內作業場所空氣中氧氣濃度，應保持在百分之十九以上，低於 19% 時不得使勞工在該場所作業（戴用空氣呼吸器搶救或處理通風設備者除外）。","**錯誤**：21% 是正常大氣的氧氣濃度，不是管制門檻；若以 21% 為標準，坑內作業幾乎無法進行。"],"explanation":"本題考礦場職業衛生設施標準與缺氧症預防規則兩個不同的氧氣門檻。礦場職業衛生設施標準第 7 條：坑內作業場所空氣中氧氣濃度應保持在 19% 以上，低於 19% 不得使勞工作業，但戴用空氣呼吸器等呼吸防護具從事搶救或處理現場通風系統等設備者不在此限。缺氧症預防規則：所稱缺氧是空氣中氧氣濃度未滿 18%，缺氧危險場所應測定氧氣濃度並保持 18% 以上，否則應使勞工戴用空氣呼吸器等。兩者差 1%，礦場坑內要求較嚴。相關的環測規定：環測辦法第 5 條坑內作業場所（礦場採掘、隧道掘削、完工地下通道）應每六個月監測粉塵與二氧化碳。同一大類的其他門檻：坑內 CO2 容許 5000 ppm（附表一），礦場標準另有坑內溫濕分區、通風量、一氧化碳超過 50 ppm 應退避、發爆粉塵未沖淡前不得接近等規定。整理表格原文：「依礦場衛生設施標準規定，在坑內氧氣應保持在 19%」。","dispute":"","review":{"key_points":["礦場坑內氧氣 ==≥19%==（礦場職業衛生設施標準第 7 條）","缺氧症預防規則：氧氣未滿 ==18%== 為缺氧","低於門檻不得作業；戴空氣呼吸器搶救或處理通風設備者例外","坑內每 6 個月監測粉塵與 CO2（環測辦法）"],"refs":[{"src":"礦場職業衛生設施標準","file":"_ref/礦場職業衛生設施標準.txt","quote":"雇主對於坑內作業場所空氣中氧氣濃度，應保持在百分之十九以上"},{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"二、下列坑內作業場所應每六個月監測粉塵、二氧化碳之濃度一次以上："}],"note_ref":"五、礦場坑內氧氣"}}]},{"idx":3,"order":3,"title":"醫事法規與職業病認定制度","group":"法規與制度","gi":0,"notes_md":"本章 16 題，考醫師法（執業執照更新、執業處所、停歇業、廢止事由）、醫療法病歷保存、健檢與職災法制的法源、職業病認定五準則與災保法鑑定制度，以及過勞、精神疾病、PTSD 三份認定指引的關鍵數字。\n\n## 一、醫師法：執業執照、執業處所與停歇業\n- 執業執照每 ==6 年== 更新；特殊理由經核准延期者，期限屆至之日起 ==6 個月內== 補行申請。\n- 歇業或停業：事實發生之日起 ==30 日內== 報備；停業以 ==1 年== 為限。\n- 一處執業例外：急救、會診支援、應邀出診、主管機關指派、其他==事先報准==。\n- 第 8 條之 1：撤銷或廢止==醫師證書==→永久不得發執業執照；廢止==執業執照==未滿 1 年不得發給。\n- 外國學歷：學歷甄試（指定國家免）→醫師考試→臨床實作適應訓練→PGY；兼具中西醫資格擇一登記；西醫師經核可針灸訓練得執行針灸（函釋）。\n- 放射師法第 12 條：特殊攝影及造影應配合醫師行之，顯影劑注射可在醫師指示下執行。\n\n## 二、醫師法的處罰與廢止事由\n- 第 28 條之 4 五款：==不得執行之醫療行為==、禁用藥物、容留密醫、==租借證書==、==不實診斷書／出生／死亡／死產證明書==；罰鍰 ==10–50 萬==，得併限制執業範圍、停業 1 個月–1 年或廢止執業執照，情節重大廢止醫師證書。\n- 第 25 條懲戒事由以「業務上」為前提；婚外情等私德不在內。\n- 衛福部公告：未滿 18 歲==非醫療必要美容手術==（眼部、鼻部整形、植髮、抽脂、削骨、顱顏重整、拉皮、胸部整形）一律不得施作，家長同意亦不可。\n\n## 三、醫療法：病歷保存\n- 病歷至少 ==7 年==；未成年者至==成年後 7 年==；人體試驗==永久==；歇業無承接者續存 6 個月以上始得銷燬。\n- 對照：健檢紀錄一般 7 年、特殊 10 年、特定作業 30 年；認可機構品質文件 3 年。\n\n## 四、健康檢查與職災保護的法源\n- 健檢法源＝==職業安全衛生法第 20、21 條==→勞工健康保護規則、認可辦法。\n- 職災補償與鑑定＝==勞工職業災害保險及保護法==（111.5.1 施行，整併勞保條例職災保險與職災勞工保護法）：第 42 條傷病給付、第 63 條預防職業病健檢、第 73 條認可醫療機構、==第 75 條職業病鑑定==。勞基法第 59 條＝雇主職災補償。\n\n## 五、職業病認定準則與鑑定制度\n- 〔10/03 課堂〕何時要懷疑職業病：常見臨床病因解釋不了；與工作有關（==上班時加重、停工時改善==）；==其他同事有同樣症狀==；症狀與接觸物質可能的危害一致。\n- 五準則：==疾病證據、暴露證據、時序性、流行病學證據、排除其他因子==；皆為客觀證據。\n- 鑑定辦法第 10 條：職業病＝職業因素==貢獻度 >50%==；腦心血管與精神疾病→工作相關／非工作相關疾病。\n- 分組鑑定會 ==9 人==：召集人 1＋==職醫 5==＋相關專科 1＋職安衛 1＋法律 1；三組（化學物理生物／呼吸／皮膚／癌症；肌肉骨骼；腦心血管與精神）。\n- 程序：書面鑑定 14 日、==2/3 相同意見==→開會（2/3 出席、職醫 ≥3、過半數）→全數委員 27 人共同鑑定。申請人＝保險人。\n\n## 六、過勞、精神疾病與 PTSD 認定指引\n- 過勞目標疾病：腦出血、腦梗塞、蜘蛛膜下腔出血、高血壓性腦病變；心肌梗塞、急性心臟衰竭、主動脈剝離、狹心症、嚴重心律不整、心臟停止、心因性猝死。\n- 三段：異常事件 ==24 小時==、短期過重 ==1 週==、長期過重 ==6 個月==；極強相關＝前 1 個月加班 ==>100 小時== 或前 2–6 個月任一期間月平均 ==>80 小時==（每月 176 小時以外計）；\u003c45 小時薄弱。\n- 精神疾病：ICD-10 ==F2–F9==（以 F2–F4 為主，F0、F1 排除）；精神科追蹤 ==6 個月且 ≥6 次==；評估發病前約 ==6 個月== 內業務強烈心理壓力。\n- PTSD：親身經歷或==目睹==職業相關身心創傷或重大意外；F43.1；創傷＝真正或具威脅性的死亡、重傷、性暴力。\n\n## 七、職災給付與補償\n- 災保法第 42 條傷病給付：不能工作之日起算==第 4 日==起；前 2 個月全額、第 3 個月起 ==70%==、最長 ==2 年==；離職退保後才確診職業病改依退保後罹患職業病補助辦法。\n- 勞基法第 59 條職災死亡：==5 個月==喪葬費（死亡後 ==3 日內==）＋==40 個月==死亡補償（==15 日內==）；補償與保險給付得抵充。","questions":[{"qid":"c04q01","q":"依醫師法，有關醫師執業執照更新之敘述，下列何者錯誤？","options":["醫師執業應接受繼續教育，並每六年提出完成繼續教育證明文件，辦理執業執照更新","有特殊理由未能於執業執照有效期限屆至前申請更新者，得檢具書面理由及證明文件向原發執業執照機關申請延期更新","經核准延期更新者，得於有效期限屆至之日起六個月內補行申請","經核准延期更新者，得於有效期限屆至之日起一年內補行申請"],"answer":3,"recon":"full","src":["113-7","113-12","114-05"],"optexp":["**正確**：醫師法第 8 條第 2 項前段：醫師執業應接受繼續教育，並每六年提出完成繼續教育證明文件，辦理執業執照更新。","**正確**：第 8 條第 2 項但書：有特殊理由未能於有效期限屆至前申請更新，經檢具書面理由及證明文件向原發執業執照機關申請延期更新並經核准者，得補行申請。回憶版舉例生產、疫情。","**正確**：同項但書明定經核准延期者，得於有效期限屆至之日起「六個月內」補行申請。","**錯誤（本題答案）**：補行申請的期限是六個月內，不是一年內；一年是第 10 條停業期間的上限與第 8 條之 1 廢止執業執照後不得發照的期間。113-12 回憶：「題目考錯誤，選項出一年內」。"],"explanation":"本題考醫師法第 8 條執業執照更新的數字。醫師應向執業所在地直轄市、縣（市）主管機關申請執業登記，領有執業執照始得執業；執業應接受繼續教育，每六年提出完成繼續教育證明文件辦理執業執照更新；有特殊理由（如生產、重病、疫情）未能於有效期限屆至前申請更新者，檢具書面理由及證明文件向原發執業執照機關申請延期更新並經核准後，得於有效期限屆至之日起六個月內補行申請。違反第 8 條第 2 項（未更新）依第 27 條處 2 萬至 10 萬元罰鍰並限期改善。醫師法裡「一年」出現在兩處要區分：第 10 條停業期間以一年為限，逾一年應辦歇業；第 8 條之 1 經廢止執業執照未滿一年者不得發給執業執照。「六」出現在：六年更新、六個月補行申請、密醫罪六個月以上五年以下有期徒刑。","dispute":"","review":{"key_points":["執業執照每 ==6 年== 更新（繼續教育證明）","特殊理由經核准延期者：有效期限屆至之日起 ==6 個月內== 補行申請","「一年」：停業以 1 年為限；廢止執業執照未滿 1 年不得發照","未更新：罰鍰 2 萬至 10 萬並限期改善（第 27 條）"],"refs":[{"src":"醫師法","file":"_ref/醫師法.txt","quote":"並每六年提出完成繼續教育證明文件，辦理執業執照更新"},{"src":"醫師法","file":"_ref/醫師法.txt","quote":"得於有效期限屆至之日起六個月內，補行申請"}],"note_ref":"一、醫師法：執業執照、執業處所與停歇業"}},{"qid":"c04q02","q":"依醫療法，醫療機構之病歷至少應保存幾年？未成年者之病歷應保存至何時？","options":["五年；至成年後五年","七年；至成年後七年","十年；至成年後十年","十五年；永久保存"],"answer":1,"recon":"full","src":["113-7","113-12","114-05"],"optexp":["**錯誤**：五年不是醫療法的病歷保存年限；容易混淆的是醫療法第 70 條銷燬前的六個月與其他法規的年限。","**正確（本題答案）**：醫療法第 70 條第 1 項：醫療機構之病歷應指定適當場所及人員保管，並至少保存七年；未成年者之病歷至少應保存至其成年後七年；人體試驗之病歷應永久保存。","**錯誤**：十年是勞工健康保護規則附表十特殊健檢紀錄的保存年限，醫療法病歷不是十年。","**錯誤**：一般病歷不是十五年也不是永久；醫療法只規定人體試驗之病歷永久保存，其餘七年。"],"explanation":"本題考醫療法第 70 條病歷保存的三個層次。一般病歷：至少保存七年；未成年者：至少保存至其成年後七年（成年為 18 歲，即至少保存到 25 歲）；人體試驗之病歷：永久保存。醫療機構因故未能繼續開業時，病歷交由承接者依規定保存，無承接者時病人或代理人得要求交付，其餘病歷應繼續保存六個月以上始得銷燬；具正當理由無法保存者由地方主管機關保存；逾期銷燬應確保內容無洩漏之虞。勞工健檢相關的年限對照：認可醫療機構辦理勞工健檢之檢查紀錄依認可辦法第 17 條第 2 項準用勞工健康保護規則（一般 7 年、特殊 10 年、特定作業 30 年）；認可機構品質管理文件 3 年。「7 年」同時是病歷與一般健檢紀錄的年限，記憶上可以綁在一起。","dispute":"","review":{"key_points":["病歷至少 ==7 年==；未成年者至 ==成年後 7 年==；人體試驗病歷 ==永久==","歇業無承接者：其餘病歷續存 6 個月以上始得銷燬","勞工健檢紀錄：一般 7 年、特殊 10 年、特定作業 30 年","認可機構品質管理文件 3 年"],"refs":[{"src":"醫療法","file":"_ref/醫療法.txt","quote":"並至少保存七年。但未成年者之病歷，至少應保存至其成年後七年；人體試驗之病歷，應永久保存。"},{"src":"醫療法","file":"_ref/醫療法.txt","quote":"其餘病歷應繼續保存六個月以上，始得銷燬"}],"note_ref":"三、醫療法：病歷保存"}},{"qid":"c04q03","q":"依醫師法，醫師歇業或停業時，應自事實發生之日起多久內報請原發執業執照機關備查？","options":["七日內","十五日內","三十日內","六十日內"],"answer":2,"recon":"full","src":["114-05"],"optexp":["**錯誤**：七日不是醫師法的報備期限；環測辦法有「監測後七日內通報計畫」的特殊規定，不要混淆。","**錯誤**：十五日不是醫師法的數字；勞基法職災死亡補償是死亡後十五日內給付。","**正確（本題答案）**：醫師法第 10 條第 1 項：醫師歇業或停業時，應自事實發生之日起三十日內報請原發執業執照機關備查。114-05 回憶：「一個月內」。","**錯誤**：六十日不是醫師法的數字；醫師法第 10 條的期限只有三十日（報備）與一年（停業上限）。"],"explanation":"本題考醫師法第 10 條停業與歇業的規定。歇業或停業：自事實發生之日起 30 日內報請原發執業執照機關備查；停業期間以一年為限，停業逾一年者應於屆至日次日起 30 日內辦理歇業，未辦者原執業執照失其效力並由原發機關註銷；變更執業處所或復業者準用第 8 條第 1 項執業登記規定；醫師死亡由原發機關註銷執業執照。違反第 10 條第 1 項處 2 萬至 10 萬元罰鍰並限期改善。「30 日」在其他法規也常見：認可辦法第 13 條認可醫療機構有停止業務等情形應於事實發生後 30 日內申請。與第 8 條的「六年、六個月」、第 8 條之 1 的「未滿一年」一起記成醫師法的數字組。","dispute":"","review":{"key_points":["歇業或停業：事實發生之日起 ==30 日內== 報備","停業以 ==1 年== 為限；逾 1 年應於屆至日次日起 30 日內辦理歇業，否則執照失效註銷","變更執業處所或復業準用執業登記規定","違反：罰鍰 2 萬至 10 萬元"],"refs":[{"src":"醫師法","file":"_ref/醫師法.txt","quote":"醫師歇業或停業時，應自事實發生之日起三十日內報請原發執業執照機關備查。"},{"src":"醫師法","file":"_ref/醫師法.txt","quote":"前項停業期間，以一年為限"}],"note_ref":"一、醫師法：執業執照、執業處所與停歇業"}},{"qid":"c04q04","q":"下列有關醫事法規之敘述，何者正確？","options":["受廢止醫師證書處分者，得於一年後申請恢復補發","持有美國醫師證書者，通過我國醫師考試後，不須經 PGY 訓練即可在台執行醫療業務","西醫師同時具中醫師資格者，可在同一地點同時登記執行西醫與中醫業務","醫師可指示醫事放射師為病人施予靜脈注射顯影劑"],"answer":3,"recon":"full","src":["113-3","113-4","113-11","114-04"],"optexp":["**錯誤**：醫師法第 8 條之 1 第 1 款：經撤銷或廢止醫師證書者不得發給執業執照，沒有「一年後恢復」的規定；「未滿一年不得發給」只適用於廢止「執業執照」（第 2 款）。","**錯誤**：持外國醫師證書或學歷者仍須依第 4 條之 1 經教育部學歷甄試（或符合免甄試條件）後參加我國醫師考試，並取得指定教學醫院臨床實作適應訓練期滿成績及格證明，之後同樣要完成 PGY 訓練，不能直接執業。","**錯誤**：具醫師、中醫師等多重資格者，其執業依第 4 條之 2 授權的辦法辦理，實務上只能擇一資格辦理執業登記，不能同時登記執行西醫與中醫業務（113-3、115-01 回憶）。","**正確（本題答案）**：醫事放射師法第 12 條：放射線診斷之特殊攝影及造影屬放射師業務，執行第 3 至 8 款業務應配合醫師行之；顯影劑注射為造影之一環，得於醫師指示下由放射師執行。"],"explanation":"本題把四個醫事法規的常見迷思放在一起。(1) 證書與執照的差別：醫師法第 8 條之 1 規定經撤銷或廢止「醫師證書」者不得發給執業執照，等於永久喪失執業資格；經廢止「執業執照」未滿一年者不得發給，滿一年可重新申請；另有客觀事實認不能執行業務者，原因消失後仍得申請。(2) 外國學歷或證書：依第 4 條之 1，國外學歷者原則上須先經教育部學歷甄試（在美、日、歐、加等指定國家或地區修畢全程學業且符合條件者免甄試），通過醫師考試後須取得指定教學醫院臨床實作適應訓練期滿成績及格證明；外國人依第 41 條之 3 應考試及格並經中央主管機關許可始得執業。(3) 多重醫事人員資格：第 4 條之 2 授權訂定執業辦法，兼具中西醫資格者只能擇一登記執業。(4) 醫事放射師業務（放射師法第 12 條）：一般攝影與核醫體外檢查依醫師會檢單為之；特殊攝影及造影、放射治療、核醫造影與治療、磁振造影等應配合醫師行之；顯影劑靜脈注射在醫師指示下由放射師執行。","dispute":"","review":{"key_points":["==廢止醫師證書＝永久==不得發執業執照；==廢止執業執照未滿 1 年==不得發給","外國學歷：教育部甄試（指定國家免）→醫師考試→臨床實作適應訓練→PGY","兼具中西醫資格：擇一辦理執業登記","放射師：特殊攝影及造影應配合醫師行之；顯影劑注射可在醫師指示下執行"],"refs":[{"src":"醫師法","file":"_ref/醫師法.txt","quote":"一、經撤銷或廢止醫師證書。二、經廢止醫師執業執照，未滿一年。"},{"src":"醫事放射師法","file":"_ref/醫事放射師法.txt","quote":"執行前項第三款至第八款業務，應配合醫師行之"},{"src":"醫師法","file":"_ref/醫師法.txt","quote":"應取得中央主管機關指定之教學醫院臨床實作適應訓練期滿成績及格證明文件"}],"note_ref":"一、醫師法：執業執照、執業處所與停歇業"}},{"qid":"c04q05","q":"下列有關醫師執業之敘述，何者錯誤？","options":["經廢止醫師執業執照未滿一年者，不得發給執業執照","西醫師或牙醫師經核可之針灸訓練結業者，得執行針灸業務","持外國醫師證書者，須通過我國醫師國家考試並完成臨床實作訓練，始得在台執業","經撤銷或廢止醫師證書者，得於一年後申請重新發給"],"answer":3,"recon":"partial","src":["113-6"],"optexp":["**正確**：醫師法第 8 條之 1 第 2 款：經廢止醫師執業執照未滿一年者，不得發給執業執照；已領者撤銷或廢止之。","**正確**：依衛生主管機關函釋，西醫師或牙醫師經核可之針灸訓練班（如臺北榮總、中國醫藥學院針灸訓練班）結業者，得執行針灸業務；113-6 回憶列為正確敘述。","**正確**：持外國醫師證書者仍須通過我國醫師考試（第 4 條之 1，國外學歷者另須學歷甄試或符合免甄試條件），並取得指定教學醫院臨床實作適應訓練期滿成績及格證明，始得在台執業。","**錯誤（本題答案）**：第 8 條之 1 第 1 款：經撤銷或廢止醫師證書者不得發給執業執照，沒有一年後重新發給的規定；113-6 回憶：「醫師證書被吊銷，一年後可以申請重發」為錯誤。"],"explanation":"本題與前一題互為對照，核心是「執業執照」與「醫師證書」兩種處分的後果不同。醫師證書：由中央主管機關依醫師考試及格核發，是資格；經撤銷或廢止者依第 8 條之 1 第 1 款永久不得發給執業執照，回憶版說法「醫師證書被廢止，這輩子跟醫生職業無緣了」。執業執照：由執業所在地直轄市、縣（市）主管機關核發，是執業許可；經廢止未滿一年不得發給，滿一年後可重新申請。第 28 條之 4 的處分階梯就是：罰鍰 10 萬至 50 萬→限制執業範圍、停業一個月至一年→廢止執業執照→情節重大者廢止醫師證書；第 25 條之 1 懲戒方式亦由警告、額外繼續教育、限制執業範圍或停業一個月至一年、廢止執業執照、到廢止醫師證書。針灸業務：中醫師的醫療業務，西醫師或牙醫師經衛生主管機關核可之針灸訓練結業者得執行，是函釋而非醫師法條文。外國證書者的執業路徑見前一題。","dispute":"","review":{"key_points":["撤銷或廢止==醫師證書==→不得發執業執照（永久）","廢止==執業執照==→未滿 1 年不得發給，滿 1 年可再申請","處分階梯：罰鍰→限制執業範圍／停業 1 個月–1 年→廢止執業執照→情節重大廢止證書","西醫師／牙醫師經核可針灸訓練結業得執行針灸（函釋）"],"refs":[{"src":"醫師法","file":"_ref/醫師法.txt","quote":"有下列情形之一者，不得發給執業執照；已領者，撤銷或廢止之："},{"src":"醫師法","file":"_ref/醫師法.txt","quote":"二、經廢止醫師執業執照，未滿一年。"},{"src":"醫師法","file":"_ref/醫師法.txt","quote":"五、廢止醫師證書。"}],"note_ref":"一、醫師法：執業執照、執業處所與停歇業"}},{"qid":"c04q06","q":"下列何者不是醫師法所定得廢止醫師執業執照或醫師證書之事由？","options":["將醫師證書、專科醫師證書租借他人使用","出具與事實不符之診斷書、死亡證明書","執行中央主管機關規定不得執行之醫療行為","婚外情被配偶提告"],"answer":3,"recon":"partial","src":["114-02"],"optexp":["**是法定事由**：醫師法第 28 條之 4 第 4 款：將醫師證書、專科醫師證書租借他人使用。","**是法定事由**：第 28 條之 4 第 5 款：出具與事實不符之診斷書、出生證明書、死亡證明書或死產證明書。","**是法定事由**：第 28 條之 4 第 1 款：執行中央主管機關規定不得執行之醫療行為（如未成年人非醫療必要之美容手術）。","**不是法定事由（本題答案）**：婚外情屬私德與民事問題，不在第 28 條之 4 五款之列，也不是第 25 條懲戒事由所稱「業務上」不正當行為。114-02 回憶：「(D) 婚外情被抓」為非。"],"explanation":"本題考醫師法第 28 條之 4 的五款重罰事由。條文：醫師有下列情事之一者，處新臺幣 10 萬元以上 50 萬元以下罰鍰，得併處限制執業範圍、停業處分一個月以上一年以下或廢止其執業執照；情節重大者並得廢止其醫師證書：(1) 執行中央主管機關規定不得執行之醫療行為；(2) 使用中央主管機關規定禁止使用之藥物；(3) 聘僱或容留違反第 28 條規定之人員（密醫）執行醫療業務；(4) 將醫師證書、專科醫師證書租借他人使用；(5) 出具與事實不符之診斷書、出生證明書、死亡證明書或死產證明書。與第 25 條懲戒事由區分：業務上重大或重複過失、利用業務機會之犯罪經判刑確定、非醫療必要之過度用藥或治療、執行業務違背醫學倫理、其他業務上不正當行為——都以「業務」為前提，由醫師公會或主管機關移付懲戒委員會處理。純粹私德（婚外情）不在兩者之內。勞工健檢醫師最相關的是第 5 款：健檢報告與診斷書不實即屬此款。","dispute":"","review":{"key_points":["第 28 條之 4 五款：==不得執行之醫療行為、禁用藥物、容留密醫、租借證書、不實證明書==","處分：罰鍰 ==10–50 萬==＋限制執業範圍／停業 1 個月–1 年／廢止執業執照；情節重大廢止醫師證書","第 25 條懲戒事由以「業務上」為前提；私德（婚外情）不在內","健檢報告不實＝出具不實證明書"],"refs":[{"src":"醫師法","file":"_ref/醫師法.txt","quote":"四、將醫師證書、專科醫師證書租借他人使用。五、出具與事實不符之診斷書、出生證明書、死亡證明書或死產證明書。"},{"src":"醫師法","file":"_ref/醫師法.txt","quote":"情節重大者，並得廢止其醫師證書"}],"note_ref":"二、醫師法的處罰與廢止事由"}},{"qid":"c04q07","q":"依衛生福利部公告，醫師對未滿十八歲之未成年人，下列何項非為醫療必要之美容手術得經法定代理人同意後施作？","options":["眼部整形（割雙眼皮）","抽脂","削骨、拉皮","以上皆不得施作"],"answer":3,"recon":"rebuilt","src":["115-01"],"optexp":["**不得施作**：眼部整形（割雙眼皮）在衛福部公告的未成年人不得施作之非醫療必要美容手術清單內。","**不得施作**：抽脂亦在公告清單內，屬非醫療必要的美容手術，未滿 18 歲不得施作。","**不得施作**：削骨、拉皮也在公告清單內（另含臉部削骨、顱顏重整、鼻部整形、植髮、胸部整形），同樣不得對未成年人施作。","**正確（本題答案）**：依衛福部公告，醫師對未滿 18 歲之未成年人施作非醫療必要之美容手術（眼部、鼻部整形、植髮、抽脂、削骨、顱顏重整、拉皮、胸部整形）屬醫師法第 28 條之 4 第 1 款不得執行之醫療行為，法定代理人同意亦不得施作。"],"explanation":"本題考醫師法第 28 條之 4 第 1 款「中央主管機關規定不得執行之醫療行為」的具體公告內容。衛福部於 2014 年公告：醫師對未滿十八歲之未成年人施作非為醫療必要之美容手術，包括眼部整形、鼻部整形、植髮、抽脂、削骨、臉部削骨、顱顏重整、拉皮、胸部整形（縮乳及隆乳），為醫師法第 28 條之 4 第 1 款所稱不得執行之醫療行為；重點是「家長同意也不行」，因為這是對醫師的禁止規定，不是同意權的問題。違反者處 10 萬至 50 萬元罰鍰，得併處限制執業範圍、停業一個月至一年或廢止執業執照，情節重大廢止醫師證書。115-01 回憶：「考醫療法何者錯誤：考點為未成年不得施行之醫美項目」。醫療必要的手術（如唇顎裂、外傷重建、乳房腫瘤切除後重建）不受此限，判斷關鍵在「非醫療必要」。本題所依公告不在 _ref 法規檔內，選項為重建。","dispute":"115-01 回憶只記得考點為「未成年人不得施行之醫美項目」，選項為依衛福部公告重建；公告本文不在 _ref 檔案內，無法逐字引用，答案依公告內容（家長同意亦不得施作）定為 D。","review":{"key_points":["未滿 18 歲==非醫療必要美容手術一律不得施作==，法定代理人同意亦不可","清單：眼部整形、鼻部整形、植髮、抽脂、削骨、顱顏重整、拉皮、胸部整形（縮乳及隆乳）","法源：醫師法第 28 條之 4 第 1 款＋衛福部公告；罰鍰 10–50 萬","醫療必要之重建手術不在此限"],"refs":[{"src":"醫師法","file":"_ref/醫師法.txt","quote":"一、執行中央主管機關規定不得執行之醫療行為。"}],"note_ref":"二、醫師法的處罰與廢止事由"}},{"qid":"c04q08","q":"下列何者不是職業病診斷（認定）之五大準則？","options":["有明確的疾病證據","有職業暴露的證據","符合時序性，且符合人類流行病學已知的證據","勞工主觀認為疾病與工作有關"],"answer":3,"recon":"rebuilt","src":["113-9","整理-表格"],"optexp":["**是準則**：職業病認定第一準則：有明確的疾病證據，即臨床上確診（含病理、影像、實驗室證據）。","**是準則**：第二準則：有職業暴露的證據，包括職業史、環測、生物偵測等客觀資料。","**是準則**：第三準則符合時序性（暴露在前、發病在後，且潛伏期合理）與第四準則符合人類流行病學已知的證據，兩者都是五準則之一。","**不是準則（本題答案）**：五準則要求的是客觀證據，勞工的主觀認知不是準則；第五準則是「排除其他可能致病因子」。113-9 回憶：「要有客觀的證據（非主觀）」。"],"explanation":"本題考職業病診斷（認定）的五大準則：(1) 有明確的疾病證據；(2) 有職業暴露的證據；(3) 符合時序性；(4) 符合人類流行病學已知的證據；(5) 排除其他可能致病因子（或工作以外因素的貢獻度較小）。這五項貫穿職安署各認定參考指引：例如苯中毒指引要求具苯暴露史及時序性，腰椎椎間盤突出指引列「適當的時序性」，過勞指引要求目標疾病加工作負荷加排除其他原因。實務判斷用「貢獻度」概念：鑑定作業實施辦法第 10 條規定職業病為職業造成此疾病之因果關係可能性或貢獻程度大於 50%；腦心血管與精神疾病則以「工作相關疾病」分類，工作僅為多種致病因素之一。勞工主觀認為與工作有關只是就醫或申請鑑定的起點，不是認定準則；反之，客觀證據齊備時即使勞工未主張，醫師仍可診斷職業病。與健康管理四級的關係：第四級管理（異常且與工作有關）通常表示前四項準則已初步成立，但正式認定仍走災保法程序。","dispute":"","review":{"key_points":["五準則：==疾病證據、暴露證據、時序性、流行病學證據、排除其他因子==","全部是客觀證據；勞工主觀認知不是準則","鑑定門檻：職業因素貢獻度 ==>50%==","第四級管理≠正式職業病認定"],"refs":[{"src":"勞工職業災害保險職業病鑑定作業實施辦法","file":"_ref/勞工職業災害保險職業病鑑定作業實施辦法.txt","quote":"前二項所定職業病，為職業造成此疾病之因果關係可能性或貢獻程度大於百分之五十者。"}],"note_ref":"五、職業病認定準則與鑑定制度"}},{"qid":"c04q09","q":"職業病認定時，若職業暴露對疾病之貢獻度達多少以上，即可認定疾病與職業有相當因果關係？","options":["10%","30%","50%","80%"],"answer":2,"recon":"full","src":["114-01","115-02"],"optexp":["**錯誤**：10% 不是任何認定門檻；貢獻度只有 10% 時多屬「工作僅為次要因素」，不足以認定。","**錯誤**：30% 未達過半，不符「較可能是（more probable than not）」的因果標準。","**正確（本題答案）**：鑑定作業實施辦法第 10 條第 3 項：職業病為職業造成此疾病之因果關係可能性或貢獻程度大於 50%；過勞指引亦以「工作負荷對惡化促發之貢獻度大於 50%」為認定條件。114-01：50%；115-02：0.5。","**錯誤**：80% 是過勞指引「發病前 2 至 6 個月月平均加班超過 80 小時」的數字，不是貢獻度門檻。"],"explanation":"本題考職業病因果關係的量化門檻。勞工職業災害保險職業病鑑定作業實施辦法第 10 條：鑑定結果分為職業病或非職業病（職業病種類表所列疾病）、工作相關疾病或非工作相關疾病（腦血管與心臟疾病及精神疾病）；其他疾病有科學證據證明與工作暴露有關者得鑑定為職業病或工作相關疾病；所定職業病為「職業造成此疾病之因果關係可能性或貢獻程度大於百分之五十」；工作相關疾病則是具有多種致病因素、工作僅為其一，與其他危害因子共同作用。過勞指引也用同一標準：非目標疾病若能證實工作負荷對惡化促發之貢獻度大於 50%，仍以職業疾病處置。這個「大於 50%」對應英美法的 more probable than not（優勢證據），也是流行病學上相對風險大於 2（歸因分率超過 50%）的概念。114-01 回憶：「證據貢獻達多少即認定其相關性？50%」；115-02：「0.5」。","dispute":"","review":{"key_points":["職業病＝職業因素==貢獻度 >50%==（鑑定辦法第 10 條）","職業病種類表疾病→職業病／非職業病；腦心血管與精神→工作相關／非工作相關疾病","工作相關疾病＝多因子、工作僅為其一",">50% ≈ more probable than not ≈ 相對風險 >2"],"refs":[{"src":"勞工職業災害保險職業病鑑定作業實施辦法","file":"_ref/勞工職業災害保險職業病鑑定作業實施辦法.txt","quote":"前二項所定職業病，為職業造成此疾病之因果關係可能性或貢獻程度大於百分之五十者。"},{"src":"過勞腦心血管","file":"_ref/認定指引/過勞腦心血管.txt","quote":"對惡化促發之貢獻度大於 50%"},{"src":"勞工職業災害保險職業病鑑定作業實施辦法","file":"_ref/勞工職業災害保險職業病鑑定作業實施辦法.txt","quote":"二、屬腦血管與心臟疾病及精神疾病：分為工作相關疾病或非工作相關疾病。"}],"note_ref":"五、職業病認定準則與鑑定制度"}},{"qid":"c04q10","q":"雇主對勞工實施體格檢查、一般健康檢查與特殊健康檢查之法源依據為何？","options":["勞動基準法","職業安全衛生法","職業災害勞工保護法","勞工保險條例"],"answer":1,"recon":"rebuilt","src":["113-3","113-10","114-03","114-04"],"optexp":["**錯誤**：勞動基準法規範工資、工時、職災補償（第 59 條）等，不是健康檢查的法源。","**正確（本題答案）**：職業安全衛生法第 20 條規定雇主僱用時應施行體格檢查、對在職勞工應施行一般健康檢查與特殊健康檢查；第 21 條規範檢查後的配工與健康管理；勞工健康保護規則即依第 20 條第 3 項、第 21 條第 3 項等訂定。","**錯誤**：職業災害勞工保護法是職災勞工的補助與保護法規，主要內容已於 111 年 5 月 1 日由勞工職業災害保險及保護法承接，與雇主健檢義務無關。","**錯誤**：勞工保險條例規範勞保給付；職災保險部分已移入災保法，都不是雇主實施健檢的依據。"],"explanation":"本題考勞工健康檢查制度的法源層級。母法是職業安全衛生法：第 20 條第 1 項——雇主於僱用勞工時應施行體格檢查，對在職勞工應施行一般健康檢查、從事特別危害健康作業者之特殊健康檢查、經中央主管機關指定為特定對象及特定項目之健康檢查；第 2 項——由認可醫療機構之醫師為之，雇主保存紀錄並負擔費用；第 3 項授權訂定勞工健康保護規則（檢查對象、項目、期間、分級、紀錄保存）；第 5 項授權訂定認可辦法。勞工健康保護規則第 1 條寫明依職安法第 6 條第 3 項、第 20 條第 3 項、第 21 條第 3 項及第 22 條第 4 項訂定；分級管理指引序言也開宗明義依職安法。第 21 條是檢查後的配工義務與健康檢查手冊。相對地，職業病的認定與給付走另一條線：勞工職業災害保險及保護法（災保法）。回憶版另一題「職業病的法規」選項為職災勞工保護法與災保法，答災保法。","dispute":"","review":{"key_points":["健檢法源：==職業安全衛生法第 20、21 條==→勞工健康保護規則、認可辦法","第 20 條：體格檢查＋一般健檢＋特殊健檢＋指定項目；認可機構醫師、雇主付費保存","職業病給付與鑑定：勞工職業災害保險及保護法","勞基法：職災補償（第 59 條）"],"refs":[{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"雇主於僱用勞工時，應施行體格檢查；對在職勞工應施行下列健康檢查："},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"本規則依職業安全衛生法（以下簡稱本法）第六條第三項、第二十條第三項、第二十一條第三項及第二十二條第四項規定訂定之。"}],"note_ref":"四、健康檢查與職災保護的法源"}},{"qid":"c04q11","q":"現行有關職業災害保險給付、職業病認定與鑑定、職災勞工保護之主要法律為何？","options":["職業災害勞工保護法","勞工職業災害保險及保護法","勞工保險條例","職業安全衛生法"],"answer":1,"recon":"partial","src":["113-3","113-10","114-04"],"optexp":["**錯誤**：職業災害勞工保護法（91 年施行）是舊制的補助法規，其主要功能自 111 年 5 月 1 日起由災保法整併承接，已不是現行主要法律。","**正確（本題答案）**：勞工職業災害保險及保護法自 111 年 5 月 1 日施行，整合勞保條例的職災保險與職災勞工保護法，涵蓋保險給付、職業病鑑定（第 75 條）、預防職業病健康檢查（第 63 條）、職災勞工重建與保護。","**錯誤**：勞工保險條例的職業災害保險部分已移出，現行職災保險給付依災保法。","**錯誤**：職業安全衛生法是預防端的法規（雇主安全衛生義務、健康檢查），不處理職災保險給付與職業病鑑定。"],"explanation":"本題考現行職災法制的架構。111 年 5 月 1 日施行的勞工職業災害保險及保護法（災保法），把原本分散在勞工保險條例（職災保險給付）與職業災害勞工保護法（職災勞工補助、重建）的規定整合為單一法律：保險給付（醫療、傷病、失能、死亡、失蹤）、第 42 條傷病給付自不能工作之第四日起、第 63 條預防職業病健康檢查與健康追蹤檢查、第 73 條職業傷病診治整合性服務之認可醫療機構、第 75 條職業病鑑定（保險人審核給付認有必要或被保險人經認可醫療機構職醫診斷後爭議時，向中央主管機關申請鑑定）。職業病鑑定作業實施辦法即依災保法第 75 條第 4 項訂定，同日施行。所以「職業病的法規」現行答案是災保法，回憶版：「兩個法規都有關，當然後者較新」。整理者 note 寫「災保法第 73 條」，實際鑑定條文是第 75 條，第 73 條是認可醫療機構。職安法則是預防端：雇主的安全衛生設施、健康檢查、母性保護。","dispute":"整理者 note 寫職業病鑑定依「災保法第 73 條」；核對原文，災保法第 73 條是職業傷病診治整合性服務認可醫療機構的規定，職業病鑑定是第 75 條，鑑定作業實施辦法第 1 條亦載明依第 75 條第 4 項訂定。本題答案不受影響。","review":{"key_points":["==災保法 111.5.1 施行==，整併勞保條例職災保險＋職災勞工保護法","災保法：第 42 條傷病給付、第 63 條預防職業病健檢、第 73 條認可醫療機構、==第 75 條職業病鑑定==","鑑定作業實施辦法依災保法第 75 條第 4 項訂定，111.5.1 施行","職安法＝預防端；災保法＝補償與鑑定端"],"refs":[{"src":"勞工職業災害保險及保護法","file":"_ref/勞工職業災害保險及保護法.txt","quote":"為保障遭遇職業災害勞工及其家屬之生活，加強職業災害預防及職業災害勞工重建"},{"src":"勞工職業災害保險及保護法","file":"_ref/勞工職業災害保險及保護法.txt","quote":"保險人於審核職業病給付案件認有必要時，得向中央主管機關申請職業病鑑定。"},{"src":"勞工職業災害保險職業病鑑定作業實施辦法","file":"_ref/勞工職業災害保險職業病鑑定作業實施辦法.txt","quote":"本辦法自中華民國一百十一年五月一日施行。"}],"note_ref":"四、健康檢查與職災保護的法源"}},{"qid":"c04q12","q":"有關職業病鑑定制度，下列敘述何者錯誤？","options":["職業病鑑定委員由職業醫學科專科醫師、相關醫學專科醫師、職業安全衛生專家及法律專家組成","保險人於審核職業病給付案件認有必要時，得向中央主管機關申請鑑定","書面鑑定未達相同意見三分之二者，召開分組（共同）鑑定會鑑定","被保險人罹患精神疾病者，一律不得視為職業病"],"answer":3,"recon":"rebuilt","src":["整理-表格"],"optexp":["**正確**：鑑定作業實施辦法第 7 條：分組鑑定會委員九人，由中央主管機關指派機關代表一人為召集人，並遴聘職業醫學科專科醫師五人、相關醫學專科醫師一人、職業安全衛生專家一人、法律專家一人。","**正確**：災保法第 75 條第 1 項：保險人於審核職業病給付案件認有必要時，得向中央主管機關申請職業病鑑定；第 2 項被保險人經認可醫療機構職醫診斷職業病而有爭議時，得請保險人逕向中央主管機關申請。","**正確**：第 8 條：先送委員書面鑑定，以 14 日為原則，委員意見相同者三分之二以上決定之；未能作成時由召集人召集鑑定會開會鑑定（三分之二以上委員出席、職醫至少三人、出席委員過半數）；仍無法作成時依第 9 條召集全數委員 27 人共同鑑定。","**錯誤（本題答案）**：第 10 條第 1 項第 2 款：腦血管與心臟疾病及精神疾病分為「工作相關疾病或非工作相關疾病」；精神疾病與執行職務有相當因果關係者可認定，並有工作相關心理壓力事件引起精神疾病認定參考指引，不是一律排除。"],"explanation":"本題考勞工職業災害保險職業病鑑定作業實施辦法的流程與組成。受理範圍（第 2 條）：保險人審核職業病給付案件認有必要（審核有困難、行政救濟撤銷後重核），或被保險人依災保法第 75 條第 2 項申請。專家名冊（第 5 條）：由勞工團體、雇主團體、職安衛、職業醫學及相關醫學團體推薦，須有職業醫學、職安衛或勞動法專業且五年以上教學或實務經驗。分組（第 6 條）：第一組化學／物理／生物性危害、呼吸系統、皮膚、職業性癌症；第二組肌肉骨骼疾病；第三組腦血管與心臟疾病及精神疾病。組成（第 7 條）：九人＝機關代表召集人 1＋職醫 5＋相關醫學專科 1＋職安衛專家 1＋法律專家 1，任期二年，任一性別不少於三分之一。程序（第 8、9 條）：書面鑑定 14 日為原則，三分之二以上相同意見決定；否則召集開會，三分之二以上出席、職醫至少三人、出席過半數決定；再不成則召集全數委員 27 人，過半數出席、出席職醫超過半數、出席過半數決定。結果（第 10 條）：職業病種類表疾病→職業病／非職業病；腦心血管與精神疾病→工作相關／非工作相關；職業病須貢獻度大於 50%。現場調查（第 11 條）由勞動檢查機構會同職災預防及重建中心。","dispute":"","review":{"key_points":["分組鑑定會 ==9 人==：召集人 1＋==職醫 5==＋相關專科 1＋職安衛 1＋法律 1；三組（化學物理生物與癌症／肌肉骨骼／腦心血管與精神）","書面鑑定 14 日、==2/3 相同意見==決定→開會（2/3 出席、職醫≥3、過半數）→全數委員 27 人共同鑑定","腦心血管與精神疾病→工作相關疾病／非工作相關疾病，不是一律排除","申請人＝保險人；同一事由曾鑑定者原則不得再申請"],"refs":[{"src":"勞工職業災害保險職業病鑑定作業實施辦法","file":"_ref/勞工職業災害保險職業病鑑定作業實施辦法.txt","quote":"一、職業醫學科專科醫師五人。二、相關醫學專科醫師一人。三、職業安全衛生專家一人。四、法律專家一人。"},{"src":"勞工職業災害保險職業病鑑定作業實施辦法","file":"_ref/勞工職業災害保險職業病鑑定作業實施辦法.txt","quote":"並以委員意見相同者三分之二以上，決定之"},{"src":"勞工職業災害保險職業病鑑定作業實施辦法","file":"_ref/勞工職業災害保險職業病鑑定作業實施辦法.txt","quote":"召集全數委員二十七人共同開會鑑定之"}],"note_ref":"五、職業病認定準則與鑑定制度"}},{"qid":"c04q13","q":"依職業促發腦血管及心臟疾病（外傷導致者除外）之認定參考指引，下列敘述何者正確？","options":["須於發病前兩週內發生異常重大事件才可認定","須發病前一個月加班達 90 小時才可認定為長期工作過重","目標疾病包括腦出血、腦梗塞、蜘蛛膜下腔出血、心肌梗塞、主動脈剝離、嚴重心律不整等","猛爆性肝炎亦屬過勞之目標疾病"],"answer":2,"recon":"full","src":["113-12","114-04","114-05","115-02"],"optexp":["**錯誤**：異常事件評估的是發病前 24 小時內；短期工作過重約 1 週、長期工作過重 6 個月。「兩週」不是指引的時間框架，且三種負荷任一成立即可，不是非要異常事件。114-04 回憶：「x 異常 24hr 短期 7D 長期 6M」。","**錯誤**：極強相關性的門檻是發病前 1 個月加班超過 100 小時，或發病前 2 至 6 個月任一期間月平均加班超過 80 小時；90 小時不是指引數字，且加班只是長期工作過重的評估項目之一，不是唯一條件。","**正確（本題答案）**：指引目標疾病：腦血管疾病（腦出血、腦梗塞、蜘蛛膜下腔出血、高血壓性腦病變）與心臟疾病（心肌梗塞、急性心臟衰竭、主動脈剝離、狹心症、嚴重心律不整、心臟停止、心因性猝死）。","**錯誤**：猛爆性肝炎不是腦血管或心臟疾病，不在目標疾病之列；非目標疾病須另依解剖報告證實工作負荷貢獻度大於 50% 才以職業疾病處置。"],"explanation":"本題考職業促發腦血管及心臟疾病（外傷導致者除外）認定參考指引（107.10.15 第四次修正）的三組數字。目標疾病：腦血管疾病—腦出血、腦梗塞、蜘蛛膜下腔出血、高血壓性腦病變；心臟疾病—心肌梗塞、急性心臟衰竭、主動脈剝離、狹心症、嚴重心律不整、心臟停止、心因性猝死。工作負荷評估三段：異常事件—發病前 24 小時內的精神負荷、身體負荷或工作環境變化事件；短期工作過重—發病前約 1 週內特別過重的工作（含發病當日至前一天的長時間勞動、常態性長時間勞動、不規律工作、長工時、出差、輪班夜班、異常溫度噪音時差、精神緊張）；長期工作過重—發病前 6 個月內因長時間勞動造成明顯疲勞累積，加班時數以每週 40 小時、每月 176 小時以外計算：發病前 1 個月加班超過 100 小時，或發病前 2 至 6 個月任一期間月平均加班超過 80 小時→極強相關性；各月皆小於 45 小時→相關性薄弱；超過 45 小時隨時數增加而增強。罹患目標疾病且符合過重負荷要件者原則上認定為職業疾病；非目標疾病須解剖證實明顯惡化且貢獻度大於 50%。","dispute":"","review":{"key_points":["目標疾病：腦出血、腦梗塞、蜘蛛膜下腔出血、高血壓性腦病變；心肌梗塞、急性心衰竭、主動脈剝離、狹心症、嚴重心律不整、心臟停止、心因性猝死","三段評估：異常事件 ==24 小時==、短期過重 ==1 週==、長期過重 ==6 個月==","極強相關：發病前 1 個月加班 ==>100 小時==，或前 2–6 月任一期間月平均 ==>80 小時==；\u003c45 小時相關性薄弱","加班時數＝每月 176 小時以外之工時（與勞基法延長工時定義不同）"],"refs":[{"src":"過勞腦心血管","file":"_ref/認定指引/過勞腦心血管.txt","quote":"包括腦出血、腦梗塞、蜘蛛膜下腔出血及高血壓性\n腦病變"},{"src":"過勞腦心血管","file":"_ref/認定指引/過勞腦心血管.txt","quote":"發病前 1 個月之加班時數超過 100 小時"},{"src":"過勞腦心血管","file":"_ref/認定指引/過勞腦心血管.txt","quote":"長期工作過重：評估發病前（不包含發病日）6 個月內"}],"note_ref":"六、過勞、精神疾病與 PTSD 認定指引"}},{"qid":"c04q14","q":"依工作相關心理壓力事件引起精神疾病認定參考指引及職業相關之創傷後壓力症候群認定參考指引，下列敘述何者正確？","options":["職業相關創傷後壓力症候群（PTSD）指勞工於執行職務時經歷或目睹威脅生命或身體完整性之創傷事件後所發生之精神疾病","最常見之工作相關精神疾病為思覺失調症、憂鬱症與焦慮症","認定時須於發病前一年內有業務造成之強烈心理壓力事件","任何 ICD-10 所列之精神疾病皆可認定，不限診斷類別"],"answer":0,"recon":"partial","src":["113-4","114-03"],"optexp":["**正確（本題答案）**：職業相關之創傷後壓力症候群認定參考指引：必須在親身經歷或目睹職業相關的身心創傷或重大意外事故發生的前提下評估認定；創傷事件為真正的或具威脅性的死亡、重傷或性暴力，ICD-10 F43.1。","**錯誤**：工作相關精神疾病以 ICD-10 F2 至 F4 為主，過去審查通過的案例幾乎都是 F2 至 F4，其中以 F3 情感性疾患（憂鬱症）及 F4 精神官能症、壓力相關疾患為大宗；思覺失調症不是最常見。","**錯誤**：評估期間是發病前約 6 個月內有無業務造成的強烈心理壓力，不是一年；只有特殊情況可追溯至 1 年以上。","**錯誤**：目標疾病限精神科醫師依 ICD-10 診斷為 F2 至 F9 中任一診斷（以 F2–F4 為主），F0 器質性精神疾病與 F1 物質使用疾患不在範圍。"],"explanation":"本題考兩份精神疾病相關認定指引的要點。工作相關心理壓力事件引起精神疾病認定參考指引（111.9）：目標疾病為精神科醫師出具診斷書註記 ICD-10 F2 至 F9 中任一診斷（以 F2 至 F4 為主），須由精神科醫師追蹤治療 6 個月且至少 6 次門診後出具診斷證明；認定必要條件三項全符合：目標疾病發病；發病前約 6 個月內可認定有業務造成的強烈心理壓力（依附表一特別事件與心理負荷評估表）；不能認定由業務以外的心理壓力或個人因素發病。排除發病前一年內應能造成此次發病之精神病史、明顯家族病史或成癮物質濫用者；病史一年以上無症狀後再發者可當新案。職業相關之創傷後壓力症候群認定參考指引：PTSD（ICD-10 F43.1，勞保職業病種類表第四類 4.1 項）須在親身經歷或目睹職業相關的身心創傷或重大意外事故的前提下，由精神科專科醫師依 DSM-5 要項診斷；常見創傷事件如參與戰爭、災區救援、工作中遭遇暴力或威脅、職業駕駛重大事故。114-03 補充三大類：職業性 PTSD、職業性精神疾病、職業性自殺。","dispute":"","review":{"key_points":["精神疾病目標：ICD-10 ==F2–F9==（以 F2–F4 為主）；F0、F1 排除；精神科追蹤 ==6 個月、≥6 次==門診","評估發病前約 ==6 個月== 內的業務強烈心理壓力；特殊情況可追溯 1 年以上","PTSD＝親身經歷或目睹職業相關創傷／重大意外；F43.1；DSM-5 創傷定義：真正或具威脅性的死亡、重傷、性暴力","最常見：F3 情感性疾患、F4 壓力相關疾患，非思覺失調症"],"refs":[{"src":"PTSD","file":"_ref/認定指引/PTSD.txt","quote":"必須在親身經歷或目睹職業相關的身心創傷或重大意外\n事故發生的前提下"},{"src":"精神疾病","file":"_ref/認定指引/精神疾病.txt","quote":"由精神科醫師追蹤治療 6 個月，且至少 6 次門診後出具診斷證明"},{"src":"精神疾病","file":"_ref/認定指引/精神疾病.txt","quote":"由精神科醫師出具之診斷書註記為 ICD-10 的 F2 至 F9 中任一診"}],"note_ref":"六、過勞、精神疾病與 PTSD 認定指引"}},{"qid":"c04q15","q":"依勞工職業災害保險及保護法，被保險人因執行職務致傷病不能工作、未能取得原有薪資者，職業傷病給付自何時起發給？","options":["自不能工作之第一日起","自不能工作之第四日起","自不能工作之第八日起","自住院之日起"],"answer":1,"recon":"rebuilt","src":["整理-表格"],"optexp":["**錯誤**：傷病給付不是從第一日起算；前三日屬等待期，由雇主依勞基法補償。","**正確（本題答案）**：災保法第 42 條第 1 項：被保險人遭遇職業傷病不能工作、未能取得原有薪資、正在治療中者，自不能工作之日起算第四日起得請領傷病給付。","**錯誤**：第八日不是災保法的規定；普通傷病給付（勞保條例）也是第四日起，沒有八日。","**錯誤**：給付以「不能工作」為要件，不以住院為起算點；門診治療期間符合要件亦可請領。"],"explanation":"本題考災保法第 42 條職業傷病給付的三個數字。起算：自不能工作之日起算第四日起。金額：前二個月按被保險人平均月投保薪資發給，第三個月起按平均月投保薪資 70% 發給（整理表格記為前 60 日全額、超過 60 日 70%），每半個月給付一次。期間：最長以二年為限。其他相關：災保法的職業傷病給付與勞基法第 59 條雇主補償可抵充；離職退保後才診斷出職業病者，不能再申請傷病給付，改依「退保後罹患職業病補助」相關辦法辦理（表格所記）。與健檢醫師相關的是診斷書：傷病給付需醫療機構出具不能工作的診斷證明，出具不實者觸犯醫師法第 28 條之 4 第 5 款。","dispute":"","review":{"key_points":["職業傷病給付自不能工作之日起算 ==第 4 日== 起","前 ==2 個月== 按平均月投保薪資全額；第 3 個月起 ==70%==；每半個月給付一次","最長 ==2 年==","離職退保後才確診職業病：不能請傷病給付，改依退保後罹患職業病補助辦法"],"refs":[{"src":"勞工職業災害保險及保護法","file":"_ref/勞工職業災害保險及保護法.txt","quote":"自不能工作之日起算第四日起，得請領傷病給付"},{"src":"勞工職業災害保險及保護法","file":"_ref/勞工職業災害保險及保護法.txt","quote":"第三個月起按被保險人平均月投保薪資百分之七十發給"},{"src":"勞工職業災害保險及保護法","file":"_ref/勞工職業災害保險及保護法.txt","quote":"最長以二年為限"}],"note_ref":"七、職災給付與補償"}},{"qid":"c04q16","q":"依勞動基準法，勞工遭遇職業災害而死亡時，雇主應給與之補償，下列何者正確？","options":["於死亡後三日內給與五個月平均工資之喪葬費，並於十五日內給與四十個月平均工資之死亡補償","於死亡後十五日內給與五個月平均工資之喪葬費，並於三十日內給與二十個月平均工資之死亡補償","給與六個月平均工資之喪葬費及三十個月平均工資之死亡補償","給與十個月平均工資之死亡補償"],"answer":0,"recon":"rebuilt","src":["整理-表格"],"optexp":["**正確（本題答案）**：勞基法第 59 條第 4 款：勞工遭遇職業傷害或罹患職業病而死亡時，雇主應給與五個月平均工資之喪葬費，並一次給與遺屬四十個月平均工資之死亡補償；施行細則第 33 條定喪葬費於死亡後三日內、死亡補償於死亡後十五日內給付。","**錯誤**：日數與月數都錯：喪葬費是三日內（不是十五日）、死亡補償是十五日內（不是三十日）且為四十個月（不是二十個月）。","**錯誤**：喪葬費是五個月平均工資、死亡補償四十個月，不是六個月與三十個月。","**錯誤**：十個月平均工資不是勞基法的職災死亡補償數字；死亡補償固定為四十個月平均工資，另加五個月喪葬費。"],"explanation":"本題考勞動基準法第 59 條職業災害補償中的死亡補償。第 59 條四款：(1) 醫療費用補償；(2) 醫療中不能工作時按原領工資數額補償，醫療期間屆滿二年仍未痊癒且經審定喪失原有工作能力者，得一次給付四十個月平均工資免除工資補償責任；(3) 失能補償依勞保失能給付標準；(4) 死亡時給與五個月平均工資之喪葬費，並一次給與遺屬四十個月平均工資之死亡補償，遺屬受領順位為配偶及子女、父母、祖父母、孫子女、兄弟姊妹。施行細則第 33 條：喪葬費應於死亡後三日內、死亡補償於死亡後十五日內給付。整理表格記法「☆死亡後 3 日內 5 個月喪葬費；15 日內 40 個月死亡補償」。雇主依勞基法補償與災保法保險給付可互相抵充（第 59 條但書、第 60 條）。勞基法與其施行細則不在 _ref 檔案內，本題依整理表格與條文內容撰寫。","dispute":"","review":{"key_points":["職災死亡：==5 個月==平均工資喪葬費（死亡後 ==3 日內==）＋==40 個月==平均工資死亡補償（==15 日內==）","醫療期間工資補償；屆滿 2 年未痊癒喪失工作能力者一次給 40 個月免除責任","遺屬順位：配偶及子女→父母→祖父母→孫子女→兄弟姊妹","雇主補償與災保法給付得抵充"],"refs":[],"note_ref":"七、職災給付與補償"}}]},{"idx":4,"order":4,"title":"噪音與聽力","group":"物理性危害","gi":1,"notes_md":"本章每回考 4–6 題，是各章最穩定的得分區：法規三門檻（80／85／90 dB）、容許暴露時間與劑量計算、聽力圖判讀（三分法 25 dB、凹陷 10 dB、對稱 10 dB）、聽力室背景噪音表與檢查前 14 小時休息，幾乎每回都出現。\n\n## 一、噪音法規三門檻與容許暴露時間（設施規則第 300 條）\n\n- ==80 dB==：計算八小時日時量平均時才納入（每增 5 dB 容許時間減半）；也是檢查前 14 小時不得暴露的環境噪音水準。\n- ==85 dB 或暴露劑量 50%==：雇主應使勞工戴用**有效之**耳塞、耳罩（第 300 條第 1 款後段）。同一數字也是特別危害健康作業「噪音作業」的定義（八小時日時量平均 85 分貝以上）、環測辦法每 6 個月監測噪音一次的門檻、第 300 條之 1 聽力保護措施的門檻。\n- ==90 dB==：機械設備聲音超過 90 分貝應採工程控制、減少暴露時間；噪音超過 90 分貝之工作場所應標示並公告噪音危害預防事項。\n- 任何時間不得暴露於峰值超過 ==140 dB 之衝擊性噪音==或 ==115 dB 之連續性噪音==（>140 dB 為聲創傷，瞬間撕裂柯氏器與基底膜）。\n- 記法：80 算、85 戴、90 改。\n\n| A 權音壓級 dBA | 90 | 92 | 95 | 97 | 100 | 105 | 110 | 115 |\n|---|---|---|---|---|---|---|---|---|\n| 容許暴露時間（小時） | 8 | 6 | 4 | 3 | 2 | 1 | 1/2 | 1/4 |\n\n- 混合暴露劑量＝Σ（各音壓級暴露時間／該音壓級容許時間），==和大於 1 即超出==。例：90 dB 4 小時＋95 dB 2 小時＝4/8＋2/4＝1.0；課堂例 90 dB 4 小時＋95 dB 3 小時＝4/8＋3/4＝==1.25（超標）==。劑量 50% ⇔ 85 dB，100% ⇔ 90 dB。\n- 〔10/03 課堂〕各國比較：OSHA PEL 90 dBA、聽力保護計畫 85、最大 115、交換率 5 dB；NIOSH REL ==85 dBA==、交換率 ==3 dB==（1998）；台灣 PEL 90、聽力保護 85、最大 140（衝擊）、交換率 5 dB。\n\n## 二、聽力保護計畫與作業環境監測（第 300-1 條、環測辦法）\n\n- 超過 85 dB 或劑量 50% 之工作場所應採六項聽力保護措施：噪音監測及暴露評估、噪音危害控制、防音防護具之選用及佩戴、聽力保護教育訓練、健康檢查及管理、成效評估及改善；執行紀錄==留存三年==。\n- 事業單位勞工人數==達 100 人以上==應訂定聽力保護計畫；未滿 100 人得以執行紀錄或文件代替。\n- 環測：八小時日時量平均 85 分貝以上之作業場所每==六個月==監測噪音一次以上（舊版第 7 條、新版第 5 條相同）。\n- 勞工因外耳炎無法配戴耳塞→暫時停止噪音作業或調離，治癒後再恢復；棉花無防音效果。\n\n## 三、噪音性聽力損失的病理與聽力圖特徵\n\n- 噪音傷害耳蝸毛細胞→漸進、無痛、==兩耳對稱、感覺神經性==聽力損失，毛細胞不再生。\n- 由==高音頻 3000–6000 Hz== 開始：教科書典型 ==4K 凹陷==（4K notch／C5-dip），國內流行病學（吳聰能 1998、陳仲達 2003）以 ==6000 Hz== 最嚴重，故判讀要參考 8000 Hz（100 年修法納入）；8K 回升（up-turn）是與老年性聽損（自 8K 起下坡、無回升）鑑別的關鍵。語言頻率 500–2000 Hz 最晚受累，早期勞工不自覺。\n- 病程：誘導期約半年以上；多在暴露==最初 5 年==發生、其後 8–10 年加重；持續暴露下 ==10–15 年進展最快==、之後達極限；停止暴露後不再進行。3 dB 原則：TWA 每增 3 dB 聽損發生時間減半（85 dBA 5 年→88 dBA 2.5 年）。\n- 單純噪音的低頻損失通常 \u003c40 dB、高頻 \u003c70–75 dB；語言辨識力維持良好（>70%）。\n- 加重因子：糖尿病、甲狀腺功能低下、老化、抽菸、耳毒性藥物、苯乙烯（風險 4 倍）、甲苯、二硫化碳、鉛、汞、振動；痛風無關。\n\n## 四、職業性聽力損失的診斷判讀標準（認定指引 114.8）\n\n- 我國==三分法＝(500+1000+2000)/3==，>25 dB（≥26）達聽力損失標準；任一頻率 >25 dB 即該頻率有損失。OSHA＝(2000+3000+4000)/3；高音頻平均＝(3000+4000+6000)/3。\n- 三個 10 dB：4K／6K 凹陷須比三分法平均大 ==10 dB== 以上（或高音頻平均比低音頻平均損失 ≥10 dB）；兩耳三分法差距 ==≤10 dB== 為對稱（≥15 dB 須排除聽神經瘤）；歷年三分法經年齡校正比職前基線下降 ≥10 dB 為「職業性聽力損失」。\n- 分級（分級指引噪音作業）：\n\n| 級別 | 判定依據 |\n|---|---|\n| 第二級 | 三分法平均聽力損失 ≥25 dB；或可由中耳炎、藥物、外傷解釋 |\n| 第三級 | 4K 或 6K 凹陷且 4K／6K 損失 ==≥40 dB==，或高音頻平均比低音頻平均損失 ≥10 dB；需至合格聽力室複檢後請職醫評估 |\n| 第四級 | 凹陷 ≥40 dB＋三分法 ≤25 且高低頻差 \u003c10→「早期噪音性聽力損失」；凹陷 ≥40＋三分法 ≥25＋高低頻差 ≥10→「噪音性聽力損失，須聽力防護及配工計畫」；與前一年比較變化 ≥10 dB→考慮暫停暴露 |\n\n## 五、聽力檢查的法定頻率、檢查前準備與聽力室標準\n\n- 附表十噪音作業：作業經歷調查；服用傷害聽覺神經藥物（==水楊酸或鏈黴素類==）、外傷、耳部感染、遺傳性聽障病史；耳道檢查；聽力檢查頻率至少 ==500、1000、2000、3000、4000、6000、8000 Hz== 純音並建立聽力圖（5000、7000 不在其中）。\n- 檢查前應停止噪音暴露 ==14 小時以上==（不暴露於 80 dB 以上），避免 TTS（〔10/03 課堂〕換算：前一天下午 5 點下班，隔天早上 7 點以後才能測）；OSHA 標準閾值改變（2K、3K、4K 平均變差 ≥10 dB）30 日內重測，追蹤前至少休息 40 小時。\n- 聽力檢查室（亭）可容許最大背景噪音量（認可辦法附表三）：\n\n| Hz | 500 | 1000 | 2000 | 4000 | 8000 |\n|---|---|---|---|---|---|\n| dB | 40 | 40 | ==47== | ==57== | 62 |\n\n- 申請噪音類別須附最近三年內背景噪音檢測證明；巡迴健檢須自備或租用移動式聽力檢查室（亭）。\n\n- 〔10/03 課堂〕職前與定期聽力檢查的判讀重點不同：\n\n| 時機 | 異常標準 | 處置 |\n|---|---|---|\n| 職前 | 任一耳 500／1K／2K 平均 ==>25 dB==；兩耳低頻平均差 ==>15 dB==；兩耳 3K／4K／6K 平均差 ==>30 dB== | 有異常先去醫院找原因 |\n| 定期（==和前一年比==，不是看有沒有超過標準） | 任一耳 500／1K／2K 平均增加 ==≥10 dB==；3K 增加 ==≥20 dB==；4K、6K 增加 ==≥30 dB== | 追蹤、找惡化原因 |\n\n- 〔10/03 課堂講義〕建議暫停或禁止噪音作業：==單耳嚴重聽損（70 dB）==、==雙耳中重度聽損（40 dB 以上）==、慢性耳疾無法配戴防護具。分級指引完整版寫得較嚴：雙耳 40 dB 以上**且**三分法與前一年比較變化 ==≥10 dB==；單邊耳聾者健耳三分法惡化 ≥10 dB；慢性耳疾無法配戴防護具；不明原因持續漸進性聽損——考題若問指引以後者為準。\n- 職業性聽力損失參考標準有兩版：標準 1 用==三分法==平均 >25 dB，標準 2 用==六分法==（500＋2×1K＋2×2K＋4K）/6 平均 >25 dB；其餘條件相同（暴露後半年以上、感覺神經性、4K／6K 凹陷比三分法大 10 dB、輔助：比職前下降 10 dB、兩耳差 10 dB 內）。\n\n| 聽力障礙程度 | 較佳耳平均閾值 | 語言了解 |\n|---|---|---|\n| 不顯著 | ≤25 dB | 輕聲交談無困難 |\n| 輕微 | 26–40 | 輕聲交談有困難 |\n| 中等 | 41–55 | 一般交談困難 |\n| 顯著 | 56–70 | 大聲交談常有困難 |\n| 嚴重 | 71–90 | 喊叫才懂、須助聽器（課堂：達身障程度） |\n| 極嚴重 | ≥91 | 耳聾 |\n\n## 六、鑑別診斷：音叉試驗、梅尼爾氏症、老年性聽損與加重因子\n\n| 試驗 | 傳導性聽損 | 感覺神經性聽損（含 NIHL） |\n|---|---|---|\n| Weber（前額中線） | 偏向==患側== | 偏向健側 |\n| Rinne（同耳氣導 vs 骨導） | ==骨導 > 氣導==（陰性） | 氣導 > 骨導（陽性，兩者皆降） |\n\n- 梅尼爾氏症：內淋巴水腫，==早期低頻==波動性感音性聽損＋旋轉性眩暈＋耳鳴耳脹，聽力時好時壞；老年性聽損：8K 起下坡、無回升；傳導性聽損（耳硬化症）在吵雜環境反而聽較好（paracusis of Willis）。\n- 耳毒性藥物：aminoglycosides（鏈黴素、gentamicin）、loop diuretics、水楊酸、奎寧、cisplatin、vancomycin；metformin 無耳毒性。藥物、中耳炎、外傷造成者屬可由工作外原因解釋→第二級。\n\n## 七、分級管理與認可醫療機構的人力規定\n\n- 認可辦法第 7 條：辦理噪音作業健檢須==聘有耳鼻喉科或職業醫學科專科醫師==，聽力室符合附表三。\n- 第 17 條：檢查由該機構聘僱且執業登記之醫事人員為之（聽力師可經事先報准支援）；行政人員不得執行。\n- 第 16 條：特別危害健康作業定期健檢==管理分級之判讀應由職業醫學科專科醫師為之==（耳鼻喉科醫師不可做分級判讀）。\n- 第 14 條：健檢醫師每三年在職訓練至少 10 小時（網路課程至多 5 小時），職醫專科醫師每三年至少 2 小時。\n- 全聾者從事噪音作業仍須聽力防護與定期噪音健檢；噪音作業配工考量疾病：心血管疾病、聽力異常。","questions":[{"qid":"c05q01","q":"依職業安全衛生設施規則，勞工八小時日時量平均音壓級超過多少分貝，或暴露劑量超過百分之五十時，雇主應使勞工戴用耳塞、耳罩等防音防護具？","options":["80 分貝","85 分貝","90 分貝","95 分貝"],"answer":1,"recon":"full","src":["113-1","113-2","113-3","113-8","113-10","113-11","114-03","114-04"],"optexp":["**不符合**：80 分貝不是防護具門檻。80 分貝是計算八小時日時量平均音壓級時的納入門檻（設施規則第 300 條第 1 款第 3 目：80 分貝以上之噪音以每增 5 分貝容許時間減半納入計算），也是聽力檢查前 14 小時內不得暴露的環境噪音水準。","**符合／正確（本題答案）**：設施規則第 300 條第 1 款後段規定，勞工八小時日時量平均音壓級超過 85 分貝或暴露劑量超過 50% 時，雇主應使勞工戴用有效之耳塞、耳罩等防音防護具；85 分貝同時是噪音作業特殊健檢（舊附表一第 2 項）、每六個月環境監測與第 300 條之 1 聽力保護措施的共同門檻。","**不符合**：90 分貝是工程控制門檻，不是防護具門檻。機械設備發生之聲音超過 90 分貝時，雇主應採取工程控制、減少暴露時間，並標示公告噪音危害預防事項（第 300 條第 1 款前段與第 4 款）。","**不符合**：95 dBA 只是容許暴露時間對照表中「4 小時」所對應的音壓級，不是任何管理措施的啟動門檻。"],"explanation":"本題考噪音法規的三個門檻，是本章最常出現的考點。第一個門檻 80 分貝：計算八小時日時量平均音壓級時，80 分貝以上的噪音才納入計算（每增加 5 分貝容許時間減半），80 dB 也是聽力檢查前 14 小時的休息標準。第二個門檻 85 分貝（或暴露劑量 50%）：雇主應使勞工戴用有效之防音防護具（設施規則第 300 條第 1 款後段）；同一數字也是特別危害健康作業「噪音作業」的定義（八小時日時量平均音壓級 85 分貝以上）、環測辦法每六個月監測噪音一次的門檻，以及第 300 條之 1 聽力保護措施的門檻。第三個門檻 90 分貝：機械設備聲音超過 90 分貝應採工程控制、減少暴露時間，並標示公告。記法「80 算、85 戴、90 改」。回憶版把同一考點換句話問：「應使勞工戴用耳塞耳罩的音壓級」「噪音作業特殊健檢門檻」「聽力保護措施門檻」答案都是 85 分貝；問「工程控制」才是 90 分貝。","dispute":"","review":{"key_points":["防音防護具門檻：==八小時日時量平均音壓級超過 85 分貝==或==暴露劑量超過 50%==（設施規則第 300 條）","85 分貝同時是噪音特殊健檢、每 6 個月環測、聽力保護措施的門檻；90 分貝是工程控制與標示公告門檻","80 分貝以上的噪音才納入八小時日時量平均計算，每增 5 分貝容許時間減半","記法：80 算、85 戴、90 改"],"refs":[{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"八小時日時量平均音壓級超過八十五分貝或暴露劑量超過百分之五十時，雇主應使勞工戴用有效之耳塞、耳罩等防音防護具"},{"src":"勞工作業環境監測實施辦法_舊版","file":"_ref/勞工作業環境監測實施辦法_舊版.txt","quote":"勞工噪音暴露工作日八小時日時量平均音壓級八十五分貝以上之作業場所，應每六個月監測噪音一次以上"}],"note_ref":"一、噪音法規三門檻與容許暴露時間（設施規則第 300 條）"}},{"qid":"c05q02","q":"勞工工作場所因機械設備所發生之聲音超過多少分貝時，雇主應採取工程控制、減少勞工噪音暴露時間？","options":["80 分貝","85 分貝","90 分貝","95 分貝"],"answer":2,"recon":"full","src":["113-2","113-4","113-12","114-03","整理-表格"],"optexp":["**不符合**：80 分貝只是納入八小時日時量平均計算的下限，法規沒有要求 80 分貝就做工程控制。","**不符合**：85 分貝是使勞工戴用防音防護具、實施特殊健檢與聽力保護措施的門檻；題目問的是「工程控制、減少暴露時間」，門檻要再高 5 分貝。","**符合／正確（本題答案）**：設施規則第 300 條第 1 款：勞工工作場所因機械設備所發生之聲音超過 90 分貝時，雇主應採取工程控制、減少勞工噪音暴露時間，使八小時日時量平均不超過對照表規定值；第 4 款另規定噪音超過 90 分貝之工作場所應標示並公告噪音危害之預防事項。","**不符合**：95 分
