[{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"測定勞工八小時日時量平均音壓級時，應將八十分貝以上之噪音以增加五分貝降低容許暴露時間一半之方式納入計算"}],"note_ref":"一、噪音法規三門檻與容許暴露時間（設施規則第 300 條）"}},{"qid":"c05q04","q":"某勞工於 90 分貝下工作 4 小時，再於 95 分貝下工作 2 小時，其噪音暴露劑量為多少？","options":["0.5","1.0","1.5","2.0"],"answer":1,"recon":"full","src":["113-5","113-8","113-11","114-05"],"optexp":["**不符合**：0.5 只是其中一段的劑量（90 分貝 4 小時／容許 8 小時＝0.5，或 95 分貝 2 小時／容許 4 小時＝0.5），兩段要相加。","**符合／正確（本題答案）**：依設施規則第 300 條第 1 款第 2 目，暴露劑量＝Σ（各音壓級暴露時間／該音壓級容許暴露時間）＝4/8＋2/4＝0.5＋0.5＝1.0；其和大於 1 才算超出容許暴露劑量，本例恰好等於 1，未超出。","**不符合**：1.5 會是把 95 分貝的容許時間誤記為 2 小時（2/2＝1）再加 0.5 的結果；95 dBA 容許 4 小時。","**不符合**：2.0 是把兩段都當成整個容許時間用完（8/8＋4/4）的錯算；實際暴露時間只有 4 小時與 2 小時。"],"explanation":"本題考混合噪音暴露劑量的計算。設施規則第 300 條第 1 款第 2 目規定，勞工工作日暴露於二種以上連續性或間歇性音壓級的噪音時，暴露劑量＝第一種噪音暴露時間／該音壓級容許暴露時間＋第二種噪音暴露時間／該音壓級容許暴露時間＋……，其和大於 1 即屬超出容許暴露劑量。本題 90 分貝 4 小時（容許 8 小時）貢獻 0.5，95 分貝 2 小時（容許 4 小時）貢獻 0.5，合計 1.0，等於 100% 劑量，剛好在容許邊緣但未超出。延伸觀念：劑量 50% 對應八小時日時量平均音壓級 85 分貝（因為 5 分貝交換率下劑量減半等於音壓級降 5 分貝），這就是第 300 條「暴露劑量超過百分之五十」與「超過八十五分貝」並列為防護具門檻的原因；劑量 100% 對應 90 分貝。作答時先查對照表取得各音壓級容許時間，再逐項相除相加即可。","dispute":"","review":{"key_points":["暴露劑量＝Σ（暴露時間／該音壓級容許暴露時間），==和大於 1== 即超出容許劑量","90 dB 4 小時＋95 dB 2 小時＝4/8＋2/4＝==1.0==","劑量 50% ⇔ 八小時日時量平均 85 分貝；劑量 100% ⇔ 90 分貝"],"refs":[{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"其和大於一時，即屬超出容許暴露劑量"}],"note_ref":"一、噪音法規三門檻與容許暴露時間（設施規則第 300 條）"}},{"qid":"c05q05","q":"噪音性聽力損失（NIHL）主要影響的頻率範圍為何？","options":["500–1000 Hz","1000–3000 Hz","3000–6000 Hz","8000 Hz 以上"],"answer":2,"recon":"full","src":["113-2","113-4","113-10","114-01"],"optexp":["**不符合**：500–1000 Hz 屬語言頻率區，是噪音性聽力損失最晚才被波及的低音頻；早期低頻閾值多仍正常，所以勞工不易自覺。","**不符合**：1000–3000 Hz 仍以交談頻率為主；認定指引指出在高頻損失出現之前，比較少出現 3000 Hz 以下的聽力損失。","**符合／正確（本題答案）**：噪音性聽力損失由高音頻 3000–6000 Hz 開始，聽力圖出現 4K（或 6K）凹陷（C5-dip），隨暴露劑量與時間增加才向低頻擴散（分級指引與認定指引均如此描述）。","**不符合**：8000 Hz 在噪音性聽損反而回升（up-turn），這是與老年性聽損（自 8000 Hz 起往低頻遞損、down-sloping）鑑別的關鍵，不是主要受損區。"],"explanation":"本題考噪音性聽力損失（NIHL）在聽力圖上的頻率分布。噪音傷害耳蝸毛細胞，早期損失出現在高音頻 3000–6000 Hz，最深點在 4000 Hz（教科書的 4K notch／C5-dip）或 6000 Hz，之後 8000 Hz 回升（upturn），形成典型的凹陷（notch）；隨著暴露劑量與年數增加，損失才由高頻擴散到 500–2000 Hz 的語言頻率，此時勞工才會自覺聽不清楚。因此早期 NIHL 只有靠定期全音頻聽力檢查才能發現，這也是法定頻率必須包含 3000、4000、6000 Hz 的原因。認定指引另指出：人類語言區域主要在 500–2000 Hz，若只有 4000–8000 Hz 受損，日常交談不受明顯影響，只有聽音樂時覺得高音不清。與之對照：老年性聽損由 8000 Hz 起向低頻遞損呈下坡型且無 8K 回升；梅尼爾氏症早期為低頻損失。回憶版另問「最早出現凹陷的頻率」（4000 Hz）與「國內流行病學最嚴重的頻率」（6000 Hz），見後兩題。","dispute":"","review":{"key_points":["NIHL 由==高音頻 3000–6000 Hz== 開始，4K 或 6K 凹陷，8K 回升（upturn）","語言頻率 500–2000 Hz 最晚受損，早期勞工不自覺","老年性聽損：自 8000 Hz 起往低頻遞損，無 8K 回升"],"refs":[{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"通常由高音頻開始 (3000-6000 Hz)，再擴散到低音頻 (500-2000 Hz)"},{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"噪音性聽力損失特徵是由高音頻(3000-6000Hz)開始，4000(或6000)Hz 是最早受到影響及聽力閾值改變最大的音頻"}],"note_ref":"三、噪音性聽力損失的病理與聽力圖特徵"}},{"qid":"c05q06","q":"典型噪音性聽力損失之聽力圖，最早出現且聽力閾值改變最大的凹陷（notch）通常在哪一個頻率？","options":["500 Hz","2000 Hz","4000 Hz","8000 Hz"],"answer":2,"recon":"full","src":["113-1","114-02"],"optexp":["**不符合**：500 Hz 是低音頻、語言頻率區，是 NIHL 最晚受影響的頻率；認定指引提到低頻噪音的最大損失才可能出現在 500 Hz，屬特殊例外。","**不符合**：2000 Hz 屬交談頻率，早期 NIHL 在 2000 Hz 以下聽力通常還好，2K 聽力也是三分法平均的組成之一，用來與高頻比較。","**符合／正確（本題答案）**：教科書與認定指引所引 ACOEM 2018 描述：早期噪音引起的聽力損失由 3000–6000 Hz 開始，4000 Hz 是最早受到影響及聽力閾值改變最大的音頻，聽力圖判讀時 4K 凹陷（4K notch 或 C5-dip）常被用來輔助診斷。","**不符合**：8000 Hz 在 NIHL 通常比凹陷最深處好，呈現回升（up-turn）；8K 起始的下坡型損失是老年性聽損的特徵。"],"explanation":"本題考典型噪音性聽力損失的凹陷位置。國際教科書與美國職業與環境醫學學院（ACOEM）的描述都是：早期 NIHL 從高音頻 3000–6000 Hz 開始，4000 Hz 最早受影響、閾值改變最大，聽力圖上呈 4K 凹陷（4K notch 或 C5-dip），8000 Hz 回升。認定指引提醒 4K 凹陷的出現並不一定就是噪音造成，且不同噪音源會有不同凹陷位置：衝擊性噪音、飛機工程師、音樂家、輕武器射擊常呈 6K（甚至 6K–8K）凹陷，冶金礦工在 3K–6K 呈較寬的凹陷，低頻噪音的最大損失可能出現在 500 Hz。這題和下一題是一組陷阱：題幹講「典型」「教科書」「最早出現且改變最大」時答 4000 Hz；題幹講「依國內流行病學研究」（吳聰能 1998、陳仲達 2003）時答 6000 Hz。114-02 回憶版「最常見職業造成音頻傷害：500／2000／4000／6000」即以 4000 Hz 為答案。","dispute":"","review":{"key_points":["典型 NIHL：==4000 Hz== 最早受影響、閾值改變最大（4K notch／C5-dip）","衝擊性噪音、音樂家、飛機工程師、輕武器：凹陷偏 6K；低頻噪音：500 Hz","題幹問「國內流行病學」時改答 6000 Hz"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"4000Hz 是最早受到影響及聽力閾值改變最大的音頻"},{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"要注意的是[4K 凹陷]的出現並不一定就是噪音引起的聽力損失"}],"note_ref":"三、噪音性聽力損失的病理與聽力圖特徵"}},{"qid":"c05q07","q":"依國內流行病學研究（吳聰能 1998、陳仲達 2003），我國噪音引起之聽力損失以哪一個頻率最為嚴重？","options":["2000 Hz","3000 Hz","4000 Hz","6000 Hz"],"answer":3,"recon":"full","src":["113-10","114-01","114-02"],"optexp":["**不符合**：2000 Hz 屬語言頻率，是 NIHL 較晚才受累的頻率，國內研究並未以此為最嚴重頻率。","**不符合**：3000 Hz 是高頻損失的起點之一，也是高音頻平均（3K+4K+6K）/3 的組成，但不是國內流行病學調查最嚴重的頻率。","**不符合**：4000 Hz 是國外教科書的典型凹陷位置（4K notch）；題幹特別指明「依國內流行病學研究」，國內外的音頻分布不同，正是指引要醫師注意的差異。","**符合／正確（本題答案）**：認定指引記載吳聰能等人 1998 年大規模流行病學調查發現國內噪音引起的聽力損失以 6000 Hz 最為嚴重，陳仲達 2003 年對某煉油廠的研究亦同；因此判讀時應參考 8000 Hz，並於 100 年修法時把 8000 Hz 納入法定測試頻率。"],"explanation":"本題考國內噪音性聽力損失流行病學的特殊發現。認定指引明載：吳聰能等人 1998 年針對台灣的大規模流行病學調查發現國內噪音引起的聽力損失以 6000 Hz 最為嚴重，陳仲達 2003 年對某煉油廠的研究亦顯示以 6000 Hz 最嚴重；國內外音頻分布不一樣，是國內醫師判讀時要特別注意的。由此衍生兩個法規與判讀上的後果：一是判讀 6K 凹陷時應參考 8000 Hz 的測試值以與老年性聽損鑑別（老年性聽損自 8K 起遞損、無回升），所以 100 年修正勞工健康保護規則時把 8000 Hz 加入法定頻率；二是分級指引與診斷基準一律寫「4K 或 6K 凹陷」，不只寫 4K。答題口訣：教科書典型凹陷 4K，台灣流行病學最嚴重 6K，兩者都要能對照 8K 回升才算噪音型。","dispute":"","review":{"key_points":["國內流行病學（吳聰能 1998、陳仲達 2003）：噪音性聽損以 ==6000 Hz== 最嚴重","因此判讀要參考 8000 Hz，100 年修法把 8000 Hz 納入法定頻率","分級與診斷基準都寫「4K 或 6K 凹陷」"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"發現國內噪音引起的聽力損失以 6000Hz 最為嚴重"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"100 年修正之「勞工健康保護規則」增加 8000Hz 音頻為法定的測試項目，以作為與老年性聽力損失鑑別診斷之用"}],"note_ref":"三、噪音性聽力損失的病理與聽力圖特徵"}},{"qid":"c05q08","q":"噪音暴露引起之聽力損失，屬於下列何種類型？","options":["傳導性聽力損失","感覺神經性聽力損失","混合性聽力損失","中樞性聽力損失"],"answer":1,"recon":"full","src":["113-4","114-04"],"optexp":["**不符合**：傳導性聽力損失是聲波無法有效傳入內耳，來自外耳與中耳（耳垢栓塞、外耳炎、中耳炎、耳膜穿孔、耳硬化症、聽小骨斷離），多可經手術或藥物改善；噪音不傷害這些構造。","**符合／正確（本題答案）**：噪音經空氣振動的壓力傳到內耳，傷害耳蝸的毛細胞，產生漸進性、對稱性、以高頻為主的感覺神經性聽力損失（sensorineural hearing loss），毛細胞無法再生，損失終身不癒。","**不符合**：混合型是同時合併傳導型與感音型；單純噪音暴露不會造成傳導性成分，除非爆炸同時傷及中耳（聲創傷）才可能呈混合型。","**不符合**：中樞性聽力損失是腦幹以上至大腦皮質聽覺路徑的障礙，表現為聽能瞭解的問題而非純音閾值上升，與噪音無關。"],"explanation":"本題考聽力損失的分類與噪音性聽損的歸屬。認定指引把聽力損失分五型：傳導型（外耳、中耳問題，可矯治）、感音型（內耳或聽神經病變，終身不癒，多以助聽器處理）、混合型、功能性（心因性）、中樞性（聽能瞭解障礙）。噪音是以振動空氣的壓力傳到內耳，對耳蝸毛細胞造成傷害，毛細胞被瘢痕組織取代無法再生，所以 NIHL 屬感覺神經性聽力損失，特徵為漸進、無痛、兩耳對稱、由高頻開始。診斷基準中「聽力損失必須是感音性病變」是主要條件之一，純音氣導有損失時需轉介做骨傳導檢查以與其他原因鑑別。同屬感音型的鑑別對象包括耳毒性藥物、老年性聽損、梅尼爾氏症、聽神經瘤、糖尿病等；傳導型則要想到耳垢、中耳炎、耳硬化症。特例：140 dB 以上的爆炸聲創傷可撕裂柯氏器與基底膜，若同時傷及中耳則呈混合型且聽力圖呈平坦型。","dispute":"","review":{"key_points":["NIHL 傷害==耳蝸毛細胞==→漸進、對稱、高頻為主的==感覺神經性==聽力損失","傳導性：外耳／中耳（耳垢、中耳炎、耳硬化症）；混合型：兩者合併；中樞性：聽能瞭解問題","聲創傷（>140 dB）合併中耳受傷才會呈混合型、平坦型聽力圖"],"refs":[{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"噪音引起的聽力損失通常影響內耳毛細胞，特徵為漸進性，感覺神經性的聽力損失"},{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"常見原因如噪音性聽力損失(Noise induced hearing loss, NIHL)、耳毒性藥物中毒、老年性失聰、先天性聽障等"}],"note_ref":"三、噪音性聽力損失的病理與聽力圖特徵"}},{"qid":"c05q09","q":"有關韋伯測試（Weber test）之結果，下列何者正確？","options":["傳導性聽力喪失時，患側聽起來較大聲","傳導性聽力喪失時，健側聽起來較大聲","感覺神經性聽力喪失時，患側聽起來較大聲","韋伯測試無法區分傳導性與感覺神經性聽損"],"answer":0,"recon":"full","src":["113-1","113-4","113-11"],"optexp":["**符合／正確（本題答案）**：Weber 試驗把音叉放在前額中線，比較兩耳骨導。傳導性聽損時患側因外界空氣傳導的環境噪音被阻隔（遮蔽減少），骨導聲音反而顯得較大，聲音偏向患側。","**不符合**：傳導性聽損時聲音偏向患側而非健側；偏向健側是感覺神經性聽損的表現。","**不符合**：感覺神經性聽損時患側耳蝸或聽神經功能差，骨導音也感知不良，聲音偏向健側，不是患側較大聲。","**不符合**：Weber 與 Rinne 合用正是床邊區分傳導性與感覺神經性聽損的基本方法；認定指引列音叉檢查為建議檢查之一。"],"explanation":"本題考音叉試驗中的 Weber 試驗。Weber：震動的音叉置於前額中線或頭頂，問受檢者哪一耳聽得較大聲。正常人兩耳相同（居中）；傳導性聽損時聲音偏向患側（患側較大聲），因為患側外耳或中耳阻塞後外界環境噪音無法遮蔽，骨導聲音相對突顯；感覺神經性聽損時聲音偏向健側，因為患側耳蝸或聽神經感知能力下降。搭配 Rinne 試驗（下一題）就能在門診初步分類：Weber 偏一側＋該側 Rinne 陰性（骨導>氣導）→該側傳導性聽損；Weber 偏一側＋對側 Rinne 陽性→對側感覺神經性聽損。噪音性聽損為兩耳對稱的感音型，Weber 通常居中；若明顯偏向一側，要想到單側中耳病變或聽神經瘤等其他原因，這也是分級指引要求非對稱聽損要評估複合性成因的臨床基礎。認定指引同時提到傳導性聽損（尤其耳硬化症）病人在吵雜環境反而聽得較好，稱維里斯現象（paracusis of Willis），可作為病史線索。","dispute":"","review":{"key_points":["Weber：==傳導性→偏患側==（患側較大聲）；==感覺神經性→偏健側==","機轉：患側外中耳阻塞後環境噪音遮蔽消失，骨導音相對突顯","NIHL 兩耳對稱，Weber 多居中；明顯偏側要排除聽神經瘤、單側中耳病變"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"傳導性聽力損失的病人，尤其耳硬化症病人，在較吵雜的環境下聽力會較佳"}],"note_ref":"六、鑑別診斷：音叉試驗、梅尼爾氏症、老年性聽損與加重因子"}},{"qid":"c05q10","q":"有關林內氏測驗（Rinne test）之結果，下列何者正確？","options":["傳導性聽力喪失時，骨導優於氣導","傳導性聽力喪失時，氣導優於骨導","感覺神經性聽力喪失時，骨導優於氣導","正常人骨導優於氣導"],"answer":0,"recon":"full","src":["113-2","113-12","114-04"],"optexp":["**符合／正確（本題答案）**：Rinne 試驗比較同一耳的氣導與骨導。傳導性聽損時聲波經外耳中耳的傳導受阻，氣導變差而骨導不受影響，故骨導優於氣導（Rinne 陰性）。","**不符合**：氣導優於骨導（Rinne 陽性）是正常人與感覺神經性聽損的表現，傳導性聽損正好相反。","**不符合**：感覺神經性聽損時耳蝸或聽神經受損，氣導與骨導同步下降，仍維持氣導優於骨導（Rinne 陽性），只是兩者都變短。","**不符合**：正常人氣導優於骨導（氣導時間約為骨導的兩倍），這是 Rinne 陽性的定義。"],"explanation":"本題考 Rinne 試驗的判讀。做法：音叉先置於乳突（骨導），聽不到後移到外耳道口（氣導），比較何者較久或較大聲。正常人氣導優於骨導，稱 Rinne 陽性；感覺神經性聽損（含噪音性聽損）氣導與骨導一起下降，仍是氣導>骨導，Rinne 陽性；傳導性聽損時外耳或中耳傳導障礙使氣導變差，骨導繞過阻礙直接刺激耳蝸，故骨導>氣導，Rinne 陰性。與 Weber 合併判讀：Weber 偏向某耳且該耳 Rinne 陰性→該耳傳導性聽損；Weber 偏向某耳且對側 Rinne 陽性→對側感覺神經性聽損。注意嚴重單側感音性聽損可出現「假陰性 Rinne」，因骨導被對側耳聽到。認定指引在職業性聽損的評估上把音叉檢查與骨傳導檢查列為建議檢查，並要求純音氣導有損失者轉介醫院做骨傳導聽力檢查，以確認是感音性病變再談職業因果。","dispute":"","review":{"key_points":["Rinne：正常與感音性聽損==氣導>骨導（陽性）==；==傳導性聽損骨導>氣導（陰性）==","NIHL 為感音性，Rinne 仍陽性、Weber 居中","純音氣導有損失時需轉介做骨傳導聽力檢查以鑑別"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"純音氣導聽力檢查若有聽力損失情形，需轉介到醫院做骨傳導聽力檢查以和其他原因造成之聽力損失做鑑別診斷"}],"note_ref":"六、鑑別診斷：音叉試驗、梅尼爾氏症、老年性聽損與加重因子"}},{"qid":"c05q11","q":"梅尼爾氏症（Meniere's disease）之聽力損失最先影響哪一段頻率？","options":["低音頻","中音頻","高音頻","全頻率同時受損"],"answer":0,"recon":"full","src":["113-1","113-3","113-4","113-10","114-03","114-04","115-02"],"optexp":["**符合／正確（本題答案）**：梅尼爾氏症為內淋巴水腫，早期典型是波動性的低頻感覺神經性聽力損失，伴隨旋轉性眩暈、耳鳴與耳脹感，聽力時好時壞；這與噪音性聽損的高頻凹陷相反。","**不符合**：中音頻不是梅尼爾氏症的起始區；中頻為主的損失在職業聽損鑑別中無特定對應疾病。","**不符合**：高音頻起始是噪音性聽損（3000–6000 Hz 凹陷）與老年性聽損（8000 Hz 起下坡）的特徵，不是梅尼爾氏症。","**不符合**：梅尼爾氏症早期並非全頻率同時受損；到晚期反覆發作後才可能進展為全頻平坦型損失。"],"explanation":"本題考噪音性聽損的鑑別診斷之一：梅尼爾氏症（Meniere's disease）。它是內耳內淋巴水腫，典型三聯徵為反覆發作的旋轉性眩暈、耳鳴（常伴耳脹感）與波動性感覺神經性聽力損失；聽力損失早期以低頻為主、時好時壞，晚期才變成全頻平坦型。與噪音性聽損的對照：NIHL 由高頻 3000–6000 Hz 開始、兩耳對稱、漸進而無眩暈；梅尼爾氏症由低頻開始、多為單側、伴眩暈、聽力波動。認定指引特別提示病史中的耳鳴或暈眩以及「聽力不穩定現象」（早晨比傍晚好、休息時比緊張時好、挖耳後比較好）都指向梅尼爾氏症等耳科疾病，應用來做鑑別。回憶版有七份考古題都出過這題，是本章鑑別診斷的固定考點；答題時看到「低音頻」「波動」「眩暈」就選梅尼爾氏症，看到「高頻凹陷、對稱、無眩暈」才是噪音。","dispute":"","review":{"key_points":["梅尼爾氏症：內淋巴水腫，==早期低頻==波動性感音性聽損＋眩暈＋耳鳴／耳脹","NIHL：高頻 3–6 kHz 凹陷、對稱、漸進、無眩暈","病史中的耳鳴、暈眩、聽力時好時壞是鑑別線索"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"聽力的不穩定現象(fluctuation in hearing)，如早晨比傍晚好，休息時比緊張時好"}],"note_ref":"六、鑑別診斷：音叉試驗、梅尼爾氏症、老年性聽損與加重因子"}},{"qid":"c05q12","q":"噪音作業勞工接受聽力檢查前，應停止噪音暴露至少多久？","options":["2 小時","8 小時","14 小時","48 小時"],"answer":2,"recon":"full","src":["113-3","113-4","113-8","113-11","114-03","114-04","114-05"],"optexp":["**不符合**：2 小時不足以讓暫時性聽力閾值改變（TTS）恢復，檢查結果會被剛結束的噪音暴露高估。","**不符合**：8 小時是一個工作日的長度，不是檢查前休息的規定；TTS 恢復約需 12–24 小時，8 小時仍可能殘留。","**符合／正確（本題答案）**：認定指引規定受檢員工在做聽力檢查之前應停止噪音暴露 14 小時以上，以避免噪音暴露後產生的暫時性聽力閾值改變（TTS）影響檢查；分級指引完整版另寫「檢查前至少休息 14 小時不暴露於 80 dB 以上之噪音環境」。","**不符合**：48 小時並非法定或指引要求；分級指引完整版只在追蹤複檢時建議修正原因後至少休息 40 小時再做追蹤檢查，一般定期檢查是 14 小時。"],"explanation":"本題考聽力檢查前的噪音隔離時間。噪音暴露後會產生暫時性聽力閾值改變（temporary threshold shift, TTS），離開噪音源後需要一段時間才恢復（大約 12–24 小時），若在 TTS 未恢復時檢查，會誤判為永久性聽力損失（PTS）。因此職業性聽力損失診斷認定參考指引規定受檢員工做聽力檢查前應停止噪音暴露 14 小時以上；分級指引完整版與美國 OSHA 的說法更具體：檢查前至少休息 14 小時不暴露於 80 dB 以上的噪音環境。延伸：OSHA 規定任一耳 2K、3K、4K Hz 平均閾值變差 10 dB 以上稱標準聽力閾值改變（standard threshold shift），須在 30 日內重做檢查；若仍異常，由醫師修正可控制的原因後，至少休息 40 小時不暴露於 80 dB 以上再追蹤。考試常見的變形問法是「14 小時不暴露於幾分貝以上的環境」（80 dB），以及「若受檢者做檢查前剛下噪音班該如何處理」（改期或安排 14 小時後再測）。","dispute":"","review":{"key_points":["聽力檢查前應停止噪音暴露 ==14 小時以上==，避免 TTS 干擾","完整版：14 小時不暴露於 ==80 dB 以上==環境；追蹤複檢前至少休息 40 小時","OSHA 標準聽力閾值改變：2K、3K、4K 平均變差 ≥10 dB，30 日內重測"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"受檢員工在做聽力檢查之前應停止噪音暴露 14 小時以上"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"檢查前至少休息 14 小時不暴露於 80 dB 以上之噪音環境下"}],"note_ref":"五、聽力檢查的法定頻率、檢查前準備與聽力室標準"}},{"qid":"c05q13","q":"依勞工健康保護規則附表十，噪音作業特殊健康檢查之聽力檢查測試頻率至少應包含哪些？下列何者不在其中？","options":["3000 Hz","5000 Hz","6000 Hz","8000 Hz"],"answer":1,"recon":"full","src":["113-2","113-6","113-11","114-02","114-05"],"optexp":["**正確**：3000 Hz 是法定測試頻率之一，也是高音頻平均（3K+4K+6K）/3 的組成。","**錯誤（本題答案）**：5000 Hz 不在法定頻率之列。附表十規定的噪音作業聽力檢查測試頻率至少為 500、1000、2000、3000、4000、6000 及 8000 赫之純音，並建立聽力圖。","**正確**：6000 Hz 是法定頻率，且是國內流行病學研究中噪音性聽損最嚴重的頻率。","**正確**：8000 Hz 是法定頻率，100 年修法時加入，用來觀察噪音性聽損的 up-turn 以與老年性聽損鑑別。"],"explanation":"本題考噪音作業特殊健康檢查的法定聽力測試頻率。勞工健康保護規則附表十噪音作業項目：(1) 作業經歷、生活習慣及自覺症狀之調查；(2) 服用傷害聽覺神經藥物（如水楊酸或鏈黴素類）、外傷、耳部感染及遺傳所引起之聽力障礙等既往病史之調查；(3) 耳道檢查；(4) 聽力檢查（audiometry），測試頻率至少為 500、1000、2000、3000、4000、6000 及 8000 赫之純音，並建立聽力圖。體格檢查與健康檢查項目相同。共七個頻率，記法「五百到八千，跳過 5000、7000」。三個頻率群各有用途：500、1000、2000 Hz 組成三分法平均（我國聽力損失標準）；3000、4000、6000 Hz 組成高音頻平均，用來看凹陷；8000 Hz 觀察回升以鑑別老年性聽損。114-05 回憶版的錯誤選項「應至少包含 500、1000、2000、4000 和 8000 Hz」漏掉 3000 與 6000，同樣要判為錯。","dispute":"","review":{"key_points":["法定頻率：==500、1000、2000、3000、4000、6000、8000 Hz== 七個純音，並建立聽力圖","5000、7000 Hz 不在其中；漏掉 3000 或 6000 的選項也是錯","附表十其他項目：作業經歷調查、耳毒性藥物與耳部病史、耳道檢查"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"目前法令規定的聽力檢查頻率應包括 500、1000、2000、3000、4000、6000 與 8000Hz 的純音氣導聽力檢查"}],"note_ref":"五、聽力檢查的法定頻率、檢查前準備與聽力室標準"}},{"qid":"c05q14","q":"我國聽力損失判定所用之「三分法」平均聽力，是取哪三個頻率之平均？","options":["500、1000、2000 Hz","1000、2000、3000 Hz","2000、3000、4000 Hz","3000、4000、6000 Hz"],"answer":0,"recon":"full","src":["113-4","113-8","113-11","114-03","115-02"],"optexp":["**符合／正確（本題答案）**：我國以三分法計算平均聽力，公式為（500 Hz＋1000 Hz＋2000 Hz）/3，即語言頻率區的平均；認定指引與分級指引皆用〔(0.5K+1K+2K)/3〕。","**不符合**：1000、2000、3000 Hz 不是我國的公式；也不是美國 OSHA 的 2K、3K、4K 組合。","**不符合**：（2000＋3000＋4000）/3 是美國 OSHA 的平均聽力公式，用於標準聽力閾值改變的判定，不是我國三分法。","**不符合**：（3000＋4000＋6000）/3 是「高音頻平均聽力」，用來與低音頻平均比較看是否損失 ≥10 dB，不是三分法。"],"explanation":"本題考我國聽力損失判定的三分法。認定指引：任一音頻閾值超過 25 dB 代表該音頻有聽力損失，但一般以平均聽力代表整體聽力，我國採三分法（500 Hz＋1000 Hz＋2000 Hz）/3，這三個頻率正是人類語言溝通最主要的頻率區；平均聽力大於 25 dB 即代表有聽力損失。各國公式不同：美國 OSHA 採（2000＋3000＋4000）/3，用來判定標準聽力閾值改變（變差 ≥10 dB 須 30 日內重測）。另外兩個常用平均：高音頻平均〔(3K+4K+6K)/3〕與低音頻平均〔(0.5K+1K+2K)/3〕比較，高音頻比低音頻損失 ≥10 dB 是噪音型的判定條件之一。分級指引第二級的例子就是「三分法平均聽力損失 ≥25 分貝」，第四級則同時看 4K／6K 凹陷 ≥40 dB、三分法 ≥25 dB 與高低頻差 ≥10 dB 三個條件。這組公式要背熟，因為 c05q15、q16 都是同一組數字換角度問。","dispute":"","review":{"key_points":["我國三分法＝==(500+1000+2000)/3==，>25 dB 達聽力損失標準","OSHA＝(2000+3000+4000)/3；高音頻平均＝(3000+4000+6000)/3","高音頻平均比低音頻平均損失 ≥10 dB＝噪音型特徵"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"臺灣：(500Hz +1000Hz+2000Hz)/3"},{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"OSHA：(2000Hz +3000Hz +4000Hz)/3"}],"note_ref":"四、職業性聽力損失的診斷判讀標準（認定指引 114.8）"}},{"qid":"c05q15","q":"依職業性聽力損失診斷認定參考指引，三分法平均聽力損失大於多少分貝即達聽力損失標準？","options":["10 分貝","20 分貝","25 分貝","40 分貝"],"answer":2,"recon":"full","src":["113-4","113-11","114-01"],"optexp":["**不符合**：10 dB 是「兩耳差距」「高低頻差」「歷年變化」等比較用的門檻，不是平均聽力的損失標準。","**不符合**：20 dB 不是指引採用的門檻；純音聽力閾值在 25 dB 以內視為正常，所以 20 dB 的平均聽力仍屬正常範圍，不能算聽力損失。","**符合／正確（本題答案）**：認定指引：任一音頻聽力閾值超過 25 dB 即代表該音頻有聽力損失；三分法平均聽力若大於 25 dB（≥26 dB）即達聽力損失標準。分級指引第二級管理的例子也是三分法平均聽力損失 ≥25 分貝。","**不符合**：40 dB 是分級指引判定 4K 或 6K 凹陷的閾值（4K 或 6K 聽力損失大於等於 40 分貝），也是單純噪音造成低音頻損失通常不超過的上限，不是三分法的標準。"],"explanation":"本題考聽力損失的判定門檻 25 dB，並要把本章的三個「10」與兩個「40」分清楚。25 dB：任一音頻閾值超過 25 dB 代表該頻率有損失；三分法平均 >25 dB（診斷基準寫 ≥26 dB）達聽力損失標準；分級指引第二級管理舉例即三分法平均聽力損失 ≥25 分貝。10 dB：(1) 4K 或 6K 凹陷須比三分法平均聽力大 10 dB 以上、高音頻平均比低音頻平均損失 ≥10 dB；(2) 兩耳三分法平均差距在 10 dB 以內視為對稱；(3) 歷年比較三分法平均經年齡校正後比職前基線下降 10 dB 以上，或與前一年度比較變化 ≥10 dB 要找惡化原因。40 dB：分級指引第三、四級要求 4K 或 6K 聽力損失 ≥40 dB；ACOEM 指出單純噪音造成的低音頻損失通常在 40 dB 以下、高音頻在 75 dB（指引輔助基準寫 70 dB）以下，超過就要想其他原因。這些數字合在一起就是慢性噪音性聽損的診斷主要基準。","dispute":"","review":{"key_points":["任一頻率閾值 >25 dB＝該頻率有損失；==三分法平均 >25 dB（≥26）＝達聽力損失標準==","三個 10 dB：凹陷比三分法大 10、兩耳差 ≤10、歷年下降 ≥10","兩個 40 dB：分級指引凹陷閾值 ≥40 dB；單純噪音低頻損失通常 \u003c40 dB"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"三分法平均聽力之計算公式為(500Hz+1000Hz+2000Hz)/3；其值若大於 25dB 即達聽力損失標準"},{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"〔(0.5K+1K+2K)/3〕計算，平均聽力損失≥25分貝"}],"note_ref":"四、職業性聽力損失的診斷判讀標準（認定指引 114.8）"}},{"qid":"c05q16","q":"職業性噪音聽力損失之特徵性 4K 或 6K 凹陷，其高音頻聽力損失須比三分法平均聽力損失多至少幾分貝？","options":["5 分貝","10 分貝","15 分貝","25 分貝"],"answer":1,"recon":"full","src":["113-5","113-8","113-11","114-01"],"optexp":["**不符合**：5 dB 是設施規則容許暴露時間的交換率（每增 5 dB 減半），不是聽力圖判讀的門檻。","**符合／正確（本題答案）**：認定指引診斷基準：具有特色之 4K 或 6K 凹陷，其閾值須大於三分法平均聽力 10 dB 以上；分級指引則以高音頻平均〔(3K+4K+6K)/3〕比低音頻平均〔(0.5K+1K+2K)/3〕損失 ≥10 分貝判定。","**不符合**：15 dB 是認定指引描述「不對稱聽力差（15 dB 以上）在一般人群發生率約 1%」時用的數字，與凹陷深度無關。","**不符合**：25 dB 是三分法平均聽力達聽力損失標準的門檻，不是凹陷相對於平均聽力的差距。"],"explanation":"本題考噪音性聽損「凹陷」的判讀標準。認定指引：4K 或 6K 凹陷的判讀標準為聽力閾值以 4K 或 6K 為最大，其後的音頻（8K）有向上轉移（up-turn），且 4K 或 6K 的聽力閾值需大於三分法平均聽力值 10 dB 以上。慢性噪音性聽損的診斷主要基準把它寫成：純音聽力圖出現 4K 或 6K 凹陷，高音頻平均〔(3K+4K+6K)/3〕之損失大於低音頻平均〔(0.5K+1K+2K)/3〕10 dB 以上。分級指引第三級 3.1 的門檻是「4K 或 6K 聽力損失 ≥40 分貝，或高音頻平均比低音頻平均損失 ≥10 分貝」，第四級再依三分法是否 ≥25 dB 區分早期噪音性聽損（加註須進行聽力防護計畫）與噪音性聽力損失（須進行聽力防護及配工計畫）。注意 50 歲以後年齡效應會使 3K–8K 呈下陷（bulge）而讓凹陷不明顯，年長個案若無先前聽力圖將難以評估噪音的效應。","dispute":"","review":{"key_points":["4K／6K 凹陷須比==三分法平均大 10 dB 以上==，且 8K 有 up-turn","分級指引：高音頻平均 (3K+4K+6K)/3 比低音頻平均 (0.5K+1K+2K)/3 損失 ==≥10 dB==","第三／四級另要求 4K 或 6K 閾值 ≥40 dB；50 歲後年齡效應會抹平凹陷"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"具有特色之 4K 或 6K 凹陷(大於三分法平均聽力 10 dB 以上)"},{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"4K 或 6K 聽力損失大於等於 40"}],"note_ref":"四、職業性聽力損失的診斷判讀標準（認定指引 114.8）"}},{"qid":"c05q17","q":"職業性噪音聽力損失通常為兩耳對稱性，所謂「對稱」指兩耳聽力損失差距在多少分貝以內？","options":["5 分貝","10 分貝","15 分貝","20 分貝"],"answer":1,"recon":"full","src":["113-5","114-05"],"optexp":["**不符合**：5 dB 在指引中沒有作為對稱性的判定值；純音聽力檢查本身的測量步階就是 5 dB，以此為門檻過於嚴格。","**符合／正確（本題答案）**：認定指引：兩耳對暫時性或永久性閾值改變的敏感性應相同，故兩耳之聽力損失程度大多對稱，亦即二耳之聽力損失差距在 10 dB 以內；分級指引也寫左右耳聽力損失相差 10 分貝以內。","**不符合**：15 dB 以上在指引中是「不對稱聽力差」的定義（一般人群發生率約 1%，噪音暴露者 4.7–36%），超過即須排除前庭神經瘤等其他疾病。","**不符合**：20 dB 不是指引採用的數字；指引中與「20」相關的只有女性 ZPP 閾值等其他章節的數值，聽力對稱性沒有 20 dB 的判定標準。"],"explanation":"本題考噪音性聽損的對稱性。認定指引指出兩耳對暫時性（TTS）與永久性（PTS）閾值改變的敏感性相同，所以職業性聽力損失兩耳大多對稱，二耳之聽力損失差距（診斷基準用兩耳三分法平均）在 10 dB 以內；若在高噪音環境工作多年卻一耳明顯比另一耳嚴重，應評估聽神經瘤（acoustic neuroma）等其他原因。指引同時承認噪音也可能造成不對稱：不對稱聽力差（15 dB 以上）在一般人群發生率約 1%，噪音暴露者 4.7–36%，多為左耳比右耳差、在 3–6 kHz 最明顯（射擊、駕駛等單側暴露），但診斷前須先排除前庭神經瘤等疾病。分級指引第三、四級都註明噪音性聽損為兩耳對稱、以高頻為主的感音性聽損，雙耳非對稱者要評估單側中耳或內耳病變等複合性成因。臨床上單側聽損配合 Weber 偏向健側，就是安排 MRI 排除聽神經瘤的指標。","dispute":"","review":{"key_points":["兩耳聽力損失差距==在 10 dB 以內==＝對稱（診斷基準用兩耳三分法平均差 ≤10 dB）","不對稱 ≥15 dB：一般人 1%，噪音暴露者 4.7–36%，左耳常較差","明顯不對稱要排除聽神經瘤（前庭神經瘤）與單側中耳、內耳病變"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"兩耳之聽力損失程度大多是對稱性，亦即二耳之聽力損失差距在 10 dB 以內"},{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"噪音引起的聽力損失通常是對稱性的，左右耳聽力損失相差 10 分貝以內"}],"note_ref":"四、職業性聽力損失的診斷判讀標準（認定指引 114.8）"}},{"qid":"c05q18","q":"依辦理勞工體格與健康檢查醫療機構認可及管理辦法附表三，聽力檢查室（亭）可容許最大背景噪音量，下列何者錯誤？","options":["500 Hz：40 dB","1000 Hz：40 dB","2000 Hz：50 dB","8000 Hz：62 dB"],"answer":2,"recon":"full","src":["113-2","113-6","113-8","113-12","114-05","115-02"],"optexp":["**正確**：附表三規定 500 Hz 的最大背景噪音量為 40 dB。低頻最難隔絕，勞研所調查多數不合格發生在 500 Hz 以下。","**正確**：1000 Hz 的最大背景噪音量為 40 dB，與 500 Hz 相同。","**錯誤（本題答案）**：2000 Hz 的最大背景噪音量是 47 dB，不是 50 dB。回憶版常把 2000 Hz 寫成 50、4000 Hz 寫成 60 來設陷阱（正確為 47 與 57）。","**正確**：8000 Hz 的最大背景噪音量為 62 dB，是五個頻率中最寬鬆的值（頻率愈高容許背景噪音愈大）。"],"explanation":"本題考聽力檢查室（亭）可容許最大背景噪音量。辦理勞工體格與健康檢查醫療機構認可及管理辦法附表三：八音度頻帶中心頻率 500 Hz 40 dB、1000 Hz 40 dB、2000 Hz 47 dB、4000 Hz 57 dB、8000 Hz 62 dB。記法「40、40、47、57、62」，頻率愈高容許值愈大，因為背景噪音對低頻檢查的影響大於高頻，且聽力檢查室較無法阻隔低頻。相關規定：申請辦理噪音作業特殊健檢的認可醫療機構，須檢附聽力檢查室背景噪音符合附表三之最近三年內檢測證明（認可辦法第 9 條），並聘有耳鼻喉科或職業醫學科專科醫師（第 7 條）；巡迴健檢須自備或租用移動式聽力檢查室（亭）。認定指引另提到勞研所調查若用較嚴的 ANSI 1991 標準只有 37% 檢查室全部合格、多數不合格在 500 Hz 以下，健檢巡迴車內的背景噪音幾乎都高於醫院聽力室；聽力所設置標準則要求隔音室全音頻音壓值在 30 dB 以下。","dispute":"","review":{"key_points":["附表三背景噪音上限：==500 Hz 40、1000 Hz 40、2000 Hz 47、4000 Hz 57、8000 Hz 62 dB==","陷阱數字：2000 Hz 寫 50、4000 Hz 寫 60 都是錯","申請噪音類別須附最近三年內背景噪音檢測證明＋耳鼻喉科或職醫專科醫師"],"refs":[{"src":"0000321374","file":"_ref/annex_n40/0000321374.txt","quote":"500 40 1000 40 2000 47 4000 57 8000 62"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"聽力檢查室可容許最大背景噪音量符合附表三之最近三年內檢測證明影本"}],"note_ref":"五、聽力檢查的法定頻率、檢查前準備與聽力室標準"}},{"qid":"c05q19","q":"有關噪音作業特殊健康檢查之執行，下列敘述何者正確？","options":["聽力檢查必須由耳鼻喉科專科醫師親自執行","聽力檢查可由受過訓練之行政人員執行","執行聽力檢查時，8000 Hz 之背景噪音最大容許值為 62 dB","噪音作業定期健康檢查之管理分級判讀，可由耳鼻喉科專科醫師為之"],"answer":2,"recon":"full","src":["113-2","113-3","113-8","114-05","115-02"],"optexp":["**錯誤**：認可辦法只要求辦理噪音作業健檢的機構「聘有」耳鼻喉科或職業醫學科專科醫師（第 7 條），聽力檢查本身由聽力師等醫事人員執行即可，不須耳鼻喉科醫師親自操作。","**錯誤**：認可辦法第 17 條規定檢查應由該機構聘僱且執業登記之醫事人員為之（噪音作業聽力檢查之聽力師得經事先報准支援）；行政人員不是醫事人員，不得執行聽力檢查。","**正確（本題答案）**：附表三聽力檢查室可容許最大背景噪音量 8000 Hz 為 62 dB（500／1000 Hz 40、2000 Hz 47、4000 Hz 57 dB）。","**錯誤**：認可辦法第 16 條：特別危害健康作業定期健康檢查管理分級之判讀，應由職業醫學科專科醫師為之；耳鼻喉科專科醫師可判讀聽力圖，但不能做分級判讀（115-02 回憶版此選項即標為錯）。"],"explanation":"本題考噪音作業特殊健檢在認可醫療機構端的人力與設備規定，三個層次要分清楚。第一層「機構資格」（認可辦法第 7 條）：辦理噪音作業類別須聘有耳鼻喉科專科醫師或職業醫學科專科醫師，聽力檢查室背景噪音符合附表三（8000 Hz 62 dB 等），巡迴健檢須有移動式聽力檢查室（亭）。第二層「誰執行檢查」（第 17 條）：應由該機構聘僱且執業登記之醫事人員為之，噪音作業的聽力師與做分級判讀的醫師得經事先報准到該機構辦理；行政人員不是醫事人員，不得執行。第三層「誰判讀分級」（第 16 條）：特別危害健康作業定期健康檢查管理分級之判讀，應由職業醫學科專科醫師為之，所以耳鼻喉科醫師即使判讀聽力圖，管理分級仍須由職醫為之。分級指引第三級也要求到有合格聽力室並僱有聽力檢查訓練合格人員的醫療院所複檢聽力圖後，委請職業醫學科醫師評估與工作的相關性。此外第 14 條要求辦理健檢的醫師接受在職訓練（每三年至少 10 小時，網路課程至多 5 小時；職醫專科醫師每三年至少 2 小時）。","dispute":"","review":{"key_points":["機構須==聘有耳鼻喉科或職醫專科醫師==＋聽力室符合附表三（第 7 條）","聽力檢查由醫事人員（聽力師等）執行，不得由行政人員執行（第 17 條）","定期特殊健檢==管理分級判讀應由職業醫學科專科醫師==為之（第 16 條）"],"refs":[{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"辦理勞工健康保護規則第二條附表一所定特別危害健康作業定期健康檢查管理分級之判讀，應由職業醫學科專科醫師為之"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"聘有耳鼻喉科專科醫師或職業醫學科專科醫師"}],"note_ref":"七、分級管理與認可醫療機構的人力規定"}},{"qid":"c05q20","q":"在持續或間斷的噪音暴露環境下，噪音引起的聽力損失在暴露後多久期間內進展最快？","options":["1–2 年","5 年內","10–15 年","20 年以上"],"answer":2,"recon":"full","src":["113-2","113-7","113-8","113-11","114-01","114-03","114-05"],"optexp":["**不符合**：1–2 年還在誘導期附近；指引指出從噪音暴露到永久性聽損的誘導期約半年以上，最初幾年損失才開始累積，並非進展最快的階段。","**不符合**：「最初 5 年內發生」是指損失開始出現的時間（職業性聽損多發生在暴露的最初 5 年，之後 8–10 年加重），題目問的是進展「最快」的期間。","**符合／正確（本題答案）**：認定指引引 ACOEM 2018：在持續或間斷的噪音暴露環境下，噪音引起的聽力損失通常在 10 至 15 年進展最快，其後因閾值升高而減緩；輔助基準也寫持續穩定暴露下通常在 10 至 15 年後達到極限。","**不符合**：20 年以上時噪音性聽損已趨於平緩甚至達極限，此時仍加速惡化的反而是年齡因素（老年性聽損隨時間加速），不是噪音。"],"explanation":"本題考噪音性聽損的病程時序，指引裡有三組數字要分開記。第一組「開始」：從噪音暴露（140 dBA 以下）到產生永久性聽損的誘導期約半年以上；一般而言職業性聽損發生在噪音暴露的最初 5 年內，並可能在接下來的 8–10 年內加重，所以若暴露 5–10 年內都沒有聽損，之後新發生的聽損要仔細排除非職業因素。第二組「最快」：持續或間斷暴露下，噪音引起的聽損通常在 10 至 15 年進展最快，之後因聽力閾值升高而減緩（輔助基準：持續穩定暴露下 10 至 15 年後達到極限），這與老年性聽損隨時間加速的特性不同。第三組「停止」：停止噪音暴露後噪音性聽損通常不再進行，若停止暴露一年後仍持續惡化且超過預期的老年性變化，應重新評估是否為職業性。回憶版另一種問法「連續性噪音暴露多久達最大聽力損失」答 15 年，就是第二組的極限值。另記：3 dB 原則，TWA 每增加 3 分貝暴露強度加倍、聽損發生時間縮短一半（85 dBA 5 年→88 dBA 2.5 年）。","dispute":"","review":{"key_points":["職業性聽損多在暴露==最初 5 年==發生，其後 8–10 年加重；誘導期約半年以上","持續／間斷暴露下 ==10–15 年進展最快==，之後減緩、達極限","停止暴露後噪音性聽損不再進行；88 dBA 年資 2.5 年就可能致聽損（3 dB 加倍）"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"在持續、穩定的噪音暴露環境下噪音引起的聽力損失通常在 10 至 15 年後達到噪音引起的聽力損失的極限"},{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"職業性聽力損失會發生在噪音暴露的最初 5 年內，而且可能在接下來的 8~10 年內聽力損失加重"}],"note_ref":"四、職業性聽力損失的診斷判讀標準（認定指引 114.8）"}},{"qid":"c05q21","q":"下列何者「不會」加重噪音對勞工聽力的危害？","options":["糖尿病","痛風","年齡大於 40 歲","抽菸"],"answer":1,"recon":"full","src":["113-10","114-03"],"optexp":["**正確（會加重）**：糖尿病是認定指引明列可影響支配毛細胞神經纖維、造成感覺神經性聽損的代謝性疾病，會與噪音效應疊加。","**錯誤（本題答案，不會加重）**：痛風（高尿酸）與聽力損失沒有已知關聯，指引的加重因子與鑑別疾病清單中都沒有痛風。","**正確（會加重）**：年齡增長帶來老年性聽損（presbycusis），高頻損失與噪音效應疊加，40 歲以上聽力常模閾值已明顯上升，年長者也難以區分噪音效應。","**正確（會加重）**：抽菸是聽損的獨立危險因子，美國 OSHA 2018 耳毒性化學物質表把菸草煙霧與一氧化碳、氰化氫並列為窒息氣體類耳毒物。"],"explanation":"本題考會加重噪音對聽力危害的共同因子，要記「哪些會、哪些不會」。認定指引列出的相關因素：代謝性疾病（糖尿病、甲狀腺機能低下、腎衰竭）、老化、自體免疫疾病、遺傳、頭部或耳部外傷、耳部感染、耳毒性藥物；化學物共同暴露方面，同時暴露苯乙烯與噪音使 NIHL 風險增加達 4 倍，鉛、甲苯、二硫化碳與噪音共同暴露也增加聽損風險；美國 OSHA 2018 耳毒性化學物質表列有藥品（aminoglycosides、loop diuretics、水楊酸、奎寧、cisplatin）、溶劑（二硫化碳、正己烷、甲苯、二甲苯、苯乙烯、三氯乙烯）、窒息氣體（一氧化碳、氰化氫、菸草煙霧）、腈類與金屬（汞、鉛、有機錫、二氧化鍺）；振動與高血脂也常被教科書列為協同因子。痛風不在任何清單內。113-10 回憶版把題幹寫成「會加重」而答案標痛風，【整理】版本題幹為「不會加重」答痛風，兩者對照後題意應為「不會加重」，本題已依此校正。","dispute":"","review":{"key_points":["加重因子：==糖尿病、年齡、抽菸==、耳毒性藥物、有機溶劑（苯乙烯、甲苯、二硫化碳）、鉛、汞、振動","苯乙烯＋噪音共同暴露使 NIHL 風險增加達 4 倍","==痛風==與聽力損失無關"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"糖尿病、甲狀腺機能低下、老化、自體免疫疾病……等等，可能會影響到支配毛細胞的神經纖維"},{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"窒息氣體 一氧化碳、氰化氫及其鹽類、菸草煙霧"}],"note_ref":"六、鑑別診斷：音叉試驗、梅尼爾氏症、老年性聽損與加重因子"}},{"qid":"c05q22","q":"下列藥物何者「不會」造成聽力損失？","options":["奎寧（quinine）","水楊酸類（salicylates）","胺基醣苷類抗生素（aminoglycosides）","二甲雙胍（metformin）"],"answer":3,"recon":"full","src":["113-2","114-03"],"optexp":["**正確（會造成）**：奎寧是抗瘧藥，屬耳毒性藥物，OSHA 表列於止痛退燒類（salicylates, quinine, chloroquine）；可造成耳鳴與感音性聽損。","**正確（會造成）**：水楊酸類（aspirin）高劑量會造成可逆的耳鳴與聽損，附表十噪音作業既往病史調查即明列「服用傷害聽覺神經藥物（如水楊酸或鏈黴素類）」。","**正確（會造成）**：胺基醣苷類抗生素（鏈黴素、gentamicin、neomycin、kanamycin）是最典型的耳毒性藥物，破壞耳蝸與前庭毛細胞，造成不可逆聽損。","**錯誤（本題答案，不會造成）**：二甲雙胍（metformin）是口服降血糖藥，沒有耳毒性，不在任何耳毒性藥物清單中。"],"explanation":"本題考耳毒性藥物，是噪音作業既往病史調查的法定項目（附表十：服用傷害聽覺神經藥物如水楊酸或鏈黴素類、外傷、耳部感染及遺傳所引起之聽力障礙）。認定指引列舉：水楊酸、氨基苷類抗生素（鏈黴素、gentamycin、neomycin、kanamycin）、erythromycin、vancomycin、抗癌藥、抗瘧藥、利尿劑；OSHA 2018 表：抗生素（streptomycin、gentamycin、tetracyclines）、利尿劑（furosemide、ethacrynic acid）、止痛退燒藥（salicylates、quinine、chloroquine）、化療藥（cisplatin、carboplatin、bleomycin）。記法「aminoglycoside 與 cisplatin 不可逆；aspirin、quinine、loop diuretic 多為可逆」。藥物性聽損與噪音性同為感音型，分級指引第二級把藥物引起的非職業性聽損列為可由工作外原因解釋的例子。metformin、一般降血壓藥不具耳毒性。","dispute":"","review":{"key_points":["法定病史調查：服用傷害聽覺神經藥物（==水楊酸或鏈黴素類==）","耳毒性藥物：aminoglycosides、loop diuretics、salicylates、quinine、cisplatin、vancomycin","metformin 無耳毒性；藥物性聽損屬可由工作以外原因解釋→第二級"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"傷害聽覺藥物很多，如水楊酸、氨基苷類抗生素(鏈徽素、Gentamycin、Neomycin、Kanamycin 等)"},{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"止痛藥或退燒藥，如：salicylates, quinine, chloroquine"}],"note_ref":"六、鑑別診斷：音叉試驗、梅尼爾氏症、老年性聽損與加重因子"}},{"qid":"c05q23","q":"從事噪音作業之勞工因外耳炎而無法配戴聽力防護具時，下列做法何者正確？","options":["不佩戴防護具，繼續原噪音作業","暫時停止噪音作業或調離噪音暴露，待外耳炎治癒後再恢復","改以棉花塞耳代替耳塞","延長每日暴露時間以加速適應"],"answer":1,"recon":"rebuilt","src":["115-01"],"optexp":["**不符合**：設施規則第 300 條規定超過 85 分貝或劑量 50% 時雇主應使勞工戴用有效之防音防護具，無法有效防護卻繼續原噪音作業，會讓勞工暴露於超過容許值的噪音。","**符合／正確（本題答案）**：無法配戴防護具時應暫時停止噪音作業或調離噪音暴露，待外耳炎治癒可重新配戴後再恢復；這也符合聽力保護措施中「噪音危害控制」與「健康檢查及管理」的精神。","**不符合**：棉花沒有足夠的噪音衰減效果，不是有效之防音防護具；且外耳炎期間塞入異物會加重感染。","**不符合**：延長暴露時間只會增加噪音劑量，噪音性聽損沒有「適應」可言，暫時性閾值改變反覆發生就是永久性聽損的風險指標。"],"explanation":"本題考噪音作業勞工無法使用防護具時的處置原則，依據是設施規則第 300 條與第 300 條之 1。法規邏輯是：超過 85 分貝或劑量 50% 的工作場所，雇主必須讓勞工戴用「有效」的耳塞、耳罩等防音防護具，並依第 300 條之 1 採取聽力保護措施（噪音監測及暴露評估、噪音危害控制、防音防護具之選用及佩戴、聽力保護教育訓練、健康檢查及管理、成效評估及改善）。當勞工因外耳炎、耳道異常而無法配戴耳塞，防護鏈就斷了，唯一符合法規的做法是暫時停止噪音作業或調離噪音暴露（也可考慮改用耳罩），治癒後再恢復；不能不戴繼續作業、不能用棉花等無防音效果的物品替代、更不能靠延長暴露「適應」。認定指引也提醒噪音作業因需配戴耳塞，勞工若不注意個人衛生或常以棉花棒清潔外耳道容易造成外耳道發炎或黴菌感染，而耳道檢查是特殊健檢的法定項目，健檢時發現外耳炎就應處理並暫緩聽力檢查。115-01 回憶版只記得選項 A 與 B，其餘為重建。","dispute":"","review":{"key_points":["超過 85 dB／劑量 50%：雇主應使勞工戴用==有效之==防音防護具，無法配戴即==暫時調離或停止噪音作業==","棉花無防音效果；噪音無「適應」","耳塞佩戴不衛生易致外耳炎、黴菌感染；耳道檢查為法定項目"],"refs":[{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"噪音作業因需配戴耳塞，作業員工若未能注意個人衛生或常以棉花棒清潔外耳道，容易造成外耳道發炎"},{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"雇主應使勞工戴用有效之耳塞、耳罩等防音防護具"}],"note_ref":"二、聽力保護計畫與作業環境監測（第 300-1 條、環測辦法）"}},{"qid":"c05q24","q":"依職業安全衛生設施規則第 300 條之 1，事業單位勞工人數達多少人以上者，雇主應依作業環境特性訂定聽力保護計畫據以執行？","options":["30 人","50 人","100 人","300 人"],"answer":2,"recon":"full","src":["整理-表格"],"optexp":["**不符合**：30 人是職業安全衛生管理等法規中常見的門檻（如勞工健康服務、安全衛生組織），不是聽力保護計畫的門檻。","**不符合**：50 人是勞工健康保護規則中僱用或特約醫護人員辦理勞工健康服務的起算門檻（舊版第 4 條：50 人以上未達 300 人者應特約醫護人員臨場服務），與聽力保護計畫無關。","**符合／正確（本題答案）**：設施規則第 300 條之 1 第 2 項：事業單位勞工人數達 100 人以上者，雇主應依作業環境特性訂定聽力保護計畫據以執行；未滿 100 人者得以執行紀錄或文件代替。","**不符合**：300 人是勞工健康保護規則規定應僱用或特約醫護人員從事勞工健康服務的門檻，與本條無關。"],"explanation":"本題考設施規則第 300 條之 1 聽力保護措施與聽力保護計畫。適用場所：勞工八小時日時量平均音壓級超過 85 分貝或暴露劑量超過 50% 之工作場所（與防護具門檻相同）。六項聽力保護措施：一、噪音監測及暴露評估；二、噪音危害控制；三、防音防護具之選用及佩戴；四、聽力保護教育訓練；五、健康檢查及管理；六、成效評估及改善；應作成執行紀錄並留存三年。計畫門檻：事業單位勞工人數達 100 人以上者應依作業環境特性訂定聽力保護計畫據以執行，未滿 100 人者得以執行紀錄或文件代替。記法「85 分貝啟動六措施、100 人要寫成計畫、紀錄留三年」。這條與勞工健康保護規則的人數門檻（50 人特約、300 人僱用醫護）容易混淆，本題只認 100 人。另外，分級指引第四級在早期噪音性聽損時會加註「事業單位須進行聽力防護計畫」，符合 2.2 者加註「須進行聽力防護及配工計畫」，就是要求雇主落實本條。","dispute":"","review":{"key_points":["聽力保護措施門檻：==超過 85 分貝或劑量 50%==，六項措施，紀錄==留存三年==","勞工人數==達 100 人以上==應訂定聽力保護計畫；未滿 100 人得以執行紀錄或文件代替","六項：監測評估、危害控制、防護具選用佩戴、教育訓練、健檢管理、成效評估改善"],"refs":[{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"事業單位勞工人數達一百人以上者，雇主應依作業環境特性，訂定聽力保護計畫據以執行"},{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"應採取下列聽力保護措施，作成執行紀錄並留存三年"}],"note_ref":"二、聽力保護計畫與作業環境監測（第 300-1 條、環測辦法）"}},{"qid":"c05q25","q":"依職業安全衛生設施規則，勞工任何時間不得暴露於峰值超過多少分貝之衝擊性噪音，或多少分貝之連續性噪音？","options":["120 分貝；100 分貝","130 分貝；110 分貝","140 分貝；115 分貝","150 分貝；120 分貝"],"answer":2,"recon":"full","src":["整理-表格"],"optexp":["**不符合**：120／100 分貝不是法規數字；100 dBA 只是容許暴露 2 小時的音壓級，不是任何瞬間上限。","**不符合**：130／110 分貝不是法規數字；110 dBA 對應容許暴露二分之一小時。","**符合／正確（本題答案）**：設施規則第 300 條第 1 款：任何時間不得暴露於峰值超過 140 分貝之衝擊性噪音或 115 分貝之連續性噪音。115 dBA 同時是對照表最後一列（四分之一小時）。","**不符合**：150／120 分貝超過法規上限；140 dB 以上的音壓能量已可瞬間撕裂柯氏器與基底膜造成聲創傷。"],"explanation":"本題考噪音的兩個瞬間上限：衝擊性噪音峰值 140 分貝、連續性噪音 115 分貝，任何時間都不得超過（設施規則第 300 條第 1 款）。這兩個數字與容許暴露時間表是不同層次：對照表管的是「八小時日時量平均」與「累積劑量」，而 140／115 是無論時間長短都不得暴露的絕對上限，115 dBA 也剛好是對照表最後一列（容許四分之一小時）。醫學上的意義：認定指引把噪音造成的聽損分兩種——噪音強度超過 140 dB 時音壓能量能瞬間使耳蝸柯氏器（organ of Corti）與基底膜產生撕裂性傷害造成永久性聽損，稱聲創傷（acoustic trauma），常伴耳鳴、多見於爆破作業，可呈單耳突發、最長潛伏期 2 天，聽力圖可為 4K／6K 凹陷或（合併中耳受傷時）平坦型混合性聽損；長久暴露在 85–140 dB 之間造成的才是一般所稱的噪音性聽力損失（NIHL），數年內慢慢發生、絕少突發。衝擊性噪音測定要用峰值回應並測總劑量，尖峰間隔在一秒以上時分別計算。","dispute":"","review":{"key_points":["任何時間不得暴露：==衝擊性噪音峰值 140 分貝==、==連續性噪音 115 分貝==",">140 dB＝聲創傷（瞬間撕裂柯氏器、基底膜，可單耳突發，潛伏期最長 2 天）","85–140 dB 長期暴露＝噪音性聽力損失（漸進、對稱、絕少突發）"],"refs":[{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"任何時間不得暴露於峰值超過一百四十分貝之衝擊性噪音或一百十五分貝之連續性噪音"},{"src":"認定指引_聽力損失_clean","file":"_ref/認定指引_聽力損失_clean.txt","quote":"噪音的強度超過 140 dB 以上時，音壓所產生的能量能在瞬間使耳蝸的高氏器官(organ of Corti)與基底膜"}],"note_ref":"一、噪音法規三門檻與容許暴露時間（設施規則第 300 條）"}}]},{"idx":5,"order":5,"title":"高溫、游離輻射、異常氣壓與振動","group":"物理性危害","gi":1,"notes_md":"本章每回約 3–5 題，考點分散：熱傷害分級與高溫作業標準（WBGT、飲用水食鹽、熱適應）、游離輻射的血液變化與 CML、附表十二配工考量疾病（高架的貧血、高溫的皮膚病）、異常氣壓的長骨 X 光條件與減壓病分型、全身／局部振動的職業病，以及高架與重體力作業的數字。\n\n## 一、熱傷害分類與高溫作業勞工作息時間標準\n\n| 熱傷害 | 機轉 | 關鍵表現 |\n|---|---|---|\n| 熱痙攣 | 流汗失鈉、只補水→低血鈉 | 肌肉痛性痙攣，意識清、體溫正常 |\n| 熱暈厥 | 久站、皮膚血管擴張→姿勢性低血壓 | 短暫昏厥，排除性診斷 |\n| 熱衰竭 | 水分與電解質大量流失→血容積不足 | 虛弱口渴噁心、皮膚濕冷、血壓低脈快，==神智清、體溫正常或稍高== |\n| ==中暑== | 體溫調節失效＋內生性產熱 | ==核心體溫 >40℃＋中樞神經異常==；橫紋肌溶解、AKI、肝衰竭、DIC，死亡率五至七成 |\n\n- 職場中暑屬==運動型（exertional）==；熱適應約需==一週（7–14 天）==，停止數日即減弱，第 6 條之 1 要求對首次從事者規劃熱適應期間。\n- 高溫作業標準：第 2 條列鍋爐房、灼熱金屬壓軋鍛造、鑄造、金屬加熱熔煉、搪瓷玻璃電石熔爐、蒸汽火車輪船機房、蒸汽操作燒窯（自動化且無暴露者除外）；第 3 條 WBGT（日曬）＝0.7 濕球＋0.2 黑球＋0.1 乾球、（無日曬）＝0.7 濕球＋0.3 黑球；第 4 條輕（坐立姿手臂操作）／中度（走動提舉）／重（鏟掘推）工作；第 5 條連續暴露以每小時、間歇以二小時計算時量平均 WBGT，對照表分配作息：\n\n| 時量平均 WBGT ℃ | 連續作業 | 25% 休息 | 50% 休息 | 75% 休息 |\n|---|---|---|---|---|\n| 輕工作 | 30.6 | 31.4 | 32.2 | 33.0 |\n| 中度工作 | 28.0 | 29.4 | 31.1 | 32.6 |\n| 重工作 | 25.9 | 27.9 | 30.0 | 32.1 |\n\n- 第 6 條接近==黑球溫度 50℃ 以上==灼熱物體才須供給身體熱防護設備；第 9 條充分供應==飲用水及食鹽==；環測每 3 個月測 WBGT。\n- 附表十高溫檢查：血糖、BUN、肌酸酐、鈉鉀氯、血色素、尿蛋白尿潛血、肺功能、心電圖；分級異常表現：熱紅疹、高 BUN、血鈉血鉀異常、蛋白尿二價、高血色素。\n\n## 二、游離輻射：血液學變化、癌症潛伏期、劑量限度與法定檢查\n\n- 造血系統最敏感，順序 ==淋巴球（數小時）→嗜中性球→血小板→紅血球==；絕對淋巴球數可推估劑量（>5 Gy 五天內近零）。急性輻射症候群：0.1–1 Gy 輕微期、1–8 Gy 造血、8–30 Gy 胃腸、>30 Gy 中樞神經。\n- 白血病：==游離輻射→CML==（原爆資料）、苯→AML、==CLL 與輻射無關==；白血病是潛伏期最短的輻射癌症（誘導期約 2 年，需累積 1 Sv），甲狀腺癌與骨癌誘導期約 5 年，皮膚癌 10 年，固態瘤多 >10 年；白內障誘導期 1 年、潛伏期 5 年。\n- 劑量限度（游離輻射防護安全標準第 7 條）：==五年 100 mSv（年均 20）、單一年度 ≤50 mSv==；眼球水晶體 150 mSv／年（新制下修）、皮膚四肢 500 mSv／年；==單次意外暴露 >50 mSv== 應予特別醫務監護（防護法第 16 條）。\n- 暴露族群：介入性心導管醫師、非破壞性檢測（107–108 年群聚白血病）、核電廠高；手術室偶爾 C-arm 低。110 年游離輻射健檢 46,240 人次，是有血液檢查的作業中人數最多者（噪音 153,986 最多但無血液項目）。\n- 法定檢查：血液皮膚胃腸肺眼內分泌生殖病史；頭頸眼（含白內障）皮膚心肺甲狀腺神經消化泌尿骨關節身體檢查；心智精神檢查；胸部 X 光；==甲狀腺功能 free T4、TSH==；ALT 與肌酸酐；CBC 含白血球分類與血小板；尿液。肺功能：體格檢查有；定期健檢只有==核能電廠或廢料貯存場==勞工增列。分級依據：血球減少（特別是淋巴球）、疑似白血病、甲狀腺低下或甲狀腺癌、輻射性皮膚炎、肺纖維化、骨癌、白內障。\n- 非游離輻射：==紅外線→玻璃工白內障==（玻璃、煉鋼、焊接）；紫外線→電焊眼、皮膚癌；雷射→視網膜光傷害；附表十二非游離輻射考量眼睛疾病、內分泌系統疾病。\n\n## 三、異常氣壓作業：減壓病三型與長骨 X 光\n\n- 第一型（輕微）：疲倦、皮膚癢、紅疹、皮下氣腫、==關節痛最常見（80–85%）==；第二型（嚴重）：中樞神經、脊髓、視聽平衡、呼吸、心血管、休克，==50% 於 5 分鐘內、90% 於 6 小時內發病==；第三型（慢性）：==骨端無菌性壞死==（髖骨、脛骨、肱骨）。\n- 附表十：體格檢查做==抗壓力檢查、耐氧試驗==（不做長骨 X 光）；健康檢查==年資達 5 年且肩、髖關節有問題==者做關節部長骨 X 光（變更作業者無須）；變更作業者增列抗壓力與耐氧試驗；40 歲以上或疑心臟病做 ECG；病史含自發性氣胸、耳部手術、氣喘、癲癇、類固醇、肱骨股骨骨折。\n- 認可機構須有高壓氧設備；考量疾病含貧血、肥胖症、疝氣、耳鼻科疾病、消化道疾病。\n\n## 四、振動作業：全身振動與局部振動的職業病\n\n- ==全身振動==（駕駛、重機械、堆高機、飛行員）：脊椎共振 ==4–5 Hz== 最敏感→==腰椎椎間盤突出==（卡車司機風險約 4 倍）；設施規則第 301 條。\n- ==局部振動==（電鑽、鏈鋸、砂輪、碎錘、衝擊扳手、氣動鑽）：約 30–300 Hz→==雷諾氏現象（白指症）==、感覺神經障礙、腕隧道症候群；低溫誘發，手指發白麻木（拇指常不受影響）；認定要常態性使用、約一年後發病、排除原發性雷諾氏病與氯乙烯；設施規則第 302 條。\n- 舉臂過肩（粉刷）→肩旋轉肌袖；電腦→腕隧道等上肢累積性傷害；接觸性皮膚炎與振動無關。\n\n## 五、附表十二選配工時宜考量之疾病（高架、高溫、振動、精密、游離輻射）\n\n| 作業 | 考量之疾病 |\n|---|---|\n| 高架 | ==癲癇==、精神或神經系統疾病、高血壓、心血管疾病、==貧血==、平衡機能失常、呼吸系統疾病、==色盲==、視力不良、聽力障礙、肢體殘障 |\n| 高溫 | 高血壓、心臟病、呼吸系統疾病、內分泌系統疾病（含糖尿病）、==無汗症==、腎臟疾病、==廣泛性皮膚疾病==（無貧血、無高血脂） |\n| 噪音 | 心血管疾病、聽力異常 |\n| 振動 | 周邊神經、周邊循環、骨骼肌肉系統疾病 |\n| 精密 | 矯正後視力 0.8 以下或其他嚴重眼睛疾病 |\n| 游離輻射 | 血液疾病、內分泌疾病、精神與神經異常、眼睛疾病、惡性腫瘤 |\n| 異常氣壓 | 呼吸、高血壓、心血管、精神神經、耳鼻科、過敏、內分泌、肥胖症、疝氣、骨骼肌肉、貧血、眼睛、消化道 |\n| 重體力 | 呼吸、高血壓、心血管、貧血、肝、腎、精神神經、骨骼肌肉、內分泌、視網膜玻璃體、肢體殘障 |\n\n- 備註：精神或神經系統疾病包含癲癇，內分泌系統疾病包含糖尿病；配工有疑慮照會職醫。嚴重貧血最不適合高架作業。\n\n## 六、高架作業與重體力勞動作業的保護標準\n\n- 高架作業定義：無平台護欄 ==2 公尺==以上；有護欄 ==5 公尺==以上；露天自半徑 3 公尺內最低點起算。每連續作業 2 小時休息：==2–5 公尺 20 分鐘、5–20 公尺 25 分鐘、20 公尺以上 35 分鐘==；酒醉、身體虛弱、情緒不穩、自覺不適者不得從事。\n- 重體力勞動作業：==人力搬運或揹負 40 公斤以上==、纜索拉線 40 公斤、薄板壓延 20 公斤、鎚 4.5 公斤、鏟裝 5 公斤、鍛造 10 公斤、雙人澆鑄 80 公斤；休息==每小時不得少於 20 分鐘==；供應飲用水及食鹽。職安法第 30 條禁止妊娠中及分娩後未滿一年女性從事一定重量以上之重物處理。","questions":[{"qid":"c06q01","q":"下列熱傷害何者最嚴重？","options":["熱痙攣","熱暈厥","熱衰竭","中暑"],"answer":3,"recon":"full","src":["113-10","113-11","114-01"],"optexp":["**不符合**：熱痙攣是大量流汗後只補水未補鹽造成的低血鈉，表現為肌肉痛性痙攣，意識清楚、核心體溫正常，補充電解質即可緩解，是最輕的熱傷害之一。","**不符合**：熱暈厥是熱環境中久站，皮膚血管擴張使靜脈血鬱積於下肢造成姿勢性低血壓與短暫腦缺血，平躺後即恢復，屬排除性診斷。","**不符合**：熱衰竭是水分與電解質大量流失造成血容積不足，有虛弱、口渴、噁心、皮膚濕冷、血壓低、脈搏快而弱，但神智清醒、核心體溫正常或稍高，沒有嚴重中樞神經症狀。","**符合／正確（本題答案）**：中暑是熱急症中最嚴重的一種，體溫調節機能被破壞，核心體溫升高至 40℃ 以上並出現中樞神經異常（躁動、意識混亂、癲癇、昏迷），可併發橫紋肌溶解、急性腎損傷、肝衰竭、DIC，延遲治療死亡率可達五至七成。"],"explanation":"本題考四種熱傷害的嚴重度排序與鑑別要點。由輕到重：熱痙攣（電解質流失→肌肉痛性痙攣）、熱暈厥（久站→姿勢性低血壓→短暫昏厥）、熱衰竭（水分與電解質大量流失→血容積不足，虛弱、口渴、噁心、皮膚濕冷、血壓低、脈搏快弱，神智清醒、體溫正常或稍高）、中暑（體溫調節失效，核心體溫 >40℃ 加中樞神經異常）。認定指引強調「可用中樞神經系統症狀的有無來區分熱衰竭和中暑」，中暑另可見心跳快、收縮壓 \u003c100 mmHg、急性腎損傷、肺水腫、2–3 天後肝功能異常、心肌病變、橫紋肌溶解（高血鉀、低血鈣、高血磷、CPK 上升）、早期血小板低下與 PT 延長、晚期 DIC，延遲治療死亡率五至七成。表格版考題「體溫 41 度是什麼熱危害」答中暑。高溫作業特殊健檢的法定項目（飯前血糖、BUN、肌酸酐、鈉鉀氯、血色素、尿蛋白尿潛血、肺功能、心電圖）就是針對這些器官損傷設計。","dispute":"","review":{"key_points":["嚴重度：熱痙攣 \u003c 熱暈厥 \u003c 熱衰竭 \u003c ==中暑==","中暑＝核心體溫 ==>40℃==＋==中樞神經異常==；併發橫紋肌溶解、AKI、肝衰竭、DIC，死亡率五至七成","熱衰竭與中暑的分界：有無嚴重中樞神經症狀；熱衰竭體溫正常或稍高"],"refs":[{"src":"8職業暴露熱危害引起之職業疾病認定參考指引","file":"_ref/認定指引/all/8職業暴露熱危害引起之職業疾病認定參考指引.txt","quote":"中暑是熱急症中最嚴重的一種，主要機轉是熱的調節機能被破壞和內源性的熱量產生增加"},{"src":"8職業暴露熱危害引起之職業疾病認定參考指引","file":"_ref/認定指引/all/8職業暴露熱危害引起之職業疾病認定參考指引.txt","quote":"可用中樞神經系統症狀的有無來區分熱衰竭和中暑"}],"note_ref":"一、熱傷害分類與高溫作業勞工作息時間標準"}},{"qid":"c06q02","q":"高溫環境下激烈勞動大量流汗，若只補充水分而未補充電解質，最可能引發下列何種熱傷害？","options":["熱痙攣","熱暈厥","熱衰竭","中暑"],"answer":0,"recon":"full","src":["113-4","114-01","114-02"],"optexp":["**符合／正確（本題答案）**：大量流汗同時流失鈉，只補水會稀釋血鈉造成低血鈉，肌肉出現痛性痙攣，即熱痙攣；治療是補充含電解質的液體，預防上高溫作業勞工作息時間標準第 9 條要求雇主充分供應飲用水及食鹽。","**不符合**：熱暈厥的機轉是久站後皮膚血管擴張、血液鬱積於下肢的姿勢性低血壓，與電解質補充無關。","**不符合**：熱衰竭是水分與電解質「都」大量流失造成血容積不足；題幹已補充水分，主要缺的是電解質，典型表現是肌肉痙攣而非循環衰竭。","**不符合**：中暑是體溫調節失效造成核心體溫 >40℃ 與中樞神經異常，不是單純電解質失衡。"],"explanation":"本題考熱痙攣的機轉與法規上的預防措施。激烈勞動流汗每小時可流失 1–2 公升含鈉汗液，只補充白開水會造成稀釋性低血鈉，工作中或工作後的骨骼肌（常見小腿、腹肌）出現痛性痙攣，核心體溫正常、意識清楚，這就是熱痙攣；處置是休息、補充含鹽飲料或靜脈生理食鹽水。法規對應：高溫作業勞工作息時間標準第 9 條規定雇主使勞工從事高溫作業時應充分供應飲用水及食鹽，重體力勞動作業勞工保護措施標準第 5 條也有相同要求；分級指引把低血鉀、低血鈉、腎結石列為高溫作業的慢性危害，第三、四級的判定依據包含血鈉或血鉀值異常、高血中尿素氮、蛋白尿達二價、高血色素值（脫水血液濃縮）與熱紅疹。回憶版另有「高溫作業勞工只補水未補鹽最可能出現什麼」及「雇主應供應什麼」（飲用水及食鹽）兩種問法。","dispute":"","review":{"key_points":["只補水不補鹽→稀釋性低血鈉→==熱痙攣==（意識清楚、體溫正常）","高溫作業標準第 9 條：雇主應充分供應==飲用水及食鹽==","高溫分級異常表現：血鈉／血鉀異常、高 BUN、蛋白尿二價、高血色素、熱紅疹"],"refs":[{"src":"高溫作業勞工作息時間標準","file":"_ref/高溫作業勞工作息時間標準.txt","quote":"雇主使勞工從事高溫作業時，應充分供應飲用水及食鹽"},{"src":"01_高溫作業管理分級參考","file":"_ref/分級指引/01_高溫作業管理分級參考.txt","quote":"其他如不孕症、低血鉀、低血鈉、腎結石等"}],"note_ref":"一、熱傷害分類與高溫作業勞工作息時間標準"}},{"qid":"c06q03","q":"有關中暑與高溫作業之敘述，下列何者正確？","options":["職場中暑的勞工多屬傳統型（classic）而非運動型（exertional）中暑","新進勞工的熱適應只需一天即可完成","中暑的典型表現為高燒、意識不清，並可併發橫紋肌溶解","一般高溫作業均應穿著隔熱防護衣"],"answer":2,"recon":"full","src":["114-02","115-01","115-02"],"optexp":["**錯誤**：職場中暑是勞工在高溫高熱環境從事體力工作、內生性產熱過多造成，屬運動型（勞力型，exertional）中暑；傳統型（classic）多見於熱浪中的老人、小孩與慢性病患。","**錯誤**：熱適應需要一段時間，認定指引寫對於高溫環境的適應約需要一週（回憶版與教科書寫 7–14 天），停止高溫作業數日後適應力即減弱；高溫作業勞工作息時間標準第 6 條之 1 要求雇主對首次從事高溫作業之勞工規劃適當之熱適應期間。","**正確（本題答案）**：中暑的臨床診斷核心是中樞神經異常（躁動、意識混亂、癲癇、昏迷）加上核心體溫 >40℃，並可併發橫紋肌溶解（CPK 升高、高血鉀、低血鈣、高血磷）、急性腎損傷、肝衰竭與 DIC。","**錯誤**：只有操作中須接近黑球溫度 50℃ 以上高溫灼熱物體的勞工，雇主才須供給身體熱防護設備（第 6 條）；一般高溫作業應穿透氣輕便服裝以利散熱，穿隔熱衣反而妨礙排汗。"],"explanation":"本題整合中暑分型、熱適應與高溫作業的防護規定。中暑分兩型：傳統型（classic）發生在熱浪中無法散熱的老人、小孩、慢性病人；運動型（exertional）發生在高溫下從事劇烈體力活動的年輕人與勞工，內生性產熱是主因，職場中暑幾乎都是後者，且更常併發橫紋肌溶解。熱適應（heat acclimatization）：表皮微血管擴張是第一步，之後血漿總量升高、心搏出量增加、心律減緩、汗液生成提早且增多，約需一週（教科書 7–14 天），停止高溫作業數日後即減弱、需要數日再適應；認定指引輔助基準特別提醒未曾於高溫環境作業的新進人員或未經熱適應調配的勞工應特別考量，高溫作業勞工作息時間標準第 6 條之 1（103 年增訂）要求雇主對首次從事高溫作業之勞工規劃適當之熱適應期間。防護設備：第 6 條只針對操作中須接近黑球溫度 50℃ 以上高溫灼熱物體者供給身體熱防護設備，一般高溫作業以透氣輕便服裝、供應飲用水與食鹽、依 WBGT 分配作息為主。","dispute":"","review":{"key_points":["職場中暑＝==運動型（exertional）==；傳統型見於老人、小孩、慢性病患","熱適應==約需一週（7–14 天）==，停止數日即減弱；第 6 條之 1 要求規劃熱適應期間","身體熱防護設備只在接近==黑球溫度 50℃ 以上==灼熱物體時才須供給（第 6 條）"],"refs":[{"src":"8職業暴露熱危害引起之職業疾病認定參考指引","file":"_ref/認定指引/all/8職業暴露熱危害引起之職業疾病認定參考指引.txt","quote":"對於高溫環境的適應，約需要一週的時間"},{"src":"高溫作業勞工作息時間標準","file":"_ref/高溫作業勞工作息時間標準.txt","quote":"勞工於操作中須接近黑球溫度五十度以上高溫灼熱物體者，雇主應供給身體熱防護設備並使勞工確實使用"},{"src":"高溫作業勞工作息時間標準","file":"_ref/高溫作業勞工作息時間標準.txt","quote":"雇主對於首次從事高溫作業之勞工，應規劃適當之熱適應期間"}],"note_ref":"一、熱傷害分類與高溫作業勞工作息時間標準"}},{"qid":"c06q04","q":"依高溫作業勞工作息時間標準，高溫作業勞工之作業與休息時間分配，係依作業種類（輕、中度、重工作）及下列何項指標決定？","options":["勞工之血壓值","勞工之心跳速率","時量平均綜合溫度熱指數（WBGT）","壓力指數"],"answer":2,"recon":"full","src":["114-01","114-02","114-05","整理-表格"],"optexp":["**不符合**：血壓是高溫作業選配工時要考量的個人疾病因素（高血壓），不是法規分配作業與休息時間的環境指標。","**不符合**：心跳速率是生理熱應變的監測指標之一，但高溫作業勞工作息時間標準沒有用它來分配作息。","**符合／正確（本題答案）**：高溫作業勞工作息時間標準第 5 條：連續暴露達一小時以上者以每小時、間歇暴露者以二小時計算時量平均綜合溫度熱指數（WBGT），再依輕、中度、重工作對照表分配連續作業、25%、50%、75% 休息。","**不符合**：法規沒有「壓力指數」這個名詞；熱環境評估用的是綜合溫度熱指數（WBGT），高架、重體力等其他作業標準也不用壓力指數。"],"explanation":"本題考高溫作業勞工作息時間標準的核心：以時量平均綜合溫度熱指數（WBGT）與工作負荷分配作息。第 2 條高溫作業定義：勞工工作日時量平均 WBGT 達第 5 條連續作業規定值以上之鍋爐房、灼熱金屬壓軋鍛造、鑄造間、金屬加熱熔煉、搪瓷玻璃電石熔爐、蒸汽火車輪船機房、蒸汽操作燒窯等作業（已自動化且無暴露之虞者除外）。第 3 條公式：戶外有日曬 WBGT＝0.7×自然濕球＋0.2×黑球＋0.1×乾球；戶內或無日曬 WBGT＝0.7×自然濕球＋0.3×黑球；時量平均 WBGT 依各時段加權平均。第 4 條工作負荷：輕工作（坐姿或立姿手臂操作機器）、中度工作（走動中提舉或推動一般重量物體）、重工作（鏟、掘、推等全身運動）。第 5 條對照表：連續作業上限輕 30.6、中 28.0、重 25.9℃；25% 休息 31.4／29.4／27.9；50% 休息 32.2／31.1／30.0；75% 休息 33.0／32.6／32.1℃。連續暴露達一小時以每小時計算，間歇暴露以二小時計算。環測辦法規定高溫作業場所每三個月監測 WBGT 一次以上。","dispute":"","review":{"key_points":["作息分配依==時量平均 WBGT==＋==工作負荷（輕／中／重）==；連續暴露以每小時、間歇以二小時計算","WBGT（日曬）＝0.7 濕球＋0.2 黑球＋0.1 乾球；（無日曬）＝0.7 濕球＋0.3 黑球","連續作業上限：輕 30.6、中 28.0、重 25.9℃；75% 休息：33.0／32.6／32.1℃","高溫作業場所每 3 個月監測 WBGT 一次"],"refs":[{"src":"高溫作業勞工作息時間標準","file":"_ref/高溫作業勞工作息時間標準.txt","quote":"高溫作業勞工如為連續暴露達一小時以上者，以每小時計算其暴露時量平均綜合溫度熱指數，間歇暴露者，以二小時計算"},{"src":"高溫作業勞工作息時間標準","file":"_ref/高溫作業勞工作息時間標準.txt","quote":"綜合溫度熱指數＝0.7×（自然濕球溫度）＋0.2×（黑球溫度）＋0.1×（乾球溫度）"}],"note_ref":"一、熱傷害分類與高溫作業勞工作息時間標準"}},{"qid":"c06q05","q":"下列何者可以適任高溫作業？","options":["慢性腎臟病，血清肌酸酐 3.8 mg/dL 者","高血壓，血壓 168/102 mmHg 者","總膽固醇 278 mg/dL 者","空腹血糖 258 mg/dL 者"],"answer":2,"recon":"full","src":["115-02","整理-表格"],"optexp":["**不符合**：腎臟疾病是附表十二高溫作業宜考量之疾病；肌酸酐 3.8 mg/dL 已是明顯腎功能不全，高溫脫水與電解質紊亂會使其惡化，分級指引也把腎臟病惡化列為高溫急性危害。","**不符合**：高血壓是高溫作業考量疾病之首，168/102 mmHg 屬控制不良；高溫下血管擴張、心輸出量增加會加重心血管負荷。","**符合／正確（本題答案）**：附表十二高溫作業考量之疾病為高血壓、心臟病、呼吸系統疾病、內分泌系統疾病、無汗症、腎臟疾病、廣泛性皮膚疾病，單純高血脂不在其列，總膽固醇 278 mg/dL 者仍可適任。","**不符合**：內分泌系統疾病依附表十二備註包含糖尿病；空腹血糖 258 mg/dL 為控制不良的糖尿病，高溫會使其惡化（分級指引急性危害：心血管疾病惡化、糖尿病、腎臟病惡化），且附表十飯前血糖是法定檢查項目。"],"explanation":"本題考附表十二「選配工時宜考量疾病之建議表」的高溫作業清單：高血壓、心臟病、呼吸系統疾病、內分泌系統疾病（備註：包含糖尿病）、無汗症、腎臟疾病、廣泛性皮膚疾病；分級指引第二至四級的健康管理附註完全相同，並加上妊娠中勞工之健康保護。這些疾病共同點是影響散熱（無汗症、廣泛性皮膚疾病）、加重心血管負荷（高血壓、心臟病、呼吸系統疾病）或在脫水與電解質紊亂下惡化（腎臟疾病、糖尿病）。高血脂不影響體溫調節，所以不在清單內。附表十高溫作業既往病史調查項目更廣：高血壓、冠狀動脈疾病、肺部疾病、糖尿病、腎臟病、皮膚病、內分泌疾病、膠原病及生育能力，並要調查利尿劑、降血壓藥、鎮定劑、抗痙攣劑、抗血液凝固劑、抗膽鹼激素劑等影響排汗與體液的用藥；法定檢查項目含飯前血糖、BUN、肌酸酐、鈉鉀氯、血色素、尿蛋白尿潛血、肺功能、心電圖。答題時把「不在清單上的病」挑出來即可。","dispute":"","review":{"key_points":["高溫作業考量疾病：==高血壓、心臟病、呼吸系統疾病、內分泌系統疾病（含糖尿病）、無汗症、腎臟疾病、廣泛性皮膚疾病==","高血脂不在清單→可適任","附表十高溫檢查項目：血糖、BUN、Cr、Na/K/Cl、Hb、尿蛋白潛血、肺功能、ECG"],"refs":[{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"病、無汗症、腎臟疾病、廣泛性皮膚疾病"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"精神或神經系統疾病包含癲癇，內分泌系統疾病包含糖尿病"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_cle 、游離輻射：血液學變化、癌症潛伏期、劑量限度與法定檢查"}},{"qid":"c06q07","q":"游離輻射引起之白血病，最常見的類型為何？","options":["急性骨髓性白血病（AML）","急性淋巴性白血病（ALL）","慢性骨髓性白血病（CML）","慢性淋巴性白血病（CLL）"],"answer":2,"recon":"full","src":["113-2","113-11","114-01","114-02","114-05"],"optexp":["**不符合**：AML 與輻射有關，但在課程與考古題的對照中，AML 被定為「苯」引起白血病的代表型；輻射的代表型是 CML。","**不符合**：ALL 雖列於認定指引「游離輻射導致血癌」的疾病證據（急性骨髓性、急性淋巴性、慢性骨髓性），但不是最具代表性的類型。","**符合／正確（本題答案）**：原爆倖存者資料顯示慢性骨髓性白血病（CML）的相對風險上升最顯著，課程與五份回憶版考古題一致以 CML 為游離輻射引起白血病最常見（最具代表性）的類型。","**不符合**：慢性淋巴性白血病（CLL）與游離輻射暴露較無相關，認定指引與 IARC 15 國核電廠工人研究都把 CLL 排除在輻射相關白血病之外。"],"explanation":"本題考「游離輻射→CML、苯→AML、CLL 與輻射無關」這組必背對照。認定指引附錄的台灣勞研所游離輻射導致血癌認定指引草案寫明：血液化驗與骨髓切片確定為血癌，包含急性骨髓性、急性淋巴性、慢性骨髓性；慢性淋巴性血癌與游離輻射曝露較無相關；曝露證據需累積 1 西弗（1000 毫西弗）以上，疾病最小誘導期約 2 年。分級指引完整版引 IARC 2005 年 15 國約 40 萬核電廠勞工研究：除 CLL 以外的白血病 ERR 為 1.93/Sv，實質固態瘤 ERR 0.97/Sv。廣島長崎原爆倖存者的資料中 CML 相對風險上升最明顯，故課程以 CML 為輻射白血病的代表；苯的白血病以 AML 最常見（苯中毒認定指引寫苯造成的白血球減少為顆粒性白血球減少，可發展成 AML、ALL、CML）。回憶版另問「游離輻射早期最常造成的癌症」（白血病，潛伏期最短，見下一題）以及「115-01：非破壞性檢測勞工相繼被診斷白血病」的時事題。","dispute":"","review":{"key_points":["==游離輻射→CML==（原爆資料）；==苯→AML==；==CLL 與輻射無關==","認定指引：輻射血癌含急性骨髓性、急性淋巴性、慢性骨髓性；累積 1 Sv 以上、誘導期約 2 年","IARC 15 國核電廠研究：除 CLL 外白血病 ERR 1.93/Sv"],"refs":[{"src":"13職業曝露游離輻射引起之疾病認定參考指引","file":"_ref/認定指引/all/13職業曝露游離輻射引起之疾病認定參考指引.txt","quote":"包含包含急性骨髓性、急性淋巴性、慢性骨髓性"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"除了慢性淋巴性白血病 (chroniclymphocytic leukaemia) 以外的白血病額外增加風險"}],"note_ref":"二、游離輻射：血液學變化、癌症潛伏期、劑量限度與法定檢查"}},{"qid":"c06q08","q":"游離輻射暴露後，最早（潛伏期最短）出現的癌症為何？","options":["白血病","甲狀腺癌","肺癌","皮膚癌"],"answer":0,"recon":"rebuilt","src":["113-1"],"optexp":["**符合／正確（本題答案）**：白血病是輻射誘發癌症中潛伏期最短者，暴露後約 2 年開始上升、5–7 年達高峰；認定指引與勞研所草案把血癌的最小誘導期定為約 2 年（歐盟 3 年），是所有輻射癌症中最短的。","**不符合**：甲狀腺癌（主要為乳突癌）的誘導期約 5 年，需經 5 年以上才認定與輻射有關，比白血病晚。","**不符合**：肺癌等實質固態瘤潛伏期通常 10 年以上，且吸菸等混淆因子多，不是最早出現的輻射癌症。","**不符合**：皮膚鱗狀上皮細胞癌歐盟標準的最短誘導期為 10 年，且需 15000 毫西弗的高劑量，屬晚發癌症。"],"explanation":"本題考輻射誘發癌症的潛伏期排序：白血病最短、固態腫瘤較長。認定指引附錄整理：血癌（台灣勞研所草案）最小誘導期約 2 年、曝露強度累積 1000 毫西弗以上，歐盟為 3 年；甲狀腺癌誘導期約 5 年，主要為乳突癌，需病理證實；骨癌誘導期約 5 年、累積骨骼 科、開刀房等等）"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"陸續有多位從事非破壞性檢測之勞工，出現有發燒、盜汗、牙齦腫脹等症狀，後相繼被診斷為白血病"}],"note_ref":"二、游離輻射：血液學變化、癌症潛伏期、劑量限度與法定檢查"}},{"qid":"c06q10","q":"下列何種特別危害健康作業之勞工人數最多，且其特殊健康檢查包含血液檢查、可能出現血液相關危害？","options":["苯作業","游離輻射作業","鉛作業","砷作業"],"answer":1,"recon":"full","src":["113-2","113-10","114-04","115-02"],"optexp":["**不符合**：苯作業 110 年受檢 6,769 人次，法定檢查雖含血球計數與白血球分類，但人數遠少於游離輻射作業。","**符合／正確（本題答案）**：游離輻射作業 110 年特殊健檢達 46,240 人次，涵蓋醫療、核能、工業檢測等大量人員，法定檢查包含紅血球數、血色素、血球比容、白血球數、白血球分類及血小板數，分級依據含血球數減少（特別是淋巴球）與疑似白血病。","**不符合**：鉛作業 110 年受檢 13,445 人次，法定檢查含血球比容、血色素、紅血球數與血中鉛，會有貧血問題，但人數約為游離輻射的三分之一。","**不符合**：砷作業 110 年受檢 5,595 人次，法定檢查含血球比容、血色素、紅血球數、白血球數與尿中無機砷，人數在四者中最少。"],"explanation":"本題考特別危害健康作業的受檢人數規模，並結合「檢查含血液項目」的條件。分級指引完整版引用勞動部 110 年統計：噪音作業 153,986 人次（39.27%）是所有作業類別中最多，粉塵 92,352 人次次之，但這兩者法定檢查沒有血液項目；有血液檢查的作業中，游離輻射 46,240 人次最多，其次正己烷 17,162（無血液項目）、鉛 13,445、高溫 12,656、錳 8,222、苯 6,769、砷 5,595、乙基汞與無機汞合計 1,553 人次。游離輻射作業的檢查項目為血液、皮膚、胃腸、肺臟、眼睛、內分泌及生殖系統病史，頭頸眼（含白內障）皮膚心肺甲狀腺神經消化泌尿骨關節身體檢查，心智及精神檢查，胸部 X 光，甲狀腺功能（free T4、TSH），ALT 與肌酸酐，全套血球計數含白血球分類與血小板，尿液檢查；體格檢查另有肺功能，定期檢查只有核能電廠或廢料貯存場勞工要增列肺功能。答題時「人數最多＋血液危害」指向游離輻射；若題目只問「人數最多的特別危害作業」則是噪音。","dispute":"回憶版答案分歧：113-2 與 114-04 回憶答游離輻射作業；113-10 回憶標 (D) 砷作業；115-02 標 (A) 苯作業，後兩者為回憶者自填、未附依據。依分級指引完整版引用的勞動部 110 年統計，游離輻射作業特殊健檢 46,240 人次，鉛 13,445、苯 6,769、砷 5,595 人次，游離輻射遠多於其他三者，且其法定檢查包含全套血球計數與白血球分類、血小板，分級依據含血球數減少（特別是淋巴球）與疑似白血病，符合題幹「人數最多且有血液相關危害」。應試時選游離輻射作業。若題目沒有「血液檢查」條件而只問人數最多的特別危害健康作業，答案是噪音作業（153,986 人次，占 39.27%）。","review":{"key_points":["110 年受檢人次：==噪音 153,986 最多==、粉塵 92,352、==游離輻射 46,240==、正己烷 17,162、鉛 13,445、苯 6,769、砷 5,595","有血液檢查且人數最多＝游離輻射；只問人數最多＝噪音","游離輻射法定檢查：CBC＋白血球分類＋血小板、甲狀腺功能、ALT／Cr、胸部 X 光、心智精神檢查"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"接受游離輻射作業勞工之特殊健康檢查人數，110 年共計 46,240 人次"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"其中噪音作業佔 153,986 人次(39.27%)，是所有作業類別中佔最多人次的作業"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"110 年接受鉛作業特殊健康檢查人次共計 13,445 人次"}],"note_ref":"二、游離輻射：血液學變化、癌症潛伏期、劑量限度與法定檢查"}},{"qid":"c06q11","q":"有關游離輻射作業特殊健康檢查之法定項目，下列何者錯誤？","options":["甲狀腺功能檢查（free T4、TSH）","血清丙胺酸轉胺酶（ALT）及肌酸酐","紅血球數、血色素、白血球數、白血球分類及血小板數","所有游離輻射作業勞工之定期健康檢查均須做肺功能檢查"],"answer":3,"recon":"rebuilt","src":["113-6","113-12"],"optexp":["**正確**：甲狀腺功能檢查（free T4、TSH）是游離輻射作業體格與健康檢查的法定項目，因為甲狀腺照射後會發生功能低下、結節與甲狀腺癌，分級判定依據含甲狀腺功能低下或甲狀腺癌。","**正確**：血清丙胺酸轉胺酶（ALT）及肌酸酐是法定項目；游離輻射可傷害肝細胞與腎臟，113-6 回憶版「游離輻射要驗肝功能嗎」答需要。","**正確**：紅血球數、血色素、血球比容值、白血球數、白血球分類及血小板數是法定項目，用來偵測造血系統的輻射敏感反應（淋巴球先降）。","**錯誤（本題答案）**：肺功能檢查只列在特殊「體格」檢查；定期「健康」檢查依附表十註記，只有核能電廠或廢料貯存場之作業勞工應增列肺功能檢查（新版附表十另加變更作業者），不是所有游離輻射作業勞工。"],"explanation":"本題考游離輻射作業特殊健檢的法定項目，重點是體格檢查與健康檢查的差異。附表十第 3 項共同項目：(1) 作業經歷、生活習慣及自覺症狀調查；(2) 血液、皮膚、胃腸、肺臟、眼睛、內分泌及生殖系統疾病既往病史調查；(3) 頭、頸部、眼睛（含白內障）、皮膚、心臟、肺臟、甲狀腺、神經、消化、泌尿、骨關節肌肉系統身體檢查；(4) 心智及精神檢查；(5) 胸部 X 光（大片）；(6) 甲狀腺功能檢查（free T4、TSH）；(7) ALT 及肌酸酐；(8) 紅血球數、血色素、血球比容值、白血球數、白血球分類及血小板數；(9) 尿蛋白、尿糖、尿潛血及尿沉渣鏡檢。體格檢查多一項肺功能（FVC、FEV1.0）；健康檢查則註明核能電廠或廢料貯存場之作業勞工應增列肺功能檢查（115 年新版附表十再加上變更作業者）。分級指引第三、四級依據：血球數減少（特別是淋巴球）、疑似白血病、甲狀腺功能低下或甲狀腺癌、輻射性皮膚炎或皮膚癌、輻射性肺炎或肺纖維化、骨癌、白內障；第二級例子是肝功能異常可由 B、C 型肝炎、脂肪肝、肥胖、高血脂、喝酒解釋。與其他作業比較：游離輻射是少數同時驗甲狀腺功能與做心智精神檢查的作業。","dispute":"","review":{"key_points":["游離輻射法定項目：==甲狀腺功能（free T4、TSH）、ALT／Cr、CBC＋分類＋血小板、尿液、胸部 X 光、心智精神檢查==","肺功能：體格檢查有；定期健檢只有==核能電廠或廢料貯存場==勞工增列（新版加變更作業者）","分級依據：血球減少（淋巴球）、疑似白血病、甲狀腺低下／甲狀腺癌、輻射性皮膚炎、肺纖維化、白內障"],"refs":[{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"甲狀腺功能檢查 (free T4、TSH)"},{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"如血球數滅少(特別是淋巴球)、疑似白血病"},{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"註：核能電廠或廢料貯存場之作業勞"}],"note_ref":"二、游離輻射：血液學變化、癌症潛伏期、劑量限度與法定檢查"}},{"qid":"c06q12","q":"有關游離輻射作業之職業暴露劑量限度，下列何者正確？","options":["每年有效劑量不得超過 20 毫西弗，且任何單一年度不得超過 50 毫西弗","每年有效劑量不得超過 100 毫西弗","單次意外暴露超過 5 毫西弗即應予特別醫務監護","皮膚等價劑量每年不得超過 50 毫西弗"],"answer":0,"recon":"rebuilt","src":["補充"],"optexp":["**符合／正確（本題答案）**：游離輻射防護安全標準第 7 條（分級指引游離輻射章備註引述）：職業暴露每連續五年週期之有效劑量不得超過 100 毫西弗（平均每年 20 毫西弗），且任何單一年度不得超過 50 毫西弗。","**不符合**：100 毫西弗是「連續五年週期」的累積上限，不是每年的限度；每年上限為 50 毫西弗、五年平均 20 毫西弗。","**不符合**：游離輻射防護法第 16 條規定單次意外暴露劑量超過 50 毫西弗以上才應予特別醫務監護（特別健康檢查、劑量評估、放射性污染清除、必要治療），不是 5 毫西弗。","**不符合**：皮膚或四肢之等價劑量於一年內不得超過 500 毫西弗；50 毫西弗是全身有效劑量的單一年度上限。"],"explanation":"本題考游離輻射職業暴露的劑量限度，數字來自游離輻射防護安全標準第 7 條與游離輻射防護法第 16 條（分級指引游離輻射章備註引述）。有效劑量：每連續五年週期不得超過 100 毫西弗（mSv），即平均每年 20 mSv，且任何單一年度不得超過 50 mSv。等價劑量：眼球水晶體一年內不得超過 150 mSv（整理者註記較新的標準已下修至 50 mSv，但 _ref 內指引仍記載 150），皮膚或四肢一年內不得超過 500 mSv。意外暴露：單次意外暴露劑量超過 50 mSv 以上，應即予以包括特別健康檢查、劑量評估、放射性污染清除、必要治療及其他適當措施之特別醫務監護。認定指引則從疾病端訂最小曝露強度：血癌累積 1000 mSv、骨癌 8000 mSv、白內障（歐盟）10000 mSv X 射線，並提醒隨機效應無閾值。與母性保護連結：女性勞工母性健康保護實施辦法規定有害輻射散布場所之工作依游離輻射防護安全標準辦理；職安法第 30 條禁止妊娠中女性從事有害輻射散布場所之工作。單位換算：1 西弗（Sv）＝1000 毫西弗（mSv），1 Gy 吸收劑量對 X／γ 射線約等於 1 Sv。","dispute":"","review":{"key_points":["職業暴露：==五年 100 mSv（年均 20）、單一年度 ≤50 mSv==","眼球水晶體年 150 mSv（指引數字；新制下修）、皮膚或四肢年 500 mSv","==單次意外暴露 >50 mSv== 應予特別醫務監護（游離輻射防護法第 16 條）"],"refs":[{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"單一年度有效等效劑量不得超過 50 毫西弗(mSv)或每連續五年週期之有效等效劑量超過 100 毫西弗(mSv)"},{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"單次意外暴露劑量超過 50 毫西弗(mSv)以上，應即予以包括特別健康檢查、劑量評估"},{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"眼球水晶體之等效劑量於一年內不得超過150 毫西弗。皮膚或四肢之等效劑量於一年內不得超過 500 毫西弗"}],"note_ref":"二、游離輻射：血液學變化、癌症潛伏期、劑量限度與法定檢查"}},{"qid":"c06q13","q":"焊接、玻璃製造、煉鋼等作業勞工發生白內障，主要與下列何種非游離輻射有關？","options":["紫外線","紅外線","微波","雷射"],"answer":1,"recon":"full","src":["整理-表格"],"optexp":["**不符合**：紫外線波長短、能量高，主要傷害角膜與結膜（電焊眼、雪盲）以及皮膚（光老化、皮膚癌），角膜幾乎吸收全部 UVB，穿透不到水晶體深層，不是玻璃工白內障的主因。","**符合／正確（本題答案）**：紅外線（熱輻射）可穿透角膜被虹膜與水晶體吸收，長期暴露使水晶體蛋白熱變性，形成玻璃工白內障（glassblower's cataract），見於玻璃製造、煉鋼、鑄造、焊接等高溫作業。","**不符合**：微波在動物實驗與高功率意外暴露下可致白內障，但職場一般暴露強度低，非焊接、玻璃、煉鋼作業的相關危害。","**不符合**：雷射的傷害是聚焦於視網膜或角膜的急性熱與光化學損傷（視網膜光傷害認定指引主題），不是慢性白內障的典型原因。"],"explanation":"本題考非游離輻射與眼睛傷害的對應。設施規則第 298 條把紅外線、紫外線、微波、雷射、射頻波列為非游離輻射，雇主應去除危害或採工程控制；附表十二非游離輻射作業宜考量之疾病為眼睛疾病與內分泌系統疾病。對應關係：紅外線（IR）＝熱輻射，長期暴露造成玻璃工白內障（glassblower's cataract），典型職業是玻璃製造、煉鋼、鑄造、鍛造與焊接；紫外線（UV）＝波長短、能量最大，急性造成光角膜結膜炎（電焊眼、雪盲），慢性造成翼狀贅片、皮膚光老化與皮膚癌；微波與射頻波＝組織加熱，高強度可致白內障與睪丸損傷；雷射＝視網膜光傷害（有專屬認定指引）；可見光藍光＝視網膜光化學傷害。與游離輻射比較：X 光、γ 射線也造成白內障，是確定效應（歐盟標準最短誘導期 1 年、潛伏期 5 年），游離輻射作業身體檢查因此明列「眼睛（含白內障）」。表格版考題另問「紫外線波長短能量最大→皮膚癌」，兩題一起記。","dispute":"","review":{"key_points":["==紅外線→玻璃工白內障==（玻璃、煉鋼、鑄造、焊接）","紫外線→角膜結膜炎（電焊眼）、皮膚癌；雷射→視網膜光傷害；微波→高強度時白內障","附表十二非游離輻射作業考量：眼睛疾病、內分泌系統疾病；游離輻射身體檢查含眼睛（含白內障）"],"refs":[{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"超音波及紅外線、紫外線、微波、雷射、射頻波等非游離輻射"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"非游離輻射作業 眼睛疾病、內分泌系統疾病"}],"note_ref":"二、游離輻射：血液學變化、癌症潛伏期、劑量限度與法定檢查"}},{"qid":"c06q14","q":"依勞工健康保護規則附表十，異常氣壓作業勞工之特殊健康檢查，下列敘述何者正確？","options":["從事異常氣壓作業經驗達 1 年者，即應做關節部之長骨 X 光檢查","從事異常氣壓作業經驗達 5 年，且肩、髖關節有問題者，應做關節部之長骨 X 光檢查（變更作業者無須檢測）","特殊體格檢查即應實施長骨 X 光檢查","所有異常氣壓作業勞工每年均須做長骨 X 光檢查"],"answer":1,"recon":"full","src":["113-2","113-12","114-03"],"optexp":["**錯誤**：年資門檻是 5 年，不是 1 年，而且還要合併肩、髖關節有問題才做長骨 X 光。","**正確（本題答案）**：附表十第 4 項健康檢查：從事異常氣壓作業經驗達 5 年，且肩、髖關節有問題者，應做關節部之長骨 X 光檢查（變更作業者無須檢測），目的是找異壓性骨壞死。","**錯誤**：特殊體格檢查不做長骨 X 光，而是做抗壓力檢查與耐氧試驗（變更作業者的健康檢查也增列這兩項）；113-12 回憶版此選項標為錯。","**錯誤**：長骨 X 光有年資與症狀兩個條件，不是所有勞工每年都做；胸部 X 光才是每次都做的項目。"],"explanation":"本題考異常氣壓作業特殊健檢的法定項目，重點在體格檢查與健康檢查的差異及長骨 X 光的條件。共同項目：(1) 作業經歷、生活習慣及自覺症狀調查；(2) 自發性氣胸、耳部手術、活動性氣喘、酒癮、毒癮、癲癇、胰臟炎、精神病、糖尿病、高血壓、開胸手術、偏頭痛、肱骨或股骨曾有骨折及長期服用類固醇等既往病史調查；(3) 胸部 X 光（大片）；(4) 肺功能（FVC、FEV1.0、FEV1.0/FVC）；(5) 年齡 40 歲以上或懷疑有心臟疾病者做心電圖（分級指引加：必要時心臟超音波）；(6) 耳道、心臟血管、呼吸、骨骼關節、神經精神及皮膚身體檢查。體格檢查專屬：(7) 抗壓力檢查、(8) 耐氧試驗。健康檢查專屬：(7) 從事異常氣壓作業經驗達 5 年且肩、髖關節有問題者做關節部之長骨 X 光（變更作業者無須檢測）；註：變更作業者應增列抗壓力檢查、耐氧試驗。長骨 X 光是為了偵測第三型（慢性型）減壓病的異壓性骨壞死，分級指引第三、四級判定依據就有「關節出現異壓性骨壞死，骨 X 光片上形成放射線不透性陰影（radiopacity）」與「胸部 X 光出現和肺部擠壓傷可能相關的異常」。","dispute":"","review":{"key_points":["長骨 X 光：==年資達 5 年＋肩、髖關節有問題==才做（健康檢查；變更作業者無須）","體格檢查專屬：==抗壓力檢查、耐氧試驗==；變更作業者健檢也增列","40 歲以上或懷疑心臟病做 ECG；病史含自發性氣胸、耳部手術、氣喘、癲癇、類固醇、肱骨股骨骨折"],"refs":[{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"從事異常氣壓作業經驗達5年"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"且肩、髖關節有問題者，應做關 節部之長骨Ｘ光檢查(變更作業 者無須檢測)"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"變更作業者應增列抗壓力檢 查、耐氧試驗"}],"note_ref":"三、異常氣壓作業：減壓病三型與長骨 X 光"}},{"qid":"c06q15","q":"有關減壓病之敘述，下列何者正確？","options":["第一型（輕微型）減壓病以關節痛最常見","第二型減壓病只影響皮膚","第三型（慢性型）減壓病之特徵為肺纖維化","減壓病多在回到水面 24 小時後才發病"],"answer":0,"recon":"rebuilt","src":["整理-表格"],"optexp":["**符合／正確（本題答案）**：第一型（輕微型）減壓病是氣泡充塞於皮下組織、關節或肌肉之間，症狀有疲倦、皮膚癢、皮膚紅疹、局部皮下氣腫及關節痛，其中以關節痛最常見，80–85% 患者主訴肌肉關節疼痛。","**不符合**：第二型（嚴重型）是氣泡充塞於神經、呼吸、心血管系統，症狀包括中樞神經（頭痛、意識模糊、抽搐）、視覺、聽覺平衡、呼吸（胸悶、乾咳）、脊髓（下半身麻痺、大小便失禁）與休克，不是只影響皮膚。","**不符合**：第三型（慢性型）的特徵是骨端無菌性壞死（異壓性骨壞死），最常發生在髖骨、脛骨與肱骨，不是肺纖維化。","**不符合**：減壓病發病很快，第二型 50% 在回到水面 5 分鐘內發病，所有減壓病 90% 在 6 小時內發病，第一型 50–60% 在 1 小時內、90% 在 6 小時內；24 小時後才發病者少見。"],"explanation":"本題考減壓病的三型分類與發病時間。認定指引：第一型（輕微型）疲倦、皮膚癢、紅疹、局部皮下氣腫及關節痛，關節痛最常見（80–85%），氣泡在皮下、關節或肌肉，50–60% 於回到水面後 1 小時內、90% 於 6 小時內發病；第二型（嚴重型）氣泡在神經、呼吸、心血管系統，症狀涵蓋中樞神經（頭痛、嘔吐、言語障礙、昏迷、抽搐）、視覺、聽覺平衡（耳鳴、暈眩、眼球震顫）、呼吸（胸悶、乾咳、呼吸困難）、胃腸、知覺運動神經、脊髓（後下背痛、下半身麻痺、大小便失禁）、心血管（休克），50% 於回到水面後 5 分鐘內發病，所有減壓病患者 90% 於 6 小時內發病；第三型（慢性型）為骨端無菌性壞死，最常在髖骨、脛骨、肱骨，反覆減壓的潛水伕與高壓室內作業者相對常見，這就是附表十要求年資 5 年且肩髖關節有問題者做長骨 X 光的理由。分級指引另列加壓期的擠壓症（耳膜、鼻竇）與氣體中毒（氮迷醉、氧、CO、CO2 中毒），慢性危害為異壓性骨壞死與中樞神經退化。治療是高壓氧再加壓，認可醫療機構辦異常氣壓健檢須自備或租用經核准登記的高壓氧設備。","dispute":"","review":{"key_points":["第一型：皮膚癢、紅疹、皮下氣腫、==關節痛最常見（80–85%）==","第二型：中樞神經、脊髓、視聽平衡、呼吸、心血管；==50% 於 5 分鐘內、90% 於 6 小時內發病==","第三型（慢性）：==骨端無菌性壞死==，髖骨、脛骨、肱骨→長骨 X 光"],"refs":[{"src":"異常氣壓-含潛水伕病-作業引起之職業疾病認定參考指引","file":"_ref/認定指引/all/異常氣壓-含潛水伕病-作業引起之職業疾病認定參考指引.txt","quote":"症狀包括疲倦、皮膚癢、皮膚紅疹、局部皮下氣腫及關節痛，其中以關節痛最為常見"},{"src":"異常氣壓-含潛水伕病-作業引起之職業疾病認定參考指引","file":"_ref/認定指引/all/異常氣壓-含潛水伕病-作業引起之職業疾病認定參考指引.txt","quote":"第三型減壓症特色為骨端之無菌性壞死(aseptic necrosis)，此現象最常\f 在髖骨、脛骨以及肱骨發生"},{"src":"異常氣壓-含潛水伕病-作業引起之職業疾病認定參考指引","file":"_ref/認定指引/all/異常氣壓-含潛水伕病-作業引起之職業疾病認定參考指引.txt","quote":"患者中有50%會於回到水面後5分鐘內立即發病。所有減壓病患者中90%於6小時內會發病"}],"note_ref":"三、異常氣壓作業：減壓病三型與長骨 X 光"}},{"qid":"c06q16","q":"長期駕駛車輛或操作重機械之司機，因全身振動暴露最容易發生下列何種職業病？","options":["腰椎椎間盤突出","白指症（雷諾氏現象）","腕隧道症候群","肩旋轉肌袖症候群"],"answer":0,"recon":"full","src":["113-4","113-8","114-03","114-04"],"optexp":["**符合／正確（本題答案）**：坐姿駕駛時振動由臀部傳至脊椎，脊椎對 4–5 Hz 的共振最敏感，長期暴露使椎間盤退化、纖維環斷裂而髓核突出；勞保職業病種類表列有全身振動引起的腰椎椎間盤突出，並有專屬認定參考指引（卡車司機風險為常人 4 倍）。","**不符合**：白指症（雷諾氏現象）是手持振動工具的「局部振動」經手臂傳導造成手指血管痙攣，與駕駛的全身振動不同。","**不符合**：腕隧道症候群與手部重複用力、腕部彎曲及手持振動工具有關，屬上肢局部危害，不是全身振動的目標疾病。","**不符合**：肩旋轉肌袖症候群與手臂反覆舉高過肩（粉刷、裝修）有關，與全身振動無關。"],"explanation":"本題考全身振動與局部振動的職業病對照。全身振動（whole-body vibration）：勞工站或坐在振動源上，振動由足部或臀部傳至全身，人體各部位有不同共振頻率（頭部 4.5–9 Hz、喉部 12–18 Hz、胸腔 5–7 Hz、腹部 4.5–9 Hz），脊椎對 4–5 Hz 最敏感，危害以脊椎與末梢神經最大，其次消化、生殖、心血管與前庭系統；目標疾病是腰椎椎間盤突出，高風險職業為卡車司機、推土機、起重機、壓路機、曳引機、怪手、大型搬運機、農用載具、隧道挖掘機、預拌水泥車、堆高機操作員與小型飛機直升機飛行員；流行病學上駕駛卡車的勝算比 4.7、全身振動 2.4，Kelsey 發現卡車司機椎間盤突出機率為常人 4 倍。局部振動（手臂振動）：手持電鑽、鏈鋸、研磨機等工具，造成手臂振動症候群，包括雷諾氏現象（白指症）、感覺神經障礙與腕隧道症候群。設施規則第 301 條規範全身振動、第 302 條規範局部振動的每日容許暴露時間（局部振動 4 m/s² 可暴露 4–8 小時、12 m/s² 未滿 1 小時）。附表十二振動作業宜考量的疾病為周邊神經系統、周邊循環系統與骨骼肌肉系統疾病。","dispute":"","review":{"key_points":["==全身振動（駕駛、重機械）→腰椎椎間盤突出==，脊椎共振 ==4–5 Hz== 最敏感","==局部振動（手持工具）→白指症、腕隧道症候群==","卡車司機椎間盤突出風險約常人 4 倍；設施規則第 301／302 條規範全身／局部振動容許時間"],"refs":[{"src":"9職業暴露全身振動引起之腰椎椎間盤突出認定參考指引","file":"_ref/認定指引/all/9職業暴露全身振動引起之腰椎椎間盤突出認定參考指引.txt","quote":"脊椎對於頻率4~5Hz 最敏感"},{"src":"9職業暴露全身振動引起之腰椎椎間盤突出認定參考指引","file":"_ref/認定指引/all/9職業暴露全身振動引起之腰椎椎間盤突出認定參考指引.txt","quote":"Kelsey[13]發現卡車司機罹患椎間盤突出症的機率是常人的 4 倍"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"周邊神經系統疾病、周邊循環系統疾病、骨骼肌肉"}],"note_ref":"四、振動作業：全身振動與局部振動的職業病"}},{"qid":"c06q17","q":"下列何者與局部振動引起之雷諾氏現象（職業性白指症）「無關」？","options":["振動頻率 30–300 Hz","接觸性皮膚炎","手指發白、麻木","低溫環境誘發"],"answer":1,"recon":"full","src":["113-11","115-02"],"optexp":["**正確（有關）**：手臂振動症候群主要由頻率約 30–300 Hz 的手持振動工具引起（一般教科書給的危害範圍為 8–1000 Hz，以 30–300 Hz 危害最大），氣動鑽、碎錘、鉚接工具、衝擊扳手、鏈鋸、砂輪都在此範圍。","**錯誤（本題答案，無關）**：接觸性皮膚炎是化學物質或過敏原引起的皮膚發炎，與振動無關；振動引起的是血管、神經與骨骼肌肉問題。","**正確（有關）**：手指血液循環不良是雷諾氏症候群最明顯的症狀，發作時手指漂白或變白（通常不影響拇指）、刺痛與麻木，之後發紅、變暖。","**正確（有關）**：雷諾氏現象在手或全身暴露於冷環境時發生，洗車、握冷方向盤、戶外釣魚、寒冷天氣園藝都會誘發，低溫是典型的誘發因子。"],"explanation":"本題考職業性雷諾氏現象（振動白指症）的要素。認定指引：雷諾氏症候群主要是需長時間使用振動工具或設備的工人，例如氣動鑽、吊裝錘、碎錘、鉚接工具、衝擊扳手、路面破碎機、汽油動力鏈鋸、電動工具與砂輪（特別是底座磨床）；任何振動工具連續使用五分鐘後若感到手指刺痛或麻木感就可能導致雷諾氏症候群。典型發作：寒冷或情緒不安時手指腳趾冰冷、刺痛與麻木、手指漂白變白（通常不影響拇指），回溫後發紅。分期常用 Stockholm 量表分血管與感覺神經兩軸（0SN 無症狀、1SN 間歇性麻木、2SN 感覺知覺減少、3SN 觸覺辨別減少）。認定要件包括常態性（大致每天）使用手持振動工具、開始工作約一年後發病、排除原發性雷諾氏病與結締組織疾病；氯乙烯暴露也會造成雷諾氏現象與指骨溶解，是鑑別時要問的職業史。附表十二振動作業考量疾病：周邊神經系統疾病、周邊循環系統疾病、骨骼肌肉系統疾病；接觸性皮膚炎則屬溶劑、金屬、樹脂等化學作業的考量疾病。","dispute":"","review":{"key_points":["振動白指症：手持振動工具（==約 30–300 Hz==）＋==低溫誘發==→手指發白、麻木、刺痛（拇指常不受影響）","認定：常態性使用振動工具、約一年後發病、排除原發性雷諾氏病與氯乙烯暴露","振動作業考量疾病：周邊神經、周邊循環、骨骼肌肉；接觸性皮膚炎與振動無關"],"refs":[{"src":"21雷諾氏症候群之認定參考指引-10804修正","file":"_ref/認定指引/all/21雷諾氏症候群之認定參考指引-10804修正.txt","quote":"雷諾氏症候群主要是需長時間使用振動工具或設備的工人，例如氣動鑽，吊裝錘，碎錘，鉚接工具，衝擊板手"},{"src":"21雷諾氏症候群之認定參考指引-10804修正","file":"_ref/認定指引/all/21雷諾氏症候群之認定參考指引-10804修正.txt","quote":"手指血液循環不良是雷諾氏症候群最明顯的症狀。在工作、家中或壓力中，當手或全身暴露於冷環境，就會發生"}],"note_ref":"四、振動作業：全身振動與局部振動的職業病"}},{"qid":"c06q18","q":"下列何種作業最容易罹患職業性白指症（振動引起之雷諾氏現象）？","options":["長期使用電鑽、鏈鋸等手持振動工具","長途駕駛車輛","長期粉刷油漆","長時間使用電腦"],"answer":0,"recon":"full","src":["113-12","114-02","115-02"],"optexp":["**符合／正確（本題答案）**：電鑽、鏈鋸、砂輪、碎錘、衝擊扳手等手持振動工具把 30–300 Hz 的振動經手臂傳入，長期使用造成手指血管痙攣與神經病變，是職業性白指症的典型來源。","**不符合**：長途駕駛是全身振動（脊椎共振 4–5 Hz），目標疾病是腰椎椎間盤突出，不是白指症。","**不符合**：長期粉刷油漆是手臂反覆舉高過肩的作業，對應肩旋轉肌袖症候群（及溶劑暴露），與振動無關。","**不符合**：長時間使用電腦是重複性動作與不良腕姿，對應腕隧道症候群等上肢累積性傷害，沒有振動暴露。"],"explanation":"本題考「作業型態→職業病」的對應，是振動、姿勢與重複動作三類人因危害的綜合題。手持振動工具（電鑽、鏈鋸、研磨機、鉚釘槍、氣動鑽）→手臂振動症候群：雷諾氏現象（白指症）、感覺神經障礙、腕隧道症候群，也列於附表十二振動作業考量疾病（周邊神經、周邊循環、骨骼肌肉）。長途駕駛、重機械操作→全身振動→腰椎椎間盤突出（卡車司機風險為常人 4 倍）。手臂反覆舉高過肩（粉刷、天花板裝修）→肩旋轉肌袖症候群；粉刷油漆另有溶劑（甲苯、二甲苯）暴露。長時間電腦作業→腕隧道症候群、頸肩痠痛等上肢累積性傷害，腕隧道症候群認定指引把重複用力、腕部極端姿勢、手持振動工具都列為危害因子。認定指引也列出雷諾氏症候群可見於重複使用手指壓力的打字員與專業鋼琴演奏家，但主要族群仍是振動工具工人。回憶版三份考古題都以「電鑽、鏈鋸等手持振動工具」為答案。","dispute":"","review":{"key_points":["==手持振動工具→白指症==；==駕駛／重機械→椎間盤突出==；==舉臂過肩→肩旋轉肌袖==；==電腦→腕隧道==","振動工具：電鑽、鏈鋸、砂輪、碎錘、衝擊扳手、氣動鑽、鉚接工具","腕隧道症候群危害因子含手持振動工具，兩者可並存"],"refs":[{"src":"21雷諾氏症候群之認定參考指引-10804修正","file":"_ref/認定指引/all/21雷諾氏症候群之認定參考指引-10804修正.txt","quote":"汽油動力鍊鋸，電動工具和砂輪，特別是底座磨床"},{"src":"9職業暴露全身振動引起之腰椎椎間盤突出認定參考指引","file":"_ref/認定指引/all/9職業暴露全身振動引起之腰椎椎間盤突出認定參考指引.txt","quote":"脊椎對於頻率4~5Hz 最敏感"}],"note_ref":"四、振動作業：全身振動與局部振動的職業病"}},{"qid":"c06q19","q":"勞工有嚴重貧血時，最不適合從事下列何種作業？","options":["高架作業","高溫作業","振動作業","精密作業"],"answer":0,"recon":"full","src":["113-2","113-7","113-10","113-11","114-03","114-04"],"optexp":["**符合／正確（本題答案）**：附表十二高架作業宜考量之疾病明列貧血，因為貧血易造成頭暈、體力不支而增加墜落風險；高架作業標準第 8 條也禁止身體虛弱經醫師診斷狀況不良者從事高架作業。","**不符合**：高溫作業考量的是高血壓、心臟病、呼吸系統疾病、內分泌系統疾病、無汗症、腎臟疾病、廣泛性皮膚疾病，清單中沒有貧血（血色素檢查主要看脫水造成的血液濃縮）。","**不符合**：振動作業考量周邊神經系統疾病、周邊循環系統疾病、骨骼肌肉系統疾病，與貧血無關。","**不符合**：精密作業考量的是矯正後視力 0.8 以下或其他嚴重之眼睛疾病，與貧血無關。"],"explanation":"本題考附表十二「選配工時宜考量疾病之建議表」中哪些作業把貧血列入。高架作業：癲癇、精神或神經系統疾病、高血壓、心血管疾病、貧血、平衡機能失常、呼吸系統疾病、色盲、視力不良、聽力障礙、肢體殘障，共同點都是會突然失能或影響判斷、平衡、溝通而導致墜落。其他把貧血列入的作業：異常氣壓（含貧血、肥胖症、疝氣、耳鼻科疾病等）、鉛與四烷基鉛（貧血等血液疾病）、重體力勞動（貧血）、砷、硝基乙二醇、苯之硝基醯胺。沒有列貧血的常考作業：高溫（高血壓、心臟病、呼吸系統、內分泌、無汗症、腎臟、廣泛性皮膚疾病）、噪音（心血管疾病、聽力異常）、振動（周邊神經、周邊循環、骨骼肌肉）、精密作業（矯正後視力 0.8 以下或其他嚴重眼睛疾病）。附表十二備註：精神或神經系統疾病包含癲癇，內分泌系統疾病包含糖尿病；健檢異常對配工有疑慮時應照會職業醫學科專科醫師。回憶版六份考古題都出過本題，「嚴重貧血→最不適合高架作業」要能直接反應。","dispute":"","review":{"key_points":["高架作業考量疾病：==癲癇、精神神經疾病、高血壓、心血管疾病、貧血、平衡機能失常、呼吸系統疾病、色盲、視力不良、聽力障礙、肢體殘障==","列有貧血的作業：高架、異常氣壓、鉛、四烷基鉛、重體力勞動；==高溫、噪音、振動、精密作業沒有貧血==","精密作業考量：矯正後視力 0.8 以下"],"refs":[{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"病、貧血、平衡機能失常、呼吸系統疾病、色盲、 視力不良、聽力障礙、肢體殘障"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"精密作業 矯正後視力零點八以下或其他嚴重之眼睛疾病"}],"note_ref":"五、附表十二選配工時宜考量之疾病（高架、高溫、振動、精密、游離輻射）"}},{"qid":"c06q20","q":"依附表十二選配工時宜考量疾病之建議表，下列何者不是高架作業宜考量之疾病？","options":["癲癇","色盲","平衡機能失常","廣泛性皮膚疾病"],"answer":3,"recon":"rebuilt","src":["整理-表格"],"optexp":["**正確（是高架考量疾病）**：癲癇是高架作業第一個列出的考量疾病（附表十二備註：精神或神經系統疾病包含癲癇），發作即墜落。","**正確（是高架考量疾病）**：色盲列於高架作業清單，因為高架作業需辨識安全標示、信號與吊掛指揮。","**正確（是高架考量疾病）**：平衡機能失常列於高架作業清單，是墜落的直接風險因子。","**錯誤（本題答案，不是高架考量疾病）**：廣泛性皮膚疾病是高溫作業的考量疾病（影響排汗散熱），高架作業清單沒有這一項。"],"explanation":"本題再考附表十二高架作業考量疾病清單，並要與高溫作業清單交叉比對。高架作業：癲癇、精神或神經系統疾病、高血壓、心血管疾病、貧血、平衡機能失常、呼吸系統疾病、色盲、視力不良、聽力障礙、肢體殘障（記法：會昏倒的、會暈的、看不到聽不到動不了的都不能上高處）。高溫作業：高血壓、心臟病、呼吸系統疾病、內分泌系統疾病、無汗症、腎臟疾病、廣泛性皮膚疾病（記法：散不了熱與熱了會壞的器官）。兩者重疊的是高血壓、心血管／心臟病、呼吸系統疾病；高架獨有的是癲癇、貧血、平衡、色盲、視力、聽力、肢體；高溫獨有的是內分泌（糖尿病）、無汗症、腎臟、廣泛性皮膚疾病。高架作業勞工保護措施標準第 8 條另從狀態面禁止：酒醉或有酒醉之虞、身體虛弱經醫師診斷狀況不良、情緒不穩定有安全顧慮、勞工自覺不適、其他經主管人員認定者。高架作業不是特別危害健康作業，沒有特殊健檢項目，只有一般健檢加附表十二的配工考量。","dispute":"","review":{"key_points":["高架清單獨有：==癲癇、貧血、平衡機能失常、色盲、視力不良、聽力障礙、肢體殘障==","高溫清單獨有：==內分泌（糖尿病）、無汗症、腎臟疾病、廣泛性皮膚疾病==；兩者共有高血壓、心血管、呼吸","高架標準第 8 條：酒醉、身體虛弱、情緒不穩、自覺不適者不得從事"],"refs":[{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"癲 癇、精神或 神經系統 疾病、高血 壓、心血 管疾"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"病、無汗症、腎臟疾病、廣泛性皮膚疾病"}],"note_ref":"五、附表十二選配工時宜考量之疾病（高架、高溫、振動、精密、游離輻射）"}},{"qid":"c06q21","q":"依高架作業勞工保護措施標準，雇主使勞工從事高度在二公尺以上未滿五公尺之高架作業時，每連續作業二小時，至少應給予多少休息時間？","options":["10 分鐘","20 分鐘","25 分鐘","35 分鐘"],"answer":1,"recon":"full","src":["整理-表格"],"optexp":["**不符合**：法規沒有 10 分鐘的級距；最低的級距就是 20 分鐘。","**符合／正確（本題答案）**：高架作業勞工保護措施標準第 4 條：每連續作業二小時，高度在二公尺以上未滿五公尺者，至少有二十分鐘休息。","**不符合**：25 分鐘是高度五公尺以上未滿二十公尺的休息時間。","**不符合**：35 分鐘是高度二十公尺以上的休息時間。"],"explanation":"本題考高架作業勞工保護措施標準的休息時間與高架作業定義。第 3 條定義高架作業：(1) 未設置平台、護欄等設備而已採取必要安全措施，高度在 2 公尺以上；(2) 已依規定設置平台、護欄等設備並採取防止墜落之必要安全措施，高度在 5 公尺以上。高度計算：露天作業自勞工站立位置半徑 3 公尺範圍內最低點之地面或水面起算；室內或儲槽自站立位置與地板間之垂直距離。第 4 條休息時間：每連續作業 2 小時，高度 2 公尺以上未滿 5 公尺至少 20 分鐘、5 公尺以上未滿 20 公尺至少 25 分鐘、20 公尺以上至少 35 分鐘（記法 2／5／20 公尺對應 20／25／35 分鐘）；第 5 條搶修或特殊作業需要得調整；第 6 條應於安全設施良好之地面或平台休息。第 8 條不得從事高架作業者：酒醉或有酒醉之虞、身體虛弱經醫師診斷狀況不良、情緒不穩定有安全顧慮、勞工自覺不適、其他經主管人員認定者。健康管理依勞工健康保護規則（附表十二配工考量疾病），不是特別危害健康作業。","dispute":"","review":{"key_points":["每連續作業 2 小時休息：==2–5 公尺 20 分鐘、5–20 公尺 25 分鐘、20 公尺以上 35 分鐘==","高架作業定義：無護欄 ==2 公尺==以上；有護欄 ==5 公尺==以上","露天高度自半徑 3 公尺內最低點起算；酒醉、虛弱、情緒不穩者不得從事"],"refs":[{"src":"高架作業勞工保護措施標準","file":"_ref/高架作業勞工保護措施標準.txt","quote":"高度在二公尺以上未滿五公尺者，至少有二十分鐘休息"},{"src":"高架作業勞工保護措施標準","file":"_ref/高架作業勞工保護措施標準.txt","quote":"未設置平台、護欄等設備而已採取必要安全措施，其高度在二公尺以上者"}],"note_ref":"六、高架作業與重體力勞動作業的保護標準"}},{"qid":"c06q22","q":"依重體力勞動作業勞工保護措施標準，所稱重體力勞動作業係指以人力搬運或揹負重量在多少公斤以上物體之作業？","options":["20 公斤","30 公斤","40 公斤","50 公斤"],"answer":2,"recon":"full","src":["整理-表格"],"optexp":["**不符合**：20 公斤是第 5 款「薄板壓延加工」人力搬運的門檻，不是一般人力搬運或揹負的定義。","**不符合**：30 公斤不是本標準的數字。","**符合／正確（本題答案）**：重體力勞動作業勞工保護措施標準第 2 條第 1 款：以人力搬運或揹負重量在四十公斤以上物體之作業。","**不符合**：50 公斤不是本標準的數字；標準中另有 4.5 公斤鎚、5 公斤鏟裝、10 公斤鍛造、80 公斤雙人澆鑄等門檻。"],"explanation":"本題考重體力勞動作業的定義。重體力勞動作業勞工保護措施標準第 2 條列 13 款：(1) 以人力搬運或揹負重量在 40 公斤以上物體之作業；(2) 站立姿勢伐木；(3) 手工具或動力手工具鑽岩、挖掘；(4) 坑內人力搬運；(5) 薄板壓延加工重量 20 公斤以上之人力搬運及壓延後人力剝離；(6) 4.5 公斤以上之鎚及動力手工具敲擊；(7) 站立以鏟或器皿裝盛 5 公斤以上物體投入出料；(8) 站立以金屬棒攪拌除渣熔融金屬；(9) 站立以壓床或氣鎚鍛造 10 公斤以上物體且以人力固定搬運；(10) 鑄造時雙人器皿裝盛熔液總重 80 公斤以上或單人搯金屬熔液澆鑄；(11) 人力拌合混凝土；(12) 人工拉力達 40 公斤以上之纜索拉線；(13) 其他指定作業。保護措施：第 3 條休息時間每小時不得少於 20 分鐘；第 5 條充分供應飲用水及食鹽（與高溫作業相同）；第 6 條改善作業方法、減少頻率、縮短距離、減輕重量、儘量以機械代替人力。附表十二重體力勞動作業考量疾病：呼吸系統疾病、高血壓、心血管疾病、貧血、肝病、腎臟疾病、精神或神經系統疾病、骨骼肌肉系統疾病、內分泌系統疾病、視網膜玻璃體疾病、肢體殘障。職安法第 30 條也禁止妊娠中及分娩後未滿一年女性從事一定重量以上之重物處理工作。","dispute":"","review":{"key_points":["重體力勞動：==人力搬運或揹負 40 公斤以上==；纜索拉線 40 公斤；薄板壓延 20 公斤；鎚 4.5 公斤","休息時間==每小時不得少於 20 分鐘==；供應飲用水及食鹽","考量疾病含貧血、心血管、骨骼肌肉、視網膜玻璃體疾病；妊娠與分娩後一年禁止重物處理"],"refs":[{"src":"重體力勞動作業勞工保護措施標準","file":"_ref/重體力勞動作業勞工保護措施標準.txt","quote":"以人力搬運或揹負重量在四十公斤以上物體之作業"},{"src":"重體力勞動作業勞工保護措施標準","file":"_ref/重體力勞動作業勞工保護措施標準.txt","quote":"休息時間每小時不得少於二十分鐘"}],"note_ref":"六、高架作業與重體力勞動作業的保護標準"}}]},{"idx":6,"order":6,"title":"鉛","group":"重金屬","gi":2,"notes_md":"本章每回約 2–4 題，鉛是金屬類最常考的主題：貧血型態與血鉛劑量反應（ZPP 25–30、明顯貧血 80）、運動神經病變與垂腕、附表十法定項目（血中鉛 vs 四烷基鉛的尿中鉛）、分級門檻男 40／女 30 與母性保護 5／10、IARC 2A，以及新舊環測辦法的監測頻率。\n\n## 一、鉛的吸收、分布與半衰期\n\n- 職業暴露以吸入粉塵燻煙為主；腸胃道吸收成人約 ==5–10%==、兒童 ==40–50%==（缺鐵、缺鈣、空腹增加）；無機鉛不易經皮，四烷基鉛脂溶性可經皮並輕易通過血腦障壁。\n- 血中鉛 ==95% 以上在紅血球==、血漿 \u003c1%（以全血測定）；==90% 以上體內鉛在骨骼==。\n- 半衰期：血液與軟組織 ==1–2 個月==（教科書約 30 天）；疏鬆骨約 1 年、緻密骨 10–20 年（教科書 20–30 年），骨鉛隨年齡累積，懷孕、哺乳、停經、骨質疏鬆時釋回血液。約 70% 經尿排泄。\n- 兒童血腦障壁未成熟→鉛腦症；成人→周邊運動神經病變。\n\n## 二、鉛的毒性表現：血液、神經、腎臟、心血管\n\n- 血液：抑制 ALAD 與亞鐵螯合酶→==低色性小球性貧血==（也可正球性、鐵芽球性）；抑制 P5N→==嗜鹼性彩點==；溶血使紅血球壽命縮短；鑑別缺鐵性與地中海型貧血。\n- 神經：成人==周邊運動神經病變（運動 > 感覺、上肢 > 下肢）==→垂腕、垂足；〔10/03 課堂〕==尺神經小運動纖維傳導變慢==是鉛神經毒性最敏感的周邊指標；初期（血鉛約 30）手部無力、振動覺閾值異常；鉛腦症見於兒童與血鉛 100–120 以上。\n- 消化：金屬味、食慾不振、便秘、==鉛絞痛==（可誤診為闌尾炎，血鉛多 >80）。\n- 腎：早期近端腎小管功能障礙（Fanconi 型，可逆）→晚期==腎間質纖維化、腎小管萎縮==、腎血管硬化→高血壓、==痛風（saturnine gout）==、腎衰竭；蛋白尿輕至中度，==腎病症候群是無機汞==。\n- 心血管：==血壓上升==（BLL \u003c10 即相關）；附表十二鉛作業考量疾病含高血壓、神經系統、貧血等血液、腎、消化、肝、內分泌、視網膜病變、酒精中毒。\n- 齒齦鉛線（藍灰色）、生殖毒性（流產、精蟲下降）。四烷基鉛：中樞神經精神症狀（失眠、惡夢、焦慮、妄想、抽搐）。\n\n## 三、血鉛劑量反應與生物偵測指標\n\n| 血鉛 μg/dL | 效應 |\n|---|---|\n| \u003c10 | ALAD 抑制（無閾值）、血壓升高、聽力損失 |\n| ==25–30==（女 15–20） | ==ZPP／紅血球原紫質開始上升==（有閾值）；NTP：Hb、Hct 下降最低效應 20–30 |\n| 30 | 周邊感覺神經功能改變、振動覺閾值上升 |\n| ==40==／30 | ==男／女第三級管理門檻==；慢性中毒確診參考值；血鉛與尿 ALA 開始相關 |\n| 40–60 以上 | 明確鉛中毒症狀（貧血、腹絞痛、神經傳導障礙、生殖、腎小管）主要發生區 |\n| 40–50 | WHO／ATSDR：成人血色素開始下降（兒童 40） |\n| 60 | 尿 ALA 10 mg/g Cr、ZPP 約 200 μg/dL；製瓦工人垂腕平均值 |\n| ==80== | ==以下明顯貧血不常見==；急性中毒確診 >80；腸絞痛甚少 \u003c80 |\n| 100–120 | 近端腎小管損傷甚少 \u003c100；腦病變甚少 \u003c100–120 |\n\n- 指標時間窗：==血鉛＝近期（1 個月）==、==ZPP＝過去 3–4 個月==（正常 \u003c40 μg/dL 全血，特異性低）、==骨鉛（KXRF）＝終生累積==；尿中 ALA 為效應指標；尿鉛個體差異大，只用於四烷基鉛作業；鉛動員試驗 CaNa2EDTA 1 g 後 24 小時尿鉛 >1000 μg 為陽性。\n\n## 四、鉛作業的法定檢查、分級管理與母性保護\n\n- 附表十鉛作業：作業經歷調查；生育狀況與消化道、心血管、神經症狀病史；==齒齦鉛緣==與血液、消化、腎臟、神經系統身體檢查；==血球比容、血色素、紅血球數==；尿蛋白及尿潛血；==血中鉛==（無白血球、肝功能、ZPP、尿鉛）。四烷基鉛作業：神經精神心血管病史與身體檢查、尿蛋白尿潛血、==尿中鉛==（第三級 ≥150 μg/L）。\n- 分級：第二級＝可由工作外原因解釋（缺鐵性貧血、甲狀腺功能低下所致神經病變、飲食來源血鉛偏高）；第三級＝小球性低血色素、垂腕垂足、蛋白尿二價（≥100 mg/dL）或==血鉛男 ≥40／女 ≥30==且無法確定工作相關性→請職醫；第四級＝鉛中毒表現（腹絞痛、鉛緣、小球性貧血排除缺鐵與海洋性、神經病變、腎病變）或血鉛超標且可由工作解釋。\n- 母性保護（女性勞工母性健康保護實施辦法第 10 條）：血鉛 ==\u003c5 第一級、5–\u003c10 第二級、≥10 μg/dL 第三級==；空氣濃度 1/10、1/2 PEL 的分級屬第 9 條，適用其他生殖毒性物質的工作，**鉛作業不適用**；職安法第 30 條禁止妊娠中及分娩後未滿一年女性從事鉛散布場所工作。\n\n## 五、鉛暴露行業、致癌分類與作業環境監測\n\n- 國內四大鉛作業：==鉛蓄電池、塑膠安定劑、印刷電路板、錫鉛焊接==；認定指引高度風險另含金屬焊接切割、冶煉、水晶玻璃、拆船、除漆、靶場、散熱器維修、PVC；==現代印刷業（平版／數位）鉛暴露低==（活版鑄字才有）。\n- IARC：==無機鉛化合物 2A（2006）==、金屬鉛 2B（1987）、有機鉛 3。\n- PEL-TWA：鉛及其無機化合物 ==0.05 mg/m3==、四烷基鉛 0.075 mg/m3。\n- 環測頻率：==考試當時（105 年版第 8 條）鉛與四烷基鉛作業每年一次以上==；==現行 115 年修正第 6 條（116.1.1 施行）改為每六個月一次以上、超過 PEL 者每三個月==。紀錄保存：舊版 3 年（附表四物質 30 年、粉塵 10 年）→新版 10 年（附表六物質 30 年）；鉛不在 30 年清單。","questions":[{"qid":"c07q01","q":"有關鉛中毒引起之貧血，下列敘述何者錯誤？","options":["血鉛 80 μg/dL 之勞工可出現貧血","鉛中毒之貧血 MCV 常為 90 fL","血鉛 60 μg/dL 之勞工可出現貧血","嚴重者血色素可低至 7 g/dL"],"answer":1,"recon":"full","src":["113-1","113-2","113-11"],"optexp":["**正確**：血鉛 80 μg/dL 已達急性／亞急性鉛中毒的確診參考值，指引寫血鉛 80 μg/dL 以下明顯貧血並不常見，換言之 80 以上就可出現明顯貧血。","**錯誤（本題答案）**：鉛抑制 ALAD 與亞鐵螯合酶阻斷血基質合成並使紅血球變小，重度鉛暴露典型為低色性小球性貧血（MCV \u003c80 fL），MCV 90 fL 是正球性，不是鉛貧血的典型表現。","**正確**：認定指引寫明確的鉛相關中毒症狀（貧血、腹絞痛、神經傳導障礙等）主要發生於血鉛 40–60 μg/dL 以上，60 μg/dL 的勞工可出現貧血；ZPP 在此濃度已明顯上升。","**正確**：嚴重鉛中毒合併溶血時血色素可降到 7 g/dL 左右；113-2 回憶版寫 7 mg/dL 是單位筆誤，血色素單位為 g/dL。"],"explanation":"本題考鉛引起貧血的型態與劑量。機轉有四：(1) 抑制 δ-胺基乙醯丙酸脫水酶（ALAD）與亞鐵螯合酶，阻斷血基質合成，血色素下降且紅血球變小，形成低色性小球性貧血；(2) 抑制紅血球嘧啶 5' 核苷酸酶（P5N）與 Na-K-ATPase，細胞膜不穩定造成溶血、紅血球壽命縮短，急性溶血時呈正球性貧血與網狀紅血球增加；(3) 腎病變使紅血球生成素不足；(4) 干擾鐵代謝形成環鐵芽球，長期可致鐵芽球性貧血。P5N 缺乏使嘧啶核苷酸堆積在紅血球內形成顆粒，即嗜鹼性彩點（basophilic stippling）。劑量上，ZPP 上升閾值約血鉛 25–30 μg/dL（女性 15–20），NTP 表列紅血球、血比容與血色素下降的最低效應值為 20–30 μg/dL，但明顯貧血在血鉛 80 μg/dL 以下並不常見；認定指引另指出明確鉛中毒症狀主要發生於 40–60 μg/dL 以上。貧血鑑別要排除缺鐵性貧血與地中海型貧血，分級指引第四級寫「小球性低血色素貧血（排除缺鐵性貧血及海洋性貧血）」。因此本題四個選項中 MCV 90 fL 與鉛貧血的小球性特徵不符，是錯誤選項。","dispute":"回憶版答案不一致：113-2 標答案為第 4 選項「血色素 7 mg/dL」（回憶者可能因單位 mg/dL 有誤而選它），113-4 回憶者反駁應為「MCV 90」，113-11 與【整理】版本亦定 MCV 90 為錯誤選項。依認定指引原文，重度鉛暴露通常引起低色性小球性貧血（也可有正球性與鐵芽球性貧血），MCV 90 fL 屬正球性，與鉛貧血典型表現不符；血色素 7 的「mg/dL」是單位筆誤，本題已改為 g/dL，嚴重鉛中毒合併溶血時血色素確可降至 7 g/dL。應試時以「MCV 90 fL」為錯誤選項。","review":{"key_points":["鉛貧血：==低色性小球性（MCV \u003c80）==，可有正球性（急性溶血）與鐵芽球性貧血","嗜鹼性彩點＝P5N 缺乏→嘧啶核苷酸堆積","ZPP 閾值 25–30 μg/dL；==明顯貧血在血鉛 80 以下不常見==；鑑別缺鐵與地中海型貧血"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"重度鉛暴露通常引起低色性小球性貧血(hypochromic microcyticanemia)，也可有正球性貧血和鐵芽球性貧血"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"雖然造血系統對鉛比較敏感，但是在血鉛濃度在80 μg/dL以下，造成明顯貧血是不常見的"},{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"這些顆粒在一般染色時呈現嗜鹼性彩點 (Basophilic Stippling)"}],"note_ref":"二、鉛的毒性表現：血液、神經、腎臟、心血管"}},{"qid":"c07q02","q":"血壓控制不佳之高血壓勞工，最不適合從事下列何種金屬相關作業？","options":["鉛作業","鎳作業","鉻酸作業","銦作業"],"answer":0,"recon":"full","src":["113-1","113-4","113-5","113-8","113-11","114-01"],"optexp":["**符合／正確（本題答案）**：認定指引：許多研究一致顯示鉛暴露可導致血壓上升、增加心血管疾病風險，低血鉛（\u003c10 μg/dL）即與血壓升高相關，機轉含腎素—血管張力素系統活化與腎血管病變；附表十二鉛作業考量疾病明列高血壓。","**不符合**：鎳作業附表十二考量的是呼吸系統疾病與皮膚炎（鎳過敏性接觸性皮膚炎、鼻竇癌與肺癌），與血壓無關。","**不符合**：鉻酸及其鹽類作業考量呼吸系統疾病與接觸性皮膚疾病（鉻潰瘍、鼻中膈穿孔、肺癌），不涉及血壓。","**不符合**：銦及其化合物作業考量的是肺部疾病（銦肺、肺泡蛋白沉積症），與血壓無關。"],"explanation":"本題考鉛的心血管毒性與附表十二的配工考量。鉛作業宜考量之疾病：神經系統疾病、貧血等血液疾病、腎臟疾病、消化系統疾病、肝病、內分泌系統疾病、視網膜病變、酒精中毒、高血壓，分級指引第二至四級的健康管理附註完全相同並加妊娠中勞工之健康保護。鉛升高血壓的證據：認定指引引 NTP 報告，血壓升高在血鉛低於 10 μg/dL 即有相關，心血管疾病死亡率在 8 μg/dL 以上上升，血漿腎素活性、血管張力素轉換酶與醛固酮在 30–40 μg/dL 增加；慢性鉛腎病變造成腎血管硬化也會產生高血壓與痛風。因此血壓控制不佳的勞工最不適合鉛作業。對照其他金屬的考量疾病：鎳＝呼吸系統疾病、皮膚炎；鉻酸＝呼吸系統疾病、接觸性皮膚疾病；銦＝肺部疾病；鎘（未列於附表十二但法定檢查含體重、腎功能）主要看腎與骨；汞＝精神神經、內分泌、腎、肝、消化、動脈硬化、視網膜病變、接觸性皮膚疾病；錳＝精神或中樞神經（巴金森症候群）、慢性呼吸道、肝、腎、接觸性皮膚疾病。113-1 回憶版「血壓上升：鉛」即此考點。","dispute":"","review":{"key_points":["鉛作業考量疾病：==神經、貧血等血液、腎臟、消化、肝病、內分泌、視網膜病變、酒精中毒、高血壓==","鉛使血壓上升（BLL \u003c10 即相關；腎素—醛固酮系統活化、腎血管硬化）","鎳＝呼吸＋皮膚炎；鉻酸＝呼吸＋接觸性皮膚；銦＝肺部疾病"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"血壓檢查：在許多研究中概括一致的結果，鉛暴露可導致血壓上升，增加心血管疾病風險"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"酒精中毒、高血壓"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"銦及其化合物之作業 肺部疾病"}],"note_ref":"二、鉛的毒性表現：血液、神經、腎臟、心血管"}},{"qid":"c07q03","q":"有關鉛中毒之敘述，下列何者錯誤？","options":["紅血球出現嗜鹼性斑點（basophilic stippling）","齒齦可見鉛線（lead line）","周邊神經病變以感覺神經為主","可出現垂腕（wrist drop）"],"answer":2,"recon":"full","src":["113-2","113-4","113-11","113-12","114-03"],"optexp":["**正確**：嗜鹼性斑點紅血球（basophilic stippling）是鉛抑制 P5N 使嘧啶核苷酸堆積於紅血球內形成的顆粒，是鉛中毒的經典血液所見（但非特異）。","**正確**：齒齦鉛線（lead line、Burton line）是硫化鉛沉積於齒齦邊緣的藍灰色色素沉著，附表十鉛作業身體檢查即明列「齒齦鉛緣之有無」。","**錯誤（本題答案）**：鉛的周邊神經病變以運動神經為主（motor type neuropathy），認定指引寫「鉛對運動神經之毒性比感覺神經要大，上肢比下肢嚴重」，感覺症狀輕微；以感覺神經為主的是砷、正己烷等。","**正確**：垂腕（wrist drop）是伸肌麻痺的典型表現，過去見於血鉛 100–120 μg/dL 以上的工人，製瓦工人垂腕症的平均血鉛約 60 μg/dL；分級指引第三、四級判定依據即含「垂腕或垂足等伸肌麻痺」。"],"explanation":"本題考鉛中毒的四大經典徵象：嗜鹼性斑點紅血球、齒齦鉛線、垂腕（垂足）與運動神經為主的周邊神經病變。神經毒性方面，成人多為周邊性運動神經病變、兒童多為鉛腦症；初期表現（血鉛約 30 μg/dL）為上肢遠端無力、手腳刺麻、振動感覺閾值異常，神經生理檢查可見感覺與運動神經傳導速率降低，末期為不對稱肌力減退（慣用手較嚴重）、肌肉萎縮、垂腕與垂足；一般而言鉛對運動神經的毒性比感覺神經大、上肢比下肢嚴重，這與砷、正己烷、二硫化碳以感覺為主的多發性神經病變不同。消化系統：食慾不振、噁心、便秘、鉛絞痛（可被誤診為急性闌尾炎）。血液：貧血、嗜鹼性斑點。其他：腎間質纖維化、高血壓、痛風、生殖毒性、記憶力與情緒改變。分級指引第三級判定：尚不知原因之小球性低血色素、周邊神經病變（如垂腕或垂足等伸肌麻痺或感覺異常）、腎臟病變（蛋白尿達二價 ≥100 mg/dL）、血中鉛男 ≥40／女 ≥30 μg/dL。","dispute":"","review":{"key_points":["鉛四徵：==嗜鹼性斑點紅血球、齒齦鉛線、垂腕／垂足、運動神經 > 感覺神經==","成人＝周邊運動神經病變；兒童＝鉛腦症；上肢比下肢嚴重","感覺神經為主的多發性神經病變要想砷、正己烷、二硫化碳"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"一般來說，鉛對運動神經之毒性比感覺神經要大，上肢比下肢嚴重"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"齒齦可能呈現有鉛線(藍灰色色素沉著)"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"齒齦鉛緣之有無與血液系統、消"}],"note_ref":"二、鉛的毒性表現：血液、神經、腎臟、心血管"}},{"qid":"c07q04","q":"有關鉛在人體之吸收與分布，下列敘述何者錯誤？","options":["慢性暴露時體內 90% 以上的鉛儲存於骨骼（與牙齒）","血液中的鉛約 95% 與紅血球結合","成人腸道對鉛之吸收率約 5–10%，兒童可高達 45–50%","成人的鉛比兒童更容易通過血腦障壁"],"answer":3,"recon":"partial","src":["113-6","113-7","113-12","114-01"],"optexp":["**正確**：認定指引：90% 以上的鉛會儲存於骨骼中，疏鬆骨半衰期約 1 年、緻密骨 10–20 年，骨鉛隨年齡累積，是內生性的鉛暴露源。","**正確**：血鉛主要分布於紅血球，血漿中鉛含量通常低於 1%，所以血鉛以全血測定；113-12 回憶版「血液中 90% 在血漿」是錯的。","**正確**：教科書（ATSDR）數據：成人腸胃道對無機鉛的吸收率約 5–10%，兒童可高達 40–50%，空腹、缺鐵、缺鈣時吸收更多；未吸收的食入鉛約 90% 隨糞便排出。","**錯誤（本題答案）**：兒童的血腦障壁尚未成熟且吸收率高，鉛腦病變好發於兒童，認定指引寫成人多為周邊運動神經病變、兒童則多見鉛腦症；成人並不比兒童更容易讓鉛通過血腦障壁。"],"explanation":"本題考鉛的吸收與體內分布。吸收：職業暴露以吸入鉛粉塵與燻煙為主，肺部吸收率高；腸胃道吸收成人約 5–10%、兒童 40–50%，缺鐵、缺鈣與空腹會增加吸收；無機鉛不易經皮吸收（四烷基鉛因脂溶性可經皮膚吸收並輕易通過血腦障壁，是另一組考點）。分布：血液中的鉛 95% 以上與紅血球結合、血漿低於 1%，血中與軟組織的鉛半衰期約 1–2 個月（教科書 30 天）；90% 以上的體內鉛儲存於骨骼與牙齒，疏鬆骨半衰期約 1 年、緻密骨 10–20 年，骨鉛隨年齡增加，並在懷孕、哺乳、停經、骨質疏鬆時釋回血液成為內生性暴露源。排泄：約 70% 經尿液，少量經糞便、汗液、頭髮與指甲。血腦障壁：兒童血腦障壁未成熟、吸收率高，鉛腦症以兒童居多（台灣最早報告的案例即鉛腦症，成人及兒童皆有但兒童居多）；成人以周邊運動神經病變為主。113-12 另考「90% 在骨頭（對）、90% 在血漿（錯，在紅血球）、食入性鉛約 90% 由腸胃道排出（對）」。","dispute":"","review":{"key_points":["吸收率：成人腸道 ==5–10%==、兒童 ==40–50%==；缺鐵缺鈣空腹增加吸收","血鉛 ==95% 以上在紅血球==、血漿 \u003c1%；==90% 以上體內鉛在骨骼==（疏鬆骨 1 年、緻密骨 10–20 年）","兒童血腦障壁未成熟→鉛腦症；成人→周邊運動神經病變"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"血鉛主要分布於紅血球，血漿中鉛含量通常低於 1%"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"它的生物半衰期在疏鬆骨平均約 1 年；在緻密骨約 10-20 年，故存於此的鉛含量，會隨著年齡的增加而增加"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"鉛對人體的毒性，在成人多為周邊性運動神經病變(peripheralmotor neuropathy)，兒童則多見鉛腦症(lead encephalopathy)"}],"note_ref":"一、鉛的吸收、分布與半衰期"}},{"qid":"c07q05","q":"有關鉛在體內之半衰期，下列敘述何者正確？","options":["血液中鉛之半衰期約 30 天，骨骼中則可長達 25 年以上","血液中鉛之半衰期約 1 年","骨骼中鉛之半衰期約 30 天","疏鬆骨與緻密骨中鉛之半衰期相同"],"answer":0,"recon":"rebuilt","src":["113-7","113-12","114-01"],"optexp":["**符合／正確（本題答案）**：教科書數值：血中鉛半衰期約 30 天（指引寫血液與軟組織 1–2 個月），骨骼中的鉛半衰期可達數年至數十年（緻密骨 10–20 年，教科書寫 20–30 年），選項 A 是四者中唯一符合「血短骨長」的敘述。","**不符合**：血液中鉛的半衰期只有約 1 個月，不是 1 年；1 年是疏鬆骨（trabecular bone）的半衰期。","**不符合**：骨骼中鉛的半衰期以年計（疏鬆骨約 1 年、緻密骨 10–20 年），30 天是血液的半衰期。","**不符合**：疏鬆骨與緻密骨的半衰期差異很大（約 1 年 vs 10–20 年），緻密骨的鉛含量才會隨年齡累積。"],"explanation":"本題考鉛在各腔室的半衰期，是「血鉛反映近期暴露、骨鉛反映累積暴露」的動力學基礎。認定指引與分級指引完整版：鉛從血液和軟組織中清除的半衰期為 1 至 2 個月（教科書常寫約 30 天），從骨骼清除得更慢，半衰期為數年至數十年；90% 以上的體內鉛儲存於骨骼，疏鬆骨（trabecular，如髕骨）平均約 1 年、緻密骨（cortical，如脛骨）約 10–20 年，故骨鉛隨年齡增加。血鉛代表循環於組織中的鉛，反映近期外源性暴露加上骨骼內生性再分布；骨鉛可用 K 軌域 X 光螢光儀（KXRF）非侵入性測定，國內僅供研究。臨床意涵：離開暴露後血鉛先快速下降再進入由骨鉛釋出主導的緩慢期，停經、懷孕、哺乳、骨質疏鬆、甲狀腺功能亢進時骨鉛釋出可使血鉛回升；女性勞工母性健康保護因此對鉛作業另訂血鉛 5／10 μg/dL 的嚴格分級。本題選項 A 的「30 天／25 年以上」是回憶版原文的教科書數字，與指引「1–2 個月／10–20 年」略有出入，但仍是唯一正確的敘述。","dispute":"本題為依 113-7、113-12、114-01 回憶重建，選項 A 的數字「血中鉛半衰期約 30 天、骨骼可達 25 年以上」是回憶版與一般教科書（ATSDR）的說法；認定指引與分級指引完整版原文寫血液與軟組織半衰期 1 至 2 個月、骨骼數年至數十年（疏鬆骨約 1 年、緻密骨 10–20 年）。兩者方向一致（血短、骨長），選項 A 仍是唯一正確者，作答不受影響；若考題改問「疏鬆骨與緻密骨的半衰期」則依指引答約 1 年與 10–20 年。","review":{"key_points":["血鉛半衰期約 ==30 天（指引：1–2 個月）==；骨鉛==數年至數十年==（疏鬆骨約 1 年、緻密骨 10–20 年）","血鉛＝近期暴露＋骨鉛再分布；骨鉛＝累積暴露（KXRF 測定）","懷孕、哺乳、停經、骨質疏鬆時骨鉛釋回血液"],"refs":[{"src":"分級指引_完整版_clean","file":"_ref/分級指引_完整版_clean.txt","quote":"鉛從血液和軟組織中清除的半衰期為 1 至 2 個月，而從骨骼中清除得更慢，半衰期為數年至數十年"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"骨鉛代表長期的暴露量，為內生性的鉛暴露原"}],"note_ref":"一、鉛的吸收、分布與半衰期"}},{"qid":"c07q06","q":"有關鉛暴露之生物偵測指標，下列敘述何者正確？","options":["血中鉛反映近期暴露，鋅原紫質（ZPP）反映較長期（數個月）的暴露","尿中鉛是鉛作業特殊健康檢查之法定生物偵測項目","ZPP 在暴露後數小時內即上升，適合偵測急性暴露","血中鉛反映終生累積之鉛負荷"],"answer":0,"recon":"partial","src":["113-5","114-02","115-02"],"optexp":["**符合／正確（本題答案）**：血鉛半衰期約 1 個月，反映近期暴露；ZPP 隨新生成紅血球累積、紅血球壽命約 120 天，反映過去 3–4 個月的鉛負荷（半衰期約 4 個月），且上升有延遲。","**不符合**：鉛作業的法定生物偵測項目是「血中鉛」（附表十第 5 項）；尿中鉛是四烷基鉛作業（第 6 項）的項目，單次尿鉛受飲水、腎功能與時段影響大，不適合當鉛作業指標。","**不符合**：ZPP 需要新生成的紅血球帶著鋅原紫質進入循環，暴露後數週才逐漸上升，不能偵測急性暴露；急性暴露看血鉛。","**不符合**：血中鉛反映的是近期外源性暴露加上骨鉛的內生性再分布，不代表終生累積；終生累積負荷要看骨鉛（KXRF）。"],"explanation":"本題考鉛的三種生物指標各自代表的時間窗。血中鉛（BLL）：法定項目，全血測定（95% 以上在紅血球），半衰期約 1 個月，代表近期暴露與骨鉛再分布，檢驗機構須取得第三者認證。鋅原紫質（ZPP）／游離紅血球原紫質（FEP）：鉛抑制亞鐵螯合酶使原紫質 IX 無法嵌入鐵而改與鋅結合，正常值 \u003c2.5 μg/g Hb 或 \u003c40 μg/dL 全血，男性血鉛維持 60 μg/dL 時 ZPP 約 12.5 μg/g Hb（200 μg/dL），上升有閾值（血鉛 25–30，女性 15–20 μg/dL）、反映過去 3–4 個月負荷，方法簡易靈敏但特異性低（缺鐵也會升高），非法定項目。骨鉛（KXRF）：代表長期累積暴露，國內少用。尿中 ALA：ALAD 被抑制後累積排出，血鉛 >40 時與血鉛相關，尿 ALA 10 mg/g Cr 約當血鉛 60 μg/dL；ALAD 抑制本身沒有閾值。尿中鉛：受飲水與腎功能影響大，是四烷基鉛作業的法定項目（第三級 ≥150 μg/L）；鉛動員試驗（CaNa2EDTA 1 g 靜脈注射後 24 小時尿鉛 >1000 μg 為陽性）用於確立診斷。","dispute":"回憶版有兩種版本：114-02 的正確選項為「血鉛看近期、長期累積看 ZPP」，即本題答案；115-02 版本的選項含「血鉛監測、骨鉛看長期」，依認定指引「骨鉛代表長期的暴露量，為內生性的鉛暴露原」，該敘述也正確。三者的時間尺度是血鉛（週至月）\u003c ZPP（3–4 個月）\u003c 骨鉛（年至數十年），作答時依選項提供的組合判斷：ZPP 比血鉛長期、骨鉛比 ZPP 更長期，兩種說法都成立。","review":{"key_points":["==血鉛＝近期（半衰期約 1 個月）==；==ZPP＝過去 3–4 個月==；==骨鉛＝終生累積==","ZPP 閾值血鉛 25–30（女 15–20）μg/dL，正常 \u003c40 μg/dL 全血，特異性低","鉛作業法定＝血中鉛；四烷基鉛作業＝尿中鉛（第三級 ≥150 μg/L）"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"血液 ZPP 測定為鉛暴露篩檢方法之一，可反應約 3-4 個月的鉛負荷狀況(半衰期約 4個月)"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"血鉛代表循環於組織中的鉛含量，反映近期的外源性鉛暴露以及長期儲存於骨骼中的鉛的內源性再分佈"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"尿中鉛檢查(變更作業者無須檢 測)"}],"note_ref":"三、血鉛劑量反應與生物偵測指標"}},{"qid":"c07q07","q":"依勞工特殊健康檢查健康管理分級建議指引（完整版）鉛作業章節，成人血中鉛濃度未達多少時，出現「明顯貧血」並不常見？","options":["25 μg/dL","40 μg/dL","50 μg/dL","80 μg/dL"],"answer":3,"recon":"partial","src":["113-2","113-10","114-01","整理-重點"],"optexp":["**不符合**：25 μg/dL 是 ZPP／紅血球原紫質開始上升的閾值（25–30 μg/dL，女性 15–20），此時尚無貧血。","**不符合**：40 μg/dL 是男性鉛作業第三級管理門檻與慢性中毒確診參考值，認定指引寫明確鉛中毒症狀主要發生於 40–60 μg/dL 以上，但「明顯貧血」的門檻更高。","**不符合**：50 μg/dL 是 WHO／ATSDR 教科書列為成人血色素開始下降的參考值（兒童約 40），屬輕度變化，不是指引所稱明顯貧血的分界。","**符合／正確（本題答案）**：分級指引完整版與認定指引原文：「雖然造血系統對鉛比較敏感，但是在血鉛濃度在 80 μg/dL 以下，造成明顯貧血是不常見的」；認定指引也寫鉛相關腸絞痛甚少發生於血鉛低於 80 μg/dL。"],"explanation":"本題考鉛對造血系統的劑量反應關係，要把整條階梯背起來。血鉛 \u003c10 μg/dL：ALAD 活性已被抑制且沒有閾值（尿中 ALA 隨血鉛呈對數上升）；NTP 表列 BLL \u003c10 即與血壓升高、聽力損失相關。25–30 μg/dL（女性 15–20）：ZPP／紅血球原紫質開始上升，這是有閾值的劑量效應；NTP 也把紅血球、血比容與血色素下降的最低效應值列在 20–30 μg/dL，周邊感覺神經功能改變約 30。40 μg/dL：血鉛與尿 ALA 開始相關，男性第三級管理門檻（女性 30）；認定指引的慢性中毒確診參考值為血鉛 >40，明確鉛中毒症狀（貧血、腹絞痛、神經傳導障礙、男性生殖危害、腎小管損傷）主要發生於 40–60 μg/dL 以上，但個體差異大（有人 80 仍無症狀、有人 20 已不適）。40–50 μg/dL：WHO／ATSDR 教科書列為成人血色素開始下降的參考值（兒童 40）。60 μg/dL：尿 ALA 10 mg/g Cr、ZPP 約 200 μg/dL，製瓦工人垂腕症平均血鉛。80 μg/dL：以下明顯貧血不常見；急性中毒最佳確診值 >80；腸絞痛甚少低於 80。100 μg/dL：近端腎小管損傷甚少低於 100；腦病變甚少低於 100–120。分級門檻男 40／女 30 是「管理值」而非中毒值，用來早期介入。","dispute":"回憶版答案分歧很大：113-2 第 58 題答「50」、113-2 補充寫「70／80 以慢性為主」、113-10 寫「70?」、114-01 選項 30/40/50/60 答「B (40)?」、【整理】寫「50–70」，顯示各回憶者記到的是同一條劑量反應曲線上的不同點。依分級指引完整版與無機鉛認定指引原文，「明顯貧血」的門檻句是「血鉛濃度在 80 μg/dL 以下，造成明顯貧血是不常見的」，因此題幹問「明顯貧血不常見」時答 80 μg/dL；若題幹改問「血色素開始下降」，教科書值為成人約 50、兒童約 40 μg/dL（NTP 表列最低效應 20–30）；問「ZPP 開始上升」答 25–30；問「明確鉛中毒症狀主要發生於」答 40–60 μg/dL 以上；問「分級第三級門檻」答男 40／女 30。作答前先看清題幹問的是哪一個點。","review":{"key_points":["劑量階梯：==ALAD 抑制無閾值→ZPP 上升 25–30→Hb 開始降 40–50→明顯貧血 \u003c80 不常見==","認定指引：明確中毒症狀主要在 ==40–60 以上==；腸絞痛甚少 \u003c80；腎小管損傷 \u003c100；腦病變 \u003c100–120 甚少","管理值：男 ≥40／女 ≥30 μg/dL 第三級；急性中毒確診 >80"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"雖然造血系統對鉛比較敏感，但是在血鉛濃度在80 μg/dL以下，造成明顯貧血是不常見的"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"這個劑量-效應關係有閥值效應，大約在血鉛濃度25到30 μg/dL之間"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"鉛相關之腸絞痛甚少發生於血鉛濃度低於 80 μg/dL"}],"note_ref":"三、血鉛劑量反應與生物偵測指標"}},{"qid":"c07q08","q":"下列本土作業何者較少鉛暴露？","options":["錫鉛焊接","蓄電池製造業","現代印刷業","塑膠安定劑製造業"],"answer":2,"recon":"full","src":["113-5","113-4","115-02"],"optexp":["**不符合（暴露多）**：錫鉛焊接與焊料製造是認定指引列為中度風險的職業，焊接或切割塗鉛金屬更是高度風險；114-01 回憶版把錫鉛焊接列為易接觸鉛的職業之一。","**不符合（暴露多）**：鉛蓄電池製造、維修及回收是高度風險職業，也是國內鉛作業健檢的最大族群（新北市鉛蓄電池廠研究顯示血鉛 30 以上振動感覺閾值即上升）。","**符合／正確（本題答案）**：傳統鉛字排版與鑄字工人確有鉛暴露，但現代印刷已改為平版、數位印刷，認定指引把印刷作業列為低度風險，四者中暴露最少。","**不符合（暴露多）**：塑膠安定劑（硬脂酸鉛等）製造是高度風險職業，聚氯乙烯塑料加入含鉛穩定劑或色素亦列高度風險。"],"explanation":"本題考國內鉛暴露的主要行業。認定指引表一把潛在鉛暴露職業分三級：高度風險——金屬焊接／切割（含橋樑與高速公路重建）、鉛冶煉精煉、鉛蓄電池製造維修及回收、水晶玻璃製造、塑膠安定劑製造、拆船、油漆工與除漆工、靶場人員、含鉛油漆製造、焊接切割塗鉛金屬、汽車散熱器維修、PVC 塑料製造；中度風險——鉛礦工、銲錫、鍍鋅鋼板鋼焊、搪瓷、玻璃吹製彩繪、鉛水管、陶器上釉、黃銅鑄造、船舶維修、彈藥與焊料製造、鑄字工人、電線電纜、汽車製造；低度風險——砷酸鉛農藥、電視映像管、電子製造、珠寶、管道裝配、印刷作業、橡膠製品、藝術家、含鉛汽油相關人員。國內考題常見的四大鉛作業行業是鉛蓄電池製造、塑膠安定劑製造、印刷電路板製造與錫鉛焊接（114-01：「哪些職業比較容易接觸到鉛」四者皆是）。傳統鉛字（活版）印刷已被平版與數位印刷取代，「現代印刷業」鉛暴露低，是本題要挑出的選項。鉛作業的定義與範圍見鉛中毒預防規則第 2 條。","dispute":"回憶版選項與答案不一致：113-4 版本的四個選項為鉛蓄電池／印刷電路板／塑膠安定劑／錫鉛焊條製造廠，回憶者選「錫鉛焊條製造廠」為較少暴露；115-02 版本回憶者選「塑膠業(?)」；113-5 與本題以「現代印刷業」為較少暴露。依認定指引表一，焊料製造與銲錫屬中度風險、塑膠安定劑製造屬高度風險、印刷作業屬低度風險，因此當選項同時出現「現代印刷業」時應選它；若選項沒有印刷業而是「錫鉛焊條製造廠」與蓄電池、電路板、安定劑並列，則焊條製造（中度風險）相對最低。核心是記住四大鉛作業行業（鉛蓄電池、塑膠安定劑、印刷電路板、錫鉛焊接），不在其中者即為答案。","review":{"key_points":["國內四大鉛作業行業：==鉛蓄電池、塑膠安定劑、印刷電路板、錫鉛焊接==","認定指引高度風險：焊接切割、冶煉、蓄電池、水晶玻璃、安定劑、拆船、除漆、靶場、散熱器、PVC","==現代印刷業（平版／數位）鉛暴露低==；鑄字、活版印刷才有"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"目前主要使用鉛是在鉛蓄電池，也有少量的鉛含於建材或鉛化合物的使用。職業上的高暴露則存在於採礦、熔煉過程、鉛蓄電池"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"鉛蓄電池製造、維修及回收"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"塑膠安定劑製造"}],"note_ref":"五、鉛暴露行業、致癌分類與作業環境監測"}},{"qid":"c07q09","q":"國際癌症研究總署（IARC）將無機鉛化合物列為第幾類致癌物？","options":["第一類（Group 1）","2A 類","2B 類","第三類"],"answer":1,"recon":"full","src":["113-3","113-8","113-2","115-01"],"optexp":["**不符合**：第一類（確定人類致癌物）是苯、石綿、氯乙烯、鎘、六價鉻、鎳化合物、砷、游離輻射等；鉛的人類證據只有「有限」，未達第一類。","**符合／正確（本題答案）**：IARC 2004 年工作組會議、2006 年公告（Monograph 87）將無機鉛化合物重新分類為 2A（對人類很可能致癌：動物證據充分、人類證據有限），與肺癌、胃癌、腎癌、腦瘤有弱關聯。","**不符合**：2B 是 1987 年 IARC 對鉛及鉛化合物的舊分類（證據不充分、疑似致癌物），現行只有金屬鉛（lead, metallic）仍維持 2B；題幹問的是無機鉛化合物。","**不符合**：第三類（無法分類）是有機鉛化合物（四乙基鉛等）的分類，人類與動物證據皆不足。"],"explanation":"本題考鉛的 IARC 致癌分類，三個等級要分清楚：無機鉛化合物 2A、金屬鉛 2B、有機鉛化合物 3。演變：1987 年 IARC 認為鉛對人體致癌證據不充分，分類為 2B（疑似致癌物）；2004 年工作組更新、2006 年公告將無機鉛重新分類為 2A（動物已有充分證據、人類有限證據），有機鉛歸為第 3 類（無法分類）；金屬鉛未被重新評估，仍列 2B（113-2 回憶版寫「第二級 2B」、113-3 寫「2A 2B 都有」即源於此）。流行病學顯示無機鉛暴露與癌症呈弱關聯，主要是肺癌，其次胃癌、腎癌、膀胱癌與腦瘤（Selevan 精煉廠研究腎癌 6 例對期望值 2.9）。作答原則：題幹寫「無機鉛化合物」選 2A；寫「鉛（金屬）」選 2B；寫「有機鉛」或「四烷基鉛」選 3。與本章其他金屬對照：鎘、六價鉻、鎳化合物、砷、鈹為第 1 類，汞（無機）為第 3 類，錳未分類。","dispute":"回憶版說法不一：113-2 回憶寫「第二級 (2B)」，113-3 寫「2A 2B 都有」。依認定指引原文，1987 年鉛（及其化合物）被列為 2B，2006 年 IARC 將無機鉛化合物改列 2A、有機鉛列第 3 類；金屬鉛本身未重新評估，IARC 清單仍維持 2B。本題題幹明確問「無機鉛化合物」，應答 2A；若題幹問「鉛（金屬）」則答 2B，問「有機鉛」答第 3 類。","review":{"key_points":["IARC：==無機鉛化合物 2A（2006）==、==金屬鉛 2B（1987）==、==有機鉛 3==","2A＝動物證據充分、人類證據有限；弱關聯：肺癌、胃癌、腎癌、腦瘤","第 1 類金屬：砷、鎘、六價鉻、鎳化合物、鈹；無機汞第 3 類"],"refs":[{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"2006年公告將無機鉛重新分類為“2A類，可能致癌物”（在動物已有充分的證據，人類有限的證據）；有機鉛仍然歸為“3類，不可分類”"},{"src":"職業性無機鉛及其化合物中毒認定參考指引","file":"_ref/認定指引/all/職業性無機鉛及其化合物中毒認定參考指引.txt","quote":"1987年IARC認為鉛對人體致癌證據不充分，而分類為“2B類，疑似致癌物”"}],"note_ref":"五、鉛暴露行業、致癌分類與作業環境監測"}},{"qid":"c07q10","q":"某勞工二個月前開始從事蓄電池製造作業，近日出現腹絞痛、便秘、疲倦等症狀，下列何項檢查最可能出現異常？","options":["血中鉛","尿中無機砷","血中汞","尿中鎘"],"answer":0,"recon":"rebuilt","src":["113-1"],"optexp":["**符合／正確（本題答案）**：蓄電池製造是高度風險鉛作業，腹絞痛、便秘、疲倦是亞急性鉛中毒的典型表現，血鉛半衰期約 1 個月，兩個月的暴露足以使血鉛明顯上升（腸絞痛多見於血鉛 >80 μg/dL）。","**不符合**：尿中無機砷是砷作業（半導體、冶煉、農藥）的指標；砷中毒以周邊感覺神經病變、皮膚角化色素沉著、烏腳病為主，不是蓄電池廠的暴露。","**不符合**：血中汞是乙基汞（有機汞）作業的指標，表現為感覺異常、運動失調、視野狹窄；蓄電池廠沒有汞暴露（水銀電池已淘汰）。","**不符合**：尿中鎘反映鎘的長期腎臟負荷（半衰期 10–30 年），鎘中毒以腎小管損傷（β2-microglobulin）與骨軟化為主，沒有腹絞痛。"],"explanation":"本題考鉛絞痛（lead colic）的臨床辨識與行業連結。鉛蓄電池製造是認定指引列為高度風險的職業，也是國內鉛作業健檢最主要的族群。急性／亞急性鉛中毒的暴露期間可為數小時至數天（急性）或數月（亞急性），非特異症狀有疲勞、頭痛、失眠、焦慮、關節肌肉痠痛、記憶力變差，消化道症狀為口中金屬味、食慾不振、噁心、腹痛、便秘或腹瀉，嚴重腹絞痛可被誤診為急性闌尾炎；認定指引的急性中毒暴露評估寫「工作相關情況介入調查加上血鉛濃
