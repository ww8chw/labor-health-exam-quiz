<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="勞工體檢">
<meta name="theme-color" content="#faf6ef">
<meta name="format-detection" content="telephone=no">
<title>勞工體檢考古題・學習手冊與題庫</title>
<style>

:root{
  --bg:#faf6ef; --surface:#ffffff; --surface2:#f6efe4;
  --ink:#3a322a; --ink-soft:#6d6152; --line:#e7dcca;
  --accent:#b5734a; --accent-d:#9a5c37; --accent-soft:#f0e2d3;
  --good:#4f7a5b; --good-bg:#e8f2ea; --bad:#c0563f; --bad-bg:#f7e6e1;
  --gold:#c79a4b;
  --shadow:0 2px 10px rgba(90,60,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.75; font-size:16px;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
a{color:var(--accent-d)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hidden{display:none !important}

/* header */
header.top{
  position:sticky;top:0;z-index:50;background:rgba(250,246,239,.92);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;
  padding:10px max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left));flex-wrap:wrap}
.menu-btn{display:none;align-items:center;justify-content:center;width:42px;height:42px;
  border:1px solid var(--line);background:var(--surface);border-radius:11px;color:var(--accent-d);
  font-size:20px;line-height:1;flex:0 0 auto}
.menu-btn:active{background:var(--accent-soft)}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:17px;letter-spacing:.5px}
.brand span{font-size:11.5px;color:var(--ink-soft)}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  padding:9px 18px;border-radius:999px;font-size:14.5px;font-weight:600;min-height:40px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.stat-badge{font-size:12px;color:var(--ink-soft);background:var(--surface2);
  border:1px solid var(--line);padding:5px 11px;border-radius:999px}

main{max-width:1180px;margin:0 auto;
  padding:18px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}

/* layout with sidebar */
.layout{display:grid;grid-template-columns:288px 1fr;gap:20px;align-items:start}
.sidebar{position:sticky;top:70px;max-height:calc(100dvh - 88px);overflow:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;
  box-shadow:var(--shadow)}
.drawer-head{display:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(58,50,42,.42);z-index:60;
  opacity:0;transition:opacity .25s}
.scrim.show{display:block;opacity:1}
.side-group{font-size:12px;font-weight:800;color:var(--accent-d);letter-spacing:1px;
  padding:12px 10px 4px;text-transform:none}
.side-item{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:9px;
  font-size:14px;color:var(--ink);cursor:pointer}
@media(hover:hover){.side-item:hover{background:var(--surface2)}}
.side-item:active{background:var(--surface2)}
.side-item.active{background:var(--accent-soft);color:var(--accent-d);font-weight:700}
.side-item .num{font-size:11px;color:var(--ink-soft);min-width:20px;font-variant-numeric:tabular-nums}
.side-item.active .num{color:var(--accent-d)}

/* reading content */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:30px 36px;box-shadow:var(--shadow);min-height:60vh}
.reader .m-kicker{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:1px}
.reader h1.m-title{font-size:26px;margin:6px 0 4px;line-height:1.35}
.reader .m-meta{color:var(--ink-soft);font-size:14px;margin-bottom:6px}
.reader .m-actions{margin:14px 0 22px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;
  padding:11px 18px;border-radius:10px;font-size:14.5px;font-weight:700;box-shadow:var(--shadow);min-height:44px}
@media(hover:hover){.btn:hover{background:var(--accent-d)}}
.btn:active{background:var(--accent-d)}
.btn.ghost{background:var(--surface);color:var(--accent-d)}
@media(hover:hover){.btn.ghost:hover{background:var(--surface2)}}
.btn.ghost:active{background:var(--surface2)}
.btn.soft{background:var(--surface2);color:var(--ink);border-color:var(--line)}
@media(hover:hover){.btn.soft:hover{background:var(--accent-soft)}}
.btn.soft:active{background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.md h3{font-size:19.5px;margin:30px 0 8px;padding-left:12px;border-left:5px solid var(--accent);
  color:var(--accent-d)}
.md h4{font-size:16.5px;margin:20px 0 6px;color:var(--ink)}
.md h5{font-size:15px;margin:16px 0 4px;color:var(--ink-soft)}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0 8px 4px;padding-left:22px}
.md li{margin:4px 0}
.md strong{color:var(--accent-d)}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14.5px;
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.md th,.md td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
.md th{background:var(--accent-soft);color:var(--accent-d);font-weight:700}
.md tr:nth-child(even) td{background:var(--surface2)}
.md .hl{background:linear-gradient(transparent 60%,#f4e2a8 60%);padding:0 2px;border-radius:2px;
  font-weight:700}
.md figure.fig{margin:16px 0;text-align:center}
.md figure.fig img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);background:#fff}
.md figure.fig figcaption{margin-top:7px;font-size:13px;color:var(--ink-soft);text-align:center}

/* practice */
.practice-wrap{max-width:820px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:24px 26px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 4px;font-size:22px}
.panel .sub{color:var(--ink-soft);font-size:14px;margin-bottom:18px}
.field{margin:14px 0}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
select,.chk{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font-size:16px;color:var(--ink);min-height:46px;
  -webkit-appearance:none;appearance:none}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.toggle{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 4px}
.mode-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2);
  cursor:pointer;transition:.15s}
@media(hover:hover){.mode-card:hover{border-color:var(--accent)}}
.mode-card:active{border-color:var(--accent)}
.mode-card.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
.mode-card b{display:block;font-size:15px;margin-bottom:3px}
.mode-card small{color:var(--ink-soft);font-size:12.5px}

/* quiz runtime */
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.q-progress{font-size:13px;color:var(--ink-soft);font-weight:700}
.q-bar{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;min-width:120px}
.q-bar>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
.q-score{font-size:13px;color:var(--good);font-weight:700}
.q-tag{font-size:11.5px;color:var(--accent-d);background:var(--accent-soft);
  padding:3px 9px;border-radius:99px;font-weight:700}
.q-abort{margin-left:auto;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;color:var(--ink-soft);padding:8px 13px;font-size:12.5px;font-weight:700;min-height:38px}
@media(hover:hover){.q-abort:hover{background:var(--surface2);color:var(--bad)}}
.q-abort:active{background:var(--surface2);color:var(--bad)}
.q-mod{font-size:12px;color:var(--ink-soft);margin:10px 0 2px}
.q-text{font-size:18px;font-weight:600;margin:6px 0 16px;line-height:1.6}
.q-tag.wrong-tag{color:var(--bad);background:var(--bad-bg)}
.q-figure{margin:0 0 18px;overflow-x:auto}
.q-figure table{margin:0;font-size:14px}
.q-figure table th{background:var(--accent-soft)}
.q-dispute{margin:0 0 18px;padding:11px 14px;border-left:4px solid var(--gold);
  background:#fdf7e8;border-radius:0 10px 10px 0;font-size:14px;line-height:1.65;color:var(--ink)}
.q-dispute b{display:block;color:var(--accent-d);font-size:13.5px;margin-bottom:4px;letter-spacing:.3px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line);
  background:var(--surface);border-radius:12px;padding:15px 16px;font-size:16px;
  text-align:left;transition:.12s;color:var(--ink);min-height:52px}
@media(hover:hover){.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface2)}}
.opt:active:not(:disabled){border-color:var(--accent);background:var(--surface2)}
.opt .k{font-weight:800;color:var(--accent-d);min-width:20px}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{color:var(--bad)}
.opt.dim{opacity:.65}
.oxflash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:60}
.oxflash .mark{font-size:min(46vw,320px);line-height:1;font-weight:900;
  opacity:0;transform:scale(.4);animation:oxpop .9s ease-out forwards;
  text-shadow:0 8px 30px rgba(0,0,0,.18)}
.oxflash .mark.ok{color:var(--good)}
.oxflash .mark.no{color:var(--bad)}
@keyframes oxpop{
  0%{opacity:0;transform:scale(.4)}
  18%{opacity:.95;transform:scale(1.08)}
  32%{transform:scale(1)}
  75%{opacity:.95}
  100%{opacity:0;transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){.oxflash .mark{animation:oxfade .9s ease-out forwards}
  @keyframes oxfade{0%{opacity:0}15%{opacity:.95}75%{opacity:.95}100%{opacity:0}}}
.explain{margin-top:16px;border-left:4px solid var(--gold);background:#fdf7e8;
  border-radius:0 10px 10px 0;padding:12px 16px;font-size:14.5px;display:none}
.explain.show{display:block}
.explain .lab{font-weight:800;color:var(--accent-d);font-size:13px;letter-spacing:.5px}
.selftest-ans{margin-top:14px;padding:12px 16px;border-radius:10px;background:var(--accent-soft);
  font-size:15px;display:none}
.selftest-ans.show{display:block}
.selftest-ans .lab{font-weight:800;color:var(--accent-d);font-size:13px}
.q-nav{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.q-nav .spacer{flex:1}
.selfjudge{display:flex;gap:10px}
.mini{font-size:13px;color:var(--ink-soft)}

/* result */
.result{text-align:center;padding:16px}
.result .big{font-size:52px;font-weight:800;color:var(--accent);line-height:1}
.result .lbl{color:var(--ink-soft);margin:8px 0 2px}
.result .rbar{display:flex;justify-content:center;gap:26px;margin:18px 0}
.result .rbar div b{font-size:22px;display:block}
.result .rbar .g{color:var(--good)} .result .rbar .b{color:var(--bad)}

.empty{text-align:center;color:var(--ink-soft);padding:40px 10px}

footer{max-width:1180px;margin:10px auto 30px;padding:0 18px;color:var(--ink-soft);font-size:12px;text-align:center}

/* mobile */
.mobile-toc{display:none}

/* iPad portrait & landscape phones (768–1024): keep sidebar but slimmer */
@media(min-width:768px) and (max-width:1024px){
  .layout{grid-template-columns:236px 1fr;gap:16px}
  .side-item{font-size:13.5px;padding:9px 9px}
  .reader{padding:26px 26px}
}

/* phones portrait (≤767): sidebar becomes slide-in drawer */
@media(max-width:767px){
  .menu-btn{display:inline-flex}
  .layout{grid-template-columns:1fr}
  .mobile-toc{display:none}
  .reader{padding:22px 18px}
  .mode-cards{grid-template-columns:1fr}
  body{font-size:15.5px}
  .reader h1.m-title{font-size:22px}

  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:70;
    width:min(84vw,320px);max-height:none;height:100%;
    border-radius:0 16px 16px 0;
    padding:10px 10px calc(16px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    padding-top:calc(10px + env(safe-area-inset-top));
    transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 40px rgba(58,50,42,.25);
  }
  .sidebar.open{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;
    padding:4px 6px 10px;margin-bottom:4px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:var(--surface)}
  .drawer-head b{font-size:14px;color:var(--accent-d);letter-spacing:.5px}
  .drawer-close{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);
    border-radius:10px;color:var(--ink-soft);font-size:18px;line-height:1;display:flex;
    align-items:center;justify-content:center}
  .drawer-close:active{background:var(--surface2)}
}

/* landscape phones / very short: cap drawer scroll */
@media(max-width:767px) and (max-height:480px){
  .sidebar{overflow:auto}
}

/* ===== 勞工體檢版：每個選項的個別詳解（inline） ===== */
.q-mod .q-tag{display:inline-block;margin:3px 6px 0 0;white-space:normal;line-height:1.45;vertical-align:1px}
.q-mod{line-height:1.7}
.q-mod .src-tag{background:var(--surface2);color:var(--ink-soft)}
.opt{flex-wrap:wrap}
.opt .k{min-width:20px}
.opt .otext{flex:1}
.opt .oe{flex-basis:100%;display:none;margin-top:11px;padding-top:10px;
  border-top:1px dashed var(--line);font-size:13.5px;line-height:1.68;color:var(--ink-soft)}
.opt.reveal .oe{display:block}
.opt.correct .oe{color:var(--ink)}
.opt .oe b{color:var(--accent-d);font-weight:700}
.explain .oe-all{margin-top:10px}
.q-dispute{white-space:normal}
.side-item .num{font-variant-numeric:tabular-nums}
/* 錯題代碼匯出／匯入 */
.xfer{margin-top:10px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface2)}
.xfer textarea{width:100%;box-sizing:border-box;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);resize:vertical;margin:8px 0}
.xfer .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xfer .mini{display:block}
/* 深入複習（陷阱／重點／教材對應） */
.deep{display:none;margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.deep.show{display:block}
.deep h4{margin:0 0 8px;font-size:13px;color:var(--accent-d);letter-spacing:.6px}
.deep .trapline{font-size:14px;margin-bottom:6px;line-height:1.7}
.deep .trap{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-d);margin-right:8px;vertical-align:1px}
.deep ul{margin:6px 0 10px 20px;padding:0}
.deep li{margin:3px 0;font-size:14.5px;line-height:1.65}
.deep .ref{font-size:13.5px;color:var(--ink-soft);margin:5px 0;padding-left:10px;border-left:3px solid var(--accent-soft);line-height:1.65}
.deep .ref b{color:var(--accent-d);font-weight:700}
.deep .verdict{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.7}
.deep .verdict a{font-weight:700}
/* 錯題複習清單 */
.wr-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.wr-head h2{margin:0;font-size:22px}
.wr-dist{display:grid;grid-template-columns:1fr;gap:7px;margin:14px 0 20px}
.wr-row{display:grid;grid-template-columns:minmax(120px,170px) 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.wr-row .bar{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.wr-row .bar i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.wr-row .n{text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.wr-chap{margin:24px 0 8px;font-size:16px;font-weight:800;color:var(--accent-d);padding-left:10px;border-left:4px solid var(--accent)}
.wr-chap .mini{font-weight:400;margin-left:6px}
.wr-item{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0;overflow:hidden}
.wr-item summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.wr-item summary::-webkit-details-marker{display:none}
.wr-item summary .qt{flex:1;font-size:15px;line-height:1.6}
.wr-item summary .qid{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:3px}
.wr-item summary .cnt{font-size:11.5px;color:var(--bad);background:var(--bad-bg);padding:2px 7px;border-radius:999px;white-space:nowrap;margin-top:1px}
.wr-item[open] summary{border-bottom:1px dashed var(--line)}
.wr-body{padding:10px 14px 14px;font-size:14.5px}
.wr-body .ans{margin:4px 0 10px;padding:8px 12px;border-radius:10px;background:var(--good-bg);border:1px solid var(--good)}
.wr-body .ol{margin:5px 0;padding:7px 11px;border-radius:9px;border:1px dashed var(--line);line-height:1.6}
.wr-body .ol.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.wr-body .ol b{color:var(--accent-d);margin-right:6px}
.wr-body .oe{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.wr-body .explain{margin-top:12px}

/* ===== 表格小修：短格不換行、30 年列上底色 ===== */
.md td.nw,.md th.nw{white-space:nowrap}
.md tr.row-30 td{background:#fbe3d1}
/* ===== 考前總表（ch19，32 項作業） ===== */
body.wide-mod main, body.wide-mod .top-inner{max-width:1840px}
body.wide-mod .layout{grid-template-columns:248px minmax(0,1fr)}
.reader{min-width:0}
.sum-lead{font-size:15px;line-height:1.8}
.sum-key{display:inline-block;padding:1px 8px;border-radius:6px;font-size:13px;font-weight:700;margin:0 4px 0 2px}
.sum-key.hi{background:#f6d9c2;color:#7a3f1c}
.sum-key.mid{background:#fbeedd;color:#8a5a2b;border:1px solid #f0dcc0}
.sum-rules{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin:14px 0}
.sum-rules h3{margin:4px 0 6px;font-size:16px;color:var(--accent-d)}
.sum-rules ul{margin:4px 0}
.sum-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
.sum-ctrl-l{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-left:6px}
.sum-btn{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);

<script id="data" type="application/json">[{"idx":0,"order":0,"title":"勞工健康檢查制度","group":"法規與制度","gi":0,"notes_md":"本章 26 題、全卷最多：考體格／健康檢查的義務與免除、附表九項目、特別危害健康作業範圍、紀錄保存年限、認可醫療機構的管理數字，以及醫事法規與預防醫學概念；勞工健康保護規則有 110 年舊版（考試適用）與 115 年新版（多數條文 115.7.1 施行，附表一／九／十與第 17、18、20、21 條延至 117.1.1），答題以舊版為準、要知道新版改了什麼。\n\n## 一、體格檢查與健康檢查的義務與免除\n- 職安法第 20 條：僱用時**體格檢查**；在職一般健檢、特殊健檢、指定項目檢查；認可機構醫師為之，紀錄雇主保存、==費用雇主負擔==，勞工有接受義務。\n- 第 21 條：體格檢查不適於某種工作者，不得僱用其從事==該項工作==（非全面拒絕僱用）。\n- 細則第 27 條：體格檢查＝識別工作適性（目的：選工、配工、建立基線）；健康檢查＝發現健康有無異常（早期診斷職業病）。\n- 得免（舊第 16 條）只限「一般」體格檢查：==六個月內==短期工作、其他法規已有規定（外籍勞工）、指定公告；未超過定期期限並提出證明亦得免。==特殊體格檢查不得免除==，一般與特殊不能互相取代。\n\n| 一般健檢頻率 | 考試當時（舊第 17 條） | 新法（117.1.1 施行） |\n|---|---|---|\n| 未滿 40 歲 | 每 5 年 | 每 3 年 |\n| 40 歲以上 | 40–64 歲每 3 年 | 40–59 歲每 2 年 |\n| 高齡 | 65 歲以上每年 | 60 歲以上每年 |\n\n## 二、一般檢查項目（附表九）\n- 兩欄相同：作業經歷／病史／生活習慣／自覺症狀、身高體重腰圍視力辨色力聽力血壓與身體檢查、胸部 X 光（大片）、尿蛋白及尿潛血、血液、血糖／ALT／肌酸酐／膽固醇／三酸甘油酯／HDL。\n- ==LDL 只在健康檢查欄==（新舊皆同）。舊版血液＝血色素及白血球數；新版加紅血球數、MCV。\n- **沒有**：BUN（在附表十高溫作業）、尿酸、AST、心電圖、大腸鏡。\n\n## 三、特別危害健康作業與特殊健康檢查\n- 附表一舊版 ==32 項==：高溫、==85 分貝==噪音、游離輻射、異常氣壓、鉛、四烷基鉛、粉塵、7 種有機溶劑、23 種特化物（重量比 >1%，苯為體積比；鈹合金 3%）、黃磷、巴拉刈製造、溴丙烷（>5%）。\n- 汞只有==乙基汞化合物、汞及其無機化合物==，沒有甲基汞。新版加苯乙烯、甲苯、二甲苯。\n- 特殊健檢==每年或變更作業時==；雇主交付作業內容、最近一次環測紀錄、暴露情形。\n- 高架、重體力、精密、低溫、振動：只在附表十二考量疾病，==不是==特別危害健康作業。\n- 噪音：85 dB 特殊健檢／防護具；90 dB 工程控制與暴露時間管制（設施規則第 300 條）。\n- 〔10/03 課堂〕特殊健檢人次以==噪音==最多（105 年約 11.5 萬），其次粉塵、游離輻射；第四級人數也是噪音最多（2301 人）、鉛次之（57 人）；目前全國每年約 40 萬人次。\n- 〔10/03 課堂〕身體檢查以**皮膚理學檢查**最常見（多數作業都要看手、臉等暴露部位）；**心臟血管理學檢查**（要用聽診器）講義只列 6 種：高溫、游離輻射、四烷基鉛、二硫化碳、三／四氯乙烯、DMF。精簡版手冊另有異常氣壓（心臟血管）、粉塵（心臟循環），題目若問手冊以手冊為準。\n\n## 四、檢查紀錄保存年限\n| 紀錄 | 年限 |\n|---|---|\n| 附表九一般檢查、（新）附表十一 | ==7 年== |\n| 附表十特殊檢查 | ==10 年== |\n| 舊第 20 條 15 款作業（新增苯乙烯） | ==30 年== |\n- 30 年：游離輻射、粉塵、三氯／四氯乙烯、六種芳香胺、鈹、氯乙烯、苯、鉻酸、砷、鎳、丁二烯、甲醛、銦、石綿、鎘（致癌＋致塵肺＋肺纖維化）。\n- 10 年：噪音、高溫、鉛、汞、錳、正己烷等其餘有機溶劑。\n\n## 五、認可醫療機構的管理\n- 第三者認證：==TAF、CAP==、ILAC 相互認可並==經中央主管機關公告==之機構。\n- 得委託==九項==生物偵測：血鉛、尿鉛、尿鎳、尿無機砷、尿鎘、血汞、尿汞、尿鉻、血清銦；受託機構須有效認證。\n- 訓練：初訓醫師 ==28 小時 14 門課==（無肌肉骨骼／人因）；在職每 ==3 年 10 小時==，職醫法規課 2 小時，網路最多 ==5 小時==。\n- 巡迴健檢：合格巡迴 X 光車；現場醫師、醫檢師（生）、護理人員各一人以上；聽力室背景噪音符合附表三；聽力檢查須醫事人員，==行政人員不可==。\n- 品質管理文件 ==3 年==；特殊健檢登錄檢查日起 ==10 日內==（受檢日不一者次月 10 日前）；定期特殊健檢分級判讀由職醫為之（第 16 條）。\n\n## 六、醫事法規與專業資格\n- 醫療法第 10 條醫事人員＝各「師」與「生／士」；==公共衛生師、社工師、工衛師不是==。\n- 醫師＝==執照制 licensure==；登記制 registration＝登記才能用頭銜；認證 certification＝專科醫師。\n- 醫師法第 8 條之 2 例外：急救、會診支援、應邀出診、主管機關指派、其他==事先報准==（義診、巡迴醫療須報准）。\n\n## 七、預防醫學概念\n- 三段五級：初段（健康促進、特殊保護：防護具、環測）→次段（==早期診斷早期治療==：健康檢查、篩檢、生物偵測）→末段（限制殘障、復健）。\n- ==醫學監測==（健康檢查）、==生物監測==（血鉛、尿汞）、==環境監測==（作業場所濃度）；一般健檢屬醫學監測。\n- 群體分析：分層、橫斷與趨勢比較、對照全國與國外資料，不限前十項。\n- 〔10/03 課堂〕篩檢指標（2×2 表）：敏感度＝真陽性／所有患病者；特異度＝真陰性／所有未患病者；陽性預測值 PPV＝真陽性／所有檢查陽性者。==盛行率越高，PPV 越高==，敏感度與特異度不隨盛行率改變；所以在高暴露作業族群篩檢，陽性結果比較可信。\n\n## 八、職前健康檢查的適性評估〔10/03 課堂〕\n| 職前檢查結果 | 處置 | 課堂舉例 |\n|---|---|---|\n| 無異常 | 正常僱用 | — |\n| 異常，但不影響工作執行、不增加危險 | 告知員工異常＋追蹤計畫，正常僱用 | 紅綠色弱：能辨識紅黃綠即可；血壓、肝功能異常去做護理工作、加油站 |\n| 異常且影響工作執行 | 工作方式能調整→調整或限制工作項目；不能→告知不予僱用 | — |\n| 異常，可能增加健康風險 | 風險嚴重、無法恢復或危及公共安全→不予僱用；否或不確定→告知潛在風險，讓員工自行決定 | 不予僱用：反覆發作的癲癇；自行決定：心肌梗塞後三個月、運動心電圖正常的公車司機 |\n\n- 決策矩陣（嚴重度 × 確定性）：低嚴重低確定→不需介入；**低嚴重高確定**→提供資訊、讓勞工自主決定（例：肩頸痠痛）；**高嚴重低確定**→同樣提供資訊、自主決定（例：五年沒發作的癲癇要做高空作業）；==高嚴重高確定==→排除、調職或修改工作。\n- 職安法第 21 條：體格檢查發現不適於某種工作，只是不得僱用其從事==該項工作==。","questions":[{"qid":"c01q01","q":"依勞工健康保護規則，下列關於勞工體格檢查之敘述，何者錯誤？","options":["非繼續性之臨時性或短期性工作，其工作期間在六個月以內者，得免實施一般體格檢查","其他法規已有體格或健康檢查規定者（例如外籍勞工依就業服務法規定之檢查），得免實施一般體格檢查","距勞工前次檢查未超過定期檢查期限，經勞工提出證明者，得免實施體格檢查","從事特別危害健康作業之外籍勞工，因已依其他法規受檢，得免實施特殊體格檢查"],"answer":3,"recon":"partial","src":["113-4","114-01","114-04","115-01"],"optexp":["**正確**：勞工健康保護規則（舊）第 16 條第 2 項第 1 款：非繼續性之臨時性或短期性工作，其工作期間在六個月以內者，得免實施一般體格檢查。注意免的是「一般」體格檢查。","**正確**：同條第 2 項第 2 款：其他法規已有體格或健康檢查之規定者，得免實施一般體格檢查；外籍勞工依就業服務法體系已受檢，即屬此款。第 3 款為其他經中央主管機關指定公告。","**正確**：同條第 3 項：檢查距勞工前次檢查未超過第 17 條（一般健康檢查）或第 18 條（特殊健康檢查）之定期檢查期限，經勞工提出證明者，得免實施。","**錯誤（本題答案）**：第 16 條第 2 項三種免檢情形只免「一般體格檢查」；從事特別危害健康作業者仍應依附表十實施特殊體格檢查，外籍身分或已依其他法規受檢都不能免除。"],"explanation":"本題考勞工健康保護規則第 16 條「得免實施體格檢查」的範圍。雇主僱用勞工時，應依附表九實施一般體格檢查，並按作業類別依附表十實施特殊體格檢查。第 2 項列三種得免一般體格檢查的情形：(1) 非繼續性之臨時性或短期性工作且工作期間在六個月以內；(2) 其他法規已有體格或健康檢查之規定（如外籍勞工）；(3) 其他經中央主管機關指定公告。第 3 項另定：距前次檢查未超過定期檢查期限並提出證明者得免。關鍵在於這些免除都只針對「一般」體格檢查，特殊體格檢查沒有免除規定；115-01 回憶版的「六個月內工作可免除特殊體格檢查」「外籍勞工可免除特殊體格檢查」都是錯誤敘述。114-01 另考「已做噪音特殊檢查就不用再做一般體格檢查」也是錯的：一般與特殊是兩套不同項目，不能互相取代。115 年新版第 16 條內容相同，只是引用的定期檢查條號改為第 17 條或第 19 條。","dispute":"","review":{"key_points":["得免一般體格檢查三情形：==六個月內==短期工作、其他法規已有規定、中央主管機關指定公告","前次檢查未超過定期檢查期限並提出證明者亦得免","免除只及於「一般」體格檢查；==特殊體格檢查不得免除==","一般與特殊檢查是兩套項目，做了特殊檢查不代表免做一般檢查"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"有下列情形之一者，得免實施前項所定一般體格檢查："},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"一、非繼續性之臨時性或短期性工作，其工作期間在六個月以內。"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"第一項所定檢查距勞工前次檢查未超過第十七條或第十八條規定之定期檢查期限，經勞工提出證明者，得免實施。"}],"note_ref":"一、體格檢查與健康檢查的義務與免除"}},{"qid":"c01q02","q":"有關勞工體格檢查與健康檢查之責任與費用，下列敘述何者正確？","options":["雇主於僱用勞工時應施行體格檢查，檢查費用由雇主負擔","外籍勞工因已依其他規定受檢，可免除特別危害健康作業之特殊健康檢查","新進勞工體格檢查有任何異常，雇主依法即可拒絕僱用","一般健康檢查時，雇主可直接要求認可醫療機構對員工加驗毒品"],"answer":0,"recon":"partial","src":["114-04"],"optexp":["**正確（本題答案）**：職業安全衛生法第 20 條第 1 項：雇主於僱用勞工時應施行體格檢查；第 2 項明定檢查紀錄雇主應予保存，並負擔健康檢查費用。費用由雇主負擔是法定義務。","**錯誤**：勞工健康保護規則第 16 條的免檢情形只免一般體格檢查，特別危害健康作業之特殊體格（健康）檢查沒有免除規定，外籍勞工一樣要做。","**錯誤**：職安法第 21 條第 1 項：體格檢查發現應僱勞工「不適於從事某種工作」者，不得僱用其從事「該項工作」；不是任何異常都可拒絕僱用，且仍可安排其他適合的工作。","**錯誤**：勞工健康檢查項目以附表九（一般）與附表十（特殊）為限，另加中央主管機關指定項目；毒品檢驗非法定項目，雇主不得逕自要求加驗，涉及個資與人格權。"],"explanation":"本題考職業安全衛生法第 20 條與第 21 條的責任歸屬。第 20 條：雇主於僱用勞工時應施行體格檢查，對在職勞工應施行一般健康檢查、特殊健康檢查及經指定之特定項目檢查；檢查應由認可醫療機構之醫師為之，檢查紀錄雇主應予保存並負擔健康檢查費用，勞工則有接受檢查的義務（第 6 項）。114-04 另一版本把「特殊健檢由雇主要求勞工出錢」列為錯誤選項，理由相同。第 21 條：體格檢查發現應僱勞工不適於從事某種工作者，不得僱用其從事該項工作（是限制配置，不是概括拒絕僱用）；健康檢查發現異常者應由醫護人員提供健康指導，不能適應原有工作者應參採醫師建議變更作業場所、更換工作或縮短工作時間。檢查項目部分，附表九、附表十已列明，雇主不得把非法定項目（如毒品）當成僱用條件加驗。","dispute":"","review":{"key_points":["體格檢查與健康檢查費用由==雇主負擔==，紀錄由雇主保存（職安法第 20 條）","勞工對第 20 條之檢查有接受之義務","體格檢查不適於某種工作者，不得僱用其從事==該項工作==，非全面拒絕僱用（第 21 條）","特殊體格檢查沒有免除規定；檢查項目以附表九、十為限"],"refs":[{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"檢查紀錄雇主應予保存，並負擔健康檢查費用"},{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"雇主依前條體格檢查發現應僱勞工不適於從事某種工作，不得僱用其從事該項工作。"},{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"勞工對於第一項之檢查，有接受之義務。"}],"note_ref":"一、體格檢查與健康檢查的義務與免除"}},{"qid":"c01q03","q":"下列何種作業之勞工，雇主無須每年實施特殊健康檢查？","options":["高溫作業","勞工噪音暴露工作日八小時日時量平均音壓級 85 分貝以上之噪音作業","高架作業","游離輻射作業"],"answer":2,"recon":"rebuilt","src":["113-12","114-03"],"optexp":["**須每年檢查**：高溫作業是附表一第一項特別危害健康作業（高溫作業勞工作息時間標準所稱之高溫作業），依第 18 條應每年或於變更作業時實施特殊健康檢查。","**須每年檢查**：附表一第二項：勞工噪音暴露工作日八小時日時量平均音壓級在 85 分貝以上之噪音作業，屬特別危害健康作業，每年實施聽力檢查等特殊健康檢查。","**無須每年特殊健檢（本題答案）**：高架作業不在附表一 32 項特別危害健康作業內，只出現在附表十二「選配工時宜考量疾病之建議表」（癲癇、平衡機能失常、色盲等），依職安法第 19 條減少工時，並無每年特殊健檢義務。","**須每年檢查**：游離輻射作業是附表一第三項特別危害健康作業，每年實施含血球計數、甲狀腺功能等之特殊健康檢查，紀錄並須保存 30 年。"],"explanation":"本題考「特別危害健康作業」的範圍。依勞工健康保護規則（舊）第 18 條，雇主使勞工從事第 2 條規定之特別危害健康作業（附表一），應每年或於變更其作業時依附表十實施特殊健康檢查。舊附表一共 12 大項，含高溫、噪音（85 分貝以上）、游離輻射、異常氣壓、鉛、四烷基鉛、粉塵、7 種有機溶劑、23 種特定化學物質、黃磷、聯吡啶或巴拉刈製造、溴丙烷，合計 32 項作業。高架作業、重體力勞動、精密作業、低溫、振動等雖然也是職安法第 19 條所稱應減少工作時間的作業，但不是特別危害健康作業，只列在附表十二「選配工時宜考量疾病之建議表」中，供醫師在體格檢查時判斷適性配工用。113-12 回憶版大量考「哪些勞工需要每年接受特殊健檢」，判斷方法就是背附表一；114-03 回憶明講「高架作業不是特殊作業，所以不用每年檢查」。115 年新附表一另增列苯乙烯、甲苯、二甲苯三種有機溶劑作業（自 117 年 1 月 1 日施行）。","dispute":"","review":{"key_points":["特別危害健康作業＝附表一（舊版 ==32 項==）；每年或變更作業時實施特殊健康檢查","高架、重體力勞動、精密、低溫、振動作業：只列附表十二考量疾病，==不是==特別危害健康作業","噪音門檻 ==85 分貝==、高溫依作息時間標準、游離輻射、異常氣壓皆在附表一","新附表一（117.1.1 施行）增苯乙烯、甲苯、二甲苯"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"雇主使勞工從事第二條規定之特別危害健康作業，應每年或於變更其作業時，依第十六條附表十所定項目，實施特殊健康檢查。"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"選配工時宜考量疾病之建議表"},{"src":"0000306066","file":"_ref/annex_mol/0000306066.txt","quote":"平衡機能失常、呼吸系統疾病、色盲、視力不良、聽力障礙、肢體殘障"}],"note_ref":"三、特別危害健康作業與特殊健康檢查"}},{"qid":"c01q04","q":"下列有關特殊健康檢查之敘述，何者錯誤？","options":["雇主使勞工接受定期特殊健康檢查時，應將作業內容、最近一次作業環境監測紀錄及危害暴露情形交予醫師","勞工噪音暴露工作日八小時日時量平均音壓級超過 90 分貝者，始須實施噪音作業特殊健康檢查","製造、處置或使用苯之體積比超過百分之一之混合物之作業，應每年實施特殊健康檢查","異常氣壓作業勞工，雇主應每年或於變更其作業時實施特殊健康檢查"],"answer":1,"recon":"partial","src":["113-10","114-03","114-04"],"optexp":["**正確**：勞工健康保護規則（舊）第 18 條第 2 項：雇主使勞工接受定期特殊健康檢查時，應將勞工作業內容、最近一次作業環境監測紀錄及危害暴露情形等作業經歷資料交予醫師。","**錯誤（本題答案）**：附表一第二項噪音作業的門檻是八小時日時量平均音壓級 ==85 分貝==以上；90 分貝是職業安全衛生設施規則第 300 條要求工程控制、減少暴露時間的門檻，不是特殊健檢門檻。","**正確**：附表一第九項：製造、處置或使用特定化學物質或其重量比超過百分之一之混合物之作業，苯特別註明「苯為體積比」；苯作業每年實施特殊健康檢查。","**正確**：異常氣壓作業是附表一第四項特別危害健康作業，每年或變更作業時實施特殊健康檢查；「經驗達 5 年且肩髖關節有問題者做長骨 X 光」只是檢查項目的附加條件，不是頻率。"],"explanation":"本題考噪音法規的兩個門檻與特別危害健康作業的判斷。噪音有三個常考數字：附表一列入特別危害健康作業（須每年特殊健檢）的門檻是 85 分貝；設施規則第 300 條規定機械設備聲音超過 90 分貝時雇主應採取工程控制與減少暴露時間，超過 85 分貝或暴露劑量超過 50% 應使勞工戴防音防護具；第 300-1 條規定 85 分貝以上工作場所應採聽力保護措施，勞工 100 人以上要訂聽力保護計畫。混合物門檻方面，特定化學物質以重量比超過 1%（苯改用體積比 1%），鈹合金以鈹重量比超過 3% 為限，溴丙烷則是重量比超過 5%。114-03 回憶者認為錯在「異常氣壓要每年檢查，但正確要滿 5 年」，這是把附表十異常氣壓作業「從事經驗達 5 年且肩、髖關節有問題者加做關節部長骨 X 光」的項目條件，誤當成檢查頻率；異常氣壓是特別危害健康作業，每年都要做特殊健康檢查。","dispute":"","review":{"key_points":["噪音：==85 dB== 特殊健檢／防護具；==90 dB== 工程控制與管制暴露時間（設施規則第 300 條）","特化物混合物門檻：重量比 1%（苯為==體積比== 1%）；鈹合金 3%；溴丙烷 5%","定期特殊健檢時雇主應交付作業內容、最近一次環測紀錄、暴露情形","異常氣壓作業每年檢查；滿 5 年且肩髖關節有問題者加做長骨 X 光"],"refs":[{"src":"0000306055","file":"_ref/annex_mol/0000306055.txt","quote":"勞工噪音暴露工作日八小時日時量平均音壓級在八十五分貝以上之噪音作業"},{"src":"職業安全衛生設施規則","file":"_ref/職業安全衛生設施規則.txt","quote":"勞工工作場所因機械設備所發生之聲音超過九十分貝時，雇主應採取工程控制、減少勞工噪音暴露時間"},{"src":"0000306055","file":"_ref/annex_mol/0000306055.txt","quote":"製造、處置或使用下列特定化學物質或其重量比（苯為體積比）超過百分之一之混合物之作業"}],"note_ref":"三、特別危害健康作業與特殊健康檢查"}},{"qid":"c01q05","q":"下列何者不是勞工一般「體格檢查」之法定項目？","options":["血色素及白血球數檢查","空腹血糖、血清丙胺酸轉胺酶（ALT）、肌酸酐","膽固醇、三酸甘油酯、高密度脂蛋白膽固醇","低密度脂蛋白膽固醇（LDL-C）"],"answer":3,"recon":"partial","src":["113-5","113-8","114-02"],"optexp":["**是法定項目**：舊附表九體格檢查第 (5) 項「血色素及白血球數檢查」；新附表九（117.1.1 施行）擴充為血色素、紅血球數、平均紅血球容積（MCV）及白血球數。","**是法定項目**：附表九第 (6) 項：血糖（新版明定空腹血糖 sugar AC）、血清丙胺酸轉胺酶（ALT）、肌酸酐，體格檢查與健康檢查兩欄都有。","**是法定項目**：附表九第 (6) 項的血脂：膽固醇、三酸甘油酯、高密度脂蛋白膽固醇，體格檢查欄即列入。","**不是體格檢查項目（本題答案）**：低密度脂蛋白膽固醇只列在在職勞工「健康檢查」欄；「體格檢查」欄的血脂只到高密度脂蛋白膽固醇。舊版與新版附表九皆如此。"],"explanation":"本題考附表九「體格檢查」與「健康檢查」兩欄的差別。附表九兩欄項目幾乎相同：作業經歷與病史調查、身高體重腰圍視力辨色力聽力血壓與身體檢查、胸部 X 光（大片）、尿蛋白及尿潛血、血液檢查、血糖／ALT／肌酸酐／膽固醇／三酸甘油酯／HDL，以及其他經中央主管機關指定之檢查；唯一的差別是低密度脂蛋白膽固醇（LDL-C）只出現在健康檢查欄。114-02 版本問「哪些項目不包含在一般勞工體檢中」，選項 HDL、LDL、尿蛋白尿潛血、胸部 X 光，答案同樣是 LDL。新舊版差異：舊附表九（考試適用）血液項目只有「血色素及白血球數」，115 年修正的新附表九加入紅血球數與 MCV，並把血糖明定為空腹血糖；但兩版都只在健康檢查欄列 LDL。新附表九依第 29 條自 117 年 1 月 1 日施行。","dispute":"","review":{"key_points":["附表九體格檢查血脂只到 ==HDL==；==LDL 只在健康檢查欄==（新舊版皆同）","舊附表九血液項目＝血色素及白血球數；新版加紅血球數與 MCV（117.1.1 施行）","腎功能項目只有肌酸酐；肝功能只有 ALT","體格檢查＝僱用時；健康檢查＝在職定期"],"refs":[{"src":"0000306063","file":"_ref/annex_mol/0000306063.txt","quote":"血色素及白血球數檢查"},{"src":"0000306063","file":"_ref/annex_mol/0000306063.txt","quote":"低密度脂蛋白膽固醇之檢"},{"src":"0000420154","file":"_ref/annex_new/0000420154.txt","quote":"血色素、紅血球數、平均紅血球容積"}],"note_ref":"二、一般檢查項目（附表九）"}},{"qid":"c01q06","q":"下列何項檢查未納入勞工一般健康檢查之法定項目？","options":["血液常規檢查（血色素及白血球數）","尿蛋白及尿潛血檢查","血清丙胺酸轉胺酶（ALT）","血中尿素氮（BUN）"],"answer":3,"recon":"full","src":["113-6","113-10","114-01","114-04"],"optexp":["**已納入**：附表九第 (5) 項血液檢查：舊版為血色素及白血球數，新版加紅血球數與 MCV，一般健康檢查都有。","**已納入**：附表九第 (4) 項「尿蛋白及尿潛血之檢查」，體格檢查與健康檢查皆列。","**已納入**：附表九第 (6) 項的肝功能指標就是血清丙胺酸轉胺酶（ALT），沒有 AST 或 γ-GT。","**未納入（本題答案）**：附表九的腎功能只有肌酸酐（creatinine），沒有血中尿素氮；BUN 出現在附表十高溫作業的特殊檢查（飯前血糖、BUN、肌酸酐與鈉鉀氯電解質）。"],"explanation":"本題考一般健康檢查（附表九）的法定項目清單，重點是「有什麼、沒有什麼」。有的：作業經歷／既往病史／生活習慣／自覺症狀調查；身高、體重、腰圍、視力、辨色力、聽力、血壓與各系統身體檢查；胸部 X 光（大片）；尿蛋白及尿潛血；血色素及白血球數；血糖、ALT、肌酸酐、膽固醇、三酸甘油酯、HDL（健康檢查另加 LDL）；其他經中央主管機關指定之檢查。沒有的：BUN、尿酸、AST、γ-GT、心電圖、大腸鏡、腹部超音波等。BUN 只在附表十高溫作業出現（高溫作業要看血糖、BUN、肌酸酐與電解質）。114-04 另一次把錯誤選項換成「大腸鏡」，同樣未納入；113-10 版本問「何者非常用檢測指標：BUN／尿鉻／尿鎘／尿鉛」也是答 BUN，因為尿鉻、尿鎘、尿鉛都是附表十的生物偵測項目。","dispute":"","review":{"key_points":["附表九腎功能＝==肌酸酐==，沒有 BUN；肝功能＝ALT","BUN 出現在附表十==高溫作業==（飯前血糖、BUN、肌酸酐、鈉鉀氯）","附表九沒有：BUN、尿酸、AST、心電圖、大腸鏡","尿鉻、尿鎘、尿鉛、血鉛是附表十特殊檢查的生物偵測項目"],"refs":[{"src":"0000306063","file":"_ref/annex_mol/0000306063.txt","quote":"尿蛋白及尿潛血之檢查"},{"src":"附表十_old_clean","file":"_ref/annex_mol/附表十_old_clean.txt","quote":"飯前血糖(sugar AC)、血中尿素氮"},{"src":"0000306063","file":"_ref/annex_mol/0000306063.txt","quote":"血糖、血清丙胺酸轉胺酶(ALT)"}],"note_ref":"二、一般檢查項目（附表九）"}},{"qid":"c01q07","q":"依辦理勞工體格與健康檢查醫療機構認可及管理辦法，認可醫療機構辦理勞工健康檢查，下列何項檢查得委託經中央主管機關指定公告之機構辦理？","options":["空腹血糖","甲狀腺功能","血清肌酸酐","尿中汞"],"answer":3,"recon":"full","src":["114-02","114-03","114-04"],"optexp":["**不得委託**：空腹血糖是附表九一般檢查項目，認可辦法第 17 條第 4 項只開放九項生物偵測與指定公告項目委託，其他項目應由認可醫療機構自行辦理。","**不得委託**：甲狀腺功能（free T4、TSH）是游離輻射作業的特殊檢查項目，但不在第 17 條第 4 項的九項清單內，不得委託其他機構。","**不得委託**：血清肌酸酐是一般檢查與多項特殊檢查的常規項目，須由認可醫療機構自備設備辦理。","**得委託（本題答案）**：尿中汞是第 17 條第 4 項九項之一（血中鉛、尿中鉛、尿中鎳、尿中無機砷、尿中鎘、血中汞、尿中汞、尿中鉻、血清銦），得委託經中央主管機關指定公告之機構辦理，受託機構須取得第三者認證。"],"explanation":"本題考認可辦法第 17 條「檢查項目不得委外」的例外清單。原則：認可醫療機構應由所聘僱且執業登記於該機構之醫事人員辦理檢查，不得委託其他機構；例外只有九項生物偵測——血中鉛、尿中鉛、尿中鎳、尿中無機砷、尿中鎘、血中汞、尿中汞、尿中鉻、血清銦——及其他經中央主管機關指定公告之項目，得由經指定公告之機構辦理，且受委託機構應取得第三者認證機構之有效認證。記法：都是重金屬類的血／尿生物偵測（鉛、鎳、砷、鎘、汞、鉻、銦），一般生化、血液常規、甲狀腺功能、肺功能、聽力、X 光都不在內。114-04 回憶版把「九種特殊血尿檢驗可由未認證第三方檢驗」列為錯誤敘述，重點就在受託機構也要有效認證。另一個例外是人力：噪音聽力檢查之聽力師與管理分級判讀之醫師，得經事先報准至該機構辦理（第 17 條第 3 項但書）。","dispute":"","review":{"key_points":["得委託項目＝==九項==生物偵測：血鉛、尿鉛、尿鎳、尿無機砷、尿鎘、血汞、尿汞、尿鉻、血清銦","受委託機構須取得==第三者認證==之有效認證","其他項目（血糖、肌酸酐、甲狀腺功能、肺功能等）不得委託","聽力師與分級判讀醫師得經事先報准支援（第 17 條第 3 項）"],"refs":[{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"除血中鉛、尿中鉛、尿中鎳、尿中無機砷、尿中鎘、血中汞、尿中汞、尿中鉻、血清銦"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"前項受委託辦理檢驗之機構，應取得第三者認證機構之有效認證。"}],"note_ref":"五、認可醫療機構的管理"}},{"qid":"c01q08","q":"認可醫療機構辦理特別危害健康作業檢查項目，應就檢查品質及能力取得第三者認證機構之有效認證。下列何者不是法定之第三者認證機構？","options":["財團法人全國認證基金會（TAF）","美國病理學會（CAP）","取得國際實驗室認證聯盟相互認可協議，並經中央主管機關公告之機構","未經中央主管機關公告，但具國際知名度之民間檢驗認證公司"],"answer":3,"recon":"full","src":["113-9","114-04"],"optexp":["**是法定認證機構**：認可辦法第 5 條第 3 項第 1 款：財團法人全國認證基金會（Taiwan Accreditation Foundation, TAF）。","**是法定認證機構**：第 5 條第 3 項第 2 款：美國病理學會（College of American Pathologists, CAP）。","**是法定認證機構**：第 5 條第 3 項第 3 款：取得國際實驗室認證聯盟（ILAC）相互認可協議或其他國際性實驗室認證，並經中央主管機關公告之機構。","**不是（本題答案）**：第 3 款的要件是「並經中央主管機關公告」，未經公告的民間認證公司即使有國際知名度，也不是法定第三者認證機構。114-04 回憶即以「未經中央主管機關公告」為錯誤選項。"],"explanation":"本題考認可辦法第 5 條特殊健檢認可醫療機構的認證要求。申請辦理特殊體格及健康檢查的醫療機構須：已是一般健檢認可機構、具家醫／內／外／婦產／耳鼻喉／骨／神經／泌尿／眼／皮膚／精神／職醫／放射／病理等四種以上診療科別且醫院評鑑合格、自備特殊檢查設備、申請日前二年內未因違反本辦法被撤銷或廢止認可。辦理中央主管機關指定公告之特別危害健康作業檢查項目時，應就檢查品質及能力取得第三者認證機構之有效認證，法定的第三者認證機構有三類：TAF、CAP、取得 ILAC 相互認可協議或其他國際性實驗室認證並經中央主管機關公告之機構。考點在第三類必須「經公告」。同一個「第三者認證」概念也出現在第 17 條受委託辦理九項生物偵測的機構，以及勞工作業環境監測實施辦法的認證實驗室。","dispute":"","review":{"key_points":["法定第三者認證機構：==TAF==、==CAP==、取得 ILAC 相互認可協議並==經中央主管機關公告==之機構","特殊健檢認可機構須四種以上診療科別且醫院評鑑合格","申請日前二年內未因違反本辦法被撤銷或廢止認可","受委託生物偵測機構同樣須第三者認證"],"refs":[{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"取得國際實驗室認證聯盟相互認可協議或其他國際性實驗室認證，並經中央主管機關公告之機構"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"財團法人全國認證基金會（Taiwan Accreditation Foundation, TAF）"}],"note_ref":"五、認可醫療機構的管理"}},{"qid":"c01q09","q":"下列何者不是醫療法所稱之醫事人員？","options":["牙體技術師","心理師","驗光師","公共衛生師"],"answer":3,"recon":"full","src":["113-8","113-10","114-01","114-03","114-04"],"optexp":["**是醫事人員**：醫療法第 10 條第 1 項明列牙體技術師（及牙體技術生），屬領有中央主管機關核發證書之醫事人員。","**是醫事人員**：第 10 條列有臨床心理師與諮商心理師，兩者依心理師法領證，都是醫事人員。","**是醫事人員**：醫療法第 10 條列有驗光師與驗光生，依驗光人員法領有中央主管機關核發之證書，屬醫事人員。","**不是醫事人員（本題答案）**：公共衛生師依公共衛生師法規範，證書非由醫療法第 10 條所列之「醫事專門職業證書」體系核發，不在醫事人員之列；社工師、工業衛生技師亦同。"],"explanation":"本題考醫療法第 10 條「醫事人員」的定義。條文列舉：醫師、藥師、護理師、物理治療師、職能治療師、醫事檢驗師、醫事放射師、營養師、助產師、臨床心理師、諮商心理師、呼吸治療師、語言治療師、聽力師、牙體技術師、驗光師，以及藥劑生、護士、助產士、物理治療生、職能治療生、醫事檢驗生、醫事放射士、牙體技術生、驗光生，及其他醫事專門職業證書之人員；第 2 項另定醫療法所稱醫師包括醫師、中醫師及牙醫師。判斷方法：有沒有一部「○○師法」由衛生福利部主管並核發醫事專門職業證書。公共衛生師雖是專門職業及技術人員，但公共衛生師法定位為公衛專業，不是醫事人員；社工師、工業衛生技師、職業安全衛生管理師也不是（113-4 版本選項有工衛師）。這題與勞工健檢相關之處在於：認可辦法規定檢查應由醫事人員執行，行政人員不得做聽力檢查。","dispute":"","review":{"key_points":["醫療法第 10 條醫事人員：醫師、藥師、護理師、物理／職能治療師、醫檢師、放射師、營養師、助產師、心理師、呼吸／語言治療師、聽力師、牙體技術師、驗光師及各類生／士","==公共衛生師==、社工師、工業衛生技師都==不是==醫事人員","醫療法所稱醫師含醫師、中醫師、牙醫師"],"refs":[{"src":"醫療法","file":"_ref/醫療法.txt","quote":"本法所稱醫事人員，係指領有中央主管機關核發之醫師、藥師、護理師、物理治療師、職能治療師、醫事檢驗師"},{"src":"醫療法","file":"_ref/醫療法.txt","quote":"本法所稱醫師，係指醫師法所稱之醫師、中醫師及牙醫師。"}],"note_ref":"六、醫事法規與專業資格"}},{"qid":"c01q10","q":"下列關於醫師專業資格制度之敘述，何者錯誤？","options":["醫師屬專門職業及技術人員，其業務與公共利益或人民生命、身體、財產等權利有密切關係","醫師須經國家考試及格、領有醫師證書並辦理執業登記始得執業，屬執照制（licensure）","醫師資格屬登記制（registration），向主管機關登記後即可執行醫療業務","專科醫師證書由中央主管機關甄審核發，性質上屬認證（certification）"],"answer":2,"recon":"rebuilt","src":["113-10","114-02","114-03","114-04"],"optexp":["**正確**：專門職業及技術人員的定義即「依法規應經考試及格領有證書始能執業，且其業務與公共利益或人民生命、身體、財產等權利有密切關係」，醫師是典型例子。114-04 列為正確敘述。","**正確**：醫師法第 8 條：醫師應向執業所在地主管機關申請執業登記，領有執業執照始得執業；未經考試及格、領證與登記者執行醫療業務即構成密醫（第 28 條），此即執照制（licensure）。","**錯誤（本題答案）**：登記制（registration）是登記後才能使用該頭銜，未登記者仍可執行相關業務；醫師未取得執照不得執業，屬執照制而非登記制。回憶版原話：「醫師不是 registered，是 licensed」。","**正確**：專科醫師證書是證明具備某領域能力的認證（certification），沒有專科證書仍可執業，只是不得使用該專科名稱，性質上不同於執照。"],"explanation":"本題考課程講義中專業資格制度的三種類型。執照制（licensure）：法律規定未取得執照不得執行該業務，違者受罰，如醫師、律師；登記制（registration）：向主管機關登記後才能使用特定頭銜，但未登記者不被禁止執行相關工作；認證制（certification）：由主管機關或專業團體證明具備特定能力，如專科醫師甄審。醫師制度是最嚴格的執照制：醫師法第 1 條規定經醫師考試及格並依法領有醫師證書者得充醫師，第 8 條規定執業須登記領執業執照，第 28 條處罰未取得合法醫師資格執行醫療業務者。回憶版多次出現「醫師屬於 register 為錯」「醫師不是 registered，是 licensed」，就是考這個區分。114-04 另有選項「專技人員所從事業務與公共利益或人民生命財產等權利有密切關係」為正確敘述，這是專門職業及技術人員考試法對專技人員的定義。","dispute":"","review":{"key_points":["==執照制 licensure==：未取得不得執業（醫師）；==登記制 registration==：登記才能用頭銜；==認證 certification==：證明能力（專科醫師）","醫師：考試及格→醫師證書→執業登記領執業執照→始得執業","專技人員業務與公共利益或人民生命、身體、財產權利密切相關"],"refs":[{"src":"醫師法","file":"_ref/醫師法.txt","quote":"醫師應向執業所在地直轄市、縣（市）主管機關申請執業登記，領有執業執照，始得執業。"}],"note_ref":"六、醫事法規與專業資格"}},{"qid":"c01q11","q":"依辦理勞工體格與健康檢查醫療機構認可及管理辦法，認可醫療機構應使辦理勞工健檢之醫師接受在職教育訓練，下列敘述何者正確？","options":["每年至少 10 小時","每三年合計至少 10 小時，其中網路學習之時數採計不超過 5 小時","職業醫學科專科醫師免接受在職教育訓練","全部時數皆可以網路學習方式完成"],"answer":1,"recon":"rebuilt","src":["113-9"],"optexp":["**錯誤**：認可辦法第 14 條規定的是「每三年合計至少十小時」，不是每年 10 小時；課程分職業衛生及健康檢查相關法規、健康檢查品質、健康管理及健康促進三類。","**正確（本題答案）**：第 14 條第 1 項每三年合計至少 10 小時；第 3 項規定得於中央主管機關或其認可機構建置之網路學習，其時數採計不超過 5 小時。113-9 回憶：「網路在職訓練時數不得超過 5 小時」。","**錯誤**：職業醫學科專科醫師並非免訓，而是只需接受第 1 款「職業衛生及健康檢查相關法規」課程，每三年合計至少 2 小時（第 14 條第 2 項）。","**錯誤**：網路學習時數採計上限 5 小時，10 小時中至少 5 小時須以實體或其他方式完成，不能全部網路學習。"],"explanation":"本題考認可辦法第 14 條在職教育訓練的三組數字。認可醫療機構應使辦理勞工體格與健康檢查之醫師及護理人員接受在職教育訓練，課程三類：職業衛生及健康檢查相關法規、健康檢查品質、健康管理及健康促進；時數每三年合計至少 10 小時。醫師為職業醫學科專科醫師者，只需接受法規類課程，每三年合計至少 2 小時。前述訓練得於中央主管機關或其認可之機構建置之網路學習，但時數採計不超過 5 小時。與此區分的是「初訓」：第 4 條規定非職醫的醫師與護理人員須先經指定課程訓練合格，醫師課程依附表一共 28 小時（14 門課）、護理人員依附表二。記法：初訓 28 小時、在職 3 年 10 小時、職醫 3 年 2 小時、網路最多 5 小時。","dispute":"","review":{"key_points":["在職訓練：每 ==3 年至少 10 小時==（法規、健檢品質、健康管理與健康促進）","職醫只需法規課程，每 3 年至少 ==2 小時==","網路學習採計上限 ==5 小時==","初訓：醫師附表一 ==28 小時==、14 門課"],"refs":[{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"其訓練時間每三年合計至少十小時"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"其時數之採計不超過五小時"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"其訓練時間每三年合計至少二小時，不受前項規定之限制"}],"note_ref":"五、認可醫療機構的管理"}},{"qid":"c01q12","q":"依辦理勞工體格與健康檢查醫療機構認可及管理辦法附表一，從事辦理勞工體格與健康檢查業務之醫師訓練課程（共 28 小時）不包含下列何者？","options":["噪音作業及聽力檢查","職業性腎臟危害及腎臟功能判讀","職業性肌肉骨骼疾病評估與人因工程","職業性皮膚疾病及皮膚身體檢查"],"answer":2,"recon":"rebuilt","src":["113-12","114-02"],"optexp":["**包含**：附表一第 4 項「噪音作業及聽力檢查」2 小時，是 14 門課之一，對應噪音作業特殊健檢的聽力圖判讀。","**包含**：附表一第 7 項「職業性腎臟危害及腎臟功能判讀」2 小時，是六門器官系統課程之一（腎、血液、肝、神經、肺、皮膚）。","**不包含（本題答案）**：肌肉骨骼疾病與人因工程不在附表一 14 門課程內；附表一的器官系統課程只有腎臟、血液造血、肝、神經、肺（塵肺症）、皮膚。本選項為重建。","**包含**：附表一第 14 項「職業性皮膚疾病及皮膚身體檢查」2 小時，是 14 門課的最後一門，合計 28 小時。"],"explanation":"本題考認可辦法附表一「從事辦理勞工體格與健康檢查業務之醫師訓練課程及時數表」，共 14 門課 28 小時：職業衛生及健康檢查相關法規（3 小時，含環測辦法、健康保護規則、預防職業病健檢辦法及認可辦法）、醫療相關法規（1）、勞工健檢概論及健檢品質管控（2）、噪音作業及聽力檢查（2）、職業醫學概論（2）、特別危害健康作業健康檢查指引與管理分級簡介及健康管理（2）、職業性腎臟危害及腎臟功能判讀（2）、各種常見製造程序之健康危害簡介（2）、重金屬作業健康危害與其身體檢查及生物偵測（2）、職業性血液造血系統危害及 CBC 判讀（2）、職業性肝危害及肝功能判讀（2）、職業性神經系統危害及神經身體檢查（2）、塵肺症及職業性肺部疾病（2）、職業性皮膚疾病及皮膚身體檢查（2）。回憶版：「主要就是上課主題，不在主題內就是答案」——肌肉骨骼、人因工程、心理健康、母性保護都不是這 28 小時的課名。","dispute":"","review":{"key_points":["醫師初訓 ==28 小時、14 門課==；法規 3 小時、醫療相關法規 1 小時，其餘各 2 小時","器官系統課：腎、血液造血（CBC）、肝、神經、肺（塵肺）、皮膚","肌肉骨骼／人因工程、心理健康不在附表一課程內"],"refs":[{"src":"0000321372","file":"_ref/annex_n40/0000321372.txt","quote":"職業性腎臟危害及腎臟功能判讀"},{"src":"0000321372","file":"_ref/annex_n40/0000321372.txt","quote":"噪音作業及聽力檢查"},{"src":"0000321372","file":"_ref/annex_n40/0000321372.txt","quote":"職業性皮膚疾病及皮膚身體檢查"}],"note_ref":"五、認可醫療機構的管理"}},{"qid":"c01q13","q":"認可醫療機構辦理巡迴勞工體格及健康檢查，下列敘述何者錯誤？","options":["應自備或租用合格之巡迴 X 光車","現場應置有醫師、醫事檢驗師（生）、護理人員及其他相關檢查之必要醫事人員各一人以上執行業務","辦理噪音作業特殊健康檢查時，移動式聽力檢查室（亭）之背景噪音量於檢查期間應符合規定並留存紀錄","為節省人力，聽力檢查得由受過訓練之行政人員執行"],"answer":3,"recon":"rebuilt","src":["113-1","113-10","114-04"],"optexp":["**正確**：認可辦法第 6 條：申請辦理巡迴勞工體格及健康檢查業務者，應自備或租用合格之巡迴 X 光車，並符合醫院評鑑合格或聘有醫師二名以上（含一名職醫）等條件之一。","**正確**：第 15 條第 1 款：巡迴檢查時應置有醫師、醫事檢驗師（生）、護理人員及其他相關檢查之必要醫事人員各一人以上在現場執行業務。","**正確**：第 15 條第 2 款：辦理噪音作業特殊體格及健康檢查時，聽力檢查室（亭）背景噪音量於檢查期間測定值應符合附表三規定（500／1000 Hz 40 dB 等），並留存紀錄。","**錯誤（本題答案）**：聽力檢查屬醫療業務，依第 17 條第 3 項應由認可醫療機構所聘醫事人員（聽力師、護理人員等）執行，行政人員不得執行；113-10、114-04 回憶皆標為錯誤。"],"explanation":"本題考認可辦法第 6 條與第 15 條巡迴健檢的規定。申請巡迴健檢的條件（第 6 條）：自備或租用合格之巡迴 X 光車，且醫院評鑑合格，或者聘有醫師二名以上（其中一名為職業醫學科專科醫師）、三年以上健檢實務經驗且無違規、具備一般健檢設備及醫檢師（生）、放射師（士）與護理人員。巡迴檢查時的義務（第 15 條）：現場置醫師、醫事檢驗師（生）、護理人員及其他必要醫事人員各一人以上；噪音特殊健檢時聽力檢查室（亭）背景噪音量須符合附表三並留存紀錄；依公告內容及方式登錄系統。人力來源方面，檢查應由該機構所聘僱且執業登記於該機構之醫事人員為之，但聽力師與分級判讀醫師得經事先報准支援（第 17 條第 3 項）；114-04 回憶把「巡迴醫療人力不足可找一般醫師支援」視為正確選項，但依認可辦法第 17 條第 3 項，可事先報准外來支援的只有聽力師與分級判讀醫師，此回憶答案存疑。聽力檢查不限耳鼻喉科醫師，但一定要由醫事人員執行。","dispute":"","review":{"key_points":["巡迴健檢須==自備或租用合格巡迴 X 光車==（第 6 條）","現場人力：醫師、醫檢師（生）、護理人員及其他必要醫事人員==各一人以上==（第 15 條）","噪音健檢的聽力室背景噪音須符合附表三（500／1000 Hz ≤40 dB）並留存紀錄","聽力檢查須由醫事人員執行，==行政人員不可==；支援醫師須事先報准"],"refs":[{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"應自備或租用合格之巡迴X光車"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"置有醫師、醫事檢驗師（生）、護理人員及其他相關檢查之必要醫事人員各一人以上在現場執行業務"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"其聽力檢查室（亭）背景噪音量，於實施勞工聽力檢查期間，測定值符合附表三之規定，並留存紀錄"}],"note_ref":"五、認可醫療機構的管理"}},{"qid":"c01q14","q":"依醫師法，醫師執業應在所在地主管機關核准登記之醫療機構為之。下列何者錯誤？","options":["急救、執業機構間之會診或支援、應邀出診，不受執業處所之限制","各級主管機關指派執行緊急醫療或公共衛生醫療業務，不受執業處所之限制","其他情形須事先報所在地主管機關核准","義診及巡迴醫療屬公益性質，無須事先報備支援"],"answer":3,"recon":"rebuilt","src":["113-10","114-03"],"optexp":["**正確**：醫師法第 8 條之 2 但書第 1 至 3 款：急救；執業機構間之會診、支援；應邀出診，皆不受執業處所限制。","**正確**：第 8 條之 2 第 4 款：各級主管機關指派執行緊急醫療或公共衛生醫療業務，不受執業處所限制。","**正確**：第 8 條之 2 第 5 款：其他情形須「事先報所在地主管機關核准」，屬概括條款。","**錯誤（本題答案）**：義診與巡迴醫療不在前四款列舉範圍，屬第 5 款「其他」情形，須事先報所在地主管機關核准；113-10 回憶「義診及巡迴醫療可以不用報備支援」為錯誤敘述。"],"explanation":"本題考醫師法第 8 條之 2「一處執業」原則與五種例外。原則：醫師執業應在所在地主管機關核准登記之醫療機構、長期照顧服務機構、精神復健機構或其他經中央主管機關認可之機構為之。例外五款：(1) 急救；(2) 執業機構間之會診、支援；(3) 應邀出診；(4) 各級主管機關指派執行緊急醫療或公共衛生醫療業務；(5) 其他事先報所在地主管機關核准。義診、巡迴醫療、到其他醫療機構看診支援（含勞工健檢的巡迴或支援判讀）都要事先報准，只有急救、會診支援、應邀出診與主管機關指派四種不用。這與認可辦法第 17 條第 3 項相扣：聽力師與分級判讀醫師得「依各類醫事人員有關法律規定，經事先報准」至認可醫療機構辦理。違反第 8 條之 2 依第 27 條處 2 萬至 10 萬元罰鍰。","dispute":"","review":{"key_points":["一處執業例外五款：==急救、會診支援、應邀出診、主管機關指派==、其他==事先報准==","義診、巡迴醫療屬第 5 款，須事先報所在地主管機關核准","違反第 8 條之 2 處新臺幣 2 萬至 10 萬元罰鍰（第 27 條）","健檢支援醫師、聽力師須事先報准（認可辦法第 17 條第 3 項）"],"refs":[{"src":"醫師法","file":"_ref/醫師法.txt","quote":"五、其他事先報所在地主管機關核准。"},{"src":"醫師法","file":"_ref/醫師法.txt","quote":"四、各級主管機關指派執行緊急醫療或公共衛生醫療業務。"}],"note_ref":"六、醫事法規與專業資格"}},{"qid":"c01q15","q":"依職安署公告，認可醫療機構辦理勞工特殊健康檢查之資料登錄，下列敘述何者正確？","options":["應於檢查日起 10 日內完成辦理期程、作業類別與認可醫療機構等資料之登錄；勞工受檢日期不一者，於次月 10 日前完成上月份資料登錄","檢查資料於檢查完成後 60 日內登錄即可","採巡迴健檢者免登錄辦理期程","只有檢查結果異常者才須登錄"],"answer":0,"recon":"rebuilt","src":["114-03"],"optexp":["**正確（本題答案）**：依勞工健康保護規則（舊）第 26 條，雇主實施特殊健康檢查應將辦理期程、作業類別與醫療機構登錄於公告系統；職安署公告定為檢查日起 10 日內完成，受檢日期不一者於次月 10 日前完成上月份資料登錄。","**錯誤**：公告要求的是 10 日內（或次月 10 日前），不是 60 日；回憶者也明確標記「60 日內」選項錯誤。不要與環境監測結果 45 日內通報混淆。","**錯誤**：巡迴健檢不但不免登錄，公告另要求採巡迴健檢者應於實施檢查前 10 日先登錄辦理期程；認可辦法第 15 條第 3 款也規定巡迴檢查應依公告方式登錄系統。","**錯誤**：登錄的是辦理期程、作業類別、認可醫療機構等辦理資訊與特殊健檢資料，不是只有異常者；一般健康檢查結果的通報才是以指定項目發現異常者為限（職安法第 20 條第 4 項）。"],"explanation":"本題考特殊健康檢查資料登錄的期限，屬 114-03 新題型。法源是勞工健康保護規則（舊）第 26 條（新版第 27 條）：雇主實施勞工特殊健康檢查，應將辦理期程、作業類別與辦理醫療機構等內容登錄於中央主管機關公告之系統。依職安署公告（回憶版引述）：應於檢查日起 10 日內完成辦理期程、作業類別與認可醫療機構等資料登錄；勞工受檢日期不一者，於實施檢查之次月 10 日前完成上月份之檢查資料登錄；採巡迴健檢者應另於實施檢查前 10 日登錄辦理期程。要與另外兩個時限區分：作業環境監測結果是採樣或測定後 45 日內通報（環測辦法第 12 條）；醫療機構對健康檢查結果的通報依職安法第 20 條第 4 項，一般健康檢查結果只通報指定項目異常者。本題的 10 日／次月 10 日數字來自公告而非法規條文，考題以回憶版為準。","dispute":"114-03 回憶版只記得「10 日內／次月 10 日前」與「60 日內為錯誤」，其餘選項為重建；10 日的期限出自職安署公告而非法規本文，_ref 法規檔案中僅能核對到「應登錄於中央主管機關公告之系統」的授權條文。","review":{"key_points":["特殊健檢登錄：檢查日起 ==10 日內==；受檢日期不一者==次月 10 日前==完成上月資料","巡迴健檢：實施檢查前 10 日先登錄辦理期程","環測結果通報 ==45 日==（新舊相同）；暴露評估報告 90 日為新辦法第 13 條（116.1.1 施行）——不要混淆","一般健檢結果通報以指定項目異常者為限（職安法第 20 條第 4 項）"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"雇主實施勞工特殊健康檢查，應將辦理期程、作業類別與辦理勞工體格及健康檢查之醫療機構等內容，登錄於中央主管機關公告之系統。"},{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"依中央主管機關公告之內容及方式登錄系統"},{"src":"職業安全衛生法","file":"_ref/職業安全衛生法.txt","quote":"但一般健康檢查結果之通報，以指定項目發現異常者為限。"}],"note_ref":"五、認可醫療機構的管理"}},{"qid":"c01q16","q":"勞工定期健康檢查屬於三段五級預防之哪一階段？","options":["第一段預防（初段預防）","第二段預防（次段預防，早期診斷早期治療）","第三段預防（末段預防）","第五級（復健）"],"answer":1,"recon":"full","src":["113-2","114-03"],"optexp":["**錯誤**：第一段預防是疾病發生前的健康促進（第一級）與特殊保護（第二級），如衛教、預防接種、個人防護具、環境改善；健康檢查是找已存在的異常，不屬此段。","**正確（本題答案）**：定期健康檢查目的是在無症狀期早期發現異常、早期治療，屬三段五級中第二段（次段）預防的第三級「早期診斷、早期治療」。","**錯誤**：第三段（末段）預防是疾病已發生後限制殘障（第四級）與復健（第五級），健康檢查發生在疾病臨床期之前。","**錯誤**：第五級是復健，屬第三段（末段）預防，對象是已經失能或殘障的病人；健康檢查是找早期異常，與復健無關。"],"explanation":"本題考三段五級預防的分類。第一段（初段）預防：第一級健康促進（衛教、營養、運動）、第二級特殊保護（預防接種、個人防護具、作業環境控制）；第二段（次段）預防：第三級早期診斷、早期治療（篩檢、健康檢查、生物偵測）；第三段（末段）預防：第四級限制殘障、第五級復健。勞工一般或特殊健康檢查是在疾病症狀前期偵測異常，屬次段預防。職安法施行細則第 27 條也把一般健康檢查定義為「為發現健康有無異常，以提供適當健康指導、適性配工等健康管理措施」，就是早期發現的概念。與本題相鄰的考點：個人防護具、作業環境監測是初段預防的特殊保護；職災後復健是末段預防。","dispute":"","review":{"key_points":["三段五級：初段（==健康促進、特殊保護==）→次段（==早期診斷早期治療==）→末段（限制殘障、復健）","健康檢查、篩檢、生物偵測＝次段預防（第三級）","個人防護具、環境監測、預防接種＝初段預防特殊保護","復健＝第五級末段預防"],"refs":[{"src":"職業安全衛生法施行細則","file":"_ref/職業安全衛生法施行細則.txt","quote":"一般健康檢查：指雇主對在職勞工，為發現健康有無異常，以提供適當健康指導、適性配工等健康管理措施"}],"note_ref":"七、預防醫學概念"}},{"qid":"c01q17","q":"下列何者屬於次段預防？","options":["個人防護具","生物偵測","作業環境監測","職災後復健"],"answer":1,"recon":"full","src":["113-2","113-4","114-01"],"optexp":["**不屬於次段**：個人防護具是阻斷暴露、在疾病發生前的特殊保護，屬初段預防第二級。","**屬於次段（本題答案）**：生物偵測（血鉛、尿砷、尿中 2,5-己二酮等）是在暴露之後、疾病之前偵測體內劑量或早期效應，早期發現異常以介入，課程歸為次段預防。","**不屬於次段**：作業環境監測是在暴露端掌握危害濃度以控制暴露，是疾病發生前的初段預防措施。","**不屬於次段**：職災後復健是疾病已發生、限制殘障後的功能恢復，屬末段預防第五級。"],"explanation":"本題延續三段五級的分類，考職業衛生各項措施的歸類。初段預防（暴露發生前）：作業環境監測、工程控制、個人防護具、教育訓練；次段預防（暴露後、疾病前或早期）：特殊健康檢查、生物偵測（測定血液、尿液中的化學物或其代謝物，如血鉛、尿鎘、尿汞、尿中 2,5-己二酮）、篩檢；末段預防：職業病治療後的復健與職務再設計。判斷的關鍵是「時間點」：防護具與環境監測在勞工吸收危害物之前；生物偵測已經反映體內負荷，屬早期發現；復健則在疾病造成失能之後。此題與前一題（健康檢查屬次段預防）是同一組概念的兩種問法，113-2、113-4、114-01 都出現。","dispute":"","review":{"key_points":["==生物偵測==（血鉛、尿砷等）＝次段預防：偵測體內負荷、早期發現","個人防護具、作業環境監測＝初段預防（特殊保護）","復健＝末段預防","判斷依「時間點」：暴露前→初段；暴露後疾病前→次段；疾病後→末段"],"refs":[],"note_ref":"七、預防醫學概念"}},{"qid":"c01q18","q":"勞工一般健康檢查屬於下列哪一種監測？","options":["醫學監測（medical surveillance）","心理監測","環境監測","生物監測（biological monitoring）"],"answer":0,"recon":"full","src":["114-02","114-03"],"optexp":["**正確（本題答案）**：醫學監測（medical surveillance）是以健康檢查、症狀與疾病資料監測勞工健康狀況；一般健康檢查（附表九）就是典型的醫學監測。","**錯誤**：心理監測不是職業衛生監測的標準分類；一般健康檢查雖含自覺症狀調查，但整體屬醫學監測。","**錯誤**：環境監測（作業環境監測）測的是作業場所空氣中危害物濃度、噪音、WBGT，對象是環境不是勞工身體。","**錯誤**：生物監測（biological monitoring）測的是體內化學物或其代謝物濃度（血鉛、尿汞等），一般健康檢查沒有這類項目。"],"explanation":"本題考職業衛生三種監測的區分：環境監測（environmental monitoring）測作業場所的危害物濃度或物理因子；生物監測／生物偵測（biological monitoring）測勞工體內的化學物、代謝物或早期生化效應，如血鉛、尿鎘、尿中馬尿酸、ZPP；醫學監測（medical surveillance）以健康檢查、症狀、疾病與失能資料監測勞工健康，找出早期健康效應。一般健康檢查的項目是身體檢查、胸部 X 光、尿液、血液常規與生化，沒有體內危害物的測定，是醫學監測。特殊健康檢查則是醫學監測為主，其中的血鉛、尿汞等項目屬生物偵測。114-02 標記答案為醫學監測；114-03 回憶者寫「一般勞工體檢屬於生物監測；特殊勞工體檢屬於醫學監測」，與定義不符，應以醫學監測為準（見爭議註記）。","dispute":"114-02 標記答案為醫學監測；114-03 回憶者卻寫「一般勞工體檢屬於生物監測；特殊勞工體檢屬於醫學監測」。依定義，生物監測是測定體內化學物或其代謝物，一般健康檢查沒有這類項目，只能歸為醫學監測；應試時選「醫學監測」。","review":{"key_points":["==醫學監測==：健康檢查、症狀、疾病資料；一般健康檢查屬之","==生物監測==：體內化學物或代謝物（血鉛、尿汞、尿中 2,5-己二酮）","==環境監測==：作業場所空氣中濃度、噪音、WBGT","特殊健康檢查＝醫學監測＋部分生物偵測項目"],"refs":[{"src":"職業安全衛生法施行細則","file":"_ref/職業安全衛生法施行細則.txt","quote":"一般健康檢查：指雇主對在職勞工，為發現健康有無異常，以提供適當健康指導、適性配工等健康管理措施"}],"note_ref":"七、預防醫學概念"}},{"qid":"c01q19","q":"下列何者不是勞工「體格檢查」（僱用時檢查）之主要目的？","options":["選擇適合該工作之勞工","作為適性配工、分配合理工作之依據","早期診斷職業病","建立基礎健康資料，作為日後健康變化與職業病鑑定之參考"],"answer":2,"recon":"partial","src":["115-02"],"optexp":["**是目的**：職安法施行細則第 27 條：體格檢查是「為識別勞工工作適性，考量其是否有不適合作業之疾病」，選擇適合該工作的勞工正是核心。","**是目的**：體格檢查結果供適性配工，職安法第 21 條規定發現不適於從事某種工作者不得僱用其從事該項工作，勞工健康保護規則第 23 條並要求參採醫師建議適當配置。","**不是目的（本題答案）**：早期診斷職業病是「定期健康檢查」（特別是特殊健康檢查）的目的；體格檢查在僱用時實施，此時勞工尚未暴露於該工作的危害，談不上診斷該工作的職業病。","**是目的**：僱用時的檢查建立基線資料（baseline），日後定期檢查比較變化，也是職業病鑑定「暴露前是否已有異常」的重要依據，是教科書列的體格檢查目的之一。"],"explanation":"本題考體格檢查與健康檢查的目的差異。體格檢查（pre-placement examination）在僱用時實施，職安法施行細則第 27 條定義為「識別勞工工作適性，考量其是否有不適合作業之疾病所實施之身體檢查」，目的有三：選擇適合該工作的勞工、作為適性配工的依據、建立基線健康資料供日後比較與鑑定。定期健康檢查（一般與特殊）則是「發現健康有無異常」，特殊健康檢查更進一步「實施分級管理」，目的在早期發現工作相關的健康效應與職業病。因此「早期診斷職業病」不是體格檢查的主要目的。115-02 回憶者對答案不確定，曾標 D，但建立基線資料是體格檢查的教科書目的，題目問「不是」，只有早期診斷職業病不符（見爭議註記）。","dispute":"115-02 回憶者標「D？」且自述不確定。依施行細則第 27 條，體格檢查目的是識別工作適性，建立基線資料亦為公認目的；早期診斷職業病屬定期健康檢查的目的，故應試選 C。","review":{"key_points":["體格檢查（僱用時）三目的：==選工、適性配工、建立基線資料==","早期診斷職業病＝定期（特殊）健康檢查的目的","細則第 27 條：體格檢查為識別工作適性；健康檢查為發現健康有無異常","體格檢查發現不適於某工作者，不得僱用其從事該項工作"],"refs":[{"src":"職業安全衛生法施行細則","file":"_ref/職業安全衛生法施行細則.txt","quote":"本法第二十條第一項所稱體格檢查，指於僱用勞工時，為識別勞工工作適性，考量其是否有不適合作業之疾病所實施之身體檢查。"}],"note_ref":"一、體格檢查與健康檢查的義務與免除"}},{"qid":"c01q20","q":"認可醫療機構應訂定辦理勞工體格與健康檢查之品質及管理計畫，其執行事項與實施管理之文件及紀錄，至少應保存多久？","options":["一年","三年","五年","十年"],"answer":1,"recon":"full","src":["114-02"],"optexp":["**錯誤**：認可辦法沒有一年的保存規定；品質及管理計畫的執行文件與紀錄依第 18 條第 3 項至少保存三年。","**正確（本題答案）**：認可辦法第 18 條第 3 項：品質及管理計畫所定執行事項與實施管理之文件及紀錄，應至少保存三年。","**錯誤**：五年不是本辦法的數字；容易混淆的是醫療法病歷七年、一般健檢紀錄七年。","**錯誤**：十年是附表十特殊體格（健康）檢查紀錄的保存年限（勞工健康保護規則），不是品質管理文件。"],"explanation":"本題考認可辦法第 18 條品質及管理計畫。認可醫療機構應依認可類別訂定辦理勞工體格與健康檢查之品質及管理計畫並據以執行，內容包括：組織及權責、檢查場所之標示安全及隱私保護、醫事人員教育訓練、儀器設備及實驗室管理、檢查執行程序、檢查結果處理程序、檢查報告及紀錄管理、其他公告事項；執行事項與實施管理之文件及紀錄至少保存三年。「三年」在本考試出現在多處，要分辨主體：認可機構品質管理文件 3 年；設施規則第 300-1 條聽力保護措施執行紀錄 3 年；考試當時環測辦法一般監測紀錄 3 年。與檢查紀錄的保存（雇主：一般 7 年、特殊 10 年、特定作業 30 年；醫療法病歷 7 年）不同。","dispute":"","review":{"key_points":["認可機構品質及管理計畫文件與紀錄：至少 ==3 年==（認可辦法第 18 條）","3 年的其他主體：聽力保護措施執行紀錄、考試當時一般環測紀錄","檢查紀錄保存：一般 7 年、特殊 10 年、30 年清單；病歷 7 年","品質計畫內容含組織權責、隱私保護、教育訓練、實驗室管理、紀錄管理"],"refs":[{"src":"辦理勞工體格與健康檢查醫療機構認可及管理辦法","file":"_ref/辦理勞工體格與健康檢查醫療機構認可及管理辦法.txt","quote":"第一項所定執行事項與實施管理之文件及紀錄，應至少保存三年。"}],"note_ref":"五、認可醫療機構的管理"}},{"qid":"c01q21","q":"勞工一般體格及健康檢查紀錄，雇主至少應保存幾年？","options":["三年","五年","七年","十年"],"answer":2,"recon":"full","src":["114-02","114-04"],"optexp":["**錯誤**：三年是考試當時作業環境監測紀錄的一般保存年限與認可機構品質文件年限，不是健檢紀錄。","**錯誤**：勞工健康保護規則的保存年限只有 7 年、10 年、30 年三種，沒有五年的規定；五年容易與舊法未滿 40 歲每五年一次的健檢頻率混淆。","**正確（本題答案）**：勞工健康保護規則（舊）第 19 條第 1 款：附表九一般體格（健康）檢查紀錄至少保存七年；新版第 20 條相同，並將附表十一夜間工作健檢紀錄一併定為七年。","**錯誤**：十年是附表十各項特殊體格（健康）檢查紀錄的保存年限（舊第 19 條第 2 款）。"],"explanation":"本題考勞工健康保護規則的檢查紀錄保存三層結構。第一層：附表九一般體格（健康）檢查紀錄至少保存 7 年（舊第 19 條第 1 款；新第 20 條，並含附表十一長期夜間工作健檢紀錄）。第二層：附表十特殊體格（健康）檢查紀錄至少保存 10 年（舊第 19 條第 2 款；新第 20 條）。第三層：舊第 20 條（新第 21 條）所列作業的特殊檢查紀錄至少保存 30 年：游離輻射、粉塵、三氯乙烯及四氯乙烯、聯苯胺等六種芳香胺、鈹、氯乙烯、苯、鉻酸及重鉻酸鹽、砷、鎳、1,3-丁二烯、甲醛、銦、石綿、鎘，新版第 21 條再加苯乙烯（117.1.1 施行）。健康追蹤檢查紀錄比照辦理。醫療法第 70 條病歷保存 7 年與一般健檢的 7 年數字相同，容易記。","dispute":"","review":{"key_points":["一般體格（健康）檢查紀錄 ==7 年==；特殊 ==10 年==；特定作業 ==30 年==","30 年清單：游離輻射、粉塵、三氯／四氯乙烯、芳香胺六種、鈹、氯乙烯、苯、鉻酸、砷、鎳、丁二烯、甲醛、銦、石綿、鎘（新增苯乙烯）","新版第 20 條：附表十一夜間工作健檢紀錄亦 7 年","醫療法病歷 7 年（未成年至成年後 7 年）"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"檢查紀錄至少保存七年"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"檢查紀錄至少保存十年"}],"note_ref":"四、檢查紀錄保存年限"}},{"qid":"c01q22","q":"下列特殊體格（健康）檢查紀錄之保存年限，何者錯誤？","options":["粉塵作業：30 年","游離輻射作業：30 年","1,3-丁二烯作業：10 年","噪音作業：10 年"],"answer":2,"recon":"full","src":["113-10","114-04"],"optexp":["**正確**：粉塵作業列在勞工健康保護規則（舊）第 20 條第 2 款，特殊體格（健康）檢查紀錄至少保存 30 年。","**正確**：游離輻射是第 20 條第 1 款，因致癌效應潛伏期長，特殊體格（健康）檢查紀錄保存 30 年；游離輻射與粉塵是清單前兩款。","**錯誤（本題答案）**：1,3-丁二烯列在第 20 條第 11 款，屬 30 年清單，不是 10 年。","**正確**：噪音作業不在第 20 條 15 款清單內，依第 19 條第 2 款一般特殊檢查紀錄保存 10 年。"],"explanation":"本題考 30 年保存清單。勞工健康保護規則（舊）第 20 條列 15 款作業，其特殊體格（健康）檢查紀錄至少保存 30 年：游離輻射；粉塵；三氯乙烯及四氯乙烯；聯苯胺與其鹽類、4-胺基聯苯、4-硝基聯苯、β-萘胺、二氯聯苯胺、α-萘胺及其鹽類；鈹；氯乙烯；苯；鉻酸與其鹽類、重鉻酸及其鹽類；砷；鎳；1,3-丁二烯；甲醛；銦；石綿；鎘。新版第 21 條增列第 16 款苯乙烯（117.1.1 施行）。記法：致癌物（IARC 第 1 類為主）加上致塵肺症的粉塵、石綿，以及銦、鈹這類肺纖維化與致癌物。不在清單的特殊作業都是 10 年：高溫、噪音、異常氣壓、鉛、四烷基鉛、四氯乙烷、四氯化碳、二硫化碳、DMF、正己烷、異氰酸酯類、錳、乙基汞、汞、黃磷、巴拉刈、溴丙烷。113-10 版本的選項「粉塵 30／游離輻射 10／丁二烯 10／噪音 10」錯的不只一個，是回憶不完整（見爭議註記）。","dispute":"113-10 回憶版選項為「粉塵 30／游離輻射 10／丁二烯 10／噪音 10」，依第 20 條游離輻射與丁二烯都是 30 年，該版本有兩個錯誤選項，顯示回憶不完整；本題已改為只有丁二烯一個錯誤選項。","review":{"key_points":["30 年清單共 15 款（新版 16 款加==苯乙烯==）：==1,3-丁二烯==、甲醛、銦、鎘、鎳、砷都在內","噪音、高溫、鉛、汞、正己烷等有機溶劑：10 年","記法：致癌物＋致塵肺（粉塵、石綿）＋肺纖維化（銦、鈹）→ 30 年","游離輻射、粉塵是 30 年清單前兩款"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"從事下列作業之各項特殊體格（健康）檢查紀錄，應至少保存三十年："},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"十一、1,3-丁二烯。"},{"src":"勞工健康保護規則","file":"_ref/勞工健康保護規則.txt","quote":"十六、苯乙烯。"}],"note_ref":"四、檢查紀錄保存年限"}},{"qid":"c01q23","q":"下列何種特別危害健康作業之特殊健康檢查紀錄，法定保存年限為 10 年而非 30 年？","options":["苯","氯乙烯","正己烷","四氯乙烯"],"answer":2,"recon":"rebuilt","src":["113-2","113-4","113-8","113-10"],"optexp":["**30 年**：苯列在勞工健康保護規則（舊）第 20 條第 7 款，紀錄保存 30 年（113-10 回憶：苯 30 年）。","**30 年**：氯乙烯是第 20 條第 6 款，保存 30 年（回憶版：氯乙烯特殊體格檢查保存 30 年）。","**10 年（本題答案）**：正己烷雖是附表一第八項有機溶劑作業，但不在第 20 條 30 年清單內，依第 19 條第 2 款保存 10 年；回憶版「正己烷體檢資料保存 10 年」。","**30 年**：三氯乙烯及四氯乙烯是第 20 條第 3 款，保存 30 年；113-2 回憶考四氯乙烯健檢紀錄保存幾年，選項 3／30／10，答 30。"],"explanation":"本題把回憶版分別考過的四個物質放在一起：四氯乙烯 30 年、苯 30 年、氯乙烯 30 年、正己烷 10 年。判斷原則：附表一七種有機溶劑作業中只有三氯乙烯與四氯乙烯進入 30 年清單，其餘五種（1,1,2,2-四氯乙烷、四氯化碳、二硫化碳、二甲基甲醯胺、正己烷）都是 10 年；特定化學物質中致癌物（聯苯胺等芳香胺、鈹、氯乙烯、苯、鉻酸、砷、鎳、丁二烯、甲醛、銦、石綿、鎘）30 年，非致癌性的異氰酸酯類、錳、乙基汞、汞則 10 年；物理性與其他作業中游離輻射、粉塵 30 年，高溫、噪音、異常氣壓、鉛、四烷基鉛、黃磷、巴拉刈、溴丙烷 10 年。要注意鎘雖然常被當成「一般重金屬」，但因致癌與長半衰期，列在 30 年清單。另外環測辦法的保存年限是另一套（考試當時正己烷環測紀錄 3 年、粉塵 10 年、附表四物質 30 年），不要混用。","dispute":"","review":{"key_points":["有機溶劑七種只有==三氯乙烯、四氯乙烯== 30 年；==正己烷==、四氯乙烷、四氯化碳、二硫化碳、DMF 10 年","苯、氯乙烯、鎘、砷、鎳、鉻酸 30 年；鉛、汞、錳 10 年","健檢紀錄年限（健康保護規則）≠ 環測紀錄年限（環測辦法）","鎘是 30 年（易誤記）"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"三、三氯乙烯及四氯乙烯。"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"六、氯乙烯。"},{"src":"0000306055","file":"_ref/annex_mol/0000306055.txt","quote":"(七)正己烷。"}],"note_ref":"四、檢查紀錄保存年限"}},{"qid":"c01q24","q":"下列何者不是勞工健康保護規則附表一所列之特別危害健康作業？","options":["甲基汞化合物作業","游離輻射作業","1,3-丁二烯作業","高溫作業"],"answer":0,"recon":"full","src":["113-5","113-10","114-04"],"optexp":["**不是附表一作業（本題答案）**：附表一第九項列的汞相關作業只有「(十八)乙基汞化合物」與「(十九)汞及其無機化合物」，沒有甲基汞；回憶版：「特別危害健康作業健康檢查不包括甲基汞」。","**是附表一作業**：游離輻射作業是附表一第三項，特殊健檢含血球計數、甲狀腺功能、心智精神檢查等。","**是附表一作業**：1,3-丁二烯是附表一第九項第 (二十二) 款特定化學物質，並列 30 年保存清單。","**是附表一作業**：高溫作業是附表一第一項（高溫作業勞工作息時間標準所稱之高溫作業）。"],"explanation":"本題考附表一特別危害健康作業的細部清單。舊附表一 12 大項共 32 項作業：(1) 高溫；(2) 85 分貝以上噪音；(3) 游離輻射；(4) 異常氣壓；(5) 鉛；(6) 四烷基鉛；(7) 粉塵；(8) 七種有機溶劑：1,1,2,2-四氯乙烷、四氯化碳、二硫化碳、三氯乙烯、四氯乙烯、二甲基甲醯胺、正己烷；(9) 23 種特定化學物質（重量比超過 1%，苯為體積比）：聯苯胺、4-胺基聯苯、4-硝基聯苯、β-萘胺、二氯聯苯胺、α-萘胺、鈹（合金 3%）、氯乙烯、TDI、MDI、IPDI、苯、石綿（處置或使用）、鉻酸／重鉻酸鹽、砷、鎘、錳（一氧化錳及三氧化錳除外）、乙基汞化合物、汞及其無機化合物、鎳、甲醛、1,3-丁二烯、銦；(10) 黃磷；(11) 聯吡啶或巴拉刈製造；(12) 溴丙烷（重量比超過 5%）。汞的部分只有乙基汞與無機汞兩項，甲基汞不在內。115 年新附表一在有機溶劑項增列苯乙烯、甲苯、二甲苯（117.1.1 施行）。","dispute":"","review":{"key_points":["附表一汞類只有==乙基汞化合物==與==汞及其無機化合物==；==甲基汞不在==","舊附表一 12 大項 32 作業；新版加苯乙烯、甲苯、二甲苯","錳排除一氧化錳及三氧化錳；石綿限處置或使用；鈹合金 3%；溴丙烷 5%","有機溶劑七種：四氯乙烷、四氯化碳、二硫化碳、三氯乙烯、四氯乙烯、DMF、正己烷"],"refs":[{"src":"0000306055","file":"_ref/annex_mol/0000306055.txt","quote":"(十八)乙基汞化合物。"},{"src":"0000306055","file":"_ref/annex_mol/0000306055.txt","quote":"(十九)汞及其無機化合物。"},{"src":"0000420146","file":"_ref/annex_new/0000420146.txt","quote":"（八）苯乙烯。"}],"note_ref":"三、特別危害健康作業與特殊健康檢查"}},{"qid":"c01q25","q":"有關事業單位健康檢查結果之群體分析，下列敘述何者錯誤？","options":["只需針對異常率最高的前十項進行分析即可","可與全國性資料比較","可與國外資料比較","可做橫斷面比較與歷年趨勢比較"],"answer":0,"recon":"rebuilt","src":["114-04"],"optexp":["**錯誤（本題答案）**：群體分析的目的是找出與作業相關的健康問題，應依作業別、部門、暴露分層全面分析，不能只看異常率前十項；限縮於十項會漏掉盛行率低但高度工作相關的異常。","**正確**：與全國性資料（如國民健康調查、全國勞工健檢資料）比較，可判斷事業單位異常率是否偏高。","**正確**：與國外同產業或文獻資料比較，是流行病學常用的外部比較方式，可補國內缺乏參考值的項目。","**正確**：橫斷面比較（同一時點不同部門、作業間）與歷年趨勢比較（同群體不同年度）是群體分析的兩個基本面向。"],"explanation":"本題考事業單位健康檢查結果的群體分析概念，屬 114-04 新題。勞工健康保護規則第 23 條要求雇主彙整受檢勞工歷年健康檢查紀錄，勞工健康服務醫護人員據以分析與健康管理。群體分析的做法：依作業別、部門、暴露程度、年齡性別分層，計算各項目異常率；做橫斷面比較（不同部門、不同暴露組之間）與縱貫面比較（歷年趨勢）；並與外部參考資料（全國性調查、國外同產業資料、文獻）比較，判斷是否存在工作相關的健康問題，回饋到危害控制與健康促進。分析範圍應涵蓋所有項目與所有作業群，不應只挑異常率最高的前十項，否則會遺漏發生率低但工作相關性強的異常（例如特定作業的血鉛、聽力、肺功能變化）。回憶版題幹不完整，選項為重建（見爭議註記）。","dispute":"114-04 回憶版題幹為「職業病分析，何者錯誤？A 只要針對十大???異常分析(x?)、B 與全國資料比較、C 與外國資料比較、D 做橫斷及???的比較」，回憶者自己也不確定；本題依「比較方式越多越好、限縮於十項不合理」的原則重建，答案為 A。","review":{"key_points":["群體分析要依==作業別／部門／暴露==分層，涵蓋全部項目，不限前十項","比較方式：橫斷面（部門間）＋歷年趨勢＋全國資料＋國外資料","雇主應彙整歷年健康檢查紀錄（勞工健康保護規則第 23 條）"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"四、彙整受檢勞工之歷年健康檢查紀錄。"}],"note_ref":"七、預防醫學概念"}},{"qid":"c01q26","q":"依勞工健康保護規則，在職勞工一般健康檢查之定期實施頻率，下列敘述何者正確？（依 113–115 年考試當時之規定）","options":["未滿四十歲者每五年一次；四十歲以上未滿六十五歲者每三年一次；年滿六十五歲者每年一次","未滿四十歲者每三年一次；四十歲以上未滿六十歲者每二年一次；年滿六十歲者每年一次","所有勞工每年一次","未滿四十歲者每二年一次；四十歲以上每年一次"],"answer":0,"recon":"rebuilt","src":["補充"],"optexp":["**正確（本題答案）**：勞工健康保護規則 110.12.22 版第 17 條（113–115 年考試適用）：年滿 65 歲每年一次；40 歲以上未滿 65 歲每三年一次；未滿 40 歲每五年一次。","**現行修正版，非考試當時規定**：115.6.26 修正第 17 條改為年滿 60 歲每年、40 歲以上未滿 60 歲每二年、未滿 40 歲每三年；依第 29 條自 117 年 1 月 1 日施行。","**錯誤**：每年一次只適用於年滿 65 歲（舊）或 60 歲（新）的勞工，以及特別危害健康作業的特殊健康檢查。","**錯誤**：新舊法都沒有「未滿 40 歲每二年、40 歲以上每年」的規定；舊法未滿 40 歲是每五年，新法是每三年，40 歲以上也不是一律每年。"],"explanation":"本題考在職勞工一般健康檢查的定期頻率，並提醒新舊法差異。考試當時（110.12.22 版第 17 條）：年滿 65 歲者每年檢查一次；40 歲以上未滿 65 歲者每三年一次；未滿 40 歲者每五年一次。115 年 6 月 26 日修正版第 17 條改為：年滿 60 歲者每年一次；40 歲以上未滿 60 歲者每二年一次；未滿 40 歲者每三年一次；同時新增第 18 條長期夜間工作者當年度依附表十一實施健康檢查。修正條文第 29 條規定第 17、18、20、21 條及附表一、九、十自 117 年 1 月 1 日施行，其餘多數條文自 115 年 7 月 1 日施行。因此 116 年底以前仍是 65／40 歲、5／3／1 年的頻率，117 年起改為 60／40 歲、3／2／1 年；之後應試以新法為準。另一個相關數字：先天性辨色力異常者得免再實施辨色力檢查。特殊健康檢查則不分年齡，每年或變更作業時實施。","dispute":"","review":{"key_points":["考試當時（舊第 17 條）：==65 歲以上每年、40–64 歲每 3 年、未滿 40 歲每 5 年==","新第 17 條（==117.1.1 施行==）：60 歲以上每年、40–59 歲每 2 年、未滿 40 歲每 3 年","新增第 18 條長期夜間工作健檢（附表十一），亦 117.1.1 施行","特殊健康檢查一律每年或變更作業時；先天性辨色力異常得免再驗辨色力"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"一、年滿六十五歲者，每年檢查一次。二、四十歲以上未滿六十五歲者，每三年檢查一次。三、未滿四十歲者，每五年檢查一次。"},{"src":"勞工健康保護規則","file":"_ref/勞工健康保護規則.txt","quote":"一、年滿六十歲者，每年檢查一次。二、四十歲以上未滿六十歲者，每二年檢查一次。三、未滿四十歲者，每三年檢查一次。"},{"src":"勞工健康保護規則","file":"_ref/勞工健康保護規則.txt","quote":"第十七條、第十八條、第二十條、第二十一條自一百十七年一月一日施行"}],"note_ref":"一、體格檢查與健康檢查的義務與免除"}}]},{"idx":1,"order":1,"title":"健康管理分級與健康追蹤","group":"法規與制度","gi":0,"notes_md":"本章 20 題，考勞工健康保護規則第 21 條（新第 22 條）四級管理的定義與後續處理、各作業分級建議指引的門檻與案例判讀，以及母性健康保護三級與災保法健康追蹤檢查；案例題的解法都是「有無異常 × 能否用工作以外原因解釋」。\n\n## 一、四級健康管理的定義與後續處理\n| 級別 | 檢查結果 | 與工作關係 |\n|---|---|---|\n| 第一級 | 正常，或異常但綜合判定==無異常== | — |\n| 第二級 | 異常 | ==與工作無關== |\n| 第三級 | 異常 | ==無法確定==→請職醫評估 |\n| 第四級 | 異常 | ==與工作有關== |\n- 〔10/03 課堂〕定義沿革：94.02.18 版二級「但==可能==與職業原因無關」、三級「且==可能==與職業原因有關」；106.11.13 改成二級「與工作無關」、三級「==無法確定==此異常與工作之相關性，應進一步請職業醫學科專科醫師評估」、四級「與工作有關」。第一級的「部分異常但綜合判定無異常」課堂舉例：胸部 X 光肋膜增厚。\n- 醫師註記：==二級以上==寫不適宜作業與注意事項；==三、四級==加註臨床診斷。\n- 雇主：二級→個人健康指導；三級→職醫健康追蹤檢查、必要時現場評估（新法會同職安衛人員）、重新分級、通報；四級→仍有暴露者採危害控制。\n- 職醫複檢後==不宜維持第三級==；第四級≠職業病確診；==雇主不得自行分級==；定期特殊健檢分級判讀由職醫為之（認可辦法第 16 條，112.3.1 起），新法寫「職醫綜合判定」。\n\n## 二、分級判定的通用邏輯\n- 二級：需下年度前追蹤，或可由工作以外原因解釋（脂肪肝、病毒性肝炎、缺鐵性／海洋性貧血、中耳炎、糖尿病神經病變、泌尿道感染、陳舊性肺結核）。\n- 三級：符合該作業健康危害表現，且無法由工作以外原因解釋、或==未提供足以判定之環測紀錄==、或生物偵測達門檻。\n- 四級：同上且可由工作相關原因解釋（暴露史、時序、生物偵測或環測達輔助基準）。\n- 輔助基準多數≈PEL 一半：四氯乙烷 0.5 ppm、鉻酸 0.025 mg/m³、無機汞 0.025 mg/m³；例外是==溴丙烷 >0.05 ppm（PEL 0.5 的 1/10）==、==鈹 0.1 μg/m³（PEL 2 μg/m³ 的 1/20）==。完整對照見第 19 章總表。\n- 〔10/03 課堂〕常見異常的盛行率（判斷能不能用工作以外原因解釋時的背景值）：\n\n| 常見異常 | 盛行率 | 會出現此項的特殊健檢 |\n|---|---|---|\n| 高血壓 | 10–20% | 高溫、異常氣壓 |\n| 肝功能異常 | 10–20% | 游離輻射、氯乙烯、三四氯乙烯、四氯化碳、四氯乙烷、二硫化碳、黃磷、DMF |\n| 貧血 | 8–10%（缺鐵性、海洋性） | 高溫、游離輻射、鉛、苯、砷、黃磷 |\n| 尿潛血 | 男 5%、女 10–20% | 高溫、游離輻射、鉛、四烷基鉛、四氯乙烷、四氯化碳、二硫化碳、三四氯乙烯、聯苯胺、砷、鎘 |\n| 尿蛋白 | 2–5% | 同上 |\n\n## 三、各作業分級門檻與案例\n| 作業 | 三／四級門檻 | 代表性表現 |\n|---|---|---|\n| 鉛 | 血鉛==男 ≥40、女 ≥30 μg/dL== | 小球性貧血（排除缺鐵與海洋性）、齒齦鉛緣、垂腕垂足、蛋白尿 ≥100 mg/dL |\n| 噪音 | 4K／6K 凹陷且 ==≥40 dB==，或高低頻平均差 ≥10 dB | 二級：三分法 ≥25 dB、中耳炎／藥物／外傷 |\n| 游離輻射 | 無數值門檻（劑量限度 50 mSv／年、100 mSv／5 年僅供參考；未提供配章紀錄亦列三級） | 血球減少（淋巴球）、甲狀腺功能低下、白內障 |\n| 鉻酸 | 尿鉻工作結束後 ==≥30 μg/g Cr== 或工作中增加 ≥10 | 鼻中膈穿孔、皮膚潰瘍、肺癌；4 年以上加 X 光 |\n| 鎳 | 尿鎳 ==≥30 μg/g Cr（或 45 μg/L）== | 皮膚炎、鼻中膈穿孔、氣喘、鼻炎鼻竇炎 |\n| 鈹 | 複檢尿鈹 ==≥0.4 μg/L== | 接觸性皮膚炎、肺門淋巴結、類肉瘤樣病變 |\n| 乙基汞 | ==血汞 ≥10 μg/dL== | 運動失調、平衡障礙、視野狹窄、聽力減退 |\n| 無機汞 | ==尿汞 ≥35 μg/g Cr== | 手部細顫、口腔炎、精神干擾 |\n| 溴丙烷 | TWA >0.05 ppm | 神經病變、接觸性皮膚炎；二級須大致（>50%）排除職業原因 |\n| 四氯乙烷 | TWA ≥0.5 ppm | 肝功能異常、蛋白尿 ≥100、中樞神經症狀 |\n| 粉塵 | — | ILO X 光疑似塵肺陰影、肺功能減損 |\n| 銦／鎘／砷 | 血清銦 3 μg/L／尿鎘 5 μg/g Cr／尿砷 35 μg/L | 肺纖維化／腎小管／皮膚 |\n- 案例：鉛作業血鉛 10、MCV 66、RBC 6.1（Mentzer \u003c13）→二級；噪音 4K 45／50 dB 對稱、環境 86 dB→三級；游離輻射 WBC 3000、配章 2.5 mSv→三級；鉻酸鼻中膈穿孔＋皮膚潰瘍＋尿鉻 35→四級；四氯乙烷 ALT↑＋尿蛋白 2+、環測 0.6 ppm、已排除肝炎飲酒→四級；粉塵 FEV1/FVC 64% 原因不明→三級；慢性中耳炎聽損→二級；脂肪肝肝功能異常→二級。\n- 噪音性聽力損失＝對稱（差 ≤10 dB）、高頻 3–6K、感覺神經性；非對稱要查單側中耳內耳病變。\n\n## 四、母性健康保護與妊娠禁止作業\n- 職安法第 30 條妊娠中==絕對禁止==（不得書面同意）：礦坑、鉛、異常氣壓、弓形蟲／德國麻疹；分娩後未滿一年絕對禁止：礦坑、鉛。其餘款項可依第 31 條母性保護措施＋書面同意。\n- 母性保護辦法第 9 條==三級==：無害（\u003c1/10 PEL）／==可能影響==（1/10–1/2）／有危害（≥1/2）；鉛作業血鉛 \u003c5／5–\u003c10／≥10 μg/dL。與特殊健檢四級不同。\n\n## 五、預防職業病健康檢查與健康追蹤檢查\n- 災保法第 63 條；辦法第 3 條：現職有害作業、==最近加保連續滿一年==，投保單位申請，不申請則勞工逕向保險人（勞保局）申請。\n- 第 4 條追蹤檢查：曾從事附表二作業＋加保連續滿一年，==變更作業、離職或退保後==由投保單位或本人申請；==一年一次==。附表二≈健檢 30 年清單。\n- 雇主特殊健檢義務只及==現職==作業；離開銦作業後的追蹤走災保法，不是雇主每年安排。","questions":[{"qid":"c02q01","q":"勞工特殊健康檢查結果有異常，經醫師綜合判定為異常，但無法確定此異常與工作之相關性，應列為第幾級管理？","options":["第一級管理","第二級管理","第三級管理","第四級管理"],"answer":2,"recon":"full","src":["113-9","114-03","114-04"],"optexp":["**錯誤**：第一級管理是全部項目正常，或部分項目異常但經醫師綜合判定為「無異常」；本題已判定為異常，不是第一級。","**錯誤**：第二級是綜合判定為異常，但確定「與工作無關」（可由工作以外原因解釋）；本題是無法確定相關性，不是第二級。","**正確（本題答案）**：勞工健康保護規則（舊）第 21 條第 1 項第 3 款：部分或全部項目異常，經醫師綜合判定為異常，而無法確定此異常與工作之相關性，應進一步請職業醫學科專科醫師評估者，為第三級管理。","**錯誤**：第四級是綜合判定異常「且與工作有關」，需已確認工作相關性；本題相關性尚未確定。"],"explanation":"本題考勞工健康保護規則第 21 條（新版第 22 條）特殊健康檢查四級管理的定義，是本章一切案例題的基礎。第一級：全部項目正常，或部分項目異常而經醫師綜合判定為無異常。第二級：部分或全部項目異常，經醫師綜合判定為異常，而與工作無關。第三級：異常，而無法確定此異常與工作之相關性，應進一步請職業醫學科專科醫師評估。第四級：異常，且與工作有關。判定的兩個軸線是「有沒有異常」與「和工作有沒有關」：無異常→一；異常但確定無關→二；異常但無法確定→三；異常且有關→四。第三級是健檢醫師無法自己判定時的「轉介」層級，後續由職醫做健康追蹤檢查與現場評估後重新分級，所以指引各作業都寫「經職業醫學科專科醫師實施追蹤複檢後，不宜維持第三級管理之判定」。115 年新版第 22 條把「醫師綜合判定」改為「職醫綜合判定」，並要求現場評估會同職業安全衛生人員。","dispute":"","review":{"key_points":["一級＝正常或異常但綜合判定==無異常==；二級＝異常且==與工作無關==；三級＝異常但==無法確定==相關性→請職醫評估；四級＝異常且==與工作有關==","第三級是轉介層級，職醫追蹤複檢後應重新分級，不宜維持第三級","舊第 21 條＝新第 22 條；新版改為「職醫綜合判定」","判定軸線：有無異常 × 與工作有無關"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"而無法確定此異常與工作之相關性，應進一步請職業醫學科專科醫師評估者"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"經醫師綜合判定為異常，而與工作無關者"},{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"經職業醫學科專科醫師實施追蹤複檢後，不宜維持第三級"}],"note_ref":"一、四級健康管理的定義與後續處理"}},{"qid":"c02q02","q":"關於第四級管理，下列敘述何者正確？","options":["健康檢查結果異常，且經醫師綜合判定與工作有關者","第四級管理即等同於已確診職業病","健康檢查結果異常，但可由工作以外原因解釋者","健康檢查結果異常，經醫師認定需於下年度檢查前追蹤者"],"answer":0,"recon":"partial","src":["113-12"],"optexp":["**正確（本題答案）**：第 21 條第 1 項第 4 款：特殊健康檢查或健康追蹤檢查結果部分或全部項目異常，經醫師綜合判定為異常，且與工作有關者，為第四級管理。113-12 回憶標 O。","**錯誤**：第四級是健康管理分級，不等於職業病確診；職業病認定另依災保法的鑑定程序與貢獻度大於 50% 的原則判斷。113-12 回憶：「為職業病（X）」。","**錯誤**：異常但可由工作以外原因解釋者是第二級管理，不是第四級。","**錯誤**：健檢異常、經醫師認定需於下年度檢查前接受健康追蹤檢查者，依指引屬第二級管理的判定條件之一。"],"explanation":"本題考第四級管理的定義與它和職業病的關係。第四級管理＝檢查異常且經醫師綜合判定與工作有關，雇主應經職業醫學科專科醫師評估，現場仍有工作危害因子之暴露者，採取危害控制及相關管理措施（第 21 條第 3 項）；第三級或第四級並應由醫師註明臨床診斷。分級管理是雇主端的健康管理工具（適性配工、危害控制、通報），職業病則是災保法體系下的給付與鑑定概念，須經職業醫學科專科醫師診斷，有爭議時由中央主管機關職業病鑑定會依「職業造成此疾病之因果關係可能性或貢獻程度大於百分之五十」鑑定；第四級可以是職業病診斷的起點，但兩者不畫等號。另外要記各級的處理：第二級雇主提供個人健康指導；第三級請職醫實施健康追蹤檢查、必要時現場評估、重新分級並通報；第四級經職醫評估仍有暴露者採取危害控制。","dispute":"","review":{"key_points":["第四級＝異常且==與工作有關==；雇主經職醫評估仍有暴露者→==危害控制及管理措施==","第四級≠職業病確診；職業病走災保法鑑定（貢獻度 >50%）","三、四級須由醫師註明==臨床診斷==；二級以上註明不適宜作業與注意事項","需下年度前追蹤檢查者＝第二級的判定條件"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"經醫師綜合判定為異常，且與工作有關者。"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"屬於第四級管理者，經職業醫學科專科醫師評估現場仍有工作危害因子之暴露者，應採取危害控制及相關管理措施。"}],"note_ref":"一、四級健康管理的定義與後續處理"}},{"qid":"c02q03","q":"有關特殊健康檢查分級管理之後續處理，下列敘述何者錯誤？","options":["第二級管理以上者，應由醫師註明其不適宜從事之作業與其他應處理及注意事項","第二級管理者，應由醫師註明臨床診斷","第三級管理者，應請職業醫學科專科醫師實施健康追蹤檢查，必要時實施疑似工作相關疾病之現場評估","第四級管理者，經職業醫學科專科醫師評估現場仍有工作危害因子之暴露者，應採取危害控制及相關管理措施"],"answer":1,"recon":"full","src":["113-10","114-03"],"optexp":["**正確**：第 21 條第 2 項前段：屬於第二級管理以上者，應由醫師註明其不適宜從事之作業與其他應處理及注意事項。","**錯誤（本題答案）**：第 21 條第 2 項後段規定「第三級管理或第四級管理者」並應由醫師註明臨床診斷；第二級只需註明不適宜作業與注意事項，不須註明臨床診斷。114-03 回憶：「第二級不須註明診斷，但須給予建議」。","**正確**：第 21 條第 3 項：第三級管理者，應請職業醫學科專科醫師實施健康追蹤檢查，必要時應實施疑似工作相關疾病之現場評估，並依評估結果重新分級及通報。","**正確**：第 21 條第 3 項後段：第四級管理者，經職業醫學科專科醫師評估現場仍有工作危害因子之暴露者，應採取危害控制及相關管理措施。"],"explanation":"本題考第 21 條第 2、3 項各級的後續處理，分「醫師要寫什麼」與「雇主要做什麼」兩層。醫師端：第二級以上→註明不適宜從事之作業與其他應處理及注意事項；第三級或第四級→並註明臨床診斷。雇主端：第二級→提供勞工個人健康指導；第三級→請職業醫學科專科醫師實施健康追蹤檢查，必要時實施疑似工作相關疾病之現場評估，依評估結果重新分級，並將分級結果及採行措施依公告方式通報；第四級→經職醫評估現場仍有工作危害因子之暴露者，採取危害控制及相關管理措施。健康追蹤檢查紀錄依第 19、20 條保存。記法：「二級指導、三級追蹤現評通報、四級控制」；「二級寫建議、三四級加診斷」。新版第 22 條內容相同，但現場評估改為「應會同職業安全衛生人員」實施。","dispute":"","review":{"key_points":["醫師註記：==二級以上==寫不適宜作業與注意事項；==三、四級==加註臨床診斷","雇主處理：二級→個人健康指導；三級→職醫追蹤檢查＋必要時現場評估＋重新分級＋通報；四級→仍有暴露則危害控制","新版第 22 條：現場評估應會同職業安全衛生人員","健康追蹤檢查紀錄保存比照第 19、20 條"],"refs":[{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"屬於第三級管理或第四級管理者，並應由醫師註明臨床診斷"},{"src":"勞工健康保護規則_舊版","file":"_ref/勞工健康保護規則_舊版.txt","quote":"雇主對於第一項所定第二級管理者，應提供勞工個人健康指導"},{"src":"勞工健康保護規則","file":"_ref/勞工健康保護規則.txt","quote":"必要時應會同職業安全衛生人員實施疑似工作相關疾病之現場評估"}],"note_ref":"一、四級健康管理的定義與後續處理"}},{"qid":"c02q04","q":"男性勞工在電子公司從事鉛作業，特殊健康檢查：Hb 12.8 g/dL、紅血球 6.1×10⁶/μL、MCV 66 fL，血鉛 10 μg/dL，無症狀。依健康管理分級建議指引，應列為第幾級管理？","options":["第一級","第二級","第三級","第四級"],"answer":1,"recon":"full","src":["113-2","114-01","114-03"],"optexp":["**錯誤**：第一級是無異常發現或異常經醫師認定不需追蹤；本例有小球性低血色素的血液異常，且需要追蹤確認，不能列第一級。114-03 回憶者認為「目前無關」而選一級，與指引第二級的定義不合。","**正確（本題答案）**：MCV 66 fL、RBC 6.1×10⁶/μL，Mentzer index＝66/6.1≈10.8\u003c13，典型海洋性貧血；血鉛 10 μg/dL 遠低於男性第三級門檻 40。異常可由工作以外原因解釋→指引鉛作業第二級。","**錯誤**：第三級需異常項目符合鉛中毒表現且原因不明（尚不知原因之小球性低血色素）、血鉛男性≥40 μg/dL、或無法由工作以外原因解釋；本例血鉛正常、貧血型態指向海洋性貧血，已可由非職業原因解釋。","**錯誤**：第四級要求異常符合鉛中毒表現且與工作有關，指引明定「小球性低血色素貧血（排除缺鐵性貧血及海洋性貧血）」加血鉛男性≥40 μg/dL；本例兩者皆不符。"],"explanation":"本題考鉛作業分級指引的門檻與「異常可由工作以外原因解釋」的第二級概念。鉛作業法定檢查項目含血球比容、血色素、紅血球數、尿蛋白尿潛血與血中鉛。分級門檻：第三級 2.1 異常項目符合鉛中毒表現，如尚不知原因之小球性低血色素、周邊神經病變（垂腕垂足）、腎臟病變（蛋白尿≥100 mg/dL）；2.2 血中鉛濃度男性≥40 μg/dL、女性≥30 μg/dL；2.3 異常無法由工作以外原因解釋或事業單位未提供環測紀錄。第四級：符合鉛中毒表現（鉛性腹絞痛、齒齦鉛緣、排除缺鐵與海洋性貧血的小球性低血色素貧血、周邊神經病變、腎病變）且血鉛男≥40／女≥30。第二級：異常可由工作以外原因解釋，如缺鐵性貧血，或血鉛偏高但可由飲食解釋。本例 Hb 12.8、RBC 6.1、MCV 66，紅血球數偏高的小球性貧血，Mentzer index 約 10.8（\u003c13 偏向海洋性貧血），血鉛僅 10 μg/dL，異常可由非職業原因解釋，列第二級；114-03 有人主張第一級，113-2 標第二級（見爭議註記）。母性保護另有一套血鉛分級（\u003c5、5–10、≥10 μg/dL），不要混用。","dispute":"113-2 回憶標第二級 YES；114-03 回憶者認為血鉛正常、貧血與鉛「目前無關」而主張第一級。依指引，第一級是無異常或不需追蹤，本例確有小球性低血色素異常且需追蹤確認，只是可由工作以外原因（海洋性貧血）解釋，符合第二級定義；應試選第二級。","review":{"key_points":["鉛第三級／第四級血鉛門檻：==男 ≥40、女 ≥30 μg/dL==","小球性低血色素＋血鉛正常＋Mentzer index \u003c13（海洋性貧血）→可由非職業原因解釋→==第二級==","第四級鉛中毒表現：鉛絞痛、齒齦鉛緣、小球性貧血（排除缺鐵與海洋性）、垂腕垂足、蛋白尿 ≥100 mg/dL","母性保護血鉛分級 \u003c5／5–10／≥10 μg/dL 是另一套"],"refs":[{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"血中鉛濃度男性≥40μg /dL、女性≥30 μg /dL"},{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"異常項目可由工作以外的原因解釋，如缺鐵性貧血"},{"src":"05_鉛作業管理分級參考","file":"_ref/分級指引/05_鉛作業管理分級參考.txt","quote":"低血色素貧血(排除缺鐵性貧血及海洋性貧血)"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q05","q":"一位年輕男性從事噪音作業三年，特殊健康檢查：三分法平均聽力左耳 20 dB、右耳 25 dB；4000 Hz 出現凹陷（左耳 45 dB、右耳 50 dB）；作業環境噪音八小時日時量平均 86 dB。依健康管理分級建議指引，健檢醫師應列為第幾級管理？","options":["第一級","第二級","第三級","第四級"],"answer":2,"recon":"full","src":["113-6","114-02","114-03"],"optexp":["**錯誤**：第一級是無異常或不需追蹤；本例 4000 Hz 已有 45／50 dB 的凹陷，屬噪音作業健康危害表現，不能列第一級。","**錯誤**：第二級是三分法平均≥25 dB 需追蹤，或異常可由中耳炎、藥物、外傷等非職業原因解釋；本例是典型高頻凹陷，環境 86 dB 有暴露，無法歸為工作以外原因。","**正確（本題答案）**：指引噪音第三級 3.1：聽力圖呈現 4K 或 6K 凹陷，且 4K 或 6K 聽力損失≥40 dB（本例 45／50 dB）；健檢醫師需請職醫評估與工作相關性，並至合格聽力室複檢。114-03 回憶：第三級，建議 30 日內重作。","**錯誤**：第四級「與工作有關」的判定應由職業醫學科專科醫師評估後確認；健檢醫師初判時，4K 凹陷≥40 dB 且三分法≤25 dB 的圖形雖符合早期噪音性聽力損失的描述，仍先列第三級交職醫評估。"],"explanation":"本題考噪音作業分級指引的聽力圖判讀門檻。指引第二級：三分法〔(0.5K+1K+2K)/3〕平均聽力損失≥25 dB 需下年度前追蹤，或異常可由中耳炎、藥物、外傷解釋。第三級：聽力圖呈現 4K 或 6K 凹陷，且 4K 或 6K 聽力損失≥40 dB，或高音頻平均〔(3K+4K+6K)/3〕比低音頻平均損失≥10 dB；需至有合格聽力室並僱有聽力檢查訓練合格人員之醫療院所複檢後，委請職醫評估。第四級（職醫評估後）：4K 或 6K 凹陷≥40 dB 且三分法≤25 dB 且高低頻差\u003c10 dB→加註「早期噪音性聽力損失，須進行聽力防護計畫」；凹陷≥40 dB 且三分法≥25 dB 合併高低頻差≥10 dB→「噪音性聽力損失，須聽力防護及配工計畫」；三分法較前一年變化≥10 dB→考慮暫停暴露。噪音性聽力損失的特徵：兩耳對稱（相差 10 dB 以內）、高頻 3–6K 為主的感覺神經性損失、6K 或 8K 較輕的 upturn；非對稱者要評估單側中耳或內耳病變。本例雙耳 4K 凹陷 45／50 dB、對稱、三分法 20／25 dB、環境 86 dB，健檢醫師列第三級。","dispute":"","review":{"key_points":["噪音第三級門檻：==4K 或 6K 凹陷且 ≥40 dB==，或高頻平均比低頻平均損失 ==≥10 dB==","第二級：三分法平均 ==≥25 dB== 需追蹤；或中耳炎、藥物、外傷等非職業原因","第四級由職醫評估：凹陷≥40 且三分法≤25 且高低頻差\u003c10→早期噪音性聽力損失；三分法較前一年變化≥10 dB→考慮暫停暴露","噪音性聽力損失＝兩耳對稱（差≤10 dB）、3–6K 為主、感覺神經性、8K upturn","第三級需至合格聽力室複檢後再交職醫"],"refs":[{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"聽力檢查呈現 4 或 6K 凹陷，且 4K 或 6K 聽力損失大於等於 40"},{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"需至有設置合格聽力室並僱有聽力檢查訓練合格人員之醫療院所複檢"},{"src":"02_噪音作業管理分級參考","file":"_ref/分級指引/02_噪音作業管理分級參考.txt","quote":"噪音引起的聽力損失通常是對稱性的，左右耳聽力損失相差 10 分貝以內"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q06","q":"一名男性從事游離輻射作業 10 年，特殊健康檢查：WBC 3000/μL、Hb 14 g/dL、RBC 6.1×10⁶/μL、血小板 45 萬/μL；配章劑量顯示去年全年累計暴露 2.5 mSv。依健康管理分級建議指引，應列為第幾級管理？","options":["第一級","第二級","第三級","第四級"],"answer":2,"recon":"full","src":["113-4","113-10","114-04"],"optexp":["**錯誤**：白血球 3000/μL 屬白血球減少，是游離輻射作業的健康危害表現（血球數減少，特別是淋巴球），有異常發現不能列第一級。","**錯誤**：第二級要求異常可由工作以外原因解釋（如肝功能異常由 B、C 肝、脂肪肝解釋，或蛋白尿）；題目未提供可解釋白血球減少的非職業原因。","**正確（本題答案）**：指引游離輻射第三級 2.1：異常項目符合游離輻射作業健康危害表現，如血球數減少（特別是淋巴球）、疑似白血病、甲狀腺功能低下；且相關性尚無法確定→請職醫評估。114-04 回憶：第三級。","**錯誤**：第四級須異常「可由工作相關原因解釋」；年劑量 2.5 mSv 遠低於職業暴露限度（單一年度 50 mSv、連續五年 100 mSv），健檢醫師無法據以確認與工作有關，應交職醫評估，不能直接列第四級。"],"explanation":"本題考游離輻射作業的分級與劑量限度。法定檢查項目含頭頸眼（白內障）皮膚甲狀腺等身體檢查、心智及精神檢查、胸部 X 光、甲狀腺功能（free T4、TSH）、ALT 與肌酸酐、紅血球數／血色素／血球比容／白血球數／白血球分類／血小板數、尿液檢查（核電廠或廢料貯存場作業者增列肺功能）。第三級 2.1 的健康危害表現：血球數減少（特別是淋巴球）、疑似白血病、甲狀腺功能低下或甲狀腺癌、輻射性皮膚炎或皮膚癌、肺炎或肺纖維化、骨癌、白內障；2.2 異常無法由工作以外原因解釋，或事業單位未提供環測或劑量計（配章）紀錄。第四級同樣表現且可由工作相關原因解釋。劑量數字：游離輻射防護安全標準第 7 條職業暴露限度為單一年度有效等效劑量 50 mSv、連續五年 100 mSv（平均每年 20 mSv）；眼球水晶體一年 150 mSv、皮膚或四肢一年 500 mSv；游離輻射防護法第 16 條單次意外暴露超過 50 mSv 應予特別醫務監護。本例 WBC 3000 為白血球減少，血小板 45 萬是偏高而非減少，配章 2.5 mSv 在限值內但不能排除相關性，故列第三級。","dispute":"","review":{"key_points":["游離輻射第三級表現：==血球數減少（特別是淋巴球）==、疑似白血病、甲狀腺功能低下／癌、輻射性皮膚炎、白內障","職業暴露劑量限度：==單一年度 50 mSv、連續五年 100 mSv==；水晶體 150、皮膚四肢 500 mSv／年","單次意外暴露 >50 mSv→特別醫務監護（游離輻射防護法第 16 條）","劑量在限值內仍不能排除相關性；未提供劑量計紀錄亦列第三級","檢查項目含甲狀腺功能（free T4、TSH）、白血球分類、血小板"],"refs":[{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"血球數滅少(特別是淋巴球)"},{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"單一年度有效等效劑量不得超過 50 毫西弗(mSv)"},{"src":"03_游離輻射作業管理分級參考","file":"_ref/分級指引/03_游離輻射作業管理分級參考.txt","quote":"未提供足以判定之作業環境測定或劑量計"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q07","q":"從事鉻酸作業 6 年之勞工，健康追蹤檢查發現鼻中膈穿孔及暴露部位皮膚潰瘍，尿中鉻 35 μg/g creatinine。依健康管理分級建議指引，應列為第幾級管理？","options":["第一級","第二級","第三級","第四級"],"answer":3,"recon":"full","src":["113-2"],"optexp":["**錯誤**：鼻中膈穿孔與暴露部位皮膚潰瘍都是鉻酸作業的典型健康危害表現，明顯異常，不可能是第一級。","**錯誤**：第二級是異常可由過敏性鼻炎、感冒、濕疹等工作以外原因解釋；鼻中膈穿孔加皮膚潰瘍加尿鉻升高，無法用非職業原因解釋。","**錯誤**：第三級是有鼻中膈穿孔、皮膚潰瘍或肺癌病變但相關性尚無法確定、或未提供環測紀錄；本例已有 6 年明確暴露史、合理時序與尿鉻≥30 μg/g creatinine，可由工作相關原因解釋，應直接列第四級。","**正確（本題答案）**：指引鉻酸第四級：鼻中膈穿孔、暴露部位皮膚潰瘍或肺部癌症病變，且有明確職業暴露史與合理時序性；異常可由工作相關原因解釋，如複檢時尿中鉻工作結束後≥30 μg/g creatinine（本例 35）。"],"explanation":"本題考鉻酸及其鹽類作業的分級指引與尿鉻門檻。鉻酸的健康危害：鼻中膈潰瘍與穿孔、皮膚潰瘍（鉻瘡）與過敏性皮膚炎、氣喘樣呼吸道刺激、肝損害，六價鉻致肺癌。法定檢查項目：呼吸系統（鼻黏膜異常、鼻中膈穿孔）及皮膚（皮膚炎、潰瘍）身體檢查、從事工作四年以上者胸部 X 光、健康檢查加尿中鉻（變更作業者無須檢測）。分級：第二級—異常可由過敏性鼻炎、感冒、濕疹解釋；第三級—鼻中膈穿孔、暴露部位皮膚潰瘍或肺部癌症病變，且無法由工作以外原因解釋或未提供環測紀錄，輔助基準 PEL-TWA≥0.025 mg/m³（PEL 為 0.05 mg/m³）；第四級—上述表現且有明確職業暴露史與合理時序性，異常可由工作相關原因解釋，例如複檢時尿中鉻（可溶性化合物）在工作結束後≥30 μg/g creatinine，或工作中增加≥10 μg/g creatinine。本例從事 6 年、鼻中膈穿孔、皮膚潰瘍、尿鉻 35，三項條件齊備→第四級。要與鎳的尿鎳≥30 μg/g creatinine（或 45 μg/L）區分。","dispute":"","review":{"key_points":["鉻酸第四級：==鼻中膈穿孔／暴露部位皮膚潰瘍／肺癌==＋明確暴露史與時序＋尿鉻工作結束後 ==≥30 μg/g Cr== 或工作中增加 ≥10","鉻酸輔助基準 PEL-TWA ≥0.025 mg/m³（PEL 0.05）","從事工作四年以上者加做胸部 X 光；尿鉻只在健康檢查、變更作業者免測","第二級：過敏性鼻炎、感冒、濕疹等非職業原因"],"refs":[{"src":"23_鉻酸及其鹽類作業管理分級參考","file":"_ref/分級指引/23_鉻酸及其鹽類作業管理分級參考.txt","quote":"鼻中膈穿孔、暴露部位皮膚潰瘍或肺部癌症"},{"src":"23_鉻酸及其鹽類作業管理分級參考","file":"_ref/分級指引/23_鉻酸及其鹽類作業管理分級參考.txt","quote":"複檢時尿中鉻 ( 可 溶 性 化 合 物 ) 在 工 作 結 束 後 ≥ 30 μg/g"},{"src":"23_鉻酸及其鹽類作業管理分級參考","file":"_ref/分級指引/23_鉻酸及其鹽類作業管理分級參考.txt","quote":"從事工作四年以上者，應實施胸部"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q08","q":"下列何者不是鎳及其化合物作業健康管理分級建議指引所列之第三級管理判定依據？","options":["鼻炎、鼻竇炎","鼻中膈穿孔","尿中鎳濃度 > 45 μg/g creatinine","皮膚暴露部位之接觸性或過敏性皮膚炎"],"answer":2,"recon":"full","src":["113-8","113-12","114-02","114-03"],"optexp":["**是判定依據**：指引鎳作業第三級 2.1 列出「可能與鎳暴露有關之氣喘、氣管炎、鼻炎和鼻竇炎」等異常發現。","**是判定依據**：鼻中膈穿孔是鎳（及鉻酸）作業的典型上呼吸道表現，列在第三級與第四級 2.1。","**不是（本題答案）**：指引的尿鎳門檻是「≥30 μg/g creatinine（或 45 μg/L）」；45 是以 μg/L 為單位時的門檻，本選項把 45 配上 μg/g creatinine，數值與單位配錯；嚴格說 >45 μg/g Cr 也會 ≥30 μg/g Cr，本題是考單位配對，應試仍選此項。113-12 回憶：「這題考很細要記得單位」。","**是判定依據**：指引 2.1「有皮膚暴露部位之接觸性或過敏性皮膚炎」，鎳是最常見的接觸性過敏原之一。"],"explanation":"本題考鎳及其化合物作業分級指引的判定依據與生物偵測單位。鎳的健康危害：急性有金屬燻煙熱、呼吸道刺激、過敏性皮膚炎；慢性有接觸性及過敏性皮膚炎（鎳癢症）、氣喘、氣管炎、鼻炎、鼻竇炎、塵肺症，以及肺癌、鼻腔癌、鼻竇癌。法定檢查項目：鼻腔、皮膚、呼吸道、腸胃及神經系統身體檢查、胸部 X 光、尿液檢查（含尿沉渣）、肌酸酐、血液常規、肺功能（FVC、FEV1、FEV1/FVC），健康檢查加尿中鎳（變更作業者無須檢測）。第三級／第四級判定依據：2.1 皮膚暴露部位之接觸性或過敏性皮膚炎、鼻中膈穿孔、可能與鎳有關之氣喘、氣管炎、鼻炎、鼻竇炎；2.2 尿中鎳濃度≥30 μg/g creatinine（或 45 μg/L）；第三級另有 2.3 無法由工作以外原因解釋或未提供環測紀錄，第四級則是異常可由工作相關原因解釋。第二級：肝功能異常可由病毒性肝炎、脂肪肝、藥物、飲酒解釋，泌尿道感染造成的血尿或蛋白尿，肺部感染造成的肺功能異常。單位配對是常見陷阱：鎳 30 μg/g Cr＝45 μg/L；鉻 30 μg/g Cr；鎘 5 μg/g Cr；無機汞 35 μg/g Cr；砷 35 μg/L；鈹 0.4 μg/L；銦（血清）3 μg/L。","dispute":"題目瑕疵：嚴格說尿鎳 >45 μg/g creatinine 也必然 ≥30 μg/g creatinine，邏輯上仍符合門檻；本題實際考的是「45 是 μg/L 的數字」這個單位配對，應試仍選 C。","review":{"key_points":["鎳第三／四級：皮膚炎、鼻中膈穿孔、氣喘、氣管炎、鼻炎、鼻竇炎；尿鎳 ==≥30 μg/g Cr（或 45 μg/L）==","單位陷阱：45 是 μg/L 的門檻，不是 μg/g creatinine","生物偵測門檻對照：鉻 30 μg/g Cr、鎘 5 μg/g Cr、無機汞 35 μg/g Cr、砷 35 μg/L、鈹 0.4 μg/L、血清銦 3 μg/L","鎳作業肺功能與胸部 X 光為法定項目；尿鎳限健康檢查"],"refs":[{"src":"25_鎳及其化合物作業管理分級參考","file":"_ref/分級指引/25_鎳及其化合物作業管理分級參考.txt","quote":"尿中鎳濃度≥ 30 μg/g creatinine (或45μg/L)。"},{"src":"25_鎳及其化合物作業管理分級參考","file":"_ref/分級指引/25_鎳及其化合物作業管理分級參考.txt","quote":"有皮膚暴露部位之接觸性或過敏性皮膚炎，鼻中"},{"src":"25_鎳及其化合物作業管理分級參考","file":"_ref/分級指引/25_鎳及其化合物作業管理分級參考.txt","quote":"肺癌、鼻腔癌、鼻竇癌。"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q09","q":"鈹及其化合物作業之第四級管理，異常結果可由工作相關原因解釋，如複檢時尿中鈹濃度大於等於多少？","options":["0.4 μg/L","3 μg/L","5 μg/g creatinine","30 μg/g creatinine"],"answer":0,"recon":"partial","src":["113-3"],"optexp":["**正確（本題答案）**：指引鈹作業第四級 2.：異常結果可由工作相關原因解釋，如複檢時尿中鈹濃度≥0.4 μg/L；輔助基準 PEL-TWA≥0.1 μg/m³（PEL 為 2 μg/m³）。","**錯誤**：3 μg/L 是銦作業的門檻（血清銦≥3 μg/L，第三級與第四級皆用），不是鈹。","**錯誤**：5 μg/g creatinine 是鎘作業的尿鎘門檻，不是鈹。","**錯誤**：30 μg/g creatinine 是鎳作業的尿鎳門檻（亦是鉻酸的尿鉻門檻），不是鈹。"],"explanation":"本題考鈹作業分級指引的生物偵測數值，並藉錯誤選項複習其他金屬的門檻。鈹的健康危害：致肺癌、刺激性皮膚炎與皮膚肉芽腫、急性化學性肺炎、慢性鈹病（肉芽腫性肺病，類似類肉瘤症）、肝腎損害。法定檢查項目：呼吸系統、肝、腎、皮膚（暴露部位）身體檢查、胸部 X 光、肺功能；注意鈹的附表十項目沒有尿鈹，尿鈹只是指引第四級用來佐證工作相關性的複檢項目。分級：第二級—異常可由工作以外原因解釋（接觸性皮膚炎、氣喘、COPD、過敏性肺炎、原發性肺纖維化、類肉瘤症等）；第三級—皮膚暴露部位接觸性皮膚炎、胸部 X 光不規則結節、肺部陰影、擴散浸潤、肺門淋巴結病變或肺部腫瘤，且無法由工作以外原因解釋，輔助基準 PEL-TWA≥0.1 μg/m³；第四級—上述表現，異常可由工作相關原因解釋，如複檢時尿中鈹≥0.4 μg/L。門檻對照：鈹 0.4 μg/L、銦（血清）3 μg/L、鎘（尿）5 μg/g Cr、鎳（尿）30 μg/g Cr 或 45 μg/L、鉻（尿）30 μg/g Cr、無機汞（尿）35 μg/g Cr、乙基汞（血）10 μg/dL、砷（尿）35 μg/L、鉛（血）男 40／女 30 μg/dL。","dispute":"","review":{"key_points":["鈹第四級：複檢時==尿中鈹 ≥0.4 μg/L==；輔助基準 PEL-TWA ≥0.1 μg/m³（PEL 2 μg/m³）","血清銦 ==3 μg/L==、尿鎘 ==5 μg/g Cr==、尿鎳 ==30 μg/g Cr==（45 μg/L）、尿鉻 30 μg/g Cr","鈹的法定檢查項目無尿鈹；尿鈹是指引第四級的複檢佐證","鈹第二級鑑別：類肉瘤症、過敏性肺炎、原發性肺纖維化、COPD"],"refs":[{"src":"14_鈹及其化合物作業管理分級參考","file":"_ref/分級指引/14_鈹及其化合物作業管理分級參考.txt","quote":"如複檢時尿中鈹濃度\n≥0.4 µg/L"},{"src":"30_銦及其化合物作業管理分級參考","file":"_ref/分級指引/30_銦及其化合物作業管理分級參考.txt","quote":"血清銦 ≥ 3 μg/L。"},{"src":"14_鈹及其化合物作業管理分級參考","file":"_ref/分級指引/14_鈹及其化合物作業管理分級參考.txt","quote":"鈹及其化合物(以鈹計)八小時日時量平均容許濃度(PEL-TWA)：0.002 mg/m3"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q10","q":"依乙基汞作業健康管理分級建議指引，下列何者不屬於第三級管理之判定依據？","options":["血中汞濃度 ≥10 μg/dL","工作後出現聽力減退或視野狹窄","工作後出現平衡功能障礙、運動失調","尿中汞濃度 ≥35 μg/g creatinine"],"answer":3,"recon":"rebuilt","src":["114-05"],"optexp":["**是第三級依據**：指引乙基汞第三級 2.2：血中汞濃度≥10.0 μg/dL；乙基汞（有機汞）作業的法定生物偵測是「血中汞」（變更作業者無須檢測）。","**是第三級依據**：第三級 2.1 列「聽力視力或視野異常」；有機汞的神經毒性包括視野狹窄、聽力減退。","**是第三級依據**：第三級 2.1「神經精神異常」，指引列的慢性危害含全身性運動失調、意向性顫抖、平衡功能障礙。","**不是（本題答案）**：尿中汞≥35 μg/g creatinine（上班前或下班時）是「汞及其無機化合物」作業的第三級門檻；乙基汞作業用的是血汞，不測尿汞。本選項為重建。"],"explanation":"本題考乙基汞（有機汞）與無機汞兩套分級指引的差別。乙基汞作業：法定檢查項目含口腔鼻腔、皮膚、呼吸、腸胃、腎臟、眼睛、神經系統及精神之身體檢查、胸部 X 光、尿液檢查、肌酸酐、血液常規，健康檢查加「血中汞」。第三級判定：2.1 過敏性蕁麻疹或刺激性皮膚炎、口內炎、神經精神異常、蛋白尿（≥100 mg/dL）、聽力視力或視野異常、明顯體重減輕；2.2 血中汞≥10.0 μg/dL；2.3 無法由工作以外原因解釋或未提供環測紀錄。第四級：同樣表現且血汞≥10.0 μg/dL 或已排除非職業來源，異常可由工作相關原因解釋。汞及其無機化合物作業：生物偵測改為「尿中汞」，第三／四級門檻為尿汞≥35 μg/g creatinine（上班前或下班時），輔助基準 PEL-TWA≥0.025 mg/m³（PEL 0.05 mg/m³）；臨床表現多了手部細顫、口腔炎、精神干擾（易怒、記憶力減退）。記法：「有機汞看血、無機汞看尿；血 10、尿 35」。114-05 回憶版答案不確定，本題 D 依指引重建。","dispute":"114-05 回憶版題目為「乙基汞三級管理不包括：A 血中汞 10 μg/dL、B 影響聽力系統、C 影響平衡系統、D？」，答案不確定；依指引 A、B、C 都是第三級判定依據，D 重建為無機汞作業的尿汞門檻作為正解。","review":{"key_points":["乙基汞（有機汞）：生物偵測＝==血中汞==，第三／四級 ==≥10 μg/dL==","汞及其無機化合物：生物偵測＝==尿中汞==，第三／四級 ==≥35 μg/g Cr==（上班前或下班時）","乙基汞臨床表現：蕁麻疹／皮膚炎、口內炎、運動失調、意向性顫抖、平衡障礙、視野狹窄、聽力減退、蛋白尿 ≥100 mg/dL、體重減輕","無機汞輔助基準 PEL-TWA ≥0.025 mg/m³"],"refs":[{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"血中汞濃度≥ 10.0 μg /dL"},{"src":"31_汞及其無機化合物作業管理分級參考","file":"_ref/分級指引/31_汞及其無機化合物作業管理分級參考.txt","quote":"尿中汞濃度≥ 35 μg/g creatinine (上班前)"},{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"血中汞檢查 (變更作業者無須檢"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q11","q":"有關乙基汞作業之健康管理分級與異常項目之對照，下列何者錯誤？","options":["脂肪肝合併肝功能異常：第三級管理","血中汞濃度 >10 μg/dL：第三級管理","工作後才發生之平衡功能異常：第三級管理","工作後才發生之聽力、視力或視野缺損：第三級管理"],"answer":0,"recon":"full","src":["115-02"],"optexp":["**錯誤（本題答案）**：指引乙基汞第二級：異常項目可由工作以外原因解釋，如肝功能或血液學檢查異常、泌尿道感染造成之血尿或蛋白尿、飲食造成的血汞偏高等；脂肪肝引起的肝功能異常屬第二級，不是第三級。","**正確**：第三級 2.2：血中汞濃度≥10.0 μg/dL（第四級亦以此為門檻，或已排除非職業來源）。","**正確**：第三級 2.1 神經精神異常，慢性有機汞中毒包括全身性運動失調、平衡功能障礙；工作後才發生者需請職醫評估相關性。","**正確**：第三級 2.1 明列「聽力視力或視野異常」；有機汞典型表現為視野狹窄與聽力減退。"],"explanation":"本題考乙基汞作業第二級與第三級的界線，核心是「異常能不能用工作以外原因解釋」。乙基汞第二級的例子：肝功能或血液學檢查異常、泌尿道感染造成的血尿或蛋白尿、肺部感染等造成的肺纖維化、飲食因素造成的血中汞偏高、自覺聽力減退或眼科視力視野檢查異常但可由非職業因素解釋。第三級：過敏性蕁麻疹或刺激性皮膚炎、口內炎、神經精神異常（運動失調、意向性顫抖、平衡障礙）、蛋白尿≥100 mg/dL、聽力視力或視野異常、明顯體重減輕，且血汞≥10.0 μg/dL 或無法由工作以外原因解釋。肝功能異常不是乙基汞的特徵性危害（法定項目也沒有肝功能檢查），合併脂肪肝更是典型的非職業解釋，故列第二級。「工作後才發生」是時序性的線索，平衡功能異常與視野缺損都是有機汞的目標器官效應，無法排除工作相關時列第三級。115-02 回憶正解即「脂肪肝合併肝功能異常列第三級」為錯誤。","dispute":"","review":{"key_points":["乙基汞第二級例：==脂肪肝等肝功能異常==、血液學異常、泌尿道感染血尿蛋白尿、飲食造成血汞偏高","第三級：皮膚炎、口內炎、神經精神異常（運動失調、平衡障礙）、蛋白尿 ≥100、視野／聽力異常、體重減輕、血汞 ≥10 μg/dL","「工作後才發生」＝時序性線索，指向第三級以上","乙基汞法定項目沒有肝功能檢查"],"refs":[{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"異常項目可由工作以外的原因解釋，如肝功能或血液學檢查"},{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"血中汞濃度≥ 10.0 μg /dL"},{"src":"26_乙基汞作業管理分級參考","file":"_ref/分級指引/26_乙基汞作業管理分級參考.txt","quote":"視野狹窄或聽力減退等症狀"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q12","q":"有關 1-溴丙烷作業之健康管理分級與異常項目之對照，下列何者錯誤？","options":["缺鐵性貧血：第二級管理","甲狀腺功能低下所引起之多發性神經病變：第三級管理","工作後才發生之刺激性接觸性皮膚炎：第三級管理","工作後才發生之神經病變：第三級管理"],"answer":1,"recon":"full","src":["115-02"],"optexp":["**正確**：溴丙烷法定項目含血液常規（血球比容、血色素、紅血球數、血小板數、白血球數）；缺鐵性貧血可由非職業因素解釋且大致（>50%）排除職業原因→指引第二級。","**錯誤（本題答案）**：指引第二級明列「如糖尿病所引起之多發神經病變」為可由其他非職業性因素解釋的例子；甲狀腺功能低下引起的多發性神經病變同理是第二級，不是第三級。","**正確**：第三級 1.1：異常項目符合溴丙烷作業健康危害表現，如暴露部位出現接觸性皮膚炎；工作後才發生者無法由工作以外原因解釋時列第三級。","**正確**：第三級 1.1「暴露後才發生之神經病變」，須鑑別糖尿病、頭部外傷、代謝性腦病變、腦血管疾病及鉛、有機磷、二硫化碳、丙烯醯胺、正己烷等其他神經毒物。"],"explanation":"本題考 1-溴丙烷作業分級指引，重點是第二級「非職業原因＋大致排除職業原因」的表述。溴丙烷（PEL-TWA 0.5 ppm、皮，ACGIH TLV 0.1 ppm）的危害以中樞及末梢神經病變為主：肢體麻木刺痛、走路困難、自覺聽力異常、手部反應變慢、耳鳴、嗜睡，另有頭痛頭暈、腸胃症狀、肌肉關節痠痛、皮膚紅疹；動物有肝毒性但人體證據不明確。法定檢查項目：皮膚、肌肉骨骼及神經系統身體檢查、胸部 X 光、ALT 與 γ-GT、血液常規（含血小板）。分級：第一級—正常或輕度異常一年內不需追蹤；第二級—異常如糖尿病所引起之多發神經病變，可由其他非職業性因素解釋且大致（可能性>50%）排除職業性原因；第三級—暴露部位接觸性皮膚炎、暴露後才發生之神經病變等，無法由工作以外原因解釋或未提供環測紀錄，輔助基準八小時時量平均>0.05 ppm；第四級—有急慢性暴露事實且時序合理、有溴丙烷引起之症狀、身體檢查符合接觸性皮膚炎或四肢肌肉萎縮無力、反射降低等神經學異常，或 X 光／肝功能／血液異常無法以非職業因素解釋。附表一溴丙烷作業門檻是混合物重量比超過 5%。","dispute":"","review":{"key_points":["溴丙烷第二級：異常可由非職業因素解釋且==大致（>50%）排除職業原因==，例：糖尿病多發神經病變、甲狀腺功能低下神經病變、缺鐵性貧血","第三級：暴露部位==接觸性皮膚炎==、==暴露後才發生之神經病變==；輔助基準 TWA >0.05 ppm","溴丙烷 PEL-TWA ==0.5 ppm==（皮）；附表一門檻重量比 >5%","法定項目：ALT、γ-GT、血液常規含血小板、胸部 X 光"],"refs":[{"src":"27_溴丙烷作業管理分級參考","file":"_ref/分級指引/27_溴丙烷作業管理分級參考.txt","quote":"如糖尿病所引起之多發神經病變"},{"src":"27_溴丙烷作業管理分級參考","file":"_ref/分級指引/27_溴丙烷作業管理分級參考.txt","quote":"異常項目可由其他非職業性因素解釋，且大致\n（可能性>50%）排除職業性原因"},{"src":"27_溴丙烷作業管理分級參考","file":"_ref/分級指引/27_溴丙烷作業管理分級參考.txt","quote":"如暴露部位出現接觸性皮膚炎，暴露後"}],"note_ref":"三、各作業分級門檻與案例"}},{"qid":"c02q13","q":"噪音作業勞工特殊健康檢查發現聽力損失，經醫師判定為慢性中耳炎所致，應列為第幾級管理？","options":["第一級","第二級","第三級","第四級"],"answer":1,"recon":"full","src":["115-02"],"optexp":["**錯誤**：第一級是無異常或異常不需追蹤；本例有聽力損失的異常發現，且屬需追蹤與配工考量的狀況。","**正確（本題答案）**：指引噪音第二級 2.：異常項目可由工作以外的原因解釋，例如經醫師判定為中耳炎、藥物或外傷引起之非職業性聽力損失；慢性中耳炎所致者即為此類。","**錯誤**：第三級是符合噪音作業健康危害表現（4K／6K 凹陷≥40 dB 等）且相關性無法確定；本例已由醫師判定為中耳炎所致，相關性已確定為無關。","**錯誤**：第四級是
